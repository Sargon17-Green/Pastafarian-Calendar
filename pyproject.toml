[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pastafari-calendar-python"
version = "0.1.0-stage1"
description = "Makarna Canavarı takvim motorunun Python başlangıç aşaması"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
