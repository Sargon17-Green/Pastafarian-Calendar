services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PASTAFARI_REDIS_URL: redis://redis:6379
      PASTAFARI_CORS_ORIGIN: "*"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

volumes:
  redis-data:
