services:
  - type: web
    name: pastafari-celeritas-api
    runtime: docker
    repo: https://github.com/Sargon17-Green/Pastafarian-Calendar
    branch: Celeritas-per-Sepulcra
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: PASTAFARI_CORS_ORIGINS
        value: https://bwtbdyqtmsprytgydym-cpu.github.io
      - key: PASTAFARI_CORS_ALLOW_NULL_ORIGIN
        value: "1"
