      - name: Fetch exactly two historical Ada native source blobs for read-only month-weave audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY' | tee evidence/v156-two-historical-ada-sources.log
          import base64,json,os,urllib.request,urllib.parse,sys
          from pathlib import Path
          sys.path.insert(0,"soak/runner")
          from soak_ada_month_family_divergence_v156 import SOURCE_LOCKS,blob_sha
          root=Path(os.environ["RUNNER_TEMP"])/"soak-v151-pinned-sources"
          for key in ("ADA-TELUGU","ADA-WEAVING"):
              spec=SOURCE_LOCKS[key]
              url=("https://api.github.com/repos/Sargon17-Green/Pastafarian-Calendar/contents/"
                   +urllib.parse.quote(spec["path"],safe="/")
                   +"?ref="+spec["commit"])
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"soak-v156-immutable-ada-readonly-source"
              })
              with urllib.request.urlopen(req,timeout=25) as response:
                  obj=json.load(response)
              assert obj["type"]=="file" and obj["encoding"]=="base64"
              assert obj["sha"]==spec["git_blob_sha1"]
              data=base64.b64decode(obj["content"],validate=True)
              assert blob_sha(data)==spec["git_blob_sha1"]
              dest=root/"Ada-Telugu"/spec["commit"]/spec["path"]
              dest.parent.mkdir(parents=True,exist_ok=True)
              with dest.open("xb") as stream:
                  stream.write(data)
              print("V156_VERIFIED_ADA_HISTORICAL_SOURCE_GIT_BLOB",key,spec["git_blob_sha1"],len(data))
          print("V156_ORIGINAL_CALENDAR_FUNCTION_EXECUTIONS=0")
          print("V156_NO_NATIVE_COMPILER_OR_ALGORITHM_RUNS")
          PY
