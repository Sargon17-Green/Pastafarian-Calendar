name: MATLAB Stage 55 BigInt Difference Native Regression

on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tests/test_stage55_bigint_difference.m'
      - 'src/+pastafari/WholeMonthWeavingFamilyPolynomial.m'
      - '.github/workflows/matlab-stage55-bigint-difference-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-stage55-bigint-difference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-native-regression:
    name: MATLAB R2026a / BigInt near-edge subtraction regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Set up native MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a

      # MATLAB CLI on hosted runners has no standalone license. The
      # MathWorks action provisions the runner-compatible license context.
      - name: Run focused MATLAB regression with original native log
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src');
            if ~exist('logs','dir'), mkdir('logs'); end;
            diary('logs/STAGE_55_BIGINT_DIFFERENCE_NATIVE.log');
            try;
              fprintf('MATLAB_NATIVE_VERSION=%s\n',version);
              r=runtests('tests/test_stage55_bigint_difference.m');
              disp(r);
              assert(~isempty(r) && all([r.Passed]),'Stage55:BigIntDifferenceFailed');
              disp('STAGE55_BIGINT_DIFFERENCE_NATIVE_PASS');
              diary off;
            catch ME;
              disp(getReport(ME,'extended'));
              diary off;
              rethrow(ME);
            end

      - name: Preserve native output on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-bigint-difference-native-${{ github.run_id }}
          path: logs/STAGE_55_BIGINT_DIFFERENCE_NATIVE.log
          if-no-files-found: warn
          retention-days: 30
