name: MATLAB Stage55 Nineteenth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_nineteenth_native.m'
      - 'tools/stage55_after19_interval_five_fields.py'
      - '.github/workflows/matlab-stage55-nineteenth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-nineteenth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  nineteenth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER18 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-eighteenth-day-differential
          run-id: 41356854339
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER18
        run: |
          echo '0502fe42ee03cd07fa12df779f72898aa5a160d11815c077c0c71ce3685cedd3  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_18.json' | sha256sum -c -
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native nineteenth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_nineteenth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after19_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_18.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_19.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_NINETEENTH_PYTHON.log
          grep '^STAGE55_NINETEENTH_ROW ' logs/STAGE55_NINETEENTH_PYTHON.log > logs/STAGE55_NINETEENTH_PYTHON_ROW.txt
          grep '^STAGE55_NINETEENTH_ROW ' logs/STAGE55_NINETEENTH_NATIVE.log > logs/STAGE55_NINETEENTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_NINETEENTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_NINETEENTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_NINETEENTH_PYTHON_ROW.txt logs/STAGE55_NINETEENTH_NATIVE_ROW.txt
          expected="STAGE55_NINETEENTH_ROW POSITION=19 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=19 MONTH_INDEX=38 MONTH_DAY=1"
          grep -Fqx "$expected" logs/STAGE55_NINETEENTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_NINETEENTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_19.json | tee logs/STAGE55_NINETEENTH_DIGEST.txt
          echo 'STAGE55_NINETEENTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-nineteenth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_18.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_19.json
            logs/STAGE55_NINETEENTH_NATIVE.log
            logs/STAGE55_NINETEENTH_PYTHON.log
            logs/STAGE55_NINETEENTH_PYTHON_ROW.txt
            logs/STAGE55_NINETEENTH_NATIVE_ROW.txt
            logs/STAGE55_NINETEENTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
