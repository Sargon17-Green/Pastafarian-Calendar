name: Soak v218 TypeScript distinct weaving source models (zero F)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v218-typescript-lineage-model.yml
permissions:
  contents: read
  actions: read
jobs:
  static-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify original historical roster and v217 result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0d25a5271479cd43455ef8f12acef1c974f5da42"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v218-typescript-lineage-model.yml"
          mkdir -p evidence
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/14618673805/zip > evidence/v131.zip
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15221217758/zip > evidence/v217.zip
          echo "383241ca5002fd28dbdf62c239090b7fa557b42dca4350deaef8cfd955ba86c2  evidence/v131.zip" | sha256sum -c -
          echo "fd2479106145ff0b7597b441c10af79c6a5dff1a43ca4e0e2be5322377ee5ec6  evidence/v217.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,zipfile,subprocess
          from pathlib import Path
          def load(p,suffix):
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  n=[n for n in z.namelist() if n.endswith(suffix)]
                  assert len(n)==1
                  return json.loads(z.read(n[0]))
          v=load("evidence/v217.zip","result.json")
          assert (v["vectors"],v["states"],v["existing_transitions"],v["opening_transitions"],v["mismatches"])==(89,2682,3550,1324,0)
          assert v["sealed_H_table_recurrence_assumed_for_bridge_not_extracted"] and not v["soak_dispatch_authorized"]
          r=load("evidence/v131.zip","v131-lineage-screen.json")
          rows={x["record_id"]:x for x in r["records"]}
          ref="cc3a613e3b80ba082e5cdb2c7a5d756c7e707df0"
          repo="Sargon17-Green/Pastafarian-Calendar"
          pins={
              "src/postStage55FinalDate.ts":"7ef0f98664f6b65da4018055c3cea2edbfaba338",
              "test/normativeOracle.ts":"67490019de374ed2c60315e4a8c40dc81775052e",
              "src/patch24ScalableNativeWeaving.ts":"e58c991a486c26487ac8f393ced13b67d4bac2f1",
              "src/patch24ScalableUnrank.ts":"b6277997e206c8b7a18d2df807d67147bbe1dc9f",
              "src/discovery24LegacyDailyMonths.ts":"2f1f52f6a6a5d152cfc162e134498978b361480d"}
          inventory={}
          for p,h in pins.items():
              b=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/{repo}/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\x00"+b).hexdigest()==h
              inventory[p]={"blob":h,"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}
              Path("evidence",Path(p).name+".source.txt").write_bytes(b)
          for rid in ["MARATHI-TS","REF-52"]:
              row=rows[rid]
              assert row["historical_head_commit"]==ref
              p=row["observed_source_path"]
              assert inventory[p]["blob"]==row["git_blob_sha1"] and inventory[p]["sha256"]==row["source_sha256"]
          def check(p,anchors):
              s=Path("evidence",p+".source.txt").read_text()
              assert all(a in s for a in anchors),(p,[a for a in anchors if a not in s])
          check("postStage55FinalDate.ts",['import { Patch24ScalableFullHandler } from "./patch24ScalableNativeWeaving.ts"','new Patch24ScalableFullHandler(d24)','return observeProductionCalendarDate(calculationDay,targetDay).date'])
          check("patch24ScalableNativeWeaving.ts",['from "./patch24ScalableUnrank.ts"','new ScalableLegalWeavingUnrank(old.lengths)'])
          check("patch24ScalableUnrank.ts",['private lastFirst(a:number)','n[q]=prefix*bin','sum+=dist[k]!*bin','B*=C(Number(S)-1,r-1)','return B*this.factor(opened,Number(S))','const ways=this.suffix(left,nextOpen,nextClose)'])
          check("normativeOracle.ts",['state.remaining.join(",")','total += countState(applyWeaveMove(state, j, lengths))','const block = countState(next)','export function weavingFamily'])
          Path("evidence/source-pins.json").write_text(json.dumps(inventory,indent=2)+"\n")
          PY
      - name: Compare independent remaining-state census with translated suffix-distribution model
        run: |
          set -euo pipefail
          ulimit -v 524288
          timeout -k 5s 120s python3 - <<'PY'
          from itertools import product
          from functools import lru_cache
          from math import comb
          import json
          from pathlib import Path
          vectors=states=trans=0
          for m in (3,4):
              for L in product(range(4,7),repeat=m):
                  if sum(L)>20:continue
                  vectors+=1
                  @lru_cache(None)
                  def dist(a):
                      p=[1];s=0
                      for h in reversed(L[a:]):
                          n=[0]*(s+2);pre=0;bn=comb(s+h-2,h-2)
                          for q in range(1,s+2):
                              pre+=p[q-1] if q-1<len(p) else 0
                              n[q]=pre*bn
                              nn=s-q+h-1
                              if nn>h-2:
                                  assert bn*(nn-h+2)%nn==0
                                  bn=bn*(nn-h+2)//nn
                              else:bn=0
                          p=n;s+=h
                      return tuple(p[s+1-k] if s+1-k<len(p) else 0 for k in range(1,s+1))
                  @lru_cache(None)
                  def fac(a,S):
                      return 1 if a==m else sum(v*comb(S+k-1,S) for k,v in enumerate(dist(a),1))
                  def count(r,o,c):
                      S=0;B=1
                      for x in r[c:o]:
                          S+=x;B*=comb(S-1,x-1)
                      return B*fac(o,S)
                  @lru_cache(None)
                  def brute(r,o,c):
                      global states,trans
                      states+=1
                      if not any(r):
                          assert count(r,o,c)==1
                          return 1
                      total=0
                      for i,n in enumerate(r):
                          if not n or (n==L[i] and i!=o) or (n==1 and i!=c):continue
                          x=list(r);x[i]-=1;trans+=1
                          total+=brute(tuple(x),o+(n==L[i]),c+(n==1))
                      assert total==count(r,o,c),(L,r,o,c,total,count(r,o,c))
                      return total
                  brute(L,0,0)
          assert (vectors,states,trans)==(77,20545,58153)
          out={"schema":"SOAK_V218_TYPESCRIPT_WEAVE_SOURCE_MODELS/1","historical_head":"cc3a613e3b80ba082e5cdb2c7a5d756c7e707df0","source_roster_records":["MARATHI-TS","REF-52"],"production_model":"REVERSED_LAST_FIRST_DISTRIBUTION_BINOMIAL_TRANSFORM","reference_model":"FULL_REMAINING_VECTOR_MEMOIZED_CENSUS","structurally_distinct_counting_implementations":True,"not_proof_of_independent_origin":True,"model_only":True,"vectors":vectors,"states":states,"transitions":trans,"mismatches":0,"original_ts_executions":0,"native_date_calls":0,"full_dependency_closure_verified":False,"whole_year_credit":0,"admitted_engines":0,"soak_dispatch_authorized":False,"main_auth_js_status":"UNRESOLVED_SEALED_COUNT_UNRANK","main_shared_weave_records_verified":9}
          Path("evidence/result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v218-typescript-model-${{ github.run_id }}
          path: evidence/
          retention-days: 90
