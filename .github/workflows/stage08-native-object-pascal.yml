name: Stage 9 Native Object Pascal - stone snapshot patch
on:
  push:
    branches:
      - 'Object-Pascal\+Português'
    paths:
      - 'src/**'
      - 'test/stage09_stone_snapshot_probe.pas'
      - 'test/Stage09SeededLegacy.pas'
      - 'test/build_and_run_stage09_stone_snapshot.sh'
      - 'docs/stage08_stone_snapshot_preflight.js'
      - 'docs/stage08_stone_snapshot_verify.py'
      - '.github/workflows/stage08-native-object-pascal.yml'
permissions:
  contents: read
jobs:
  stage09-native-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FPC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fp-compiler
      - name: Production GREEN and isolated seeded legacy RED
        run: bash test/build_and_run_stage09_stone_snapshot.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage09-stone-snapshot-evidence
          path: evidence/stage09/
          if-no-files-found: error
          retention-days: 30
