name: Soak v221 Elixir shared table and dual order lineage (zero F)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v221-elixir-lineage-model.yml
permissions:
  contents: read
  actions: read
jobs:
  static-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind historical source and prior receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c96604e6cde1ee798308277d464ecbb6cfaa9c59"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v221-elixir-lineage-model.yml"
          mkdir -p evidence
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/14618673805/zip > evidence/v131.zip
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15222137624/zip > evidence/v220.zip
          echo "383241ca5002fd28dbdf62c239090b7fa557b42dca4350deaef8cfd955ba86c2  evidence/v131.zip" | sha256sum -c -
          echo "7d1afd1e742651119962c2b0581d325fd8885feaf6c9ffd406f1e3cffd298c2f  evidence/v220.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,zipfile,subprocess
          from pathlib import Path
          def load(p,suffix):
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  n=[n for n in z.namelist() if n.endswith(suffix)]
                  assert len(n)==1
                  return json.loads(z.read(n[0]))
          prior=load("evidence/v220.zip","result.json")
          assert (prior["vectors"],prior["states"],prior["transitions"],prior["rank_checks"],prior["shift_equivalence_checks"],prior["mismatches"])==(310,13338,29095,3632,1904,0)
          assert prior["model_only"] and not prior["soak_dispatch_authorized"]
          rows={x["record_id"]:x for x in load("evidence/v131.zip","v131-lineage-screen.json")["records"]}
          ref="748319ac9b83e9c7fa6c0fc85372c858b5e76eb9"
          repo="Sargon17-Green/Pastafarian-Calendar"
          base="lib/pastafari_calendar_elixir_vietnamese/monster/"
          pins={"lib/pastafari_calendar_elixir_vietnamese.ex":"a2cc063bb853a823fdcfbf38f814dce918d363d3","test/support/normative_reference.ex":"be1638f46b2190d617af0378a61b077bda10bf32",base+"dispatcher.ex":"6b291e445d9039278cb19bdb542913a8283a1312",base+"calendar_date_manager.ex":"b0008c16508b61c42ae2e16831a760a8114e7568",base+"month_name_index_manager.ex":"e99cb35fa1311c19dbce9444aa4cfa9ec7c0bc82",base+"month_weaving_manager.ex":"391a31d26f7602f1e077c1d471c263aa4c4c38be",base+"month_weaving_order_patch.ex":"550d1c81cd05abce43c072dfb92b39b4adb47c1c",base+"legacy_descending_weaving_order.ex":"0246586eef4ca014f6a304b618169dbe3bd8bd25",base+"weaving_combinatorics.ex":"ea0b5a30015a34bee20174d45c9b80bd52b0b1cb"}
          inv={}
          for p,h in pins.items():
              b=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/{repo}/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\x00"+b).hexdigest()==h
              inv[p]={"blob":h,"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}
              Path("evidence",Path(p).name+".source.txt").write_bytes(b)
          for rid in ["VIET-ELIXIR","REF-14"]:
              row=rows[rid]
              assert row["historical_head_commit"]==ref
              p=row["observed_source_path"]
              assert inv[p]["blob"]==row["git_blob_sha1"] and inv[p]["sha256"]==row["source_sha256"]
          def check(p,anchors):
              s=Path("evidence",p+".source.txt").read_text()
              assert all(a in s for a in anchors),(p,[a for a in anchors if a not in s])
          check("pastafari_calendar_elixir_vietnamese.ex",["Dispatcher.calendar_date(calculation_day, target_day)"])
          check("dispatcher.ex",["CalendarDateManager.date(calculation_day, target_day)"])
          check("calendar_date_manager.ex",["MonthNameIndexManager.diagnose(c, t)","Enum.at(parent.month_weaving, offset)"])
          check("month_name_index_manager.ex",["MonthWeavingManager.diagnose(c, t)"])
          check("month_weaving_manager.ex",["WeavingCombinatorics.count(lengths)","MonthWeavingOrderPatch.diagnose(lengths, rank)","month_weaving: patch.corrected_weaving"])
          check("month_weaving_order_patch.ex",["LegacyDescendingWeavingOrder.labels(length(lengths))","Enum.reverse(historical_order)","WeavingCombinatorics.unrank_in_orders(lengths, rank"])
          check("legacy_descending_weaving_order.ex",["Enum.reverse(Enum.to_list(1..count))"])
          check("weaving_combinatorics.ex",["value = sum + coefficient * elem(next_table, suffix + days - 1)","div(coefficient * (suffix + days - 1), suffix + 1)","current = {numerator * prefix, denominator * (prefix - 1)}","div(base * numerator, denominator)","factor = if local_index == 1, do: left, else: left - 1","updated_base = div(base * factor * numerator, available_days * denominator)","completions = new_base * elem(suffix_table, new_days)","Enum.map(orders, fn order ->"])
          check("normative_reference.ex",["defp weave_count({remaining, _opened, _closed} = state, original, memo)","weave_count(next, original, m0)","{block, memo2} = weave_count(next, original, memo)"])
          Path("evidence/source-pins.json").write_text(json.dumps(inv,indent=2)+"\n")
          PY
      - name: Exhaustively compare translated branch counts and dual order ranks
        run: |
          set -euo pipefail
          ulimit -v 524288
          timeout -k 5s 120s python3 - <<'PY'
          from itertools import product
          from functools import lru_cache
          from math import comb
          import json
          from pathlib import Path
          vectors=states=transitions=ranks=0
          for m in (1,2,3,4):
           for L in product(range(4,7),repeat=m):
            if sum(L)>18:continue
            vectors+=1
            @lru_cache(None)
            def F(o,S):
             if o==m:return 1
             n=L[o]
             return sum(comb(k+n-2,n-2)*F(o+1,k+n-1) for k in range(S+1))
            def base(a):
             S=0; B=1
             for n in a:B*=comb(S+n-1,n-1);S+=n
             return B
            def children(r,o,c,reverse=False):
             for i in (range(m-1,-1,-1) if reverse else range(m)):
              n=r[i]
              if not n or (n==L[i] and i!=o) or (n==1 and i!=c):continue
              x=list(r);x[i]-=1
              yield i,(tuple(x),o+(n==L[i]),c+(n==1))
            def block(r,o,c,i):
             a=r[c:o];S=sum(a);B=base(a);n=r[i]
             if i==o:return B*comb(S+n-2,n-2)*F(o+1,S+n-1)
             num=den=1
             if n==1:
              p=1
              for k in a[1:]:num*=p;den*=p+k-1;p+=k
             else:
              p=0
              for j,k in enumerate(a):
               p+=k
               if j>=max(1,i-c):num*=p;den*=p-1
              num*=n if i==c else n-1;den*=S
             assert B*num%den==0
             return B*num//den*F(o,S-1)
            @lru_cache(None)
            def brute(r,o,c):
             global states,transitions
             states+=1
             if not any(r):return 1
             v=0
             for i,child in children(r,o,c):
              b=brute(*child);assert b==block(r,o,c,i);transitions+=1;v+=b
             assert v==base(r[c:o])*F(o,sum(r[c:o]))
             return v
            total=brute(L,0,0)
            def unrank(rank,reverse,model):
             state=(L,0,0);out=[]
             while any(state[0]):
              for i,child in children(*state,reverse):
               b=block(*state,i) if model else brute(*child)
               if rank>b:rank-=b
               else:out.append(i+1);state=child;break
              else:raise AssertionError('rank')
             assert rank==1
             return out
            for rank in sorted({1,(total+1)//2,total}):
             for reverse in (False,True):
              assert unrank(rank,reverse,True)==unrank(rank,reverse,False)
              ranks+=1
             assert unrank(rank,True,True)==unrank(total+1-rank,False,True)
          assert (vectors,states,transitions,ranks)==(54,7149,18202,312)
          out={"schema":"SOAK_V221_ELIXIR_LINEAGE_MODELS/1","historical_head":"748319ac9b83e9c7fa6c0fc85372c858b5e76eb9","source_roster_records":["VIET-ELIXIR","REF-14"],"production_model":"OPENED_TOKEN_SUFFIX_RECURRENCE_WITH_EXACT_BRANCH_RATIOS","reference_model":"FULL_REMAINING_VECTOR_MEMOIZED_CENSUS","production_dual_order_unrank_uses_same_table":True,"production_date_projects_corrected_order":True,"vectors":vectors,"states":states,"transitions":transitions,"rank_checks":ranks,"reverse_rank_identity_checks":ranks//2,"mismatches":0,"evidence_class":"SOURCE_STATIC_AND_SYNTHETIC","model_only":True,"original_elixir_executions":0,"native_date_calls":0,"whole_year_credit":0,"full_dependency_closure_verified":False,"admitted_engines":0,"soak_dispatch_authorized":False}
          Path("evidence/result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v221-elixir-model-${{ github.run_id }}
          path: evidence/
          retention-days: 90
