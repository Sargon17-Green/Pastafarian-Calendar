name: MATLAB Stage55 Thirtieth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_thirtieth_native.m'
      - 'tools/stage55_after30_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-thirtieth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-thirtieth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  thirtieth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER29 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-twentyninth-day-differential
          run-id: 41869630478
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER29
        run: |
          echo 'c17768995e2cb2939e160cb24ff5e6291750c80887353c79a01f997a0559d592  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_29.json' | sha256sum -c -
      - name: Preflight AFTER30 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after30_interval_five_fields.py
          grep -Fqx 'PIN = "c17768995e2cb2939e160cb24ff5e6291750c80887353c79a01f997a0559d592"' tools/stage55_after30_interval_five_fields.py
          python3 -m py_compile tools/stage55_after30_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native thirtieth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_thirtieth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after30_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_29.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_30.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_THIRTIETH_PYTHON.log
          grep '^STAGE55_THIRTIETH_ROW ' logs/STAGE55_THIRTIETH_PYTHON.log > logs/STAGE55_THIRTIETH_PYTHON_ROW.txt
          grep '^STAGE55_THIRTIETH_ROW ' logs/STAGE55_THIRTIETH_NATIVE.log > logs/STAGE55_THIRTIETH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_THIRTIETH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_THIRTIETH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_THIRTIETH_PYTHON_ROW.txt logs/STAGE55_THIRTIETH_NATIVE_ROW.txt
          expected="STAGE55_THIRTIETH_ROW POSITION=30 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=30 MONTH_INDEX=43 MONTH_DAY=1"
          grep -Fqx "$expected" logs/STAGE55_THIRTIETH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_THIRTIETH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_30.json | tee logs/STAGE55_THIRTIETH_DIGEST.txt
          echo 'STAGE55_THIRTIETH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-thirtieth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_29.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_30.json
            logs/STAGE55_THIRTIETH_NATIVE.log
            logs/STAGE55_THIRTIETH_PYTHON.log
            logs/STAGE55_THIRTIETH_PYTHON_ROW.txt
            logs/STAGE55_THIRTIETH_NATIVE_ROW.txt
            logs/STAGE55_THIRTIETH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
