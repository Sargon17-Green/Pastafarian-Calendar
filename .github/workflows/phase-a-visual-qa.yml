name: Phase A visual QA (temporary)

on:
  pull_request:
    branches:
      - 'JavaScript+Interlingue'
    paths:
      - 'browser/**'
      - '.github/workflows/phase-a-visual-qa.yml'

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Build browser artifact
        run: |
          set -euo pipefail
          node tests/verify-stage-01.js
          node tests/browser-interface-all.js
          node scripts/build-browser.js
          node tests/browser-built-artifacts.js

      - name: Install Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-a-qa"
          cd "$RUNNER_TEMP/phase-a-qa"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run visual assertions and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          cd browser/dist
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/phase-a-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          cd "$RUNNER_TEMP/phase-a-qa"
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out, { recursive: true });
          const base = 'http://127.0.0.1:4173/';

          const profiles = [
            {name:'desktop1440', width:1440, height:1000, mobile:false},
            {name:'tablet1024', width:1024, height:1366, mobile:false},
            {name:'tablet800', width:800, height:1280, mobile:false},
            {name:'tablet768', width:768, height:1024, mobile:false},
            {name:'mobile390', width:390, height:844, mobile:true},
            {name:'mobile320', width:320, height:740, mobile:true},
          ];

          async function waitReady(page) {
            await page.waitForFunction(() => {
              const host = document.querySelector('pastafari-date');
              const cal = host?.shadowRoot?.querySelector('.calendar');
              return !!cal && !cal.hasAttribute('data-state');
            }, null, {timeout:180000});
            await page.waitForTimeout(1000);
          }

          async function phaseAInfo(page) {
            return page.evaluate(() => {
              const host = document.querySelector('pastafari-date');
              const s = host.shadowRoot;
              const viewport = s.querySelector('.viewport');
              const current = s.querySelector('.day[aria-current="date"]');
              const heading = s.querySelector('.cutlet-heading');
              const grid = s.querySelector('.cutlet-grid');
              const vr = viewport.getBoundingClientRect();
              const cr = current?.getBoundingClientRect();
              const hr = heading?.getBoundingClientRect();
              return {
                bodyClientWidth: document.documentElement.clientWidth,
                bodyScrollWidth: document.documentElement.scrollWidth,
                viewportClientWidth: viewport.clientWidth,
                viewportScrollWidth: viewport.scrollWidth,
                current: cr ? {left:cr.left,right:cr.right,top:cr.top,bottom:cr.bottom} : null,
                viewportRect: {left:vr.left,right:vr.right,top:vr.top,bottom:vr.bottom},
                heading: hr ? {left:hr.left,right:hr.right,top:hr.top,bottom:hr.bottom} : null,
                headingPosition: heading ? getComputedStyle(heading).position : null,
                gridTemplate: grid ? getComputedStyle(grid).gridTemplateColumns : null,
              };
            });
          }

          function assert(cond, msg) {
            if (!cond) throw new Error(msg);
          }

          async function assertReadyLayout(browser, p) {
            const ctx = await browser.newContext({
              viewport:{width:p.width,height:p.height},
              locale:'he-IL', isMobile:p.mobile, hasTouch:p.mobile, deviceScaleFactor:1
            });
            const page = await ctx.newPage();
            await page.goto(base, {waitUntil:'domcontentloaded'});
            await waitReady(page);
            const info = await phaseAInfo(page);
            assert(info.bodyScrollWidth <= info.bodyClientWidth + 1, p.name+': body horizontal overflow');
            assert(info.viewportScrollWidth <= info.viewportClientWidth + 1, p.name+': calendar horizontal overflow');
            assert(info.headingPosition === 'static', p.name+': cutlet heading still sticky');
            if (info.current) {
              assert(info.current.left >= info.viewportRect.left - 1, p.name+': current card clipped on inline start');
              assert(info.current.right <= info.viewportRect.right + 1, p.name+': current card clipped on inline end');
            }
            fs.writeFileSync(path.join(out,p.name+'__info.json'),JSON.stringify(info,null,2));
            await page.screenshot({path:path.join(out,p.name+'__ready.png'),fullPage:true});
            const viewport = page.locator('.viewport');
            await viewport.screenshot({path:path.join(out,p.name+'__calendar.png')});
            await ctx.close();
          }

          async function assertBidi(browser, code, locale) {
            const ctx = await browser.newContext({viewport:{width:390,height:844},locale});
            const page = await ctx.newPage();
            await page.goto(base, {waitUntil:'domcontentloaded'});
            await waitReady(page);
            await page.locator('.language-selector').selectOption(code);
            await page.waitForTimeout(300);
            const data = await page.evaluate(() => {
              const s=document.querySelector('pastafari-date').shadowRoot;
              const context=s.querySelector('.beacon-context');
              const iso=[...context.querySelectorAll('bdi.iso-date')].map(x=>({
                text:x.textContent,dir:x.getAttribute('dir'),whiteSpace:getComputedStyle(x).whiteSpace
              }));
              return {text:context.innerText, iso, dir:document.querySelector('pastafari-date').getAttribute('dir')};
            });
            assert(data.iso.length === 2, code+': expected two isolated ISO nodes');
            for (const iso of data.iso) {
              assert(/^\d{4}-\d{2}-\d{2}$/.test(iso.text), code+': malformed ISO '+iso.text);
              assert(iso.dir === 'ltr', code+': ISO lacks dir=ltr');
              assert(iso.whiteSpace === 'nowrap', code+': ISO can wrap internally');
            }
            fs.writeFileSync(path.join(out,'bidi_'+code+'.json'),JSON.stringify(data,null,2));
            await page.screenshot({path:path.join(out,'bidi_'+code+'.png'),fullPage:true});
            await ctx.close();
          }

          async function assertError(browser,p) {
            const ctx=await browser.newContext({
              viewport:{width:p.width,height:p.height},locale:'he-IL',
              isMobile:p.mobile,hasTouch:p.mobile,deviceScaleFactor:1
            });
            const page=await ctx.newPage();
            await page.route('**/pastafari-worker.js*', r=>r.abort());
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>{
              const s=document.querySelector('pastafari-date')?.shadowRoot;
              return s?.querySelector('.calendar')?.getAttribute('data-state')==='error';
            },null,{timeout:90000});
            const info=await page.evaluate(()=>{
              const s=document.querySelector('pastafari-date').shadowRoot;
              const box=s.querySelector('.overlay.error');
              const title=s.querySelector('.error-title');
              const msg=s.querySelector('.error-message');
              const button=s.querySelector('.retry-button');
              const r=n=>{const x=n.getBoundingClientRect();return {top:x.top,bottom:x.bottom,left:x.left,right:x.right};};
              return {box:r(box),title:r(title),message:r(msg),button:r(button)};
            });
            assert(info.title.top <= info.message.top, p.name+': error title after message');
            assert(info.message.top <= info.button.top, p.name+': retry appears before message');
            assert(info.button.left >= info.box.left-1 && info.button.right <= info.box.right+1,p.name+': retry outside error block');
            fs.writeFileSync(path.join(out,p.name+'__error_info.json'),JSON.stringify(info,null,2));
            await page.screenshot({path:path.join(out,p.name+'__error.png'),fullPage:true});
            await ctx.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles) await assertReadyLayout(browser,p);
            await assertBidi(browser,'he','he-IL');
            await assertBidi(browser,'ar','ar');
            await assertError(browser,profiles[0]);
            await assertError(browser,profiles[4]);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.js

      - name: Upload Phase A screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-visual-qa
          path: ${{ runner.temp }}/phase-a-qa/out
          if-no-files-found: warn
          retention-days: 14
