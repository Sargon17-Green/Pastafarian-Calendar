name: MATLAB Stage55 Thirty-Third Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_thirty_third_native.m'
      - 'tools/stage55_after33_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-thirty-third-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-thirty-third-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  thirty-third-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER32 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-thirty-second-day-differential
          run-id: 41979140995
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER32
        run: |
          echo '6bdba0c1d5d7e786ee3eaa25ef0a6b939655ea2d134efe5bd534f0e02cd88265  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_32.json' | sha256sum -c -
      - name: Preflight AFTER33 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after33_interval_five_fields.py
          grep -Fqx 'PIN = "6bdba0c1d5d7e786ee3eaa25ef0a6b939655ea2d134efe5bd534f0e02cd88265"' tools/stage55_after33_interval_five_fields.py
          python3 -m py_compile tools/stage55_after33_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native thirty-third-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_thirty_third_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after33_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_32.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_33.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_THIRTY_THIRD_PYTHON.log
          grep '^STAGE55_THIRTY_THIRD_ROW ' logs/STAGE55_THIRTY_THIRD_PYTHON.log > logs/STAGE55_THIRTY_THIRD_PYTHON_ROW.txt
          grep '^STAGE55_THIRTY_THIRD_ROW ' logs/STAGE55_THIRTY_THIRD_NATIVE.log > logs/STAGE55_THIRTY_THIRD_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_THIRTY_THIRD_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_THIRTY_THIRD_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_THIRTY_THIRD_PYTHON_ROW.txt logs/STAGE55_THIRTY_THIRD_NATIVE_ROW.txt
          expected="STAGE55_THIRTY_THIRD_ROW POSITION=33 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=33 MONTH_INDEX=6 MONTH_DAY=3"
          grep -Fqx "$expected" logs/STAGE55_THIRTY_THIRD_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_THIRTY_THIRD_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_33.json | tee logs/STAGE55_THIRTY_THIRD_DIGEST.txt
          echo 'STAGE55_THIRTY_THIRD_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-thirty-third-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_32.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_33.json
            logs/STAGE55_THIRTY_THIRD_NATIVE.log
            logs/STAGE55_THIRTY_THIRD_PYTHON.log
            logs/STAGE55_THIRTY_THIRD_PYTHON_ROW.txt
            logs/STAGE55_THIRTY_THIRD_NATIVE_ROW.txt
            logs/STAGE55_THIRTY_THIRD_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
