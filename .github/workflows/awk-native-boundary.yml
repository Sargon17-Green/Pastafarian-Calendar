name: AWK Native Boundary Regression

on:
  push:
    branches:
      - 'AWK+nynorsk'
    paths:
      - '.github/workflows/awk-native-boundary.yml'
      - 'src/bigint.awk'
      - 'src/normative_oracle.awk'
      - 'tests/awk_boundary_regression.awk'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Native AWK BigInt day counters and rank rejection
        shell: bash
        run: |
          set -euo pipefail
          awk -f src/bigint.awk -f src/normative_oracle.awk -f tests/awk_boundary_regression.awk
