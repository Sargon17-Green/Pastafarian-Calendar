name: Kiểm thử Elixir tiếng Việt

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy cây làm việc
        uses: actions/checkout@v4
      - name: Cài Erlang và Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - name: Chạy kiểm thử phát triển
        run: mix test

  soak_stage55:
    if: github.ref == 'refs/heads/Elixir+tiếng-Việt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lấy mã Stage55
        uses: actions/checkout@v4
      - name: Cài Erlang và Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - name: Kiểm tra chịu tải 47 tháng và 5778 ngày
        shell: bash
        run: |
          set -o pipefail
          mix test qa/elixir_vietnamese_soak.exs --timeout 240000 --max-cases 1 2>&1 | tee elixir_vietnamese_soak.log
      - name: Lưu log kể cả khi lỗi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-soak-native-${{ github.sha }}
          path: elixir_vietnamese_soak.log
          retention-days: 30

  differential_python_turkce:
    if: github.ref == 'refs/heads/Elixir+tiếng-Việt'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: [foundation, modern_base, modern_forward, modern_previous, year_max]
    steps:
      - name: Lấy Elixir tiếng Việt theo HEAD được kiểm tra
        uses: actions/checkout@v4
        with:
          path: .
      - name: Lấy Python độc lập tại SHA đã khóa
        uses: actions/checkout@v4
        with:
          ref: 'b3501b4296403bc33cb36f81a763269e5af97523'
          path: python-peer
          persist-credentials: false
      - name: Cài Elixir và Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: So sánh năm thành phần chuẩn từ hai chương trình độc lập
        env:
          DIFF_GROUP: ${{ matrix.group }}
        run: python3 -u qa/compare_elixir_python.py
      - name: Lưu chứng cứ hai nhánh dù có sai lệch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elixir-python-differential-${{ github.sha }}-${{ matrix.group }}
          path: differential-evidence/
          retention-days: 30
