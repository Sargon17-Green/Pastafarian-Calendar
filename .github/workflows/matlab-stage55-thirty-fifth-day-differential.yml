name: MATLAB Stage55 Thirty-Fifth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_thirty_fifth_native.m'
      - 'tools/stage55_after35_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-thirty-fifth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-thirty-fifth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  thirty-fifth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER34 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-thirty-fourth-day-differential
          run-id: 42177272042
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER34
        run: |
          echo '2cddd7c7aa8ce3a0bb6fc1cc083c56655e256945f22496926ec43db3f60d8e6e  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_34.json' | sha256sum -c -
      - name: Preflight AFTER35 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after35_interval_five_fields.py
          grep -Fqx 'PIN = "2cddd7c7aa8ce3a0bb6fc1cc083c56655e256945f22496926ec43db3f60d8e6e"' tools/stage55_after35_interval_five_fields.py
          python3 -m py_compile tools/stage55_after35_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native thirty-fifth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_thirty_fifth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after35_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_34.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_35.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_THIRTY_FIFTH_PYTHON.log
          grep '^STAGE55_THIRTY_FIFTH_ROW ' logs/STAGE55_THIRTY_FIFTH_PYTHON.log > logs/STAGE55_THIRTY_FIFTH_PYTHON_ROW.txt
          grep '^STAGE55_THIRTY_FIFTH_ROW ' logs/STAGE55_THIRTY_FIFTH_NATIVE.log > logs/STAGE55_THIRTY_FIFTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_THIRTY_FIFTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_THIRTY_FIFTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_THIRTY_FIFTH_PYTHON_ROW.txt logs/STAGE55_THIRTY_FIFTH_NATIVE_ROW.txt
          expected="STAGE55_THIRTY_FIFTH_ROW POSITION=35 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=35 MONTH_INDEX=37 MONTH_DAY=2"
          grep -Fqx "$expected" logs/STAGE55_THIRTY_FIFTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_THIRTY_FIFTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_35.json | tee logs/STAGE55_THIRTY_FIFTH_DIGEST.txt
          echo 'STAGE55_THIRTY_FIFTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-thirty-fifth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_34.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_35.json
            logs/STAGE55_THIRTY_FIFTH_NATIVE.log
            logs/STAGE55_THIRTY_FIFTH_PYTHON.log
            logs/STAGE55_THIRTY_FIFTH_PYTHON_ROW.txt
            logs/STAGE55_THIRTY_FIFTH_NATIVE_ROW.txt
            logs/STAGE55_THIRTY_FIFTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
