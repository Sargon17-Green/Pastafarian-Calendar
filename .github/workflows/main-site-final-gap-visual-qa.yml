name: Main-site temporary gap visual QA

on:
  push:
    branches:
      - fix/main-site-phase-a-2026-09-25

jobs:
  gap-visual-qa:
    name: Reverse edge states + advanced calculation visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Build browser artifact
        run: |
          set -euo pipefail
          node scripts/build-browser.js
          node tests/browser-built-artifacts.js

      - name: Prepare Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/main-site-gap-qa"
          cd "$RUNNER_TEMP/main-site-gap-qa"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run focused visual QA
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/main-site-gap-site"
          rm -rf "$SITE"
          mkdir -p "$SITE/dist"
          cp browser/dist/index.html "$SITE/index.html"
          cp browser/dist/pastafari-date.js "$SITE/dist/pastafari-date.js"
          cp browser/dist/pastafari-worker.js "$SITE/dist/pastafari-worker.js"
          cp browser/dist/pastafari-date.mjs "$SITE/dist/pastafari-date.mjs"
          cp browser/dist/build-id.txt "$SITE/dist/build-id.txt"
          cp -R browser/dist/reverse-engine "$SITE/dist/reverse-engine"

          cd "$SITE"
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/main-site-gap-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          cd "$RUNNER_TEMP/main-site-gap-qa"
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out, { recursive: true });
          const base = 'http://127.0.0.1:4173/';

          function assert(v, m) { if (!v) throw new Error(m); }
          async function ready(page, timeout = 180000) {
            await page.waitForFunction(() => {
              const s = document.querySelector('pastafari-date')?.shadowRoot;
              const c = s?.querySelector('.calendar');
              return !!c && !c.hasAttribute('data-state');
            }, null, { timeout });
            await page.waitForTimeout(250);
          }
          async function setLang(page, lang) {
            await page.evaluate(lang => document.querySelector('pastafari-date').setAttribute('lang', lang), lang);
            await page.waitForTimeout(100);
          }
          async function contextPage(browser, width, height, locale, mobile) {
            const ctx = await browser.newContext({
              viewport: { width, height }, locale, isMobile: mobile, hasTouch: mobile, deviceScaleFactor: 1
            });
            return { ctx, page: await ctx.newPage() };
          }
          async function openReverse(page) {
            await page.locator('pastafari-date').locator('.reverse-open').click();
            await page.waitForTimeout(100);
            assert(await page.locator('pastafari-date').locator('.reverse-dialog').getAttribute('open') !== null,
              'reverse dialog did not open');
          }
          async function assertNoHorizontalOverflow(page, label) {
            const m = await page.evaluate(() => {
              const s = document.querySelector('pastafari-date').shadowRoot;
              const d = s.querySelector('.reverse-dialog');
              const r = d?.getBoundingClientRect();
              return {
                bodyCW: document.documentElement.clientWidth,
                bodySW: document.documentElement.scrollWidth,
                dialogLeft: r?.left ?? 0, dialogRight: r?.right ?? 0, vw: innerWidth
              };
            });
            assert(m.bodySW <= m.bodyCW + 1, label + ': document horizontal overflow');
            if (m.dialogRight) assert(m.dialogLeft >= -1 && m.dialogRight <= m.vw + 1, label + ': dialog overflow');
          }

          async function advancedCalculation(browser) {
            const { ctx, page } = await contextPage(browser, 1024, 1366, 'en-US', false);
            await page.goto(base, { waitUntil: 'domcontentloaded' });
            await ready(page); await setLang(page, 'en');
            await page.locator('pastafari-date').locator('.editor-link').click();
            await page.locator('pastafari-date').locator('details summary').click();
            const target = page.locator('pastafari-date').locator('input[name="target"]');
            const calc = page.locator('pastafari-date').locator('input[name="calculation"]');
            assert((await target.inputValue()).length === 10, 'advanced search target not prefilled');
            await calc.fill('2026-09-25');
            await page.screenshot({ path: path.join(out, 'advanced_calculation_open_1024_en.png'), fullPage: false });
            await page.locator('pastafari-date').locator('dialog:has(> .dialog-form) .dialog-actions .primary').click();
            await page.waitForFunction(() => !document.querySelector('pastafari-date').shadowRoot.querySelector('dialog:has(> .dialog-form)').hasAttribute('open'));
            await ready(page);
            const state = await page.evaluate(() => {
              const h = document.querySelector('pastafari-date');
              return { date: h.getAttribute('date'), calculationDate: h.getAttribute('calculation-date') };
            });
            assert(state.calculationDate === '2026-09-25', 'advanced calculation-date was not applied');
            fs.writeFileSync(path.join(out, 'advanced_calculation.json'), JSON.stringify(state, null, 2));
            await page.screenshot({ path: path.join(out, 'advanced_calculation_applied_1024_en.png'), fullPage: false });
            await ctx.close();
          }

          async function reverseNoMatch(browser) {
            const { ctx, page } = await contextPage(browser, 390, 844, 'ar', true);
            await page.route('**/reverse-engine/pastafari-constraints-client.js*', route => route.fulfill({
              status: 200,
              contentType: 'application/javascript',
              body: 'export async function solvePastafariConstraints(){return {solutions:[],complete:true,termination:"complete",scanned:0n,candidates:0n,verified:0n,stats:null};}'
            }));
            await page.goto(base, { waitUntil: 'domcontentloaded' });
            await ready(page); await setLang(page, 'ar'); await openReverse(page);
            await page.locator('pastafari-date').locator('.reverse-submit').click();
            await page.waitForFunction(() => {
              const s = document.querySelector('pastafari-date').shadowRoot;
              return !s.querySelector('.reverse-submit').disabled &&
                s.querySelector('.reverse-status').innerText.trim().length > 0 &&
                s.querySelectorAll('.reverse-result').length === 0;
            });
            const state = await page.evaluate(() => {
              const s = document.querySelector('pastafari-date').shadowRoot;
              return { text: s.querySelector('.reverse-status').innerText, kind: s.querySelector('.reverse-status').getAttribute('data-kind') };
            });
            assert(state.text.trim().length > 0 && state.kind !== 'error', 'reverse no-match state is not visible');
            await assertNoHorizontalOverflow(page, 'reverse no-match');
            fs.writeFileSync(path.join(out, 'reverse_no_match.json'), JSON.stringify(state, null, 2));
            await page.screenshot({ path: path.join(out, 'reverse_no_match_390_ar.png'), fullPage: false });
            await ctx.close();
          }

          async function reverseError(browser) {
            const { ctx, page } = await contextPage(browser, 390, 844, 'he-IL', true);
            await page.route('**/reverse-engine/pastafari-constraints-client.js*', route => route.fulfill({
              status: 200,
              contentType: 'application/javascript',
              body: 'export async function solvePastafariConstraints(){throw new Error("QA injected reverse failure");}'
            }));
            await page.goto(base, { waitUntil: 'domcontentloaded' });
            await ready(page); await setLang(page, 'he'); await openReverse(page);
            await page.locator('pastafari-date').locator('.reverse-submit').click();
            await page.waitForFunction(() => {
              const s = document.querySelector('pastafari-date').shadowRoot;
              return !s.querySelector('.reverse-submit').disabled &&
                s.querySelector('.reverse-status').getAttribute('data-kind') === 'error';
            });
            const state = await page.evaluate(() => {
              const s = document.querySelector('pastafari-date').shadowRoot;
              return { text: s.querySelector('.reverse-status').innerText, kind: s.querySelector('.reverse-status').getAttribute('data-kind') };
            });
            assert(state.text.trim().length > 0 && state.kind === 'error', 'reverse error state is not visible');
            await assertNoHorizontalOverflow(page, 'reverse error');
            fs.writeFileSync(path.join(out, 'reverse_error.json'), JSON.stringify(state, null, 2));
            await page.screenshot({ path: path.join(out, 'reverse_error_390_he.png'), fullPage: false });
            await ctx.close();
          }

          async function reverseCancel(browser) {
            const { ctx, page } = await contextPage(browser, 320, 740, 'de-DE', true);
            await page.route('**/reverse-engine/pastafari-constraints-client.js*', route => route.fulfill({
              status: 200,
              contentType: 'application/javascript',
              body: 'export async function solvePastafariConstraints(problem,options={}){return await new Promise((resolve,reject)=>{const abort=()=>{const e=new Error("Aborted");e.name="AbortError";reject(e)};if(options.signal){if(options.signal.aborted)abort();else options.signal.addEventListener("abort",abort,{once:true});}});}'
            }));
            await page.goto(base, { waitUntil: 'domcontentloaded' });
            await ready(page); await setLang(page, 'de'); await openReverse(page);
            await assertNoHorizontalOverflow(page, 'reverse cancel open');
            await page.locator('pastafari-date').locator('.reverse-submit').click();
            await page.waitForFunction(() => document.querySelector('pastafari-date').shadowRoot.querySelector('.reverse-submit').disabled);
            await page.screenshot({ path: path.join(out, 'reverse_cancel_in_progress_320_de.png'), fullPage: false });
            await page.locator('pastafari-date').locator('.reverse-cancel').click();
            await page.waitForTimeout(150);
            const state = await page.evaluate(() => {
              const s = document.querySelector('pastafari-date').shadowRoot;
              return {
                open: s.querySelector('.reverse-dialog').hasAttribute('open'),
                focusReturned: s.activeElement === s.querySelector('.reverse-open'),
                submitDisabled: s.querySelector('.reverse-submit').disabled
              };
            });
            assert(!state.open && state.focusReturned && !state.submitDisabled, 'reverse cancel did not close/abort/return focus');
            fs.writeFileSync(path.join(out, 'reverse_cancel.json'), JSON.stringify(state, null, 2));
            await page.screenshot({ path: path.join(out, 'reverse_cancelled_320_de.png'), fullPage: false });
            await ctx.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await advancedCalculation(browser);
            await reverseNoMatch(browser);
            await reverseError(browser);
            await reverseCancel(browser);
            await browser.close();
            console.log('MAIN_SITE_GAP_VISUAL_QA=PASS');
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node qa.js

      - name: Upload focused screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-site-final-gap-visual-qa
          path: ${{ runner.temp }}/main-site-gap-qa/out
          if-no-files-found: error
          retention-days: 14
