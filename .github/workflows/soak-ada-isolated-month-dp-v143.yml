name: Soak v143 isolated Ada pure-math month weaving GNAT check — no original Fct
on:
  push:
    branches:
      - qa/soak-ada-isolated-month-dp-v143
    paths:
      - 'soak/control/ada_isolated_month_dp_v143.json'
      - 'soak/ada_port_v143/**'
      - '.github/workflows/soak-ada-isolated-month-dp-v143.yml'
permissions:
  contents: read
  actions: read
jobs:
  standalone-ada-synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate v143 scope, original stop and pinned 35 golden fixtures
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY' | tee evidence/v143-preflight.log
          import json,re
          from pathlib import Path
          root=Path('soak')
          stop=json.loads((root/'control/confirmed_first_original_mismatch_dispatch_halt_v108.json').read_text())
          assert stop['decision']=='STOP_NEW_NATIVE_SOAK_DISPATCH'
          m=json.loads((root/'control/ada_isolated_month_dp_v143.json').read_text())
          assert m['schema']=='PASTAFARI_SOAK_ADA_ISOLATED_MONTH_DP_V143/1'
          assert m['purpose']=='QA_ONLY_SYNTHETIC_ADA_COMPONENT_NOT_ORIGINAL_FCT_OR_NATIVE_CONVERTER'
          assert m['scientific_gates']['STOP_NEW_NATIVE_SOAK_DISPATCH'] is True
          assert m['scientific_gates']['original_Fct_calls']==0
          assert m['scientific_gates']['original_native_converter_builds']==0
          assert m['scientific_gates']['production_Ada_patch_applied'] is False
          paths=m['isolated_code_paths']
          assert paths==['soak/ada_port_v143/legal_month_weave_dp.ads',
             'soak/ada_port_v143/legal_month_weave_dp.adb',
             'soak/ada_port_v143/test_legal_month_weave_dp.adb']
          for path in paths:
              text=Path(path).read_text(encoding='utf-8')
              withs=re.findall(r'^with\s+([^;]+);',text,re.MULTILINE)
              for source in withs:
                  assert source.strip() in (
                    'Ada.Numerics.Big_Numbers.Big_Integers',
                    'Ada.Text_IO','Legal_Month_Weave_DP'), (path,source)
              assert not re.search(r'\b(?:Normative_Oracle|Calendar_Date|Foundation_Day|Monster_Bootstrap)\b',
                 '\n'.join(x for x in text.splitlines() if not x.strip().startswith('--'))),path
          gold=json.loads((root/'control/ada_month_weave_rank_vectors_v141.json').read_text())
          assert len(gold['families'])==6
          vec=[(f,v) for f in gold['families'] for v in f['vectors']]
          assert len(vec)==35
          case_source=Path(paths[2]).read_text()
          assert len(re.findall(r'^   Check \(Month_Lengths\x27\(',case_source,re.MULTILINE))==35
          for f,v in vec:
              agg=lambda xs:', '.join(f'{i} => {x}' for i,x in enumerate(xs,1))
              one=(f"   Check (Month_Lengths'({agg(f['lengths'])}), "
                   f"{f['count']}, {v[0]},\n"
                   f"          Month_Sequence'({agg(v[1])}));")
              assert one in case_source, ('golden vector not frozen',f['lengths'],v[0])
          print('V143_ORIGINAL_NATIVE_DISPATCH_STOP_CONFIRMED')
          print('V143_35_PINNED_V141_ADA_TEST_VECTOR_LITERALS_VERIFIED')
          print('V143_NO_ORIGINAL_CALENDAR_PACKAGE_IMPORTED')
          PY
      - name: Validate read-only original source pins, issue 29 and main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/v143-source-lock.log
          import json,os
          from urllib.request import Request,urlopen
          repo=os.environ['GITHUB_REPOSITORY']
          base='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
             'Accept':'application/vnd.github+json',
             'X-GitHub-Api-Version':'2022-11-28',
             'User-Agent':'pastafari-soak-v143-source-only'}
          def get(path):
              with urlopen(Request(base+path,headers=headers),timeout=40) as r:
                  return json.load(r)
          issue=get('/issues/29')
          assert issue['state']=='open'
          assert 'CONFIRMED_ORIGINAL_SOURCE_MISMATCH' in issue['body']
          main=get('/branches/main')
          assert main['commit']['sha']=='56bc4173aae4975ded019ef5ab5a36249f1424df'
          golden=get('/contents/soak/control/ada_month_weave_rank_vectors_v141.json?ref=qa/soak-ada-isolated-month-dp-v143')
          assert golden['sha']=='180d11aa4360cf810a6be8e995d096dbc3d8ff7a'
          print('V143_ISSUE29_OPEN_MAIN_FROZEN_GOLDEN_SOURCE_SHA_PINNED')
          PY
      - name: Install GNAT only for isolated standalone synthetic QA test
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gnat-13 >/dev/null
          gnatmake --version | head -n 1 | tee evidence/v143-gnat-version.log
      - name: Compile only isolated pure combinatorial Ada QA module and run 35 golden vectors
        run: |
          set -euo pipefail
          cd soak/ada_port_v143
          gnatmake -gnat2022 -gnata -O0 -o test_legal_month_weave_dp             test_legal_month_weave_dp.adb 2>&1 | tee ../../evidence/v143-ada-build.log
          ./test_legal_month_weave_dp | tee ../../evidence/v143-ada-golden.log
          grep -Eq '^V143_ADA_ISOLATED_GOLDEN_VECTORS= *35$' ../../evidence/v143-ada-golden.log
          grep -Fx 'V143_ORIGINAL_CALENDAR_FCT_CALLS=0' ../../evidence/v143-ada-golden.log
          grep -Fx 'V143_PRODUCTION_ADA_PATCH_APPLIED=FALSE' ../../evidence/v143-ada-golden.log
          echo 'V143_GNAT_STANDALONE_ADA_35_GOLDENS_PASS' | tee ../../evidence/v143-verdict.log
          # All native output is ephemeral QA-only; never upload an executable.
          rm -f ./test_legal_month_weave_dp ./*.ali ./*.o
      - name: Upload log-only Ada evidence, not a binary or original calendar date
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-v143-standalone-ada-month-weave-35-vectors-no-original-native
          path: |
            evidence/v143-preflight.log
            evidence/v143-source-lock.log
            evidence/v143-gnat-version.log
            evidence/v143-ada-build.log
            evidence/v143-ada-golden.log
            evidence/v143-verdict.log
          if-no-files-found: warn
          retention-days: 30
