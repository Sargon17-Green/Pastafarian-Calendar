name: Soak v259 durable raw artifact and log archive v227-v258 (zero F)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v259-durable-archive-v227-v258.yml
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Lock exact QA activation and prior candidate evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/qa/issue29-gmp-complete-small-family-v198"
          test "$(git rev-parse HEAD^)" = "3d2be339f328d024118a80554d513b01863aa1b7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v259-durable-archive-v227-v258.yml"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test ! -e qa/soak/archive/v227-v258
      - name: Acquire and verify original artifacts, logs, metadata, and v232 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qa/soak/archive/v227-v258
          ulimit -v 1048576
          timeout -k 5s 1200s python3 - <<'PY'
          import hashlib,io,json,os,subprocess,zipfile
          from pathlib import Path,PurePosixPath
          root=Path("qa/soak/archive/v227-v258")
          repo=os.environ["GITHUB_REPOSITORY"]
          specs=[
            (227,46055666060,15226152462,"7242b874edd493ecdf0e4bcf30a1863baa4b6af4","success","0c53890ac61c3ee28a1b9161d0a88adfd34ef6487e04fbcde94f3f0e7b85d4ad"),
            (228,46056954343,15226758776,"8a3975d90b447bcdc40f54e8e10dd805d79eb663","success","67f2eac0b11076ffe69df980e7331f9632245ab0cd81844d77845ba0ca563fc9"),
            (229,46058071851,15227517524,"3ef8fe3c2d7e291793f27df6e4cb1f335234863d","failure","7f1ccd48fd670ab02641c79d0927c7cc6a405091b486e8e6f1b014e41214e004"),
