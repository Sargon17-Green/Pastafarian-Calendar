            (257,46145748317,15263702124,"140bbc72ad7144c5fdb428fe7f3791115a1b4fae","success","5a9e680157927e40652159ad32415d5c01934c04413ccdf003a50943a08800f2"),
            (258,46147446639,15264287237,"3d2be339f328d024118a80554d513b01863aa1b7","success","13db2c122e5e483a10f9ee0f206c84f4e1497faccb61af273cfb079101110f1b")
          ]
          failures={229,235,242}
          def sha(b): return hashlib.sha256(b).hexdigest()
          def api(path,headers=None):
              cmd=["gh","api"]
              if headers:
                  for h in headers:cmd.extend(["-H",h])
              cmd.append(f"repos/{repo}/{path}")
              return subprocess.check_output(cmd,timeout=45)
          def inspect(raw,label):
              assert 0<len(raw)<=25*1024*1024,(label,"zip size",len(raw))
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  files=[f for f in z.infolist() if not f.is_dir()]
                  assert 1<=len(files)<=5000 and sum(f.file_size for f in files)<=80*1024*1024
                  names=[f.filename for f in files]
                  assert len(names)==len(set(names)),(label,"duplicate members")
                  for n in names:
                      p=PurePosixPath(n)
                      assert not p.is_absolute() and ".." not in p.parts and "\\" not in n,(label,n)
                  assert z.testzip() is None,(label,"CRC")
                  members={f.filename:{"bytes":f.file_size,"crc32":f"{f.CRC:08x}","sha256":sha(z.read(f))} for f in files}
                  result_members=[n for n in names if PurePosixPath(n).name=="result.json"]
                  assert len(result_members)<=1,(label,result_members)
                  result=None
                  if result_members:
                      rb=z.read(result_members[0])
                      try:
                          parsed=json.loads(rb)
                          result={"path":result_members[0],"bytes":len(rb),"sha256":sha(rb),"schema":parsed.get("schema")}
                      except Exception:
                          result={"path":result_members[0],"bytes":len(rb),"sha256":sha(rb),"schema":"UNPARSEABLE"}
                  return members,result
          records={}
          for v,run,aid,head,conclusion,digest in specs:
              label=f"v{v}"
              meta=json.loads(api(f"actions/runs/{run}"))
              assert meta["id"]==run and meta["head_sha"]==head,(label,"run identity")
              assert meta["status"]=="completed" and meta["conclusion"]==conclusion,(label,meta["status"],meta["conclusion"])
              assert meta["run_attempt"]==1,(label,"attempt")
              assert (v in failures)==(conclusion=="failure"),(label,"failure inventory")
              artifact=json.loads(api(f"actions/artifacts/{aid}"))
              assert artifact["id"]==aid and artifact["workflow_run"]["id"]==run
              assert artifact["workflow_run"]["head_sha"]==head
              assert artifact["digest"]=="sha256:"+digest and not artifact["expired"]
              raw=api(f"actions/artifacts/{aid}/zip")
              assert len(raw)==artifact["size_in_bytes"] and sha(raw)==digest,(label,"artifact digest/size")
              amembers,result=inspect(raw,label+" artifact")
              (root/(label+".zip")).write_bytes(raw)
              jobs=json.loads(api(f"actions/runs/{run}/attempts/1/jobs?per_page=100"))
              assert jobs["total_count"]==len(jobs["jobs"]) and len(jobs["jobs"])>0
              assert all(j["status"]=="completed" for j in jobs["jobs"]),(label,"unfinished job")
              if conclusion=="failure":
                  assert any(j["conclusion"] in ("failure","cancelled","timed_out") for j in jobs["jobs"]),(label,"no failing job")
              lograw=api(f"actions/runs/{run}/attempts/1/logs")
              lmembers,_=inspect(lograw,label+" logs")
              (root/(label+"-logs.zip")).write_bytes(lograw)
              md={"run":meta,"artifact":artifact,"jobs":jobs}
              mb=(json.dumps(md,indent=2,sort_keys=True)+"\n").encode()
              (root/(label+"-metadata.json")).write_bytes(mb)
              records[label]={
                "run":run,"run_head":head,"run_attempt":1,"conclusion":conclusion,
                "artifact":aid,"artifact_name":artifact["name"],"artifact_bytes":len(raw),"artifact_sha256":digest,
                "artifact_members":amembers,"result_member":result,
                "log_bytes":len(lograw),"log_sha256":sha(lograw),"log_members":lmembers,
                "metadata_bytes":len(mb),"metadata_sha256":sha(mb),
                "job_ids":[j["id"] for j in jobs["jobs"]],"artifact_expiry_at_capture":artifact["expires_at"]
              }
              print("RAW_ARTIFACT_AND_LOGS_VERIFIED",label,conclusion,len(raw),len(lograw),digest,flush=True)
          source_commit="480426329465a8e7d51f7fb49ad5058a43b146bf"
          cm=json.loads(api(f"commits/{source_commit}"))
          assert cm["sha"]==source_commit and cm["parents"][0]["sha"]=="8e9ba2b7b6a01ba6eed171103d6e143564c7c7e4"
          path="qa/soak/v232_short_rejection_model.py"
          source=api(f"contents/{path}?ref={source_commit}",["Accept: application/vnd.github.raw+json"])
          blob=hashlib.sha1(b"blob "+str(len(source)).encode()+b"\0"+source).hexdigest()
          assert blob=="f935bebfe5ffaec971a4e4c32b6cfe1c64478ad6"
          (root/"v232-source.py").write_bytes(source)
          cmbytes=(json.dumps({"commit":cm,"path":path,"blob_sha1":blob,"source_bytes":len(source),"source_sha256":sha(source),"execution":"NO_ACTIONS_RUN_FOUND; source-only archived"},indent=2,sort_keys=True)+"\n").encode()
          (root/"v232-metadata.json").write_bytes(cmbytes)
          failures_found=sorted(v for v,run,aid,head,conclusion,digest in specs if conclusion=="failure")
          assert len(records)==31 and failures_found==[229,235,242]
          receipt={
            "schema":"SOAK_V259_DURABLE_ARCHIVE_V227_V258/1",
            "range":{"first":227,"last":258,"versions_with_artifacts":31,"source_only_versions":[232]},
            "source_qa_commit":"3d2be339f328d024118a80554d513b01863aa1b7",
            "records":records,
            "source_only":{"v232":{"commit":source_commit,"parent":cm["parents"][0]["sha"],"path":path,"blob_sha1":blob,"metadata_sha256":sha(cmbytes),"source_sha256":sha(source),"bytes":len(source),"actions_run":"none_found"}},
            "failed_attempts_preserved":failures_found,
            "artifact_count":31,"raw_log_count":31,"source_only_count":1,
            "native_date_calls":0,"whole_year_credit":0,"independent_new_pairs":0,
            "admitted_engines":0,"independent_algorithms_certified":0,
            "STOP_NEW_NATIVE_SOAK_DISPATCH":True
          }
          (root/"manifest.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("ARCHIVE_ACQUISITION_VERIFIED",len(records),len(failures_found),sum(x["artifact_bytes"] for x in records.values()),sum(x["log_bytes"] for x in records.values()),flush=True)
          PY
      - name: Commit only archive payload on guarded QA branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- qa/soak/archive/v227-v258/
          python3 - <<'PY'
          import subprocess
          p="qa/soak/archive/v227-v258/"
          versions=[v for v in range(227,259) if v!=232]
          expected={p+"manifest.json",p+"v232-source.py",p+"v232-metadata.json"}
          expected|={p+f"v{v}{suffix}" for v in versions for suffix in (".zip","-logs.zip","-metadata.json")}
          actual=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          assert len(expected)==96 and actual==expected,(len(actual),len(expected),actual^expected)
          PY
          git commit -m "qa(soak): preserve exact v227-v258 artifacts, raw logs, failures, and source-only v232"
          git push origin HEAD:refs/heads/qa/issue29-gmp-complete-small-family-v198
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "ARCHIVE_COMMIT=$(git rev-parse HEAD)"
      - name: Verify every committed archive byte and manifest receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          p="qa/soak/archive/v227-v258/"
          m=json.loads(subprocess.check_output(["git","show","HEAD:"+p+"manifest.json"]))
          assert m["schema"]=="SOAK_V259_DURABLE_ARCHIVE_V227_V258/1" and len(m["records"])==31
          def blob(name):return subprocess.check_output(["git","show","HEAD:"+p+name])
          for v,r in m["records"].items():
              for suffix,key in [(".zip","artifact"),("-logs.zip","log"),("-metadata.json","metadata")]:
                  b=blob(v+suffix)
                  assert len(b)==r[key+"_bytes"] and hashlib.sha256(b).hexdigest()==r[key+"_sha256"],(v,suffix)
          for name,expected in [("v232-source.py",m["source_only"]["v232"]["source_sha256"]),("v232-metadata.json",m["source_only"]["v232"]["metadata_sha256"])]:
              assert hashlib.sha256(blob(name)).hexdigest()==expected,name
          print("DURABLE_ARCHIVE_PASS",len(m["records"]),m["failed_attempts_preserved"],flush=True)
          PY
