name: MATLAB Stage55 Twenty-Fifth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_twentyfifth_native.m'
      - 'tools/stage55_after25_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-twentyfifth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-twentyfifth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  twentyfifth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER24 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-twentyfourth-day-differential
          run-id: 41651304112
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER24
        run: |
          echo '7534b4b1bd2e038cd5e2864faa1e100931b004dab79055acf2dc746ac9883f3c  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_24.json' | sha256sum -c -
      - name: Preflight AFTER25 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after25_interval_five_fields.py
          grep -Fqx 'PIN = "7534b4b1bd2e038cd5e2864faa1e100931b004dab79055acf2dc746ac9883f3c"' tools/stage55_after25_interval_five_fields.py
          python3 -m py_compile tools/stage55_after25_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native twenty-fifth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_twentyfifth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after25_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_24.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_25.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_TWENTYFIFTH_PYTHON.log
          grep '^STAGE55_TWENTYFIFTH_ROW ' logs/STAGE55_TWENTYFIFTH_PYTHON.log > logs/STAGE55_TWENTYFIFTH_PYTHON_ROW.txt
          grep '^STAGE55_TWENTYFIFTH_ROW ' logs/STAGE55_TWENTYFIFTH_NATIVE.log > logs/STAGE55_TWENTYFIFTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_TWENTYFIFTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_TWENTYFIFTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_TWENTYFIFTH_PYTHON_ROW.txt logs/STAGE55_TWENTYFIFTH_NATIVE_ROW.txt
          expected="STAGE55_TWENTYFIFTH_ROW POSITION=25 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=25 MONTH_INDEX=27 MONTH_DAY=1"
          grep -Fqx "$expected" logs/STAGE55_TWENTYFIFTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_TWENTYFIFTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_25.json | tee logs/STAGE55_TWENTYFIFTH_DIGEST.txt
          echo 'STAGE55_TWENTYFIFTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-twentyfifth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_24.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_25.json
            logs/STAGE55_TWENTYFIFTH_NATIVE.log
            logs/STAGE55_TWENTYFIFTH_PYTHON.log
            logs/STAGE55_TWENTYFIFTH_PYTHON_ROW.txt
            logs/STAGE55_TWENTYFIFTH_NATIVE_ROW.txt
            logs/STAGE55_TWENTYFIFTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
