name: Issue29 v184 source-locked full GMP Count-Rank-Unrank on legal lengths; NO F
on:
  push:
    branches:
      - qa/issue29-ada-gmp-chain-legal-lengths-v184
    paths:
      - '.github/workflows/issue29-v184-gmp-legal-chain.yml'
permissions:
  contents: read
concurrency:
  group: issue29-v184-legal-chain-one-shot
  cancel-in-progress: false
jobs:
  isolated-legal-count-rank-unrank:
    if: >-
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/qa/issue29-ada-gmp-chain-legal-lengths-v184'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source-locked corrected Ada QA; never calendar F
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source/dispatch-halt locks and build independent Python oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B -m py_compile tests/issue29_v184_chain_oracle.py
          python3 -B tests/issue29_v184_chain_oracle.py preflight | tee evidence/preflight-verdict.txt
          grep -Fx V184_INDEPENDENT_LEGAL_COUNT_RANK_UNRANK_REFERENCE_READY_ZERO_F evidence/preflight-verdict.txt
          test ! -e evidence/RUN_STARTED_ONCE
      - name: Install GNAT 13 and GNATCOLL GMP bounded native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > evidence/apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gnat-13 gprbuild libgnatcoll-gmp-dev binutils > evidence/apt-install.log 2>&1
          gprbuild --version > evidence/gprbuild-version.txt
          dpkg-query -W gnat-13 libgnatcoll-gmp-dev libgmp10 > evidence/packages.txt
      - name: Build isolated GMP-only Count/Rank/Unrank and reject original F linkage
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 180s gprbuild -p -j2 -P issue29_v184_chain.gpr > evidence/build.stdout 2> evidence/build.stderr
          test -x bin_v184/issue29_v184_chain_tests
          if nm bin_v184/issue29_v184_chain_tests | grep -iq normative_oracle; then
            echo V184_FORBIDDEN_CALENDAR_DATE_LINKED >&2
            exit 1
          fi
          echo V184_ISOLATED_GMP_CHAIN_LINKED_ZERO_CALENDAR_F > evidence/build-verdict.txt
      - name: Execute one bounded native GMP chain run (13 legal families, 78 streams)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v184_chain_oracle.py run-once | tee evidence/native-verdict.txt
          grep -Fx V184_NATIVE_LEGAL_GMP_COUNT_RANK_UNRANK_CHAIN_PASS_ZERO_F evidence/native-verdict.txt
      - name: Hash all evidence including any failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence')
          m={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
             for p in sorted(root.iterdir()) if p.is_file() and p.name!='members.sha256.json'}
          (root/'members.sha256.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload bounded source-locked GMP-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v184-legal-length-gmp-count-rank-unrank-no-F
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
