name: Soak v217 verify legacy rank mathematical bridge (synthetic, zero F)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v217-legacy-rank-mathematical-bridge.yml
permissions:
  contents: read
  actions: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind prior receipts and historical readable rank source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cd87b5a63cf6f4226a218cc54d775134d786cc88"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v217-legacy-rank-mathematical-bridge.yml"
          mkdir -p evidence
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15220401365/zip > evidence/v216.zip
          echo "3f2925984681b7cc5ef207a7bafe3cc73ef030d414b79460cb4828c271140950  evidence/v216.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          with zipfile.ZipFile("evidence/v216.zip") as z:
              assert z.testzip() is None
              n=[n for n in z.namelist() if n.endswith("result.json")]
              assert len(n)==1
              old=json.loads(z.read(n[0]))
          assert old["schema"]=="SOAK_V216_NESTED_SOURCE_INVENTORY/1"
          assert old["sha256"]=="de4ef2f1a6be8e002a2d304e933df67a64dc013344437775baa5babe22b259fc"
          assert not old["effective_algorithm_reviewed"] and old["native_date_calls"]==0
          ref="cc2cf0b422757a5e7c33218ce30cffa8f99c6786"
          repo="Sargon17-Green/pastafari-calendar"
          pins={
            "browser/month-weaving-domain-detour.js":"f6b95731713a2a3180d5ac8d52783e07f665fc9d",
            "artifacts/update-14-month-weaving-report.md":"7421dac46b3f8646b0e798caf5b3dd4585634284",
            "artifacts/update-14-month-weaving-summary.json":"5cad75e2c4cd94bc5f1d1d035eaa379eef223bc5",
            "verification/update14/month-weaving-reference.mjs":"59127db4627a05fb702635792b4786403d96c417",
            "implementations/python/pastafari_calendar/core.py":"e99f6a6b2413bed2f972ef24360a466df59e34cd"}
          witnesses={}
          for p,h in pins.items():
              b=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/{repo}/contents/{p}?ref={ref}"],timeout=60)
              assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\x00"+b).hexdigest()==h
              witnesses[p]={"blob":h,"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}
              Path("evidence",Path(p).name+".source.txt").write_bytes(b)
          s=Path("evidence/month-weaving-domain-detour.js.source.txt").read_text()
          anchors=["ways *= comb(n + activeTotal - 1, activeTotal)","counter.h?.[highOpened + 1]","row?.[activeTotal + 1]","ways *= cell","return legacyUnrank.call(this, rank)","!this.lengths.includes(1)"]
          assert all(a in s for a in anchors)
          p=Path("evidence/core.py.source.txt").read_text()
          assert all(a in p for a in ["cumulative += weight * following[month_length + r]","weight = weight * (month_length + r - 1) // (r + 1)","suffix_pm1[offset + 1] * (prefix[offset] - 1)","(remaining_for_month - 1) * suffix_p[offset]","active_total * suffix_pm1[offset]"])
          report=Path("evidence/update-14-month-weaving-report.md.source.txt").read_text()
          assert "The sealed chronicle owns the old jagged" in report
          assert "Domains without " in report and "original count/unrank path" in report
          Path("evidence/source-pins.json").write_text(json.dumps(witnesses,indent=2)+"\n")
          PY
      - name: Exhaustive small-domain independent combinatorial bridge
        run: |
          set -euo pipefail
          ulimit -v 524288
          timeout -k 5s 120s python3 - <<'PY'
          from itertools import product
          from math import comb
          from functools import lru_cache
          from fractions import Fraction
          import json
          from pathlib import Path
          # The readable JS detour recomputes this base product.
          # Compare the shared family's incremental ratio to that product.
          def base(a):
              b=1
              s=0
              for n in a:
                  assert n>0
                  b*=comb(s+n-1,s)
                  s+=n
              return b
          cases=states=existing=opening=0
          for m in range(1,5):
              for L in product(range(2,5),repeat=m):
                  if sum(L)>12:
                      continue
                  cases+=1
                  @lru_cache(None)
                  def H(i,q):
                      if i==m-1:
                          return 1
                      n=L[i+1]
                      return sum(comb(n+r-2,r)*H(i+1,n+r) for r in range(q))
                  @lru_cache(None)
                  def brute(rem,hi,lo):
                      global states,existing,opening
                      states+=1
                      a=rem[lo:hi+1]
                      A=sum(a)
                      B=base(a)
                      ans=B*H(hi,A+1) if hi>=0 else H(0,L[0])
                      if not sum(rem):
                          assert ans==1
                          return 1
                      total=0
                      # Independently traverse every legal next label.
                      # No DP formula is used to determine the legal branches.
                      for k in range(lo,min(m,hi+2)):
                          if k<=hi and rem[k]==1 and k!=lo:
                              continue
                          r=list(rem)
                          r[k]-=1
                          h=max(hi,k)
                          l=lo+(r[k]==0)
                          if k<=hi:
                              existing+=1
                              p=[sum(a[:j+1]) for j in range(len(a))]
                              off=k-lo
                              if rem[k]>1:
                                  ratio=Fraction(rem[k]-1,A)
                                  first=off
                              else:
                                  ratio=Fraction(1,A)
                                  first=off+1
                              for x in p[first:]:
                                  ratio*=Fraction(x,x-1)
                              assert B*ratio==base(tuple(r[l:h+1]))
                          else:
                              opening+=1
                              new=L[k]-1
                              assert B*comb(A+new-1,new-1)==base(tuple(r[l:h+1]))
                          total+=brute(tuple(r),h,l)
                      assert total==ans,(L,rem,hi,lo,total,ans)
                      return total
                  assert brute(L,-1,0)==H(0,L[0])
          assert (cases,states,existing,opening)==(89,2682,3550,1324)
          out={"schema":"SOAK_V217_LEGACY_RANK_MATHEMATICAL_BRIDGE/1","evidence_class":"SYNTHETIC_AND_SOURCE_STATIC","length_domain":[2,4],"month_count_domain":[1,4],"max_total_length":12,"vectors":cases,"states":states,"existing_transitions":existing,"opening_transitions":opening,"mismatches":0,"readable_rank_base_product_equivalent_to_shared_incremental_ratio_in_tested_states":True,"sealed_H_table_recurrence_assumed_for_bridge_not_extracted":True,"shared_weave_source_records_verified":9,"tenth_record_status":"VISIBLE_RANK_BRIDGE_EQUIVALENCE_ONLY_SEALED_COUNT_UNRANK_UNRESOLVED","original_module_imports":0,"original_payload_executions":0,"native_date_calls":0,"whole_year_credit":0,"soak_dispatch_authorized":False}
          Path("evidence/result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v217-rank-bridge-${{ github.run_id }}
          path: evidence/
          retention-days: 90
