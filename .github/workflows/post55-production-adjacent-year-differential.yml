name: Kotlin production adjacent year navigation versus independent unseeded geometry
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/Post55ProductionAdjacentYearProbe.kt'
      - 'soak/audit_production_adjacent_year_navigation.py'
      - 'soak/test_audit_production_adjacent_year_navigation.py'
      - '.github/workflows/post55-production-adjacent-year-differential.yml'
      - 'soak/independent_year_geometry_oracle.py'
      - 'soak/independent_sauce_oracle.py'
      - 'soak/independent_date_combinatorics.py'
      - 'src/main/kotlin/pastafari/ProductionYearNavigator.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-adjacent-year-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact branch, SHA, and production budget
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'maxGateAbsIndex: Int = 8192' src/main/kotlin/pastafari/ProductionYearNavigator.kt
          grep -Fq 'maxGateAbsIndex = MAX_GATE_ABS_INDEX' soak/Post55ProductionAdjacentYearProbe.kt
          grep -Fq 'private const val MAX_GATE_ABS_INDEX = 8192' soak/Post55ProductionAdjacentYearProbe.kt
          echo 'SOURCE_SHA_AND_8192_GATE_LIMIT_LOCK_GREEN'
      - name: Run synthetic mutation contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m py_compile soak/audit_production_adjacent_year_navigation.py soak/test_audit_production_adjacent_year_navigation.py
          python3 -m unittest discover -s soak -p 'test_audit_production_adjacent_year_navigation.py' -v 2>&1 | tee evidence/adjacent-year-unit.log
      - name: Install pinned Kotlin 1.9.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip' \
            -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile actual production and adjacent-year probe
        shell: bash
        run: |
          set -euo pipefail
          kotlinc src/main/kotlin/pastafari/*.kt soak/Post55ProductionAdjacentYearProbe.kt \
            -include-runtime -d "$RUNNER_TEMP/adjacent-year-probe.jar"
          test -s "$RUNNER_TEMP/adjacent-year-probe.jar"
          echo 'PRODUCTION_ADJACENT_YEAR_PROBE_COMPILED_GREEN'
      - name: Compare real production gates and adjacent year transitions
        shell: bash
        run: |
          set -euo pipefail
          python3 soak/audit_production_adjacent_year_navigation.py \
            --jar "$RUNNER_TEMP/adjacent-year-probe.jar" \
            --timeout-seconds 780 \
            --evidence evidence/adjacent-year-navigation.json \
            2>&1 | tee evidence/adjacent-year-navigation.log
      - name: Preserve adjacent-year evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-cymraeg-adjacent-year-navigation
          path: evidence/adjacent-year-*
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
