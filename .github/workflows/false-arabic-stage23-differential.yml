name: FALSE Arabic Stage23 instrumented epoch differential
on:
  push:
    branches: ['FALSE\+العربية']
    paths:
      - '.github/workflows/false-arabic-stage23-differential.yml'
      - 'tools/stage23_differential.py'
permissions:
  contents: read
jobs:
  stage23-differential:
    if: github.ref == 'refs/heads/FALSE+العربية'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      SOURCE_PIN: ${{ github.sha }}
      RUNTIME_PIN: eb3135565a8670cced3f6bbca4dbf7b014c45634
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact original interpreter
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/stage23_differential upstream
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/ianjray/false.git
          git -C upstream fetch --no-tags --depth=1 origin "$RUNTIME_PIN" > evidence/stage23_differential/runtime_fetch.log 2>&1
          git -C upstream rev-parse FETCH_HEAD > evidence/stage23_differential/runtime_observed.txt
          test "$(cat evidence/stage23_differential/runtime_observed.txt)" = "$RUNTIME_PIN"
          git -C upstream checkout -q --detach "$RUNTIME_PIN"
          test -z "$(git -C upstream status --porcelain)"
          gcc --version > evidence/stage23_differential/compiler_version.txt
          gcc -Wall -Wextra -O2 -D_GNU_SOURCE -Iupstream -Iupstream/src upstream/interpreter.c upstream/src/false.c upstream/utils/file.c upstream/src/stack.c upstream/src/slice.c upstream/src/storage.c upstream/src/token.c -o upstream/false_int > evidence/stage23_differential/compiler_stdout.txt 2> evidence/stage23_differential/compiler_stderr.txt
          printf '%s' '4 7 1ø.%%' > evidence/stage23_differential/unicode_pick.false
          timeout 15s upstream/false_int -e evidence/stage23_differential/unicode_pick.false > evidence/stage23_differential/unicode_pick.stdout 2> evidence/stage23_differential/unicode_pick.stderr
          test "$(cat evidence/stage23_differential/unicode_pick.stdout)" = '4'
      - name: Generate independent oracle and execute instrumented epoch only
        run: |
          python3 -m py_compile tools/stage23_measure.py tools/stage23_differential.py
          python3 tools/stage23_differential.py --prepare-only
          python3 tools/stage23_differential.py
      - name: Preserve exact programs, source, output and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: false-arabic-stage23-differential
          path: evidence/stage23_differential/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
