name: Befunge QA31CY physical trace Native
on:
  push:
    branches: [qa-befunge98-stage1-order-isolation-20261008]
    paths:
      - '.github/workflows/befunge-qa31cy-physical-trace.yml'
      - 'qa/qa31cy_physical_trace_native.py'
      - 'qa/qa31cy_physical_trace_audit.py'
permissions:
  contents: read
jobs:
  native-multi-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Execute independent bounded QA31CY Native corpus
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qa31cy"
          mkdir -p "$out/results"
          curl --max-time 60 -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$out/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $out/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
          git rev-parse HEAD > "$out/results/head_sha.txt"
          set +e
          timeout --kill-after=10s 1200s docker run --rm --memory=1g --cpus=1 -e PYFUNGE_NO_PSYCO=1 -e QA_HEAD_SHA="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/work:ro" -v "$out/results:/results" \
            -v "$out/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              python -c "compile(open(\"qa/qa31cy_physical_trace_native.py\").read(), \"qa31cy\", \"exec\")"
              python -u qa/qa31cy_physical_trace_native.py src/work_counts.b98 /results /tmp/PyFunge-0.5-rc2.tar.gz
            ' 2>&1 | tee "$out/results/native.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$out/results/exit_code.txt"
          if [ "$rc" -eq 0 ]; then
            set +e
            timeout --kill-after=5s 120s python3 qa/qa31cy_physical_trace_audit.py src/work_counts.b98 "$out/results" > "$out/results/independent.json" 2> "$out/results/independent.log"
            audit_rc=$?
            set -e
            printf '%s\n' "$audit_rc" > "$out/results/audit_exit_code.txt"
            if [ "$audit_rc" -ne 0 ]; then rc=$audit_rc; fi
          fi
          (cd "$out/results" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          test "$rc" -eq 0
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="PASS" and r["head_sha"]==sys.argv[2]' "$out/results/qa31cy_receipt.json" "$GITHUB_SHA"
      - name: Retain QA31CY raw receipts, logs and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: befunge-qa31cy-physical-trace
          path: ${{ runner.temp }}/qa31cy/results/
          retention-days: 30
