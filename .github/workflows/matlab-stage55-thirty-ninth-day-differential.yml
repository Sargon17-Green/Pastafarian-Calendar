name: MATLAB Stage55 Thirty-Ninth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_thirty_ninth_native.m'
      - 'tools/stage55_after39_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-thirty-ninth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-thirty-ninth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  thirty-ninth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER38 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-thirty-eighth-day-differential
          run-id: 43613864899
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER38
        run: |
          echo '44f9b8a00d434591c599f67eb22e4312c090cac8c5ed0225eba7acd41a340cd2  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_38.json' | sha256sum -c -
      - name: Preflight AFTER39 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after39_interval_five_fields.py
          grep -Fqx 'PIN = "44f9b8a00d434591c599f67eb22e4312c090cac8c5ed0225eba7acd41a340cd2"' tools/stage55_after39_interval_five_fields.py
          python3 -m py_compile tools/stage55_after39_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native thirty-ninth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_thirty_ninth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after39_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_38.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_39.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_THIRTY_NINTH_PYTHON.log
          grep '^STAGE55_THIRTY_NINTH_ROW ' logs/STAGE55_THIRTY_NINTH_PYTHON.log > logs/STAGE55_THIRTY_NINTH_PYTHON_ROW.txt
          grep '^STAGE55_THIRTY_NINTH_ROW ' logs/STAGE55_THIRTY_NINTH_NATIVE.log > logs/STAGE55_THIRTY_NINTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_THIRTY_NINTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_THIRTY_NINTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_THIRTY_NINTH_PYTHON_ROW.txt logs/STAGE55_THIRTY_NINTH_NATIVE_ROW.txt
          expected="STAGE55_THIRTY_NINTH_ROW POSITION=39 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=39 MONTH_INDEX=41 MONTH_DAY=2"
          grep -Fqx "$expected" logs/STAGE55_THIRTY_NINTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_THIRTY_NINTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_39.json | tee logs/STAGE55_THIRTY_NINTH_DIGEST.txt
          echo 'STAGE55_THIRTY_NINTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-thirty-ninth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_38.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_39.json
            logs/STAGE55_THIRTY_NINTH_NATIVE.log
            logs/STAGE55_THIRTY_NINTH_PYTHON.log
            logs/STAGE55_THIRTY_NINTH_PYTHON_ROW.txt
            logs/STAGE55_THIRTY_NINTH_NATIVE_ROW.txt
            logs/STAGE55_THIRTY_NINTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
