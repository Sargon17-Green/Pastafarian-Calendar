name: MATLAB Stage55 Twentieth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_twentieth_native.m'
      - 'tools/stage55_after20_interval_five_fields.py'
      - '.github/workflows/matlab-stage55-twentieth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-twentieth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  twentieth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER19 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-nineteenth-day-differential
          run-id: 41503025825
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER19
        run: |
          echo '53a244b51b9439090efb828142fb3f1ea0f6c620f24d6a2fa396d73b23d71aa4  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_19.json' | sha256sum -c -
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native twentieth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_twentieth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after20_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_19.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_20.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_TWENTIETH_PYTHON.log
          grep '^STAGE55_TWENTIETH_ROW ' logs/STAGE55_TWENTIETH_PYTHON.log > logs/STAGE55_TWENTIETH_PYTHON_ROW.txt
          grep '^STAGE55_TWENTIETH_ROW ' logs/STAGE55_TWENTIETH_NATIVE.log > logs/STAGE55_TWENTIETH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_TWENTIETH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_TWENTIETH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_TWENTIETH_PYTHON_ROW.txt logs/STAGE55_TWENTIETH_NATIVE_ROW.txt
          expected="STAGE55_TWENTIETH_ROW POSITION=20 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=20 MONTH_INDEX=38 MONTH_DAY=2"
          grep -Fqx "$expected" logs/STAGE55_TWENTIETH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_TWENTIETH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_20.json | tee logs/STAGE55_TWENTIETH_DIGEST.txt
          echo 'STAGE55_TWENTIETH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-twentieth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_19.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_20.json
            logs/STAGE55_TWENTIETH_NATIVE.log
            logs/STAGE55_TWENTIETH_PYTHON.log
            logs/STAGE55_TWENTIETH_PYTHON_ROW.txt
            logs/STAGE55_TWENTIETH_NATIVE_ROW.txt
            logs/STAGE55_TWENTIETH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
