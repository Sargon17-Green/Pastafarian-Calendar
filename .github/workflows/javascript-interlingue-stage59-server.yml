name: JavaScript + Interlingue — Stage 59 server cache

on:
  push:
    branches:
      - JavaScript+Interlingue
    paths:
      - 'server/**'
      - 'tests/server-stage59-*.js'
      - 'src/index.js'
      - '.github/workflows/javascript-interlingue-stage59-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javascript-interlingue-stage59-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/server-stage59-all.js
      - run: node tests/server-stage59-real-contract.js

  real-cache-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/server-stage59-real-benchmark.js --run-heavy
