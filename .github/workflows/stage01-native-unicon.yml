name: Stage 1 Native Unicon (Kannada)

on:
  push:
    branches:
      - 'Unicon+ಕನ್ನಡ'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unicon-kn-stage01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage01-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Install native compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential git

      - name: Build genuine Unicon compiler (not Debian input method)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-logs
          # Fetch the exact compiler revision so native results are reproducible.
          git init "$RUNNER_TEMP/unicon-src" > native-logs/clone.log 2>&1
          git -C "$RUNNER_TEMP/unicon-src" remote add origin https://github.com/uniconproject/unicon.git
          git -C "$RUNNER_TEMP/unicon-src" fetch --depth 1 origin fc06212d351972280a1bb6b701e79089bed08cb5 >> native-logs/clone.log 2>&1
          git -C "$RUNNER_TEMP/unicon-src" checkout --detach FETCH_HEAD >> native-logs/clone.log 2>&1
          git -C "$RUNNER_TEMP/unicon-src" rev-parse HEAD > native-logs/compiler-commit.txt
          test "$(cat native-logs/compiler-commit.txt)" = "fc06212d351972280a1bb6b701e79089bed08cb5"
          printf '%s\n' "$GITHUB_SHA" > native-logs/calendar-commit.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (
            cd "$RUNNER_TEMP/unicon-src"
            ./configure --disable-graphics
          ) > native-logs/configure.log 2>&1
          make -C "$RUNNER_TEMP/unicon-src" -j2 > native-logs/make.log 2>&1
          test -x "$RUNNER_TEMP/unicon-src/bin/unicon"

      - name: Run Stage 1 Native suite
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/unicon-src/bin:$PATH"
          command -v unicon | tee native-logs/compiler-path.txt
          sh ./run_stage01.sh > native-logs/stage01.log 2>&1
          cat native-logs/stage01.log
          grep -Fxq PASS native-logs/stage01.log

      - name: Preserve build and test logs on all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unicon-kn-stage01-native-logs
          path: native-logs/
          if-no-files-found: warn
