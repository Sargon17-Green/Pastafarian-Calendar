name: Assembly Sahidic Stage56 first-day regression

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-first-day:
    if: github.ref == 'refs/heads/x86-64-Assembly+ϯⲙⲉⲧⲣⲉⲙⲛ̀ⲭⲏⲙⲓ'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Verify permanent scar detour is present
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/production/stage54_integration.s)" = \
            "c86c4e888e39b1d3f4680b49c98252ee40cd6fa6"
          grep -A3 -B3 -n 'jmp \.Ls54ss_correct' src/production/stage54_integration.s

      - name: Build current production route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          as --64 -o build/arena.o src/runtime/arena.s
          as --64 -o build/bigint.o src/runtime/bigint.s
          as --64 -o build/bootstrap.o src/production/bootstrap.s
          as --64 -o build/catalog.o src/catalog/source_language_catalog.s
          as --64 -o build/stage54_integration.o src/production/stage54_integration.s
          as --64 -o build/stage56_bowlsum_corrective.o src/production/stage56_bowlsum_corrective.s

      - name: Prove first-day regression witnesses
        shell: bash
        run: |
          set -euo pipefail
          cat > build/firstday_witness.s <<'ASM'
          .intel_syntax noprefix
          .equ RES_YEAR,0
          .equ RES_CUTLET_NAME,8
          .equ RES_DAY_IN_CUTLET,16
          .equ RES_MONTH_NAME,24
          .equ RES_DAY_IN_MONTH,32

          .ifndef CASE
          .set CASE,1
          .endif

          .if CASE == 1
          .equ C_DAY,-15055670
          .equ T_DAY,-15055670
          .equ E_YEAR,5000
          .equ E_CUTLET,10
          .equ E_DCUT,1
          .equ E_MONTH,3
          .equ E_DMONTH,1
          .elseif CASE == 2
          .equ C_DAY,-15055672
          .equ T_DAY,-15055670
          .equ E_YEAR,5000
          .equ E_CUTLET,3
          .equ E_DCUT,1
          .equ E_MONTH,3
          .equ E_DMONTH,96
          .else
          .error "CASE must be 1 or 2"
          .endif

          .section .rodata
          ok_msg: .ascii "PASS\n"
          ok_len = . - ok_msg
          bad_msg: .ascii "MISMATCH\n"
          bad_len = . - bad_msg

          .section .text
          .global _start
          .extern calendarDateSpaghetti
          .extern bi_eq_u64
          .extern catalog_get_cutlet
          .extern catalog_get_month

          _start:
              mov rdi,C_DAY
              mov rsi,T_DAY
              call calendarDateSpaghetti
              cmp eax,2
              jne fail
              test rdx,rdx
              je fail
              mov r12,rdx

              mov rdi,qword ptr [r12+RES_YEAR]
              mov esi,E_YEAR
              call bi_eq_u64
              test eax,eax
              je fail

              mov rdi,E_CUTLET
              call catalog_get_cutlet
              cmp rax,qword ptr [r12+RES_CUTLET_NAME]
              jne fail
              cmp qword ptr [r12+RES_DAY_IN_CUTLET],E_DCUT
              jne fail

              mov rdi,E_MONTH
              call catalog_get_month
              cmp rax,qword ptr [r12+RES_MONTH_NAME]
              jne fail
              cmp qword ptr [r12+RES_DAY_IN_MONTH],E_DMONTH
              jne fail

              mov eax,1
              mov edi,1
              lea rsi,[rip+ok_msg]
              mov edx,ok_len
              syscall
              mov eax,60
              xor edi,edi
              syscall

          fail:
              mov eax,1
              mov edi,1
              lea rsi,[rip+bad_msg]
              mov edx,bad_len
              syscall
              mov eax,60
              mov edi,1
              syscall
          ASM

          for n in 1 2; do
            as --64 --defsym CASE="$n" \
              -o "build/firstday_witness_${n}.o" build/firstday_witness.s
            ld -o "build/firstday_witness_${n}" \
              build/arena.o \
              build/bigint.o \
              build/bootstrap.o \
              build/stage54_integration.o \
              build/stage56_bowlsum_corrective.o \
              build/catalog.o \
              "build/firstday_witness_${n}.o"
            "./build/firstday_witness_${n}"
          done
