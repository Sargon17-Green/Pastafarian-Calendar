name: Assembly Sahidic Stage56 first-day permanent fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Guard exact branch and baseline
        shell: bash
        run: |
          set -euo pipefail
          expected_branch='x86-64-Assembly+ϯⲙⲉⲧⲣⲉⲙⲛ̀ⲭⲏⲙⲓ'
          test "$GITHUB_REF_NAME" = "$expected_branch"
          test "$(git hash-object src/production/stage54_integration.s)" = \
            "6d648fe4abc0838b4aa94e7de81b6fbb9846ffc2"
          test -f .github/workflows/assembly-sahidic-10pair-main-differential.yml

      - name: Make the Stage56 scar detour permanent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/production/stage54_integration.s")
          s = source.read_text(encoding="utf-8")

          old = "    mov ecx,1\n    jmp .Ls54ss_done\n.Ls54ss_correct:"
          new = "    mov ecx,1\n    jmp .Ls54ss_correct\n.Ls54ss_correct:"

          if s.count(old) != 1:
              raise SystemExit(
                  f"expected exactly one stale first-day ghost reuse jump; found {s.count(old)}"
              )
          source.write_text(s.replace(old, new, 1), encoding="utf-8")

          wf = Path(".github/workflows/assembly-sahidic-10pair-main-differential.yml")
          w = wf.read_text(encoding="utf-8")

          start_marker = "      - name: Apply one-line Stage56 semantic detour in checkout only\n"
          end_marker = "      - name: Build patched production objects\n"
          if w.count(start_marker) != 1 or w.count(end_marker) != 1:
              raise SystemExit("diagnostic workflow markers are not exactly as expected")

          start = w.index(start_marker)
          end = w.index(end_marker)
          w = w[:start] + w[end:]

          replacements = {
              "name: Assembly Sahidic Stage56 first-day reuse diagnostic":
                  "name: Assembly Sahidic 10-pair main differential",
              "  push:\n\npermissions:":
                  "  push:\n  workflow_dispatch:\n\npermissions:",
              "      - name: Build patched production objects":
                  "      - name: Build current Stage56 production objects",
              "            src/production/stage54_integration.s \\\n":
                  "",
              "      - name: Run patched 10-pair differential against corrected main JDN baseline":
                  "      - name: Run 10-pair differential against corrected main JDN baseline",
              "main_correct_tuple\\tpatched_assembly_tuple\\tstatus":
                  "main_correct_tuple\\tassembly_tuple\\tstatus",
              "stage56-firstday-diagnostic.tsv":
                  "differential-results.tsv",
              "assembly-sahidic-stage56-firstday-reuse-diagnostic":
                  "assembly-sahidic-10pair-main-differential",
              "      - name: Upload diagnostic result":
                  "      - name: Upload differential result",
              "      - name: Require patched 10/10 agreement":
                  "      - name: Require 10/10 agreement",
          }
          for a, b in replacements.items():
              if a not in w:
                  raise SystemExit(f"expected workflow text not found: {a!r}")
              w = w.replace(a, b)

          forbidden = [
              "Apply one-line Stage56 semantic detour in checkout only",
              "p.write_text(s.replace(old, new, 1)",
              "Build patched production objects",
              "patched_assembly_tuple",
          ]
          for item in forbidden:
              if item in w:
                  raise SystemExit(f"temporary diagnostic logic survived: {item}")

          wf.write_text(w, encoding="utf-8")

          self_path = Path(
              ".github/workflows/assembly-sahidic-stage56-firstday-permanent-fix.yml"
          )
          if not self_path.exists():
              raise SystemExit("one-time fixer is not at the expected repository path")
          self_path.unlink()
          PY

          echo '--- source semantic diff ---'
          git diff -- src/production/stage54_integration.s
          echo '--- workflow persistence diff ---'
          git diff -- .github/workflows/assembly-sahidic-10pair-main-differential.yml
          echo '--- one-time workflow removal ---'
          git status --short

      - name: Build patched production route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          as --64 -o build/arena.o src/runtime/arena.s
          as --64 -o build/bigint.o src/runtime/bigint.s
          as --64 -o build/bootstrap.o src/production/bootstrap.s
          as --64 -o build/catalog.o src/catalog/source_language_catalog.s
          as --64 -o build/stage54_integration.o src/production/stage54_integration.s
          as --64 -o build/stage56_bowlsum_corrective.o src/production/stage56_bowlsum_corrective.s

      - name: Prove the two first-day witnesses before commit
        shell: bash
        run: |
          set -euo pipefail
          cat > build/firstday_witness.s <<'ASM'
          .intel_syntax noprefix
          .equ RES_YEAR,0
          .equ RES_CUTLET_NAME,8
          .equ RES_DAY_IN_CUTLET,16
          .equ RES_MONTH_NAME,24
          .equ RES_DAY_IN_MONTH,32

          .ifndef CASE
          .set CASE,1
          .endif

          .if CASE == 1
          .equ C_DAY,-15055670
          .equ T_DAY,-15055670
          .equ E_YEAR,5000
          .equ E_CUTLET,10
          .equ E_DCUT,1
          .equ E_MONTH,3
          .equ E_DMONTH,1
          .elseif CASE == 2
          .equ C_DAY,-15055672
          .equ T_DAY,-15055670
          .equ E_YEAR,5000
          .equ E_CUTLET,3
          .equ E_DCUT,1
          .equ E_MONTH,3
          .equ E_DMONTH,96
          .else
          .error "CASE must be 1 or 2"
          .endif

          .section .rodata
          ok_msg: .ascii "PASS\n"
          ok_len = . - ok_msg
          bad_msg: .ascii "MISMATCH\n"
          bad_len = . - bad_msg

          .section .text
          .global _start
          .extern calendarDateSpaghetti
          .extern bi_eq_u64
          .extern catalog_get_cutlet
          .extern catalog_get_month

          _start:
              mov rdi,C_DAY
              mov rsi,T_DAY
              call calendarDateSpaghetti
              cmp eax,2
              jne fail
              test rdx,rdx
              je fail
              mov r12,rdx

              mov rdi,qword ptr [r12+RES_YEAR]
              mov esi,E_YEAR
              call bi_eq_u64
              test eax,eax
              je fail

              mov rdi,E_CUTLET
              call catalog_get_cutlet
              cmp rax,qword ptr [r12+RES_CUTLET_NAME]
              jne fail
              cmp qword ptr [r12+RES_DAY_IN_CUTLET],E_DCUT
              jne fail

              mov rdi,E_MONTH
              call catalog_get_month
              cmp rax,qword ptr [r12+RES_MONTH_NAME]
              jne fail
              cmp qword ptr [r12+RES_DAY_IN_MONTH],E_DMONTH
              jne fail

              mov eax,1
              mov edi,1
              lea rsi,[rip+ok_msg]
              mov edx,ok_len
              syscall
              mov eax,60
              xor edi,edi
              syscall

          fail:
              mov eax,1
              mov edi,1
              lea rsi,[rip+bad_msg]
              mov edx,bad_len
              syscall
              mov eax,60
              mov edi,1
              syscall
          ASM

          for n in 1 2; do
            as --64 --defsym CASE="$n" \
              -o "build/firstday_witness_${n}.o" build/firstday_witness.s
            ld -o "build/firstday_witness_${n}" \
              build/arena.o \
              build/bigint.o \
              build/bootstrap.o \
              build/stage54_integration.o \
              build/stage56_bowlsum_corrective.o \
              build/catalog.o \
              "build/firstday_witness_${n}.o"
            "./build/firstday_witness_${n}"
          done

      - name: Commit the permanent scar detour
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stage56 scar keeper"
          git config user.email "stage56-scar-keeper@users.noreply.github.com"

          git add \
            src/production/stage54_integration.s \
            .github/workflows/assembly-sahidic-10pair-main-differential.yml \
            .github/workflows/assembly-sahidic-stage56-firstday-permanent-fix.yml

          test "$(git diff --cached --numstat src/production/stage54_integration.s | awk '{print $1+$2}')" = "2"

          git commit -m "Stage 56: detour stale first-day ghost reuse"
          git push origin "HEAD:${GITHUB_REF_NAME}"
