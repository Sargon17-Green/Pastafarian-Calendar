name: PHP Malay Stage56 B1 Frontier Discovery
on:
  push:
    branches:
      - 'PHP+Bahasa-Melayu'
    paths:
      - 'src/Patches/MonthWeavingFrontier56.php'
      - 'tests/stage56_weaving_frontier.php'
      - 'docs/STAGE56_PHASE_B1_FRONTIER_DISCOVERY_2026-11-16.md'
      - 'tools/stage56_phase_b1_frontier_discovery.py'
      - '.github/workflows/php-malay-stage56-weaving-b1.yml'
  workflow_dispatch:

jobs:
  stage56-weaving-frontier-b1-native:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run bounded PHP 8.3 BigInt frontier differential gate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p stage56-b1-evidence
          printf '%s\n' 'PC-BRANCH-PHP-MALAY' > stage56-b1-evidence/PROJECT_ID.txt
          printf '%s\n' "$GITHUB_SHA" > stage56-b1-evidence/SHA.txt
          php -v > stage56-b1-evidence/php-version.txt
          php -l src/BigInt.php > stage56-b1-evidence/lint-bigint.txt 2>&1; l1=$?
          php -l src/Patches/MonthWeavingFrontier56.php > stage56-b1-evidence/lint-frontier.txt 2>&1; l2=$?
          php -l tests/stage56_weaving_frontier.php > stage56-b1-evidence/lint-tests.txt 2>&1; l3=$?
          timeout 900s php -d memory_limit=512M tests/stage56_weaving_frontier.php \
            > stage56-b1-evidence/stdout.txt 2> stage56-b1-evidence/stderr.txt
          code=$?
          printf 'lint_bigint=%s\nlint_frontier=%s\nlint_tests=%s\nexit=%s\n' \
            "$l1" "$l2" "$l3" "$code" > stage56-b1-evidence/exit.txt
          cat stage56-b1-evidence/lint-*.txt stage56-b1-evidence/stdout.txt
          if (( l1 != 0 || l2 != 0 || l3 != 0 || code != 0 )); then
            cat stage56-b1-evidence/stderr.txt >&2
            exit 1
          fi
          if [[ -s stage56-b1-evidence/stderr.txt ]]; then
            cat stage56-b1-evidence/stderr.txt >&2
            exit 1
          fi
          grep -Fx 'STAGE56_WEAVING_FRONTIER_B1 vectors=120 prefixes=18302 words=3940 rejected=6 status=PASS' \
            stage56-b1-evidence/stdout.txt
      - name: Retain SHA-bound Phase B1 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-malay-stage56-b1-${{ github.sha }}
          path: stage56-b1-evidence/
          if-no-files-found: error
          retention-days: 30
