name: Kotlin production adversarial boundary state/order differential
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/Post55ProductionBoundaryStateProbe.kt'
      - 'soak/audit_production_boundary_state.py'
      - 'soak/test_audit_production_boundary_state.py'
      - '.github/workflows/post55-production-boundary-state.yml'
      - 'soak/audit_production_adjacent_year_navigation.py'
      - 'soak/independent_year_geometry_oracle.py'
      - 'soak/independent_sauce_oracle.py'
      - 'soak/independent_date_combinatorics.py'
      - 'src/main/kotlin/pastafari/ProductionYearNavigator.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-real-boundary-state:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable source, branch, budgets and exclusions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'maxGateAbsIndex: Int = 8192' src/main/kotlin/pastafari/ProductionYearNavigator.kt
          grep -Fq 'private const val GATE_LIMIT = 8192' soak/Post55ProductionBoundaryStateProbe.kt
          grep -Fq 'maxYearTransitions = 8' soak/Post55ProductionBoundaryStateProbe.kt
          grep -Fq 'CONTRACT_DEFINED_ONLY' soak/evidence/post55-adversarial-state-order-qa-contract-2026-11-21.md
          echo 'BOUNDARY_SOURCE_SHA_BUDGET_GREEN'
      - name: Run focused mutation/protocol tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile soak/audit_production_boundary_state.py soak/test_audit_production_boundary_state.py
          python3 -m unittest discover -s soak -p 'test_audit_production_boundary_state.py' -v 2>&1 | tee evidence/boundary-state-tests.log
      - name: Install pinned Kotlin compiler 1.9.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip' \
            -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile actual Kotlin production and boundary probe
        shell: bash
        run: |
          set -euo pipefail
          kotlinc src/main/kotlin/pastafari/*.kt \
            soak/Post55ProductionBoundaryStateProbe.kt \
            -include-runtime -d "$RUNNER_TEMP/boundary-state.jar"
          test -s "$RUNNER_TEMP/boundary-state.jar"
          echo 'BOUNDARY_REAL_PRODUCTION_COMPILED_GREEN'
      - name: Audit 108 production calls vs 560 unseeded gaps and 561 gates
        shell: bash
        run: |
          set -euo pipefail
          python3 soak/audit_production_boundary_state.py \
            --jar "$RUNNER_TEMP/boundary-state.jar" \
            --timeout-seconds 900 \
            --evidence evidence/boundary-state.json \
            2>&1 | tee evidence/boundary-state.log
      - name: Preserve JSON, digest, transcript, independent trace and logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-cymraeg-production-boundary-state
          path: evidence/boundary-state*
          if-no-files-found: warn
          retention-days: 30
