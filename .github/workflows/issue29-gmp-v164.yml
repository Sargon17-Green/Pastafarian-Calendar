name: Issue29 v164 Ada GMP exact full-family QA (synthetic only, NO F)
on:
  push:
    branches:
      - qa/issue29-ada-gmp-full-weave-v164
    paths:
      - .github/workflows/issue29-gmp-v164.yml
      - 'soak/candidates/ada_full_weave_gmp_v164/**'
permissions:
  contents: read
  actions: read
jobs:
  gmp-exact-full-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce STOP and isolate all calendar code from QA binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("soak/control/confirmed_first_original_mismatch_dispatch_halt_v108.json").read_text())
          assert d["decision"]=="STOP_NEW_NATIVE_SOAK_DISPATCH"
          assert d["main_changes_permitted"] is False
          assert d["successful_original_source_full_years"]==0
          s=Path("soak/candidates/ada_full_weave_gmp_v164")
          for p in s.glob("*.ad?"):
              content=p.read_text()
              assert "with Normative_Oracle;" not in content
              assert "Normative_Oracle.Calendar_Date" not in content
          print("V164_NO_CALENDAR_CODE_DEPENDENCIES")
          PY
          git rev-parse HEAD > evidence/tested-commit.txt
      - name: Install GNAT/GPRBuild/GNATCOLL GMP and record package versions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > evidence/apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             gnat-13 gprbuild libgnatcoll-gmp-dev             > evidence/apt-install.log 2>&1
          gnatmake --version > evidence/gnat-version.txt
          gprbuild --version > evidence/gpr-version.txt
          dpkg-query -W libgnatcoll-gmp-dev libgmp10 > evidence/installed-gmp-versions.txt
      - name: Compile GMP full-family engine, independent exhaustive tests and rank oracle
        shell: bash
        run: |
          set -euo pipefail
          gprbuild -p -P soak/candidates/ada_full_weave_gmp_v164/issue29_gmp_v164.gpr             -j2 > evidence/build.stdout 2> evidence/build.stderr
          sha256sum soak/candidates/ada_full_weave_gmp_v164/bin/*             > evidence/binaries.sha256
      - name: Exhaustively check every rank of seven small families
        shell: bash
        run: |
          set -euo pipefail
          (
            ulimit -v 262144
            timeout --signal=KILL 45s               ./soak/candidates/ada_full_weave_gmp_v164/bin/test_issue29_gmp_v164
          ) > evidence/small.stdout 2> evidence/small.stderr
          grep -F V164_ALL_SEVEN_GMP_EXHAUSTIVE_CASES_PASS_NO_CALENDAR_F evidence/small.stdout
          grep -c '^V164_GMP_SMALL_EXHAUSTIVE_PASS_' evidence/small.stdout | grep -Fx 7
      - name: Check thirteen exact GMP rank vectors against independent Python-int constants
        shell: bash
        run: |
          set -euo pipefail
          (
            ulimit -v 262144
            timeout --signal=KILL 20s               ./soak/candidates/ada_full_weave_gmp_v164/bin/test_issue29_wide_rank_gmp_v164
          ) > evidence/ranks.stdout 2> evidence/ranks.stderr
          grep -Fx V164_ALL_13_GMP_EXACT_RANK_VECTORS_PASS_NO_CALENDAR_F evidence/ranks.stdout
          grep -c '^V164_GMP_WIDE_RANK_VECTOR_PASS' evidence/ranks.stdout | grep -Fx 13
      - name: Bounded synthetic 45-month 4244-day count and rank-one unranking
        shell: bash
        run: |
          set -euo pipefail
          (
            ulimit -v 524288
            /usr/bin/time -v timeout --signal=KILL 90s               ./soak/candidates/ada_full_weave_gmp_v164/bin/benchmark_issue29_gmp_v164
          ) > evidence/large.stdout 2> evidence/large.stderr
          grep -F V164_GMP_45_MONTH_4244_DAY_SYNTHETIC_RANK1_PASS_NO_F evidence/large.stdout
          echo "QA_SYNTHETIC_ONLY_NO_FCT_CALLS; NO_SOAK_YEARS" > evidence/verdict.txt
      - name: Verify 22734-bit GMP count against independent Python-int dynamic programming
        shell: bash
        run: |
          set -euo pipefail
          python3 -B soak/candidates/ada_full_weave_gmp_v164/check_gmp_count_against_independent_dp_v164.py             evidence/large.stdout evidence/independent-count-verified.json             > evidence/independent-count.stdout 2> evidence/independent-count.stderr
          grep -Fx V164_INDEPENDENT_45x4244_EXACT_GMP_BIG_INTEGER_COUNT_EQUAL             evidence/independent-count.stdout
      - name: Bounded nontrivial 45-month global-rank unrank with full 4244-month trace
        shell: bash
        run: |
          set -euo pipefail
          (
            ulimit -v 524288
            /usr/bin/time -v timeout --signal=KILL 90s               ./soak/candidates/ada_full_weave_gmp_v164/bin/benchmark_issue29_gmp_global_rank_v164
          ) > evidence/full-rank.stdout 2> evidence/full-rank.stderr
          grep -Fx V164_SYNTHETIC_GLOBAL_RANK_FULL_4244_WEAVE_PASS_NO_F             evidence/full-rank.stdout
      - name: Independently match nontrivial huge rank and each of 4244 weave IDs
        shell: bash
        run: |
          set -euo pipefail
          (
            ulimit -v 524288
            timeout --signal=KILL 90s               python3 -B soak/candidates/ada_full_weave_gmp_v164/check_gmp_global_rank_vs_independent_v164.py                 evidence/full-rank.stdout evidence/full-rank-independently-verified.json
          ) > evidence/full-rank-check.stdout 2> evidence/full-rank-check.stderr
          grep -Fx V164_INDEPENDENT_EXACT_GLOBAL_RANK_AND_ALL_4244_WEAVE_IDS_PASS_NO_F             evidence/full-rank-check.stdout
      - name: Pin and stage only already-recorded v161 source-QA month-selector intermediate evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B soak/candidates/ada_full_weave_gmp_v164/prepare_issue29_v161_replay_v164.py             "$RUNNER_TEMP/issue29-v164-v161-pinned"             > evidence/pinned-v161-preparation.stdout             2> evidence/pinned-v161-preparation.stderr
          cp "$RUNNER_TEMP/issue29-v164-v161-pinned/v164-captured-v161-expected.json"             evidence/v164-captured-v161-expected.json
          grep -Fx V164_V161_SOURCE_LOCKED_REPLAY_PREPARED_NO_NEW_F evidence/pinned-v161-preparation.stdout
      - name: Bounded Ada GMP unranking of sealed v161 selector WITHOUT calendar call
        shell: bash
        run: |
          set -euo pipefail
          (
            ulimit -v 524288
            /usr/bin/time -v timeout --signal=KILL 90s               ./soak/candidates/ada_full_weave_gmp_v164/bin/replay_issue29_v161_gmp_v164                 "$RUNNER_TEMP/issue29-v164-v161-pinned/v164-captured-selector.txt"
          ) > evidence/pinned-v161-replay.stdout 2> evidence/pinned-v161-replay.stderr
          grep -Fx V164_PINNED_V161_INTERMEDIATE_REPLAY_COMPLETE_NO_NEW_F evidence/pinned-v161-replay.stdout
      - name: Confirm native GMP count, all 4244 slots and month20/day56 match already-pinned Python QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -B soak/candidates/ada_full_weave_gmp_v164/verify_issue29_v161_replay_v164.py             evidence/v164-captured-v161-expected.json             evidence/pinned-v161-replay.stdout             evidence/v164-v161-prior-intermediate-replay-verified.json             > evidence/pinned-v161-check.stdout 2> evidence/pinned-v161-check.stderr
          grep -Fx V164_PINNED_V161_PYTHON_QA_VS_ADA_GMP_COUNT_AND_ALL_4244_WEAVE_MATCH             evidence/pinned-v161-check.stdout
          grep -Fx V164_PINNED_V161_PROJECTION_MONTH20_DAY56_RECOVERED_NO_F             evidence/pinned-v161-check.stdout
      - name: Reconstruct byte-locked historical Ada into reversible QA-only GMP integration
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B soak/runner/issue29_foundation_capture_v160.py prepare             --root "$RUNNER_TEMP/issue29-v164-qa"             > evidence/prepare.stdout 2> evidence/prepare.stderr
          python3 -B soak/candidates/ada_full_weave_gmp_v164/integrate_gmp_qa_only_v164.py             "$RUNNER_TEMP/issue29-v164-qa"             soak/candidates/ada_full_weave_gmp_v164             > evidence/oracle-adapter.stdout 2> evidence/oracle-adapter.stderr
          cp "$RUNNER_TEMP/issue29-v164-qa/v164-qa-integration-receipt.json" evidence/
          cp "$RUNNER_TEMP/issue29-v164-qa/v164-qa-oracle.patch" evidence/
          echo "V164_ORACLE_SOURCE_QA_ONLY_NO_CALENDAR_EXECUTION" > evidence/oracle-source-status.txt
      - name: Compile integrated historical Ada QA oracle with full GMP rank and weaving (DO NOT RUN)
        shell: bash
        run: |
          set -euo pipefail
          gprbuild -p -c -P "$RUNNER_TEMP/issue29-v164-qa/ada-build/issue29_gmp_oracle_qa_compile.gpr"             -j2 > evidence/oracle-compile.stdout 2> evidence/oracle-compile.stderr
          echo "V164_GMP_ORACLE_QA_FULL_COMPILATION_PASS_NO_F" > evidence/oracle-compile-verdict.txt
          echo "ORIGINAL_FCT_CALLS=0; QA_FCT_CALLS=0; SOAK_YEARS=0" >> evidence/oracle-compile-verdict.txt
      - name: Hash every saved diagnostic member even if a test failed
        if: always()
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("evidence")
          h={x.name:{"bytes":x.stat().st_size,
                     "sha256":hashlib.sha256(x.read_bytes()).hexdigest()}
             for x in sorted(p.iterdir()) if x.is_file()}
          (p/"members.sha256.json").write_text(json.dumps(h,sort_keys=True,indent=2)+"\n")
          PY
      - name: Archive QA-only GMP logs and bounded resource receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v164-gmp-exact-synthetic-only-no-F
          path: evidence/
          retention-days: 30
