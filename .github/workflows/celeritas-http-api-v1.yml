name: Cicatrix HTTP Celeritas v1

on:
  push:
    branches:
      - Celeritas-per-Sepulcra-HTTP-API
      - Celeritas-per-Sepulcra
  pull_request:

permissions:
  contents: read

jobs:
  cicatrix-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Excerpere repository
        uses: actions/checkout@v5

      - name: Instituere dependentias aedificationis
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libboost-dev \
            clang \
            lld \
            curl

      - name: Verificare Boost et compilatores
        shell: bash
        run: |
          set -euo pipefail
          test -r /usr/include/boost/multiprecision/cpp_int.hpp
          test -r /usr/include/boost/beast.hpp
          command -v clang++
          command -v g++
          command -v ld.lld
          clang++ --version | sed -n '1p'
          g++ --version | sed -n '1p'

      - name: Currere probationes cicatricis HTTP
        shell: bash
        env:
          CXX: clang++
        run: |
          set -euo pipefail
          sh tests/run_http_api_tests.sh

      - name: Aedificare ministrum cum monstro vero
        shell: bash
        env:
          CXX: clang++
          OUTPUT: /tmp/pastafari-http
        run: |
          set -euo pipefail
          sh build_http_api.sh

      - name: CORS restrictum cum ministro vero probare
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pastafari-http 127.0.0.1 18079 >/tmp/http-cors.out 2>/tmp/http-cors.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18079/v1/health >/dev/null; then break; fi
            sleep 0.1
          done

          curl -sS -D /tmp/cors-allowed.headers -o /tmp/cors-allowed.body -X OPTIONS \
            http://127.0.0.1:18079/v1/date \
            -H 'Origin: https://bwtbdyqtmsprytgydym-cpu.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
          grep -q '^HTTP/1.1 204' /tmp/cors-allowed.headers
          grep -qi '^Access-Control-Allow-Origin: https://bwtbdyqtmsprytgydym-cpu.github.io' /tmp/cors-allowed.headers

          curl -fsS -D /tmp/cors-get.headers -o /tmp/cors-get.body \
            http://127.0.0.1:18079/v1/meta \
            -H 'Origin: https://bwtbdyqtmsprytgydym-cpu.github.io'
          grep -qi '^Access-Control-Allow-Origin: https://bwtbdyqtmsprytgydym-cpu.github.io' /tmp/cors-get.headers

          # Fasciculi file:// originem opacam plerumque ut `null` mittunt.
          curl -sS -D /tmp/cors-null-preflight.headers -o /tmp/cors-null-preflight.body -X OPTIONS \
            http://127.0.0.1:18079/v1/date \
            -H 'Origin: null' \
            -H 'Access-Control-Request-Method: GET'
          grep -q '^HTTP/1.1 204' /tmp/cors-null-preflight.headers
          grep -qi '^Access-Control-Allow-Origin: null' /tmp/cors-null-preflight.headers

          curl -fsS -D /tmp/cors-null-get.headers -o /tmp/cors-null-get.body \
            http://127.0.0.1:18079/v1/meta \
            -H 'Origin: null'
          grep -qi '^Access-Control-Allow-Origin: null' /tmp/cors-null-get.headers

          code=$(curl -sS -o /tmp/cors-denied.body -w '%{http_code}' -X OPTIONS \
            http://127.0.0.1:18079/v1/date \
            -H 'Origin: https://alien.example' \
            -H 'Access-Control-Request-Method: POST')
          test "$code" = 403
          grep -q 'CORS_ORIGIN_NOT_ALLOWED' /tmp/cors-denied.body

      - name: Fumum per socket apud Foundation probare
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pastafari-http 127.0.0.1 18080 >/tmp/http.out 2>/tmp/http.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18080/v1/health >/tmp/health.json; then break; fi
            sleep 0.1
          done
          grep -q '"status":"ok"' /tmp/health.json
          timeout 5m curl -fsS \
            'http://127.0.0.1:18080/v1/date?date=-15055671&calendar=engine-day&calculation_day=-15055671' \
            >/tmp/foundation.json
          grep -q '"year":"5000"' /tmp/foundation.json
          grep -q '"index":4' /tmp/foundation.json
          grep -q '"dayInCutlet":"762"' /tmp/foundation.json
          grep -q '"index":12' /tmp/foundation.json
          grep -q '"dayInMonth":"105"' /tmp/foundation.json

          # Transportus scripti ad fasciculos file:// et isolationem navigatoris.
          timeout 5m curl -fsS -D /tmp/foundation-script.headers \
            'http://127.0.0.1:18080/v1/date.js?date=-15055671&calendar=engine-day&calculation_day=-15055671&language=la&callback=pastafariDateCallback' \
            >/tmp/foundation-script.js
          grep -qi '^Content-Type: application/javascript; charset=utf-8' /tmp/foundation-script.headers
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/foundation-script.headers
          grep -qi '^Cross-Origin-Resource-Policy: cross-origin' /tmp/foundation-script.headers
          grep -q '^pastafariDateCallback({' /tmp/foundation-script.js
          grep -q '"year":"5000"' /tmp/foundation-script.js
          grep -q '"dayInCutlet":"762"' /tmp/foundation-script.js
          grep -q '"dayInMonth":"105"' /tmp/foundation-script.js
          grep -q ');$' /tmp/foundation-script.js

          code=$(curl -sS -o /tmp/invalid-callback.json -w '%{http_code}' \
            'http://127.0.0.1:18080/v1/date.js?date=-15055671&calendar=engine-day&calculation_day=-15055671&callback=alert%281%29')
          test "$code" = 400
          grep -q 'INVALID_CALLBACK' /tmp/invalid-callback.json

      - name: Sanitatem inter calculum longum probare
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pastafari-http 127.0.0.1 18082 >/tmp/http-health-lane.out 2>/tmp/http-health-lane.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18082/v1/health >/dev/null; then break; fi
            sleep 0.1
          done

          timeout 5m curl -fsS \
            'http://127.0.0.1:18082/v1/date.js?date=-15055671&calendar=engine-day&calculation_day=-15055671&callback=healthLaneWitness' \
            >/tmp/health-lane-date.js &
          reqpid=$!
          sleep 0.2
          kill -0 "$reqpid"

          # Viae control-plane numquam post calculum semanticum exspectare debent.
          curl --max-time 2 -fsS http://127.0.0.1:18082/v1/health >/tmp/health-during-calc.json
          grep -q '"status":"ok"' /tmp/health-during-calc.json
          curl --max-time 2 -fsS http://127.0.0.1:18082/v1/meta >/tmp/meta-during-calc.json
          grep -q '"semanticStage":56' /tmp/meta-during-calc.json

          # Petitio semantica secunda non in caterva invisibili manet. Statim 503
          # ENGINE_BUSY accipit dum prima petitio adhuc monstro utitur.
          code=$(curl --max-time 2 -sS -D /tmp/engine-busy.headers \
            -o /tmp/engine-busy.json -w '%{http_code}' \
            'http://127.0.0.1:18082/v1/date?date=-15055671&calendar=engine-day&calculation_day=-15055671')
          test "$code" = 503
          grep -q 'ENGINE_BUSY' /tmp/engine-busy.json
          grep -qi '^Retry-After: 5' /tmp/engine-busy.headers
          kill -0 "$reqpid"

          wait "$reqpid"
          grep -q '^healthLaneWitness({' /tmp/health-lane-date.js
          grep -q '"year":"5000"' /tmp/health-lane-date.js

          # Claustrum liberatum est; idem par nunc per Pair Tomb statim serviri potest.
          timeout 30s curl -fsS \
            'http://127.0.0.1:18082/v1/date?date=-15055671&calendar=engine-day&calculation_day=-15055671' \
            >/tmp/post-busy-date.json
          grep -q '"year":"5000"' /tmp/post-busy-date.json

      - name: Transportum job async apud Foundation probare
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pastafari-http 127.0.0.1 18083 >/tmp/http-async-job.out 2>/tmp/http-async-job.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18083/v1/health >/dev/null; then break; fi
            sleep 0.1
          done

          # Initium job intra duas secundas redit; calculus historicus postea in fundo currit.
          curl --max-time 2 -fsS \
            'http://127.0.0.1:18083/v1/date-job.js?date=-15055671&calendar=engine-day&calculation_day=-15055671&language=la&callback=jobStartWitness' \
            >/tmp/async-start.js
          grep -q '^jobStartWitness({' /tmp/async-start.js
          grep -q '"status":"running"' /tmp/async-start.js
          job=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' /tmp/async-start.js)
          test -n "$job"

          # Control-plane et poll numquam post monstro exspectant.
          curl --max-time 2 -fsS http://127.0.0.1:18083/v1/meta >/tmp/async-meta.json
          grep -q '"semanticStage":56' /tmp/async-meta.json
          curl --max-time 2 -fsS \
            "http://127.0.0.1:18083/v1/date-job.js?job=$job&callback=jobPollWitness" \
            >/tmp/async-poll-running.js
          grep -q '"status":"running"' /tmp/async-poll-running.js

          # Initium secundum non queue fit; per JavaScript 200 statim busy refert.
          curl --max-time 2 -fsS -D /tmp/async-busy.headers \
            'http://127.0.0.1:18083/v1/date-job.js?date=-15055671&calendar=engine-day&calculation_day=-15055671&callback=jobBusyWitness' \
            >/tmp/async-busy.js
          grep -q '"status":"busy"' /tmp/async-busy.js
          grep -qi '^Retry-After: 5' /tmp/async-busy.headers

          # Via synchrona eodem tempore ENGINE_BUSY accipit nec calculum alterum incipit.
          code=$(curl --max-time 2 -sS -o /tmp/async-sync-busy.json -w '%{http_code}' \
            'http://127.0.0.1:18083/v1/date?date=-15055671&calendar=engine-day&calculation_day=-15055671')
          test "$code" = 503
          grep -q 'ENGINE_BUSY' /tmp/async-sync-busy.json

          complete=0
          for i in $(seq 1 300); do
            curl --max-time 2 -fsS \
              "http://127.0.0.1:18083/v1/date-job.js?job=$job&callback=jobPollWitness" \
              >/tmp/async-poll.js
            if grep -q '"status":"failed"' /tmp/async-poll.js; then
              cat /tmp/async-poll.js
              exit 1
            fi
            if grep -q '"status":"complete"' /tmp/async-poll.js; then
              complete=1
              break
            fi
            grep -q '"status":"running"' /tmp/async-poll.js
            sleep 1
          done
          test "$complete" = 1
          grep -q '"year":"5000"' /tmp/async-poll.js
          grep -q '"dayInCutlet":"762"' /tmp/async-poll.js
          grep -q '"dayInMonth":"105"' /tmp/async-poll.js

          # Resultatum transportale manet ad polling repetitum; hoc cache semanticus non est.
          curl --max-time 2 -fsS \
            "http://127.0.0.1:18083/v1/date-job.js?job=$job&callback=jobFinalWitness" \
            >/tmp/async-final.js
          grep -q '"status":"complete"' /tmp/async-final.js
          grep -q '"year":"5000"' /tmp/async-final.js

      - name: Fumum implicitum Kisurra-Venus probare
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pastafari-http 127.0.0.1 18081 >/tmp/http2.out 2>/tmp/http2.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18081/v1/health >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 15m curl -fsS \
            'http://127.0.0.1:18081/v1/date?date=2026-09-02' \
            >/tmp/implicit.json
          grep -q '"source":"request-instant"' /tmp/implicit.json
          grep -q '"site":"kisurra"' /tmp/implicit.json
          grep -q 'venus-lower-transit-jpl-approx-1' /tmp/implicit.json
