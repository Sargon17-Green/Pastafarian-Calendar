name: Cicatrix HTTP Celeritas v1

on:
  push:
    branches:
      - Celeritas-per-Sepulcra-HTTP-API
      - Celeritas-per-Sepulcra
  pull_request:

permissions:
  contents: read

jobs:
  cicatrix-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Excerpere repository
        uses: actions/checkout@v5

      - name: Instituere dependentias aedificationis
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libboost-dev \
            clang \
            lld \
            curl

      - name: Verificare Boost et compilatores
        shell: bash
        run: |
          set -euo pipefail
          test -r /usr/include/boost/multiprecision/cpp_int.hpp
          test -r /usr/include/boost/beast.hpp
          command -v clang++
          command -v g++
          command -v ld.lld
          clang++ --version | sed -n '1p'
          g++ --version | sed -n '1p'

      - name: Currere probationes cicatricis HTTP
        shell: bash
        env:
          CXX: clang++
        run: |
          set -euo pipefail
          sh tests/run_http_api_tests.sh

      - name: Aedificare ministrum cum monstro vero
        shell: bash
        env:
          CXX: clang++
          OUTPUT: /tmp/pastafari-http
        run: |
          set -euo pipefail
          sh build_http_api.sh

      - name: CORS restrictum cum ministro vero probare
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pastafari-http 127.0.0.1 18079 >/tmp/http-cors.out 2>/tmp/http-cors.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18079/v1/health >/dev/null; then break; fi
            sleep 0.1
          done

          curl -sS -D /tmp/cors-allowed.headers -o /tmp/cors-allowed.body -X OPTIONS \
            http://127.0.0.1:18079/v1/date \
            -H 'Origin: https://bwtbdyqtmsprytgydym-cpu.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
          grep -q '^HTTP/1.1 204' /tmp/cors-allowed.headers
          grep -qi '^Access-Control-Allow-Origin: https://bwtbdyqtmsprytgydym-cpu.github.io' /tmp/cors-allowed.headers

          curl -fsS -D /tmp/cors-get.headers -o /tmp/cors-get.body \
            http://127.0.0.1:18079/v1/meta \
            -H 'Origin: https://bwtbdyqtmsprytgydym-cpu.github.io'
          grep -qi '^Access-Control-Allow-Origin: https://bwtbdyqtmsprytgydym-cpu.github.io' /tmp/cors-get.headers

          # Fasciculi file:// originem opacam plerumque ut `null` mittunt.
          curl -sS -D /tmp/cors-null-preflight.headers -o /tmp/cors-null-preflight.body -X OPTIONS \
            http://127.0.0.1:18079/v1/date \
            -H 'Origin: null' \
            -H 'Access-Control-Request-Method: GET'
          grep -q '^HTTP/1.1 204' /tmp/cors-null-preflight.headers
          grep -qi '^Access-Control-Allow-Origin: null' /tmp/cors-null-preflight.headers

          curl -fsS -D /tmp/cors-null-get.headers -o /tmp/cors-null-get.body \
            http://127.0.0.1:18079/v1/meta \
            -H 'Origin: null'
          grep -qi '^Access-Control-Allow-Origin: null' /tmp/cors-null-get.headers

          code=$(curl -sS -o /tmp/cors-denied.body -w '%{http_code}' -X OPTIONS \
            http://127.0.0.1:18079/v1/date \
            -H 'Origin: https://alien.example' \
            -H 'Access-Control-Request-Method: POST')
          test "$code" = 403
          grep -q 'CORS_ORIGIN_NOT_ALLOWED' /tmp/cors-denied.body

      - name: Fumum per socket apud Foundation probare
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pastafari-http 127.0.0.1 18080 >/tmp/http.out 2>/tmp/http.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18080/v1/health >/tmp/health.json; then break; fi
            sleep 0.1
          done
          grep -q '"status":"ok"' /tmp/health.json
          timeout 5m curl -fsS \
            'http://127.0.0.1:18080/v1/date?date=-15055671&calendar=engine-day&calculation_day=-15055671' \
            >/tmp/foundation.json
          grep -q '"year":"5000"' /tmp/foundation.json
          grep -q '"index":4' /tmp/foundation.json
          grep -q '"dayInCutlet":"762"' /tmp/foundation.json
          grep -q '"index":12' /tmp/foundation.json
          grep -q '"dayInMonth":"105"' /tmp/foundation.json

      - name: Fumum implicitum Kisurra-Venus probare
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pastafari-http 127.0.0.1 18081 >/tmp/http2.out 2>/tmp/http2.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18081/v1/health >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 15m curl -fsS \
            'http://127.0.0.1:18081/v1/date?date=2026-09-02' \
            >/tmp/implicit.json
          grep -q '"source":"request-instant"' /tmp/implicit.json
          grep -q '"site":"kisurra"' /tmp/implicit.json
          grep -q 'venus-lower-transit-jpl-approx-1' /tmp/implicit.json
