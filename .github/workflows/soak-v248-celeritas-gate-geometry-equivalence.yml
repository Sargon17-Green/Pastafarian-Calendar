name: Soak v248 canonical Stage55/56 gate geometry equivalence (not soak)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v248-celeritas-gate-geometry-equivalence.yml
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind v246 profile and exact v243-v245 candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e2f0dd420ae7b086cdaa08db5474aa60e5ffba21"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v248-celeritas-gate-geometry-equivalence.yml"
          mkdir -p evidence source/src source/include/pastafari
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15255714213/zip > evidence/v247.zip
          echo "73cb5ffa97582ffa0e329103ab4438892f55cbf8962c0046e9f87bcbfd8683e3  evidence/v247.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15254779866/zip > evidence/v246.zip
          echo "82b4e1a942c43e204ab8571e6d19a034d3da4f8140853ddf96bedd6932c6f81f  evidence/v246.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib,zipfile,subprocess
          from pathlib import Path
          with zipfile.ZipFile("evidence/v246.zip") as z:
              assert z.testzip() is None
              r=json.loads(z.read("result.json"))
              frozen=json.loads(z.read("frozen-v245.json"))
          assert r["schema"]=="SOAK_V246_CELERITAS_COLD_PHASE_PROFILE/1" and r["profile_completed"]
          with zipfile.ZipFile("evidence/v247.zip") as z:
              assert z.testzip() is None
              prev=json.loads(z.read("result.json"))
          assert prev["schema"]=="SOAK_V247_MERSENNE_SAVE_AB/1" and prev["comparison_completed"]
          assert prev["source_commit"]==r["candidate_commit"]
          ref="408d80e43159eba06849b6a929e0010f32b9b91b"
          assert r["candidate_commit"]==ref and [x["c"] for x in frozen]==[739617,-377237,6875993]
          Path("evidence/frozen.json").write_text(json.dumps(frozen,ensure_ascii=False,indent=2)+"\n")
          pins={"src/monster.cpp":"faad56bd1a2f70b19d40e266b3b2e05754197a48","include/pastafari/monster.hpp":"4c24d36e3704dd10ecf5420e7bc11a3da958d441","include/pastafari/source_language_catalog.hpp":"9f204d93166b2c33532bb236bc2bd929252f27be"}
          manifest={}
          for p,h in pins.items():
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/Sargon17-Green/Pastafarian-Calendar/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\x00"+raw).hexdigest()==h
              Path("source",p).write_bytes(raw)
              manifest[p]={"blob":h,"sha256":hashlib.sha256(raw).hexdigest()}
          Path("evidence/source-pins.json").write_text(json.dumps({"commit":ref,"files":manifest},indent=2)+"\n")
          PY
      - name: Compile exact unmodified candidate and gate comparison driver
        run: |
          set -euo pipefail
          (
            if ! printf '#include <boost/multiprecision/cpp_int.hpp>\nint main(){}\n' | g++ -std=c++17 -x c++ -fsyntax-only -; then
              timeout -k 5s 120s sudo apt-get update -qq
              timeout -k 5s 120s sudo apt-get install -y --no-install-recommends libboost-dev
            fi
            g++ --version
            dpkg-query -W libboost-dev
          ) > evidence/compiler.txt 2>&1
          cat > source/probe.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include <chrono>
          #include <iostream>
          #include <random>
          #include <set>
          #include <stdexcept>
          using namespace pastafari;
          bool same(const Patch11LatchedOrderSauceResult& a,const Patch11LatchedOrderSauceResult& b){
              return a.finalBowls==b.finalBowls && a.queryOrder==b.queryOrder &&
                  a.orderAt46Latch==b.orderAt46Latch &&
                  a.legacyQueryOrderBeforePatch==b.legacyQueryOrderBeforePatch &&
                  a.finalPostStirOrder==b.finalPostStirOrder &&
                  a.legacyOrderWriteCount==b.legacyOrderWriteCount &&
                  a.latchWriteCount==b.latchWriteCount &&
                  a.finalLegacyOrderSource==b.finalLegacyOrderSource;
          }
          Patch13RejectionSelection selectGap(const Patch11LatchedOrderSauceResult& a){
              const int next=nextBowlThroughOrderAt46Latch(a.orderAt46Latch,1);
              const auto stream=answerRingThroughPatchedNextBowl(a.finalBowls,1,next,1);
              LegacyBiasedSelectionAdapter adapter;
              Patch13RejectionWrapper wrapper;
              return wrapper.repair(stream,Integer{922},adapter);
          }
          int main(){
              std::set<Integer> cases;
              for(int i=1;i<=128;++i){cases.insert(Integer{i});cases.insert(Integer{-i});}
              for(int center:{256,512,1024,8192,16384,29289,31487,32768,43793,65536,131072}){
                  for(int d=-2;d<=2;++d){cases.insert(Integer{center+d});cases.insert(Integer{-center-d});}
              }
              std::mt19937_64 rng(20261128);
              for(int i=0;i<1024;++i){
                  const Integer n=1+rng()%200000;
                  cases.insert(i%2?n:Integer{-n});
              }
              for(int bits:{32,63,64,126,127,128,255}){
                  const Integer n=Integer{1}<<bits;
                  cases.insert(n-1);cases.insert(n);cases.insert(n+1);
                  cases.insert(-n-1);cases.insert(-n);cases.insert(-n+1);
              }
              // Zero is not a valid gap magnitude; each signed nonzero index
              // corresponds to the existing positive or negative gate formula.
              if(cases.count(0))return 2;
              std::size_t total=0;
              for(int mode=0;mode<3;++mode){
                  resetPersistentScarVaultsDiagnostic();
                  setAccelerationScarsEnabled(mode!=1);
                  setFullHistoricalAccelerationValidation(mode==2);
                  std::size_t count=0;
                  auto start=std::chrono::steady_clock::now();
                  for(const auto& n:cases){
                      // Full historical mode and acceleration-off remain small,
                      // but exercise both signs and large integer boundaries.
                      if(mode!=0 && !(n>=-8&&n<=8) &&
                         n!=Integer{32768}&&n!=Integer{-32768}&&
                         n!=(Integer{1}<<127)&&n!=-(Integer{1}<<127))continue;
                      const auto day=FOUNDATION_DAY_OLD+n;
                      const auto a=sauceWithOrderAt46Latch(FOUNDATION_DAY_OLD,day);
                      const auto corrected=sauceWithStage56RawBowlSumDetour(FOUNDATION_DAY_OLD,day);
                      const auto& b=corrected.semanticSauce;
                      if(!same(a,b)||!corrected.applied||corrected.appliedCount!=12||corrected.legacyScarCallCount!=12){
                          std::cerr<<"SAUCE_MISMATCH "<<mode<<" "<<n<<std::endl;return 1;
                      }
                      const auto x=selectGap(a),y=selectGap(b);
                      if(x.acceptanceLimit!=y.acceptanceLimit||x.acceptedAnswer!=y.acceptedAnswer||
                         x.acceptedOffset!=y.acceptedOffset||x.outputRank!=y.outputRank||
                         x.outputRank<1||x.outputRank>922){
                          std::cerr<<"GAP_MISMATCH "<<mode<<" "<<n<<std::endl;return 1;
                      }
                      // Accumulation is deliberately not performed; this is
                      // direct component evaluation of signed gap questions.
                      ++count;
                      std::cout<<"GAP\t"<<mode<<"\t"<<n<<"\t"<<41+x.outputRank<<"\t"<<x.acceptedOffset<<std::endl;
                  }
                  total+=count;
                  std::cout<<"MODE\t"<<mode<<"\t"<<count<<"\t"<<std::chrono::duration<double>(std::chrono::steady_clock::now()-start).count()<<std::endl;
              }
              std::cout<<"GATE_GEOMETRY_COMPONENT_PASS\t"<<total<<std::endl;
          }
          CPP
          (ulimit -v 4194304; timeout -k 5s 120s g++ -std=c++17 -O2 -pthread -I source/include source/src/monster.cpp source/probe.cpp -o source/probe) > evidence/build.log 2>&1 || { cat evidence/build.log; exit 1; }
          sha256sum source/probe source/probe.cpp > evidence/build.sha256
      - name: Compare native Stage55 and canonical Stage56 sauce and exact gap selection
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 786432; /usr/bin/time -v -o evidence/time.txt timeout -k 5s 90s source/probe) > evidence/stdout.txt 2> evidence/stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/exit.txt
          tail -5 evidence/stdout.txt
          cat evidence/stderr.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence");code=int((p/"exit.txt").read_text())
          rows={};modes={}
          for l in (p/"stdout.txt").read_text().splitlines():
              a=l.split("\t")
              if a[0]=="GAP":
                  mode,n,gap,offset=map(int,a[1:])
                  assert mode in (0,1,2) and n!=0 and 42<=gap<=963 and offset>=0
                  assert (mode,n) not in rows
                  rows[(mode,n)]=(gap,offset)
              elif a[0]=="MODE":
                  mode,count=int(a[1]),int(a[2])
                  assert mode not in modes
                  modes[mode]={"count":count,"seconds":float(a[3])}
          ok=code==0 and set(modes)=={0,1,2} and modes[0]["count"]>=1300 and modes[1]["count"]==modes[2]["count"]==20
          ok=ok and len(rows)==sum(m["count"] for m in modes.values()) and all(rows[(0,n)]==v for (mode,n),v in rows.items())
          ok=ok and not (p/"stderr.txt").read_text() and (p/"stdout.txt").read_text().splitlines()[-1]==f"GATE_GEOMETRY_COMPONENT_PASS\t{len(rows)}"
          out={"schema":"SOAK_V248_CELERITAS_GATE_GEOMETRY_EQUIVALENCE/1","source_commit":"408d80e43159eba06849b6a929e0010f32b9b91b","exit":code,"modes":modes,"signed_gap_questions":len(rows),"component_pass":ok,"full_sauce_semantic_fields_compared":True,"full_gap_selection_fields_compared":True,"production_geometry_cache_unchanged":True,"universal_equivalence_certified":False,"original_f_calls":0,"whole_year_credit":0,"admitted_engines":0,"STOP_NEW_NATIVE_SOAK_DISPATCH":True}
          (p/"result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v248-gate-geometry-equivalence-${{ github.run_id }}
          path: evidence/
          retention-days: 90
