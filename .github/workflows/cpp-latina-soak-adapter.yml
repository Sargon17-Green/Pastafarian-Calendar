name: Native soak vector adapter — C++ Latina

on:
  push:
    branches:
      - 'C\+\+&Latina'
    paths:
      - 'tools/soak_vector_adapter.cpp'
      - 'tools/validate_soak_index_modes.py'
      - 'include/pastafari/source_language_catalog.hpp'
      - '.github/workflows/cpp-latina-soak-adapter.yml'
      - 'docs/STAGE_56_SOAK_ADAPTER.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native GCC and Clang TSV adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install native compiler dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout 10m sudo apt-get update -qq
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libboost-dev
          test -r /usr/include/boost/multiprecision/cpp_int.hpp
      - name: Compile both independent native executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soak-output
          for compiler in g++ clang++; do
            "$compiler" -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
              -Iinclude -Itests -I. tools/soak_vector_adapter.cpp src/monster.cpp \
              -o "soak-output/adapter-$compiler"
            "soak-output/adapter-$compiler" --schema | grep -q '^PASTAFARI_SOAK_TSV_V1'
            "soak-output/adapter-$compiler" --schema-canonical | grep -q '^PASTAFARI_SOAK_CANONICAL_V2'
          done
      - name: Verify arbitrary-stream protocol and rejection semantics
        shell: bash
        run: |
          set -euo pipefail
          printf 'a01\t-15055671\t-15055671\nb02\t-15055671\t-15055670\nc03\t-15055671\t-15055671\n' > soak-output/input.tsv
          for compiler in g++ clang++; do
            timeout 35m "soak-output/adapter-$compiler" --timing-ns < soak-output/input.tsv \
              > "soak-output/output-$compiler.tsv" \
              2> "soak-output/timing-$compiler.log"
            test "$(wc -l < "soak-output/output-$compiler.tsv")" -eq 3
            test "$(grep -c '^SOAK_TIMING_NS' "soak-output/timing-$compiler.log")" -eq 3
            awk -F '\t' 'NF!=8 {exit 1} END {if(NR!=3)exit 1}' "soak-output/output-$compiler.tsv"
            sed -n '1p' "soak-output/output-$compiler.tsv" | cut -f2- > "soak-output/first-$compiler.tsv"
            sed -n '3p' "soak-output/output-$compiler.tsv" | cut -f2- > "soak-output/third-$compiler.tsv"
            cmp "soak-output/first-$compiler.tsv" "soak-output/third-$compiler.tsv"
            if printf 'bad\tABC\t0\n' | "soak-output/adapter-$compiler" > "soak-output/invalid-$compiler.stdout" 2> "soak-output/invalid-$compiler.stderr"; then
              echo 'SOAK_BAD_INPUT_ACCEPTED=FAIL'
              exit 1
            fi
            test ! -s "soak-output/invalid-$compiler.stdout"
            grep -q '^SOAK_ADAPTER_ERROR' "soak-output/invalid-$compiler.stderr"
            echo "SOAK_ADAPTER_V1=3/3_PASS COMPILER=$compiler"
          done
          cmp soak-output/output-g++.tsv soak-output/output-clang++.tsv
          # Explicit base-ten regression: Boost's cpp_int{string} treats
          # leading zeros as octal and may reject digits 8/9.
          printf 'd04\t-015055671\t-015055671\ne05\t-15055671\t-15055671\nf06\t-15055671\t-015055678\ng07\t-15055671\t-15055678\n' \
            > soak-output/decimal-regression.tsv
          for compiler in g++ clang++; do
            timeout 35m "soak-output/adapter-$compiler" \
              < soak-output/decimal-regression.tsv \
              > "soak-output/decimal-$compiler.tsv" \
              2> "soak-output/decimal-$compiler.stderr"
            test "$(wc -l < "soak-output/decimal-$compiler.tsv")" -eq 4
            sed -n '1p' "soak-output/decimal-$compiler.tsv" | cut -f2- \
              > "soak-output/decimal-pair-1a-$compiler.tsv"
            sed -n '2p' "soak-output/decimal-$compiler.tsv" | cut -f2- \
              > "soak-output/decimal-pair-1b-$compiler.tsv"
            cmp "soak-output/decimal-pair-1a-$compiler.tsv" \
              "soak-output/decimal-pair-1b-$compiler.tsv"
            sed -n '3p' "soak-output/decimal-$compiler.tsv" | cut -f2- \
              > "soak-output/decimal-pair-2a-$compiler.tsv"
            sed -n '4p' "soak-output/decimal-$compiler.tsv" | cut -f2- \
              > "soak-output/decimal-pair-2b-$compiler.tsv"
            cmp "soak-output/decimal-pair-2a-$compiler.tsv" \
              "soak-output/decimal-pair-2b-$compiler.tsv"
            echo "SOAK_ADAPTER_DECIMAL=4/4_PASS COMPILER=$compiler"
          done
          cmp soak-output/decimal-g++.tsv soak-output/decimal-clang++.tsv
          # Independently check the two protocols against the frozen 17+47
          # canonical source names. The legacy V1 output must not change.
          for compiler in g++ clang++; do
            timeout 35m "soak-output/adapter-$compiler" --canonical-indices --timing-ns \
              < soak-output/input.tsv \
              > "soak-output/numeric-$compiler.tsv" \
              2> "soak-output/numeric-timing-$compiler.log"
            test "$(grep -c '^SOAK_TIMING_NS' "soak-output/numeric-timing-$compiler.log")" -eq 3
            python3 tools/validate_soak_index_modes.py \
              include/pastafari/source_language_catalog.hpp \
              "soak-output/output-$compiler.tsv" \
              "soak-output/numeric-$compiler.tsv" 3
            timeout 35m "soak-output/adapter-$compiler" --canonical-indices \
              < soak-output/decimal-regression.tsv \
              > "soak-output/decimal-numeric-$compiler.tsv"
            python3 tools/validate_soak_index_modes.py \
              include/pastafari/source_language_catalog.hpp \
              "soak-output/decimal-$compiler.tsv" \
              "soak-output/decimal-numeric-$compiler.tsv" 4
            echo "SOAK_CANONICAL_NUMERIC_COMPILER=PASS $compiler"
          done
          cmp soak-output/numeric-g++.tsv soak-output/numeric-clang++.tsv
          cmp soak-output/decimal-numeric-g++.tsv soak-output/decimal-numeric-clang++.tsv
          echo 'SOAK_CANONICAL_CROSS_COMPILER=PASS'
          echo 'SOAK_ADAPTER_DECIMAL_CROSS_COMPILER=PASS'
          echo 'SOAK_ADAPTER_CROSS_COMPILER=PASS'
      - name: Verify fail-closed TSV transport and partial-shard invalidation
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            timeout 40m python3 tools/test_soak_adapter_rejections.py \
              "soak-output/adapter-$compiler" "$compiler" \
              | tee "soak-output/transport-rejections-$compiler.log"
          done
      - name: Verify incremental stdin/stdout exchange and telemetry correlation
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            timeout 35m python3 tools/test_soak_adapter_interactive.py \
              "soak-output/adapter-$compiler" "$compiler" \
              | tee "soak-output/interactive-$compiler.log"
          done
      - name: Validate machine-readable global-soak preflight handshake
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            timeout 35m python3 tools/soak_global_preflight.py \
              --manifest integrations/cpp-latina-soak.json \
              --adapter "soak-output/adapter-$compiler" \
              > "soak-output/preflight-$compiler.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d["ready"] is True and d["global_soak_executed"] is False' \
              "soak-output/preflight-$compiler.json"
            echo "SOAK_GLOBAL_PREFLIGHT=PASS COMPILER=$compiler"
          done
      - name: Save evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpp-latina-native-soak-adapter
          path: soak-output/
          if-no-files-found: warn
          retention-days: 30
