name: Befunge QA31BK put-owner selftest (mechanism only)
on:
  push:
    paths:
      - 'qa/stage1_qa31bk_put_owner.py'
      - '.github/workflows/befunge-qa31bk-put-owner.yml'
  workflow_dispatch:
jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile QA31BK and run two toy owner tests (not signed corpus acceptance)
        run: |
          python -m py_compile qa/stage1_qa31bk_put_owner.py
          python qa/stage1_qa31bk_put_owner.py --self-test
