name: Issue29 v201 live Ada native month-length selection (zero F)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/issue29-v201-live-lengths.yml
permissions:
  contents: read
  actions: read
jobs:
  lengths:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock sources and restore independent year certificate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4b724e5755c0483246603f78acb59b12b710bb47"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/issue29-v201-live-lengths.yml"
          mkdir -p evidence "$RUNNER_TEMP/live"
          git rev-parse HEAD > evidence/QA_HEAD.txt
          git fetch --no-tags origin d10d50383025d73ad2ce11d19d5759221d70f730
          test "$(git rev-parse FETCH_HEAD)" = "d10d50383025d73ad2ce11d19d5759221d70f730"
          test "$(git rev-parse FETCH_HEAD:src/normative_oracle.adb)" = "0be8f8ab4ddef26d34963d5567707a511ebda50b"
          test "$(git rev-parse FETCH_HEAD:src/normative_oracle.ads)" = "c4588566076798dd394feeab580ebc3d38c09744"
          git archive FETCH_HEAD src | tar -x -C "$RUNNER_TEMP/live"
          git ls-tree -r FETCH_HEAD src > evidence/source-blobs.txt
          echo "d10d50383025d73ad2ce11d19d5759221d70f730" > evidence/LIVE_HEAD.txt
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15179093713/zip > "$RUNNER_TEMP/gmp.zip"
          echo "b5a833b220ce728b99a3626fd372e73c330fe1c01bfea5be3fecaea089863420  $RUNNER_TEMP/gmp.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"])/"gmp.zip") as z:
              assert z.testzip() is None
              raw=z.read("source-word.json")
          assert hashlib.sha256(raw).hexdigest()=="76396b8dc72b209c9f273d7ebbab3c6a09b3424eff8ee71acd1566680641786e"
          word=json.loads(raw)
          assert len(word)==4244 and set(word)==set(range(1,46))
          lengths=[word.count(i) for i in range(1,46)]
          assert lengths==[115,108,119,109,106,81,115,114,117,120,98,52,81,97,121,97,115,96,107,61,106,115,119,39,84,103,115,107,55,119,97,50,122,110,81,54,101,83,88,40,25,77,98,122,105]
          Path("evidence/expected.json").write_text(json.dumps(lengths)+"\n")
          PY
      - name: Expose private selector only in temporary specification
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/live"
          cp src/normative_oracle.ads "$GITHUB_WORKSPACE/evidence/original.ads"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/normative_oracle.ads")
          s=p.read_text()
          assert s.count("end Normative_Oracle;")==1
          p.write_text("with Month_Weaving;\n"+s.replace("end Normative_Oracle;","   procedure Choose_Month_Lengths\n     (Structure_R : Sauce_Result; Total, Slots : Positive;\n      Lengths : out Month_Weaving.Natural_Array);\nend Normative_Oracle;"))
          PY
          cp src/normative_oracle.ads "$GITHUB_WORKSPACE/evidence/exposed.ads"
          test "$(git hash-object src/normative_oracle.adb)" = "0be8f8ab4ddef26d34963d5567707a511ebda50b"
          sha256sum src/normative_oracle.adb src/normative_oracle.ads > "$GITHUB_WORKSPACE/evidence/build-source.sha256"
      - name: Install GNAT and GMP bindings
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gnat-13 gprbuild libgnatcoll-gmp-dev
          dpkg-query -W gnat-13 libgnatcoll-gmp-dev libgmp10 > evidence/packages.txt
      - name: Execute native month lengths from actual Sauce
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/live"
          mkdir tests
          cat > lengths.gpr <<'GPR'
          with "gnatcoll_gmp.gpr";
          project Lengths is
             for Source_Dirs use ("src", "tests");
             for Object_Dir use "obj";
             for Exec_Dir use "bin";
             for Main use ("issue29_v201_lengths.adb");
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatW8", "-gnata", "-gnato");
             end Compiler;
          end Lengths;
          GPR
          cat > tests/issue29_v201_lengths.adb <<'ADA'
          with Ada.Text_IO;
          with Ada.Numerics.Big_Numbers.Big_Integers;
          with Normative_Oracle;
          with Month_Weaving;
          procedure Issue29_V201_Lengths is
             use Ada.Text_IO;
             use Ada.Numerics.Big_Numbers.Big_Integers;
             use Normative_Oracle;
             C : constant Big_Integer := To_Big_Integer (-15_055_671);
             T : constant Big_Integer := To_Big_Integer (-15_057_702);
             R : constant Sauce_Result := Sauce (C, T);
             Total : constant Positive := 4244;
             Low : constant Positive := (Total + 122) / 123;
             High : constant Positive := Positive'Min (47, Total / 4);
             Slots : constant Positive := Low - 1 + To_Integer
               (Choose_Rank (Ask_Bowl (R, 3, 30), To_Big_Integer (High - Low + 1)));
             L : Month_Weaving.Natural_Array (1 .. Slots);
             S : constant Answer_Stream := Ask_Bowl (R, 3, 31);
          begin
             Put_Line ("MONTH_COUNT=" & Positive'Image (Slots));
             Put_Line ("RING_FIRST=" & To_String (S.First));
             Put_Line ("RING_DIRECTION=" & Integer'Image (S.Direction_Step));
             Flush;
             Choose_Month_Lengths (R, Total, Slots, L);
             for I in L'Range loop
                Put_Line ("LENGTH=" & Natural'Image (L (I)));
             end loop;
             Put_Line ("V201_LENGTHS_COMPLETE ZERO_F=1");
          end Issue29_V201_Lengths;
          ADA
          timeout -k 5s 180s gprbuild -p -j2 -P lengths.gpr > "$GITHUB_WORKSPACE/evidence/build.log" 2>&1
          sha256sum bin/issue29_v201_lengths > "$GITHUB_WORKSPACE/evidence/binary.sha256"
          set +e
          (ulimit -v 2097152; ulimit -t 480; timeout -k 5s 510s /usr/bin/time -v -o "$GITHUB_WORKSPACE/evidence/time.txt" bin/issue29_v201_lengths) > "$GITHUB_WORKSPACE/evidence/stdout.txt" 2> "$GITHUB_WORKSPACE/evidence/stderr.txt"
          code=$?
          set -e
          echo "$code" > "$GITHUB_WORKSPACE/evidence/exit.txt"
          cat "$GITHUB_WORKSPACE/evidence/stdout.txt"
          test "$code" = 0
      - name: Compare all lengths and independently verify lexicographic rank
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math
          from functools import lru_cache
          from pathlib import Path
          e=Path("evidence")
          expected=json.loads((e/"expected.json").read_text())
          out=(e/"stdout.txt").read_text()
          assert "V201_LENGTHS_COMPLETE ZERO_F=1" in out
          fields=dict(line.split("=",1) for line in out.splitlines() if "=" in line)
          actual=[int(line.split("=",1)[1]) for line in out.splitlines() if line.startswith("LENGTH=")]
          @lru_cache(None)
          def count(total,k):
              if k==0: return int(total==0)
              s=total-4*k
              if not 0<=s<=119*k: return 0
              return sum((-1)**j*math.comb(k,j)*math.comb(s-120*j+k-1,k-1) for j in range(min(k,s//120)+1))
          n=count(4244,45)
          m=2**127-1
          first=int(fields["RING_FIRST"])
          direction=int(fields["RING_DIRECTION"])
          assert 1<=first<=m and direction in (-1,1)
          space=m
          digits=1
          while space<n:
              space*=m
              digits+=1
          wide=1+sum(((first-1+direction*j)%m)*m**j for j in range(digits))
          limit=space//n*n
          if wide>limit: wide=limit if direction==-1 else 1
          selected=(wide-1)%n+1
          rank=1
          remaining=4244
          for i,x in enumerate(actual):
              rank+=sum(count(remaining-y,44-i) for y in range(4,x))
              remaining-=x
          checks={"lengths":actual==expected,"count":len(actual)==45==int(fields["MONTH_COUNT"]),"sum":sum(actual)==4244,"bounds":all(4<=x<=123 for x in actual),"independent_rank":rank==selected,"ring_regression":first==152123056961069897844627847530821202182 and direction==-1}
          result={"schema":"ISSUE29_V201_LENGTHS/1","checks":checks,"matched":sum(a==b for a,b in zip(actual,expected)),"actual":actual,"expected":expected,"family_count":str(n),"selected_rank":str(selected),"actual_rank":str(rank),"calendar_calls":0,"year_length_input_frozen":True,"whole_year_credit":0}
          (e/"result.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result))
          assert all(checks.values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue29-v201-lengths-${{ github.run_id }}
          path: evidence/
          retention-days: 30
