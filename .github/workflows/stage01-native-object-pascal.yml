name: Stage 1 Native Object Pascal

on:
  push:
    branches:
      - 'Object-Pascal\+Português'
    paths:
      - '.github/workflows/stage01-native-object-pascal.yml'
      - 'src/**'
      - 'test/**'
      - 'DEVELOPMENT_STAGE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage01-native-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout this commit
        uses: actions/checkout@v4

      - name: Install Free Pascal compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fp-compiler

      - name: Compile and execute Stage 1 test suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "UTC_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "COMPILER=$(command -v fpc)"
            fpc -iV
            cd test
            set +e
            sh build_and_run_stage01.sh
            stage01_status=$?
            sh build_and_run_cutlet_bounds.sh
            cutlet_status=$?
            sh build_and_run_bounded_composition_bounds.sh
            composition_status=$?
            sh build_and_run_bigint_bounds.sh
            bigint_status=$?
            sh build_and_run_bigint_divmod.sh
            divmod_status=$?
            sh build_and_run_bigint_signed.sh
            signed_status=$?
            sh build_and_run_bigint_input_contract.sh
            input_contract_status=$?
            sh build_and_run_bigint_conversion_exact.sh
            conversion_status=$?
            sh build_and_run_bigint_scalar_square.sh
            scalar_square_status=$?
            sh build_and_run_bigint_divmod_long.sh
            divmod_long_status=$?
            sh build_and_run_bigint_regular_mod_signed.sh
            regular_mod_signed_status=$?
            sh build_and_run_bigint_multiply_long.sh
            multiply_long_status=$?
            sh build_and_run_bigint_add_sub_long.sh
            add_sub_long_status=$?
            sh build_and_run_bigint_scalar_signed.sh
            scalar_signed_status=$?
            sh build_and_run_bigint_scalar_multiply_signed.sh
            scalar_multiply_signed_status=$?
            echo "STAGE01_EXIT=$stage01_status"
            echo "CUTLET_BOUNDS_EXIT=$cutlet_status"
            echo "COMPOSITION_BOUNDS_EXIT=$composition_status"
            echo "BIGINT_BOUNDS_EXIT=$bigint_status"
            echo "BIGINT_DIVMOD_EXIT=$divmod_status"
            echo "BIGINT_SIGNED_EXIT=$signed_status"
            echo "BIGINT_INPUT_CONTRACT_EXIT=$input_contract_status"
            echo "BIGINT_CONVERSION_EXIT=$conversion_status"
            echo "BIGINT_SCALAR_SQUARE_EXIT=$scalar_square_status"
            echo "BIGINT_DIVMOD_LONG_EXIT=$divmod_long_status"
            echo "BIGINT_REGULAR_MOD_SIGNED_EXIT=$regular_mod_signed_status"
            echo "BIGINT_MULTIPLY_LONG_EXIT=$multiply_long_status"
            echo "BIGINT_ADD_SUB_LONG_EXIT=$add_sub_long_status"
            echo "BIGINT_SCALAR_SIGNED_EXIT=$scalar_signed_status"
            echo "BIGINT_SCALAR_MULTIPLY_SIGNED_EXIT=$scalar_multiply_signed_status"
            if [ "$stage01_status" -ne 0 ] || [ "$cutlet_status" -ne 0 ] || [ "$composition_status" -ne 0 ] || [ "$bigint_status" -ne 0 ] || [ "$divmod_status" -ne 0 ] || [ "$signed_status" -ne 0 ] || [ "$input_contract_status" -ne 0 ] || [ "$conversion_status" -ne 0 ] || [ "$scalar_square_status" -ne 0 ] || [ "$divmod_long_status" -ne 0 ] || [ "$regular_mod_signed_status" -ne 0 ] || [ "$multiply_long_status" -ne 0 ] || [ "$add_sub_long_status" -ne 0 ] || [ "$scalar_signed_status" -ne 0 ] || [ "$scalar_multiply_signed_status" -ne 0 ]; then
              exit 1
            fi
          } 2>&1 | tee evidence/stage01-native-fpc.log

      - name: Preserve native execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage01-native-fpc-log
          path: evidence/stage01-native-fpc.log
          if-no-files-found: warn
          retention-days: 30
