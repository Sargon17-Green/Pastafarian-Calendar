name: Befunge QA20 Natural Native IP Route Coverage for 21 Source Cells
on:
  push:
    branches: ['qa-befunge98-stage1-order-isolation-20261008']
    paths:
      - 'qa/stage1_qa20_native_input_route_scan.py'
      - 'qa/stage1_qa20_native_route_receipt_audit.py'
      - '.github/workflows/befunge-stage1-qa20-native-input-route-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-natural-native-route-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify immutable production and independent executable native oracle SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = 560d6aa5807a7f766213a33835cce85eab0fa40c
          test "$(git hash-object reference/work_counts.b98)" = f941efc793c9eee4accf5d03873f8ed029b16725
          test "$(git hash-object reference/save.b98)" = 7b5e79aa6e2bfb636717cb018a3db6a13fb2bb44
          python3 -m py_compile qa/stage1_qa20_native_input_route_scan.py qa/stage1_qa20_native_route_receipt_audit.py
          python3 qa/stage1_qa20_native_route_receipt_audit.py --selftest
      - name: Retrieve source-pinned QA18 21 candidate cells
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa20-out" "$RUNNER_TEMP/qa20-original"
          test "$(gh run view 39423789058 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '.conclusion + ":" + .headSha')" = 'success:6fbc0828c4ef78affb3899f5924e57e0a0025ed5'
          gh run download 39423789058 --repo "$GITHUB_REPOSITORY" --name qa18-native-source-glyph-physical-contact --dir "$RUNNER_TEMP/qa20-original"
          test -s "$RUNNER_TEMP/qa20-original/qa18_glyph_roles.json"
          echo '263a73a40afa17a8a9b1c831a01239be671d9ea0a9c331fd3f725f83cf1cfea7' > "$RUNNER_TEMP/expected-qa18-sha"
          test "$(sha256sum "$RUNNER_TEMP/qa20-original/qa18_glyph_roles.json" | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/expected-qa18-sha")"
          cp "$RUNNER_TEMP/qa20-original/qa18_glyph_roles.json" "$RUNNER_TEMP/qa20-out/qa18_glyph_roles.json"
      - name: Fetch SHA-256-locked PyFunge 0.5-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Execute 12 unmodified PyFunge-98 programs and independently referenced results
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -e PYTHONPATH=/work/qa \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -v "$RUNNER_TEMP/qa20-out:/qa20" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 1450s python -u qa/stage1_qa20_native_input_route_scan.py ${{ matrix.shard }} /qa20 /qa20/qa18_glyph_roles.json
            '
          test -s "$RUNNER_TEMP/qa20-out/qa20_manifest.json"
      - name: Independent native raw step replay and receipt SHA validation
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/stage1_qa20_native_route_receipt_audit.py --shard ${{ matrix.shard }} \
            --directory "$RUNNER_TEMP/qa20-out" --qa18 "$RUNNER_TEMP/qa20-out/qa18_glyph_roles.json" \
            --output "$RUNNER_TEMP/qa20-out/qa20_shard_audit.json" | tee "$RUNNER_TEMP/qa20-out/qa20_audit.log"
          grep -q QA20_TWELVE_RAW_NATIVE_ROUTE_RECEIPTS_PASS "$RUNNER_TEMP/qa20-out/qa20_audit.log"
      - name: Preserve raw Native executed IP route evidence (GREEN or RED)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa20-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/qa20-out/
          if-no-files-found: warn
  cross-shard-independent-audit:
    needs: [independent-natural-native-route-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download four original shard receipts from this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa20-merged"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'qa20-shard-*' --dir "$RUNNER_TEMP/qa20-merged"
          for i in 0 1 2 3; do test -s "$RUNNER_TEMP/qa20-merged/qa20-shard-$i/qa20_shard_audit.json"; done
      - name: Independently enforce 48 exact Native cases and assess 21 reachable cells
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/stage1_qa20_native_route_receipt_audit.py \
            --aggregate "$RUNNER_TEMP/qa20-merged/qa20-shard-0" "$RUNNER_TEMP/qa20-merged/qa20-shard-1" \
              "$RUNNER_TEMP/qa20-merged/qa20-shard-2" "$RUNNER_TEMP/qa20-merged/qa20-shard-3" \
            --qa18 "$RUNNER_TEMP/qa20-merged/qa20-shard-0/qa18_glyph_roles.json" \
            --output qa20_native_48_aggregate.json | tee qa20_aggregate.log
          grep -q QA20_FORTY_EIGHT_REAL_NATIVE_NATURAL_ROUTE_RECEIPTS_PASS qa20_aggregate.log
          grep -q QA20_NO_DEAD_CODE_INFERENCE_STAGE1_OPEN qa20_aggregate.log
      - name: Upload merged finite geometric coverage result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa20-48-case-natural-route-aggregate
          path: |
            qa20_native_48_aggregate.json
            qa20_aggregate.log
          if-no-files-found: warn
