name: V Amharic Stage31 numeric full-date Native smoke

on:
  push:
    branches:
      - 'V\+አማርኛ'
    paths:
      - 'pastafari/**'
      - '.github/workflows/v-amharic-patch15-native-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned prebuilt V 0.5.2 for Linux x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v-release"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip \
            --output "$RUNNER_TEMP/v-release/v_linux.zip"
          echo '86caf9e70c3342d48ef19eb4f6c47b709f18c90ae86255520d5c29df6b482e23  '"$RUNNER_TEMP"'/v-release/v_linux.zip' | sha256sum -c -
          unzip -q "$RUNNER_TEMP/v-release/v_linux.zip" -d "$RUNNER_TEMP/v-release"
          vbin=$(find "$RUNNER_TEMP/v-release" -type f -name v -print -quit)
          test -n "$vbin"
          chmod +x "$vbin"
          "$vbin" version
          echo "$(dirname "$vbin")" >> "$GITHUB_PATH"
      - name: Record exact toolchain and source SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/native-v
          git rev-parse HEAD | tee qa/native-v/head.txt
          v version | tee qa/native-v/v-version.txt
          test -f pastafari/patch15_numeric_date_native_smoke_test.v
          test -f pastafari/patch15_numeric_date.v
      - name: Call actual five-field date API for foundation pair
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            v test pastafari/patch15_numeric_date_native_smoke_test.v \
            2>&1 | tee qa/native-v/patch15-foundation.log
      - name: Preserve PASS or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v-amharic-patch15-native-smoke-evidence
          path: qa/native-v/
          if-no-files-found: warn
          retention-days: 30
