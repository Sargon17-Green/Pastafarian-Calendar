name: APL German NARS LX test with publisher-font prepared ephemeral CI (NOT Stage1)
on:
  push:
    branches:
      - qa/apl-german-nars-interface-20261116
    paths:
      - '.github/workflows/apl-german-font-prepared-native-lx.yml'
      - 'qa/nars-interface/bootstrap_exact_nars.ps1'
      - 'qa/nars-interface/lx_workspace_probe.py'
      - 'qa/nars-interface/test_lx_workspace_probe.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-setup-font-and-native-lx:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: apl-german-sha-pinned-nars-installer-for-offline-analysis
          run-id: 44372361730
          github-token: ${{ github.token }}
          path: pinned_release
      - name: Prepare four-file version-pinned runtime and install verified font only inside CI
        shell: pwsh
        run: ./qa/nars-interface/bootstrap_exact_nars.ps1 -Evidence font_bootstrap_evidence -Runtime verified_runtime
      - name: Test original LX workspace generator
        shell: pwsh
        run: python -m unittest discover -s qa/nars-interface -p 'test_lx_workspace_probe.py' -v
      - name: Run exact native LX canary without GUI automation
        shell: pwsh
        run: ./qa/nars-interface/bounded_extracted_lx.ps1 -Runtime verified_runtime -Evidence native_lx_evidence
      - name: Diagnose post-font NARS startup if LX receipt is absent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Get-Content 'native_lx_evidence/native_lx_canary.json' -Raw | ConvertFrom-Json
          if ($native.status -ne 'NATIVE_LX_SMOKE_PASS_NOT_STAGE01') {
            ./qa/nars-interface/diagnose_lx_startup.ps1 -Runtime verified_runtime -Evidence workspace_launch_evidence
          } else {
            New-Item -ItemType Directory -Force -Path workspace_launch_evidence | Out-Null
            "Native canary confirmed; no repeat diagnostic" | Set-Content -Encoding utf8 workspace_launch_evidence/skipped.txt
          }
      - name: Collect metadata evidence (no fonts, no binaries)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force font_bootstrap_evidence,native_lx_evidence,workspace_launch_evidence | Out-Null
          Get-ChildItem font_bootstrap_evidence,native_lx_evidence,workspace_launch_evidence -File | Sort-Object FullName | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.FullName.Replace((Get-Location).Path + '\',''))"
          } | Set-Content -Encoding utf8 font_native_evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apl-german-exact-font-prepared-lx-evidence-not-stage1
          path: |
            font_bootstrap_evidence/
            native_lx_evidence/
            workspace_launch_evidence/
            font_native_evidence.sha256
          retention-days: 14
