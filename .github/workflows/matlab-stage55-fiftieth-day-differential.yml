name: MATLAB Stage55 Fiftieth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_fiftieth_native.m'
      - 'tools/stage55_after50_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-fiftieth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-fiftieth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  fiftieth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER49 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-forty-ninth-day-differential
          run-id: 44819539782
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER49
        run: |
          echo 'b84587ee91ec0a2b18cdcbc516fe6099fa02716bdf88789f80a13fe94b2a4e88  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_49.json' | sha256sum -c -
      - name: Preflight AFTER50 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after50_interval_five_fields.py
          grep -Fqx 'PIN = "b84587ee91ec0a2b18cdcbc516fe6099fa02716bdf88789f80a13fe94b2a4e88"' tools/stage55_after50_interval_five_fields.py
          python3 -m py_compile tools/stage55_after50_interval_five_fields.py
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_49.json' tools/run_stage55_year5000_fiftieth_native.m
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_50.json' tools/run_stage55_year5000_fiftieth_native.m
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native fiftieth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_fiftieth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after50_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_49.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_50.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_FIFTIETH_PYTHON.log
          grep '^STAGE55_FIFTIETH_ROW ' logs/STAGE55_FIFTIETH_PYTHON.log > logs/STAGE55_FIFTIETH_PYTHON_ROW.txt
          grep '^STAGE55_FIFTIETH_ROW ' logs/STAGE55_FIFTIETH_NATIVE.log > logs/STAGE55_FIFTIETH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_FIFTIETH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_FIFTIETH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_FIFTIETH_PYTHON_ROW.txt logs/STAGE55_FIFTIETH_NATIVE_ROW.txt
          expected="STAGE55_FIFTIETH_ROW POSITION=50 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=50 MONTH_INDEX=12 MONTH_DAY=2"
          grep -Fqx "$expected" logs/STAGE55_FIFTIETH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_FIFTIETH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_50.json | tee logs/STAGE55_FIFTIETH_DIGEST.txt
          echo 'STAGE55_FIFTIETH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-fiftieth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_49.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_50.json
            logs/STAGE55_FIFTIETH_NATIVE.log
            logs/STAGE55_FIFTIETH_PYTHON.log
            logs/STAGE55_FIFTIETH_PYTHON_ROW.txt
            logs/STAGE55_FIFTIETH_NATIVE_ROW.txt
            logs/STAGE55_FIFTIETH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
