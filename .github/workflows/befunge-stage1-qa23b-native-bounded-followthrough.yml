name: Befunge QA23B Native Four Unfinished Mutant Followthrough
on:
  push:
    branches: ['qa-befunge98-stage1-order-isolation-20261008']
    paths:
      - 'qa/stage1_qa23b_native_bounded_followthrough.py'
      - 'qa/stage1_qa23b_independent_bounded_audit.py'
      - '.github/workflows/befunge-stage1-qa23b-native-bounded-followthrough.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-four-unfinished-qa22-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lock exact 2D production blob and syntax-check both auditors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = 560d6aa5807a7f766213a33835cce85eab0fa40c
          python3 -m py_compile qa/stage1_qa23b_native_bounded_followthrough.py qa/stage1_qa23b_independent_bounded_audit.py
          test -f qa/stage1_qa22_native_mutant_continuations.py
      - name: Retrieve accepted unmodified QA22 Native receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa23b"
          test "$(gh run view 39774061424 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '.conclusion + ":" + .headSha')" = 'success:72b1be429d6e55523692659fff49627d7e06e27a'
          gh run download 39774061424 --repo "$GITHUB_REPOSITORY" --name qa22-native-mutant-output-followthrough --dir "$RUNNER_TEMP/qa23b"
          echo "ff85b07dab957de7a97ac32d917ed72f458a0a1ef1827b2744be176debf9d554  $RUNNER_TEMP/qa23b/qa22_native_continuations.json" | sha256sum -c -
          echo "aef9d33debba740f5ad24f1d272d016725aed0ee78100a55b65769ce5a68a681  $RUNNER_TEMP/qa23b/qa21_original_witnesses.json" | sha256sum -c -
      - name: Pin actual PyFunge 0.5-rc2 native interpreter
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Fresh actual Native execution at all four exact original input-origin mutation sites
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -e PYTHONPATH=/work/qa \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -v "$RUNNER_TEMP/qa23b:/qa23b" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 1400s python -u \
                qa/stage1_qa23b_native_bounded_followthrough.py \
                /qa23b/qa21_original_witnesses.json \
                /qa23b/qa22_native_continuations.json /qa23b
            ' | tee "$RUNNER_TEMP/qa23b/qa23b_native_console.log"
          grep -q QA23B_FOUR_PENDING_NATIVE_MUTANTS_REPLAYED_AND_BOUNDED "$RUNNER_TEMP/qa23b/qa23b_native_console.log"
          test -s "$RUNNER_TEMP/qa23b/qa23b_native_continuations.json"
      - name: Independently verify bounded continuations and adversarial report rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/stage1_qa23b_independent_bounded_audit.py \
            "$RUNNER_TEMP/qa23b/qa22_native_continuations.json" \
            "$RUNNER_TEMP/qa23b/qa23b_native_continuations.json" \
            "$RUNNER_TEMP/qa23b/qa23b_independent_audit.json" | tee "$RUNNER_TEMP/qa23b/qa23b_independent_audit.log"
          grep -q QA23B_ELEVEN_FORGED_RECEIPTS_REJECTED "$RUNNER_TEMP/qa23b/qa23b_independent_audit.log"
          grep -q QA23B_NO_INFINITE_LOOP_OR_GLOBAL_STAGE1_CERTIFICATE "$RUNNER_TEMP/qa23b/qa23b_independent_audit.log"
      - name: Retain original input, raw Native evidence and independent receipt audit on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa23b-four-original-native-counterfactuals
          path: ${{ runner.temp }}/qa23b/
          if-no-files-found: warn
