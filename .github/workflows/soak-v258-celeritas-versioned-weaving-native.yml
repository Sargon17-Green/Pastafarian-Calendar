name: Soak v258 version exact v256 weaving optimization and verify native (not soak)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v258-celeritas-versioned-weaving-native.yml
permissions:
  contents: write
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind prior native evidence and immutable candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "140bbc72ad7144c5fdb428fe7f3791115a1b4fae"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v258-celeritas-versioned-weaving-native.yml"
          mkdir -p evidence source/src source/include/pastafari
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15263702124/zip > v257.zip
          echo "5a9e680157927e40652159ad32415d5c01934c04413ccdf003a50943a08800f2  v257.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15262833835/zip > v256.zip
          echo "3acf908d8c4382120f5f7b06bf609ac99ff0fce9a255644e691db6d87f38f771  v256.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15263230420/zip > v255.zip
          echo "e05ca2924ca02ada882a5d936d0f0c9a9ec6f83f40c0d634e4b27b82b12bc25e  v255.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15262383754/zip > v254.zip
          echo "66ad3cb52a99490c97df9d391e60db242337c5fc8c318700680ade4cc452520b  v254.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15262117547/zip > v253.zip
          echo "9cab9e052261b2f5e6f2a122151de8c7e9d5124cd48bf73a8651ebb6b690e47c  v253.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15259858850/zip > v252.zip
          echo "470ddff96d7d17d69a00f9cff3c7d820707a0467f491a8d56b27d0206497ebc7  v252.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15236391680/zip > v243.zip
          echo "7f2c5f235d44f5fc967216026005917dca7619acd8e95e43140ea50299175a0b  v243.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib,zipfile,subprocess
          from pathlib import Path
          def load(v):
              with zipfile.ZipFile(f"v{v}.zip") as z:
                  assert z.testzip() is None
                  return json.loads(z.read("result.json"))
          a,b=load(252),load(243)
          previous=load(253)
          prof=load(254)
          assert prof["schema"]=="SOAK_V254_ANCHOR_WINDOW_AB/1" and prof["comparison_completed"] and prof["source_commit"]==a["candidate_commit"]
          assert previous["schema"]=="SOAK_V253_PERSISTENT_MIXED_ANCHORS/1" and previous["comparison_pass"] and previous["candidate_commit"]==a["candidate_commit"]
          ref="87868f6fd4176dc0a94a8a6787e1c2b0e8d3e065"
          assert a["schema"]=="SOAK_V252_VERSIONED_SHARED_GATE_NATIVE/1" and a["versioned_candidate_pass"] and a["candidate_commit"]==ref
          assert b["schema"]=="SOAK_V243_CELERITAS_VERSIONED_INTERVAL/1" and b["versioned_candidate_pass"] and b["candidate_commit"]=="408d80e43159eba06849b6a929e0010f32b9b91b"
          assert a["whole_year_credit"]==b["whole_year_credit"]==0
          frozen={}
          for r in b["rows"]+a["rows"]:
              k=(r["c"],r["t"])
              val={"fields":r["fields"],"raw_names":r["raw_names"]}
              if k in frozen:assert frozen[k]==val
              frozen[k]=val
          assert len(frozen)==11
          # Interleave anchors and years before first-ever adjacent / boundary calls.
          sequence=[
            ("initial",739617,739617),
            ("changed_c",739618,739618),
            ("return_adjacent",739617,739618),
            ("previous_year",739617,739528),
            ("return_first",739617,739529),
            ("next_year",739617,744004),
            ("return_last",739617,744003),
            ("negative_date",-377237,-377237),
            ("remote_date",6875993,6875993),
            ("negative_adjacent",-377237,-377236),
            ("remote_adjacent",6875993,6875994),
            ("repeat_original",739617,739617),
            ("repeat_changed_c",739618,739618),
            ("repeat_previous_year",739617,739528),
          ]
          assert set((c,t) for _,c,t in sequence)==set(frozen)
          Path("source/cases.tsv").write_text("".join(f"{label}\t{c}\t{t}\n" for label,c,t in sequence))
          Path("evidence/frozen.json").write_text(json.dumps([{"label":label,"c":c,"t":t,**frozen[c,t]} for label,c,t in sequence],indent=2)+"\n")
          pins={"src/monster.cpp":"9a09f53c4bb54fa3e3861677bd0d367b7d4d5f78","include/pastafari/monster.hpp":"4c24d36e3704dd10ecf5420e7bc11a3da958d441","include/pastafari/source_language_catalog.hpp":"9f204d93166b2c33532bb236bc2bd929252f27be"}
          files={}
          for p,h in pins.items():
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/Sargon17-Green/Pastafarian-Calendar/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\x00"+raw).hexdigest()==h
              Path("source",p).write_bytes(raw)
              files[p]={"blob":h,"sha256":hashlib.sha256(raw).hexdigest()}
          Path("evidence/source-pins.json").write_text(json.dumps({"commit":ref,"files":files},indent=2)+"\n")
          PY
      - name: Reconstruct and verify exact v256 small-divisor variant
        run: |
          set -euo pipefail
          (
            if ! printf '#include <boost/multiprecision/cpp_int.hpp>\nint main(){}\n' | g++ -std=c++17 -x c++ -fsyntax-only -; then
              timeout -k 5s 120s sudo apt-get update -qq
              timeout -k 5s 120s sudo apt-get install -y --no-install-recommends libboost-dev
            fi
            g++ --version
          ) > evidence/compiler.txt 2>&1
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path("qa/issue29/archive/v207/v201.zip")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="fc9828a2722fa6c84c82d442d6ec409e7e34a2bb9c81de211fd04fdad0095f22"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              data=json.loads(z.read("result.json"))
          assert data["schema"]=="ISSUE29_V201_LENGTHS/1" and data["actual"]==data["expected"] and data["matched"]==45
          L=data["actual"]
          assert len(L)==45 and sum(L)==4244 and all(isinstance(x,int) and x>=2 for x in L)
          Path("source/lengths.txt").write_text(" ".join(map(str,L))+"\n")
          Path("evidence/lengths.json").write_text(json.dumps(data,indent=2)+"\n")
          s=Path("source/src/monster.cpp").read_text()
          begin=s.index("class FastLegalMonthWeavingCounterInternal {")
          end=s.index("\nbool legalMonthWeavingRowInternal",begin)
          old=s[begin:end]
          a="""            bool chosen = false;
                      for (int monthId = 1; monthId <= monthCount_; ++monthId) {"""
          # Match original indentation explicitly.
          a="            bool chosen = false;\n            for (int monthId = 1; monthId <= monthCount_; ++monthId) {"
          b="""            bool chosen = false;
                      const bool useRatios = accelerationsOn() && !fullHistoricalValidationOn();
                      std::vector<Integer> activeBlocks;
                      if (useRatios) activeBlocks = qaActiveBlocks(state);
                      for (int monthId = 1; monthId <= monthCount_; ++monthId) {"""
          c="                const Integer block = countState(next);"
          d="""                const Integer block =
                              (useRatios && monthId <= state.openedUpTo)
                                  ? activeBlocks.at(static_cast<std::size_t>(monthId-1))
                                  : countState(next);"""
          m="    Integer countState(const LegalMonthWeavingStateInternal& state) {"
          helper="""    // All legal decrements of already-open labels share the same
              // suffix table entry. Compute the common active-extension product
              // once, then update each binomial factor by its exact ratio.
              std::vector<Integer> qaActiveBlocks(const LegalMonthWeavingStateInternal& state) {
                  std::vector<Integer> blocks(static_cast<std::size_t>(monthCount_));
                  std::vector<int> prefix(static_cast<std::size_t>(monthCount_));
                  int active=0;
                  Integer extensions=1;
                  for(int id=state.closedUpTo+1;id<=state.openedUpTo;++id){
                      const std::size_t i=static_cast<std::size_t>(id-1);
                      const int r=state.remaining.at(i);
                      if(r<=0) throw BaseValidationError("QA corrupt active state");
                      prefix[i]=active;
                      extensions*=binomial(active+r-1,r-1);
                      active+=r;
                  }
                  if(active==0)return blocks;
                  const Integer common=extensions*suffixPerFixedActive_.at(
                      static_cast<std::size_t>(state.openedUpTo)).at(static_cast<std::size_t>(active-1));
                  Integer numerator=1,denominator=1;
                  for(int id=state.openedUpTo;id>state.closedUpTo;--id){
                      const std::size_t i=static_cast<std::size_t>(id-1);
                      const int r=state.remaining.at(i),p=prefix[i];
                      if(r>1){
                          blocks[i]=(common*numerator*(r-1))/(denominator*(p+r-1));
                      }else if(id==state.closedUpTo+1){
                          // Closing the first active singleton deletes its
                          // unit binomial factor. Later factors still shift.
                          blocks[i]=(common*numerator)/denominator;
                      }
                      // For a decrement of an earlier label, this factor
                      // changes C(p+r-1,r-1) to C(p+r-2,r-1).
                      // The first active label has no earlier active label.
                      if(id>state.closedUpTo+1){
                          numerator*=p;
                          denominator*=p+r-1;
                      }
                  }
                  return blocks;
              }

          """
          variant=old
          for x,y in [(a,b),(c,d),(m,helper+m)]:
              assert variant.count(x)==1,x
              variant=variant.replace(x,y)
          reverse=variant.replace(helper+m,m).replace(d,c).replace(b,a)
          assert reverse==old
          prior_variant=s[:begin]+variant+s[end:]
          with zipfile.ZipFile("v255.zip") as z:
              assert z.testzip() is None
              prev=json.loads(z.read("result.json"))
              pin=json.loads(z.read("ab-source.json"))
          assert prev["schema"]=="SOAK_V255_WEAVING_ACTIVE_RATIOS_AB/1" and prev["comparison_completed"] and prev["full_words_equal"]
          assert prev["source_commit"]=="87868f6fd4176dc0a94a8a6787e1c2b0e8d3e065"
          assert hashlib.sha256(prior_variant.encode()).hexdigest()==pin["variant_sha256"]
          start=variant.index("        const Integer common=extensions*suffixPerFixedActive_.at(") if "        const Integer common=extensions*suffixPerFixedActive_.at(" in variant else -1
          # Use exact trimmed anchor lines, retain prior surrounding source.
          lines=variant.splitlines(keepends=True)
          lo=[i for i,l in enumerate(lines) if l.strip()=="const Integer common=extensions*suffixPerFixedActive_.at("]
          hi=[i for i,l in enumerate(lines) if l.strip()=="return blocks;"]
          assert len(lo)==1 and len(hi)==1 and hi[0]>lo[0]
          replacement="""        Integer tail=extensions*suffixPerFixedActive_.at(
              static_cast<std::size_t>(state.openedUpTo)).at(static_cast<std::size_t>(active-1));
          for(int id=state.openedUpTo;id>state.closedUpTo;--id){
              const std::size_t i=static_cast<std::size_t>(id-1);
              const int r=state.remaining.at(i),p=prefix[i];
              const int divisor=p+r-1;
              if(r>1){
                  blocks[i]=tail;
                  blocks[i]*=r-1;
                  blocks[i]/=divisor;
              }else if(id==state.closedUpTo+1){
                  blocks[i]=tail;
              }
              // tail contains the original integer binomial factor for this
              // label. Its substitution is exact before the next step.
              if(id>state.closedUpTo+1 && r>1){
                  tail*=p;
                  tail/=divisor;
              }
          }
          """
          # Python indentation in the string is harmless C++ whitespace.
          variant="".join(lines[:lo[0]])+replacement+"".join(lines[hi[0]:])
          v=s[:begin]+variant+s[end:]
          Path("evidence/v255-reference.json").write_text(json.dumps({"small":prev["modes"]["base"]["small"],"count_sha256":prev["modes"]["base"]["count_sha256"],"rows":[{k:x[k] for k in ("fraction","rank","word_sha256")} for x in prev["modes"]["base"]["rows"]]},indent=2)+"\n")
          with zipfile.ZipFile("v256.zip") as z:
              assert z.testzip() is None
              previous256=json.loads(z.read("result.json"))
              pin256=json.loads(z.read("ab-source.json"))
          assert previous256["schema"]=="SOAK_V256_WEAVING_SMALL_DIVISORS_AB/1" and previous256["comparison_completed"] and previous256["full_words_equal"]
          assert previous256["source_commit"]=="87868f6fd4176dc0a94a8a6787e1c2b0e8d3e065"
          assert hashlib.sha256(s.encode()).hexdigest()==pin256["original_sha256"]
          assert hashlib.sha256(v.encode()).hexdigest()==pin256["variant_sha256"]
          with zipfile.ZipFile("v257.zip") as z:
              assert z.testzip() is None
              prior257=json.loads(z.read("result.json"))
              pin257=json.loads(z.read("ab-source.json"))
          assert prior257["schema"]=="SOAK_V257_WEAVING_FULL_API_AB/1" and prior257["comparison_completed"] and prior257["qa_variant_uninstrumented"]
          assert prior257["source_commit"]==pin257["base_commit"]=="87868f6fd4176dc0a94a8a6787e1c2b0e8d3e065"
          assert pin257["variant_sha256"]==pin256["variant_sha256"]==hashlib.sha256(v.encode()).hexdigest()
          assert pin257["original_sha256"]==pin256["original_sha256"]==hashlib.sha256(s.encode()).hexdigest()
          Path("evidence/v256-reference.json").write_text(json.dumps({"small":previous256["modes"]["base"]["small"],"count_sha256":previous256["modes"]["base"]["count_sha256"],"rows":[{k:x[k] for k in ("fraction","rank","word_sha256")} for x in previous256["modes"]["base"]["rows"]]},indent=2)+"\n")
          Path("source/src/base.cpp").write_text(s)
          Path("source/src/variant.cpp").write_text(v)
          Path("evidence/ab-source.json").write_text(json.dumps({"base_commit":"87868f6fd4176dc0a94a8a6787e1c2b0e8d3e065","original_sha256":pin256["original_sha256"],"variant_sha256":pin256["variant_sha256"],"exact_v256_variant":True,"qa_bridge_removed":True},indent=2)+"\n")
          PY
      - name: Publish byte-identical variant to guarded QA candidate branch only
        run: |
          set -euo pipefail
          branch=qa/celeritas-short-rejection-v235-20261127
          old=87868f6fd4176dc0a94a8a6787e1c2b0e8d3e065
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$old"
          git fetch --no-tags origin "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$old"
          git worktree add --detach candidate "$old"
          test "$(git -C candidate rev-parse HEAD:src/monster.cpp)" = 9a09f53c4bb54fa3e3861677bd0d367b7d4d5f78
          cmp candidate/src/monster.cpp source/src/base.cpp
          cp source/src/variant.cpp candidate/src/monster.cpp
          test "$(git -C candidate diff --name-only)" = src/monster.cpp
          git -C candidate diff --check
          git -C candidate diff -- src/monster.cpp > evidence/candidate.diff
          git -C candidate config user.name "github-actions[bot]"
          git -C candidate config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C candidate add src/monster.cpp
          git -C candidate commit -m "qa(celeritas): version exact v256 small-divisor weaving optimization validated in v257"
          new="$(git -C candidate rev-parse HEAD)"
          test "$(git -C candidate rev-parse HEAD^)" = "$old"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$old"
          git -C candidate push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$new"
          printf '%s\n' "$new" | tee evidence/candidate-commit.txt
          git -C candidate rev-parse HEAD^{tree} | tee evidence/candidate-tree.txt
          git -C candidate rev-parse HEAD:src/monster.cpp | tee evidence/candidate-blob.txt
          git -C candidate show HEAD:src/monster.cpp > source/src/versioned.cpp
          cmp source/src/versioned.cpp source/src/variant.cpp
          sha256sum source/src/versioned.cpp | tee evidence/versioned-source.sha256
      - name: Compile exact versioned public API and separate component probe
        run: |
          set -euo pipefail
          cat > source/probe.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include "pastafari/source_language_catalog.hpp"
          #include <chrono>
          #include <iostream>
          #include <stdexcept>
          #include <string>
          using namespace pastafari;
          std::size_t ci(const std::string& n){for(const auto& x:CUTLET_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("cutlet");}
          std::size_t mi(const std::string& n){for(const auto& x:MONTH_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("month");}
          int main(){
              resetPersistentScarVaultsDiagnostic();
              setAccelerationScarsEnabled(true);
              setFullHistoricalAccelerationValidation(false);
              std::string label,cs,ts;
              int count=0;
              while(std::cin>>label>>cs>>ts){
                  const Integer c{cs},t{ts};
                  const auto before=persistentScarMetricsDiagnostic();
                  const auto start=std::chrono::steady_clock::now();
                  const auto a=calendarDateSpaghetti(c,t);
                  const auto after=persistentScarMetricsDiagnostic();
                  const double seconds=std::chrono::duration<double>(std::chrono::steady_clock::now()-start).count();
                  std::cout<<"DATE\t"<<label<<"\t"<<c<<"\t"<<t<<"\t"<<seconds<<"\t"<<a.yearNumber<<"\t"<<ci(a.cutletName)<<"\t"<<a.dayInCutlet<<"\t"<<mi(a.monthName)<<"\t"<<a.dayInMonth<<"\t"<<a.cutletName<<"\t"<<a.monthName<<"\t"<<after.patch28GateCalculated-before.patch28GateCalculated<<"\t"<<after.patch28GateResurrection-before.patch28GateResurrection<<"\t"<<after.patch27AncestralHit-before.patch27AncestralHit<<"\t"<<after.patch39FinalResultHit-before.patch39FinalResultHit<<std::endl;
                  ++count;
              }
              if(!std::cin.eof()||count!=14)return 2;
              std::cout<<"PERSISTENT_DONE\t"<<count<<std::endl;
          }
          CPP
          cat > source/component.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include <algorithm>
          #include <chrono>
          #include <fstream>
          #include <iostream>
          #include <numeric>
          #include <stdexcept>
          #include <vector>
          namespace pastafari { std::vector<int> qaFastUnrank(const std::vector<int>&,const Integer&); }
          using namespace pastafari;
          int main(){
              resetPersistentScarVaultsDiagnostic();
              setAccelerationScarsEnabled(true);
              setFullHistoricalAccelerationValidation(false);
              int checked=0,vectors=0;
              for(int n=1;n<=4;++n){
                  int limit=1;
                  for(int j=0;j<n;++j)limit*=3;
                  for(int code=0;code<limit;++code){
                      int v=code;
                      std::vector<int> L;
                      for(int j=0;j<n;++j){L.push_back(1+v%3);v/=3;}
                      if(std::accumulate(L.begin(),L.end(),0)>10)continue;
                      const Integer count=exactLegalMonthWeavingCount(L);
                      std::vector<Integer> ranks;
                      if(count<=100){for(Integer k=1;k<=count;++k)ranks.push_back(k);}
                      else{ranks={Integer{1},(count+1)/2,count};}
                      for(const auto& k:ranks){
                          if(qaFastUnrank(L,k)!=DPUnrankLegalWeaving(L,k))throw std::runtime_error("small full-state mismatch");
                          ++checked;
                      }
                      ++vectors;
                  }
              }
              std::cout<<"SMALL\t"<<vectors<<"\t"<<checked<<std::endl;
              for(int mode=1;mode<=2;++mode){
                  resetPersistentScarVaultsDiagnostic();
                  setAccelerationScarsEnabled(mode!=1);
                  setFullHistoricalAccelerationValidation(mode==2);
                  for(const std::vector<int>& lens:std::vector<std::vector<int>>{{1,1,1},{2,3,2},{3,2,3,2}}){
                      const Integer total=exactLegalMonthWeavingCount(lens);
                      for(const Integer& rank:std::vector<Integer>{Integer{1},(total+1)/2,total}){
                          if(qaFastUnrank(lens,rank)!=DPUnrankLegalWeaving(lens,rank))throw std::runtime_error("fallback mismatch");
                      }
                  }
                  std::cout<<"FALLBACK\t"<<mode<<"\t9"<<std::endl;
              }
              resetPersistentScarVaultsDiagnostic();
              setAccelerationScarsEnabled(true);
              setFullHistoricalAccelerationValidation(false);
              std::ifstream f("source/lengths.txt");
              std::vector<int> L;
              int len;
              while(f>>len)L.push_back(len);
              if(L.size()!=45||std::accumulate(L.begin(),L.end(),0)!=4244)return 2;
              const Integer count=exactLegalMonthWeavingCount(L);
              std::cout<<"COUNT\t"<<count<<std::endl;
              // Interior ranks exercise active-block subtraction. Extremal
              // ranks alone are poor performance witnesses.
              for(int frac:{1,2,3}){
                  const Integer k=1+((count-1)*frac)/4;
                  const auto start=std::chrono::steady_clock::now();
                  const auto row=DPUnrankLegalWeaving(L,k);
                  const double sec=std::chrono::duration<double>(std::chrono::steady_clock::now()-start).count();
                  if(row.size()!=4244)return 3;
                  std::vector<int> histogram(45);
                  std::vector<int> first(45,-1),last(45,-1);
                  for(int i=0;i<static_cast<int>(row.size());++i){
                      const int m=row[i]-1;
                      if(m<0||m>=45)return 4;
                      ++histogram[m];if(first[m]<0)first[m]=i;last[m]=i;
                  }
                  if(histogram!=L||!std::is_sorted(first.begin(),first.end())||!std::is_sorted(last.begin(),last.end()))return 5;
                  std::cout<<"ROW\t"<<frac<<"\t"<<sec<<"\t"<<k<<"\t";
                  for(int m:row)std::cout<<m<<",";
                  std::cout<<std::endl;
              }
          }
          CPP
          cp source/src/versioned.cpp source/src/component-bridge.cpp
          cat >> source/src/component-bridge.cpp <<'CPP'
          namespace pastafari {
          std::vector<int> qaFastUnrank(const std::vector<int>& lengths,const Integer& rank) {
              FastLegalMonthWeavingCounterInternal counter(lengths);
              return counter.unrank1(rank);
          }
          }
          CPP
          (ulimit -v 4194304; timeout -k 5s 120s g++ -std=c++17 -O2 -pthread -I source/include source/src/versioned.cpp source/probe.cpp -o source/probe) > evidence/build.log 2>&1 || { cat evidence/build.log; exit 1; }
          (ulimit -v 4194304; timeout -k 5s 120s g++ -std=c++17 -O2 -pthread -I source/include source/src/component-bridge.cpp source/component.cpp -o source/component) > evidence/component-build.log 2>&1 || { cat evidence/component-build.log; exit 1; }
          sha256sum source/probe source/component source/probe.cpp source/component.cpp source/cases.tsv > evidence/build.sha256
      - name: Verify small full-state, fallback, whole words and original public API
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 1572864; /usr/bin/time -v -o evidence/component-time.txt timeout -k 5s 150s source/component) > evidence/component-stdout.txt 2> evidence/component-stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/component-exit.txt
          cut -c1-100 evidence/component-stdout.txt
          cat evidence/component-stderr.txt
          set +e
          (ulimit -v 3145728; /usr/bin/time -v -o evidence/time.txt timeout -k 5s 240s source/probe < source/cases.tsv) > evidence/stdout.txt 2> evidence/stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/exit.txt
          cat evidence/stdout.txt evidence/stderr.txt
          python3 - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          p=Path("evidence")
          frozen=json.loads((p/"frozen.json").read_text())
          reference=json.loads((p/"v256-reference.json").read_text())
          small=None;count=None;words=[];fallback=[]
          for l in (p/"component-stdout.txt").read_text().splitlines():
              a=l.split("\t")
              if a[0]=="SMALL":small=list(map(int,a[1:]))
              elif a[0]=="FALLBACK":fallback.append(list(map(int,a[1:])))
              elif a[0]=="COUNT":count=hashlib.sha256(a[1].encode()).hexdigest()
              elif a[0]=="ROW":
                  assert len(a)==5 and len(a[4].rstrip(",").split(","))==4244
                  words.append({"fraction":int(a[1]),"rank":a[3],"word_sha256":hashlib.sha256(a[4].encode()).hexdigest()})
              else:raise AssertionError(a[0])
          component_ok=int((p/"component-exit.txt").read_text())==0 and not (p/"component-stderr.txt").read_text() and small==reference["small"]==[115,1285] and fallback==[[1,9],[2,9]] and count==reference["count_sha256"] and words==reference["rows"]
          rows=[]
          lines=(p/"stdout.txt").read_text().splitlines()
          for l in lines:
              a=l.split("\t")
              if a[0]!="DATE":continue
              assert len(a)==16
              rows.append({"label":a[1],"c":int(a[2]),"t":int(a[3]),"seconds":float(a[4]),"fields":list(map(int,a[5:10])),"raw_names":a[10:12],"gate_calculated":int(a[12]),"gate_resurrections":int(a[13]),"structure_hits":int(a[14]),"result_hits":int(a[15])})
          code=int((p/"exit.txt").read_text())
          exact=code==0 and len(rows)==len(frozen)==14 and lines[-1]=="PERSISTENT_DONE\t14" and not (p/"stderr.txt").read_text()
          exact=exact and all(all(x[k]==y[k] for k in ("label","c","t","fields","raw_names")) for x,y in zip(rows,frozen))
          import zipfile
          with zipfile.ZipFile("v257.zip") as z:prev=json.loads(z.read("result.json"))
          exact=exact and all(all(x[k]==y[k] for k in ("gate_calculated","gate_resurrections","structure_hits","result_hits")) for x,y in zip(rows,prev["modes"]["variant"]["rows"]))
          m=re.search(r"Maximum resident set size \(kbytes\): (\d+)",(p/"time.txt").read_text())
          out={"schema":"SOAK_V258_VERSIONED_WEAVING_NATIVE/1","candidate_commit":(p/"candidate-commit.txt").read_text().strip(),"candidate_tree":(p/"candidate-tree.txt").read_text().strip(),"candidate_blob":(p/"candidate-blob.txt").read_text().strip(),"exact_v256_v257_bytes":True,"component_pass":bool(component_ok),"small":small,"fallback":fallback,"full_word_positions":12732 if component_ok else 0,"rows":rows,"exit":code,"peak_rss_kib":int(m.group(1)) if m else None,"versioned_candidate_pass":bool(component_ok and exact),"previously_frozen_unique_pairs":11,"independent_new_pairs":0,"whole_year_credit":0,"admitted_engines":0,"STOP_NEW_NATIVE_SOAK_DISPATCH":True}
          (p/"result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          assert out["versioned_candidate_pass"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v258-versioned-weaving-native-${{ github.run_id }}
          path: evidence/
          retention-days: 90
