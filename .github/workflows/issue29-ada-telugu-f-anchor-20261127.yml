name: Issue29 Ada Telugu one anchor F integration
on:
  push:
    branches:
      - 'qa/issue29-ada-telugu-f-anchor-20261127'
    paths:
      - '.github/workflows/issue29-ada-telugu-f-anchor-20261127.yml'
permissions:
  contents: read
jobs:
  f-anchor-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Lock live parent and reconstruct exact frozen draft subset
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/f-anchor/src"
          work="$RUNNER_TEMP/f-anchor"
          test "$(git rev-parse HEAD^)" = d10d50383025d73ad2ce11d19d5759221d70f730
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/issue29-ada-telugu-f-anchor-20261127.yml
          git rev-parse HEAD HEAD^ > evidence/qa-and-source-commit.txt
          printf '%s\n' '741c00367f8be2302199e577d534b59b4a59ed23509accd0594bc124917277c5' > evidence/source-draft-zip.sha256
          test "$(git rev-parse HEAD^:src/normative_oracle.ads)" = c4588566076798dd394feeab580ebc3d38c09744
          git show HEAD^:src/normative_oracle.ads > "$work/src/normative_oracle.ads"
          test "$(git hash-object "$work/src/normative_oracle.ads")" = c4588566076798dd394feeab580ebc3d38c09744
          printf '%s  %s\n' 'c4588566076798dd394feeab580ebc3d38c09744' 'src/normative_oracle.ads' >> evidence/source-blobs.txt
          test "$(git rev-parse HEAD^:src/normative_oracle.adb)" = 0be8f8ab4ddef26d34963d5567707a511ebda50b
          git show HEAD^:src/normative_oracle.adb > "$work/src/normative_oracle.adb"
          test "$(git hash-object "$work/src/normative_oracle.adb")" = 0be8f8ab4ddef26d34963d5567707a511ebda50b
          printf '%s  %s\n' '0be8f8ab4ddef26d34963d5567707a511ebda50b' 'src/normative_oracle.adb' >> evidence/source-blobs.txt
          test "$(git rev-parse HEAD^:src/exact_math.ads)" = 3ab9c5325858e5ef2d7fa59ab6d30d0c1ff523aa
          git show HEAD^:src/exact_math.ads > "$work/src/exact_math.ads"
          test "$(git hash-object "$work/src/exact_math.ads")" = 3ab9c5325858e5ef2d7fa59ab6d30d0c1ff523aa
          printf '%s  %s\n' '3ab9c5325858e5ef2d7fa59ab6d30d0c1ff523aa' 'src/exact_math.ads' >> evidence/source-blobs.txt
          test "$(git rev-parse HEAD^:src/exact_math.adb)" = 4b014d2e6a467ec606493c6c977e8cc184fea40a
          git show HEAD^:src/exact_math.adb > "$work/src/exact_math.adb"
          test "$(git hash-object "$work/src/exact_math.adb")" = 4b014d2e6a467ec606493c6c977e8cc184fea40a
          printf '%s  %s\n' '4b014d2e6a467ec606493c6c977e8cc184fea40a' 'src/exact_math.adb' >> evidence/source-blobs.txt
          test "$(git rev-parse HEAD^:src/month_weaving.ads)" = 183c0e4d9538ae1defe1b63eb3871ffe7feee991
          git show HEAD^:src/month_weaving.ads > "$work/src/month_weaving.ads"
          test "$(git hash-object "$work/src/month_weaving.ads")" = 183c0e4d9538ae1defe1b63eb3871ffe7feee991
          printf '%s  %s\n' '183c0e4d9538ae1defe1b63eb3871ffe7feee991' 'src/month_weaving.ads' >> evidence/source-blobs.txt
          test "$(git rev-parse HEAD^:src/month_weaving.adb)" = 9b02c62dfbc7d8b3b532aba8cd9f1ad0f8b28fef
          git show HEAD^:src/month_weaving.adb > "$work/src/month_weaving.adb"
          test "$(git hash-object "$work/src/month_weaving.adb")" = 9b02c62dfbc7d8b3b532aba8cd9f1ad0f8b28fef
          printf '%s  %s\n' '9b02c62dfbc7d8b3b532aba8cd9f1ad0f8b28fef' 'src/month_weaving.adb' >> evidence/source-blobs.txt
          test "$(git rev-parse HEAD^:src/canonical_full_weave_gmp_v164.ads)" = 0b68edf7eddbc33869358bcfcc21e32465fc591e
          git show HEAD^:src/canonical_full_weave_gmp_v164.ads > "$work/src/canonical_full_weave_gmp_v164.ads"
          test "$(git hash-object "$work/src/canonical_full_weave_gmp_v164.ads")" = 0b68edf7eddbc33869358bcfcc21e32465fc591e
          printf '%s  %s\n' '0b68edf7eddbc33869358bcfcc21e32465fc591e' 'src/canonical_full_weave_gmp_v164.ads' >> evidence/source-blobs.txt
          test "$(git rev-parse HEAD^:src/canonical_full_weave_gmp_v164.adb)" = 845bd8905943a54e63d6aba0334404a5051fe666
          git show HEAD^:src/canonical_full_weave_gmp_v164.adb > "$work/src/canonical_full_weave_gmp_v164.adb"
          test "$(git hash-object "$work/src/canonical_full_weave_gmp_v164.adb")" = 845bd8905943a54e63d6aba0334404a5051fe666
          printf '%s  %s\n' '845bd8905943a54e63d6aba0334404a5051fe666' 'src/canonical_full_weave_gmp_v164.adb' >> evidence/source-blobs.txt
          test "$(git rev-parse HEAD^:src/canonical_wide_rank_gmp_v164.ads)" = 14b94e81534e98cfdb07be3824076bd7082385ea
          git show HEAD^:src/canonical_wide_rank_gmp_v164.ads > "$work/src/canonical_wide_rank_gmp_v164.ads"
          test "$(git hash-object "$work/src/canonical_wide_rank_gmp_v164.ads")" = 14b94e81534e98cfdb07be3824076bd7082385ea
          printf '%s  %s\n' '14b94e81534e98cfdb07be3824076bd7082385ea' 'src/canonical_wide_rank_gmp_v164.ads' >> evidence/source-blobs.txt
          test "$(git rev-parse HEAD^:src/canonical_wide_rank_gmp_v164.adb)" = 52b8814c2ab1924cdebafe893a65d97cd3ccfa61
          git show HEAD^:src/canonical_wide_rank_gmp_v164.adb > "$work/src/canonical_wide_rank_gmp_v164.adb"
          test "$(git hash-object "$work/src/canonical_wide_rank_gmp_v164.adb")" = 52b8814c2ab1924cdebafe893a65d97cd3ccfa61
          printf '%s  %s\n' '52b8814c2ab1924cdebafe893a65d97cd3ccfa61' 'src/canonical_wide_rank_gmp_v164.adb' >> evidence/source-blobs.txt
          cat > "$work/f_integration_probe.adb" <<'F_DRAFT_EOF'
          with Ada.Text_IO;
          with Ada.Numerics.Big_Numbers.Big_Integers;
          with Normative_Oracle;
          procedure F_Integration_Probe is
             use Ada.Numerics.Big_Numbers.Big_Integers;
             use Ada.Text_IO;
             C : constant Big_Integer := To_Big_Integer (-15_055_671);
             T : constant Big_Integer := C;
          begin
             Put_Line ("F_INTEGRATION_CALL_BEGIN"); Flush;
             declare
                R : constant Normative_Oracle.Calendar_Result :=
                  Normative_Oracle.Calendar_Date (C, T);
             begin
                Put_Line ("F_INTEGRATION_RESULT " & To_String (R.Year_Number) &
                  " " & Positive'Image (R.Cutlet_Canonical) &
                  " " & To_String (R.Day_In_Cutlet) &
                  " " & Positive'Image (R.Month_Canonical) &
                  " " & To_String (R.Day_In_Month));
                Put_Line ("F_INTEGRATION_CALL_END"); Flush;
             end;
          end F_Integration_Probe;
          F_DRAFT_EOF
          cat > "$work/f_integration.gpr" <<'F_DRAFT_EOF'
          with "gnatcoll_gmp";
          project F_Integration is
             for Source_Dirs use (".", "src");
             for Object_Dir use "obj";
             for Exec_Dir use "bin";
             for Main use ("f_integration_probe.adb");
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatW8", "-gnata");
             end Compiler;
          end F_Integration;
          F_DRAFT_EOF
          cat > "$work/adjudicate.py" <<'F_DRAFT_EOF'
          """Strictly adjudicate the future bounded native diagnostic; no execution here."""
          import json,pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); expected=json.loads((p/'oracle.json').read_text())['expected']; lines=(p/'run.stdout').read_text().splitlines()
          def require(cond,msg):
              if not cond: raise SystemExit('NOT_ACCEPTED: '+msg)
          for f in ['build.exit','run.exit','scope.exit']:
              require((p/f).read_text().strip()=='0',f)
          require((p/'run.stderr').stat().st_size==0,'nonempty run stderr')
          markers=['F_INTEGRATION_CALL_BEGIN','STAGE13_DIAG=calendar_begin','STAGE13_DIAG=month_weave_issue29_gmp_patch_begin','STAGE13_DIAG=month_weave_issue29_gmp_patch_done','STAGE13_DIAG=calendar_result_ready','F_INTEGRATION_CALL_END']
          require(all(lines.count(m)==1 for m in markers),'unique phase markers'); require([lines.index(m) for m in markers]==sorted(lines.index(m) for m in markers),'phase order')
          results=[(i,x) for i,x in enumerate(lines) if x.startswith('F_INTEGRATION_RESULT')]; require(len(results)==1,'one result')
          i,x=results[0]; require(lines.index(markers[-2])<i<lines.index(markers[-1]),'result order')
          require(re.fullmatch(r'F_INTEGRATION_RESULT(?: +[-+]?\d+){5} *',x) is not None,'result grammar'); actual=list(map(int,x.split()[1:])); require(actual==expected,'field mismatch '+str(actual))
          require((p/'memory.max').read_text().strip()=='1073741824','memory max'); require((p/'memory.swap.max').read_text().strip()=='0','swap max')
          events=dict(x.split() for x in (p/'memory.events').read_text().splitlines()); require(all(events.get(k)=='0' for k in ['max','oom','oom_kill']),'memory limit events'); require(0<int((p/'memory.peak').read_text())<=1073741824,'peak')
          print('F_INTEGRATION_DIAGNOSTIC_PASS',*actual,'calls=1 scope=one_anchor_only')
          F_DRAFT_EOF
          cat > evidence/oracle.json <<'F_DRAFT_EOF'
          {
            "schema": "ISSUE29_F_INTEGRATION_DRAFT/1",
            "input": [
              -15055671,
              -15055671
            ],
            "expected": [
              5000,
              10,
              503,
              20,
              56
            ],
            "historical_ada": [
              5000,
              10,
              503,
              30,
              52
            ],
            "projection_cases": [
              {
                "offset0": 0,
                "projection": [
                  1,
                  18,
                  1
                ]
              },
              {
                "offset0": 1,
                "projection": [
                  2,
                  14,
                  1
                ]
              },
              {
                "offset0": 2030,
                "projection": [
                  24,
                  32,
                  21
                ]
              },
              {
                "offset0": 2031,
                "projection": [
                  8,
                  20,
                  56
                ]
              },
              {
                "offset0": 2032,
                "projection": [
                  25,
                  29,
                  38
                ]
              },
              {
                "offset0": 4242,
                "projection": [
                  44,
                  2,
                  122
                ]
              },
              {
                "offset0": 4243,
                "projection": [
                  45,
                  26,
                  105
                ]
              }
            ],
            "projection_comparisons": 4244,
            "out_of_range_rejections": 2,
            "independence": "month projection and inverse name rank independent of live Ada; full weave rank certificate reused; non-month fields historical cross-native witness",
            "native_calls": 0
          }
          F_DRAFT_EOF
          cat > "$work/run.sh" <<'F_DRAFT_EOF'
          set -euo pipefail
          work=$1
          evidence=$2
          cg=/sys/fs/cgroup$(awk -F: '$1==0 {print $3}' /proc/self/cgroup)
          for k in memory.max memory.swap.max; do cat "$cg/$k" > "$evidence/$k"; done
          [[ $(cat "$evidence/memory.max") == 1073741824 && $(cat "$evidence/memory.swap.max") == 0 ]]
          trap 'cat "$cg/memory.events" > "$evidence/memory.events"; cat "$cg/memory.peak" > "$evidence/memory.peak"' EXIT
          cd "$work"
          ulimit -t 175
          set +e
          /usr/bin/time -v -o "$evidence/build.time" gprbuild -p -j1 -P f_integration.gpr > "$evidence/build.stdout" 2> "$evidence/build.stderr"
          rc=$?
          echo "$rc" > "$evidence/build.exit"
          ((rc==0)) || exit "$rc"
          /usr/bin/time -v -o "$evidence/run.time" env PC_STAGE13_DIAGNOSTIC=1 LC_ALL=C ./bin/f_integration_probe > "$evidence/run.stdout" 2> "$evidence/run.stderr"
          rc=$?
          echo "$rc" > "$evidence/run.exit"
          exit "$rc"
          F_DRAFT_EOF
          
          (cd "$work" && printf '%s\n' 'e7a33310b7b6f9f4c7958b38c3f4cd0d7172fcc666c93bf256f557f66b20d650  f_integration_probe.adb' 'fecbe86ab42e73b3a90de5bdf914566e00029befbe7e95457704d928b84fed05  f_integration.gpr' '008b42404c552fd095f31e9859f3f0e52c79fc4ecd3459185dddc7fc933cb2a9  adjudicate.py' | sha256sum -c)
          printf '%s\n' 'b4af09b0d12c3690b75225a40596ec82d239f23b47c835b7dd4369fe35383b5e  evidence/oracle.json' | sha256sum -c
          cp "$work/"{f_integration_probe.adb,f_integration.gpr,adjudicate.py,run.sh} evidence/
          bash -n "$work/run.sh"
          echo SOURCE_LOCK_PASS d10d50383025d73ad2ce11d19d5759221d70f730 10
      - name: Install GNAT13 and GMP
        run: |
          set -euo pipefail
          sudo apt-get update > evidence/apt-update.log 2>&1
          sudo apt-get install -y gnat-13 gprbuild libgnatcoll-gmp-dev > evidence/apt-install.log 2>&1
          gprbuild --version > evidence/gprbuild.version
          gnatmake --version > evidence/gnat.version
          dpkg-query -W gnat-13 gprbuild libgnatcoll-gmp-dev > evidence/packages.txt
      - name: One bounded build and exactly one anchor call
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/f-anchor"
          evidence="$PWD/evidence"
          set +e
          /usr/bin/time -v -o "$evidence/scope.time" sudo systemd-run --scope --quiet -p MemoryMax=1073741824 -p MemorySwapMax=0 -- /usr/sbin/runuser -u "$(id -un)" -- /usr/bin/timeout -k 5s 175s /bin/bash "$work/run.sh" "$work" "$evidence"
          rc=$?
          echo "$rc" > "$evidence/scope.exit"
          python3 "$work/adjudicate.py" "$evidence" > "$evidence/verdict.txt" 2>&1
          verdict=$?
          cat "$evidence/verdict.txt"
          if test -f "$evidence/run.stdout"; then cat "$evidence/run.stdout"; fi
          exit "$verdict"
      - name: Freeze evidence even on failure
        if: always()
        run: |
          mkdir -p evidence
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue29-ada-telugu-f-anchor-20261127
          path: evidence/
          if-no-files-found: error
