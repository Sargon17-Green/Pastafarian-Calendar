name: Stage 55 MATLAB Native Normative Micro Differential

on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_normative_micro_native.m'
      - '.github/workflows/matlab-stage55-normative-micro-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage55-normative-micro-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matlab-micro:
    name: MATLAB R2026a / bounded five-field micro differential
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Run exact bounded Native micro differential
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_normative_micro_native
      - name: Preserve QA log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-normative-micro-native-${{ github.run_id }}
          path: logs/STAGE55_NORMATIVE_MICRO_NATIVE.log
          if-no-files-found: warn
          retention-days: 30
