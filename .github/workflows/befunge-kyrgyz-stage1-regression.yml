name: Befunge Kyrgyz Stage 1 Native Regression

on:
  push:
  pull_request:
    branches:
      - 'Befunge+Кыргызча'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin QA-reflective production, frozen predecessors and canonical shared README
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = "8f2cf8afef61818244747582fe7c20a74ee18943"
          test "$(git hash-object qa/interleaved_work_counts_lexical_candidate.b98)" = "e2b39b066d1d47bcb8ce4f234b093fca94cb21d1"
          test "$(git hash-object qa/interleaved_work_counts_pre_lexical_baseline.b98)" = "e06d8f75d6502b2771d6a76b00397c6b6dbee543"
          test "$(git hash-object src/day_count.b98)" = "4f25f514f7b6362105dfff77db6f36769efe36c3"
          test "$(git hash-object src/save.b98)" = "dd6f10aa196e3a9523ee786e4ba41a91f303d199"
          test "$(git hash-object README.md)" = "74c424b44eadd4ece3f29072ddbf873236557604"
          test "$(git hash-object qa/interleaved_work_counts_pre_reflective_production.b98)" = "44c5c33f4fe88ad82b8172235f18ad5d5175e517"
          echo NATIVE_STAGE1_PINNED_SOURCE_SHA_PASS
          python3 qa/stage1_parser_integration_structure.py
          python3 qa/stage1_full_execution_geometry_sim.py
          python3 qa/stage1_native_trace_auditor_selftest.py
          python3 qa/stage1_native_route_graph.py --selftest
      - name: Verify pinned PyFunge-98 package
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Execute production, independent native reference, and fixture corpora
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              pyfunge --version
              python - <<'"'"'PY'"'"'
          from __future__ import print_function
          import csv,os,subprocess,sys,time
          root=""
          command=["pyfunge","--disable-fprint","--no-concurrent","--no-filesystem","-v98","-d2"]
          n=0
          def invoke(path,data,limit="50s"):
              global n
              n+=1
              p=subprocess.Popen(["timeout","--kill-after=2s",limit]+command+[path],
                 stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              o,e=p.communicate((data or "")+"\n")
              if p.returncode:
                  print("NATIVE_PROCESS_ERROR",path,data,p.returncode,e,o);raise SystemExit(1)
              return o.split()
          def exact(label,file,data,expected,limit="50s"):
              got=invoke(root+file,data,limit)
              if got!=expected:
                  print("NATIVE_MISMATCH",label,data,got,expected);raise SystemExit(1)
              print("PASS",label)
          def differential(name,samples):
              for inp in samples:
                  expected=invoke(root+"reference/"+name,inp)
                  exact("production/"+name+":"+inp, "src/"+name, inp, expected)
          exact("runtime-contract","src/runtime_contract.b98","",["1"])
          for inp,out in [("0",["1"]),("1",["0"]),("10",["0"])]:
              exact("bootstrap:"+inp,"src/bootstrap.b98",inp,out)
          for name in ["anchor_constants.b98","great_number.b98","save_edges.b98",
                       "reference_day_count_edges.b98","sign_validation.b98",
                       "stones_drop2.b98","year_bounds.b98"]:
              exact("smoke/"+name,"test/"+name,"",["1"])
          magnitudes=["0","1","2","10","15055670","15055671","15055672",
                      "170141183460469231731687303715884105726",
                      "170141183460469231731687303715884105727",
                      "170141183460469231731687303715884105728",
                      str(10**40+987654321),str(10**79+987654321)]
          for name in ["day_count.b98","save.b98"]:
              samples=[s+" "+m for s in ["0","1","2"] for m in magnitudes]
              differential(name,samples)
          for s in ["0","1","2","3"]:
              for m in magnitudes:
                  inp=s+" "+m
                  a=invoke(root+"reference/day_count.b98",inp)
                  b=invoke(root+"reference/save.b98",inp)
                  exact("fused/native:"+inp,"src/interleaved_day_save.b98",inp,a+b)
          exact("fused-hard-zero","src/interleaved_day_save.b98","0 0",
                ["30111343","170141183460469231731687303715884105727"])
          exact("fused-hard-invalid","src/interleaved_day_save.b98","2 10",["-1","-1"])
          fused_days=[
              (0,0,0,0),(1,15055671,1,15055671),
              (1,15055672,1,15055670),(0,123456789,1,987654321),
              (1,987654321,0,123456789),(0,0,1,15055671),
              (1,15055671,0,0),(0,1,0,2),(0,2,0,1),
              (0,10**50+987654321,1,10**51+123456789),
              (1,10**77+987654321,0,10**78+123456789),
          ]
          for signC,magC,signT,magT in fused_days:
              textargs=" ".join(map(str,[signC,magC,signT,magT]))
              five=invoke(root+"reference/work_counts.b98",textargs)
              savedC=invoke(root+"reference/save.b98",str(signC)+" "+str(magC))
              savedT=invoke(root+"reference/save.b98",str(signT)+" "+str(magT))
              exact("fused-workcounts:"+textargs,"src/interleaved_work_counts.b98",textargs,five+savedC+savedT)
          for invalid in ["1 0 0 0","0 0 1 0","2 10 0 10","0 10 2 10"]:
              exact("fused-workcounts-rejection:"+invalid,
                    "src/interleaved_work_counts.b98",invalid,["-1"]*7)
          for fixture in ["REFERENCE_PRIMITIVE_FIXTURES.tsv","REFERENCE_INTEGRATION_FIXTURES.tsv"]:
              with open(root+"fixtures/"+fixture,"rb") as f:
                  for i,row in enumerate(csv.DictReader(f,delimiter="\t"),1):
                      exact(fixture+":"+str(i), "reference/"+row["reference_file"],
                            row["input_tokens"].strip(),row["expected_output_tokens"].split())
          exact("count-weaving-333","reference/count_weavings.b98","3 3 3 3",["71"])
          exact("count-weaving-444","reference/count_weavings.b98","3 4 4 4",["1301"],"120s")
          exact("unrank-weaving-444-last","reference/unrank_weaving.b98","3 4 4 4 1301",
                "1 2 3 3 3 2 2 1 1 1 2 3".split(),"120s")
          exact("year5000","reference/year5000_from_gates_rank.b98",
                "0 100 0 0 7 0 0 0 42 0 84 0 126 0 168 0 210 0 252 1",
                "0 5000 0 6 0 252".split())
          print("STAGE1_TARGETED_NATIVE_REGRESSION_PASS total_invocations="+str(n))
          PY
              python qa/stage1_native_process_isolation.py
            '

  native-write-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify pinned PyFunge-98 for native Funge-space trace
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Native IP, exact p writes and subsequent executable gate reads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-befunge-traces"
          docker run --rm -e PYFUNGE_NO_PSYCO=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -v "$RUNNER_TEMP/native-befunge-traces:/traces" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              export PYTHONPATH=/work/qa
              export BF98_TRACE_LOG=/traces/valid.tsv
              printf "1 15055672 1 15055670\n" | timeout --kill-after=2s 50s pyfunge --disable-fprint --no-concurrent --no-filesystem -v98 -d2 qa/interleaved_work_counts_pre_lexical_baseline.b98 > /traces/valid.out
              export BF98_TRACE_LOG=/traces/invalid.tsv
              printf "2 10 0 10\n" | timeout --kill-after=2s 50s pyfunge --disable-fprint --no-concurrent --no-filesystem -v98 -d2 qa/interleaved_work_counts_pre_lexical_baseline.b98 > /traces/invalid.out
              export BF98_TRACE_LOG=/traces/candidate_valid.tsv
              printf "1 15055672 1 15055670\n" | timeout --kill-after=2s 50s pyfunge --disable-fprint --no-concurrent --no-filesystem -v98 -d2 src/interleaved_work_counts.b98 > /traces/candidate_valid.out
              export BF98_TRACE_LOG=/traces/candidate_invalid.tsv
              printf "2 10 0 10\n" | timeout --kill-after=2s 50s pyfunge --disable-fprint --no-concurrent --no-filesystem -v98 -d2 src/interleaved_work_counts.b98 > /traces/candidate_invalid.out
               # Independently retain the byte-identical native scanner parity
              export BF98_TRACE_LOG=/traces/scanner_valid.tsv
              printf "1 15055672 1 15055670\n" | timeout --kill-after=2s 50s pyfunge --disable-fprint --no-concurrent --no-filesystem -v98 -d2 qa/interleaved_work_counts_lexical_candidate.b98 > /traces/scanner_valid.out
              export BF98_TRACE_LOG=/traces/scanner_invalid.tsv
              printf "2 10 0 10\n" | timeout --kill-after=2s 50s pyfunge --disable-fprint --no-concurrent --no-filesystem -v98 -d2 qa/interleaved_work_counts_lexical_candidate.b98 > /traces/scanner_invalid.out
            '
          test "$(wc -w < "$RUNNER_TEMP/native-befunge-traces/valid.out")" -eq 7
          test "$(tr -s '[:space:]' ' ' < "$RUNNER_TEMP/native-befunge-traces/invalid.out" | xargs)" = "-1 -1 -1 -1 -1 -1 -1"
          python3 qa/stage1_native_write_audit.py \
            "$RUNNER_TEMP/native-befunge-traces/valid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/invalid.tsv"
          python3 qa/stage1_native_write_audit.py \
            "$RUNNER_TEMP/native-befunge-traces/candidate_valid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/candidate_invalid.tsv"
          cmp "$RUNNER_TEMP/native-befunge-traces/valid.out" "$RUNNER_TEMP/native-befunge-traces/candidate_valid.out"
          cmp "$RUNNER_TEMP/native-befunge-traces/invalid.out" "$RUNNER_TEMP/native-befunge-traces/candidate_invalid.out"
           cmp "$RUNNER_TEMP/native-befunge-traces/valid.out" "$RUNNER_TEMP/native-befunge-traces/scanner_valid.out"
           cmp "$RUNNER_TEMP/native-befunge-traces/invalid.out" "$RUNNER_TEMP/native-befunge-traces/scanner_invalid.out"
          python3 qa/stage1_native_posthandoff_parity.py \
            "$RUNNER_TEMP/native-befunge-traces/valid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/scanner_valid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/invalid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/scanner_invalid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/valid.out" \
            "$RUNNER_TEMP/native-befunge-traces/scanner_valid.out" \
            "$RUNNER_TEMP/native-befunge-traces/invalid.out" \
            "$RUNNER_TEMP/native-befunge-traces/scanner_invalid.out"
          python3 qa/stage1_native_route_graph.py \
            qa/interleaved_work_counts_pre_lexical_baseline.b98 \
            "$RUNNER_TEMP/native-befunge-traces/valid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/valid.graph.json"
          python3 qa/stage1_native_route_graph.py \
            qa/interleaved_work_counts_pre_lexical_baseline.b98 \
            "$RUNNER_TEMP/native-befunge-traces/invalid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/invalid.graph.json"
          python3 qa/stage1_native_route_graph.py \
            src/interleaved_work_counts.b98 \
            "$RUNNER_TEMP/native-befunge-traces/candidate_valid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/candidate_valid.graph.json"
          python3 qa/stage1_native_route_graph.py \
            src/interleaved_work_counts.b98 \
            "$RUNNER_TEMP/native-befunge-traces/candidate_invalid.tsv" \
            "$RUNNER_TEMP/native-befunge-traces/candidate_invalid.graph.json"
          echo NATIVE_STAGE1_DIRECTED_ROUTE_GRAPHS_CREATED
          python3 -m py_compile qa/stage1_native_geometry_evidence.py
          python3 qa/stage1_native_geometry_evidence.py "$RUNNER_TEMP/native-befunge-traces"
          test -s "$RUNNER_TEMP/native-befunge-traces/geometry_evidence.json"
          test -s "$RUNNER_TEMP/native-befunge-traces/candidate_valid_native_route.svg"
          test -s "$RUNNER_TEMP/native-befunge-traces/candidate_invalid_native_route.svg"
          echo NATIVE_OBSERVED_GEOMETRY_AND_EVIDENCE_ARTIFACTS_PASS
          echo NATIVE_FROZEN_SCANNER_TRACE_PARITY_AND_PROMOTED_KPLUS_OUTPUT_PARITY_PASS
          sha256sum src/interleaved_work_counts.b98

      - name: Save raw native execution trace and exact write evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: befunge-kyrgyz-native-write-audit
          path: ${{ runner.temp }}/native-befunge-traces/
          retention-days: 30

  native-lexical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify pinned PyFunge-98 interpreter
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Reject raw negative lexical sign in all four tokens
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              python qa/stage1_native_lexical_rejection.py
            '

  native-lexical-parser-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify pinned interpreter for Befunge-native parser qualification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Verify test-only Funge-98 character parser candidate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              python qa/stage1_native_lexical_candidate.py
            '

  native-integrated-lexical-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify pinned native interpreter for full scanner plus workCounts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Independent native reference differential for integrated 2D candidate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              python qa/stage1_native_integrated_lexical.py
            '

  native-same-interpreter-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify pinned native PyFunge package for in-process Program API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Replay fresh and overlapping native Program instances in one Python interpreter
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 650s python -u qa/stage1_native_same_interpreter_isolation.py
            '

  native-exact-program-object-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin promoted QA 2D source, original baseline and PyFunge-98 interpreter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = "8f2cf8afef61818244747582fe7c20a74ee18943"
          test "$(git hash-object qa/interleaved_work_counts_pre_lexical_baseline.b98)" = "e06d8f75d6502b2771d6a76b00397c6b6dbee543"
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Native same-Program-object reset, repeat, source-switch and buffer independence
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 240s python -u qa/stage1_native_same_program_reset.py
            '

  native-structural-reference-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify native PyFunge package checksum
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Native bounded families and weaving count/unrank property checks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 850s python -u qa/stage1_native_structural_properties.py
            '

  native-stage1-structural-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin independent Befunge structural references
