name: Publicar li JavaScript + Interlingue navigator in GitHub Pages

on:
  push:
    branches:
      - 'JavaScript\+Interlingue'
    paths:
      - 'index.html'
      - 'browser/**'
      - 'scripts/build-browser.js'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/javascript-interlingue-pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: javascript-interlingue-pages
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'

jobs:
  build:
    name: Provar e preparar li Pages-artefact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obtener li repository
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Provar compatibilitá con Stage 01
        run: node tests/verify-stage-01.js

      - name: Provar li browser-interface
        run: node tests/browser-interface-all.js

      - name: Constructer Standard e Standalone artefacts
        run: node scripts/build-browser.js

      - name: Provar li constructet artefacts
        run: node tests/browser-built-artifacts.js

      - name: Preparar li public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/dist
          cp index.html _site/index.html
          cp browser/dist/pastafari-date.js _site/dist/pastafari-date.js
          cp browser/dist/pastafari-worker.js _site/dist/pastafari-worker.js
          cp browser/dist/pastafari-date.mjs _site/dist/pastafari-date.mjs
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/dist/pastafari-date.js
          test -s _site/dist/pastafari-worker.js
          test -s _site/dist/pastafari-date.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar li Pages-artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar in GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar li artefact
        id: deployment
        uses: actions/deploy-pages@v4
