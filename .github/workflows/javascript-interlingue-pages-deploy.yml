name: Publicar li JavaScript + Interlingue navigator in GitHub Pages

on:
  push:
    branches:
      - 'JavaScript\+Interlingue'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: javascript-interlingue-pages
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'

jobs:
  build:
    name: Provar e preparar li Pages-artefact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obtener li repository
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Provar compatibilitá con Stage 01
        run: node tests/verify-stage-01.js

      - name: Provar li browser-interface
        run: node tests/browser-interface-all.js

      - name: Constructer Standard e Standalone artefacts
        run: node scripts/build-browser.js

      - name: Provar li constructet artefacts
        run: node tests/browser-built-artifacts.js

      - name: Provar que li Pages artefact mirror li complet browser dist
        run: node tests/browser-pages-artifact.js

      - name: Preparar li public site
        run: node scripts/prepare-pages-site.js _site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar li Pages-artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar in GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar li artefact
        id: deployment
        uses: actions/deploy-pages@v4
