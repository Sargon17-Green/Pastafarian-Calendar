name: Stage 5 Native Object Pascal - Foundation tag patch
on:
  push:
    branches:
      - 'Object-Pascal\+Português'
    paths:
      - 'src/Stage02WorkCounts.pas'
      - 'src/BigInt.pas'
      - 'src/PastafariCalendar.pas'
      - 'src/MonsterBootstrap.pas'
      - 'src/SourceLanguageCatalog.pas'
      - 'test/stage04_foundation_tag_probe.pas'
      - 'test/stage05_foundation_tag_legacy.pas'
      - 'test/build_and_run_stage05_foundation_tag.sh'
      - 'docs/stage04_foundation_day_tag_oracle.py'
      - '.github/workflows/stage04-native-object-pascal.yml'
permissions:
  contents: read
jobs:
  stage05-native-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FPC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fp-compiler
      - name: Verify production GREEN and isolated seeded legacy RED
        run: bash test/build_and_run_stage05_foundation_tag.sh
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage05-foundation-tag-evidence
          path: |
            evidence/stage05-foundation-tag.log
            evidence/stage05-production-probe.log
            evidence/stage05-legacy-probe.log
            build/stage05/vectors.tsv
          if-no-files-found: warn
          retention-days: 30
