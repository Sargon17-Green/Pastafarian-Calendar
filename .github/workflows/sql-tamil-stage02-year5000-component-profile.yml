name: SQL Tamil Slice25 Year5000 Component Profile PG17
on:
  push:
    branches: ['SQL\+தமிழ்']
    paths:
      - 'sql/test/157_stage25_year5000_component_profile.sql'
      - '.github/workflows/sql-tamil-stage02-year5000-component-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source and generate accepted seed fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'SQL+தமிழ்'
          mkdir -p slice25-seed-evidence
          printf 'GITHUB_SHA=%s\nPROFILE=seed\n' "$GITHUB_SHA" > slice25-seed-evidence/versions.txt
          python3 --version | tee -a slice25-seed-evidence/versions.txt
          python3 sql/test/155_stage25_selector_hop_input.py \
            --locked-records sql/test/152_stage25_selector_locked_years.jsonl \
            --self-test | tee slice25-seed-evidence/selftest.txt
          grep -qx 'SLICE25_HOP_GENERATOR_SELF_TEST=7/7 PASS' slice25-seed-evidence/selftest.txt
          python3 sql/test/155_stage25_selector_hop_input.py \
            --locked-records sql/test/152_stage25_selector_locked_years.jsonl \
            --pair seed --output slice25-seed-evidence/input.sql \
            | tee slice25-seed-evidence/fixture-check.txt
          grep -qx 'SLICE25_HOP_SOURCE_LOCK=8_years_7_pairs PASS' slice25-seed-evidence/fixture-check.txt
          grep -qx 'SLICE25_HOP_INPUT_GENERATED=seed' slice25-seed-evidence/fixture-check.txt
          sha256sum sql/test/152_stage25_selector_locked_years.jsonl \
            sql/test/155_stage25_selector_hop_input.py \
            sql/test/157_stage25_year5000_component_profile.sql \
            .github/workflows/sql-tamil-stage02-year5000-component-profile.yml \
            > slice25-seed-evidence/source-sha256.txt
          for i in $(seq -w 0 26); do
            mapfile -t matches < <(find sql -maxdepth 1 -name "$i"'_*.sql' -type f)
            test "${#matches[@]}" -eq 1
            sha256sum "${matches[0]}" >> slice25-seed-evidence/source-sha256.txt
          done
          sha256sum slice25-seed-evidence/input.sql > slice25-seed-evidence/generated-sha256.txt
      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name slice25-seed-pg --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$GITHUB_WORKSPACE:/work:ro" postgres:17
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres slice25-seed-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres slice25-seed-pg postgres --version | tee -a slice25-seed-evidence/versions.txt
      - name: Profile three production components against locked expected result
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for i in $(seq -w 0 26); do
            mapfile -t matches < <(find sql -maxdepth 1 -name "$i"'_*.sql' -type f)
            test "${#matches[@]}" -eq 1
            args+=(-f "/work/${matches[0]}")
          done
          args+=(-f /work/slice25-seed-evidence/input.sql)
          args+=(-f /work/sql/test/157_stage25_year5000_component_profile.sql)
          docker exec -u postgres slice25-seed-pg \
            psql -At -X -v ON_ERROR_STOP=1 -U postgres -d postgres "${args[@]}" \
            2>&1 | tee slice25-seed-evidence/postgres-results.txt
          test "$(grep -c 'SLICE25_SEED_PHASE_MS' slice25-seed-evidence/postgres-results.txt)" -eq 3
          test "$(grep -c 'SLICE25_SEED_FIELD_PASS=' slice25-seed-evidence/postgres-results.txt)" -eq 5
          grep -q 'SLICE25_SEED_PROFILE_GREEN=1' slice25-seed-evidence/postgres-results.txt
          printf 'SOURCE_LOCKED_SEED_COMPONENT_PROFILE=1\n' > slice25-seed-evidence/completion.txt
      - name: Preserve original evidence even if profile fails or times out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-tamil-slice25-year5000-components
          path: slice25-seed-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop isolated PostgreSQL 17
        if: always()
        shell: bash
        run: docker rm -f slice25-seed-pg 2>/dev/null || true
