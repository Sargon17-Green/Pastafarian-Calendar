name: SQL Tamil Stage 2 Slice22 Month Weaving
on:
  push:
    branches: ['SQL\+தமிழ்']
    paths:
      - 'sql/24_stage02_month_weaving.sql'
      - 'sql/test/131_stage02_month_weaving_oracle.py'
      - 'sql/test/132_stage02_month_weaving_native.sql'
      - 'sql/test/133_stage02_month_weaving_isolation.sql'
      - 'sql/test/134_stage02_month_weaving_differential.sql'
      - '.github/workflows/sql-tamil-stage02-month-weaving-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slice22:
    strategy:
      fail-fast: false
      matrix:
        case: [native, isolation, a1, a2, b1, b2, c1, c2, d1, d2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Source-locked preflight and Python goldens
        shell: bash
        env:
          CASE_LABEL: ${{ matrix.case }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p slice22-evidence
          echo "Git SHA: $GITHUB_SHA" > slice22-evidence/versions.txt
          echo "Case: $CASE_LABEL" >> slice22-evidence/versions.txt
          sha256sum sql/24_stage02_month_weaving.sql sql/test/131_stage02_month_weaving_oracle.py sql/test/10_normative_reference.sql > slice22-evidence/source-sha256.txt
          if [ "$CASE_LABEL" = native ]; then
            python3 sql/test/131_stage02_month_weaving_oracle.py --self-test | tee slice22-evidence/python-selftest.txt
            python3 sql/test/131_stage02_month_weaving_oracle.py --emit-sql > slice22-evidence/goldens.sql
            python3 sql/test/131_stage02_month_weaving_oracle.py --emit-hashes > slice22-evidence/golden-output-hashes.txt
            test "$(grep -c '^INSERT INTO slice22_goldens VALUES' slice22-evidence/goldens.sql)" -eq 40
            test "$(wc -l < slice22-evidence/golden-output-hashes.txt)" -eq 40
            sha256sum slice22-evidence/goldens.sql slice22-evidence/golden-output-hashes.txt > slice22-evidence/generated-sha256.txt
          elif [ "$CASE_LABEL" != isolation ]; then
            case "$CASE_LABEL" in a1|a2|b1|b2|c1|c2|d1|d2) ;; *) exit 64 ;; esac
            test "$(grep -o '__CASE_LABEL__' sql/test/134_stage02_month_weaving_differential.sql | wc -l)" -eq 3
            sed "s/__CASE_LABEL__/$CASE_LABEL/g" sql/test/134_stage02_month_weaving_differential.sql > slice22-evidence/differential-case.sql
            ! grep -q '__CASE_LABEL__' slice22-evidence/differential-case.sql
            sha256sum slice22-evidence/differential-case.sql > slice22-evidence/generated-sha256.txt
          fi
      - name: PostgreSQL 17 native gate
        shell: bash
        env:
          CASE_LABEL: ${{ matrix.case }}
        run: |
          set -euo pipefail
          docker run -d --name slice22-pg --network none -e POSTGRES_HOST_AUTH_METHOD=trust -v "$GITHUB_WORKSPACE:/work:ro" postgres:17
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres slice22-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres slice22-pg postgres --version | tee -a slice22-evidence/versions.txt
          args=()
          for i in $(seq -w 0 24); do
            path=$(find sql -maxdepth 1 -name "$i"'_*.sql' -print)
            test "$(printf '%s\n' "$path" | wc -l)" -eq 1
            test -f "$path"
            args+=(-f "/work/$path")
          done
          db=postgres
          if [ "$CASE_LABEL" = native ]; then
            args+=(-f /work/slice22-evidence/goldens.sql -f /work/sql/test/132_stage02_month_weaving_native.sql)
          elif [ "$CASE_LABEL" = isolation ]; then
            args+=(-f /work/sql/test/133_stage02_month_weaving_isolation.sql)
          else
            db=slice22_diff
            docker exec -u postgres slice22-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE $db"
            args+=(-f /work/sql/test/10_normative_reference.sql -f /work/slice22-evidence/differential-case.sql)
          fi
          docker exec -u postgres slice22-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d "$db" "${args[@]}" 2>&1 | tee slice22-evidence/result.txt
          case "$CASE_LABEL" in
            native) grep -q 'slice22_native_all_green' slice22-evidence/result.txt ;;
            isolation) grep -q 'isolation_8_of_8' slice22-evidence/result.txt ;;
            *) grep -q 'exact_array' slice22-evidence/result.txt ;;
          esac
      - name: Preserve original evidence ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-tamil-slice22-${{ matrix.case }}
          path: slice22-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Remove PostgreSQL container
        if: always()
        shell: bash
        run: docker rm -f slice22-pg 2>/dev/null || true
