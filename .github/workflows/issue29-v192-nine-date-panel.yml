name: Issue29 v192 corrected Ada nine-date regression panel NOT SOAK
on:
  push:
    branches:
      - qa/issue29-corrected-ada-nine-date-panel-v192
    paths:
      - '.github/workflows/issue29-v192-nine-date-panel.yml'
permissions:
  contents: read
concurrency:
  group: issue29-v192-nine-dates
  cancel-in-progress: false
jobs:
  bounded-native-panel:
    if: >-
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/qa/issue29-corrected-ada-nine-date-panel-v192'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact v191 fixture, source pins and scope
        run: |
          set -euo pipefail
          python3 -B qa/issue29/v192_run_panel.py preflight
          git diff --name-only 1160096aa847c54cbef27c232771ce1549d7ba8f...HEAD > evidence/changed-paths.txt
          git rev-parse HEAD > evidence/HEAD.txt
      - name: Install tested GNAT13 GMP toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq > evidence/apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gnat-13 gprbuild libgnatcoll-gmp-dev binutils > evidence/apt-install.log 2>&1
          dpkg-query -W gnat-13 libgnatcoll-gmp-dev libgmp10 > evidence/packages.txt
          gprbuild --version > evidence/gprbuild-version.txt
      - name: Build corrected source with GMP link proof
        run: |
          set -euo pipefail
          timeout -k 5s 180s gprbuild -p -j2 -P issue29_v192_panel.gpr > evidence/build.stdout 2> evidence/build.stderr
          nm bin_v192/issue29_v192_panel | grep -E 'canonical_full_weave_gmp_v164__unrank|canonical_wide_rank_gmp_v164__choose_rank' > evidence/gmp-linked-symbols.txt
          test "$(wc -l < evidence/gmp-linked-symbols.txt)" -ge 2
          sha256sum bin_v192/issue29_v192_panel > evidence/binary.sha256
      - name: Nine independent corrected Ada calls, stop at first failure
        run: |
          set -euo pipefail
          python3 -B qa/issue29/v192_run_panel.py
          python3 -B qa/issue29/v191_validate_panel.py qa/issue29/v191_panel.json evidence/matched-records.txt > evidence/validator.json
          git diff --exit-code 1160096aa847c54cbef27c232771ce1549d7ba8f HEAD -- src
      - name: Freeze evidence even on failure
        if: always()
        run: |
          mkdir -p evidence
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('evidence')
          m={x.name:{'bytes':x.stat().st_size,'sha256':hashlib.sha256(x.read_bytes()).hexdigest()} for x in sorted(p.iterdir()) if x.is_file() and x.name!='members.sha256.json'}
          (p/'members.sha256.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - name: Preserve bounded native regression receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v192-corrected-nine-date-panel-not-year
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
