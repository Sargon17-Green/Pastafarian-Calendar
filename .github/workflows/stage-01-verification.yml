name: Kontrolo de Stadio 1

on:
  push:
    branches:
      - 'Gleam+Esperanto'

permissions:
  contents: read

jobs:
  kontrolo:
    name: Kontrolu Bootstrap-stadion
    runs-on: ubuntu-24.04

    steps:
      - name: Elprenu la laborarbon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Instalu Gleam kaj Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28'
          gleam-version: '1.18.1'

      - name: Rulu la plenan kontrolon de Stadio 1
        shell: bash
        run: |
          mkdir -p artifacts/stage-01
          log='artifacts/stage-01/verification.log'
          exec > >(tee "$log") 2>&1

          echo 'STADIO_01_KONTROLO'
          echo "commit=${GITHUB_SHA}"
          echo "runner=${RUNNER_OS}"

          echo '--- ILARO ---'
          gleam --version
          erl -noshell -eval 'io:format("OTP ~s / ERTS ~s~n", [erlang:system_info(otp_release), erlang:system_info(version)]), halt().'

          echo '--- FORMATO ---'
          set +e
          gleam format --check src test
          format_status=$?

          echo '--- TESTOJ ---'
          gleam test
          test_status=$?
          set -e

          echo '--- REZULTOJ ---'
          echo "format_exit=${format_status}"
          echo "test_exit=${test_status}"

          if [ "$format_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            echo 'STADIO_01_REZULTO=FAIL'
            exit 1
          fi

          echo 'STADIO_01_REZULTO=PASS'

      - name: Konservu la kontrolprotokolon
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage-01-verification-log
          path: artifacts/stage-01/verification.log
          if-no-files-found: error
