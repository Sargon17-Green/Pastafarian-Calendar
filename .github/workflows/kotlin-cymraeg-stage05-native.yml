name: Kotlin+Cymraeg Stage 05 Native Regression

on:
  push:
    branches:
      - 'Kotlin+Cymraeg'
    paths:
      - '.github/workflows/kotlin-cymraeg-stage05-native.yml'
      - 'src/main/kotlin/pastafari/**'
      - 'src/test/kotlin/pastafari/**'
      - 'run-stage0*-tests.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-stage05:
    if: github.ref == 'refs/heads/Kotlin+Cymraeg'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the Welsh Kotlin branch
        uses: actions/checkout@v4
        with:
          ref: 'Kotlin+Cymraeg'
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Kotlin 1.9.0 native toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip' \
            -o "$RUNNER_TEMP/kotlin-compiler-1.9.0.zip"
          unzip -q "$RUNNER_TEMP/kotlin-compiler-1.9.0.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kotlinc/bin/kotlinc" -version

      - name: Verify Stage 01 to Stage 05 with original normative oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = 'Kotlin+Cymraeg'
          sh run-stage05-tests.sh 2>&1 | tee "$RUNNER_TEMP/stage05-native.log"
          grep -Fx 'STAGE05_NATIVE_GREEN' "$RUNNER_TEMP/stage05-native.log"
