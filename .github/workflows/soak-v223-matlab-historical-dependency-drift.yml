name: Soak v223 MATLAB historical dependency drift and state DAG models (zero F)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v223-matlab-historical-dependency-drift.yml
permissions:
  contents: read
  actions: read
jobs:
  static-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind historical roster and reconcile exact dependency drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a9eef1646f6bb9dbe8b3355bfef71c38ed701889"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v223-matlab-historical-dependency-drift.yml"
          mkdir -p evidence
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/14618673805/zip > evidence/v131.zip
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15224395751/zip > evidence/v222.zip
          echo "383241ca5002fd28dbdf62c239090b7fa557b42dca4350deaef8cfd955ba86c2  evidence/v131.zip" | sha256sum -c -
          echo "8dfb7558a5d7d6b0755b9220a259edb53dd8370106e7ca02accd98e01528cb62  evidence/v222.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,zipfile,subprocess
          from pathlib import Path
          def load(p,suffix):
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  n=[n for n in z.namelist() if n.endswith(suffix)]
                  assert len(n)==1
                  return json.loads(z.read(n[0]))
          prior=load("evidence/v222.zip","result.json")
          assert prior["normalized_unrank_identical"] and prior["normalized_lines"]==84
          assert (prior["states"],prior["transitions"],prior["cumulative_checks"],prior["rank_checks"],prior["mismatches"])==(2682,4874,5442,260,0)
          assert prior["model_only"] and not prior["soak_dispatch_authorized"]
          rows={x["record_id"]:x for x in load("evidence/v131.zip","v131-lineage-screen.json")["records"]}
          historical="6ef2f95c2e37b2bade2dbec5c9a3656d8fc06d20"
          later="6c8e5ba777a52ef85d30e38b893dbbc72de0ee59"
          repo="Sargon17-Green/Pastafarian-Calendar"
          base="src/+pastafari/"
          pins={"src/calendarDateSpaghetti.m":"baa99e11dd32c5dd195d7d3d33a2177a2650c4d5","tests/oracle/normative_oracle.m":"2ee12e722004b9426fafafa311c1fe5dccd2ce4b",base+"finalMonsterIntegration.m":"9176794ed8a73fa3fece02a5a01f9c67dfb49d4f",base+"MonthWeavingCompatibilityRoute.m":"2bfde51537b332dda6be7f9646a69613d48352c7",base+"MonthWeavingDPPatchWrapper.m":"add7a46e3b1320f8dd076a8cd144564e6394af15",base+"WholeMonthWeavingFamily.m":"ec0ea9999976c02fe1f1525ee4ffa3049c6e7654",base+"WholeMonthWeavingFamilyPolynomial.m":"d365ef6a03f2fccc8f42da3cd866abd66345bbde"}
          inv={}; src={}
          def read(ref,p,h,tag):
              b=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/{repo}/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\x00"+b).hexdigest()==h
              inv[tag+":"+p]={"commit":ref,"blob":h,"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}
              Path("evidence",tag+"-"+Path(p).name+".source.txt").write_bytes(b)
              src[tag+":"+p]=b.decode("utf-8")
          for p,h in pins.items():read(historical,p,h,"historical")
          for rid in ["POLISH-MATLAB","REF-30"]:
              row=rows[rid];p=row["observed_source_path"]
              assert row["historical_head_commit"]==historical
              assert inv["historical:"+p]["blob"]==row["git_blob_sha1"] and inv["historical:"+p]["sha256"]==row["source_sha256"]
          laterpins={p:pins[p] for p in ["src/calendarDateSpaghetti.m","tests/oracle/normative_oracle.m",base+"finalMonsterIntegration.m",base+"MonthWeavingCompatibilityRoute.m",base+"MonthWeavingDPPatchWrapper.m",base+"WholeMonthWeavingFamilyPolynomial.m"]}
          laterpins[base+"WholeMonthWeavingFamily.m"]="4aa94c632399fc73208adb1d9ef4c2a6d3927a0b"
          for p,h in laterpins.items():read(later,p,h,"later")
          def check(tag,p,anchors):
              s=src[tag+":"+p]
              assert all(a in s for a in anchors),(p,[a for a in anchors if a not in s])
          for tag in ["historical","later"]:
              check(tag,"src/calendarDateSpaghetti.m",["pastafari.finalMonsterIntegration("])
              check(tag,base+"finalMonsterIntegration.m",["pastafari.MonthWeavingCompatibilityRoute.call("])
              check(tag,base+"MonthWeavingCompatibilityRoute.m",["pastafari.MonthWeavingDPPatchWrapper.callWithRing("])
              check(tag,base+"MonthWeavingDPPatchWrapper.m",["family = pastafari.WholeMonthWeavingFamily(monthLengths)","familyCount = family.count()","correct = family.itemAt1(rank)"])
              assert "WholeMonthWeavingFamilyPolynomial" not in src[tag+":"+base+"MonthWeavingDPPatchWrapper.m"]
          check("historical",base+"WholeMonthWeavingFamily.m",["obj.buildExactStateDP()","Forward pass: reachable-state DAG grouped by consumed days","Reverse pass: exact number of completions from every state","total = total + counts(childKey)","block = obj.completionCounts(key)","r = r - block"])
          check("historical","tests/oracle/normative_oracle.m",["function family = makeWeavingFamily(lengths)","totalCount = countState(initialRemaining, 0, 0)","totalCount = totalCount + countState(nr, no, nc)","block = countState(nr, no, nc)"])
          check("later",base+"WholeMonthWeavingFamily.m",["buildReverseSuffixes(obj.monthLengths)","E=weightedExternal(","pastafari.allOpenedWholeWeaveChildCountsCommonDenominator(","next{p}=B*pref{p}"])
          check("historical",base+"WholeMonthWeavingFamilyPolynomial.m",["EXPERIMENTAL drop-in candidate","countWholeWeavingSuffixByFirstEndpoint","unrankGeneralWeaveSuffixChunkAdjoint"])
          assert pins[base+"WholeMonthWeavingFamily.m"]!=laterpins[base+"WholeMonthWeavingFamily.m"]
          Path("evidence/source-pins.json").write_text(json.dumps(inv,indent=2)+"\n")
          PY
      - name: Reproduce local exhaustive layered DAG and recursive reference model
        run: |
          set -euo pipefail
          ulimit -v 524288
          timeout -k 5s 120s python3 - <<'PY'
          from itertools import product
          from functools import lru_cache
          from pathlib import Path
          import json
          cases=states=edges=ranks=0
          for m in range(1,5):
           for L in product(range(1,5),repeat=m):
            if sum(L)>12: continue
            cases+=1
            root=(L,0,0)
            def moves(s):
             r,o,c=s
             for i,n in enumerate(r):
              if n==0 or (n==L[i] and i!=o) or (n==1 and i!=c):continue
              rr=list(r);rr[i]-=1
              yield i,(tuple(rr),o+(n==L[i]),c+(n==1))
            layers=[{root}]
            for day in range(sum(L)):
             nxt=set()
             for s in layers[-1]:
              for i,t in moves(s):
               edges+=1;nxt.add(t)
             layers.append(nxt)
            assert layers[-1]=={((0,)*m,m,m)}
            counts={s:1 for s in layers[-1]}
            for layer in reversed(layers[:-1]):
             for s in layer:counts[s]=sum(counts[t] for _,t in moves(s))
            @lru_cache(None)
            def ref(r,o,c):
             if not any(r):return 1
             ans=0
             for j in range(m):
              if not r[j]:continue
              if r[j]==L[j] and j!=o:continue
              if r[j]==1 and j!=c:continue
              nr=tuple(x-(i==j) for i,x in enumerate(r))
              ans+=ref(nr,j+1 if r[j]==L[j] else o,j+1 if r[j]==1 else c)
             return ans
            assert ref(*root)==counts[root]
            for s,n in counts.items():assert n==ref(*s)
            states+=len(counts)
            def unrank(r,lookup):
             s=root;word=[]
             while any(s[0]):
              for i,t in moves(s):
               block=lookup(t)
               if r>block:r-=block
               else:word.append(i+1);s=t;break
              else:raise AssertionError('rank')
             assert r==1
             return word
            N=counts[root]
            for r in (range(1,N+1) if N<=100 else sorted({1,2,(N+1)//2,N-1,N})):
             assert unrank(r,counts.__getitem__)==unrank(r,lambda t:ref(*t));ranks+=1
          assert (cases,states,edges,ranks)==(305,5850,9158,3607)
          out={"schema":"SOAK_V223_MATLAB_HISTORICAL_DEPENDENCY_DRIFT/1","historical_head":"6ef2f95c2e37b2bade2dbec5c9a3656d8fc06d20","later_observed_head":"6c8e5ba777a52ef85d30e38b893dbbc72de0ee59","records":["POLISH-MATLAB","REF-30"],"historical_production":"LAYERED_FULL_REMAINING_STATE_DAG","historical_reference":"TOP_DOWN_FULL_REMAINING_STATE_MEMO","same_state_graph_and_count_recurrence":True,"later_production":"REVERSE_SUFFIX_DISTRIBUTION_AND_COMMON_DENOMINATOR","same_entrypoint_blob_but_changed_dependency":True,"experimental_polynomial_class_not_directly_selected_by_pinned_wrapper":True,"vectors":cases,"states":states,"transitions":edges,"rank_checks":ranks,"mismatches":0,"model_only":True,"original_matlab_executions":0,"native_date_calls":0,"whole_year_credit":0,"full_dependency_closure_verified":False,"admitted_engines":0,"soak_dispatch_authorized":False}
          Path("evidence/result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v223-matlab-lineage-${{ github.run_id }}
          path: evidence/
          retention-days: 90
