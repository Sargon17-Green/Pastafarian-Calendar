name: MATLAB Lazy Exact Joint Unrank (Experiment)

on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'src/\+pastafari/unrankGeneralWeaveSuffixChunkLazyJoint.m'
      - 'tests/run_stage55_lazy_joint_tests.m'
      - '.github/workflows/matlab-stage55-lazy-joint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lazy-joint:
    name: MATLAB R2026a / lazy exact prefix chunk differential
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch candidate
        uses: actions/checkout@v4
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Compare exact ranks and every resumable chunk
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); run_stage55_lazy_joint_tests
