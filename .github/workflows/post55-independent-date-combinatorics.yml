name: Kotlin TABLETS independent date combinatorics diagnostic
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/independent_date_combinatorics.py'
      - 'soak/test_independent_date_combinatorics.py'
      - '.github/workflows/post55-independent-date-combinatorics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-enumeration-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify independent combinatorics and fail closed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .evidence
          python3 -m py_compile soak/independent_date_combinatorics.py soak/test_independent_date_combinatorics.py
          python3 -m unittest discover -s soak -p 'test_independent_date_combinatorics.py' -v 2>&1 | tee .evidence/independent-date-combinatorics.log
          echo PASS_INDEPENDENT_COMPONENT_MATH_NOT_FULL_DATE_CERTIFIED | tee -a .evidence/independent-date-combinatorics.log
      - name: Preserve focused results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-independent-date-combinatorics-diagnostic
          path: .evidence/independent-date-combinatorics.log
          if-no-files-found: warn
          retention-days: 30
