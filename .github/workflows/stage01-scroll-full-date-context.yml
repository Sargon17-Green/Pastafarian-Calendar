name: Stage01 Scroll full-date context differential
on:
  push:
    branches: ["Fortran+English"]
    paths:
      - ".github/workflows/stage01-scroll-full-date-context.yml"
      - "test/stage01_scroll_full_date_diff.py"
      - "test/stage01_scroll_full_date_probe.f90"
      - "test/stage01_scroll_gate_independent.py"
      - "test/stage01_scroll_cutlets_independent.py"
      - "test/stage01_scroll_months_independent.py"
      - "test/stage01_scroll_month_names_independent.py"
      - "test/stage01_scroll_weaving_reverse_endpoint.py"
      - "test/stage01_scroll_stir_reference.py"
      - "test/normative_oracle_core.f90"
      - "test/normative_oracle_calendar.f90"
      - "src/big_integer.f90"
      - "src/source_language_catalog.f90"
      - "src/bootstrap_infrastructure.f90"
  pull_request:
    branches: ["Fortran+English"]
    paths:
      - ".github/workflows/stage01-scroll-full-date-context.yml"
      - "test/stage01_scroll_full_date_diff.py"
      - "test/stage01_scroll_full_date_probe.f90"
      - "test/stage01_scroll_gate_independent.py"
      - "test/stage01_scroll_cutlets_independent.py"
      - "test/stage01_scroll_months_independent.py"
      - "test/stage01_scroll_month_names_independent.py"
      - "test/stage01_scroll_weaving_reverse_endpoint.py"
      - "test/stage01_scroll_stir_reference.py"
      - "test/normative_oracle_core.f90"
      - "test/normative_oracle_calendar.f90"
      - "src/big_integer.f90"
      - "src/source_language_catalog.f90"
      - "src/bootstrap_infrastructure.f90"
permissions:
  contents: read
jobs:
  stage01-scroll-full-date-context-diff:
    name: Independent Hebrew Scroll full-date context differential (5 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
      - name: Verify exact source SHA pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          expected = "7b834f4a444e021bb65164282b851af960a6dbc0be3d458c2412181773b9db7b"
          paths = (
              "test/STAGE01_CANONICAL_SCROLL_AUDIT.md",
              "test/stage01_scroll_gate_independent.py",
              "test/stage01_scroll_cutlets_independent.py",
              "test/stage01_scroll_months_independent.py",
              "test/stage01_scroll_month_names_independent.py",
              "test/stage01_scroll_weaving_endpoint_dp.py",
              "test/stage01_scroll_stir_reference.py",
              "test/stage01_scroll_full_date_diff.py",
          )
          for name in paths:
              data = Path(name).read_text(encoding="utf-8")
              values = re.findall(r"7b834f4a444e021bb65164282b851af960a6dbc0be3d458c2412181773b9db7b?", data)
              if not values or any(value != expected for value in values):
                  raise SystemExit("invalid Scroll SHA pin in " + name)
          print("STAGE01_SCROLL_SOURCE_SHA256_PINS=8/8")
          PY
      - name: Compile original normative date probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          gfortran "${flags[@]}" -c src/big_integer.f90 -o build/big_integer.o
          gfortran "${flags[@]}" -c src/source_language_catalog.f90 -o build/source_language_catalog.o
          gfortran "${flags[@]}" -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
          gfortran "${flags[@]}" -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
          gfortran "${flags[@]}" -c test/normative_oracle_calendar.f90 -o build/normative_oracle_calendar.o
          gfortran "${flags[@]}" test/stage01_scroll_full_date_probe.f90 \
            build/big_integer.o build/source_language_catalog.o build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o build/normative_oracle_calendar.o \
            -o build/stage01_scroll_full_date_probe
          test -x build/stage01_scroll_full_date_probe
      - name: Self-test the independent Scroll oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_full_date_diff.py
          python3 -u test/stage01_scroll_full_date_diff.py --self-test | tee build/stage01-scroll-full-date-selftest.log
          grep -Eq '^STAGE01_SCROLL_FULL_DATE_ORACLE_SELFTEST=[0-9]+/[0-9]+$' build/stage01-scroll-full-date-selftest.log
      - name: Differential on adjacent target and calculation contexts
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 1048576; /usr/bin/time -f 'ELAPSED_SECONDS=%e MAXRSS_KIB=%M EXIT=%x' -o build/stage01-scroll-full-date-resource.log \
            timeout --signal=TERM --kill-after=5s 700s python3 -u test/stage01_scroll_full_date_diff.py \
              --fortran-exe build/stage01_scroll_full_date_probe \
              --output build/stage01-scroll-full-date.json \
              --max-seconds 180 --max-states 150000 --fortran-timeout 120) \
            > build/stage01-scroll-full-date.log 2>&1
          rc=$?
          set -e
          cat build/stage01-scroll-full-date.log
          echo "STAGE01_SCROLL_FULL_DATE_EXIT=$rc TIME_LIMIT=700 MEMORY_KIB=1048576"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -Fxq 'STAGE01_SCROLL_FULL_DATE_DIFFERENTIAL=5/5 CASES; 25/25 EXACT FIELDS' build/stage01-scroll-full-date.log
          grep -Fxq 'STAGE01_SCROLL_FULL_DATE_QA_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-full-date.log
      - name: Preserve independent full-date evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortran-stage01-scroll-full-date-context-diff
          path: |
            build/stage01-scroll-full-date-selftest.log
            build/stage01-scroll-full-date-resource.log
            build/stage01-scroll-full-date.log
            build/stage01-scroll-full-date.json
          if-no-files-found: warn
          retention-days: 30
