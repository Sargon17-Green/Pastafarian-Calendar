name: Stage55 MATLAB Polish Source Cutlet Day Lengths Native
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_source_cutlet_day_lengths_native.m'
      - '.github/workflows/matlab-stage55-source-cutlet-day-lengths-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage55-source-cutlet-day-lengths-native-MATLAB-Polski
  cancel-in-progress: false

jobs:
  native-source-cutlet-day-lengths:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned branch commit
        uses: actions/checkout@v4
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Derive signed gate sequence and real cutlet lengths
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_source_cutlet_day_lengths_native
      - name: Preserve Native log on PASS or FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-source-cutlet-day-lengths-native
          path: logs/STAGE55_SOURCE_CUTLET_DAYS_NATIVE.log
          if-no-files-found: warn
          retention-days: 30
