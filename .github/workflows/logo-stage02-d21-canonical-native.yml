name: Logo D21 Unrestricted CHOOSE.SHORT Canonical Native
on:
  push:
    branches:
      - 'Logo\+Ido'
permissions:
  contents: read
jobs:
  d21-canonical-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact canonical commit
        uses: actions/checkout@v4
      - name: Verify source locks and independent host oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/Logo+Ido"
          test "$(git hash-object src/exact_integer.logo)" = f2c1a8aa5822423402cd5825255891183f0fc83c
          test "$(git hash-object src/stage02_context.logo)" = f8451359e6ddcf38bb823ff2b78c9acbfbcf7830
          test "$(git hash-object src/stage02_answer_at.logo)" = f0951ba68a191667208b2a2b99b386c5336e49c2
          test "$(git hash-object test/normative_reference.logo)" = 625171ecd5fd93fb8381686f2b2f6b29ed3649cf
          test "$(git hash-object src/stage02_choose_short.logo)" = a556145f52a6c59018b0ef216d7a4fc6813e0f23
          test "$(git hash-object qa/logo_d21_unrestricted_oracle.py)" = b965e18c8e848a5c519d65b0ab9d15c99bf8dba6
          test "$(git hash-object STAGE02_DISCOVERY21_CANONICAL_CONTRACT.md)" = 03c08210c16caf04df830c371d0a615ae768675a
          python3 qa/logo_d21_unrestricted_oracle.py --output "$RUNNER_TEMP/d21u-native.logo" | tee "$RUNNER_TEMP/d21u-host.log"
          grep -Fxq 'D21U_HOST_SMALL_EXHAUSTIVE 76046' "$RUNNER_TEMP/d21u-host.log"
          grep -Fxq 'D21U_HOST_VALID 134' "$RUNNER_TEMP/d21u-host.log"
          grep -Fxq 'D21U_HOST_LONG_GAPS 15' "$RUNNER_TEMP/d21u-host.log"
          grep -Fxq 'D21U_HOST_CASES 147' "$RUNNER_TEMP/d21u-host.log"
          grep -Fxq 'D21U_HOST_CHECKS 549' "$RUNNER_TEMP/d21u-host.log"
          grep -Fxq 'D21U_HOST_ORACLE=PASS' "$RUNNER_TEMP/d21u-host.log"
      - name: Build pinned headless UCBLogo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git gcc g++ make autoconf automake autoconf-archive libncurses-dev
          source_dir="$RUNNER_TEMP/ucblogo-source"
          git clone --quiet --depth 1 --branch version_6.2.5 https://github.com/jrincayc/ucblogo-code.git "$source_dir"
          actual="$(git -C "$source_dir" rev-parse HEAD)"
          test "$actual" = a0215433f07384e4c42fe247525867f11e6f32f7
          cd "$source_dir"
          autoreconf -fi
          CFLAGS="-O2 -std=gnu17" ./configure --prefix="$RUNNER_TEMP/ucblogo-headless" --disable-wx --disable-x11 --disable-docs
          make -j2
          make install
          echo "LOGO_BIN=$RUNNER_TEMP/ucblogo-headless/bin/ucblogo" >> "$GITHUB_ENV"
      - name: Run exact-BI Native differential
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d21u-native.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 900s stdbuf -oL -eL "$LOGO_BIN" "$RUNNER_TEMP/d21u-native.logo" >"$log" 2>&1; then
            cat "$log"
          else
            code=$?
            cat "$log"
            echo "::error::D21 unrestricted Native failure/timeout exit=$code"
            exit 1
          fi
          grep -Fxq 'D21U_NATIVE_CASES_PASIS 147' "$log"
          grep -Fxq 'D21U_NATIVE_CHECKS_PASIS 549' "$log"
          grep -Fxq 'D21U_NATIVE_PASIS' "$log"
          if grep -Eq 'FALIIS|You don.t say what to do with|I don.t know how to|not enough inputs|doesn.t like' "$log"; then
            echo "::error::Native failure text present"
            exit 1
          fi
          echo 'NATIVE_D21_UNRESTRICTED_CANONICAL=PASS'
      - name: Preserve host and Native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d21-canonical-native-logs
          path: |
            ${{ runner.temp }}/d21u-host.log
            ${{ runner.temp }}/d21u-native.log
          if-no-files-found: error
          retention-days: 30
