name: MATLAB Stage55 Forty-Ninth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_forty_ninth_native.m'
      - 'tools/stage55_after49_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-forty-ninth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-forty-ninth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  forty-ninth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER48 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-forty-eighth-day-differential
          run-id: 44800224886
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER48
        run: |
          echo '6485c4d944a754ff26b7e46091f70b3e490c7a0f35e1352becdd275309a892a1  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_48.json' | sha256sum -c -
      - name: Preflight AFTER49 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after49_interval_five_fields.py
          grep -Fqx 'PIN = "6485c4d944a754ff26b7e46091f70b3e490c7a0f35e1352becdd275309a892a1"' tools/stage55_after49_interval_five_fields.py
          python3 -m py_compile tools/stage55_after49_interval_five_fields.py
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_48.json' tools/run_stage55_year5000_forty_ninth_native.m
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_49.json' tools/run_stage55_year5000_forty_ninth_native.m
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native forty-ninth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_forty_ninth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after49_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_48.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_49.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_FORTY_NINTH_PYTHON.log
          grep '^STAGE55_FORTY_NINTH_ROW ' logs/STAGE55_FORTY_NINTH_PYTHON.log > logs/STAGE55_FORTY_NINTH_PYTHON_ROW.txt
          grep '^STAGE55_FORTY_NINTH_ROW ' logs/STAGE55_FORTY_NINTH_NATIVE.log > logs/STAGE55_FORTY_NINTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_FORTY_NINTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_FORTY_NINTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_FORTY_NINTH_PYTHON_ROW.txt logs/STAGE55_FORTY_NINTH_NATIVE_ROW.txt
          expected="STAGE55_FORTY_NINTH_ROW POSITION=49 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=49 MONTH_INDEX=37 MONTH_DAY=4"
          grep -Fqx "$expected" logs/STAGE55_FORTY_NINTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_FORTY_NINTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_49.json | tee logs/STAGE55_FORTY_NINTH_DIGEST.txt
          echo 'STAGE55_FORTY_NINTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-forty-ninth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_48.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_49.json
            logs/STAGE55_FORTY_NINTH_NATIVE.log
            logs/STAGE55_FORTY_NINTH_PYTHON.log
            logs/STAGE55_FORTY_NINTH_PYTHON_ROW.txt
            logs/STAGE55_FORTY_NINTH_NATIVE_ROW.txt
            logs/STAGE55_FORTY_NINTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
