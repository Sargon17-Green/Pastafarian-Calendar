name: Issue29 v172 low-level Ada component suites (Stage02/04/06-12, ZERO Calendar_Date)
on:
  push:
    branches:
      - qa/issue29-ada-low-level-stage-tests-v172
    paths:
      - '.github/workflows/issue29-v172-low-level-component-tests.yml'
permissions:
  contents: read
concurrency:
  group: issue29-v172-stage02-stage04-stage06-to-12-component-one-shot
  cancel-in-progress: false
jobs:
  bounded-low-level-component-tests:
    if: ${{ github.run_attempt == 1 && github.ref == 'refs/heads/qa/issue29-ada-low-level-stage-tests-v172' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source-locked corrected Ada descendants
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify runner syntax before any native execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/issue29_v172_component_test_runner.py
          echo "V172_RUNNER_SYNTAX_PASS_NO_EXECUTION"
      - name: Install GNAT 13, GPRBuild, GNATCOLL GMP and GNU time
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gnat-13 gprbuild libgnatcoll-gmp-dev binutils time > apt-install.log 2>&1
          gnat --version > gnat-version.txt
          gprbuild --version > gprbuild-version.txt
          dpkg-query -W libgnatcoll-gmp-dev libgmp10 time > gmp-and-time-packages.txt
          test -x /usr/bin/time
      - name: Source lock and full source call-site audit; zero Calendar_Date execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v172_component_test_runner.py preflight | tee v172-preflight.stdout
          grep -Fx V172_STATIC_NO_CALENDAR_DATE_CALLS_AND_SOURCE_LOCKS_PASS v172-preflight.stdout
          test -f evidence/preflight.json
          for stage in 02 04 06 07 08 09 10 11 12; do
            name="stage${stage}"
            test ! -e "evidence/RUN_STARTED_${name^^}"
          done
      - name: Compile and link all nine unchanged component test mains; execute none yet
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v172_component_test_runner.py build | tee v172-build.stdout
          grep -Fx V172_STAGE02_STAGE04_STAGE06_TO_12_BUILD_LINK_PASS_NO_EXECUTION v172-build.stdout
          test -f evidence/build-manifest.json
      - name: Execute each low-level test main once under independent resource caps
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v172_component_test_runner.py run-once | tee v172-run.stdout
          grep -Fx V172_STAGE02_STAGE04_STAGE06_TO_12_PASS_ZERO_CALENDAR_DATE_ZERO_SOAK v172-run.stdout
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/result.json").read_bytes())
          expected=["stage02","stage04","stage06","stage07","stage08","stage09","stage10","stage11","stage12"]
          assert d["status"]=="PASS_STAGE02_STAGE04_STAGE06_TO_12_LOW_LEVEL_COMPONENTS_ONLY"
          assert [x["name"] for x in d["results"]]==expected
          assert all(x["status"]=="PASS" and x["process"]["exit_code"]==0 for x in d["results"])
          assert d["calendar_date_invocations"]==0 and d["full_calendar_F_invocations"]==0
          assert d["soak_years"]==0
          assert next(x for x in d["results"] if x["name"]=="stage11")["assertions_reported"]==368
          assert next(x for x in d["results"] if x["name"]=="stage12")["assertions_reported"]==1344
          print("V172_INDEPENDENT_RESULT_RECEIPT_PASS_ZERO_F_ZERO_SOAK")
          PY
      - name: Hash and preserve evidence on success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("evidence");d.mkdir(exist_ok=True)
          files={}
          for p in sorted(d.iterdir()):
              if p.is_file() and p.name!="manifest.sha256.json":
                  raw=p.read_bytes()
                  files[p.name]={"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
          (d/"manifest.sha256.json").write_text(json.dumps(files,sort_keys=True,indent=2)+"\n")
          PY
      - name: Upload one-shot low-level component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v172-stage02-stage04-stage06-to-12-low-level-no-calendar-date
          path: |
            evidence/
            apt-update.log
            apt-install.log
            gnat-version.txt
            gprbuild-version.txt
            gmp-and-time-packages.txt
            v172-preflight.stdout
            v172-build.stdout
            v172-run.stdout
          retention-days: 30
          if-no-files-found: warn
