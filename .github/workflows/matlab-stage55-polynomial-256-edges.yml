name: MATLAB Polynomial Year-5000 256 Complete Edge Words (Experiment)

on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'src/\+pastafari/WholeMonthWeavingFamilyPolynomial.m'
      - 'tests/run_stage55_polynomial_real_year_edge_window.m'
      - '.github/workflows/matlab-stage55-polynomial-256-edges.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window:
    name: MATLAB R2026a / 256 complete 4244-day edge-ranked words
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); run_stage55_polynomial_real_year_edge_window
