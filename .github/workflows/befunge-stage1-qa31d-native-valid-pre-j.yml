name: Befunge Stage1 QA31D Equal-Length Valid Pre-J Diagnostic
on:
  push:
    branches: ['qa-befunge98-stage1-order-isolation-20261008']
    paths:
      - 'qa/stage1_qa31d_native_valid_pre_j.py'
      - 'qa/stage1_qa31d_independent_audit.py'
      - '.github/workflows/befunge-stage1-qa31d-native-valid-pre-j.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-original-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin original source and compile syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = 560d6aa5807a7f766213a33835cce85eab0fa40c
          python3 -m py_compile qa/stage1_qa31d_native_valid_pre_j.py qa/stage1_qa31d_independent_audit.py
      - name: Download only signed original QA20 shard zero and one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 39761821210 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '.conclusion + ":" + .headSha')" = 'success:d0a1c686c4f9244121246aa5b70266c072c3ddce'
          mkdir -p "$RUNNER_TEMP/qa31d/valid00" "$RUNNER_TEMP/qa31d/valid01" "$RUNNER_TEMP/qa31d/output"
          gh run download 39761821210 --repo "$GITHUB_REPOSITORY" --name qa20-shard-0 --dir "$RUNNER_TEMP/qa31d/valid00"
          gh run download 39761821210 --repo "$GITHUB_REPOSITORY" --name qa20-shard-1 --dir "$RUNNER_TEMP/qa31d/valid01"
          echo "782fb868a11a105550ef5af6f8f7cd39e4ba9de77d9565f7549e310549b0073a  $RUNNER_TEMP/qa31d/valid00/qa20_manifest.json" | sha256sum -c -
          echo "9c5af6212cfd7c1ab58e9603f385767e64b10799c90be416a86c4f09d613bfdd  $RUNNER_TEMP/qa31d/valid01/qa20_manifest.json" | sha256sum -c -
      - name: Get SHA256-pinned Native PyFunge 0.5 rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Same original IP and buffer with equal-length real stdin delivery
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -e PYTHONPATH=/work/qa \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -v "$RUNNER_TEMP/qa31d:/qa31d" -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 1300s python -u qa/stage1_qa31d_native_valid_pre_j.py /qa31d /qa31d/output
            ' | tee "$RUNNER_TEMP/qa31d/output/native.log"
          grep -q QA31D_SIGNED_NATIVE_STEPS "$RUNNER_TEMP/qa31d/output/native.log"
          grep -q QA31D_NOT_STAGE1_ACCEPTANCE "$RUNNER_TEMP/qa31d/output/native.log"
      - name: Independently audit all steps and reject ten hostile receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 -u qa/stage1_qa31d_independent_audit.py src/interleaved_work_counts.b98 \
            "$RUNNER_TEMP/qa31d" "$RUNNER_TEMP/qa31d/output" \
            | tee "$RUNNER_TEMP/qa31d/output/audit.log"
          grep -q QA31D_INDEPENDENT_HOSTILE_REJECTIONS "$RUNNER_TEMP/qa31d/output/audit.log"
          grep -q QA31D_STAGE1_OPEN "$RUNNER_TEMP/qa31d/output/audit.log"
      - name: Save all original Native evidence and RED diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa31d-original-native-valid-pre-j
          path: |
            ${{ runner.temp }}/qa31d/output/qa31d_valid00.steps.gz
            ${{ runner.temp }}/qa31d/output/qa31d_valid01.steps.gz
            ${{ runner.temp }}/qa31d/output/qa31d_native.json
            ${{ runner.temp }}/qa31d/output/qa31d_independent.json
            ${{ runner.temp }}/qa31d/output/native.log
            ${{ runner.temp }}/qa31d/output/audit.log
          if-no-files-found: warn
