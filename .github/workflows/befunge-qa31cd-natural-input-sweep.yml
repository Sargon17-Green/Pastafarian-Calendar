name: Befunge QA31CD new natural-input owner witness (two cases)
on:
  push:
    branches:
      - qa-befunge98-stage1-order-isolation-20261008
    paths:
      - 'qa/qa31cd_natural_input_sweep.py'
      - 'qa/qa31cd_independent_audit.py'
      - 'qa/qa31cb_source_cells.json'
      - 'qa/QA31CD_TWO_NEW_NATURAL_NATIVE_CONTRACT_2026-11-22.md'
      - '.github/workflows/befunge-qa31cd-natural-input-sweep.yml'
permissions:
  contents: read
  actions: read
jobs:
  natural-input-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify immutable source and reviewable QA inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = '560d6aa5807a7f766213a33835cce85eab0fa40c'
          mkdir -p qa31cd-out "$RUNNER_TEMP/qa31cd-traces"
          python3 -m py_compile qa/qa31cd_independent_audit.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'qa')
          import qa31cd_independent_audit as auditor
          auditor.archive_self_test()
          PY
          python3 - <<'PY'
          import json
          m=json.load(open('qa/qa31cb_source_cells.json',encoding='utf-8'))
          assert m['project_id']=='PC-BRANCH-BEFUNGE98-KYRGYZ'
          assert m['source_git_blob_sha1']=='560d6aa5807a7f766213a33835cce85eab0fa40c'
          assert m['cells']['input_owner']['coordinate']==[19,1696]
          assert m['cells']['dynamic_code_cell']['coordinate']==[1500,1860]
          assert m['stage1_accepted'] is False
          PY
      - name: Fetch immutable PyFunge 0.5-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Execute exactly two fresh original-source candidate Native cases
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -e PYTHONPATH=/work/qa             -v "$GITHUB_WORKSPACE:/work:ro"             -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro"             -v "$RUNNER_TEMP/qa31cd-traces:/qa31cd-traces:rw"             -v "$GITHUB_WORKSPACE/qa31cd-out:/qa31cd-out:rw" -w /work             python:2.7-slim sh -ceu "
              cp /work/qa/qa31cd_natural_input_sweep.py /tmp/qa31cd_natural_input_sweep.py
              python -m py_compile /tmp/qa31cd_natural_input_sweep.py
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=10s 3000s python -u /work/qa/qa31cd_natural_input_sweep.py /qa31cd-traces /qa31cd-out
            " | tee qa31cd-out/native-sweep.log
      - name: Independently audit both full traces, p/g/stack chain and hostile mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -u qa/qa31cd_independent_audit.py             --traces "$RUNNER_TEMP/qa31cd-traces"             --out qa31cd-out             --source src/interleaved_work_counts.b98             --metadata qa/qa31cb_source_cells.json             | tee qa31cd-out/independent-audit.log
          python3 - <<'PY'
          import json
          v=json.load(open('qa31cd-out/qa31cd_audit.json',encoding='utf-8'))
          assert v['evidence_integrity']=='PASS'
          assert v['cases']==2
          assert v['trace_sha256_verified_cases']==2
          assert v['hostile_mutations_rejected']==20
          assert v['stage1_accepted'] is False
          assert v['global_reachability_proven'] is False
          PY
      - name: Finalize artifact file hashes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('qa31cd-out')
          root.mkdir(parents=True,exist_ok=True)
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in sorted(root.rglob('*'))
                 if p.is_file() and p.name!='qa31cd_artifact_manifest.json'}
          (root/'qa31cd_artifact_manifest.json').write_text(json.dumps(
            {'project_id':'PC-BRANCH-BEFUNGE98-KYRGYZ','qa':'QA31CD',
             'head_sha':os.environ.get('GITHUB_SHA'),
             'run_id':os.environ.get('GITHUB_RUN_ID'),
             'files':files,'stage1_accepted':False,
             'global_reachability_proven':False},indent=2,sort_keys=True)+'\n',
            encoding='utf-8')
          PY
      - name: Upload two full physical traces, source pins, receipt and independent audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: befunge-qa31cd-two-new-natural-owner-witness
          path: qa31cd-out/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
