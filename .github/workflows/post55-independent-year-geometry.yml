name: Kotlin independent year geometry diagnostic
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/independent_year_geometry_oracle.py'
      - 'soak/test_independent_year_geometry_oracle.py'
      - '.github/workflows/post55-independent-year-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-year-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check branch identity, exact commit and year geometry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .evidence
          python3 -m py_compile soak/independent_year_geometry_oracle.py soak/test_independent_year_geometry_oracle.py
          python3 -m unittest discover -s soak -p 'test_independent_year_geometry_oracle.py' -v 2>&1 | tee .evidence/independent-year-geometry.log
          echo 'PASS_SYNTHETIC_INDEPENDENT_YEAR_GEOMETRY_NOT_FULL_DATE_CERTIFIED' | tee -a .evidence/independent-year-geometry.log
      - name: Preserve unit-test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-year-geometry-diagnostic
          path: .evidence/independent-year-geometry.log
          if-no-files-found: warn
          retention-days: 30
