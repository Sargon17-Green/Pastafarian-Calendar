name: Kotlin alternating year same-instance state QA
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/Post55AlternatingYearStateProbe.kt'
      - 'soak/audit_production_alternating_year_state.py'
      - 'soak/test_audit_production_alternating_year_state.py'
      - '.github/workflows/post55-alternating-year-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alternating-year-state:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source lock and unchanged production budgets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'maxGateAbsIndex: Int = 8192' src/main/kotlin/pastafari/ProductionYearNavigator.kt
          grep -Fq 'maxYearTransitions in 1..100000' src/main/kotlin/pastafari/ProductionYearNavigator.kt
          grep -Fq 'private const val LIMIT = 8192' soak/Post55AlternatingYearStateProbe.kt
          echo 'ALTERNATING_STATE_SOURCE_LOCK_GREEN'
      - name: Python parser mutation and provenance tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile soak/audit_production_alternating_year_state.py soak/test_audit_production_alternating_year_state.py
          python3 -m unittest discover -s soak -p 'test_audit_production_alternating_year_state.py' -v 2>&1 | tee evidence/alternating-state-unit-tests.log
      - name: Install Kotlin 1.9.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 'https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip' -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile real Kotlin production with QA-only probe
        shell: bash
        run: |
          set -euo pipefail
          kotlinc src/main/kotlin/pastafari/*.kt soak/Post55AlternatingYearStateProbe.kt -include-runtime -d "$RUNNER_TEMP/alternating-year.jar"
          test -s "$RUNNER_TEMP/alternating-year.jar"
          echo 'ALTERNATING_STATE_REAL_PRODUCTION_COMPILED'
      - name: Real native same-instance mixed-direction differential
        shell: bash
        run: |
          set -euo pipefail
          python3 soak/audit_production_alternating_year_state.py --jar "$RUNNER_TEMP/alternating-year.jar" --timeout-seconds 900 --evidence evidence/alternating-state.json 2>&1 | tee evidence/alternating-state.log
      - name: Preserve QA evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-cymraeg-alternating-instance-state
          path: evidence/alternating-state*
          if-no-files-found: warn
          retention-days: 30
