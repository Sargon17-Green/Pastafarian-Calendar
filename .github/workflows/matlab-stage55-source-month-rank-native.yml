name: Stage55 MATLAB Polish Source Month-Selection Rank Native
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_source_month_rank_native.m'
      - '.github/workflows/matlab-stage55-source-month-rank-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage55-source-month-rank-native-MATLAB-Polski
  cancel-in-progress: false

jobs:
  native-source-month-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned branch commit
        uses: actions/checkout@v4
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Derive year-5000 chosen month rank from real source sauce
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_source_month_rank_native
      - name: Preserve original source-rank log on PASS or FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-source-month-rank-native-${{ github.run_id }}
          path: logs/STAGE55_SOURCE_MONTH_RANK_NATIVE.log
          if-no-files-found: warn
          retention-days: 30
