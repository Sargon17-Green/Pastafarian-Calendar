name: MATLAB Stage55 Ninth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_ninth_native.m'
      - 'tools/stage55_after9_interval_five_fields.py'
      - '.github/workflows/matlab-stage55-ninth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-ninth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  ninth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER8 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-seventh-day-differential
          run-id: 41199709414
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER8
        run: |
          echo '76873d9ec945eb2e3de8d67606f5ee61994049b03dff7796c9f29b632c3442d3  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_8.json' | sha256sum -c -
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native ninth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_ninth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after9_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_8.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_9.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_NINTH_PYTHON.log
          grep '^STAGE55_NINTH_ROW ' logs/STAGE55_NINTH_PYTHON.log > logs/STAGE55_NINTH_PYTHON_ROW.txt
          grep '^STAGE55_NINTH_ROW ' logs/STAGE55_NINTH_NATIVE.log > logs/STAGE55_NINTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_NINTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_NINTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_NINTH_PYTHON_ROW.txt logs/STAGE55_NINTH_NATIVE_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_9.json | tee logs/STAGE55_NINTH_DIGEST.txt
          echo 'STAGE55_NINTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-ninth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_8.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_9.json
            logs/STAGE55_NINTH_NATIVE.log
            logs/STAGE55_NINTH_PYTHON.log
            logs/STAGE55_NINTH_PYTHON_ROW.txt
            logs/STAGE55_NINTH_NATIVE_ROW.txt
            logs/STAGE55_NINTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
