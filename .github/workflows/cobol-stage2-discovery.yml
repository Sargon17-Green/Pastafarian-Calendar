name: COBOL Stage 2 Discovery 01

on:
  push:
    branches:
      - 'COBOL+简体中文'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage2-discovery-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Install native GnuCOBOL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol3
          cobc --version
      - name: Strict native compile and expected-red test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          echo "STAGE=2" | tee build/stage2-discovery.log
          echo "HEAD=$GITHUB_SHA" | tee -a build/stage2-discovery.log
          timeout --signal=TERM --kill-after=10s 300s \
            cobc -std=default -free \
            -Wall -Wextra -Wno-terminator -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
            -x -o build/stage02-discovery \
            test/stage02_discovery_tests.cob \
            src/big_integer.cob \
            src/monster_bootstrap.cob \
            src/legacy_old_remainder.cob \
            2>&1 | tee -a build/stage2-discovery.log
          timeout --signal=TERM --kill-after=10s 120s \
            ./build/stage02-discovery 2>&1 | tee -a build/stage2-discovery.log
          grep -Eq '^STAGE2_EXPECTED_RED=[[:space:]]*0*3[[:space:]]*$' build/stage2-discovery.log
          grep -Eq '^STAGE2_CONTROL_PASS=[[:space:]]*0*1[[:space:]]*$' build/stage2-discovery.log
          grep -Eq '^STAGE2_UNEXPECTED_FAILURES=[[:space:]]*0+[[:space:]]*$' build/stage2-discovery.log
          grep -Fxq 'RESULT=PASS_STAGE2_DISCOVERY_NATIVE' build/stage2-discovery.log
          test "$(grep -c '^RAW_REMAINDER=0$' build/stage2-discovery.log)" -eq 3
          if grep -iRE 'savepatch|save-patch|patch-save' src/; then
            echo 'FORBIDDEN_FUTURE_PATCH_FOUND=YES' | tee -a build/stage2-discovery.log
            exit 1
          fi
          echo 'FUTURE_PATCH_FOUND=NO' | tee -a build/stage2-discovery.log
      - name: Preserve native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-discovery-native-evidence
          path: build/stage2-discovery.log
          if-no-files-found: warn
          retention-days: 30
