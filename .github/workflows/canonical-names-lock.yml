name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  native-stage01:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Ada+తెలుగు'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Ada 2022 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnat gprbuild
          gnat --version || gnatmake --version
          gprbuild --version
      - name: Compile and execute Stage 1 native Ada tests
        shell: bash
        run: |
          set -euo pipefail
          sh ./run_stage01.sh

  native-stage02-discovery01:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Ada+తెలుగు'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ada 2022 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnat gprbuild
      - name: Run bounded Stage 2 DISCOVERY01 native probe
        shell: bash
        run: |
          set -euo pipefail
          sh ./run_stage02_discovery01.sh

  native-stage03-patch01:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Ada+తెలుగు'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ada 2022 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnat gprbuild
      - name: Run bounded Stage 3 PATCH01 native and differential tests
        shell: bash
        run: |
          set -euo pipefail
          sh ./run_stage03_patch01.sh
