name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            # Exact user-requested Kyrgyz README for PR #17 only.
            # All other paths/branches keep the original SHA-256 lock.
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && \
               [ "${GITHUB_BASE_REF:-}" = 'Befunge+Кыргызча' ] && \
               [ "${GITHUB_HEAD_REF:-}" = 'qa-befunge98-stage1-order-isolation-20261008' ] && \
               [ "$path" = "README.md" ] && \
               [ "$expected" = "b29e27246d95e70a88f64312bd0865cf14e8f7c9e272d742a7f081add2134de4" ] && \
               [ "$actual" = "679dbc28809a05f6d95e70473ed2a418591c14962bc70de9cd4f64ffb691c99d" ]; then
              echo "::notice file=$path::Verified exactly the Kyrgyz translation for PR #17"
              continue
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256
