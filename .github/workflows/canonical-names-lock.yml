name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  dmg-native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Audit arithmetic model independently of SM83 binaries
        run: |
          python3 tests/test_arithmetic_invariants.py
          python3 tests/test_emulator_wait.py
          python3 tests/test_bank_compare_reference.py
          python3 tests/test_bank_signed_add_reference.py
          python3 tests/test_sram_lease_model.py
          python3 tests/test_sram_owner_model.py
          python3 tests/test_owner_signed_cmp_model.py
          python3 tests/test_day_count32_reference.py
          python3 tests/test_work_counts32_reference.py
          python3 tests/test_bank_length_reference.py
          python3 tests/test_divide_u8_reference.py
          python3 tests/test_signed_divide_u8_reference.py
          python3 tests/test_variable_add_reference.py
      - name: Build DMG ROM using RGBDS v1.0.4
        run: |
          docker run --rm --mount type=bind,src="$PWD",dst=/work \
            -w /work ghcr.io/gbdev/rgbds:v1.0.4 \
            sh -c 'make build && rgblink -m build/calendar.map -o build/map_probe.gb build/calendar.o'
      - name: Measure current ROM0 feasibility for native owner253 case262
        shell: bash
        run: |
          set -euo pipefail
          test -s build/calendar.map
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tests").resolve()))
          from test_rom0_budget import ROM0_SIZE, rom0_usage
          allocated, free, max_gap, tail_gap, sections = rom0_usage("build/calendar.map")
          assert 0 < allocated < ROM0_SIZE
          assert 0 <= tail_gap <= max_gap <= free
          assert allocated + free == ROM0_SIZE
          print(f"ROM0_CASE262_FEASIBILITY=MEASURED allocated={allocated} free={free} "
                f"max_contiguous_gap={max_gap} tail_gap={tail_gap} sections={sections}", flush=True)
          from test_rom import TOTAL_CASES, MAX_BOOT_AND_TEST_FRAMES
          assert TOTAL_CASES >= 262, f"native262 CI expects >=262 cases; declared {TOTAL_CASES}"
          print(f"NATIVE_CASE262=ROM_LINKED_EMULATOR_PENDING expected_cases={TOTAL_CASES} "
                f"max_frames={MAX_BOOT_AND_TEST_FRAMES}", flush=True)
          PY
      - name: Measure Stage1 ROM0 deduplication against passing predecessor
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/SM83-Assembly+ግዕዝ' && github.event.head_commit.message == 'fix(sm83): repair ROM0 measurement workflow YAML' }}"
        shell: bash
        run: |
          set -euo pipefail
          base_dir="$(mktemp -d "${RUNNER_TEMP}/sm83-rom0-baseline.XXXXXX")"
          rmdir "$base_dir"
          trap 'git worktree remove --force "$base_dir" >/dev/null 2>&1 || true' EXIT
          test "$(git rev-parse HEAD^^)" = "d59d78c2121f982eb143cca0f4eaceadab04000b"
          git worktree add --detach "$base_dir" HEAD^^
          docker run --rm --mount type=bind,src="$base_dir",dst=/work \
            -w /work ghcr.io/gbdev/rgbds:v1.0.4 \
            sh -c 'make build && rgblink -m build/calendar.map -o build/map_probe.gb build/calendar.o'
          python3 tests/test_rom0_budget.py "$base_dir/build/calendar.map" build/calendar.map 15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install emulator for test only
        run: python -m pip install 'pyboy>=2,<3'
      - name: Inspect ROM and execute SM83 bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_rom.py build/calendar.gb | tee build/native262.log
          grep -Fq 'ROM_NATIVE_STATUS=A5 LAST_TEST_CASE=262 DISPATCH_STATUS=40 FRAMES=' build/native262.log
          grep -Fxq 'STAGE1_ARITHMETIC_SMOKE=PASS' build/native262.log
