            --output-dir source-shape-evidence \
            > source-shape-evidence/gate.stdout.jsonl \
            2> source-shape-evidence/gate.stderr.txt
          rc=$?
          set -e
          printf '%s\n' "$rc" > source-shape-evidence/gate.exit-code
          sha256sum source-shape-evidence/* > source-shape-evidence/SHA256SUMS
          exit "$rc"

      - name: Upload source-shape QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-malay-source-shape-gmp-rank-${{ github.sha }}
          path: source-shape-evidence/
          if-no-files-found: warn
          retention-days: 30
