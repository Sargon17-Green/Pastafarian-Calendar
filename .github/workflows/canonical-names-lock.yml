          grep -Eq 'STAGE_07_PATCH_03_PASS pairs=[0-9]+ overridden=[1-9][0-9]* preserved=[1-9][0-9]* mismatches=0' stage16-results.log
          grep -Fq 'STAGE_08_DISCOVERY_04_GUARDS_PASS mismatches=4 matches=1 divergentSteps=45' stage16-results.log
          grep -Fq 'STAGE_08_DISCOVERY_04_PROPERTIES_PASS cases=516 values=2580' stage16-results.log
          grep -Eq 'STAGE_09_PATCH_04_PASS cases=1076 cells=5380 legacyCalls=1076 overwritten=[1-9][0-9]* mismatches=0' stage16-results.log
          grep -Eq 'STAGE_09_PATCH_04_METAMORPHIC_PASS comparisons=301 cells=1505 historicalDifferences=[1-9][0-9]*' stage16-results.log
