name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  stage3-native-green:
    if: github.event_name == 'push' && github.ref == 'refs/heads/BASIC+ਪੰਜਾਬੀ' && !contains(github.event.head_commit.message, '[stage5-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned-family LibreOffice and system pyuno
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-common python3-uno
          libreoffice --version
          /usr/bin/python3 -c 'import uno; print("PYUNO_READY")'
      - name: Native Stage3 148/148 via isolated UNO profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/basic-punjabi-stage3-results"
          /usr/bin/python3 basic/qa/stage3_native_ci.py --basic-dir basic --output-dir "$RUNNER_TEMP/basic-punjabi-stage3-results"
      - name: Upload Stage3 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-punjabi-stage3-native-green
          path: ${{ runner.temp }}/basic-punjabi-stage3-results/
          if-no-files-found: warn

  stage4-bigint-differential:
    if: github.event_name == 'push' && github.ref == 'refs/heads/BASIC+ਪੰਜਾਬੀ' && !contains(github.event.head_commit.message, '[stage5-only]')
    needs: [verify, stage3-native-green]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ephemeral LibreOffice and pyuno
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-common python3-uno
          libreoffice --version
          /usr/bin/python3 -c 'import uno; print("PYUNO_READY")'
      - name: Stage4 deterministic Python oracle self-test
        run: /usr/bin/python3 basic/qa/stage4_bigint_differential.py --self-test
      - name: Stage4 live StarBasic signed BigInt differential and metamorphic tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/basic-punjabi-stage4-results"
          /usr/bin/python3 basic/qa/stage4_bigint_differential.py --basic-dir basic --output-dir "$RUNNER_TEMP/basic-punjabi-stage4-results"
      - name: Upload Stage4 raw native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-punjabi-stage4-bigint-differential
          path: ${{ runner.temp }}/basic-punjabi-stage4-results/
          if-no-files-found: warn

  stage5-semantic-native:
    if: github.event_name == 'push' && github.ref == 'refs/heads/BASIC+ਪੰਜਾਬੀ' && contains(github.event.head_commit.message, '[stage5-only]')
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install ephemeral LibreOffice and pyuno
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-common python3-uno
          libreoffice --version
          /usr/bin/python3 -c 'import uno; print("PYUNO_READY")'
      - name: Independent arithmetic self-test
        run: /usr/bin/python3 basic/qa/stage5_calendar_semantic_ci.py --self-test
      - name: Live StarBasic Stage5 semantic characterization
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/basic-punjabi-stage5-results"
          /usr/bin/python3 basic/qa/stage5_calendar_semantic_ci.py --basic-dir basic --output-dir "$RUNNER_TEMP/basic-punjabi-stage5-results"
      - name: Require complete bounded Stage5 evidence
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP/basic-punjabi-stage5-results" <<'PY'
          import csv, json, os, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          required = ('cases.tsv', 'assertions.json', 'source_metadata.json', 'status.txt', 'lo-startup.log')
          assert all((p / f).is_file() for f in required), 'STAGE5_EVIDENCE_MISSING'
          assert (p / 'status.txt').read_text().strip() == 'PASS', 'STAGE5_STATUS_NOT_PASS'
          a = json.loads((p / 'assertions.json').read_text())
          m = json.loads((p / 'source_metadata.json').read_text())
          with (p / 'cases.tsv').open(newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))
          expected = {'cases': 46, 'unique_cases': 46, 'native_invocations': 46, 'independent_oracle_checks': 35, 'boundary_checks': 7, 'structural_only_checks': 2, 'production_expected_error_checks': 2, 'failures': 0}
          assert all(a.get(k) == v for k, v in expected.items()), 'STAGE5_ASSERTIONS_MISMATCH'
          assert a.get('full_production_calendar') == 'NOT_IMPLEMENTED_NOT_ACCEPTED', 'STAGE5_PRODUCTION_MISREPRESENTED'
          assert m.get('full_production_calendar') == 'NOT_IMPLEMENTED', 'STAGE5_METADATA_MISREPRESENTED'
          assert m.get('source_stage3_lock') == '74aa087b81094f34eab9a0e04e395cc693dd83b1', 'STAGE5_SOURCE_LOCK_MISMATCH'
          assert m.get('candidate_commit') == os.environ['GITHUB_SHA'], 'STAGE5_COMMIT_MISMATCH'
          assert len(rows) == 46 and len({r['id'] for r in rows}) == 46, 'STAGE5_CASE_COUNT_MISMATCH'
          assert all(r['result'] == 'PASS' for r in rows), 'STAGE5_CASE_FAILURE'
          assert sum(r['category'] == 'production' for r in rows) == 2, 'STAGE5_PRODUCTION_ERROR_COUNT'
          assert all(r['provenance'] == 'EXPECTED_ERROR_NOT_CALENDAR_IMPLEMENTATION' and r['actual'].startswith('9302|') for r in rows if r['category'] == 'production'), 'STAGE5_PRODUCTION_ERROR_CONTRACT'
          print('STAGE5_EVIDENCE_CONTRACT_PASS 46/46; FULL_PRODUCTION_CALENDAR_NOT_IMPLEMENTED')
          PY
      - name: Upload Stage5 raw native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-punjabi-stage5-semantic-evidence
          path: ${{ runner.temp }}/basic-punjabi-stage5-results/
          if-no-files-found: warn
