name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  verify_csharp_ar_discovery_01:
    name: تحقق مستقل من الاكتشاف والرقعة الأولى
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/C#+العربية-الفصحى' }}
    runs-on: ubuntu-latest
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v5
      - name: تثبيت .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: إعادة اختبارات التأسيس
        run: dotnet run --project tests/PastafarianCalendar.Stage01Tests/PastafarianCalendar.Stage01Tests.csproj --configuration Release
      - name: تشغيل اختبار التباعد الأحمر
        id: discovery_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage02Tests/PastafarianCalendar.Stage02Tests.csproj --configuration Release
      - name: تحقق من أن الفروق الخمسة هي وحدها المتوقعة
        if: always()
        run: dotnet run --project tests/PastafarianCalendar.Stage02Tests/PastafarianCalendar.Stage02Tests.csproj --configuration Release -- --verify-expected-red

      - name: تحقق من تكافؤ الرقعة الأولى مع المرجع
        run: dotnet run --project tests/PastafarianCalendar.Stage03Tests/PastafarianCalendar.Stage03Tests.csproj --configuration Release
      - name: تشغيل الاختبار الأحمر لعدّ اليوم التاريخي
        id: discovery_day_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage04Tests/PastafarianCalendar.Stage04Tests.csproj --configuration Release
      - name: إثبات توقيع الاختلافات ورفض الأحمر الزائف
        if: always()
        run: |
          test "${{ steps.discovery_day_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage04Tests/PastafarianCalendar.Stage04Tests.csproj --configuration Release -- --verify-expected-red
      - name: تحقق من تكافؤ رقعة عدّ اليوم مع المرجع
        run: dotnet run --project tests/PastafarianCalendar.Stage05Tests/PastafarianCalendar.Stage05Tests.csproj --configuration Release
      - name: تشغيل الأحمر التاريخي لمسافة اليومين
        id: discovery_distance_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage06Tests/PastafarianCalendar.Stage06Tests.csproj --configuration Release
      - name: إثبات توقيع فروق المسافة دون رقعتها
        if: always()
        run: |
          test "${{ steps.discovery_distance_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage06Tests/PastafarianCalendar.Stage06Tests.csproj --configuration Release -- --verify-expected-red
      - name: تحقق من تصحيح المسافة وعلامات العمل في الرقعة الثالثة
        run: dotnet run --project tests/PastafarianCalendar.Stage07Tests/PastafarianCalendar.Stage07Tests.csproj --configuration Release
      - name: تشغيل اختبار الأحجار التاريخية الأحمر
        id: discovery_stones_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage08Tests/PastafarianCalendar.Stage08Tests.csproj --configuration Release
      - name: إثبات توقيع عيب التحوير المتسلسل دون ترقيعه
        if: always()
        run: |
          test "${{ steps.discovery_stones_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage08Tests/PastafarianCalendar.Stage08Tests.csproj --configuration Release -- --verify-expected-red
      - name: تكافؤ رقعة الأحجار الرابعة مع المرجع وحفظ الطفرة القديمة
        run: dotnet run --project tests/PastafarianCalendar.Stage09Tests/PastafarianCalendar.Stage09Tests.csproj --configuration Release
      - name: تشغيل اختبار ترتيب القطرات المخفية التاريخي الأحمر
        id: discovery_hidden_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage10Tests/PastafarianCalendar.Stage10Tests.csproj --configuration Release
      - name: إثبات توقيع انقلاب تخزين القطرات ورفض الأحمر الزائف
        if: always()
        run: |
          test "${{ steps.discovery_hidden_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage10Tests/PastafarianCalendar.Stage10Tests.csproj --configuration Release -- --verify-expected-red
      - name: تحقق من فهرسة قرب القطرات الخفية دون قلب تخزينها
        run: dotnet run --project tests/PastafarianCalendar.Stage11Tests/PastafarianCalendar.Stage11Tests.csproj --configuration Release
      - name: تشغيل اختبار استرجاع السابق التاريخي الأحمر
        id: discovery_prior_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage12Tests/PastafarianCalendar.Stage12Tests.csproj --configuration Release
      - name: إثبات صفر الفهرس وأخطاء المؤشرات السالبة دون تصحيح
        if: always()
        run: |
          test "${{ steps.discovery_prior_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage12Tests/PastafarianCalendar.Stage12Tests.csproj --configuration Release -- --verify-expected-red
      - name: تكافؤ رقعة استرجاع القطرات السابقة مع المرجع وحفظ القديم
        run: dotnet run --project tests/PastafarianCalendar.Stage13Tests/PastafarianCalendar.Stage13Tests.csproj --configuration Release
      - name: تشغيل الأحمر التاريخي لفهرسة طحْن القطرات الظاهرة
        id: discovery_visible_grind_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage14Tests/PastafarianCalendar.Stage14Tests.csproj --configuration Release
      - name: إثبات هبوط الفهرسة صفّاً واحداً وغياب صفّ الحارس
        if: always()
        run: |
          test "${{ steps.discovery_visible_grind_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage14Tests/PastafarianCalendar.Stage14Tests.csproj --configuration Release -- --verify-expected-red
      - name: مطابقة رقعة الحارس السابعة وحساب القطرات الظاهرة مع المرجع
        run: dotnet run --project tests/PastafarianCalendar.Stage15Tests/PastafarianCalendar.Stage15Tests.csproj --configuration Release
      - name: تشغيل الأحمر التاريخي لفهرسة ترتيب الأوعية
        id: discovery_bowl_order_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage16Tests/PastafarianCalendar.Stage16Tests.csproj --configuration Release
      - name: إثبات توقيع انزياح الرتبة الثامنة دون الرقعة
        if: always()
        run: |
          test "${{ steps.discovery_bowl_order_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage16Tests/PastafarianCalendar.Stage16Tests.csproj --configuration Release -- --verify-expected-red
      - name: مطابقة رقعة ترتيب الأوعية الثامنة مع المرجع
        run: dotnet run --project tests/PastafarianCalendar.Stage17Tests/PastafarianCalendar.Stage17Tests.csproj --configuration Release
      - name: تشغيل الأحمر التاريخي لمزائج الأوعية الثابتة
        id: discovery_fixed_pours_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage18Tests/PastafarianCalendar.Stage18Tests.csproj --configuration Release
      - name: إثبات توقيع الخلط بين هوية الوعاء وموقعه دون رقعة
        if: always()
        run: |
          test "${{ steps.discovery_fixed_pours_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage18Tests/PastafarianCalendar.Stage18Tests.csproj --configuration Release -- --verify-expected-red
      - name: مطابقة رقعة خريطة أسماء الأوعية التاسعة مع المرجع
        run: dotnet run --project tests/PastafarianCalendar.Stage19Tests/PastafarianCalendar.Stage19Tests.csproj --configuration Release
      - name: تشغيل الأحمر التاريخي لتلوث أوعية التحريك المباشر
        id: discovery_inplace_stir_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage20Tests/PastafarianCalendar.Stage20Tests.csproj --configuration Release
      - name: إثبات توقيع التلوث عند الكتابة في الوعاء قبل انتهاء الدورة
        if: always()
        run: |
          test "${{ steps.discovery_inplace_stir_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage20Tests/PastafarianCalendar.Stage20Tests.csproj --configuration Release -- --verify-expected-red
      - name: مطابقة رقعة التحريك بالظل العاشرة مع المرجع وحفظ تلوث القديم
        run: dotnet run --project tests/PastafarianCalendar.Stage21Tests/PastafarianCalendar.Stage21Tests.csproj --configuration Release
      - name: تشغيل الاختبار الأحمر لتبدّل ترتيب القطرة الأخيرة
        id: discovery_overwritten_drop46_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage22Tests/PastafarianCalendar.Stage22Tests.csproj --configuration Release
      - name: إثبات أن فشل ترتيب السؤال تاريخي لا فشل تجميع
        if: always()
        run: |
          test "${{ steps.discovery_overwritten_drop46_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage22Tests/PastafarianCalendar.Stage22Tests.csproj --configuration Release -- --verify-expected-red
      - name: إثبات صحة الالتقاط المحمي لترتيب القطرة السادسة والأربعين
        run: dotnet run --project tests/PastafarianCalendar.Stage23Tests/PastafarianCalendar.Stage23Tests.csproj --configuration Release

      - name: تشغيل الأحمر التاريخي لاختيار الوعاء التالي بمعرف ثابت
        id: discovery_fixed_next_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage24Tests/PastafarianCalendar.Stage24Tests.csproj --configuration Release
      - name: إثبات توقيع الاختلافات مع ترتيب القطرة السادسة والأربعين
        if: always()
        run: |
          test "${{ steps.discovery_fixed_next_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage24Tests/PastafarianCalendar.Stage24Tests.csproj --configuration Release -- --verify-expected-red

      - name: إثبات تكافؤ رقعة الجار الثانية عشرة مع المرجع وحفظ ندبة القديم
        run: dotnet run --project tests/PastafarianCalendar.Stage25Tests/PastafarianCalendar.Stage25Tests.csproj --configuration Release
      - name: تشغيل الأحمر التاريخي لحذف الحاتم من مربع سؤال الصلصة
        id: discovery_unsealed_question_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage26Tests/PastafarianCalendar.Stage26Tests.csproj --configuration Release
      - name: إثبات توقيع حذف الحاتم وحماية الرقعة الثانية عشرة
        if: always()
        run: |
          test "${{ steps.discovery_unsealed_question_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage26Tests/PastafarianCalendar.Stage26Tests.csproj --configuration Release -- --verify-expected-red
      - name: تكافؤ رقعة حاتم سؤال الصلصة الثالثة عشرة مع المرجع وحفظ ندبة القديم
        run: dotnet run --project tests/PastafarianCalendar.Stage27Tests/PastafarianCalendar.Stage27Tests.csproj --configuration Release
