name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  dmg-native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Audit arithmetic model independently of SM83 binaries
        run: |
          python3 tests/test_arithmetic_invariants.py
          python3 tests/test_emulator_wait.py
          python3 tests/test_bank_compare_reference.py
          python3 tests/test_bank_signed_add_reference.py
          python3 tests/test_sram_lease_model.py
          python3 tests/test_sram_owner_model.py
          python3 tests/test_owner_signed_cmp_model.py
          python3 tests/test_day_count32_reference.py
          python3 tests/test_work_counts32_reference.py
          python3 tests/test_bank_length_reference.py
          python3 tests/test_divide_u8_reference.py
          python3 tests/test_signed_divide_u8_reference.py
          python3 tests/test_variable_add_reference.py
      - name: Build DMG ROM using RGBDS v1.0.4
        run: |
          docker run --rm --mount type=bind,src="$PWD",dst=/work \
            -w /work ghcr.io/gbdev/rgbds:v1.0.4 \
            sh -c 'make build && rgblink -m build/calendar.map -o build/map_probe.gb build/calendar.o'
      - name: Measure Stage1 ROM0 deduplication against passing predecessor
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/SM83-Assembly+ግዕዝ' && github.event.head_commit.message == 'test(sm83): deduplicate status assertions with measured ROM0 budget' }}
        shell: bash
        run: |
          set -euo pipefail
          base_dir="$(mktemp -d "${RUNNER_TEMP}/sm83-rom0-baseline.XXXXXX")"
          rmdir "$base_dir"
          trap 'git worktree remove --force "$base_dir" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$base_dir" HEAD^
          docker run --rm --mount type=bind,src="$base_dir",dst=/work \
            -w /work ghcr.io/gbdev/rgbds:v1.0.4 \
            sh -c 'make build && rgblink -m build/calendar.map -o build/map_probe.gb build/calendar.o'
          python3 tests/test_rom0_budget.py "$base_dir/build/calendar.map" build/calendar.map 15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install emulator for test only
        run: python -m pip install 'pyboy>=2,<3'
      - name: Inspect ROM and execute SM83 bootstrap
        run: python tests/test_rom.py build/calendar.gb
