                  require(m["misses"] == sum(e["status"] in ("miss", "oversize") for e in events), "miss accounting")
                  require(m["oversize"] == sum(e["status"] == "oversize" for e in events), "oversize accounting")
                  require(m["bypasses"] == sum(e["status"] == "bypass" for e in events), "bypass accounting")
                  require(m["peakBytes"] == max([0] + [e["bytes"] for e in events]), "peak byte reconciliation")
                  require(m["peakEntries"] == max([0] + [e["entries"] for e in events]), "peak entry reconciliation")
                  require(0 <= m["peakBytes"] <= CAP and 0 <= m["peakEntries"] <= 64, "budget")
                  require(all(e["us"] >= 0 for e in events), "negative duration")
