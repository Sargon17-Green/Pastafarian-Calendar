name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256
  native-stage01:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Download and verify Chapel 2.10.0 package
        shell: bash
        run: |
          set -euo pipefail
          package='chapel-2.10.0-1.ubuntu24.amd64.deb'
          curl --fail --location --silent --show-error --retry 3 \
            'https://api.github.com/repos/chapel-lang/chapel/releases/tags/2.10.0' \
            --output chapel-release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('chapel-release.json').read_text(encoding='utf-8'))
          name = 'chapel-2.10.0-1.ubuntu24.amd64.deb'
          matches = [asset for asset in data.get('assets', []) if asset.get('name') == name]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one Chapel package asset')
          asset = matches[0]
          digest = asset.get('digest') or ''
          url = asset.get('browser_download_url') or ''
          if not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit('Missing or invalid published SHA-256 digest')
          if not url.startswith('https://github.com/chapel-lang/chapel/releases/download/2.10.0/'):
              raise SystemExit('Unexpected Chapel release download location')
          Path('chapel-package-url.txt').write_text(url, encoding='utf-8')
          Path('chapel-package-sha256.txt').write_text(digest[7:], encoding='ascii')
          PY
          curl --fail --location --silent --show-error --retry 3 \
            "$(cat chapel-package-url.txt)" --output "$package"
          printf '%s  %s\n' "$(cat chapel-package-sha256.txt)" "$package" | sha256sum --check --strict
          sudo apt-get update -qq
          sudo apt-get install -y "./$package"
          chpl --version

      - name: Execute Stage 1 using native Chapel
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)" | tee chapel-stage01-native.log
          bash test/run_stage01_tests.sh 2>&1 | tee -a chapel-stage01-native.log
          grep -Fxq 'STAGE_01_RESULT=PASS' chapel-stage01-native.log

      - name: Execute Stage 2 discovery using native Chapel
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)" | tee chapel-stage02-native.log
          bash test/run_stage02_tests.sh 2>&1 | tee -a chapel-stage02-native.log
          grep -Fxq 'STAGE_02_DISCOVERY_01_RESULT=PASS' chapel-stage02-native.log

      - name: Execute Stage 3 patch 01 using native Chapel
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)" | tee chapel-stage03-native.log
          bash test/run_stage03_tests.sh 2>&1 | tee -a chapel-stage03-native.log
          grep -Fxq 'STAGE_03_PATCH_01_RESULT=PASS' chapel-stage03-native.log

      - name: Execute Stage 4 discovery 02 using native Chapel
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)" | tee chapel-stage04-native.log
          bash test/run_stage04_tests.sh 2>&1 | tee -a chapel-stage04-native.log
          grep -Fxq 'STAGE_04_DISCOVERY_02_RESULT=PASS' chapel-stage04-native.log

      - name: Retain Stage 4 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapel-stage04-native-evidence
          path: chapel-stage04-native.log
          if-no-files-found: warn
          retention-days: 30
      - name: Retain Stage 3 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapel-stage03-native-evidence
          path: chapel-stage03-native.log
          if-no-files-found: warn
          retention-days: 30

      - name: Retain Stage 2 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapel-stage02-native-evidence
          path: chapel-stage02-native.log
          if-no-files-found: warn
          retention-days: 30

      - name: Retain native execution evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapel-stage01-native-evidence
          path: |
            chapel-stage01-native.log
            chapel-release.json
            chapel-package-sha256.txt
          if-no-files-found: warn
          retention-days: 30
