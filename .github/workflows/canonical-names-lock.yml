name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  perl-stage01:
    timeout-minutes: 10
    if: github.ref_name == 'Perl+國語' || github.head_ref == 'Perl+國語'
    runs-on: ubuntu-latest
    steps:
      - name: 取得來源
        uses: actions/checkout@v4
      - name: 安裝 Perl 5.40
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - name: 核對 Perl 執行環境
        shell: bash
        run: |
          set -euo pipefail
          perl -e 'die "需要 Perl 5.40 以上\n" if $] < 5.040; print "$^V\n"'
      - name: 檢查生產及參考模組的語法
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            perl -Ilib -It/lib -c "$file"
          done < <(find lib t/lib -name '*.pm' -type f -print0 | sort -z)
      - name: 執行完整第一階段測試
        shell: bash
        run: |
          set -euo pipefail
          prove -Ilib -It/lib -lr t
