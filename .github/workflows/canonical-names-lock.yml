name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  stage05-typescript-marathi:
    if: github.ref == 'refs/heads/TypeScript+मराठी'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Stages 01-05 guards and PATCH 01 / PATCH 02 regressions
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee stage05-results.log
          grep -Fq 'STAGE_01_PASS' stage05-results.log
          grep -Fq 'STAGE_02_DISCOVERY_01_GUARDS_PASS mismatches=3 matches=1' stage05-results.log
          grep -Eq 'STAGE_03_PATCH_01_PASS cases=[0-9]+ repairs=[1-9][0-9]* unchanged=[1-9][0-9]* mismatches=0' stage05-results.log
          grep -Fq 'STAGE_04_DISCOVERY_02_GUARDS_PASS mismatches=3 matches=2 cases=5' stage05-results.log
          grep -Eq 'STAGE_05_PATCH_02_PASS pairs=[0-9]+ days=[0-9]+ plusOne=[1-9][0-9]* scarChecks=[1-9][0-9]* scarForces=0 mismatches=0' stage05-results.log
      - name: Verify intentional expected-red regression
        shell: bash
        run: |
          set +e
          npm run test:discovery01:red > discovery01-red.log 2>&1
          result=$?
          set -e
          cat discovery01-red.log
          if [ "$result" -eq 0 ]; then
            echo "::error::Expected-red regression unexpectedly passed"
            exit 1
          fi
          grep -Fq 'DISCOVERY_01_EXPECTED_RED mismatches=3 matches=1' discovery01-red.log
      - name: Verify DISCOVERY 02 intentional expected-red regression
        shell: bash
        run: |
          set +e
          npm run test:discovery02:red > discovery02-red.log 2>&1
          result=$?
          set -e
          cat discovery02-red.log
          if [ "$result" -eq 0 ]; then
            echo "::error::DISCOVERY 02 expected-red unexpectedly passed"
            exit 1
          fi
          grep -Fq 'DISCOVERY_02_EXPECTED_RED mismatches=3 matches=2' discovery02-red.log
