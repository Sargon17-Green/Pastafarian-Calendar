name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  audit_php_bahasa_melayu:
    if: github.event_name == 'push' && github.ref == 'refs/heads/PHP+Bahasa-Melayu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Semak runtime PHP 64-bit
        shell: bash
        run: |
          php -v
          php -r 'if (PHP_INT_SIZE !== 8) { fwrite(STDERR, "PHP 64-bit diperlukan\n"); exit(1); }'
      - name: Semak sintaks PHP
        run: find src tests tools -name '*.php' -type f -print0 | xargs -0 -n 1 php -l
      - name: Ujian normatif Stage 1
        run: php -d memory_limit=512M tests/stage01_tests.php
      - name: Regresi integer tepat
        run: php -d memory_limit=512M tests/bigint_division_regression.php
      - name: Fixture tempatan deterministik
        run: |
          php -d memory_limit=512M tools/generate_stage01_fixtures.php
          git diff --exit-code -- tests/fixtures_stage01.json
      - name: Penemuan 01 — pastikan cacat legacy kekal terdedah
        run: php -d memory_limit=512M tests/verify_stage02_discovery01.php
      - name: Tampalan 01 — regresi setara normatif
        run: php -d memory_limit=512M tests/stage03_patch01_tests.php
      - name: Penemuan 02 — sahkan parut sejarah kekal terdedah
        run: php -d memory_limit=512M tests/verify_stage04_discovery02.php
      - name: Tampalan 02 — kesetaraan normatif bagi nombor hari
        run: php -d memory_limit=512M tests/stage05_patch02_tests.php
      - name: Penemuan 03 — sahkan parut jarak sejarah
        run: php -d memory_limit=512M tests/verify_stage06_discovery03.php
      - name: Tampalan 03 — kesetaraan normatif jarak inklusif
        run: php -d memory_limit=512M tests/stage07_patch03_tests.php
      - name: Penemuan 04 — sahkan mutasi batu merah yang dijangka
        run: php -d memory_limit=512M tests/verify_stage08_discovery04.php
      - name: Tampalan 04 — kesetaraan normatif batu dan parut mutasi
        run: php -d memory_limit=512M tests/stage09_patch04_tests.php
      - name: Penemuan 05 — sahkan stor hidden terbalik
        run: php -d memory_limit=512M tests/verify_stage10_discovery05.php
      - name: Tampalan 05 — bandingkan hidden dengan oracle normatif
        run: php -d memory_limit=512M tests/stage11_patch05_tests.php
      - name: Penemuan 06 — pastikan pembaca prior legacy buta terhadap hidden
        run: php -d memory_limit=512M tests/verify_stage12_discovery06.php
      - name: Tampalan 06 — akses prior positif dan hidden
        run: php -d memory_limit=512M tests/stage13_patch06_tests.php
