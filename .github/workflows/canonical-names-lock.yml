          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Run Stage 3 Scala PATCH 01 tests
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch 'Test / runMain pastafari.Stage03Tests' 2>&1 | tee stage03.log
          grep -Fq 'RISULTATO STADIO 3: 12 PASS, 0 FAIL' stage03.log

  native-stage04-discovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Scala+Italiano'
