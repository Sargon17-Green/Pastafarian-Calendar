name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  stage10_native_v:
    name: V 0.5.2 — DISCOVERY 05 EXPECTED_RED
    if: github.event_name == 'push' && github.ref == 'refs/heads/V+አማርኛ'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install immutable V 0.5.2 release binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v-release"
          curl --fail --location --show-error --silent --retry 3 --retry-delay 2 \
            --output "$RUNNER_TEMP/v_linux.zip" \
            https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          unzip -q "$RUNNER_TEMP/v_linux.zip" -d "$RUNNER_TEMP/v-release"
          v_bin="$(find "$RUNNER_TEMP/v-release" -type f -name v -print -quit)"
          test -n "$v_bin"
          chmod +x "$v_bin"
          version="$("$v_bin" version)"
          echo "Installed: $version"
          if [ "$version" != 'V 0.5.2 7647ce1' ]; then
            echo "::error::Unexpected V compiler identity: $version"
            exit 1
          fi
          echo "$(dirname "$v_bin")" >> "$GITHUB_PATH"
      - name: Native V formatting diagnosis — temporary
        shell: bash
        run: |
          set -euo pipefail
          v fmt -w ./pastafari/discovery05_expected_red_test.v
          v fmt -w ./pastafari/legacy_hidden.v
          git --no-pager diff -- ./pastafari/discovery05_expected_red_test.v ./pastafari/legacy_hidden.v
      - name: Verify V version and source formatting
        shell: bash
        run: |
          set -euo pipefail
          v version
          v fmt -verify ./pastafari
      - name: Stage 1 — normative reference
        run: v test ./pastafari/normative_oracle_test.v
      - name: Discovery 01 — legacy behavior witnesses
        run: v test ./pastafari/discovery01_witness_test.v
      - name: PATCH 01 — formerly RED regression now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery01_expected_red_test.v
          v test ./pastafari/discovery01_expected_red_test.v
      - name: PATCH 01 — signed and oversized integer boundaries
        run: v test ./pastafari/patch01_test.v
      - name: DISCOVERY 02 — historical day tag still wrong
        run: v test ./pastafari/discovery02_witness_test.v
      - name: PATCH 02 — formerly RED tests now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery02_expected_red_test.v
          v test ./pastafari/discovery02_expected_red_test.v
      - name: PATCH 02 — boundary, scar and arbitrary precision
        run: v test ./pastafari/patch02_test.v
      - name: DISCOVERY 03 — preserve legacy tag-distance witnesses
        run: v test ./pastafari/discovery03_witness_test.v
      - name: PATCH 03 — formerly RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery03_expected_red_test.v
          v test ./pastafari/discovery03_expected_red_test.v
      - name: PATCH 03 — comparison scar, signed boundaries, big integers
        run: v test ./pastafari/patch03_test.v
      - name: DISCOVERY 04 — legacy sequential mutation witnesses
        run: v test ./pastafari/discovery04_witness_test.v
      - name: PATCH 04 — four formerly RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery04_expected_red_test.v
          v test ./pastafari/discovery04_expected_red_test.v
      - name: PATCH 04 — snapshot, original legacy call and table
        run: v test ./pastafari/patch04_test.v
      - name: DISCOVERY 05 — seven hidden drops with historical reversed positions
        run: v test ./pastafari/discovery05_witness_test.v
      - name: DISCOVERY 05 — four intentional RED lookup failures
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery05_expected_red_test.v
          set +e
          v test ./pastafari/discovery05_expected_red_test.v 2>&1 | tee stage10_expected_red.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo '::error::DISCOVERY 05 unexpectedly GREEN before PATCH 05'
            exit 1
          fi
          for test_name in \
            test_discovery05_expected_red_nearest_hidden_one \
            test_discovery05_expected_red_hidden_two \
            test_discovery05_expected_red_hidden_three \
            test_discovery05_expected_red_farthest_hidden_seven; do
            if ! grep -Fq "$test_name" stage10_expected_red.log; then
              echo "::error::Missing intended RED assertion: $test_name"
              exit 1
            fi
          done
          if ! grep -Eq '(FAIL|FAILED|assert|Assertion)' stage10_expected_red.log; then
            echo '::error::A nonzero exit without asserted failure is not an expected RED'
            exit 1
          fi
          echo 'DISCOVERY 05 — four intentional RED cases verified'
      - name: Preserve stage 10 expected RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v-amharic-stage10-red-evidence
          path: stage10_expected_red.log
          if-no-files-found: ignore
