      - name: Compile original same-SHA Foundation witness and bounded gate-index witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/first_divergence_gate_probe.f90 <<'F90'
          program original_gates
            use iso_fortran_env, only: int64
            use big_integer, only: bi_to_string
            use normative_oracle_core, only: foundation_day
            use normative_oracle_calendar, only: YearRecord, reset_gate_cache, year5000, gate_day, gate_cache_bounds
            implicit none
            type(YearRecord) :: y
            integer(int64) :: a,b,k
            call reset_gate_cache()
            y=year5000(foundation_day())
            call gate_cache_bounds(a,b)
            if (a>0_int64 .or. b<0_int64 .or. a<(-300_int64) .or. b>300_int64) error stop 'gate bound exceeded'
            write(*,'(A,I0,A,I0)') 'BOUND=',a,',',b
            write(*,'(A,I0,A,I0,A,I0,A,A,A,A)') 'YEAR=',5000,',',y%openGateIndex,',',y%closeGateIndex,',', &
              trim(bi_to_string(y%openGateDay)),',',trim(bi_to_string(y%closeGateDay))
            do k=a,b
              write(*,'(A,I0,A,A)') 'GATE=',k,',',trim(bi_to_string(gate_day(k)))
            end do
          end program
          F90
          gfortran -std=f2018 -ffree-line-length-none -fcheck=all -J build -I build -c src/big_integer.f90 -o build/big_integer.o
          gfortran -std=f2018 -ffree-line-length-none -fcheck=all -J build -I build -c src/source_language_catalog.f90 -o build/source_language_catalog.o
          gfortran -std=f2018 -ffree-line-length-none -fcheck=all -J build -I build -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
          gfortran -std=f2018 -ffree-line-length-none -fcheck=all -J build -I build -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
          gfortran -std=f2018 -ffree-line-length-none -fcheck=all -J build -I build -c test/normative_oracle_calendar.f90 -o build/normative_oracle_calendar.o
          gfortran -std=f2018 -ffree-line-length-none -fcheck=all -J build -I build build/first_divergence_gate_probe.f90 build/big_integer.o build/source_language_catalog.o build/bootstrap_infrastructure.o build/normative_oracle_core.o build/normative_oracle_calendar.o -o build/first_divergence_gate_probe
          gfortran -std=f2018 -ffree-line-length-none -fcheck=all -J build -I build test/stage01_foundation_candidate_probe.f90 build/big_integer.o build/source_language_catalog.o build/bootstrap_infrastructure.o build/normative_oracle_core.o build/normative_oracle_calendar.o -o build/stage01_foundation_candidate_probe
