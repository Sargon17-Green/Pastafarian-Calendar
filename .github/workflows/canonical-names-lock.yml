name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  stage09-typescript-marathi:
    if: github.ref == 'refs/heads/TypeScript+मराठी'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Stages 01-09 regression guards and snapshot patch
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee stage09-results.log
          grep -Fq 'STAGE_01_PASS' stage09-results.log
          grep -Fq 'STAGE_02_DISCOVERY_01_GUARDS_PASS mismatches=3 matches=1' stage09-results.log
          grep -Eq 'STAGE_03_PATCH_01_PASS cases=[0-9]+ repairs=[1-9][0-9]* unchanged=[1-9][0-9]* mismatches=0' stage09-results.log
          grep -Fq 'STAGE_04_DISCOVERY_02_GUARDS_PASS mismatches=3 matches=2 cases=5' stage09-results.log
          grep -Eq 'STAGE_05_PATCH_02_PASS pairs=[0-9]+ days=[0-9]+ plusOne=[1-9][0-9]* scarChecks=[1-9][0-9]* scarForces=0 mismatches=0' stage09-results.log
          grep -Fq 'STAGE_06_DISCOVERY_03_GUARDS_PASS mismatches=4 matches=1' stage09-results.log
          grep -Fq 'STAGE_06_DISCOVERY_03_PROPERTIES_PASS pairs=225' stage09-results.log
          grep -Fq 'STAGE_06_DISCOVERY_03_LARGE_AND_ISOLATION_PASS' stage09-results.log
          grep -Fq 'STAGE_06_DISCOVERY_03_ERRORS_PASS' stage09-results.log
          grep -Fq 'STAGE_06_DISCOVERY_03_LIFECYCLE_PASS' stage09-results.log
          grep -Eq 'STAGE_07_PATCH_03_PASS pairs=[0-9]+ overridden=[1-9][0-9]* preserved=[1-9][0-9]* mismatches=0' stage09-results.log
          grep -Fq 'STAGE_08_DISCOVERY_04_GUARDS_PASS mismatches=4 matches=1 divergentSteps=45' stage09-results.log
          grep -Fq 'STAGE_08_DISCOVERY_04_PROPERTIES_PASS cases=516 values=2580' stage09-results.log
          grep -Eq 'STAGE_09_PATCH_04_PASS cases=1076 cells=5380 legacyCalls=1076 overwritten=[1-9][0-9]* mismatches=0' stage09-results.log
          grep -Eq 'STAGE_09_PATCH_04_METAMORPHIC_PASS comparisons=301 cells=1505 historicalDifferences=[1-9][0-9]*' stage09-results.log
      - name: Verify intentional expected-red regression
        shell: bash
        run: |
          set +e
          npm run test:discovery01:red > discovery01-red.log 2>&1
          result=$?
          set -e
          cat discovery01-red.log
          if [ "$result" -eq 0 ]; then
            echo "::error::Expected-red regression unexpectedly passed"
            exit 1
          fi
          grep -Fq 'DISCOVERY_01_EXPECTED_RED mismatches=3 matches=1' discovery01-red.log
      - name: Verify DISCOVERY 02 intentional expected-red regression
        shell: bash
        run: |
          set +e
          npm run test:discovery02:red > discovery02-red.log 2>&1
          result=$?
          set -e
          cat discovery02-red.log
          if [ "$result" -eq 0 ]; then
            echo "::error::DISCOVERY 02 expected-red unexpectedly passed"
            exit 1
          fi
          grep -Fq 'DISCOVERY_02_EXPECTED_RED mismatches=3 matches=2' discovery02-red.log
      - name: Verify Stage 06 historical expected-red
        shell: bash
        run: |
          set +e
          npm run test:discovery03:red > discovery03-red.log 2>&1
          result=$?
          set -e
          cat discovery03-red.log
          if [ "$result" -eq 0 ]; then
            echo "::error::Historical Discovery 03 unexpectedly passed"
            exit 1
          fi
          grep -Fq 'DISCOVERY_03_EXPECTED_RED mismatches=4 matches=1' discovery03-red.log
      - name: Verify DISCOVERY 04 historical expected-red
        shell: bash
        run: |
          set +e
          npm run test:discovery04:red > discovery04-red.log 2>&1
          result=$?
          set -e
          cat discovery04-red.log
          if [ "$result" -eq 0 ]; then
            echo "::error::Historical DISCOVERY 04 unexpectedly passed"
            exit 1
          fi
          grep -Fq 'DISCOVERY_04_EXPECTED_RED mismatches=4 matches=1' discovery04-red.log
