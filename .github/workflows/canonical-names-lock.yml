name: Lás kanónískra heita

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Staðfesta lás kanónískra heita
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Misræmi í lás kanónískra heita; vænt=$expected raun=$actual"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256
