name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  native-stage27-kotlin-cymraeg:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Kotlin+Cymraeg'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Welsh Kotlin branch
        uses: actions/checkout@v4
        with:
          ref: 'Kotlin+Cymraeg'
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin 1.9.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip' \
            -o "$RUNNER_TEMP/kotlin-compiler-1.9.0.zip"
          unzip -q "$RUNNER_TEMP/kotlin-compiler-1.9.0.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kotlinc/bin/kotlinc" -version
      - name: Verify Stage 01 through Stage 27 with original oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = 'Kotlin+Cymraeg'
