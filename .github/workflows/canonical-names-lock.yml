name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  perl-stage01:
    timeout-minutes: 10
    if: github.ref_name == 'Perl+國語' || github.head_ref == 'Perl+國語'
    runs-on: ubuntu-latest
    steps:
      - name: 取得來源
        uses: actions/checkout@v4
      - name: 安裝 Perl 5.40
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - name: 核對 Perl 執行環境
        shell: bash
        run: |
          set -euo pipefail
          perl -e 'die "需要 Perl 5.40 以上\n" if $] < 5.040; print "$^V\n"'
      - name: 檢查生產及參考模組的語法
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            perl -Ilib -It/lib -c "$file"
          done < <(find lib t/lib -name '*.pm' -type f -print0 | sort -z)
      - name: 執行完整第一階段測試
        shell: bash
        run: |
          set -euo pipefail
          prove -Ilib -It/lib -lr t
      - name: 量測交織演算法資源
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 75s perl -Ilib -It/lib tools/profile_weaving.pl --profile smoke --seconds 15 --rss-kib 262144
      - name: 只在明確標記的提交執行擴充交織量測
        if: contains(github.event.head_commit.message, '[weaving-extended]')
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s perl -Ilib -It/lib tools/profile_weaving.pl --profile extended --seconds 45 --rss-kib 393216
      - name: 只在明確標記時執行 47 月份獨立多項式計數
        if: contains(github.event.head_commit.message, '[weaving-polynomial]')
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s perl -Ilib -It/lib tools/profile_polynomial.pl --seconds 90 --rss-kib 262144
      - name: 只在標記提交驗證 47 月份 252 日的多項式計數
        if: contains(github.event.head_commit.message, '[weaving-polynomial-252]')
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 360s perl -Ilib -It/lib tools/profile_polynomial.pl --profile year-min --seconds 90 --rss-kib 262144
      - name: 僅限指定提交之中間排名受控量測（含 BLOCKED 分類）
        if: contains(github.event.head_commit.message, '[weaving-unrank-middle]')
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 145s perl -Ilib -It/lib tools/profile_unrank_middle.pl --seconds 20 --rss-kib 196608
      - name: 僅限指定提交之長時間 47 月份中間排名量測（含 BLOCKED 分類）
        if: contains(github.event.head_commit.message, '[weaving-unrank-middle-long]')
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 210s perl -Ilib -It/lib tools/profile_unrank_middle.pl --seconds 75 --rss-kib 262144
      - name: 限定提交檢驗 47 月份 252 日中位排名雙向還原
        if: contains(github.event.head_commit.message, '[weaving-rank-roundtrip-252]')
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 165s perl -Ilib -It/lib tools/profile_rank_roundtrip.pl --seconds 130 --rss-kib 262144
      - name: 僅限標記提交：同機記憶體與磁碟串流精確計數對照
        if: contains(github.event.head_commit.message, '[weaving-stream-profile]')
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 200s perl -Ilib -It/lib tools/profile_polynomial_stream.pl --seconds 40 --rss-kib 262144 --temp-file-bytes 268435456
      - name: 僅限標記提交之 47 月份 252 日串流雙向精確排名驗證
        if: contains(github.event.head_commit.message, '[weaving-stream-roundtrip-252]')
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 205s perl -Ilib -It/lib tools/profile_stream_rank_roundtrip.pl --seconds 165 --rss-kib 262144
  indexed-roundtrip252:
    name: 47 月份 252 日索引式雙向排名（獨立資源監督）
    if: github.event_name == 'push' && github.ref_name == 'Perl+國語' && contains(github.event.head_commit.message, '[weaving-indexed-roundtrip-252]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得來源
        uses: actions/checkout@v4
      - name: 安裝 Perl 5.40
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - name: 核對單一索引式雙向驗證腳本的語法
        shell: bash
        run: |
          set -euo pipefail
          perl -Ilib -It/lib -c tools/profile_indexed_rank_roundtrip.pl
      - name: 受控執行完整 270 位排名往返
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 185s perl -Ilib -It/lib tools/profile_indexed_rank_roundtrip.pl --seconds 135 --rss-kib 262144
