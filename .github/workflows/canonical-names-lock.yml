name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  stage1-native:
    if: github.ref == 'refs/heads/COBOL+简体中文'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Create persistent log
        shell: bash
        run: |
          mkdir -p build
          printf 'STAGE=1\nMODE=LINUX_GNUCOBOL_NATIVE_REGRESSION\nCOMMIT=%s\n' "$GITHUB_SHA" > build/stage1-native.log

      - name: Install GnuCOBOL 3 and log the toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq 2>&1 | tee -a build/stage1-native.log
          sudo apt-get install -y --no-install-recommends gnucobol3 2>&1 | tee -a build/stage1-native.log
          cobc --version 2>&1 | tee -a build/stage1-native.log

      - name: Strict compile and execute Stage 1 bootstrap suite
        shell: bash
        run: |
          set -euo pipefail
          echo 'PHASE=STRICT_COMPILE' | tee -a build/stage1-native.log
          timeout --signal=TERM --kill-after=10s 300s \
            cobc -std=default -free \
            -Wall -Wextra -Wno-terminator -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
            -x -o build/bootstrap-tests \
            test/bootstrap_tests.cob \
            test/big_integer_tests.cob \
            test/normative_primitive_tests.cob \
            test/source_catalog_tests.cob \
            test/family_bruteforce_tests.cob \
            test/selection_tests.cob \
            test/ownership_error_tests.cob \
            src/big_integer.cob \
            src/source_language_catalog.cob \
            src/monster_bootstrap.cob \
            test/oracle/oracle_constants.cob \
            test/oracle/oracle_bigint.cob \
            test/oracle/normative_basic.cob \
            test/oracle/normative_bigint_primitives.cob \
            test/oracle/normative_sauce.cob \
            test/oracle/normative_selection.cob \
            test/oracle/normative_families.cob \
            test/oracle/normative_weaving.cob \
            test/oracle/normative_gates.cob \
            test/oracle/normative_year.cob \
            test/oracle/normative_oracle.cob \
            2>&1 | tee -a build/stage1-native.log

          echo 'PHASE=BOOTSTRAP_TESTS' | tee -a build/stage1-native.log
          timeout --signal=TERM --kill-after=10s 600s \
            ./build/bootstrap-tests 2>&1 | tee -a build/stage1-native.log

          grep -Fxq 'BOOTSTRAP_RESULT=PASS' build/stage1-native.log
          grep -Eq '^已执行测试: [[:space:]]*0*181[[:space:]]*$' build/stage1-native.log
          grep -Eq '^失败测试: [[:space:]]*0+[[:space:]]*$' build/stage1-native.log
          echo 'RESULT=PASS_STAGE1_NATIVE_LINUX' | tee -a build/stage1-native.log

      - name: Preserve native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-native-evidence
          path: build/stage1-native.log
          if-no-files-found: warn
          retention-days: 30

