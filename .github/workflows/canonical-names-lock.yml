name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  native-stage01:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Scala+Italiano'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Run Stage 1 Scala tests
        run: sbt -batch 'Test / runMain pastafari.Stage01Tests'

  native-stage02-discovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Scala+Italiano'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Compile and confirm the three expected SAVE divergences
        shell: bash
        run: |
          set +e
          sbt -batch 'Test / runMain pastafari.Stage02Tests' > stage02.log 2>&1
          rc=$?
          set -e
          cat stage02.log
          test "$rc" -ne 0
          grep -Fq 'RISULTATO STADIO 2: 7 PASS, 3 FAIL' stage02.log
          for operand in M 2M 3M; do
            grep -Fq "FAIL — equivalenza normativa SAVE(${operand})" stage02.log
          done
          grep -Fq 'PASS — equivalenza normativa SAVE(M+1)' stage02.log

  native-stage03-patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Scala+Italiano'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Run Stage 3 Scala PATCH 01 tests
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch 'Test / runMain pastafari.Stage03Tests' 2>&1 | tee stage03.log
          grep -Fq 'RISULTATO STADIO 3: 12 PASS, 0 FAIL' stage03.log

  native-stage04-discovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Scala+Italiano'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Verify the Stage 4 intentional-red signature
        shell: bash
        run: |
          set +e
          sbt -batch 'Test / runMain pastafari.Stage04Tests' > stage04.log 2>&1
          rc=$?
          set -e
          cat stage04.log
          test "$rc" -ne 0
          grep -Fq 'RISULTATO STADIO 4: 14 PASS, 3 FAIL' stage04.log
          test "$(grep -Fc 'PASS — ' stage04.log)" -eq 14
          test "$(grep -Fc 'FAIL — ' stage04.log)" -eq 3
          grep -Fq 'PASS — equivalenza normativa giorno Fondazione-2' stage04.log
          grep -Fq 'PASS — equivalenza normativa giorno Fondazione-1' stage04.log
          for offset in '' '+1' '+2'; do
            grep -Fq "FAIL — equivalenza normativa giorno Fondazione${offset}" stage04.log
          done
