name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  audit_php_bahasa_melayu:
    if: github.event_name == 'push' && github.ref == 'refs/heads/PHP+Bahasa-Melayu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Semak runtime PHP 64-bit
        shell: bash
        run: |
          php -v
          php -r 'if (PHP_INT_SIZE !== 8) { fwrite(STDERR, "PHP 64-bit diperlukan\n"); exit(1); }'
      - name: Semak sintaks PHP
        run: find src tests tools -name '*.php' -type f -print0 | xargs -0 -n 1 php -l
      - name: Ujian normatif Stage 1
        run: php -d memory_limit=512M tests/stage01_tests.php
      - name: Regresi integer tepat
        run: php -d memory_limit=512M tests/bigint_division_regression.php
      - name: Fixture tempatan deterministik
        run: |
          php -d memory_limit=512M tools/generate_stage01_fixtures.php
          git diff --exit-code -- tests/fixtures_stage01.json
      - name: Penemuan 01 — pastikan cacat legacy kekal terdedah
        run: php -d memory_limit=512M tests/verify_stage02_discovery01.php
      - name: Tampalan 01 — regresi setara normatif
        run: php -d memory_limit=512M tests/stage03_patch01_tests.php
      - name: Penemuan 02 — sahkan parut sejarah kekal terdedah
        run: php -d memory_limit=512M tests/verify_stage04_discovery02.php
      - name: Tampalan 02 — kesetaraan normatif bagi nombor hari
        run: php -d memory_limit=512M tests/stage05_patch02_tests.php
      - name: Penemuan 03 — sahkan parut jarak sejarah
        run: php -d memory_limit=512M tests/verify_stage06_discovery03.php
      - name: Tampalan 03 — kesetaraan normatif jarak inklusif
        run: php -d memory_limit=512M tests/stage07_patch03_tests.php
      - name: Penemuan 04 — sahkan mutasi batu merah yang dijangka
        run: php -d memory_limit=512M tests/verify_stage08_discovery04.php
      - name: Tampalan 04 — kesetaraan normatif batu dan parut mutasi
        run: php -d memory_limit=512M tests/stage09_patch04_tests.php
      - name: Penemuan 05 — sahkan stor hidden terbalik
        run: php -d memory_limit=512M tests/verify_stage10_discovery05.php
      - name: Tampalan 05 — bandingkan hidden dengan oracle normatif
        run: php -d memory_limit=512M tests/stage11_patch05_tests.php
      - name: Penemuan 06 — pastikan pembaca prior legacy buta terhadap hidden
        run: php -d memory_limit=512M tests/verify_stage12_discovery06.php
      - name: Tampalan 06 — akses prior positif dan hidden
        run: php -d memory_limit=512M tests/stage13_patch06_tests.php
      - name: Penemuan 07 — pastikan jadual grind legacy salah
        run: php -d memory_limit=512M tests/verify_stage14_discovery07.php
      - name: Tampalan 07 — sahkan sentinel dan sebelas pengisaran
        run: php -d memory_limit=512M tests/stage15_patch07_tests.php
      - name: Penemuan 08 — bukti ordinal satu pada penyahpangkat sifar
        run: php -d memory_limit=512M tests/verify_stage16_discovery08.php
      - name: Tampalan 08 — semua 720 permutasi dan bukti legacy
        run: php -d memory_limit=512M tests/stage17_patch08_tests.php
      - name: Penemuan 09 — tuangan tersalah baca ID tetap
        run: php -d memory_limit=512M tests/verify_stage18_discovery09.php
      - name: Tampalan 09 — alias posisi dan bukti legacy 720 susunan
        run: php -d memory_limit=512M tests/stage19_patch09_tests.php
      - name: Penemuan 10 — mangkuk legacy dicemari bacaan in-place
        run: php -d memory_limit=512M tests/verify_stage20_discovery10.php
      - name: Tampalan 10 — snapshot enam mangkuk dan parut sejarah
        run: php -d memory_limit=512M tests/stage21_patch10_tests.php
      - name: Penemuan 11 — susunan titisan 46 ditindih kacauan akhir
        run: php -d memory_limit=512M tests/verify_stage22_discovery11.php
      - name: Tampalan 11 — kunci susunan titisan 46
        run: php -d memory_limit=512M tests/stage23_patch11_tests.php
  audit_php_bahasa_melayu_stages24_32:
    if: github.event_name == 'push' && github.ref == 'refs/heads/PHP+Bahasa-Melayu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Semak runtime PHP 64-bit pada regresi lanjut
        shell: bash
        run: |
          php -r 'if (PHP_INT_SIZE !== 8) { fwrite(STDERR, "PHP 64-bit diperlukan\n"); exit(1); }'
      - name: Penemuan 12 — jiran mangkuk bukan ID berturutan
        run: php -d memory_limit=512M tests/verify_stage24_discovery12.php
      - name: Tampalan 12 — jiran benar menurut susunan 46
        run: php -d memory_limit=512M tests/stage25_patch12_tests.php
      - name: Penemuan 13 — pemilihan modulo tanpa rejection sampling
        run: php -d memory_limit=512M tests/verify_stage26_discovery13.php
      - name: Tampalan 13 — penolakan sampel di atas cutoff
        run: php -d memory_limit=512M tests/stage27_patch13_tests.php
      - name: Penemuan 14 — berat digit pilihan besar salah
        run: php -d memory_limit=512M tests/verify_stage28_discovery14.php
      - name: Tampalan 14 — digit pertama berat satu dan kedua berat M
        run: php -d memory_limit=512M tests/stage29_patch14_tests.php
      - name: Penemuan 15 — digit ketiga tidak dibaca bagi pilihan tiga digit
        run: php -d memory_limit=512M tests/verify_stage30_discovery15.php
      - name: Tampalan 15 — bacaan tiga digit dengan pemberat yang betul
        run: php -d memory_limit=512M tests/stage31_patch15_tests.php
      - name: Penemuan 16 — digit keempat tertinggal daripada pilihan besar
        run: php -d memory_limit=512M tests/verify_stage32_discovery16.php

  audit_php_bahasa_melayu_stage33:
    if: github.event_name == 'push' && github.ref == 'refs/heads/PHP+Bahasa-Melayu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Semak runtime PHP 64-bit bagi Stage33
        run: php -r 'if (PHP_INT_SIZE !== 8) { fwrite(STDERR, "PHP 64-bit diperlukan\n"); exit(1); }'
      - name: Tampalan 16 — digit keempat pada berat M kuasa tiga
        run: php -d memory_limit=512M tests/stage33_patch16_tests.php

  audit_php_bahasa_melayu_stage34:
    if: github.event_name == 'push' && github.ref == 'refs/heads/PHP+Bahasa-Melayu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Semak runtime PHP 64-bit bagi Stage34
        run: php -r 'if (PHP_INT_SIZE !== 8) { fwrite(STDERR, "PHP 64-bit diperlukan\n"); exit(1); }'
      - name: Penemuan 17 — digit kelima tiada pada pilihan lima digit
        run: php -d memory_limit=512M tests/verify_stage34_discovery17.php

  audit_php_bahasa_melayu_stage35:
    if: github.event_name == 'push' && github.ref == 'refs/heads/PHP+Bahasa-Melayu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Semak runtime PHP 64-bit bagi Stage35
        run: php -r 'if (PHP_INT_SIZE !== 8) { fwrite(STDERR, "PHP 64-bit diperlukan\n"); exit(1); }'
      - name: Tampalan 17 — pulihkan digit kelima pada berat M kuasa empat
        run: php -d memory_limit=512M tests/stage35_patch17_tests.php

  stage36-php-native:
    if: github.event_name == 'push' && github.ref == 'refs/heads/PHP+Bahasa-Melayu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup PHP native
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Syntax and predecessor artifacts
        shell: bash
        run: |
          set -euo pipefail
          php -v
          test -f src/Legacy/LegacyYearJumpGuess18.php
          test -f src/Legacy/LegacyMissingFifthDigit17.php
          test -f src/Patches/FifthDigitPatch17.php
          test -f tests/oracle/NormativeOracle.php
          php -l src/Legacy/LegacyYearJumpGuess18.php
          php -l src/BootstrapKernel.php
          php -l tests/stage36_discovery18_tests.php
          php -l tests/verify_stage36_discovery18.php
      - name: Run real Stage36 EXPECTED_RED verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'PROJECT_ID=PC-BRANCH-PHP-MALAY\nSTAGE=36\nCOMMIT_SHA=%s\n' "$GITHUB_SHA" > evidence/source.txt
          php -v > evidence/php-version.txt
          set +e
          timeout --signal=TERM --kill-after=5s 900s \
            php -d memory_limit=512M tests/verify_stage36_discovery18.php \
            > evidence/stdout.txt 2> evidence/stderr.txt
          code=$?
          set -e
          printf '%s\n' "$code" > evidence/exit-code.txt
          cat evidence/stdout.txt
          cat evidence/stderr.txt >&2
          if [ "$code" -ne 0 ] || [ -s evidence/stderr.txt ]; then
            echo "::error::Stage36 native verification failed with code $code or non-empty stderr"
            exit 1
          fi
          grep -qx 'STAGE36_DISCOVERY18_NATIVE_EXPECTED_RED_COMPLETE' evidence/stdout.txt
          printf 'STAGE36_DISCOVERY18_NATIVE_EXPECTED_RED_COMPLETE\n' > evidence/result.txt
          cat evidence/result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve native stdout stderr exit and SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-malay-stage36-discovery18
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
