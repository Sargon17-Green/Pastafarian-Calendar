          ulimit -v 1048576
          /usr/bin/time -f 'SECONDS=%e RSS_KIB=%M EXIT=%x' -o build/first-divergence-python.resources timeout --signal=TERM --kill-after=5s 240s python3 -u - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,sys,time
          out=pathlib.Path('build/first-divergence-result.json')
          report={'project_id':'PC-BRANCH-FORTRAN-ENGLISH','source_sha':os.environ['GITHUB_SHA'],
                  'reference_commit':'0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4',
                  'reference_blob':'d58298c6b7be58fc1d1e2d64a0d203b7c42e4d53',
                  'calculation_day':-15055671,'target_day':-15055671,
                  'first_divergence':None,'ordered_checks':[],'stage1_accepted':False,
                  'status':'INCONCLUSIVE'}
          start=time.monotonic()
          def summary(v):
              if isinstance(v,(list,tuple)):
                  data=','.join(map(str,v)).encode()
                  return {'length':len(v),'sha256':hashlib.sha256(data).hexdigest(),'first_12':list(v[:12])}
              return v
          class Found(Exception):pass
          def check(stage,field,a,b):
              good=a==b
              item={'stage':stage,'field':field,'match':good}
              if not good:
                  item['fortran']=summary(a)
                  item['python']=summary(b)
                  if isinstance(a,(list,tuple)) and isinstance(b,(list,tuple)):
                      item['first_difference_1based']=next((i+1 for i,(x,y) in enumerate(zip(a,b)) if x!=y),min(len(a),len(b))+1)
                  report['first_divergence']=item
              report['ordered_checks'].append(item)
              if not good:raise Found()
          try:
              for filename in ['test/normative_oracle_calendar.f90','test/normative_oracle_core.f90','test/stage01_foundation_candidate_probe.f90','.github/workflows/canonical-names-lock.yml']:
                  report.setdefault('source_sha256',{})[filename]=hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest()
              p=pathlib.Path('build/first-divergence-python-reference.py')
              raw=p.read_bytes()
              check('00_source_pin','Git_blob_SHA1',hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest(),report['reference_blob'])
              candidate=json.loads(pathlib.Path('build/first-divergence-fortran.json').read_text())
              if candidate['project_id']!=report['project_id'] or int(candidate['calculation_day'])!=-15055671 or int(candidate['target_day'])!=-15055671 or candidate['candidate_only'] is not True:
                  raise ValueError('same-SHA Fortran source identity/input missing')
              spec=importlib.util.spec_from_file_location('pinned_normative_reference',p)
              ref=importlib.util.module_from_spec(spec);sys.modules[spec.name]=ref;spec.loader.exec_module(ref)
              lines=pathlib.Path('build/first-divergence-gates.stdout').read_text().splitlines()
              bound=[int(z) for z in next(s for s in lines if s.startswith('BOUND=')).split('=')[1].split(',')]
              year=[int(z) for z in next(s for s in lines if s.startswith('YEAR=')).split('=')[1].split(',')]
              gates={}
              for s in lines:
                  if s.startswith('GATE='):
                      k,d=(int(z) for z in s.split('=')[1].split(','))
                      if k in gates:raise ValueError('duplicate gate')
                      gates[k]=d
              if len(bound)!=2 or len(year)!=5 or bound[0]>0 or bound[1]<0 or len(gates)!=bound[1]-bound[0]+1:
                  raise ValueError('incomplete Fortran gate transcript')
              if sorted(gates)!=list(range(bound[0],bound[1]+1)) or gates[0]!=-15055671:
                  raise ValueError('invalid Fortran gate sequence')
              fy=candidate['year']
              check('00_fortran_consistency','year_gate_probe_vs_original',
                    year,[int(fy['number']),int(fy['open_gate_index']),int(fy['close_gate_index']),int(fy['open_gate_day']),int(fy['close_gate_day'])])
              cal=ref.NormativeCalendar()
              ry=cal.year5000(-15055671)
              report['fortran_year']=year
              report['python_year']=[ry.number,ry.open_gate_index,ry.close_gate_index,ry.open_gate_day,ry.close_gate_day]
              report['fortran_gate_bounds']=bound
              for i in sorted(gates,key=lambda i:(abs(i),0 if i<0 else 1)):
                  check('01_gate_table','gate_'+str(i),gates[i],cal.gates.ensure_index(i))
              check('02_year_selection','year_and_span',year,report['python_year'])
              sauce=ref.sauce(-15055671,ry.open_gate_day+1)
              n=cal.choose_cutlet_count(sauce,ry)
              check('03_cutlet_count','count',len(candidate['cutlets']['partition_gate_intervals']),n)
              part=cal.choose_cutlet_partition(-15055671,sauce,ry,n)
              check('04_cutlet_partition','gate_spans',candidate['cutlets']['partition_gate_intervals'],list(part))
              cn=cal.choose_cutlet_names(sauce,n)
              check('05_cutlet_names','indices',candidate['cutlets']['name_indices'],list(cn))
              m=cal.choose_month_count(sauce,ry)
              check('06_month_count','count',candidate['year']['month_count'],m)
              lengths=cal.choose_month_lengths(sauce,ry,m)
              check('07_month_lengths','lengths',candidate['months']['lengths'],list(lengths))
              report['last_started_stage']='08_seal32_weaving'
              weaving=cal.choose_month_weaving(sauce,lengths)
              check('08_seal32_weaving','month_ids',candidate['months']['weaving'],list(weaving))
              mn=cal.choose_month_names(sauce,m)
              check('09_month_names','indices',candidate['months']['name_indices'],list(mn))
              cutlets=cal.materialize_cutlets(ry,part,cn)
              chosen=next(c for c in cutlets if c.first_day<=-15055671<=c.last_day)
              offset=-15055671-(ry.open_gate_day+1); month=weaving[offset]
              five=[ry.number,chosen.name_index,-15055671-chosen.first_day+1,mn[month-1],
                    sum(x==month for x in weaving[:offset+1])]
              for field,value in zip(('year_number','cutlet_canonical_index','day_in_cutlet','month_canonical_index','day_in_month'),five):
                  check('10_five_fields',field,candidate['date_fields'][field],value)
              report['status']='MATCHED_SINGLE_CASE_ONLY'
          except Found:
              report['status']='DIVERGENCE_IDENTIFIED'
              if report['first_divergence']['stage']=='01_gate_table':
                  raw_cal=ref.NormativeCalendar(sauce_function=ref.sauce_raw_sum_mutant)
                  raw_year=raw_cal.year5000(-15055671)
                  report['raw_sum_reference_variant']={
                      'independent_oracle':False,
                      'context':'Legacy reference contains a historical raw-sum function; compare only upstream gates and year',
                      'source_scroll_audit':'test/STAGE01_CANONICAL_SCROLL_AUDIT.md',
                      'matched_gate_days':sum(gates[i]==raw_cal.gates.ensure_index(i) for i in gates),
                      'tested_gate_days':len(gates),
                      'year_matches_fortran':year==[raw_year.number,raw_year.open_gate_index,raw_year.close_gate_index,raw_year.open_gate_day,raw_year.close_gate_day]
                  }
          except Exception as ex:
              report['error']={'kind':type(ex).__name__,'message':str(ex)}
          finally:
              report['elapsed_seconds']=round(time.monotonic()-start,3)
              out.write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
              print('STAGE01_FIRST_DIVERGENCE_STATUS='+report['status'])
              if report['first_divergence']:
                  print('STAGE01_FIRST_DIVERGENCE_FIRST='+json.dumps(report['first_divergence'],sort_keys=True))
              if report['status']=='INCONCLUSIVE':sys.exit(2)
          PY
          rc=$?
          printf 'DIAGNOSTIC_EXIT=%s\n' "$rc" >> build/first-divergence-exits.txt
          cat build/first-divergence-exits.txt
          exit "$rc"
      - name: Record source and result checksums even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p build
          printf 'PROJECT_ID=PC-BRANCH-FORTRAN-ENGLISH\nSOURCE_SHA=%s\nREFERENCE_COMMIT=0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4\nREFERENCE_BLOB=d58298c6b7be58fc1d1e2d64a0d203b7c42e4d53\n' "$GITHUB_SHA" > build/first-divergence-provenance.txt
          sha256sum .github/workflows/canonical-names-lock.yml test/normative_oracle_core.f90 test/normative_oracle_calendar.f90 test/stage01_foundation_candidate_probe.f90 > build/first-divergence-source-shas.txt
          find build -maxdepth 1 -type f -name 'first-divergence*' -print | sort | xargs -r sha256sum > build/first-divergence-artifact-shas.txt
      - name: Upload runtime comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortran-stage01-first-divergence
          path: build/first-divergence*
          if-no-files-found: warn
          retention-days: 30

