name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  dart-hebrew-stage1-native:
    if: github.ref == 'refs/heads/Dart+עברית'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v4

      - name: Install Dart SDK 3.13.2
        id: sdk
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'

      - name: Dart version
        run: dart --version

      - name: Resolve packages
        id: dependencies
        run: dart pub get

      - name: Check formatting without modifying files
        id: format
        continue-on-error: true
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format --output=write .
            for file in bin/stage1_tests.dart lib/src/source_language_catalog.dart test_support/normative_reference.dart tool/generate_stage1_fixtures.dart bin/stage2_discovery01.dart lib/src/monster_base.dart lib/src/monster_work_counts.dart bin/stage2_production01_tests.dart lib/src/monster_modular_math.dart bin/stage2_production02_tests.dart lib/src/monster_seed_feeder.dart bin/stage2_production03_tests.dart lib/src/monster_visible_droplets.dart bin/stage2_production04_tests.dart lib/src/monster_bowl_processor.dart bin/stage2_production05_tests.dart lib/src/monster_bowl_questions.dart bin/stage2_production06_tests.dart; do
              echo "DART_CAPTURE_BEGIN:${file}"
              base64 -w0 "${file}"
              printf '\n'
              echo "DART_CAPTURE_END:${file}"
            done
            exit 1
          fi

      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: dart analyze

      - name: Functional Stage 1 tests
        id: tests
        continue-on-error: true
        run: dart run bin/stage1_tests.dart

      - name: Summarize independent results and enforce all gates
        if: always()
        env:
          SDK: ${{ steps.sdk.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          {
            echo '## Dart+עברית — Stage 1 Native Verification'
            echo ''
            echo "Commit: ${GITHUB_SHA}"
            echo ''
            echo '| Gate | Outcome |'
            echo '| --- | --- |'
            for gate in SDK DEPENDENCIES FORMAT ANALYZE TESTS; do
              echo "| ${gate} | ${!gate} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for gate in SDK DEPENDENCIES FORMAT ANALYZE TESTS; do
            if [[ "${!gate}" != success ]]; then
              echo "::error::${gate} outcome is ${!gate}; Stage 1 not verified"
              exit 1
            fi
          done
          echo 'Stage 1 native verification: all gates passed.'

