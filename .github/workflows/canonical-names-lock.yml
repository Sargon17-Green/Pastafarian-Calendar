            src/big_integer.cob \
            src/monster_bootstrap.cob \
            src/legacy_old_remainder.cob \
            2>&1 | tee -a build/stage2-discovery.log
          timeout --signal=TERM --kill-after=10s 120s \
            ./build/stage02-discovery 2>&1 | tee -a build/stage2-discovery.log
          grep -Eq '^STAGE2_EXPECTED_RED=[[:space:]]*0*3[[:space:]]*$' build/stage2-discovery.log
          grep -Eq '^STAGE2_CONTROL_PASS=[[:space:]]*0*1[[:space:]]*$' build/stage2-discovery.log
          grep -Eq '^STAGE2_UNEXPECTED_FAILURES=[[:space:]]*0+[[:space:]]*$' build/stage2-discovery.log
          grep -Fxq 'RESULT=PASS_STAGE2_DISCOVERY_NATIVE' build/stage2-discovery.log
          test "$(grep -c '^RAW_REMAINDER=0$' build/stage2-discovery.log)" -eq 3
          # Stage 3 has its own route. Legacy discovery must stay raw.
          if grep -iRE 'SAVE-PATCH|SAVE-NORMALIZE' src/legacy_old_remainder.cob; then
            echo 'LEGACY_PATH_MODIFIED=YES' | tee -a build/stage2-discovery.log
            exit 1
          fi
          echo 'LEGACY_PATH_RAW=YES' | tee -a build/stage2-discovery.log
      - name: Persist stage2 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-discovery-native-evidence
          path: build/stage2-discovery.log
          if-no-files-found: warn
          retention-days: 30

