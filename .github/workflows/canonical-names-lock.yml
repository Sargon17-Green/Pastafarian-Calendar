          $stage38Pending = (($stageLines -contains 'CURRENT_STAGE=38') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=37') -and ($stageLines -contains 'STAGE38_RUNTIME_VERIFICATION=PENDING_NATIVE') -and ($stageLines -contains 'STAGE37_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))
