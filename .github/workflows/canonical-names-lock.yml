name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  clojure-native-stage02-discovery24:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Clojure+Nederlands' && !contains(github.event.head_commit.message, '[generic-e2e-next-year-p1]') && !contains(github.event.head_commit.message, '[generic-e2e-canonical-plus17]') && !contains(github.event.head_commit.message, '[generic-e2e-first-refusal]') && !contains(github.event.head_commit.message, '[discovery24-dp-feasibility]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Verify native toolchain
        run: clojure -Sdescribe
      - name: Native Stage 1 regression and Stage 2 DISCOVERY24 genuine end-to-end bounded numerical differential
        run: clojure -M:test
      - name: Require exact-SHA p520 and Alternative C evidence
        if: success()
        shell: bash
        run: |
          test -s qa/clojure-dutch/discovery24_inplace_five_field.edn
          test -s qa/clojure-dutch/discovery24_alternative_c_native.edn
      - name: Preserve exact-SHA in-place insertion differential
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-dutch-inplace-five-field-differential
          path: |
            qa/clojure-dutch/discovery24_inplace_five_field.edn
            qa/clojure-dutch/discovery24_alternative_c_native.edn
            qa/clojure-dutch/discovery24_canonical_dp_input.json
          if-no-files-found: warn
          retention-days: 90

  clojure-dutch-generic-e2e-feasibility:
    # New workflows added only on this feature branch are not registered for
    # dispatch. Run this explicit one-case probe inside the existing CI workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/Clojure+Nederlands' && contains(github.event.head_commit.message, '[generic-e2e-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Verify project and exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PROJECT_ID=PC-BRANCH-CLOJURE-DUTCH"
          echo "SOURCE_SHA=$GITHUB_SHA"
      - name: Seven canonical classifications, 127 independent comparisons, one bounded day-16 probe
        run: |
          set -euo pipefail
          clojure -Sdeps '{:paths ["src" "test"]}' -M -e "(require 'pastafari.stage02-end-to-end-test) (pastafari.stage02-end-to-end-test/run-discovery24-generic-feasibility!)"
      - name: Preserve bounded feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-dutch-generic-e2e-feasibility
          path: qa/discovery24_generic_feasibility.edn
          if-no-files-found: warn
          retention-days: 90


  clojure-dutch-first-day-e2e-witness:
    # Opt-in new first-day proof; do not rerun the accepted position-16 probe.
    if: github.event_name == 'push' && github.ref == 'refs/heads/Clojure+Nederlands' && contains(github.event.head_commit.message, '[generic-e2e-first-day]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature-branch SHA
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Assert exact project/source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PROJECT_ID=PC-BRANCH-CLOJURE-DUTCH"
          echo "SOURCE_SHA=$GITHUB_SHA"
      - name: One canonical base-first p1 independent numeric witness
        run: |
          set -euo pipefail
          clojure -Sdeps '{:paths ["src" "test"]}' -M -e "(require 'pastafari.stage02-end-to-end-test) (pastafari.stage02-end-to-end-test/run-discovery24-first-day-feasibility!)"
      - name: Preserve first-day witness EDN even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-dutch-first-day-e2e-witness
          path: qa/discovery24_first_day_feasibility.edn
          if-no-files-found: warn
          retention-days: 90


  clojure-dutch-next-year-first-day-e2e-witness:
    # Exact one-case opt-in; the expensive full Native suite is excluded
    # by the complementary condition above for this same marker.
    if: github.event_name == 'push' && github.ref == 'refs/heads/Clojure+Nederlands' && contains(github.event.head_commit.message, '[generic-e2e-next-year-p1]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature-branch SHA
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Assert exact project/source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PROJECT_ID=PC-BRANCH-CLOJURE-DUTCH"
          echo "SOURCE_SHA=$GITHUB_SHA"
      - name: One canonical next-year position-1 independent numeric witness
        run: |
          set -euo pipefail
          clojure -Sdeps '{:paths ["src" "test"]}' -M -e "(require 'pastafari.stage02-end-to-end-test) (pastafari.stage02-end-to-end-test/run-discovery24-next-year-first-day-feasibility!)"
      - name: Preserve exact-SHA EDN on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-dutch-next-year-first-day-e2e-witness
          path: qa/discovery24_next_year_first_day_feasibility.edn
          if-no-files-found: warn
          retention-days: 90


  clojure-dutch-canonical-plus17-p520-e2e-witness:
    # Exactly one new canonical date: shifted +17 calculation day itself (p=520).
    # The full Native suite is deliberately skipped on this opt-in commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/Clojure+Nederlands' && contains(github.event.head_commit.message, '[generic-e2e-canonical-plus17]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature-branch SHA
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Assert exact project/source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PROJECT_ID=PC-BRANCH-CLOJURE-DUTCH"
          echo "SOURCE_SHA=$GITHUB_SHA"
      - name: One canonical shifted-plus17 position-520 bounded witness
        run: |
          set -euo pipefail
          clojure -Sdeps '{:paths ["src" "test"]}' -M -e "(require 'pastafari.stage02-end-to-end-test) (pastafari.stage02-end-to-end-test/run-discovery24-canonical-plus17-feasibility!)"
      - name: Preserve exact-SHA EDN on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-dutch-canonical-plus17-p520-e2e-witness
          path: qa/discovery24_canonical_plus17_feasibility.edn
          if-no-files-found: warn
          retention-days: 90

  clojure-dutch-p520-first-refusal-accounting:
    # Test-only new first-refusal accounting at canonical p520; no p520 rerun.
    # Full Native suite is intentionally skipped for this isolated marker.
    if: github.event_name == 'push' && github.ref == 'refs/heads/Clojure+Nederlands' && contains(github.event.head_commit.message, '[generic-e2e-first-refusal]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature-branch SHA
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Assert exact project/source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PROJECT_ID=PC-BRANCH-CLOJURE-DUTCH"
          echo "SOURCE_SHA=$GITHUB_SHA"
      - name: Isolated first-refusal accounting with exhaustive small oracle families
        run: |
          set -euo pipefail
          clojure -Sdeps '{:paths ["src" "test"]}' -M -e "(require 'pastafari.discovery24-first-refusal-test) (pastafari.discovery24-first-refusal-test/run-discovery24-first-refusal-accounting!)"
      - name: Preserve exact-SHA accounting EDN on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-dutch-p520-first-refusal-accounting
          path: qa/discovery24_p520_first_refusal_accounting.edn
          if-no-files-found: warn
          retention-days: 90

  
  clojure-dutch-canonical-dp-feasibility:
    # Isolated TEST/QA-only feasibility gate; deliberately excludes full Native suite.
    if: github.event_name == 'push' && github.ref == 'refs/heads/Clojure+Nederlands' && contains(github.event.head_commit.message, '[discovery24-dp-feasibility]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature-branch SHA
        uses: actions/checkout@v4
      - name: Assert exact project and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PROJECT_ID=PC-BRANCH-CLOJURE-DUTCH"
          echo "SOURCE_SHA=$GITHUB_SHA"
      - name: Python QA preflight (no Maven dependency)
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'PROJECT_ID=PC-BRANCH-CLOJURE-DUTCH\\n'
            printf 'SOURCE_SHA=%s\\n' "$GITHUB_SHA"
            python3 -m py_compile qa/clojure-dutch/discovery24_feasibility_oracle.py
            python3 qa/clojure-dutch/discovery24_feasibility_oracle.py --self-test
          } 2>&1 | tee qa/clojure-dutch/discovery24_dp_python_selftest.log
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: deps.edn
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Extract canonical profile and rank from independent normative oracle
        shell: bash
        run: |
          set -euo pipefail
          clojure -Sdeps '{:paths ["src" "test"]}' -M -e "(require 'pastafari.discovery24-dp-feasibility-test) (pastafari.discovery24-dp-feasibility-test/write-canonical-input!)"
      - name: Run bounded canonical DP feasibility gate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 qa/clojure-dutch/discovery24_feasibility_oracle.py --canonical-input qa/clojure-dutch/discovery24_canonical_dp_input.json --diagnostic-output qa/clojure-dutch/discovery24_canonical_dp_result.json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::notice::Canonical DP feasibility is explicitly UNPROVEN within the bounded budgets; no prefix witness was emitted."
            exit 0
          fi
          exit "$code"
      - name: Preserve exact-SHA diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-dutch-canonical-dp-feasibility
          path: |
            qa/clojure-dutch/discovery24_canonical_dp_input.json
            qa/clojure-dutch/discovery24_canonical_dp_result.json
            qa/clojure-dutch/discovery24_dp_python_selftest.log
          if-no-files-found: warn
          retention-days: 90
