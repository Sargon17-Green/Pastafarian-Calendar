name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  clojure-native-stage02-discovery05:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Clojure+Nederlands'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Verify native toolchain
        run: clojure -Sdescribe
      - name: Native Stage 1 regression and Stage 2 DISCOVERY05 sauce tests
        run: clojure -M:test
