name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  verify_csharp_ar_discovery_01:
    name: تحقق مستقل من الاكتشاف والرقعة الأولى
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/C#+العربية-الفصحى' }}
    runs-on: ubuntu-latest
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v5
      - name: تثبيت .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: إعادة اختبارات التأسيس
        run: dotnet run --project tests/PastafarianCalendar.Stage01Tests/PastafarianCalendar.Stage01Tests.csproj --configuration Release
      - name: تشغيل اختبار التباعد الأحمر
        id: discovery_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage02Tests/PastafarianCalendar.Stage02Tests.csproj --configuration Release
      - name: تحقق من أن الفروق الخمسة هي وحدها المتوقعة
        if: always()
        run: dotnet run --project tests/PastafarianCalendar.Stage02Tests/PastafarianCalendar.Stage02Tests.csproj --configuration Release -- --verify-expected-red

      - name: تحقق من تكافؤ الرقعة الأولى مع المرجع
        run: dotnet run --project tests/PastafarianCalendar.Stage03Tests/PastafarianCalendar.Stage03Tests.csproj --configuration Release
      - name: تشغيل الاختبار الأحمر لعدّ اليوم التاريخي
        id: discovery_day_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage04Tests/PastafarianCalendar.Stage04Tests.csproj --configuration Release
      - name: إثبات توقيع الاختلافات ورفض الأحمر الزائف
        if: always()
        run: |
          test "${{ steps.discovery_day_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage04Tests/PastafarianCalendar.Stage04Tests.csproj --configuration Release -- --verify-expected-red
      - name: تحقق من تكافؤ رقعة عدّ اليوم مع المرجع
        run: dotnet run --project tests/PastafarianCalendar.Stage05Tests/PastafarianCalendar.Stage05Tests.csproj --configuration Release
      - name: تشغيل الأحمر التاريخي لمسافة اليومين
        id: discovery_distance_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage06Tests/PastafarianCalendar.Stage06Tests.csproj --configuration Release
      - name: إثبات توقيع فروق المسافة دون رقعتها
        if: always()
        run: |
          test "${{ steps.discovery_distance_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage06Tests/PastafarianCalendar.Stage06Tests.csproj --configuration Release -- --verify-expected-red
      - name: تحقق من تصحيح المسافة وعلامات العمل في الرقعة الثالثة
        run: dotnet run --project tests/PastafarianCalendar.Stage07Tests/PastafarianCalendar.Stage07Tests.csproj --configuration Release
      - name: تشغيل اختبار الأحجار التاريخية الأحمر
        id: discovery_stones_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage08Tests/PastafarianCalendar.Stage08Tests.csproj --configuration Release
      - name: إثبات توقيع عيب التحوير المتسلسل دون ترقيعه
        if: always()
        run: |
          test "${{ steps.discovery_stones_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage08Tests/PastafarianCalendar.Stage08Tests.csproj --configuration Release -- --verify-expected-red
      - name: تكافؤ رقعة الأحجار الرابعة مع المرجع وحفظ الطفرة القديمة
        run: dotnet run --project tests/PastafarianCalendar.Stage09Tests/PastafarianCalendar.Stage09Tests.csproj --configuration Release
      - name: تشغيل اختبار ترتيب القطرات المخفية التاريخي الأحمر
        id: discovery_hidden_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage10Tests/PastafarianCalendar.Stage10Tests.csproj --configuration Release
      - name: إثبات توقيع انقلاب تخزين القطرات ورفض الأحمر الزائف
        if: always()
        run: |
          test "${{ steps.discovery_hidden_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage10Tests/PastafarianCalendar.Stage10Tests.csproj --configuration Release -- --verify-expected-red
      - name: تحقق من فهرسة قرب القطرات الخفية دون قلب تخزينها
        run: dotnet run --project tests/PastafarianCalendar.Stage11Tests/PastafarianCalendar.Stage11Tests.csproj --configuration Release
      - name: تشغيل اختبار استرجاع السابق التاريخي الأحمر
        id: discovery_prior_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage12Tests/PastafarianCalendar.Stage12Tests.csproj --configuration Release
      - name: إثبات صفر الفهرس وأخطاء المؤشرات السالبة دون تصحيح
        if: always()
        run: |
          test "${{ steps.discovery_prior_red.outcome }}" = "failure"
          dotnet run --project tests/PastafarianCalendar.Stage12Tests/PastafarianCalendar.Stage12Tests.csproj --configuration Release -- --verify-expected-red
