          grep -Eq '^STAGE3_UNEXPECTED_FAILURES=[[:space:]]*0+[[:space:]]*$' build/stage3-patch.log
          grep -Fxq 'RESULT=PASS_STAGE3_PATCH_NATIVE' build/stage3-patch.log
          test "$(grep -c '^ROUTE=PATCH01:SAVE-PATCH$' build/stage3-patch.log)" -eq 8
      - name: Preserve Stage 3 native evidence
        if: always()
