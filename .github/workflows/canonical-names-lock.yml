name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  java-lojban-arithmetic:
    if: github.ref == 'refs/heads/Java+Lojban'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Stage 01 baseline
        run: sh run_stage01_tests.sh
      - name: Stage 02 arithmetic
        run: sh run_stage02_tests.sh
      - name: Stage 02 stones and drops
        run: sh run_stage02_drops_tests.sh
      - name: Stage 02 bowls and answer streams
        run: sh run_stage02_bowls_tests.sh
      - name: Stage 02 rank selectors
        run: sh run_stage02_selectors_tests.sh
      - name: Stage 02 manager integration
        run: sh run_stage02_integration_tests.sh
      - name: Stage 02 combinatorial families
        run: sh run_stage02_families_tests.sh
      - name: Stage 02 signed gate cache
        run: sh run_stage02_gates_tests.sh
      - name: Stage 02 year traversal
        run: sh run_stage02_years_tests.sh
      - name: Stage 02 cutlet and month blueprint
        run: sh run_stage02_blueprint_tests.sh
      - name: Stage 02 cutlet date integration
        run: sh run_stage02_cutlet_date_tests.sh
      - name: Stage 02 month weaving domain
        run: sh run_stage02_weaving_domain_tests.sh
      - name: Stage 02 canonical month position lookup
        run: sh run_stage02_month_index_tests.sh
      - name: Stage 02 complete date with supplied weaving
        run: sh run_stage02_calendar_resolver_tests.sh
      - name: Stage 02 polynomial endpoint weaving
        run: sh run_stage02_endpoint_weaving_tests.sh
      - name: Stage 02 bounded canonical month selection
        run: sh run_stage02_canonical_weaving_tests.sh
      - name: Stage 02 heap-bounded month counting
        run: sh run_stage02_weaving_heap_tests.sh
      - name: Stage 02 linear-memory canonical weaving count
        run: sh run_stage02_linear_weaving_tests.sh
      - name: Stage 02 exact full-year lexicographic endpoints
        run: sh run_stage02_extremal_weaving_tests.sh
      - name: Stage 02 full-year lexicographic neighbors
        run: sh run_stage02_edge_weaving_tests.sh
      - name: Stage 02 full-year prefix-relative interior ranking
        run: sh run_stage02_prefix_ranking_tests.sh
      - name: Stage 02 real-year prefix-ranked calendar
        run: sh run_stage02_prefix_calendar_tests.sh
      - name: Stage 02 exact global boundary rank intervals
        run: sh run_stage02_boundary_blocks_tests.sh
      - name: Stage 02 exact internal global prefix blocks
        run: sh run_stage02_internal_global_blocks_tests.sh
      - name: Stage 02 bounded global rank routing
        run: sh run_stage02_global_routing_tests.sh
      - name: Stage 02 completed global route calendar integration
        run: sh run_stage02_route_calendar_tests.sh
      - name: Stage 02 automatic full-year boundary route dates
        run: sh run_stage02_automatic_boundary_route_tests.sh
      - name: Stage 02 amortized near-edge global routing
        run: sh run_stage02_near_edge_routing_tests.sh
      - name: Stage 02 full-length global near-edge route completion
        run: sh run_stage02_full_route_completion_tests.sh
