      - name: PATCH 08 — exhaustive 720 ranks, huge inputs, saved legacy scar
        run: v test ./pastafari/patch08_test.v
      - name: DISCOVERY 09 — historical fixed-ID pour witnesses
        run: v test ./pastafari/discovery09_witness_test.v
      - name: PATCH 09 — four untouched historical RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery09_expected_red_test.v
          v test ./pastafari/discovery09_expected_red_test.v
      - name: PATCH 09 — all 720 orders, alias read routing, saved legacy and large integers
        run: v test ./pastafari/patch09_test.v
      - name: DISCOVERY 10 — in-place historical stirring witnesses
        run: v test ./pastafari/discovery10_witness_test.v
      - name: PATCH 10 — previous four RED snapshot assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery10_expected_red_test.v
          v test ./pastafari/discovery10_expected_red_test.v
      - name: PATCH 10 — all 720 orders, immutable vault, pending, legacy scar
        run: v test ./pastafari/patch10_test.v
      - name: DISCOVERY 11 — historical overwritten order witnesses
        run: v test ./pastafari/discovery11_witness_test.v
      - name: PATCH 11 — all four unchanged historical RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery11_expected_red_test.v
          v test ./pastafari/discovery11_expected_red_test.v
      - name: PATCH 11 — preserve legacy and latch all 720 permutations
        run: v test ./pastafari/patch11_test.v
      - name: Stage 23 — full native V regression
        shell: bash
        run: |
          set -euo pipefail
          v test ./pastafari 2>&1 | tee stage23_green.log
      - name: Preserve stage 23 native V evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v-amharic-stage23-green-evidence
          path: stage23_green.log
          if-no-files-found: ignore
