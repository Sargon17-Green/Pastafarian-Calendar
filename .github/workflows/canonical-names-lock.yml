          sha256sum PROJECT_ID.txt SHA.txt *version.txt source.sha256 medium.stdout medium.stderr medium.exit > manifest.sha256
          test "$rc" -eq 0 && test ! -s medium.stderr
      - name: Retain medium GMP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-malay-stage56-gmp-medium-${{ github.sha }}
          path: stage56-gmp-medium-evidence/
