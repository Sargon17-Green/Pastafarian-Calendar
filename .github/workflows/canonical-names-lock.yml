          if ($head -cne $env:GITHUB_SHA) { throw 'Stage31 boundary checkout SHA mismatch' }
          @(
            ('STAGE31_BOUNDARY_HEAD_SHA=' + $head),
            ('STAGE31_BOUNDARY_RUNTIME=' + $PSVersionTable.PSVersion.ToString()),
            'STAGE31_BOUNDARY_SCOPE=NORMATIVE_YEAR_5000_SIX_TARGETS_TWO_SEALS',
            'STAGE31_BOUNDARY_SEAL=NOT_CLAIMED'
          ) | Set-Content stage31-boundary-metadata.txt -Encoding UTF8
          Start-Transcript -Path stage31-boundary-transcript.txt | Out-Null
