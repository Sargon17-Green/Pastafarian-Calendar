name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  dmg-native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit arithmetic model independently of SM83 binaries
        run: |
          python3 tests/test_arithmetic_invariants.py
          python3 tests/test_emulator_wait.py
      - name: Build DMG ROM using RGBDS v1.0.4
        run: |
          docker run --rm --mount type=bind,src="$PWD",dst=/work \
            -w /work ghcr.io/gbdev/rgbds:v1.0.4 \
            sh -c 'make build'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install emulator for test only
        run: python -m pip install 'pyboy>=2,<3'
      - name: Inspect ROM and execute SM83 bootstrap
        run: python tests/test_rom.py build/calendar.gb
