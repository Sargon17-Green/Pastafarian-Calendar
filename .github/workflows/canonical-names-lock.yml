name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  stage30_native_v:
    name: V 0.5.2 — DISCOVERY 15 five-field witness
    if: github.event_name == 'push' && github.ref == 'refs/heads/V+አማርኛ'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install immutable V 0.5.2 release binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v-release"
          curl --fail --location --show-error --silent --retry 3 --retry-delay 2 \
            --output "$RUNNER_TEMP/v_linux.zip" \
            https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          unzip -q "$RUNNER_TEMP/v_linux.zip" -d "$RUNNER_TEMP/v-release"
          v_bin="$(find "$RUNNER_TEMP/v-release" -type f -name v -print -quit)"
          test -n "$v_bin"
          chmod +x "$v_bin"
          version="$("$v_bin" version)"
          echo "Installed: $version"
          if [ "$version" != 'V 0.5.2 7647ce1' ]; then
            echo "::error::Unexpected V compiler identity: $version"
            exit 1
          fi
          echo "$(dirname "$v_bin")" >> "$GITHUB_PATH"
      - name: Verify V version and source formatting
        shell: bash
        run: |
          set -euo pipefail
          v version
          # Diagnostic only: show the exact pinned-formatter hunk; the verify gate below remains mandatory.
          v fmt -diff ./pastafari/normative_oracle_test.v || true
          v fmt -verify ./pastafari
      - name: Stage 1 — normative reference (bounded to Stage 1 tests)
        run: v test ./pastafari/normative_oracle_test.v -run-only 'test_stage01_*'
      - name: Stage 31 — independent 46-drop sauce regression
        run: v test ./pastafari/normative_oracle_test.v -run-only 'test_stage31_production_46_drop_chain_matches_independent_normative_sauce'
      - name: Discovery 01 — legacy behavior witnesses
        run: v test ./pastafari/discovery01_witness_test.v
      - name: PATCH 01 — formerly RED regression now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery01_expected_red_test.v
          v test ./pastafari/discovery01_expected_red_test.v
      - name: PATCH 01 — signed and oversized integer boundaries
        run: v test ./pastafari/patch01_test.v
      - name: DISCOVERY 02 — historical day tag still wrong
        run: v test ./pastafari/discovery02_witness_test.v
      - name: PATCH 02 — formerly RED tests now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery02_expected_red_test.v
          v test ./pastafari/discovery02_expected_red_test.v
      - name: PATCH 02 — boundary, scar and arbitrary precision
        run: v test ./pastafari/patch02_test.v
      - name: DISCOVERY 03 — preserve legacy tag-distance witnesses
        run: v test ./pastafari/discovery03_witness_test.v
      - name: PATCH 03 — formerly RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery03_expected_red_test.v
          v test ./pastafari/discovery03_expected_red_test.v
      - name: PATCH 03 — comparison scar, signed boundaries, big integers
        run: v test ./pastafari/patch03_test.v
      - name: DISCOVERY 04 — legacy sequential mutation witnesses
        run: v test ./pastafari/discovery04_witness_test.v
      - name: PATCH 04 — four formerly RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery04_expected_red_test.v
          v test ./pastafari/discovery04_expected_red_test.v
      - name: PATCH 04 — snapshot, original legacy call and table
        run: v test ./pastafari/patch04_test.v
      - name: DISCOVERY 05 — seven hidden drops with historical reversed positions
        run: v test ./pastafari/discovery05_witness_test.v
      - name: PATCH 05 — prior four RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery05_expected_red_test.v
          v test ./pastafari/discovery05_expected_red_test.v
      - name: PATCH 05 — 8-minus-k indexing and original backward storage
        run: v test ./pastafari/patch05_test.v
      - name: DISCOVERY 06 — historical visible-only reads and zero-slot failures
        run: v test ./pastafari/discovery06_witness_test.v
      - name: PATCH 06 — all previous RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery06_expected_red_test.v
          v test ./pastafari/discovery06_expected_red_test.v
      - name: PATCH 06 — history, seven hidden offsets and retained legacy
        run: v test ./pastafari/patch06_test.v
      - name: DISCOVERY 07 — legacy zero-based grind row and mixing witnesses
        run: v test ./pastafari/discovery07_witness_test.v
      - name: PATCH 07 — four unchanged historical RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery07_expected_red_test.v
          v test ./pastafari/discovery07_expected_red_test.v
      - name: PATCH 07 — retained legacy, sentinel and 11 native grinds
        run: v test ./pastafari/patch07_test.v
      - name: DISCOVERY 08 — preserve zero-based unrank and historic one-based caller
        run: v test ./pastafari/discovery08_witness_test.v
      - name: PATCH 08 — four previous RED rank assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery08_expected_red_test.v
          v test ./pastafari/discovery08_expected_red_test.v
      - name: PATCH 08 — exhaustive 720 ranks, huge inputs, saved legacy scar
        run: v test ./pastafari/patch08_test.v
      - name: DISCOVERY 09 — historical fixed-ID pour witnesses
        run: v test ./pastafari/discovery09_witness_test.v
      - name: PATCH 09 — four untouched historical RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery09_expected_red_test.v
          v test ./pastafari/discovery09_expected_red_test.v
      - name: PATCH 09 — all 720 orders, alias read routing, saved legacy and large integers
        run: v test ./pastafari/patch09_test.v
      - name: DISCOVERY 10 — in-place historical stirring witnesses
        run: v test ./pastafari/discovery10_witness_test.v
      - name: PATCH 10 — previous four RED snapshot assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery10_expected_red_test.v
          v test ./pastafari/discovery10_expected_red_test.v
      - name: PATCH 10 — all 720 orders, immutable vault, pending, legacy scar
        run: v test ./pastafari/patch10_test.v
      - name: DISCOVERY 11 — historical overwritten order witnesses
        run: v test ./pastafari/discovery11_witness_test.v
      - name: PATCH 11 — all four unchanged historical RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery11_expected_red_test.v
          v test ./pastafari/discovery11_expected_red_test.v
      - name: PATCH 11 — preserve legacy and latch all 720 permutations
        run: v test ./pastafari/patch11_test.v
      - name: DISCOVERY 12 — fixed-ID historical next-bowl witnesses
        run: v test ./pastafari/discovery12_witness_test.v
      - name: PATCH 12 — four unchanged historical RED successor assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery12_expected_red_test.v
          v test ./pastafari/discovery12_expected_red_test.v
      - name: PATCH 12 — 4320 circular successor checks and saved legacy scar
        run: v test ./pastafari/patch12_test.v
      - name: DISCOVERY 13 — answer-stream and legacy modulo witnesses
        run: v test ./pastafari/discovery13_witness_test.v
      - name: PATCH 13 — prior four normative RED assertions now GREEN unchanged
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery13_expected_red_test.v
          v test ./pastafari/discovery13_expected_red_test.v
      - name: PATCH 13 — exhaustive rejection controls and retained legacy
        run: v test ./pastafari/patch13_test.v
      - name: DISCOVERY 14 — historical reversed high-first wide digit witnesses
        run: v test ./pastafari/discovery14_witness_test.v
      - name: PATCH 14 — previous four RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery14_expected_red_test.v
          v test ./pastafari/discovery14_expected_red_test.v 2>&1 | tee stage29_expected_green.log
      - name: PATCH 14 — analytical rejection and little-first tests
        shell: bash
        run: |
          set -euo pipefail
          v test ./pastafari/patch14_test.v 2>&1 | tee stage29_patch14.log
          test "$(find ./pastafari -maxdepth 1 -name '*_test.v' | wc -l)" -eq 46
          test -f ./pastafari/patch15_numeric_date_native_smoke_test.v
          echo 'Stage29 baseline retained; 46 test files including new Stage31 Native smoke'
      - name: DISCOVERY 15 — five-field structure GREEN witnesses
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery15_witness_test.v
          v test ./pastafari/discovery15_witness_test.v 2>&1 | tee stage30_witness_green.log
      - name: DISCOVERY 15 — four formerly RED public date witnesses now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery15_expected_red_test.v
          test "$(grep -Ec '^fn test_discovery15_expected_red_' ./pastafari/discovery15_expected_red_test.v)" -eq 4
          v test ./pastafari/discovery15_expected_red_test.v 2>&1 | tee stage30_promoted_green.log
          echo 'Stage30: four formerly RED public date witnesses now GREEN'
      - name: Stage 31 — exact polynomial weave vs independent exhaustive oracle
        run: v test ./pastafari/normative_oracle_test.v -run-only 'test_stage31_weave_polynomial_counts_agree_with_exhaustive_small_states'
      - name: Stage 33 — exhaustive lexicographic small-state weave unrank (342 ranks)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            v test ./pastafari/normative_oracle_test.v -run-only 'test_stage33_weave_unrank_exhaustive_lexicographic_small_states' \
            2>&1 | tee stage33_weave_unrank.log
      - name: Stage 34 — Catalan closed-form boundary counts and lexical edges (17/47 months)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            v test ./pastafari/normative_oracle_test.v -run-only 'test_stage34_catalan_boundary_months_and_lexical_edges' \
            2>&1 | tee stage34_catalan.log
      - name: Stage 35 — independent Ballot lexical rank/unrank (17/47 months)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            v test ./pastafari/normative_oracle_test.v -run-only 'test_stage35_ballot_lexical_rank_roundtrip_at_17_and_47_months' \
            2>&1 | tee stage35_ballot.log
      - name: Stage 36 — independent adjacent Ballot lexical ranks (17/47 months)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            v test ./pastafari/normative_oracle_test.v -run-only 'test_stage36_adjacent_ballot_lexical_ranks_at_17_and_47_months' \
            2>&1 | tee stage36_adjacent.log
      - name: Stage 37 — exact Catalan first-prefix fork (17/47 months)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            v test ./pastafari/normative_oracle_test.v -run-only 'test_stage37_catalan_first_prefix_fork_at_17_and_47_months' \
            2>&1 | tee stage37_prefix_fork.log
      - name: Stage 38 — exact Catalan second-prefix fork (17/47 months)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            v test ./pastafari/normative_oracle_test.v -run-only 'test_stage38_catalan_second_prefix_fork_at_17_and_47_months' \
            2>&1 | tee stage38_second_prefix_fork.log
      - name: Stage 31 — bounded independent phase probes (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            test_stage31_diag_reference_year_anchor \
            test_stage31_diag_reference_month_lengths_anchor \
            test_stage31_diag_reference_cutlets_anchor \
            test_stage31_diag_candidate_cutlets_anchor \
            test_stage31_diag_reference_weave_count_anchor \
            test_stage31_diag_candidate_weave_count_anchor \
            test_stage31_diag_reference_weave_rank_anchor \
            test_stage31_diag_candidate_weave_rank_anchor \
            test_stage31_diag_reference_weave_unrank_anchor \
            test_stage31_diag_candidate_weave_unrank_anchor \
            test_stage31_diag_reference_full_anchor \
            test_stage31_diag_candidate_full_anchor; do
            echo "::group::Stage31 diagnostic $probe"
            set +e
            timeout --signal=TERM --kill-after=5s 45s \
              v test ./pastafari/normative_oracle_test.v -run-only "$probe" \
              > "stage31_${probe}.log" 2>&1
            status=$?
            set -e
            cat "stage31_${probe}.log"
            echo "Stage31 diagnostic $probe: exit=$status (124=timed out)"
            echo "::endgroup::"
          done
      - name: Stage 31 — four-anchor five-field numeric differential
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 300s \
            v test ./pastafari/normative_oracle_test.v -run-only 'test_stage31_numeric_date_candidate_matches_all_five_independent_oracle_fields' \
            2>&1 | tee stage31_numeric.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo '::error::Stage31 numeric oracle differential exceeded 300 seconds; NOT ACCEPTED'
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::Stage31 numeric oracle differential failed with exit $code; NOT ACCEPTED"
            exit "$code"
          fi
          echo 'Stage31 numeric differential: all four anchors and five fields GREEN'
      - name: Stage 32 — public year-gate boundary vs independent normative oracle
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 600s \
            v test ./pastafari/normative_oracle_test.v -run-only 'test_stage32_public_year_gate_boundaries_match_independent_oracle' \
            2>&1 | tee stage32_boundaries.log
      - name: Preserve stage 29 native V evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v-amharic-stage29-patch14-evidence
          path: |
            stage29_expected_green.log
            stage29_patch14.log
            stage30_witness_green.log
            stage30_promoted_green.log
            stage31_test_stage31_diag_*.log
            stage31_numeric.log
            stage32_boundaries.log
            stage33_weave_unrank.log
            stage34_catalan.log
            stage36_adjacent.log
            stage37_prefix_fork.log
            stage38_second_prefix_fork.log
          if-no-files-found: ignore
