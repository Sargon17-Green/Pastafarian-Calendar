          v -check ./pastafari/discovery06_expected_red_test.v
          v test ./pastafari/discovery06_expected_red_test.v
      - name: PATCH 06 — history, seven hidden offsets and retained legacy
        run: v test ./pastafari/patch06_test.v
      - name: DISCOVERY 07 — legacy zero-based grind row and mixing witnesses
        run: v test ./pastafari/discovery07_witness_test.v
      - name: PATCH 07 — four unchanged historical RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery07_expected_red_test.v
          v test ./pastafari/discovery07_expected_red_test.v
      - name: PATCH 07 — retained legacy, sentinel and 11 native grinds
        run: v test ./pastafari/patch07_test.v
      - name: DISCOVERY 08 — preserve zero-based unrank and historic one-based caller
        run: v test ./pastafari/discovery08_witness_test.v
      - name: PATCH 08 — four previous RED rank assertions now GREEN
        shell: bash
