name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256
  native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
      - name: Compile and link Stage 1 without running the oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          gfortran "${flags[@]}" -c src/big_integer.f90 -o build/big_integer.o
          gfortran "${flags[@]}" -c src/source_language_catalog.f90 -o build/source_language_catalog.o
          gfortran "${flags[@]}" -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
          gfortran "${flags[@]}" -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
          gfortran "${flags[@]}" -c test/normative_oracle_calendar.f90 -o build/normative_oracle_calendar.o
          gfortran "${flags[@]}" test/stage01_tests.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_tests
          gfortran "${flags[@]}" test/stage01_year5000_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_year5000_probe
          test -x build/stage01_tests
          test -x build/stage01_year5000_probe
          gfortran "${flags[@]}" test/stage01_year_boundary_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_year_boundary_probe
          test -x build/stage01_year_boundary_probe
          gfortran ""${flags[@]}"" test/stage01_year_choice_oracle.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_year_choice_oracle
          test -x build/stage01_year_choice_oracle
          gfortran "${flags[@]}" test/stage01_date_projection_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_date_projection_probe
          test -x build/stage01_date_projection_probe
      - name: Run bounded Stage 1 Oracle smoke (55 selected assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 30s build/stage01_tests bounded-smoke 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Bounded Stage 1 Oracle smoke failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_BOUNDED_ORACLE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_BOUNDED_ORACLE_ASSERTIONS=$actual EXPECTED=55 (NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 bounded Oracle smoke: $actual/55 assertions (not full acceptance)." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 55 ]]; then
            echo "::error::Stage 1 bounded Oracle assertion count mismatch"
            exit 1
          fi
      - name: Run bounded Stage 1 gate-gap and sauce smoke (3 assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 30s build/stage01_tests gate-sauce-smoke 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Bounded Stage 1 gate/sauce smoke failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_GATE_SAUCE_SMOKE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_GATE_SAUCE_SMOKE_ASSERTIONS=$actual EXPECTED=3 (NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 gate/sauce smoke: $actual/3 assertions (not full acceptance)." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 3 ]]; then
            echo "::error::Stage 1 gate/sauce smoke assertion count mismatch"
            exit 1
          fi
      - name: Run bounded Stage 1 gate-index consistency smoke (7 assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 30s build/stage01_tests gate-index-smoke 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Bounded Stage 1 gate-index smoke failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_GATE_INDEX_SMOKE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_GATE_INDEX_SMOKE_ASSERTIONS=$actual EXPECTED=7 (NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 gate-index consistency: $actual/7 assertions (not full acceptance)." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 7 ]]; then
            echo "::error::Stage 1 gate-index smoke assertion count mismatch"
            exit 1
          fi
      - name: Run bounded Stage 1 year5000 boundary/cost smoke (8 invariants; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 45s build/stage01_year5000_probe 2>&1)"
          exit_code=$?
          set -e
          elapsed=$((SECONDS-started))
          printf '%s\n' "$output"
          echo "STAGE01_YEAR5000_RUNTIME_SECONDS=$elapsed LIMIT=45"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Year5000 interval probe failed or exceeded 45s limit (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_YEAR5000_SMOKE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_YEAR5000_INVARIANTS=$actual EXPECTED=8 (NOT candidate-selection oracle)"
          echo "Fortran Stage 1 year5000 interval probe: $actual/8 invariants, ${elapsed}s. Not full Stage 1 acceptance." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 8 ]]; then
            echo "::error::Year5000 interval probe assertion count mismatch"
            exit 1
          fi
      - name: Run bounded Stage 1 adjacent-year endpoint smoke (14 assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 45s build/stage01_year_boundary_probe 2>&1)"
          exit_code=$?
          set -e
          elapsed=$((SECONDS-started))
          printf '%s\n' "$output"
          echo "STAGE01_YEAR_BOUNDARY_RUNTIME_SECONDS=$elapsed LIMIT=45"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Adjacent-year boundary probe failed or exceeded 45s limit (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_YEAR_BOUNDARY_SMOKE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_YEAR_BOUNDARY_ASSERTIONS=$actual EXPECTED=14 (NOT independent year oracle)"
          echo "Fortran Stage 1 adjacent-year endpoints: $actual/14 assertions, ${elapsed}s. Not full Stage 1 acceptance." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 14 ]]; then
            echo "::error::Adjacent-year boundary assertion count mismatch"
            exit 1
          fi
      - name: Run independent Stage 1 year5000 candidate-choice oracle (21 assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 45s build/stage01_year_choice_oracle 2>&1)"
          exit_code=$?
          set -e
          elapsed=$((SECONDS-started))
          printf '%s\n' "$output"
          echo "STAGE01_YEAR_CHOICE_RUNTIME_SECONDS=$elapsed LIMIT=45"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Independent year5000 candidate-choice oracle failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fqx 'STAGE01_YEAR_CHOICE_ORACLE_PASS (candidate choice only; NOT full Stage 1 acceptance)' <<< "$output"
          grep -Fxq 'STAGE01_YEAR_CHOICE_ASSERTIONS=21' <<< "$output"
          grep -Fxq 'STAGE01_YEAR_CHOICE_FAILURES=0' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_YEAR_CHOICE_NATIVE_PASS=$actual EXPECTED=21 (NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 independent candidate-choice oracle: $actual/21, $elapsed seconds. NOT full Stage 1 acceptance." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 21 ]]; then
            echo "::error::Independent year5000 candidate-choice assertion mismatch"
            exit 1
          fi
      - name: Check exact five-component date projection (25 synthetic assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(timeout --signal=TERM --kill-after=3s 15s build/stage01_date_projection_probe 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Five-field date projection failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_DATE_PROJECTION_PASS (synthetic mapping only; NOT full Stage 1 acceptance)' <<< "$output"
          grep -Fxq 'STAGE01_DATE_PROJECTION_ASSERTIONS=25' <<< "$output"
          grep -Fxq 'STAGE01_DATE_PROJECTION_FAILURES=0' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_DATE_PROJECTION_NATIVE_PASS=$actual EXPECTED=25 (not normative_calendar_date integration)"
          if [[ "$actual" -ne 25 ]]; then
            echo "::error::Date projection count mismatch"
            exit 1
          fi
          echo "Stage 1 five-field synthetic projection: 25/25; full date integration NOT accepted." >> "$GITHUB_STEP_SUMMARY"
      - name: Run bounded Stage 1 BigInt safe-boundary checks
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none \
            -J build -I build test/stage01_bigint_boundaries.f90 build/big_integer.o \
            -o build/stage01_bigint_boundaries
          timeout --signal=TERM --kill-after=5s 30s build/stage01_bigint_boundaries
      - name: Verify Stage 1 extreme arithmetic and expected int64 overflow rejections
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none \
            -J build -I build test/stage01_bigint_extreme_probe.f90 build/big_integer.o \
            -o build/stage01_bigint_extreme_probe
          gap_count=0
          pass_count=0
          overflow_count=0
          for probe in from-int64-min to-int64-min multiply-int64-max multiply-wide-limb multiply-int64-min multiply-wide-negative; do
            set +e
            result="$(timeout --signal=TERM --kill-after=2s 10s build/stage01_bigint_extreme_probe "$probe" 2>&1)"
            exit_code=$?
            set -e
            printf 'PROBE=%s EXIT=%s\n%s\n' "$probe" "$exit_code" "$result"
            if [[ "$exit_code" -eq 0 && "$result" == *"PROBE_RESULT=PASS MODE=$probe"* ]]; then
              pass_count=$((pass_count + 1))
              echo "PROBE_VERDICT=PASS MODE=$probe"
            else
              gap_count=$((gap_count + 1))
              echo "::error::Unresolved Stage 1 arithmetic boundary: $probe (exit $exit_code)"
              echo "PROBE_VERDICT=UNRESOLVED MODE=$probe"
            fi
          done
          for probe in to-int64-overflow-positive to-int64-overflow-negative; do
            set +e
            result="$(timeout --signal=TERM --kill-after=2s 10s build/stage01_bigint_extreme_probe "$probe" 2>&1)"
            exit_code=$?
            set -e
            printf 'PROBE=%s EXIT=%s\n%s\n' "$probe" "$exit_code" "$result"
            if [[ "$exit_code" -gt 0 && "$exit_code" -lt 128 && "$result" == *"ERROR STOP BigInt does not fit int64"* && "$result" != *"UNEXPECTED_RETURN="* ]]; then
              overflow_count=$((overflow_count + 1))
              echo "PROBE_VERDICT=EXPECTED_REJECTION MODE=$probe"
            else
              gap_count=$((gap_count + 1))
              echo "::error::Unresolved Stage 1 int64 overflow rejection: $probe (exit $exit_code)"
              echo "PROBE_VERDICT=UNRESOLVED MODE=$probe"
            fi
          done
          echo "STAGE01_EXTREME_BOUNDARY_PASS=$pass_count EXPECTED_OVERFLOW_REJECTIONS=$overflow_count UNRESOLVED=$gap_count (gating; NOT full Stage 1 acceptance)"
          {
            echo "## Fortran Stage 1 bounded BigInt gate"
            echo "Passing arithmetic probes: $pass_count/6; expected overflow rejections: $overflow_count/2; unresolved: $gap_count."
            echo "This is NOT full Stage 1 acceptance; full interleaving oracle is not executed."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$pass_count" -ne 6 || "$overflow_count" -ne 2 || "$gap_count" -ne 0 ]]; then
            echo "::error::Stage 1 bounded BigInt gate incomplete"
            exit 1
          fi

      - name: Reject invalid Stage 1 BigInt and bootstrap inputs (isolated, gating)
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none \
            -J build -I build test/stage01_invalid_input_probe.f90 \
            build/big_integer.o build/bootstrap_infrastructure.o \
            -o build/stage01_invalid_input_probe
          cases=(
            'empty-text|empty BigInt string'
            'plus-only|invalid BigInt string'
            'minus-only|invalid BigInt string'
            'invalid-digit|invalid BigInt digit'
            'leading-space|invalid BigInt digit'
            'internal-space|invalid BigInt digit'
            'zero-divisor|divisor must be positive'
            'negative-divisor|divisor must be positive'
            'negative-retry-budget|bootstrap retry budget must be nonnegative'
            'negative-trace-count|bootstrap trace count is invalid'
            'excessive-trace-count|bootstrap trace count is invalid'
            'negative-diagnostic-count|bootstrap diagnostic count is invalid'
            'exhausted-diagnostic-capacity|bootstrap diagnostic capacity exceeded'
          )
          passes=0
          failures=0
          for entry in "${cases[@]}"; do
            mode="${entry%%|*}"
            expected="${entry#*|}"
            set +e
            output="$(timeout --signal=TERM --kill-after=2s 5s build/stage01_invalid_input_probe "$mode" 2>&1)"
            exit_code=$?
            set -e
            if [[ "$exit_code" -eq 1 && "$output" == *"ERROR STOP $expected"* && "$output" != *'UNEXPECTED_RETURN='* ]]; then
              passes=$((passes + 1))
              echo "INVALID_INPUT_VERDICT=EXPECTED_REJECTION MODE=$mode"
            else
              failures=$((failures + 1))
              printf 'INVALID_INPUT_VERDICT=FAIL MODE=%s EXIT=%s EXPECTED=%s\n%s\n' "$mode" "$exit_code" "$expected" "$output"
            fi
          done
          echo "STAGE01_INVALID_INPUT_PASS=$passes TOTAL=${#cases[@]} FAILURES=$failures (gating; NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 invalid-input gate: $passes/${#cases[@]} expected rejections, failures $failures. Not full oracle acceptance." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failures" -ne 0 || "$passes" -ne "${#cases[@]}" ]]; then
            echo "::error::Stage 1 invalid-input gate incomplete"
            exit 1
          fi
