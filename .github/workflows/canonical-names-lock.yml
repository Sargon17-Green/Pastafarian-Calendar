name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  windows-native-stage22:
    name: Verify Stage 22 with native Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run native Stage 1 regression and Stage 22 discovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw ('Native Windows PowerShell 5.1 required: ' + $PSVersionTable.PSVersion.ToString())
          }
          Write-Host ('NATIVE_RUNTIME=' + $PSVersionTable.PSVersion.ToString())
          $stageMeta = Get-Content -Raw -Encoding UTF8 .\DEVELOPMENT_STAGE.md
          if (($stageMeta -match '(?m)^CURRENT_STAGE=22\s*
      - name: Retain runner-side stage metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-powershell-tagalog-stage22-metadata
          path: DEVELOPMENT_STAGE.md
          if-no-files-found: error
) -and
              ($stageMeta -match '(?m)^LAST_COMPLETED_STAGE=21\s*
      - name: Retain runner-side stage metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-powershell-tagalog-stage22-metadata
          path: DEVELOPMENT_STAGE.md
          if-no-files-found: error
)) {
            & .\Run-Stage22.ps1
            if (-not $?) { throw 'Stage 22 verification failed' }
          } elseif ($stageMeta -match '(?m)^STAGE22_RUNTIME_VERIFICATION=EXPECTED_RED_CONFIRMED\s*
      - name: Retain runner-side stage metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-powershell-tagalog-stage22-metadata
          path: DEVELOPMENT_STAGE.md
          if-no-files-found: error
) {
            Write-Host 'STAGE22_PREVIOUSLY_VERIFIED=YES'
            & .\tests\Stage01.Tests.ps1
            if (-not $?) { throw 'Stage 1 regression failed after Stage 22 seal' }
            Write-Host 'STAGE22_POST_SEAL_BASELINE=PASS'
          } else {
            throw 'Stage 22 has neither an awaiting native test nor a verified seal'
          }
      - name: Retain runner-side stage metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-powershell-tagalog-stage22-metadata
          path: DEVELOPMENT_STAGE.md
          if-no-files-found: error
