name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  wat-stage02-wasmkit-native:
    if: "github.event_name == 'push' && github.ref == 'refs/heads/WAT+Español' && contains(github.event.head_commit.message, '[wasmkit-run]')"
    uses: ./.github/workflows/wat-stage02-wasmkit-native.yml
    permissions:
      contents: read

  wat-stage02-calendar-runtime-trace:
    if: "github.event_name == 'push' && github.ref == 'refs/heads/WAT+Español' && contains(github.event.head_commit.message, '[calendar-trace-run]')"
    uses: ./.github/workflows/wat-stage02-calendar-runtime-trace.yml
    permissions:
      contents: read

  wat-stage02-weave-rank-offset-differential:
    if: "github.event_name == 'push' && github.ref == 'refs/heads/WAT+Español' && contains(github.event.head_commit.message, '[weave-rank-offset-python]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record exact commit and locked source digests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 --version
          sha256sum tests/stage02_calendar_weave_independent_oracle.py artifacts/stage02-weave-large-rank-offset-audit-20261125.md tests/stage02_calendar_weave_large_rank_offset_differential.py
      - name: Run exact-source Python rank-offset differential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/wat-weave-rank-offset
          printf 'PROJECT_ID=PC-BRANCH-WAT-SPANISH\nSHA=%s\nRUN=%s\nATTEMPT=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > evidence/wat-weave-rank-offset/identity.txt
          sha256sum tests/stage02_calendar_weave_independent_oracle.py artifacts/stage02-weave-large-rank-offset-audit-20261125.md tests/stage02_calendar_weave_large_rank_offset_differential.py > evidence/wat-weave-rank-offset/sha256.txt
          python3 -m py_compile tests/stage02_calendar_weave_large_rank_offset_differential.py
          python3 tests/stage02_calendar_weave_large_rank_offset_differential.py | tee evidence/wat-weave-rank-offset/differential.json
      - name: Preserve exact-source differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wat-stage02-weave-large-rank-offset-differential
          path: evidence/wat-weave-rank-offset/
          if-no-files-found: warn

  wat-stage02-semantic:
    if: "github.event_name == 'push' && github.ref == 'refs/heads/WAT+Español'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record exact Git HEAD and WAT SHA256
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum tests/normative_selector.wat
      - name: Install WABT
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wabt
          wat2wasm --version
      - name: Verify independent Python and BigInt oracles including k5 q5, q6, q7 bounds
        run: |
          python3 tests/stage02_q2_neighbors_oracle.py
          python3 tests/stage02_q3_neighbors_oracle.py
          python3 tests/stage02_discovery01_forward_q2_q3_feasibility.py
          python3 tests/stage02_discovery01_short_q1_q2_oracle.py
          python3 tests/stage02_discovery01_short_q2_q3_oracle.py
          python3 tests/stage02_short_liveness_oracle.py
          python3 tests/stage02_short_q123_differential_oracle.py
          python3 tests/stage02_short_q45_extension_oracle.py
          python3 tests/stage02_short_small_n_oracle.py
          python3 tests/stage02_k4_q1_boundary_oracle.py
          python3 tests/stage02_k5_q2_boundary_oracle.py
          python3 tests/stage02_k5_q3_boundary_oracle.py
          python3 tests/stage02_k5_q4_boundary_oracle.py
          node tests/stage02_k5_q5_boundary_oracle.cjs
          node tests/stage02_k5_q6_boundary_oracle.cjs
          node tests/stage02_k5_q7_boundary_oracle.cjs
          node tests/stage02_k5_q8_boundary_oracle.cjs
          node tests/stage02_k5_q9_boundary_oracle.cjs
      - name: Run all 111 Native WAT cases and 83 exact independent BigInt oracles
        run: node tests/run_stage02_discovery01_webassembly.cjs
