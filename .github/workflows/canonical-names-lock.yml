                  shutil.copy2(ROOT / PROFILE, work / PROFILE)
                  shutil.copy2(ROOT / "tool/stage8_cost_attribution_metrics.dart", work / "tool/stage8_cost_attribution_metrics.dart")
                  shutil.copy2(ROOT / "pubspec.yaml", work / "pubspec.yaml")
                  counter = work / COUNTER
                  counter.write_text(once(counter.read_text(), ANCHOR, WRAPPER) + DART)
                  profile = work / PROFILE
                  source = once(profile.read_text(), "  final foundation = BigInt.from(-15055671);", INIT + "  final foundation = BigInt.from(-15055671);")
                  source = once(source, "  File(args.single).writeAsStringSync", CONTROL + "  File(args.single).writeAsStringSync")
                  profile.write_text(source)
                  cmd(["dart", "--version"], work)
                  cmd(["dart", "pub", "get"], work)
                  cmd(["dart", "format", COUNTER, PROFILE], work)
                  cmd(["dart", "analyze"], work)
                  for i in range(5):
                      pair = {}
                      for mode in (("off", "on") if i % 2 == 0 else ("on", "off")):
                          file = OUT / f"pair-{i+1}-{mode}.json"
                          env = dict(os.environ, MEMO_QA_ON="1" if mode == "on" else "0")
                          cmd(["dart", "run", PROFILE, str(file)], work, 240, env)
                          data = json.loads(file.read_text())
                          locks = validate(data, mode == "on")
                          semantic = {
                              "locks": locks, "monthLengths": data["monthLengths"],
                              "rank": data["canonicalRank"], "modulus": data["canonicalModulus"],
                              "control": [digest(v) for v in data["control"]["outputs"]],
                          }
                          if reference is None:
                              reference = semantic
                          require(reference == semantic, "paired exact outputs differ")
                          phases = {k: data["phases"][k]["elapsedMicroseconds"] for k in LOCKS}
                          pair[mode] = {"phases_us": phases, "total_us": sum(phases.values()),
                                        "control_us": data["control"]["us"],
                                        "memo": {k:v for k,v in data["memo"].items() if k != "events"}}
                      pairs.append(pair)
                      print("MEMO_QA_PAIR_PASS", i + 1, flush=True)
              gains = [1 - p["on"]["total_us"] / p["off"]["total_us"] for p in pairs]
              overhead = [p["on"]["control_us"] / p["off"]["control_us"] - 1 for p in pairs]
              candidate = statistics.median(gains) >= .05 and sum(g > 0 for g in gains) >= 4 and statistics.median(overhead) <= .05
              summary = {"project_id": "PC-BRANCH-DART-HEBREW", "head": head, "base": BASE,
                         "pairs": pairs, "reference": reference, "paired_gains": gains,
                         "control_overhead": overhead, "median_gain": statistics.median(gains),
                         "median_control_overhead": statistics.median(overhead),
                         "recommendation": "INVESTIGATE_ONLY" if candidate else "KEEP_A_DISCARD_MEMO",
                         "accounting": "128 bytes + 2*key code units + ceil(BigInt bitLength/8); not RSS",
                         "production_changed": False, "promotion_authorized": False}
              (OUT / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
              print("EXACT_MEMO_QA_PASS", json.dumps(summary), flush=True)
          
          try:
              main()
          except Exception as exc:
              OUT.mkdir(parents=True, exist_ok=True)
              (OUT / "failure.txt").write_text(repr(exc) + "\n")
              raise
          
          PY
