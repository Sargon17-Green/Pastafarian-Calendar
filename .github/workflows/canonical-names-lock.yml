name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  stage1-native:
    if: github.ref == 'refs/heads/COBOL+简体中文'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Create persistent log
        shell: bash
        run: |
          mkdir -p build
          printf 'STAGE=1\nMODE=LINUX_GNUCOBOL_NATIVE_REGRESSION\nCOMMIT=%s\n' "$GITHUB_SHA" > build/stage1-native.log

      - name: Install GnuCOBOL 3 and log the toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq 2>&1 | tee -a build/stage1-native.log
          sudo apt-get install -y --no-install-recommends gnucobol3 2>&1 | tee -a build/stage1-native.log
          cobc --version 2>&1 | tee -a build/stage1-native.log

      - name: Strict compile and execute Stage 1 bootstrap suite
        shell: bash
        run: |
          set -euo pipefail
          echo 'PHASE=STRICT_COMPILE' | tee -a build/stage1-native.log
          timeout --signal=TERM --kill-after=10s 300s \
            cobc -std=default -free \
            -Wall -Wextra -Wno-terminator -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
            -x -o build/bootstrap-tests \
            test/bootstrap_tests.cob \
            test/big_integer_tests.cob \
            test/normative_primitive_tests.cob \
            test/source_catalog_tests.cob \
            test/family_bruteforce_tests.cob \
            test/selection_tests.cob \
            test/ownership_error_tests.cob \
            src/big_integer.cob \
            src/source_language_catalog.cob \
            src/monster_bootstrap.cob \
            test/oracle/oracle_constants.cob \
            test/oracle/oracle_bigint.cob \
            test/oracle/normative_basic.cob \
            test/oracle/normative_bigint_primitives.cob \
            test/oracle/normative_sauce.cob \
            test/oracle/normative_selection.cob \
            test/oracle/normative_families.cob \
            test/oracle/normative_weaving.cob \
            test/oracle/normative_gates.cob \
            test/oracle/normative_year.cob \
            test/oracle/normative_oracle.cob \
            2>&1 | tee -a build/stage1-native.log

          echo 'PHASE=BOOTSTRAP_TESTS' | tee -a build/stage1-native.log
          timeout --signal=TERM --kill-after=10s 600s \
            ./build/bootstrap-tests 2>&1 | tee -a build/stage1-native.log

          grep -Fxq 'BOOTSTRAP_RESULT=PASS' build/stage1-native.log
          grep -Eq '^已执行测试: [[:space:]]*0*181[[:space:]]*$' build/stage1-native.log
          grep -Eq '^失败测试: [[:space:]]*0+[[:space:]]*$' build/stage1-native.log
          echo 'RESULT=PASS_STAGE1_NATIVE_LINUX' | tee -a build/stage1-native.log

      - name: Preserve native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-native-evidence
          path: build/stage1-native.log
          if-no-files-found: warn
          retention-days: 30

  stage2-discovery-native:
    if: github.ref == 'refs/heads/COBOL+简体中文'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout production discovery
        uses: actions/checkout@v4
      - name: Install GnuCOBOL 3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol3
          cobc --version
      - name: Strict compile and execute expected-red cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          printf 'STAGE=2\nHEAD=%s\n' "$GITHUB_SHA" | tee build/stage2-discovery.log
          timeout --signal=TERM --kill-after=10s 300s \
            cobc -std=default -free \
            -Wall -Wextra -Wno-terminator -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
            -x -o build/stage02-discovery \
            test/stage02_discovery_tests.cob \
            src/big_integer.cob \
            src/monster_bootstrap.cob \
            src/legacy_old_remainder.cob \
            2>&1 | tee -a build/stage2-discovery.log
          timeout --signal=TERM --kill-after=10s 120s \
            ./build/stage02-discovery 2>&1 | tee -a build/stage2-discovery.log
          grep -Eq '^STAGE2_EXPECTED_RED=[[:space:]]*0*3[[:space:]]*$' build/stage2-discovery.log
          grep -Eq '^STAGE2_CONTROL_PASS=[[:space:]]*0*1[[:space:]]*$' build/stage2-discovery.log
          grep -Eq '^STAGE2_UNEXPECTED_FAILURES=[[:space:]]*0+[[:space:]]*$' build/stage2-discovery.log
          grep -Fxq 'RESULT=PASS_STAGE2_DISCOVERY_NATIVE' build/stage2-discovery.log
          test "$(grep -c '^RAW_REMAINDER=0$' build/stage2-discovery.log)" -eq 3
          # Stage 3 has its own route. Legacy discovery must stay raw.
          if grep -iRE 'SAVE-PATCH|SAVE-NORMALIZE' src/legacy_old_remainder.cob; then
            echo 'LEGACY_PATH_MODIFIED=YES' | tee -a build/stage2-discovery.log
            exit 1
          fi
          echo 'LEGACY_PATH_RAW=YES' | tee -a build/stage2-discovery.log
      - name: Persist stage2 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-discovery-native-evidence
          path: build/stage2-discovery.log
          if-no-files-found: warn
          retention-days: 30

  stage3-patch-native:
    if: github.ref == 'refs/heads/COBOL+简体中文'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCOBOL 3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol3
          cobc --version
      - name: Strict compile and execute 8 production SAVE cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          printf 'STAGE=3\nHEAD=%s\n' "$GITHUB_SHA" | tee build/stage3-patch.log
          timeout --signal=TERM --kill-after=10s 300s \
            cobc -std=default -free \
            -Wall -Wextra -Wno-terminator -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
            -x -o build/stage03-patch \
            test/stage03_patch_tests.cob \
            src/big_integer.cob \
            src/monster_bootstrap.cob \
            src/legacy_old_remainder.cob \
            src/save_patch.cob \
            2>&1 | tee -a build/stage3-patch.log
          timeout --signal=TERM --kill-after=10s 120s \
            ./build/stage03-patch 2>&1 | tee -a build/stage3-patch.log
          grep -Eq '^STAGE3_PATCH_PASS=[[:space:]]*0*6[[:space:]]*$' build/stage3-patch.log
          grep -Eq '^STAGE3_CONTROL_PASS=[[:space:]]*0*2[[:space:]]*$' build/stage3-patch.log
          grep -Eq '^STAGE3_UNEXPECTED_FAILURES=[[:space:]]*0+[[:space:]]*$' build/stage3-patch.log
          grep -Fxq 'RESULT=PASS_STAGE3_PATCH_NATIVE' build/stage3-patch.log
          test "$(grep -c '^ROUTE=PATCH01:SAVE-PATCH$' build/stage3-patch.log)" -eq 8
      - name: Preserve Stage 3 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-patch-native-evidence
          path: build/stage3-patch.log
          if-no-files-found: warn
          retention-days: 30

  stage04-discovery-native:
    if: github.ref == 'refs/heads/COBOL+简体中文'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GnuCOBOL 3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol3
          cobc --version
      - name: Strict native compile and expected-red signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          printf 'PROJECT_ID=PC-BRANCH-COBOL-SIMPLIFIED-CHINESE\nHEAD=%s\n' "$GITHUB_SHA" >build/stage04-native.log
          timeout --signal=TERM --kill-after=10s 300s \
            cobc -std=default -free \
            -Wall -Wextra -Wno-terminator -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
            -x -o build/stage04-discovery \
            test/stage04_discovery_tests.cob \
            src/big_integer.cob \
            src/monster_bootstrap.cob \
            src/legacy_day_tag.cob \
            2>&1 | tee -a build/stage04-native.log
          timeout --signal=TERM --kill-after=10s 120s \
            ./build/stage04-discovery 2>&1 | tee -a build/stage04-native.log
          grep -Eq '^STAGE4_EXPECTED_RED=[[:space:]]*0*65[[:space:]]*$' build/stage04-native.log
          grep -Eq '^STAGE4_CONTROL_PASS=[[:space:]]*0*64[[:space:]]*$' build/stage04-native.log
          grep -Eq '^STAGE4_WITNESS_RED=[[:space:]]*0*3[[:space:]]*$' build/stage04-native.log
          grep -Eq '^STAGE4_WITNESS_CONTROL=[[:space:]]*0*2[[:space:]]*$' build/stage04-native.log
          grep -Eq '^STAGE4_UNEXPECTED_FAILURES=[[:space:]]*0+[[:space:]]*$' build/stage04-native.log
          grep -Fxq 'RESULT=PASS_STAGE4_EXPECTED_RED_NATIVE' build/stage04-native.log
          test -f docs/STAGE_04_DISCOVERY_02_CROSS_BRANCH_CONTRACT_2026-10-30.md
          ! grep -E 'PATCH02|DAY-TAG-PATCH' src/legacy_day_tag.cob
          echo 'STAGE4_DISCOVERY02_NATIVE_RESULT=PASS' | tee -a build/stage04-native.log
      - name: Preserve evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobol-stage04-expected-red
          path: build/stage04-native.log
          if-no-files-found: warn
          retention-days: 30

  stage05-patch-native:
    if: github.ref == 'refs/heads/COBOL+简体中文'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GnuCOBOL 3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol3
          cobc --version
      - name: Strict native compile and expected-red signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          printf 'PROJECT_ID=PC-BRANCH-COBOL-SIMPLIFIED-CHINESE\nHEAD=%s\n' "$GITHUB_SHA" >build/stage05-native.log
          timeout --signal=TERM --kill-after=10s 300s \
            cobc -std=default -free \
            -Wall -Wextra -Wno-terminator -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
            -x -o build/stage05-patch \
            test/stage05_patch_tests.cob \
            src/big_integer.cob \
            src/monster_bootstrap.cob \
            src/legacy_day_tag.cob \
            src/patched_day_tag.cob \
            2>&1 | tee -a build/stage05-native.log
          timeout --signal=TERM --kill-after=10s 120s \
            ./build/stage05-patch 2>&1 | tee -a build/stage05-native.log
          grep -Eq '^STAGE5_PATCH_PASS=[[:space:]]*0*65[[:space:]]*$' build/stage05-native.log
          grep -Eq '^STAGE5_CONTROL_PASS=[[:space:]]*0*64[[:space:]]*$' build/stage05-native.log
          grep -Eq '^STAGE5_WITNESS_PATCH=[[:space:]]*0*3[[:space:]]*$' build/stage05-native.log
          grep -Eq '^STAGE5_WITNESS_CONTROL=[[:space:]]*0*2[[:space:]]*$' build/stage05-native.log
          grep -Eq '^STAGE5_UNEXPECTED_FAILURES=[[:space:]]*0+[[:space:]]*$' build/stage05-native.log
          grep -Fxq 'RESULT=PASS_STAGE5_PATCH02_NATIVE' build/stage05-native.log
          test -f docs/STAGE_04_DISCOVERY_02_CROSS_BRANCH_CONTRACT_2026-10-30.md
          ! grep -E 'PATCH02|DAY-TAG-PATCH' src/legacy_day_tag.cob
          echo 'STAGE5_PATCH02_NATIVE_RESULT=PASS' | tee -a build/stage05-native.log
      - name: Preserve evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobol-stage05-patch02
          path: build/stage05-native.log
          if-no-files-found: warn
          retention-days: 30
