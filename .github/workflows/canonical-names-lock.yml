              src/patched_day_tag.cob
              src/patched_distance.cob
            )
            timeout --signal=TERM --kill-after=10s 300s cobc -std=default -free -Wall -Wextra -Wno-terminator -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror -x -o build/stage55-five-live-release-orders "${compile_sources[@]}" 2>&1 | tee -a build/stage55-native.log
            timeout --signal=TERM --kill-after=10s 120s ./build/stage55-five-live-release-orders 2>&1 | tee -a build/stage55-native.log
            node -e 'const a=JSON.parse(require("fs").readFileSync("build/stage55-native.log","utf8").split("\n").find(x=>x.startsWith("{"))); for(const [k,v] of Object.entries({cases:120,permutations:120,arithmetic:600,chunkComparisons:546600,plannedNativeOwnerChecks:6000,plannedNativeChunkChecks:5466000,plannedNativeDistinctChecks:2400,plannedNativeHeapSamples:2400,plannedNativeHeapZero:240,staticGate:"PASS",gate:"PASS_NOT_NATIVE"})) if(a[k]!==v) throw Error(k)'
            grep -Fxq 'STAGE55_HEAP_MEASURED=YES' build/stage55-native.log
            grep -Fxq 'RESULT=PASS_STAGE55_FIVE_LIVE_EXHAUSTIVE_RELEASE_ORDERS_NATIVE' build/stage55-native.log
            for pair in 'PERMUTATIONS 120' 'CASES 120' 'PASS 120' 'FIRST_PERMUTATION 12345' 'LAST_PERMUTATION 54321' 'INITIAL_OWNERS 600' 'REBUILD_OWNERS 600' 'RELEASE_STEPS 1200' 'OWNER_WALKS 6000' 'CHUNK_CHECKS 5466000' 'DISTINCT_CHECKS 2400' 'HEAP_SAMPLES 2400' 'HEAP_ZERO 240' 'ORIENTATION_0 30' 'ORIENTATION_1 30' 'ORIENTATION_2 30' 'ORIENTATION_3 30' 'UNEXPECTED_FAILURES 0'; do
              read -r key value <<<"$pair"
              grep -Eq "^STAGE55_${key}=[[:space:]]*0*${value}[[:space:]]*$" build/stage55-native.log
            done
            echo 'STAGE55_NATIVE_GATE=PASS' | tee -a build/stage55-native.log
        - name: Preserve Stage55 evidence including failures
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: cobol-stage55-five-live-exhaustive-release-orders-evidence
            path: build/stage55-native.log
            if-no-files-found: warn
            retention-days: 30


  post-stage55-qa51b-test-build-only-fault-injection:
    if: github.ref == 'refs/heads/COBOL+简体中文' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact parent, QA-only diff and source locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          test "$(git rev-parse HEAD^)" = 27c8e322587d358aeedb38b1de04e24d439560ff
          test "$(git rev-parse HEAD:src/big_integer.cob)" = 982c1f266a18c2bcaba79b994177a93750f27bfa
          test "$(git rev-parse HEAD:src/patched_distance.cob)" = 4e8412030716debca481306ba28be805ade76326
          python3 -B - <<'PY'
          import subprocess
          expected = sorted([
              ".github/workflows/canonical-names-lock.yml",
              ".github/workflows/cobol-qa51b-fault-injection.yml",
              "DEVELOPMENT_STAGE.md",
              "docs/POST_STAGE55_QA51B_TEST_BUILD_FAULT_INJECTION_CONTRACT_2026-11-25.md",
              "qa/cobol/qa51b_fault_control.cob",
              "qa/cobol/qa51b_service_shim.cob",
              "qa/cobol/qa51b_fault_injection_tests.cob",
              "qa/cobol/qa51b_fault_injection_oracle.mjs",
              "qa/cobol/qa51b_instrument.py",
          ])
          actual = sorted(subprocess.check_output(
              ["git", "diff", "--name-only",
               "5574f8ae5029aa7c4941c030b6b671217e3c603a", "HEAD"],
              text=True).splitlines())
          assert actual == expected, (actual, expected)
          PY
          git diff --exit-code 5574f8ae5029aa7c4941c030b6b671217e3c603a HEAD -- src
          git rev-parse HEAD > build/HEAD.txt
          git rev-parse HEAD:src/big_integer.cob > build/production-big-integer-blob.txt
          git rev-parse HEAD:src/patched_distance.cob > build/production-patched-distance-blob.txt
      - name: Install GnuCOBOL 3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > build/apt-update.log 2>&1
          sudo apt-get install -y --no-install-recommends gnucobol3 \
            > build/apt-install.log 2>&1
          cobc --version | tee build/cobc-version.txt
      - name: Run independent arithmetic and chunk oracle
        shell: bash
        run: |
          set -euo pipefail
          node qa/cobol/qa51b_fault_injection_oracle.mjs \
            | tee build/independent-oracle.json
      - name: Instrument temporary source copy only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B qa/cobol/qa51b_instrument.py \
            | tee build/instrumentation.log
          test -s build/instrumented-source.diff
          test -s build/instrumentation.json
          git diff --exit-code 5574f8ae5029aa7c4941c030b6b671217e3c603a HEAD -- src
      - name: Compile strict test-build executable
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s cobc \
            -std=default -free -Wall -Wextra -Wno-terminator \
            -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
            -x -o build/qa51b-fault-injection \
            qa/cobol/qa51b_fault_injection_tests.cob \
            qa/cobol/qa51b_service_shim.cob \
            qa/cobol/qa51b_fault_control.cob \
            work/big_integer_real.cob \
            src/patched_distance.cob \
            2>&1 | tee build/compile.log
      - name: Execute seven bounded fault-injection scenarios
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 1048576; ulimit -t 120;
           timeout --signal=TERM --kill-after=5s 120s \
             ./build/qa51b-fault-injection) \
             > build/native-test-build.stdout \
             2> build/native-test-build.stderr
          code=$?
          set -e
          printf '%s\n' "$code" > build/exitcode.txt
          python3 -B - <<'PY'
          import json,re
          from pathlib import Path
          e=Path("build")
          out=(e/"native-test-build.stdout").read_text()
          err=(e/"native-test-build.stderr").read_bytes()
          code=int((e/"exitcode.txt").read_text())
          def has(pattern):
              return re.search(pattern,out,re.M) is not None
          required=[
              has(r"^QA51B_CASES=\s*0*7\s*$"),
              has(r"^QA51B_PASS=\s*0*7\s*$"),
              has(r"^QA51B_UNEXPECTED_FAILURES=\s*0+$"),
              has(r"^QA51B_HEAP_LIVE_FINAL=\s*0+$"),
              "RESULT=PASS_QA51B_TEST_BUILD_ONLY_FAULT_INJECTION" in out,
              "QA51B_GATE=PASS_TEST_BUILD_ONLY" in out,
          ]
          result={
              "schema":"COBOL_QA51B_TEST_BUILD_FAULT_INJECTION_RESULT/1",
              "pass":code==0 and not err and all(required),
              "exit_code":code,
              "required_checks":required,
              "stderr_bytes":len(err),
              "production_source_modified":False,
              "stage56_opened":False,
              "full_calendar_integration":False
          }
          (e/"result.json").write_text(json.dumps(result,indent=2)+"\n")
          assert result["pass"], result
          PY
      - name: Preserve diagnostic evidence on pass or failure
        if: always()
        shell: bash
        run: |
          mkdir -p build
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("build")
          members={}
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!="members.sha256.json":
                  b=p.read_bytes()
                  members[p.name]={
                      "bytes":len(b),
                      "sha256":hashlib.sha256(b).hexdigest()
                  }
          (root/"members.sha256.json").write_text(
              json.dumps(members,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobol-qa51b-test-build-only-fault-injection
          path: build/
          if-no-files-found: warn
          retention-days: 90
