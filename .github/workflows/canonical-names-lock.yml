  stage32-adjacent-transition:
    name: Stage32 bounded adjacent target transitions
    if: github.ref == 'refs/heads/PowerShell+Tagalog'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stage32 239-assertion independent-oracle research
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'PowerShell 5.1 required' }
          $head = ((& git rev-parse HEAD) -join '').Trim()
          if ($head -cne $env:GITHUB_SHA) { throw 'Stage32 canonical checkout SHA mismatch' }
          @(
            ('STAGE32_HEAD_SHA=' + $head),
            ('STAGE32_NATIVE_RUNTIME=' + $PSVersionTable.PSVersion.ToString()),
            'STAGE32_SCOPE=16_PAIRS_32_ENDPOINTS',
            'STAGE32_EXPECTED_ASSERTIONS=239'
          ) | Set-Content stage32-canonical-metadata.txt -Encoding UTF8
          Start-Transcript -Path stage32-canonical-transcript.txt | Out-Null
          try {
            & .\tests\Stage32.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage32 canonical research failed' }
            $stageLines = @(Get-Content -Encoding UTF8 .\DEVELOPMENT_STAGE.md)
            if (($stageLines -contains 'CURRENT_STAGE=32') -and
                ($stageLines -contains 'LAST_COMPLETED_STAGE=32') -and
                ($stageLines -contains 'STAGE32_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) {
              Add-Content -Path stage32-canonical-metadata.txt -Value 'STAGE32_STAGE_SEAL=EVIDENCE_ONLY_CONFIRMED' -Encoding UTF8
              Write-Host 'STAGE32_SEAL_RECHECK=PASS'
            } else {
              Add-Content -Path stage32-canonical-metadata.txt -Value 'STAGE32_STAGE_SEAL=NOT_CLAIMED' -Encoding UTF8
              Write-Host 'STAGE32_DISCOVERY17_NATIVE=EVIDENCE_ONLY'
            }
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Retain Stage32 Windows exact-SHA probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-tagalog-stage32-canonical-evidence
          path: |
            stage32-canonical-metadata.txt
            stage32-canonical-transcript.txt
            DEVELOPMENT_STAGE.md
          if-no-files-found: warn

  stage33-mixed-grid-research:
    name: Stage33 bounded calculation-target interaction
    if: github.ref == 'refs/heads/PowerShell+Tagalog'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stage33 native 560-assertion mixed finite differences
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          $head = ((& git rev-parse HEAD) -join '').Trim()
          if ($head -cne $env:GITHUB_SHA) { throw 'Stage33 checkout SHA mismatch' }
          @(
            ('STAGE33_HEAD_SHA=' + $head),
            ('STAGE33_RUNTIME=' + $PSVersionTable.PSVersion.ToString()),
            'STAGE33_SCOPE=16_SQUARES_64_ENDPOINTS_64_EDGES',
            'STAGE33_EXPECTED_ASSERTIONS=560',
            'STAGE33_STAGE_SEAL=NOT_CLAIMED'
          ) | Set-Content stage33-grid-metadata.txt -Encoding UTF8
          Start-Transcript -Path stage33-grid-transcript.txt | Out-Null
          try {
            & .\tests\Stage33.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage33 native research failed' }
            Write-Host 'STAGE33_DISCOVERY18_NATIVE=EVIDENCE_ONLY'
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Preserve Stage33 research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-tagalog-stage33-grid-evidence
          path: |
            stage33-grid-metadata.txt
            stage33-grid-transcript.txt
            DEVELOPMENT_STAGE.md
          if-no-files-found: warn
