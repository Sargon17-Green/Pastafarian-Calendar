name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  wat-stage02-semantic:
    if: "github.event_name == 'push' && github.ref == 'refs/heads/WAT+Español'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record exact Git HEAD and WAT SHA256
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum tests/normative_selector.wat
      - name: Install WABT
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wabt
          wat2wasm --version
      - name: Verify short q1/q2/q3 and wide q2/q3 independent Python oracles
        run: |
          python3 tests/stage02_q2_neighbors_oracle.py
          python3 tests/stage02_q3_neighbors_oracle.py
          python3 tests/stage02_discovery01_forward_q2_q3_feasibility.py
          python3 tests/stage02_discovery01_short_q1_q2_oracle.py
          python3 tests/stage02_discovery01_short_q2_q3_oracle.py
      - name: Run all 49 Native WAT cases and 21 exact independent BigInt oracles
        run: node tests/run_stage02_discovery01_webassembly.cjs
