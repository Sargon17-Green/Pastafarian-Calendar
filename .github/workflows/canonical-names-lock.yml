    if: github.ref == 'refs/heads/COBOL+简体中文'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout production discovery
        uses: actions/checkout@v4
      - name: Install GnuCOBOL 3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol3
          cobc --version
      - name: Strict compile and execute expected-red cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          printf 'STAGE=2\nHEAD=%s\n' "$GITHUB_SHA" | tee build/stage2-discovery.log
