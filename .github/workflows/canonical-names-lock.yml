          test "$rc" -ne 0
          grep -Fq 'RISULTATO STADIO 4: 14 PASS, 3 FAIL' stage04.log
          test "$(grep -Fc 'PASS — ' stage04.log)" -eq 14
          test "$(grep -Fc 'FAIL — ' stage04.log)" -eq 3
          grep -Fq 'PASS — equivalenza normativa giorno Fondazione-2' stage04.log
          grep -Fq 'PASS — equivalenza normativa giorno Fondazione-1' stage04.log
