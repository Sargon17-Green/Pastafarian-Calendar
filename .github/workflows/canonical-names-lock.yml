          grep -Eq 'STAGE_11_PATCH_05_ORACLE_PASS cases=105 slots=735 legacyDifferences=[1-9][0-9]* legacyMatches=[1-9][0-9]* mismatches=0' stage16-results.log
          grep -Eq 'STAGE_11_PATCH_05_PROPERTIES_PASS cases=2062 slots=14434 legacyDifferences=[1-9][0-9]* legacyMatches=[1-9][0-9]*' stage16-results.log
          grep -Fq 'STAGE_12_DISCOVERY_06_GUARDS_PASS mismatches=11 matches=4 hidden=11 visible=4' stage16-results.log
          grep -Fq 'STAGE_12_DISCOVERY_06_PROPERTIES_PASS days=16 cases=2208 hiddenMisses=176 visibleMatches=2032' stage16-results.log
          grep -Fq 'STAGE_13_PATCH_06_GUARDS_PASS cases=15 hidden=11 visible=4 mismatches=0' stage16-results.log
          grep -Fq 'STAGE_13_PATCH_06_PROPERTIES_PASS days=16 cases=2208 hidden=176 visible=2032 mismatches=0 giantCases=138 giantMismatches=0' stage16-results.log
          grep -Fq 'STAGE_14_DISCOVERY_07_GUARDS_PASS mismatches=11 matches=0 missing=1 shifted=10' stage16-results.log
          grep -Fq 'STAGE_14_DISCOVERY_07_PROPERTIES_PASS cases=2816 shifted=2560 missing=256 differences=2816 giantCases=22 giantValues=20' stage16-results.log
          grep -Fq 'STAGE_15_PATCH_07_GUARDS_PASS rows=11 shifted=10 missing=1 mismatches=0' stage16-results.log
          grep -Fq 'STAGE_15_PATCH_07_PROPERTIES_PASS runs=1280 cases=14080 shifted=12800 missing=1280 mismatches=0 chains=64 chainedGrinds=704 chainMismatches=0 giantCases=22 giantMismatches=0' stage16-results.log
          grep -Fq 'STAGE_16_DISCOVERY_08_GUARDS_PASS mismatches=10 matches=0 accepted=5 rejected=5 witnesses=10' stage16-results.log
          grep -Fq 'STAGE_16_DISCOVERY_08_PROPERTIES_PASS direct=720 unique=720 cases=2880 mismatches=2880 accepted=1439 rejected=1441 giant=8' stage16-results.log
      - name: Verify intentional expected-red regression
