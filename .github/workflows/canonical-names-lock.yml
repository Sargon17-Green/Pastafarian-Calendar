    if: github.ref == 'refs/heads/Lua+Kreyòl-ayisyen'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enstale Lua 5.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.3
      - name: Verifye sentaks Lua
        shell: bash
        run: |
          set -euo pipefail
