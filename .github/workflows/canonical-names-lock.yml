name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  stage3-native-green:
    if: github.event_name == 'push' && github.ref == 'refs/heads/BASIC+ਪੰਜਾਬੀ'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned-family LibreOffice and system pyuno
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-common python3-uno
          libreoffice --version
          /usr/bin/python3 -c 'import uno; print("PYUNO_READY")'
      - name: Native Stage3 148/148 via isolated UNO profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/basic-punjabi-stage3-results"
          /usr/bin/python3 basic/qa/stage3_native_ci.py --basic-dir basic --output-dir "$RUNNER_TEMP/basic-punjabi-stage3-results"
      - name: Upload Stage3 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-punjabi-stage3-native-green
          path: ${{ runner.temp }}/basic-punjabi-stage3-results/
          if-no-files-found: warn

  stage4-bigint-differential:
    if: github.event_name == 'push' && github.ref == 'refs/heads/BASIC+ਪੰਜਾਬੀ'
    needs: [verify, stage3-native-green]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ephemeral LibreOffice and pyuno
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-common python3-uno
          libreoffice --version
          /usr/bin/python3 -c 'import uno; print("PYUNO_READY")'
      - name: Stage4 deterministic Python oracle self-test
        run: /usr/bin/python3 basic/qa/stage4_bigint_differential.py --self-test
      - name: Stage4 live StarBasic signed BigInt differential and metamorphic tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/basic-punjabi-stage4-results"
          /usr/bin/python3 basic/qa/stage4_bigint_differential.py --basic-dir basic --output-dir "$RUNNER_TEMP/basic-punjabi-stage4-results"
      - name: Upload Stage4 raw native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-punjabi-stage4-bigint-differential
          path: ${{ runner.temp }}/basic-punjabi-stage4-results/
          if-no-files-found: warn
