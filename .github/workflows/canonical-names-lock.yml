name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  verify_csharp_ar_discovery_01:
    name: تحقق مستقل من إخفاق الحفظ المتوقع
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/C#+العربية-الفصحى' }}
    runs-on: ubuntu-latest
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v5
      - name: تثبيت .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: إعادة اختبارات التأسيس
        run: dotnet run --project tests/PastafarianCalendar.Stage01Tests/PastafarianCalendar.Stage01Tests.csproj --configuration Release
      - name: تشغيل اختبار التباعد الأحمر
        id: discovery_red
        continue-on-error: true
        run: dotnet run --project tests/PastafarianCalendar.Stage02Tests/PastafarianCalendar.Stage02Tests.csproj --configuration Release
      - name: تحقق من أن الفروق الخمسة هي وحدها المتوقعة
        if: always()
        run: dotnet run --project tests/PastafarianCalendar.Stage02Tests/PastafarianCalendar.Stage02Tests.csproj --configuration Release -- --verify-expected-red

