name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  windows-native-stage-current:
    name: Native Windows PowerShell 5.1 Stage29+Stage30 and regressions
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify native runtime and stage regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw ('Windows PowerShell 5.1 required: ' + $PSVersionTable.PSVersion.ToString())
          }
          Write-Host ('NATIVE_RUNTIME=' + $PSVersionTable.PSVersion.ToString())
          $stageLines = @(Get-Content -Encoding UTF8 .\DEVELOPMENT_STAGE.md)
          $stage38Pending = (($stageLines -contains 'CURRENT_STAGE=38') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=37') -and ($stageLines -contains 'STAGE38_RUNTIME_VERIFICATION=PENDING_NATIVE') -and ($stageLines -contains 'STAGE37_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))
          $stage38Sealed = (($stageLines -contains 'CURRENT_STAGE=38') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=38') -and ($stageLines -contains 'STAGE38_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE37_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))
          $stage37Allowed = ((($stageLines -contains 'CURRENT_STAGE=37') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=36') -and ($stageLines -contains 'STAGE37_RUNTIME_VERIFICATION=PENDING_NATIVE') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or (($stageLines -contains 'CURRENT_STAGE=37') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=37') -and ($stageLines -contains 'STAGE37_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))) -or $stage38Pending -or $stage38Sealed
          if (($stageLines -contains 'CURRENT_STAGE=23') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=22') -and ($stageLines -contains 'STAGE23_RUNTIME_VERIFICATION=AWAITING')) {
            & .\Run-Stage23.ps1
            if (-not $?) { throw 'Stage 23 native verification failed' }
            Write-Host 'STAGE23_NATIVE_PATCH11=GREEN'
          } elseif (($stageLines -contains 'CURRENT_STAGE=23') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=23') -and ($stageLines -contains 'STAGE23_RUNTIME_VERIFICATION=GREEN_CONFIRMED')) {
            & .\tests\Stage01.Tests.ps1
            if (-not $?) { throw 'Stage 1 regression failed after Stage 23 seal' }
            Write-Host 'STAGE23_POST_SEAL_BASELINE=PASS'
          } elseif ((($stageLines -contains 'CURRENT_STAGE=29') -or
              (($stageLines -contains 'CURRENT_STAGE=30') -and
               ($stageLines -contains 'LAST_COMPLETED_STAGE=30') -and
               ($stageLines -contains 'STAGE30_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or
              (($stageLines -contains 'CURRENT_STAGE=31') -and
               ($stageLines -contains 'LAST_COMPLETED_STAGE=31') -and
               ($stageLines -contains 'STAGE31_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or
              (($stageLines -contains 'CURRENT_STAGE=32') -and
               ($stageLines -contains 'LAST_COMPLETED_STAGE=32') -and
               ($stageLines -contains 'STAGE32_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or
              ((($stageLines -contains 'CURRENT_STAGE=33') -or ($stageLines -contains 'CURRENT_STAGE=34')) -and
               ($stageLines -contains 'LAST_COMPLETED_STAGE=33') -and
               ($stageLines -contains 'STAGE33_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or
              (($stageLines -contains 'CURRENT_STAGE=34') -and
               ($stageLines -contains 'LAST_COMPLETED_STAGE=34') -and
               ($stageLines -contains 'STAGE34_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or
              (($stageLines -contains 'CURRENT_STAGE=35') -and
               ($stageLines -contains 'LAST_COMPLETED_STAGE=34') -and
               ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=PENDING_NATIVE') -and
               ($stageLines -contains 'STAGE34_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or
               ((($stageLines -contains 'CURRENT_STAGE=35') -or ($stageLines -contains 'CURRENT_STAGE=36') -or $stage37Allowed) -and (($stageLines -contains 'LAST_COMPLETED_STAGE=35') -or (($stageLines -contains 'LAST_COMPLETED_STAGE=36') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or (($stage38Pending -and ($stageLines -contains 'LAST_COMPLETED_STAGE=37')) -or ($stage38Sealed -and ($stageLines -contains 'LAST_COMPLETED_STAGE=38')))) -and ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE34_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))) -and
             ($stageLines -contains 'STAGE28_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and
             ((($stageLines -contains 'LAST_COMPLETED_STAGE=28') -and
               ($stageLines -contains 'STAGE29_RUNTIME_VERIFICATION=AWAITING')) -or
              ((($stageLines -contains 'LAST_COMPLETED_STAGE=29') -or ($stageLines -contains 'LAST_COMPLETED_STAGE=30') -or ($stageLines -contains 'LAST_COMPLETED_STAGE=31') -or ($stageLines -contains 'LAST_COMPLETED_STAGE=32') -or ($stageLines -contains 'LAST_COMPLETED_STAGE=33') -or ($stageLines -contains 'LAST_COMPLETED_STAGE=34') -or ($stageLines -contains 'LAST_COMPLETED_STAGE=35') -or (($stageLines -contains 'LAST_COMPLETED_STAGE=36') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or (($stage38Pending -and ($stageLines -contains 'LAST_COMPLETED_STAGE=37')) -or ($stage38Sealed -and ($stageLines -contains 'LAST_COMPLETED_STAGE=38')))) -and
               ($stageLines -contains 'STAGE29_RUNTIME_VERIFICATION=GREEN_CONFIRMED')))) {
            & .\tests\Stage01.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage01 regression failed Stage29' }
            & .\tests\Stage23.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage23 regression failed Stage29' }
            & .\tests\Stage24.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage24 regression failed Stage29' }
            & .\tests\Stage25.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage25 regression failed Stage29' }
            & .\tests\Stage26.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage26 historical RED failed Stage29' }
            & .\tests\Stage27.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage27 short patch regression failed Stage29' }
            & .\tests\Stage28.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage28 wide discovery regression failed Stage29' }
            # Gate execution to the exact CI checkout, never to a moving branch name.
            $checkedOutSha = ((& git rev-parse HEAD) -join '').Trim()
            if ($checkedOutSha -cne $env:GITHUB_SHA) { throw 'Stage29 checkout SHA differs from workflow event SHA' }
            Write-Host ('STAGE29_VERIFIED_CHECKOUT_SHA=' + $checkedOutSha)
            & .\tests\Stage29.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage29 Patch14 wide compatibility failed' }
            Write-Host ('STAGE29_NATIVE_SHA=' + $env:GITHUB_SHA)
            Write-Host 'STAGE29_PATCH14_NATIVE=PASS'
            # Stage30 independent finite-distribution study: evidence only, no production patch.
            & .\tests\Stage30.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage30 distributional discovery probe failed' }
            Write-Host ('STAGE30_DISCOVERY15_NATIVE_SHA=' + $env:GITHUB_SHA)
            Write-Host 'STAGE30_DISCOVERY15_NATIVE=EVIDENCE_ONLY'
            if (($stageLines -contains 'CURRENT_STAGE=30') -or ($stageLines -contains 'CURRENT_STAGE=31') -or ($stageLines -contains 'CURRENT_STAGE=32') -or (($stageLines -contains 'CURRENT_STAGE=33') -or ($stageLines -contains 'CURRENT_STAGE=34') -or ($stageLines -contains 'CURRENT_STAGE=35') -or ($stageLines -contains 'CURRENT_STAGE=36') -or $stage37Allowed)) { Write-Host 'STAGE30_SEAL_RECHECK=PASS' }
          } elseif (($stageLines -contains 'CURRENT_STAGE=27') -and
              ((($stageLines -contains 'LAST_COMPLETED_STAGE=26') -and ($stageLines -contains 'STAGE27_RUNTIME_VERIFICATION=AWAITING')) -or
               (($stageLines -contains 'LAST_COMPLETED_STAGE=27') -and ($stageLines -contains 'STAGE27_RUNTIME_VERIFICATION=GREEN_CONFIRMED')))) {
            & .\tests\Stage01.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage01 regression failed Stage27' }
            & .\tests\Stage23.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage23 regression failed Stage27' }
            & .\tests\Stage24.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage24 regression failed Stage27' }
            & .\tests\Stage25.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage25 regression failed Stage27' }
            & .\tests\Stage26.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage26 historical RED failed Stage27' }
            & .\tests\Stage27.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage27 short rejection repair failed' }
            Write-Host ('STAGE27_NATIVE_SHA=' + $env:GITHUB_SHA)
            Write-Host 'STAGE27_PATCH13_NATIVE=PASS'
            # Stage28 investigation is intentionally not a seal or production patch.
            & .\tests\Stage28.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage28 Discovery14 wide-sampling probe failed' }
            Write-Host 'STAGE28_DISCOVERY14_NATIVE=EVIDENCE_ONLY'
          } elseif (($stageLines -contains 'CURRENT_STAGE=26') -and (
              (($stageLines -contains 'LAST_COMPLETED_STAGE=25') -and ($stageLines -contains 'STAGE26_RUNTIME_VERIFICATION=AWAITING')) -or
              (($stageLines -contains 'LAST_COMPLETED_STAGE=26') -and ($stageLines -contains 'STAGE26_RUNTIME_VERIFICATION=EXPECTED_RED_CONFIRMED')))) {
            & .\tests\Stage01.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage01 failed Stage26' }
            & .\tests\Stage23.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage23 failed Stage26' }
            & .\tests\Stage24.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage24 failed Stage26' }
            & .\tests\Stage25.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage25 failed Stage26' }
            & .\tests\Stage26.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage26 historical EXPECTED_RED validation failed' }
            Write-Host ('STAGE26_NATIVE_SHA=' + $env:GITHUB_SHA)
            Write-Host 'STAGE26_DISCOVERY13_EXPECTED_RED=PASS'
          } elseif (($stageLines -contains 'CURRENT_STAGE=25') -and (
              (($stageLines -contains 'LAST_COMPLETED_STAGE=24') -and ($stageLines -contains 'STAGE25_RUNTIME_VERIFICATION=AWAITING')) -or
              (($stageLines -contains 'LAST_COMPLETED_STAGE=25') -and ($stageLines -contains 'STAGE25_RUNTIME_VERIFICATION=GREEN_CONFIRMED')))) {
            & .\tests\Stage01.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage01 failed Stage25' }
            & .\tests\Stage23.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage23 failed Stage25' }
            & .\tests\Stage24.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage24 failed Stage25' }
            & .\tests\Stage25.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage25 Native Patch12 failed' }
            Write-Host ('STAGE25_NATIVE_SHA=' + $env:GITHUB_SHA)
            Write-Host 'STAGE25_NATIVE_PATCH12=PASS'
          } elseif (($stageLines -contains 'CURRENT_STAGE=24') -and (
              (($stageLines -contains 'LAST_COMPLETED_STAGE=23') -and ($stageLines -contains 'STAGE24_RUNTIME_VERIFICATION=AWAITING')) -or
              (($stageLines -contains 'LAST_COMPLETED_STAGE=24') -and ($stageLines -contains 'STAGE24_RUNTIME_VERIFICATION=EXPECTED_RED_CONFIRMED')))) {
            & .\tests\Stage01.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage01 regression failed for Stage24' }
            & .\tests\Stage23.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage23 regression failed for Stage24' }
            & .\tests\Stage24.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage24 native historical RED verification failed' }
            Write-Host ('STAGE24_NATIVE_SHA=' + $env:GITHUB_SHA)
            Write-Host 'STAGE24_EXPECTED_RED=3456'
            Write-Host 'STAGE24_INCIDENTAL_MATCHES=864'
            Write-Host 'STAGE24_NATIVE_DISCOVERY12=PASS'
          } elseif (($stageLines -contains 'CURRENT_STAGE=22') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=21')) {
            & .\Run-Stage22.ps1
            if (-not $?) { throw 'Stage 22 verification failed' }
          } elseif ($stageLines -contains 'STAGE22_RUNTIME_VERIFICATION=EXPECTED_RED_CONFIRMED') {
            Write-Host 'STAGE22_PREVIOUSLY_VERIFIED=YES'
            & .\tests\Stage01.Tests.ps1
            if (-not $?) { throw 'Stage 1 regression failed after Stage 22 seal' }
            Write-Host 'STAGE22_POST_SEAL_BASELINE=PASS'
          } else {
            throw 'Stage 22 has neither an awaiting native test nor a verified seal'
          }
      - name: Verify sealed Stage 23 finalizer idempotency twice
        if: github.ref == 'refs/heads/PowerShell+Tagalog'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\VerifyFinalizeStage23Idempotency.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Stage 23 finalizer idempotency failed.' }
      - name: Retain Stage 23 finalizer idempotency evidence
        if: always() && github.ref == 'refs/heads/PowerShell+Tagalog'
        uses: actions/upload-artifact@v4
        with:
          name: native-powershell-tagalog-stage23-finalizer-idempotency
          path: ~/Downloads/Stage23-Finalize-Idempotency-*/
          if-no-files-found: error
      - name: Retain runner-side stage metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-powershell-tagalog-stage22-metadata
          path: DEVELOPMENT_STAGE.md
          if-no-files-found: error

  stage31-ordinal-inquiry:
    name: Stage31 bounded ordinal First/Step research
    if: github.ref == 'refs/heads/PowerShell+Tagalog'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Observe ordinal-day First/Step with independent oracle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Native Windows PowerShell 5.1 required' }
          $head = ((& git rev-parse HEAD) -join '').Trim()
          if ($head -cne $env:GITHUB_SHA) { throw 'Stage31 checkout SHA mismatch' }
          @(
            ('STAGE31_HEAD_SHA=' + $head),
            ('STAGE31_NATIVE_RUNTIME=' + $PSVersionTable.PSVersion.ToString()),
            'STAGE31_SCOPE=FINITE_ORDINAL_SAMPLE',
            'STAGE31_SEAL=NOT_CLAIMED'
          ) | Set-Content stage31-probe-metadata.txt -Encoding UTF8
          Start-Transcript -Path stage31-probe-transcript.txt | Out-Null
          try {
            Write-Host ('STAGE31_HEAD_SHA=' + $head)
            & .\tests\Stage31.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage31 bounded ordinal inquiry failed' }
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Preserve research-only ordinal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-tagalog-stage31-ordinal-evidence
          path: |
            stage31-probe-metadata.txt
            stage31-probe-transcript.txt
            DEVELOPMENT_STAGE.md
          if-no-files-found: warn

  stage31-boundary-extension:
    name: Stage31 bounded ordinal extension
    if: github.ref == 'refs/heads/PowerShell+Tagalog'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe 72 additional First/Step observations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          $head = ((& git rev-parse HEAD) -join '').Trim()
          if ($head -cne $env:GITHUB_SHA) { throw 'Stage31 extension checkout SHA mismatch' }
          @(
            ('STAGE31_EXT_HEAD_SHA=' + $head),
            ('STAGE31_EXT_RUNTIME=' + $PSVersionTable.PSVersion.ToString()),
            'STAGE31_EXT_SCOPE=FINITE_ORDINAL_EXTENSION',
            'STAGE31_EXT_SEAL=NOT_CLAIMED'
          ) | Set-Content stage31-extension-metadata.txt -Encoding UTF8
          Start-Transcript -Path stage31-extension-transcript.txt | Out-Null
          try {
            & .\tests\Stage31BoundaryExtension.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage31 extension test failed' }
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Preserve Stage31 extension evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-tagalog-stage31-extension-evidence
          path: |
            stage31-extension-metadata.txt
            stage31-extension-transcript.txt
            DEVELOPMENT_STAGE.md
          if-no-files-found: warn

  stage31-normative-year-boundary:
    name: Stage31 normative year-5000 boundary probe
    if: github.ref == 'refs/heads/PowerShell+Tagalog'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe oracle-derived year-5000 boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          $head = ((& git rev-parse HEAD) -join '').Trim()
          if ($head -cne $env:GITHUB_SHA) { throw 'Stage31 boundary checkout SHA mismatch' }
          @(
            ('STAGE31_BOUNDARY_HEAD_SHA=' + $head),
            ('STAGE31_BOUNDARY_RUNTIME=' + $PSVersionTable.PSVersion.ToString()),
            'STAGE31_BOUNDARY_SCOPE=NORMATIVE_YEAR_5000_SIX_TARGETS_TWO_SEALS',
            'STAGE31_BOUNDARY_SEAL=NOT_CLAIMED'
          ) | Set-Content stage31-boundary-metadata.txt -Encoding UTF8
          Start-Transcript -Path stage31-boundary-transcript.txt | Out-Null
          try {
            & .\tests\Stage31YearBoundary.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage31 normative year-boundary probe failed' }
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Preserve Stage31 year-boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-tagalog-stage31-year-boundary-evidence
          path: |
            stage31-boundary-metadata.txt
            stage31-boundary-transcript.txt
            DEVELOPMENT_STAGE.md
          if-no-files-found: warn

  stage32-adjacent-transition:
    name: Stage32 bounded adjacent target transitions
    if: github.ref == 'refs/heads/PowerShell+Tagalog'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stage32 239-assertion independent-oracle research
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'PowerShell 5.1 required' }
          $head = ((& git rev-parse HEAD) -join '').Trim()
          if ($head -cne $env:GITHUB_SHA) { throw 'Stage32 canonical checkout SHA mismatch' }
          @(
            ('STAGE32_HEAD_SHA=' + $head),
            ('STAGE32_NATIVE_RUNTIME=' + $PSVersionTable.PSVersion.ToString()),
            'STAGE32_SCOPE=16_PAIRS_32_ENDPOINTS',
            'STAGE32_EXPECTED_ASSERTIONS=239'
          ) | Set-Content stage32-canonical-metadata.txt -Encoding UTF8
          Start-Transcript -Path stage32-canonical-transcript.txt | Out-Null
          try {
            & .\tests\Stage32.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage32 canonical research failed' }
            $stageLines = @(Get-Content -Encoding UTF8 .\DEVELOPMENT_STAGE.md)
            $stage35Allowed = (($stageLines -contains 'CURRENT_STAGE=35') -and
                              ($stageLines -contains 'LAST_COMPLETED_STAGE=34') -and
                              ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=PENDING_NATIVE') -and
                              ($stageLines -contains 'STAGE34_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or ((($stageLines -contains 'CURRENT_STAGE=35') -or ($stageLines -contains 'CURRENT_STAGE=36')) -and (($stageLines -contains 'LAST_COMPLETED_STAGE=35') -or (($stageLines -contains 'LAST_COMPLETED_STAGE=36') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))) -and ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE34_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))
            $stage38Pending = (($stageLines -contains 'CURRENT_STAGE=38') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=37') -and ($stageLines -contains 'STAGE38_RUNTIME_VERIFICATION=PENDING_NATIVE') -and ($stageLines -contains 'STAGE37_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))
            $stage38Sealed = (($stageLines -contains 'CURRENT_STAGE=38') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=38') -and ($stageLines -contains 'STAGE38_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE37_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))
            $stage37Allowed = ((($stageLines -contains 'CURRENT_STAGE=37') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=36') -and ($stageLines -contains 'STAGE37_RUNTIME_VERIFICATION=PENDING_NATIVE') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or (($stageLines -contains 'CURRENT_STAGE=37') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=37') -and ($stageLines -contains 'STAGE37_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))) -or $stage38Pending -or $stage38Sealed
            $stage36Allowed = ((($stageLines -contains 'CURRENT_STAGE=36') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=35') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=PENDING_NATIVE') -and ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED')) -or (($stageLines -contains 'CURRENT_STAGE=36') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=36') -and ($stageLines -contains 'STAGE36_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED') -and ($stageLines -contains 'STAGE35_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))) -or $stage37Allowed
            $stage32PriorSeal = (((($stageLines -contains 'CURRENT_STAGE=32') -and
                                   ($stageLines -contains 'LAST_COMPLETED_STAGE=32')) -or
                                  ((($stageLines -contains 'CURRENT_STAGE=33') -or ($stageLines -contains 'CURRENT_STAGE=34')) -and
                                   ($stageLines -contains 'LAST_COMPLETED_STAGE=33'))) -and
                                 ($stageLines -contains 'STAGE32_RUNTIME_VERIFICATION=EVIDENCE_ONLY_CONFIRMED'))
