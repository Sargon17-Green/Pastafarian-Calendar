name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256

  windows-native-stage-current:
    name: Native Windows PowerShell 5.1 stage 22-24 gate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify native runtime and stage regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw ('Windows PowerShell 5.1 required: ' + $PSVersionTable.PSVersion.ToString())
          }
          Write-Host ('NATIVE_RUNTIME=' + $PSVersionTable.PSVersion.ToString())
          $stageLines = @(Get-Content -Encoding UTF8 .\DEVELOPMENT_STAGE.md)
          if (($stageLines -contains 'CURRENT_STAGE=23') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=22') -and ($stageLines -contains 'STAGE23_RUNTIME_VERIFICATION=AWAITING')) {
            & .\Run-Stage23.ps1
            if (-not $?) { throw 'Stage 23 native verification failed' }
            Write-Host 'STAGE23_NATIVE_PATCH11=GREEN'
          } elseif (($stageLines -contains 'CURRENT_STAGE=23') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=23') -and ($stageLines -contains 'STAGE23_RUNTIME_VERIFICATION=GREEN_CONFIRMED')) {
            & .\tests\Stage01.Tests.ps1
            if (-not $?) { throw 'Stage 1 regression failed after Stage 23 seal' }
            Write-Host 'STAGE23_POST_SEAL_BASELINE=PASS'
          } elseif (($stageLines -contains 'CURRENT_STAGE=25') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=24') -and ($stageLines -contains 'STAGE25_RUNTIME_VERIFICATION=AWAITING')) {
            & .\tests\Stage01.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage01 failed Stage25' }
            & .\tests\Stage23.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage23 failed Stage25' }
            & .\tests\Stage24.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage24 failed Stage25' }
            & .\tests\Stage25.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage25 Native Patch12 failed' }
            Write-Host ('STAGE25_NATIVE_SHA=' + $env:GITHUB_SHA)
            Write-Host 'STAGE25_NATIVE_PATCH12=PASS'
          } elseif (($stageLines -contains 'CURRENT_STAGE=24') -and (
              (($stageLines -contains 'LAST_COMPLETED_STAGE=23') -and ($stageLines -contains 'STAGE24_RUNTIME_VERIFICATION=AWAITING')) -or
              (($stageLines -contains 'LAST_COMPLETED_STAGE=24') -and ($stageLines -contains 'STAGE24_RUNTIME_VERIFICATION=EXPECTED_RED_CONFIRMED')))) {
            & .\tests\Stage01.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage01 regression failed for Stage24' }
            & .\tests\Stage23.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage23 regression failed for Stage24' }
            & .\tests\Stage24.Tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Stage24 native historical RED verification failed' }
            Write-Host ('STAGE24_NATIVE_SHA=' + $env:GITHUB_SHA)
            Write-Host 'STAGE24_EXPECTED_RED=3456'
            Write-Host 'STAGE24_INCIDENTAL_MATCHES=864'
            Write-Host 'STAGE24_NATIVE_DISCOVERY12=PASS'
          } elseif (($stageLines -contains 'CURRENT_STAGE=22') -and ($stageLines -contains 'LAST_COMPLETED_STAGE=21')) {
            & .\Run-Stage22.ps1
            if (-not $?) { throw 'Stage 22 verification failed' }
          } elseif ($stageLines -contains 'STAGE22_RUNTIME_VERIFICATION=EXPECTED_RED_CONFIRMED') {
            Write-Host 'STAGE22_PREVIOUSLY_VERIFIED=YES'
            & .\tests\Stage01.Tests.ps1
            if (-not $?) { throw 'Stage 1 regression failed after Stage 22 seal' }
            Write-Host 'STAGE22_POST_SEAL_BASELINE=PASS'
          } else {
            throw 'Stage 22 has neither an awaiting native test nor a verified seal'
          }
      - name: Verify sealed Stage 23 finalizer idempotency twice
        if: github.ref == 'refs/heads/PowerShell+Tagalog'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\VerifyFinalizeStage23Idempotency.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Stage 23 finalizer idempotency failed.' }
      - name: Retain Stage 23 finalizer idempotency evidence
        if: always() && github.ref == 'refs/heads/PowerShell+Tagalog'
        uses: actions/upload-artifact@v4
        with:
          name: native-powershell-tagalog-stage23-finalizer-idempotency
          path: ~/Downloads/Stage23-Finalize-Idempotency-*/
          if-no-files-found: error
      - name: Retain runner-side stage metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-powershell-tagalog-stage22-metadata
          path: DEVELOPMENT_STAGE.md
          if-no-files-found: error
