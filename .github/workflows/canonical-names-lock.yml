name: Canonical Names Lock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical names lock
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "$expected" ] || continue
            actual="$(git cat-file blob "HEAD:$path" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Canonical name lock mismatch"
              exit 1
            fi
          done < CANONICAL_NAMES_LOCK.sha256
  native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
      - name: Compile and link Stage 1 without running the oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          gfortran "${flags[@]}" -c src/big_integer.f90 -o build/big_integer.o
          gfortran "${flags[@]}" -c src/source_language_catalog.f90 -o build/source_language_catalog.o
          gfortran "${flags[@]}" -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
          gfortran "${flags[@]}" -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
          gfortran "${flags[@]}" -c test/normative_oracle_calendar.f90 -o build/normative_oracle_calendar.o
          gfortran "${flags[@]}" test/stage01_tests.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_tests
          gfortran "${flags[@]}" test/stage01_year5000_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_year5000_probe
          test -x build/stage01_tests
          test -x build/stage01_year5000_probe
          gfortran "${flags[@]}" test/stage01_year_boundary_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_year_boundary_probe
          test -x build/stage01_year_boundary_probe
          gfortran ""${flags[@]}"" test/stage01_year_choice_oracle.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_year_choice_oracle
          test -x build/stage01_year_choice_oracle
          gfortran "${flags[@]}" test/stage01_date_projection_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_date_projection_probe
          test -x build/stage01_date_projection_probe
          gfortran "${flags[@]}" test/stage01_normative_first_day_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_normative_first_day_probe
          gfortran "${flags[@]}" -c test/stage01_weaving_polynomial.f90 -o build/stage01_weaving_polynomial.o
          gfortran "${flags[@]}" test/stage01_weaving_microprobe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            -o build/stage01_weaving_microprobe
          gfortran "${flags[@]}" test/stage01_weaving_polynomial_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/stage01_weaving_polynomial.o \
            -o build/stage01_weaving_polynomial_probe
          gfortran "${flags[@]}" test/stage01_weaving_prefix_probe.f90 \
            build/big_integer.o \
            build/stage01_weaving_polynomial.o \
            -o build/stage01_weaving_prefix_probe
          gfortran "${flags[@]}" -c test/stage01_weaving_polynomial_unrank.f90 -o build/stage01_weaving_polynomial_unrank.o
          gfortran "${flags[@]}" test/stage01_weaving_unrank_probe.f90 \
            build/big_integer.o \
            build/stage01_weaving_polynomial.o \
            build/stage01_weaving_polynomial_unrank.o \
            -o build/stage01_weaving_unrank_probe
          gfortran "${flags[@]}" test/stage01_weaving_scaling_probe.f90 \
            build/big_integer.o \
            build/stage01_weaving_polynomial.o \
            build/stage01_weaving_polynomial_unrank.o \
            -o build/stage01_weaving_scaling_probe
          gfortran "${flags[@]}" test/stage01_weaving_rank_probe.f90 \
            build/big_integer.o \
            build/stage01_weaving_polynomial.o \
            build/stage01_weaving_polynomial_unrank.o \
            -o build/stage01_weaving_rank_probe
          gfortran "${flags[@]}" test/stage01_candidate_five_field_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            build/stage01_weaving_polynomial.o \
            build/stage01_weaving_polynomial_unrank.o \
            -o build/stage01_candidate_five_field_probe
          test -x build/stage01_candidate_five_field_probe
          gfortran "${flags[@]}" -c test/stage01_fast_calendar_candidate.f90 -o build/stage01_fast_calendar_candidate.o
          gfortran "${flags[@]}" test/stage01_real_date_candidate_probe.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            build/stage01_weaving_polynomial.o \
            build/stage01_weaving_polynomial_unrank.o \
            build/stage01_fast_calendar_candidate.o \
            -o build/stage01_real_date_candidate_probe
          test -x build/stage01_real_date_candidate_probe
          test -x build/stage01_weaving_rank_probe
          test -x build/stage01_weaving_scaling_probe
          test -x build/stage01_weaving_unrank_probe
          test -x build/stage01_weaving_prefix_probe
          test -x build/stage01_weaving_polynomial_probe
          test -x build/stage01_weaving_microprobe
          test -x build/stage01_normative_first_day_probe
      - name: Run bounded Stage 1 Oracle smoke (55 selected assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 30s build/stage01_tests bounded-smoke 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Bounded Stage 1 Oracle smoke failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_BOUNDED_ORACLE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_BOUNDED_ORACLE_ASSERTIONS=$actual EXPECTED=55 (NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 bounded Oracle smoke: $actual/55 assertions (not full acceptance)." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 55 ]]; then
            echo "::error::Stage 1 bounded Oracle assertion count mismatch"
            exit 1
          fi
      - name: Run bounded Stage 1 gate-gap and sauce smoke (3 assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 30s build/stage01_tests gate-sauce-smoke 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Bounded Stage 1 gate/sauce smoke failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_GATE_SAUCE_SMOKE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_GATE_SAUCE_SMOKE_ASSERTIONS=$actual EXPECTED=3 (NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 gate/sauce smoke: $actual/3 assertions (not full acceptance)." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 3 ]]; then
            echo "::error::Stage 1 gate/sauce smoke assertion count mismatch"
            exit 1
          fi
      - name: Run bounded Stage 1 gate-index consistency smoke (7 assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 30s build/stage01_tests gate-index-smoke 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Bounded Stage 1 gate-index smoke failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_GATE_INDEX_SMOKE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_GATE_INDEX_SMOKE_ASSERTIONS=$actual EXPECTED=7 (NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 gate-index consistency: $actual/7 assertions (not full acceptance)." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 7 ]]; then
            echo "::error::Stage 1 gate-index smoke assertion count mismatch"
            exit 1
          fi
      - name: Run bounded Stage 1 year5000 boundary/cost smoke (8 invariants; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 45s build/stage01_year5000_probe 2>&1)"
          exit_code=$?
          set -e
          elapsed=$((SECONDS-started))
          printf '%s\n' "$output"
          echo "STAGE01_YEAR5000_RUNTIME_SECONDS=$elapsed LIMIT=45"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Year5000 interval probe failed or exceeded 45s limit (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_YEAR5000_SMOKE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_YEAR5000_INVARIANTS=$actual EXPECTED=8 (NOT candidate-selection oracle)"
          echo "Fortran Stage 1 year5000 interval probe: $actual/8 invariants, ${elapsed}s. Not full Stage 1 acceptance." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 8 ]]; then
            echo "::error::Year5000 interval probe assertion count mismatch"
            exit 1
          fi
      - name: Run bounded Stage 1 adjacent-year endpoint smoke (14 assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 45s build/stage01_year_boundary_probe 2>&1)"
          exit_code=$?
          set -e
          elapsed=$((SECONDS-started))
          printf '%s\n' "$output"
          echo "STAGE01_YEAR_BOUNDARY_RUNTIME_SECONDS=$elapsed LIMIT=45"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Adjacent-year boundary probe failed or exceeded 45s limit (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_YEAR_BOUNDARY_SMOKE_PASS' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_YEAR_BOUNDARY_ASSERTIONS=$actual EXPECTED=14 (NOT independent year oracle)"
          echo "Fortran Stage 1 adjacent-year endpoints: $actual/14 assertions, ${elapsed}s. Not full Stage 1 acceptance." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 14 ]]; then
            echo "::error::Adjacent-year boundary assertion count mismatch"
            exit 1
          fi
      - name: Run independent Stage 1 year5000 candidate-choice oracle (21 assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 45s build/stage01_year_choice_oracle 2>&1)"
          exit_code=$?
          set -e
          elapsed=$((SECONDS-started))
          printf '%s\n' "$output"
          echo "STAGE01_YEAR_CHOICE_RUNTIME_SECONDS=$elapsed LIMIT=45"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Independent year5000 candidate-choice oracle failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fqx 'STAGE01_YEAR_CHOICE_ORACLE_PASS (candidate choice only; NOT full Stage 1 acceptance)' <<< "$output"
          grep -Fxq 'STAGE01_YEAR_CHOICE_ASSERTIONS=21' <<< "$output"
          grep -Fxq 'STAGE01_YEAR_CHOICE_FAILURES=0' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_YEAR_CHOICE_NATIVE_PASS=$actual EXPECTED=21 (NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 independent candidate-choice oracle: $actual/21, $elapsed seconds. NOT full Stage 1 acceptance." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" -ne 21 ]]; then
            echo "::error::Independent year5000 candidate-choice assertion mismatch"
            exit 1
          fi
      - name: Check exact five-component date projection (25 synthetic assertions; not full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(timeout --signal=TERM --kill-after=3s 15s build/stage01_date_projection_probe 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Five-field date projection failed or timed out (exit $exit_code)"
            exit 1
          fi
          grep -Fxq 'STAGE01_DATE_PROJECTION_PASS (synthetic mapping only; NOT full Stage 1 acceptance)' <<< "$output"
          grep -Fxq 'STAGE01_DATE_PROJECTION_ASSERTIONS=25' <<< "$output"
          grep -Fxq 'STAGE01_DATE_PROJECTION_FAILURES=0' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          echo "STAGE01_DATE_PROJECTION_NATIVE_PASS=$actual EXPECTED=25 (not normative_calendar_date integration)"
          if [[ "$actual" -ne 25 ]]; then
            echo "::error::Date projection count mismatch"
            exit 1
          fi
          echo "Stage 1 five-field synthetic projection: 25/25; full date integration NOT accepted." >> "$GITHUB_STEP_SUMMARY"
      - name: Gate exact five-field mapping on 45-month middle-rank candidate (21220 synthetic assertions)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$( (ulimit -v 1048576; timeout --signal=TERM --kill-after=3s 20s build/stage01_candidate_five_field_probe) 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Candidate five-field synthetic mapping failed or timed out, exit=$exit_code"
            exit 1
          fi
          grep -Fxq 'STAGE01_CANDIDATE_FIVE_FIELD_DAYS=4244' <<< "$output"
          grep -Fxq 'STAGE01_CANDIDATE_FIVE_FIELD_ASSERTIONS=21220' <<< "$output"
          grep -Fxq 'STAGE01_CANDIDATE_FIVE_FIELD_FAILURES=0' <<< "$output"
          grep -Fxq 'STAGE01_CANDIDATE_FIVE_FIELD_PASS (synthetic 45-month mapping; NOT full normative date)' <<< "$output"
          echo 'STAGE01_CANDIDATE_FIVE_FIELD_NATIVE_PASS=21220 EXPECTED=21220 (synthetic only)'
          echo 'Candidate 45-month synthetic projection: 21220/21220 exact component checks, NOT full normative calendar integration.' >> "$GITHUB_STEP_SUMMARY"
      - name: Gate real-date candidate structure and emit 7 exact five-field fixtures (not external differential)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          output="$( (ulimit -v 1048576; timeout --signal=TERM --kill-after=5s 110s build/stage01_real_date_candidate_probe) 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          echo "STAGE01_REAL_DATE_CANDIDATE_RUNTIME_SECONDS=$((SECONDS-started)) LIMIT=110"
          if [[ "$exit_code" -ne 0 ]]; then
            echo "::error::Real-date candidate probe failed or timed out, exit=$exit_code"
            exit 1
          fi
          grep -Fxq 'STAGE01_REAL_DATE_CANDIDATE_CASES=7' <<< "$output"
          grep -Fxq 'STAGE01_REAL_DATE_CANDIDATE_ASSERTIONS=35' <<< "$output"
          grep -Fxq 'STAGE01_REAL_DATE_CANDIDATE_FAILURES=0' <<< "$output"
          grep -Fxq 'STAGE01_REAL_DATE_CANDIDATE_PASS (internal invariants only; NOT independent OracleEngine comparison)' <<< "$output"
          if [[ "$(grep -c '^STAGE01_REAL_DATE_CASE=' <<< "$output")" -ne 7 ]]; then
            echo "::error::Expected seven independent real-date case records"
            exit 1
          fi
          echo 'STAGE01_REAL_DATE_CANDIDATE_NATIVE_PASS=35 EXPECTED=35 (NOT external differential)'
          echo 'Seven real-date candidate fixtures with 35/35 internal invariants; external OracleEngine comparison still needed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Localize first-day slow phase (15s, 1 GiB; NOT a gate)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          output="$( (ulimit -v 1048576; timeout --signal=TERM --kill-after=3s 15s build/stage01_normative_first_day_probe) 2>&1)"
          exit_code=$?
          set -e
          elapsed=$((SECONDS-started))
          printf '%s\n' "$output"
          last_phase="$(grep '^STAGE01_PHASE=' <<< "$output" | tail -n 1 || true)"
          echo "STAGE01_PHASE_LAST=${last_phase:-NONE}"
          echo "STAGE01_PHASE_DIAGNOSTIC_EXIT=$exit_code RUNTIME_SECONDS=$elapsed LIMIT=15 MEMORY_KIB=1048576"
          if [[ "$exit_code" -eq 0 ]] &&
             grep -Fxq 'STAGE01_PHASED_FIRST_DAY_ASSERTIONS=8' <<< "$output" &&
             grep -Fxq 'STAGE01_PHASED_FIRST_DAY_FAILURES=0' <<< "$output" &&
             grep -Fqx 'STAGE01_PHASED_FIRST_DAY_PASS (boundary invariants only; NOT full Stage 1 acceptance)' <<< "$output"; then
            echo 'STAGE01_PHASE_DIAGNOSTIC_VERDICT=PASS_8_OF_8_NOT_FULL_ORACLE'
          elif [[ "$exit_code" -eq 124 ]]; then
            echo "::warning::Stage1 phased first-day diagnostic timed out; see STAGE01_PHASE_LAST"
            echo 'STAGE01_PHASE_DIAGNOSTIC_VERDICT=TIMEOUT_PHASE_LOCATED'
          else
            echo "::warning::Stage1 phased first-day diagnostic failed or is inconclusive"
            echo 'STAGE01_PHASE_DIAGNOSTIC_VERDICT=INCONCLUSIVE_OR_FAIL'
          fi
          echo "Fortran Stage1 first-day phase diagnosis: exit=$exit_code, ${elapsed}s, ${last_phase:-NONE}; no full acceptance." >> "$GITHUB_STEP_SUMMARY"
      - name: Independently validate bounded weaving count/unrank (42 assertions; no full acceptance)
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout --signal=TERM --kill-after=3s 10s build/stage01_weaving_microprobe 2>&1)"
          printf '%s\n' "$output"
          grep -Fxq 'STAGE01_WEAVING_MICRO_ASSERTIONS=42' <<< "$output"
          grep -Fxq 'STAGE01_WEAVING_MICRO_FAILURES=0' <<< "$output"
          grep -Fxq 'STAGE01_WEAVING_MICRO_PASS (six exhaustive small fixtures; NOT full Stage 1 acceptance)' <<< "$output"
          actual="$(grep -c '^PASS: ' <<< "$output")"
          test "$actual" -eq 42
          echo "STAGE01_WEAVING_MICRO_NATIVE_PASS=$actual EXPECTED=42 (NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 weaving count/unrank: $actual/42 bounded independent checks; no full acceptance." >> "$GITHUB_STEP_SUMMARY"
      - name: Gate isolated Stage1 polynomial weaving candidate (105 exhaustive shapes)
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout --signal=TERM --kill-after=3s 20s build/stage01_weaving_polynomial_probe small 2>&1)"
          printf '%s\n' "$output"
          grep -Fxq 'STAGE01_POLY_SMALL_CASES=105' <<< "$output"
          grep -Fxq 'STAGE01_POLY_SMALL_ASSERTIONS=906' <<< "$output"
          grep -Fxq 'STAGE01_POLY_SMALL_FAILURES=0' <<< "$output"
          grep -Fxq 'STAGE01_POLY_SMALL_PASS (independent enumeration + legacy; NOT Stage1 acceptance)' <<< "$output"
          echo 'STAGE01_POLY_NATIVE_PASS=906 EXPECTED=906 (not full Stage1 acceptance)'
          echo 'Fortran Stage1 polynomial candidate: 105 small shapes, 906 exact checks; not normative.' >> "$GITHUB_STEP_SUMMARY"
      - name: Gate independent Stage1 prefix completions (3455 exhaustive checks)
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout --signal=TERM --kill-after=3s 20s build/stage01_weaving_prefix_probe 2>&1)"
          printf '%s\n' "$output"
          grep -Fxq 'STAGE01_POLY_PREFIX_CASES=105' <<< "$output"
          grep -Fxq 'STAGE01_POLY_PREFIX_ASSERTIONS=3455' <<< "$output"
          grep -Fxq 'STAGE01_POLY_PREFIX_FAILURES=0' <<< "$output"
          grep -Fxq 'STAGE01_POLY_PREFIX_PASS (exhaustive independent recursion; NOT Stage1 acceptance)' <<< "$output"
          echo 'STAGE01_POLY_PREFIX_NATIVE_PASS=3455 EXPECTED=3455 (not full Stage1 acceptance)'
          echo 'Fortran Stage1 prefix polynomial candidate: 3455 exhaustive prefix comparisons; not normative.' >> "$GITHUB_STEP_SUMMARY"

      - name: Gate Stage1 polynomial lexicographic unrank (1118 independent checks)
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout --signal=TERM --kill-after=3s 20s build/stage01_weaving_unrank_probe 2>&1)"
          printf '%s\n' "$output"
          grep -Fxq 'STAGE01_POLY_UNRANK_CASES=105' <<< "$output"
          grep -Fxq 'STAGE01_POLY_UNRANK_RANKS=698' <<< "$output"
          grep -Fxq 'STAGE01_POLY_UNRANK_ASSERTIONS=1118' <<< "$output"
          grep -Fxq 'STAGE01_POLY_UNRANK_FAILURES=0' <<< "$output"
          grep -Fxq 'STAGE01_POLY_REUSED_CACHE_ASSERTIONS=803' <<< "$output"
          grep -Fxq 'STAGE01_POLY_REUSED_CACHE_FAILURES=0' <<< "$output"
          grep -Fxq 'STAGE01_POLY_UNRANK_PASS (independent enumeration; NOT Stage1 acceptance)' <<< "$output"
          echo 'STAGE01_POLY_UNRANK_NATIVE_PASS=1118 EXPECTED=1118 (not full Stage1 acceptance)'
          echo 'Fortran Stage1 candidate lex-unrank: 105 shapes, 698 ranks, 1118 independent checks. Not normative.' >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose Stage1 candidate unrank scaling (bounded; NOT acceptance)
        shell: bash
        run: |
          set -euo pipefail
          for colors in 1 2 4 8 16 45; do
            set +e
            output="$( (ulimit -v 1048576; timeout --signal=TERM --kill-after=3s 12s build/stage01_weaving_scaling_probe "$colors") 2>&1)"
            exit_code=$?
            set -e
            printf '%s\n' "$output"
            if [[ "$exit_code" -eq 0 ]] &&
               grep -Fxq 'STAGE01_SCALING_ASSERTIONS=6' <<< "$output" &&
               grep -Fxq 'STAGE01_SCALING_PASS (candidate-only rank one; NOT normative integration)' <<< "$output"; then
              verdict=PASS_CANDIDATE_ONLY
            elif [[ "$exit_code" -eq 124 ]]; then
              verdict=TIMEOUT_NOT_ACCEPTED
            else
              verdict=INCONCLUSIVE_OR_FAIL
            fi
            echo "STAGE01_SCALING_VERDICT=$verdict COLORS=$colors EXIT=$exit_code"
            echo "Fortran Stage1 scaling: colors=$colors exit=$exit_code verdict=$verdict; 12s/1GiB, no date integration." >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Diagnose Stage1 arbitrary-rank scaling (middle and near-last; non-gating)
        shell: bash
        run: |
          set -euo pipefail
          # Each shape/rank case has a separate 12s runtime and 1GiB memory cap.
          # Exact rank correctness comes from the separate exhaustive small-shape gate.
          for colors in 2 4 16 45; do
            for mode in middle near_last; do
              set +e
              output="$( (ulimit -v 1048576; timeout --signal=TERM --kill-after=3s 12s build/stage01_weaving_rank_probe "$colors" "$mode") 2>&1)"
              exit_code=$?
              set -e
              printf '%s\n' "$output"
              if [[ "$exit_code" -eq 0 ]] &&
                 grep -Fxq 'STAGE01_RANK_ASSERTIONS=8' <<< "$output" &&
                 grep -Fxq 'STAGE01_RANK_PASS (structural only; independent small oracle is separate)' <<< "$output"; then
                verdict=PASS_STRUCTURAL_ONLY
              elif [[ "$exit_code" -eq 124 ]]; then
                verdict=TIMEOUT_NOT_ACCEPTED
              else
                verdict=INCONCLUSIVE_OR_FAIL
              fi
              echo "STAGE01_RANK_VERDICT=$verdict COLORS=$colors MODE=$mode EXIT=$exit_code"
              echo "Fortran Stage1 arbitrary rank: colors=$colors mode=$mode exit=$exit_code verdict=$verdict; max 12s/1GiB per case; candidate only." >> "$GITHUB_STEP_SUMMARY"
            done
          done
      - name: Diagnose Stage1 polynomial 45-month candidate (bounded, non-gating)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 1048576; timeout --signal=TERM --kill-after=3s 45s build/stage01_weaving_polynomial_probe target) > build/stage01_poly_target.log 2>&1
          exit_code=$?
          set -e
          cat build/stage01_poly_target.log
          if [ "$exit_code" -eq 0 ] && grep -Fxq 'STAGE01_POLY_TARGET_DIGITS=6765' build/stage01_poly_target.log; then
            # Fortran formatted output has exactly 6765 digits followed by LF;
            # the independent reference digest is for those digits without LF.
            digest="$(python3 -c 'import hashlib, pathlib, sys; raw = pathlib.Path(sys.argv[1]).read_bytes(); print(hashlib.sha256(raw[:-1]).hexdigest() if len(raw) == 6766 and raw[-1:] == bytes([10]) and raw[:-1].isdigit() else "INVALID_DECIMAL_OUTPUT")' build/stage01_weaving_candidate_count.txt)"
            echo "STAGE01_POLY_TARGET_DIGEST=$digest"
            if [ "$digest" = 'c0c08ac89c8faaaf589d1b3e076fe1e96405f2ad7172a15efa9d028fb43fb6f8' ]; then
              echo 'STAGE01_POLY_TARGET_VERDICT=DIGEST_MATCH_CANDIDATE_ONLY'
            else
              echo '::warning::Stage1 polynomial target digest mismatch'
              echo 'STAGE01_POLY_TARGET_VERDICT=DIGEST_MISMATCH'
            fi
          else
            echo "::warning::Stage1 polynomial candidate incomplete; exit=$exit_code"
            echo 'STAGE01_POLY_TARGET_VERDICT=INCONCLUSIVE'
          fi
          echo "Fortran Stage1 45-month candidate exit=$exit_code (not normative, not first-day integration)." >> "$GITHUB_STEP_SUMMARY"
      - name: Run bounded Stage 1 BigInt safe-boundary checks
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none \
            -J build -I build test/stage01_bigint_boundaries.f90 build/big_integer.o \
            -o build/stage01_bigint_boundaries
          timeout --signal=TERM --kill-after=5s 30s build/stage01_bigint_boundaries
      - name: Verify Stage 1 extreme arithmetic and expected int64 overflow rejections
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none \
            -J build -I build test/stage01_bigint_extreme_probe.f90 build/big_integer.o \
            -o build/stage01_bigint_extreme_probe
          gap_count=0
          pass_count=0
          overflow_count=0
          for probe in from-int64-min to-int64-min multiply-int64-max multiply-wide-limb multiply-int64-min multiply-wide-negative; do
            set +e
            result="$(timeout --signal=TERM --kill-after=2s 10s build/stage01_bigint_extreme_probe "$probe" 2>&1)"
            exit_code=$?
            set -e
            printf 'PROBE=%s EXIT=%s\n%s\n' "$probe" "$exit_code" "$result"
            if [[ "$exit_code" -eq 0 && "$result" == *"PROBE_RESULT=PASS MODE=$probe"* ]]; then
              pass_count=$((pass_count + 1))
              echo "PROBE_VERDICT=PASS MODE=$probe"
            else
              gap_count=$((gap_count + 1))
              echo "::error::Unresolved Stage 1 arithmetic boundary: $probe (exit $exit_code)"
              echo "PROBE_VERDICT=UNRESOLVED MODE=$probe"
            fi
          done
          for probe in to-int64-overflow-positive to-int64-overflow-negative; do
            set +e
            result="$(timeout --signal=TERM --kill-after=2s 10s build/stage01_bigint_extreme_probe "$probe" 2>&1)"
            exit_code=$?
            set -e
            printf 'PROBE=%s EXIT=%s\n%s\n' "$probe" "$exit_code" "$result"
            if [[ "$exit_code" -gt 0 && "$exit_code" -lt 128 && "$result" == *"ERROR STOP BigInt does not fit int64"* && "$result" != *"UNEXPECTED_RETURN="* ]]; then
              overflow_count=$((overflow_count + 1))
              echo "PROBE_VERDICT=EXPECTED_REJECTION MODE=$probe"
            else
              gap_count=$((gap_count + 1))
              echo "::error::Unresolved Stage 1 int64 overflow rejection: $probe (exit $exit_code)"
              echo "PROBE_VERDICT=UNRESOLVED MODE=$probe"
            fi
          done
          echo "STAGE01_EXTREME_BOUNDARY_PASS=$pass_count EXPECTED_OVERFLOW_REJECTIONS=$overflow_count UNRESOLVED=$gap_count (gating; NOT full Stage 1 acceptance)"
          {
            echo "## Fortran Stage 1 bounded BigInt gate"
            echo "Passing arithmetic probes: $pass_count/6; expected overflow rejections: $overflow_count/2; unresolved: $gap_count."
            echo "This is NOT full Stage 1 acceptance; full interleaving oracle is not executed."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$pass_count" -ne 6 || "$overflow_count" -ne 2 || "$gap_count" -ne 0 ]]; then
            echo "::error::Stage 1 bounded BigInt gate incomplete"
            exit 1
          fi

      - name: Reject invalid Stage 1 BigInt and bootstrap inputs (isolated, gating)
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none \
            -J build -I build test/stage01_invalid_input_probe.f90 \
            build/big_integer.o build/bootstrap_infrastructure.o \
            -o build/stage01_invalid_input_probe
          cases=(
            'empty-text|empty BigInt string'
            'plus-only|invalid BigInt string'
            'minus-only|invalid BigInt string'
            'invalid-digit|invalid BigInt digit'
            'leading-space|invalid BigInt digit'
            'internal-space|invalid BigInt digit'
            'zero-divisor|divisor must be positive'
            'negative-divisor|divisor must be positive'
            'negative-retry-budget|bootstrap retry budget must be nonnegative'
            'negative-trace-count|bootstrap trace count is invalid'
            'excessive-trace-count|bootstrap trace count is invalid'
            'negative-diagnostic-count|bootstrap diagnostic count is invalid'
            'exhausted-diagnostic-capacity|bootstrap diagnostic capacity exceeded'
          )
          passes=0
          failures=0
          for entry in "${cases[@]}"; do
            mode="${entry%%|*}"
            expected="${entry#*|}"
            set +e
            output="$(timeout --signal=TERM --kill-after=2s 5s build/stage01_invalid_input_probe "$mode" 2>&1)"
            exit_code=$?
            set -e
            if [[ "$exit_code" -eq 1 && "$output" == *"ERROR STOP $expected"* && "$output" != *'UNEXPECTED_RETURN='* ]]; then
              passes=$((passes + 1))
              echo "INVALID_INPUT_VERDICT=EXPECTED_REJECTION MODE=$mode"
            else
              failures=$((failures + 1))
              printf 'INVALID_INPUT_VERDICT=FAIL MODE=%s EXIT=%s EXPECTED=%s\n%s\n' "$mode" "$exit_code" "$expected" "$output"
            fi
          done
          echo "STAGE01_INVALID_INPUT_PASS=$passes TOTAL=${#cases[@]} FAILURES=$failures (gating; NOT full Stage 1 acceptance)"
          echo "Fortran Stage 1 invalid-input gate: $passes/${#cases[@]} expected rejections, failures $failures. Not full oracle acceptance." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failures" -ne 0 || "$passes" -ne "${#cases[@]}" ]]; then
            echo "::error::Stage 1 invalid-input gate incomplete"
            exit 1
          fi

  python-external-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify Stage1 independent comparison harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_external_python_reference.py
          python3 test/stage01_external_python_reference.py --self-test
      - name: Download pinned Python normative source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 15 --max-time 45 \
            'https://raw.githubusercontent.com/Sargon17-Green/Pastafarian-Calendar/0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4/tests/normative_reference.py' \
            --output build/stage01_python_reference_pinned.py
          python3 -m py_compile build/stage01_python_reference_pinned.py
      - name: Independently compare seven real dates and 35 numeric fields
        shell: bash
        run: |
          set -euo pipefail
          python3 test/stage01_external_python_reference.py \
            --reference build/stage01_python_reference_pinned.py
      - name: Preserve per-field differential and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortran-stage01-python-independent-diff
          path: stage01_external_diff_report.json
          if-no-files-found: warn
          retention-days: 30
