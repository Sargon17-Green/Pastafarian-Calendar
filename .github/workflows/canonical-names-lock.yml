          """
          DART = """
          // Disposable QA only. Accounted bytes are a model, not Dart heap/RSS.
          final class MemoEntry {
            final BigInt value;
            final int bytes;
            MemoEntry(this.value, this.bytes);
          }
          
          final class MemoQA {
            static const entryLimit = 64;
            static const byteLimit = 256 * 1024;
            static bool enabled = false;
            static final _cache = <String, MemoEntry>{};
            static final _events = <Map<String, Object>>[];
            static int bytes = 0, peak = 0, peakEntries = 0;
            static int hits = 0, misses = 0, bypasses = 0, evictions = 0, oversize = 0;
          
            static void reset(bool on) {
              enabled = on;
              _cache.clear();
              _events.clear();
              bytes = peak = peakEntries = hits = misses = bypasses = evictions = oversize = 0;
            }
          
            static BigInt run(List<int> remaining, int opened, int closed,
                BigInt Function() calculate) {
              final timer = Stopwatch()..start();
              late BigInt value;
              String status;
              if (!enabled) {
                bypasses++;
                status = 'bypass';
                value = calculate();
              } else {
                // Exact, immutable, delimiter-separated ordered integer tuple.
                final key = opened.toString() + '/' + closed.toString() + '/' +
                    remaining.join(',');
                final old = _cache.remove(key);
                if (old != null) {
                  hits++;
                  status = 'hit';
                  _cache[key] = old;
                  value = old.value;
                } else {
                  misses++;
                  status = 'miss';
                  // Invalid inputs throw before insertion; exceptions never cached.
                  value = calculate();
                  // Fixed overhead allowance + UTF-16 key + BigInt payload.
                  final cost = 128 + 2 * key.length + (value.bitLength + 7) ~/ 8;
                  if (cost > byteLimit) {
                    oversize++;
                    status = 'oversize';
                  } else {
                    while (_cache.length >= entryLimit || bytes + cost > byteLimit) {
                      final victim = _cache.remove(_cache.keys.first)!;
                      bytes -= victim.bytes;
                      evictions++;
                    }
                    _cache[key] = MemoEntry(value, cost);
                    bytes += cost;
                    if (bytes > peak) peak = bytes;
                    if (_cache.length > peakEntries) peakEntries = _cache.length;
                  }
                }
              }
              timer.stop();
              if (bytes < 0 || bytes > byteLimit || _cache.length > entryLimit) {
                throw StateError('Memo budget violated');
              }
              _events.add(<String, Object>{
                'status': status, 'us': timer.elapsedMicroseconds,
                'bits': value.bitLength, 'bytes': bytes, 'entries': _cache.length,
              });
              return value;
            }
          
            static Map<String, Object> snapshot() => <String, Object>{
