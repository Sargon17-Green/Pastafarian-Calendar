          v test ./pastafari/discovery04_expected_red_test.v
      - name: PATCH 04 — snapshot, original legacy call and table
        run: v test ./pastafari/patch04_test.v
      - name: DISCOVERY 05 — seven hidden drops with historical reversed positions
        run: v test ./pastafari/discovery05_witness_test.v
      - name: PATCH 05 — prior four RED assertions now GREEN
        shell: bash
        run: |
          set -euo pipefail
          v -check ./pastafari/discovery05_expected_red_test.v
          v test ./pastafari/discovery05_expected_red_test.v
      - name: PATCH 05 — 8-minus-k indexing and original backward storage
        run: v test ./pastafari/patch05_test.v
      - name: DISCOVERY 06 — historical visible-only reads and zero-slot failures
        run: v test ./pastafari/discovery06_witness_test.v
      - name: PATCH 06 — all previous RED assertions now GREEN
        shell: bash
