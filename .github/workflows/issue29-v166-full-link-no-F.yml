name: Issue29 v166 complete Ada GMP binary LINK + LOAD smoke without F
on:
  push:
    branches:
      - qa/issue29-ada-gmp-link-v166
    paths:
      - .github/workflows/issue29-v166-full-link-no-F.yml
permissions:
  contents: read
jobs:
  link-and-load-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce STOP and verify no-F binary probe is only taking addresses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B - <<'PY'
          import json,re
          from pathlib import Path
          halt=json.loads(Path("soak/control/confirmed_first_original_mismatch_dispatch_halt_v108.json").read_text())
          assert halt["decision"] == "STOP_NEW_NATIVE_SOAK_DISPATCH"
          assert halt["main_changes_permitted"] is False
          assert halt["successful_original_source_full_years"] == 0
          p=Path("soak/candidates/ada_full_weave_gmp_v164/issue29_v166_gmp_link_smoke.adb")
          code="\n".join(x.split("--",1)[0] for x in p.read_text().splitlines())
          assert "Normative_Oracle.Calendar_Date'Address" in code
          assert "Normative_Oracle.Choose_Rank'Address" in code
          assert "Normative_Oracle.Sauce'Address" in code
          for banned in ("Calendar_Date", "Sauce", "Choose_Rank", "Day_Count", "Foundation_Day"):
              assert not re.search(r"\b(?:Normative_Oracle\.)?" + banned + r"\s*\(",code)
          print("V166_ONLY_RESOLVE_SOURCE_SYMBOL_ADDRESSES_NO_CALENDAR_CALLS")
          PY
          git rev-parse HEAD > evidence/tested-sha.txt
      - name: Install GNAT/GPRBuild/GNATCOLL GMP and inspect library versions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > evidence/apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gnat-13 gprbuild libgnatcoll-gmp-dev binutils > evidence/apt-install.log 2>&1
          gprbuild --version > evidence/gpr-version.txt
          dpkg-query -W libgnatcoll-gmp-dev libgmp10 > evidence/native-libraries.txt
      - name: Source-lock historical Ada and make only a reversible QA GMP oracle copy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B soak/runner/issue29_foundation_capture_v160.py prepare --root "$RUNNER_TEMP/v166-qa" > evidence/prepare.stdout 2> evidence/prepare.stderr
          python3 -B soak/candidates/ada_full_weave_gmp_v164/integrate_gmp_qa_only_v164.py "$RUNNER_TEMP/v166-qa" soak/candidates/ada_full_weave_gmp_v164 > evidence/adapter.stdout 2> evidence/adapter.stderr
          cp "$RUNNER_TEMP/v166-qa/v164-qa-integration-receipt.json" evidence/
          cp "$RUNNER_TEMP/v166-qa/v164-qa-oracle.patch" evidence/
          cp soak/candidates/ada_full_weave_gmp_v164/issue29_v166_gmp_link_smoke.adb "$RUNNER_TEMP/v166-qa/ada-build/tests/"
      - name: Link COMPLETE QA Ada oracle body + all GMP dependencies to standalone executable
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v166-qa/ada-build"
          cat > "$ROOT/issue29_v166_full_link.gpr" <<'GPR'
          with "gnatcoll_gmp.gpr";
          project Issue29_V166_Full_Link is
             for Source_Dirs use ("src", "tests");
             for Object_Dir use "obj";
             for Exec_Dir use "bin";
             for Main use ("issue29_v166_gmp_link_smoke.adb");
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatW8", "-gnata");
             end Compiler;
          end Issue29_V166_Full_Link;
          GPR
          gprbuild -p -P "$ROOT/issue29_v166_full_link.gpr" -j2 > evidence/full-link.stdout 2> evidence/full-link.stderr
          test -x "$ROOT/bin/issue29_v166_gmp_link_smoke"
          sha256sum "$ROOT/bin/issue29_v166_gmp_link_smoke" > evidence/executable-sha256.txt
          file "$ROOT/bin/issue29_v166_gmp_link_smoke" > evidence/binary-type.txt
          ldd "$ROOT/bin/issue29_v166_gmp_link_smoke" > evidence/dynamic-libraries.txt
          readelf -d "$ROOT/bin/issue29_v166_gmp_link_smoke" > evidence/dynamic-section.txt
          nm "$ROOT/bin/issue29_v166_gmp_link_smoke" > evidence/symbol-table.txt
          grep -E '(normative_oracle|canonical_full_weave_gmp_v164|canonical_wide_rank_gmp_v164)' evidence/symbol-table.txt > evidence/relevant-symbols.txt
          test -s evidence/relevant-symbols.txt
          echo "V166_FULL_GMP_ORACLE_BODY_LINKED_NO_F_CALLED" > evidence/link-verdict.txt
      - name: Bounded loader startup — resolve Ada oracle symbols without calling F
        shell: bash
        run: |
          set -euo pipefail
          (
            ulimit -v 524288
            /usr/bin/time -v timeout --signal=KILL 10s "$RUNNER_TEMP/v166-qa/ada-build/bin/issue29_v166_gmp_link_smoke"
          ) > evidence/runtime.stdout 2> evidence/runtime.stderr
          grep -Fx V166_FULL_ORACLE_FUNCTION_ADDRESSES_RESOLVED evidence/runtime.stdout
          grep -Fx V166_NO_FCT_CALLS_NO_ORIGINAL_SOURCE_CALENDAR_EXECUTION evidence/runtime.stdout
          echo "V166_LINK_AND_LOAD_PASS_NO_F_CALLS" > evidence/runtime-verdict.txt
          echo "ORIGINAL_FCT_CALLS=0; QA_FCT_CALLS=0; SOAK_YEARS=0" >> evidence/runtime-verdict.txt
      - name: Hash all logs and attest the immutable worktree
        if: always()
        shell: bash
        run: |
          python3 -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          p=Path("evidence")
          entries={f.name:{"bytes":f.stat().st_size,"sha256":sha256(f.read_bytes()).hexdigest()} for f in sorted(p.iterdir()) if f.is_file()}
          (p/"member-hashes.json").write_text(json.dumps(entries,sort_keys=True,indent=2)+"\n")
          PY
      - name: Upload link receipts, sources and loader logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v166-full-ada-qa-link-and-no-F-loader-smoke
          path: evidence/
          if-no-files-found: error
          retention-days: 30
