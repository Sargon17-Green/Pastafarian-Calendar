name: Visual audit capture (diagnostic only)

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/visual-audit-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/visual-audit"
          mkdir -p "$RUNNER_TEMP/visual-audit"
          cd "$RUNNER_TEMP/visual-audit"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture interaction states
        shell: bash
        env:
          SITE_URL: https://sargon17-green.github.io/Pastafarian-Calendar/
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/visual-audit"
          cat > capture.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out,{recursive:true});
          const url = process.env.SITE_URL;

          const profiles = [
            {
              name:'desktop', width:1440, height:1000, mobile:false,
              search:[125,454], submit:[902,615], sauce:[976,655],
              sauceScrollY:0
            },
            {
              name:'mobile', width:390, height:844, mobile:true,
              search:[237,450], submit:[285,538], sauce:[233,610],
              sauceScrollY:260
            }
          ];

          async function openPage(browser,p,wait=5000) {
            const ctx=await browser.newContext({
              viewport:{width:p.width,height:p.height}, locale:'he-IL',
              isMobile:p.mobile, hasTouch:p.mobile, deviceScaleFactor:1
            });
            const page=await ctx.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('pageerror',e=>errors.push('pageerror: '+String(e)));
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' :: '+(r.failure()?.errorText||'')));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(wait);
            return {ctx,page,errors};
          }

          async function frameTexts(page) {
            const arr=[];
            for (const fr of page.frames()) {
              let txt='';
              try { txt=await fr.locator('body').innerText({timeout:1000}); } catch {}
              arr.push({url:fr.url(), text:txt.slice(0,20000)});
            }
            return arr;
          }

          async function advanced(browser,p) {
            const {ctx,page,errors}=await openPage(browser,p);
            await page.mouse.click(...p.search);
            await page.waitForTimeout(800);
            // input is auto-focused; first Tab moves to the advanced-options disclosure.
            await page.keyboard.press('Tab');
            await page.keyboard.press('Enter');
            await page.waitForTimeout(800);
            await page.screenshot({path:path.join(out,`${p.name}__advanced_open.png`),fullPage:true});
            fs.writeFileSync(path.join(out,`${p.name}__advanced_text.json`),JSON.stringify(await frameTexts(page),null,2));
            for(let i=1;i<=12;i++){
              await page.keyboard.press('Tab');
              await page.waitForTimeout(80);
              await page.screenshot({path:path.join(out,`${p.name}__advanced_tab_${String(i).padStart(2,'0')}.png`),fullPage:false});
            }
            fs.writeFileSync(path.join(out,`${p.name}__advanced_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          async function emptySubmit(browser,p) {
            const {ctx,page,errors}=await openPage(browser,p);
            await page.mouse.click(...p.search);
            await page.waitForTimeout(600);
            await page.keyboard.press('Control+A');
            await page.keyboard.press('Backspace');
            await page.waitForTimeout(200);
            await page.mouse.click(...p.submit);
            await page.waitForTimeout(800);
            await page.screenshot({path:path.join(out,`${p.name}__empty_submit.png`),fullPage:true});
            fs.writeFileSync(path.join(out,`${p.name}__empty_submit_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          async function sauce(browser,p) {
            const {ctx,page,errors}=await openPage(browser,p,65000);
            await page.evaluate(y=>window.scrollTo(0,y),p.sauceScrollY);
            await page.waitForTimeout(400);
            await page.screenshot({path:path.join(out,`${p.name}__before_sauce.png`),fullPage:false});
            await page.mouse.click(...p.sauce);
            await page.waitForTimeout(1000);
            await page.screenshot({path:path.join(out,`${p.name}__sauce_open.png`),fullPage:true});
            fs.writeFileSync(path.join(out,`${p.name}__sauce_text.json`),JSON.stringify(await frameTexts(page),null,2));
            fs.writeFileSync(path.join(out,`${p.name}__sauce_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles){
              await advanced(browser,p);
              await emptySubmit(browser,p);
              await sauce(browser,p);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture.js

      - name: Upload screenshots and metadata
        uses: actions/upload-artifact@v4
        with:
          name: main-site-visual-audit-interactions
          path: ${{ runner.temp }}/visual-audit/out
          if-no-files-found: error
          retention-days: 14
