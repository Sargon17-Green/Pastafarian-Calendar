name: Visual audit capture (diagnostic only)

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/visual-audit-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/visual-audit"
          mkdir -p "$RUNNER_TEMP/visual-audit"
          cd "$RUNNER_TEMP/visual-audit"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture calendar viewport positions
        shell: bash
        env:
          SITE_URL: https://sargon17-green.github.io/Pastafarian-Calendar/
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/visual-audit"
          cat > capture.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs'), path=require('path');
          const out=path.join(process.cwd(),'out'); fs.mkdirSync(out,{recursive:true});
          const profiles=[
            {name:'desktop',w:1440,h:1000,m:false},
            {name:'tablet800',w:800,h:1280,m:false},
            {name:'mobile390',w:390,h:844,m:true},
            {name:'mobile320',w:320,h:740,m:true},
          ];
          const url=process.env.SITE_URL;

          async function waitReady(page){
            await page.waitForFunction(()=>{
              const h=document.querySelector('pastafari-date');
              const c=h?.shadowRoot?.querySelector('.calendar');
              return !!c && !c.hasAttribute('data-state');
            },null,{timeout:150000});
            await page.waitForTimeout(4000);
          }

          async function info(page){
            return page.evaluate(()=>{
              const s=document.querySelector('pastafari-date').shadowRoot;
              const v=s.querySelector('.viewport');
              const cur=s.querySelector('.day[aria-current="date"]');
              const vr=v.getBoundingClientRect();
              const cr=cur?.getBoundingClientRect();
              const sections=[...s.querySelectorAll('.cutlet-section')];
              return {
                viewport:{scrollTop:v.scrollTop,scrollLeft:v.scrollLeft,scrollWidth:v.scrollWidth,clientWidth:v.clientWidth,scrollHeight:v.scrollHeight,clientHeight:v.clientHeight},
                current:cr?{top:cr.top,bottom:cr.bottom,left:cr.left,right:cr.right,width:cr.width,height:cr.height}:null,
                viewportRect:{top:vr.top,bottom:vr.bottom,left:vr.left,right:vr.right},
                currentVisible:!!(cr && cr.bottom>vr.top && cr.top<vr.bottom && cr.right>vr.left && cr.left<vr.right),
                sections:sections.length,
                days:s.querySelectorAll('.day').length,
                currentText:cur?.innerText || null,
              };
            });
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles){
              const ctx=await browser.newContext({viewport:{width:p.w,height:p.h},locale:'he-IL',isMobile:p.m,hasTouch:p.m,deviceScaleFactor:1});
              const page=await ctx.newPage();
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
              await waitReady(page);
              const viewport=page.locator('.viewport');
              fs.writeFileSync(path.join(out,`${p.name}__initial_info.json`),JSON.stringify(await info(page),null,2));
              await viewport.screenshot({path:path.join(out,`${p.name}__viewport_initial.png`)});

              for(const pos of ['top','middle','bottom']){
                await page.evaluate(pos=>{
                  const v=document.querySelector('pastafari-date').shadowRoot.querySelector('.viewport');
                  const max=Math.max(0,v.scrollHeight-v.clientHeight);
                  v.scrollTop=pos==='top'?0:pos==='middle'?Math.floor(max/2):max;
                },pos);
                await page.waitForTimeout(1800);
                fs.writeFileSync(path.join(out,`${p.name}__${pos}_info.json`),JSON.stringify(await info(page),null,2));
                await viewport.screenshot({path:path.join(out,`${p.name}__viewport_${pos}.png`)});
              }

              await page.evaluate(()=>{
                const v=document.querySelector('pastafari-date').shadowRoot.querySelector('.viewport');
                v.scrollLeft=0;
              });
              await page.waitForTimeout(200);
              await viewport.screenshot({path:path.join(out,`${p.name}__viewport_h0.png`)});
              await page.evaluate(()=>{
                const v=document.querySelector('pastafari-date').shadowRoot.querySelector('.viewport');
                v.scrollLeft=v.dir==='rtl'?-v.scrollWidth:v.scrollWidth;
              });
              await page.waitForTimeout(200);
              await viewport.screenshot({path:path.join(out,`${p.name}__viewport_hend.png`)});
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture.js

      - name: Upload screenshots and metadata
        uses: actions/upload-artifact@v4
        with:
          name: main-site-visual-audit-viewport
          path: ${{ runner.temp }}/visual-audit/out
          if-no-files-found: error
          retention-days: 14
