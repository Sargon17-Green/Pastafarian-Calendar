name: Visual audit capture (diagnostic only)

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/visual-audit-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/visual-audit"
          mkdir -p "$RUNNER_TEMP/visual-audit"
          cd "$RUNNER_TEMP/visual-audit"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture live site extended states
        shell: bash
        env:
          SITE_URL: https://sargon17-green.github.io/Pastafarian-Calendar/
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/visual-audit"
          cat > capture.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out, { recursive: true });
          const url = process.env.SITE_URL;

          const profiles = [
            {name:'desktop', width:1440, height:1000, mobile:false, search:[125,454], lang:[72,136]},
            {name:'tablet', width:1024, height:1366, mobile:false, search:[120,358], lang:[72,110]},
            {name:'mobile', width:390, height:844, mobile:true, search:[237,450], lang:[195,239]},
          ];

          async function makePage(browser,p) {
            const ctx = await browser.newContext({
              viewport:{width:p.width,height:p.height}, locale:'he-IL',
              isMobile:p.mobile, hasTouch:p.mobile, deviceScaleFactor:1
            });
            const page = await ctx.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('pageerror',e=>errors.push('pageerror: '+String(e)));
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' :: '+(r.failure()?.errorText||'')));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            return {ctx,page,errors};
          }

          async function extendedWait(browser,p) {
            const {ctx,page,errors}=await makePage(browser,p);
            for (const sec of [5,60,120,180]) {
              const elapsed = sec===5 ? 5 : sec;
              if (sec>5) await page.waitForTimeout((sec-(sec===60?5:sec===120?60:120))*1000);
              await page.screenshot({path:path.join(out,`${p.name}__wait_${String(sec).padStart(3,'0')}s.png`),fullPage:true});
            }
            fs.writeFileSync(path.join(out,`${p.name}__wait_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          async function searchClick(browser,p) {
            const {ctx,page,errors}=await makePage(browser,p);
            await page.mouse.click(p.search[0],p.search[1]);
            await page.waitForTimeout(1200);
            await page.screenshot({path:path.join(out,`${p.name}__search_click.png`),fullPage:true});
            // Keyboard-only exploration from the opened state.
            for (let i=1;i<=8;i++) {
              await page.keyboard.press('Tab');
              await page.waitForTimeout(120);
              await page.screenshot({path:path.join(out,`${p.name}__search_tab_${String(i).padStart(2,'0')}.png`),fullPage:false});
            }
            await page.keyboard.press('Escape');
            fs.writeFileSync(path.join(out,`${p.name}__search_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          async function languageKeyboard(browser,p,where,key) {
            const {ctx,page,errors}=await makePage(browser,p);
            await page.mouse.click(p.lang[0],p.lang[1]);
            await page.keyboard.press(key);
            await page.keyboard.press('Enter');
            await page.waitForTimeout(3000);
            await page.screenshot({path:path.join(out,`${p.name}__language_${where}.png`),fullPage:true});
            const visibleText = await page.locator('body').innerText().catch(()=> '');
            fs.writeFileSync(path.join(out,`${p.name}__language_${where}.txt`),visibleText.slice(0,10000));
            fs.writeFileSync(path.join(out,`${p.name}__language_${where}_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for (const p of profiles) {
              await searchClick(browser,p);
              await languageKeyboard(browser,p,'home','Home');
              await languageKeyboard(browser,p,'end','End');
            }
            for (const p of profiles) await extendedWait(browser,p);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture.js

      - name: Upload screenshots and metadata
        uses: actions/upload-artifact@v4
        with:
          name: main-site-visual-audit-extended
          path: ${{ runner.temp }}/visual-audit/out
          if-no-files-found: error
          retention-days: 14
