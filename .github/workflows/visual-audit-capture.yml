name: Visual audit capture (diagnostic only)

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/visual-audit-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/visual-audit"
          mkdir -p "$RUNNER_TEMP/visual-audit"
          cd "$RUNNER_TEMP/visual-audit"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture final trace and scroll diagnostics
        shell: bash
        env:
          SITE_URL: https://sargon17-green.github.io/Pastafarian-Calendar/
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/visual-audit"
          cat > capture.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out,{recursive:true});
          const url = process.env.SITE_URL;

          const profiles = [
            {name:'desktop', width:1440, height:1000, mobile:false, sauce:[976,655], sauceScrollY:0},
            {name:'mobile', width:390, height:844, mobile:true, sauce:[233,610], sauceScrollY:260}
          ];

          async function openPage(browser,p) {
            const ctx=await browser.newContext({
              viewport:{width:p.width,height:p.height},
              locale:'he-IL', isMobile:p.mobile, hasTouch:p.mobile, deviceScaleFactor:1
            });
            const page=await ctx.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('pageerror',e=>errors.push('pageerror: '+String(e)));
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' :: '+(r.failure()?.errorText||'')));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(65000);
            return {ctx,page,errors};
          }

          async function deepAudit(page) {
            return await page.evaluate(() => {
              const items=[];
              const scrollables=[];
              let seq=0;
              function walk(root,path='document') {
                const nodes = root.querySelectorAll ? [...root.querySelectorAll('*')] : [];
                for (const el of nodes) {
                  const r=el.getBoundingClientRect();
                  const cs=getComputedStyle(el);
                  const visible=!!(r.width && r.height && cs.display!=='none' && cs.visibility!=='hidden');
                  const isInteractive = /^(A|BUTTON|INPUT|SELECT|TEXTAREA|SUMMARY)$/.test(el.tagName) ||
                    ['button','link','tab','combobox','switch'].includes(el.getAttribute('role'));
                  if (visible && isInteractive) {
                    items.push({
                      seq:seq++, path, tag:el.tagName, type:el.getAttribute('type'),
                      role:el.getAttribute('role'), id:el.id,
                      text:(el.innerText||el.value||el.getAttribute('aria-label')||el.getAttribute('title')||'').trim().replace(/\s+/g,' ').slice(0,300),
                      aria:el.getAttribute('aria-label'), title:el.getAttribute('title'),
                      rect:{x:r.x,y:r.y,width:r.width,height:r.height}
                    });
                  }
                  if (visible && (el.scrollHeight>el.clientHeight+2 || el.scrollWidth>el.clientWidth+2)) {
                    scrollables.push({
                      path, tag:el.tagName, id:el.id,
                      cls:typeof el.className==='string'?el.className.slice(0,200):'',
                      clientWidth:el.clientWidth,scrollWidth:el.scrollWidth,
                      clientHeight:el.clientHeight,scrollHeight:el.scrollHeight,
                      overflowX:cs.overflowX,overflowY:cs.overflowY,
                      rect:{x:r.x,y:r.y,width:r.width,height:r.height}
                    });
                  }
                  if (el.shadowRoot) walk(el.shadowRoot, path+' > '+el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+'::shadow');
                }
              }
              walk(document);
              return {
                document:{
                  scrollWidth:document.documentElement.scrollWidth,
                  scrollHeight:document.documentElement.scrollHeight,
                  clientWidth:document.documentElement.clientWidth,
                  clientHeight:document.documentElement.clientHeight,
                  bodyScrollHeight:document.body?.scrollHeight,
                  title:document.title,lang:document.documentElement.lang,dir:document.documentElement.dir
                },
                items,scrollables
              };
            });
          }

          async function runProfile(browser,p) {
            const {ctx,page,errors}=await openPage(browser,p);
            await page.screenshot({path:path.join(out,`${p.name}__final_ready.png`),fullPage:true});
            fs.writeFileSync(path.join(out,`${p.name}__deep_before.json`),JSON.stringify(await deepAudit(page),null,2));

            await page.evaluate(y=>window.scrollTo(0,y),p.sauceScrollY);
            await page.waitForTimeout(400);
            await page.mouse.click(...p.sauce);
            await page.waitForTimeout(60000);
            await page.screenshot({path:path.join(out,`${p.name}__trace_after_60s.png`),fullPage:true});
            fs.writeFileSync(path.join(out,`${p.name}__deep_trace.json`),JSON.stringify(await deepAudit(page),null,2));

            // Verify the actual bottom a user reaches with normal page scrolling.
            await page.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight));
            await page.waitForTimeout(500);
            await page.screenshot({path:path.join(out,`${p.name}__window_bottom.png`),fullPage:false});

            fs.writeFileSync(path.join(out,`${p.name}__errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles) await runProfile(browser,p);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture.js

      - name: Upload screenshots and metadata
        uses: actions/upload-artifact@v4
        with:
          name: main-site-visual-audit-final-diagnostics
          path: ${{ runner.temp }}/visual-audit/out
          if-no-files-found: error
          retention-days: 14
