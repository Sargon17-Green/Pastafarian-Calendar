name: Visual audit capture (diagnostic only)

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/visual-audit-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/visual-audit"
          mkdir -p "$RUNNER_TEMP/visual-audit"
          cd "$RUNNER_TEMP/visual-audit"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture deep interaction states
        shell: bash
        env:
          SITE_URL: https://sargon17-green.github.io/Pastafarian-Calendar/
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/visual-audit"
          cat > capture.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out,{recursive:true});
          const url = process.env.SITE_URL;

          const profiles = [
            {name:'desktop', width:1440, height:1000, mobile:false},
            {name:'tablet800', width:800, height:1280, mobile:false},
            {name:'mobile390', width:390, height:844, mobile:true},
            {name:'mobile320', width:320, height:740, mobile:true},
          ];

          async function openPage(browser,p,locale='he-IL') {
            const ctx=await browser.newContext({
              viewport:{width:p.width,height:p.height}, locale,
              isMobile:p.mobile, hasTouch:p.mobile, deviceScaleFactor:1
            });
            const page=await ctx.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('pageerror',e=>errors.push('pageerror: '+String(e)));
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' :: '+(r.failure()?.errorText||'')));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            return {ctx,page,errors};
          }

          async function waitReady(page, timeout=150000) {
            await page.waitForFunction(() => {
              const host=document.querySelector('pastafari-date');
              const cal=host && host.shadowRoot && host.shadowRoot.querySelector('.calendar');
              return !!cal && !cal.hasAttribute('data-state');
            }, null, {timeout});
          }

          async function shadowInfo(page) {
            return page.evaluate(() => {
              const h=document.querySelector('pastafari-date');
              const s=h?.shadowRoot;
              const v=s?.querySelector('.viewport');
              const g=s?.querySelector('.cutlet-grid');
              const cal=s?.querySelector('.calendar');
              return {
                hostDir:h?.getAttribute('dir'), hostLang:h?.getAttribute('lang'),
                state:cal?.getAttribute('data-state'),
                viewport: v ? {
                  clientWidth:v.clientWidth, scrollWidth:v.scrollWidth,
                  clientHeight:v.clientHeight, scrollHeight:v.scrollHeight,
                  scrollLeft:v.scrollLeft, scrollTop:v.scrollTop
                } : null,
                grid: g ? {clientWidth:g.clientWidth,scrollWidth:g.scrollWidth} : null,
                body:{clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth}
              };
            });
          }

          async function readyAndInternalScroll(browser,p) {
            const {ctx,page,errors}=await openPage(browser,p);
            await waitReady(page);
            await page.screenshot({path:path.join(out,`${p.name}__ready_top.png`),fullPage:true});
            for(const pos of ['top','middle','bottom']){
              await page.evaluate((pos)=>{
                const v=document.querySelector('pastafari-date').shadowRoot.querySelector('.viewport');
                const max=Math.max(0,v.scrollHeight-v.clientHeight);
                v.scrollTop=pos==='top'?0:pos==='middle'?Math.floor(max/2):max;
              },pos);
              await page.waitForTimeout(2500);
              await page.screenshot({path:path.join(out,`${p.name}__internal_${pos}.png`),fullPage:false});
            }
            await page.evaluate(()=>{
              const v=document.querySelector('pastafari-date').shadowRoot.querySelector('.viewport');
              v.scrollLeft = v.scrollWidth;
            });
            await page.waitForTimeout(500);
            await page.screenshot({path:path.join(out,`${p.name}__internal_horizontal_end.png`),fullPage:false});
            fs.writeFileSync(path.join(out,`${p.name}__scroll_info.json`),JSON.stringify(await shadowInfo(page),null,2));
            fs.writeFileSync(path.join(out,`${p.name}__scroll_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          async function localeStates(browser,p) {
            const {ctx,page,errors}=await openPage(browser,p,'en-US');
            await waitReady(page);
            const select=page.locator('.language-selector');
            for(const code of ['en','ar','de']){
              await select.selectOption(code);
              await page.waitForTimeout(600);
              await page.screenshot({path:path.join(out,`${p.name}__locale_${code}.png`),fullPage:true});
              fs.writeFileSync(path.join(out,`${p.name}__locale_${code}_info.json`),JSON.stringify(await shadowInfo(page),null,2));
            }
            await page.locator('.editor-link').click();
            await page.locator('input[name="target"]').fill('123456789012345678901234567890-99-99');
            await page.screenshot({path:path.join(out,`${p.name}__long_input.png`),fullPage:false});
            await page.locator('.dialog-actions .primary').click();
            await page.waitForTimeout(400);
            await page.screenshot({path:path.join(out,`${p.name}__long_input_error.png`),fullPage:false});
            fs.writeFileSync(path.join(out,`${p.name}__locale_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          async function navigation(browser,p) {
            const {ctx,page,errors}=await openPage(browser,p);
            await waitReady(page);
            for(const [name,sel] of [['previous','.previous'],['next','.next'],['today','.today-button']]){
              await page.locator(sel).click();
              await page.waitForTimeout(5000);
              await page.screenshot({path:path.join(out,`${p.name}__nav_${name}.png`),fullPage:true});
            }
            fs.writeFileSync(path.join(out,`${p.name}__nav_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          async function workerFailure(browser,p) {
            const ctx=await browser.newContext({
              viewport:{width:p.width,height:p.height}, locale:'he-IL',
              isMobile:p.mobile, hasTouch:p.mobile, deviceScaleFactor:1
            });
            const page=await ctx.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('pageerror',e=>errors.push('pageerror: '+String(e)));
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' :: '+(r.failure()?.errorText||'')));
            await page.route('**/pastafari-worker.js*', route=>route.abort());
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            try {
              await page.waitForFunction(()=>{
                const h=document.querySelector('pastafari-date');
                return h?.shadowRoot?.querySelector('.calendar')?.getAttribute('data-state')==='error';
              },null,{timeout:60000});
            } catch {}
            await page.screenshot({path:path.join(out,`${p.name}__worker_failure.png`),fullPage:true});
            fs.writeFileSync(path.join(out,`${p.name}__worker_failure_info.json`),JSON.stringify(await shadowInfo(page),null,2));
            fs.writeFileSync(path.join(out,`${p.name}__worker_failure_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          async function cooking(browser,p) {
            const {ctx,page,errors}=await openPage(browser,p);
            await waitReady(page);
            await page.locator('.cooking-open').click();
            await page.waitForTimeout(1000);
            await page.screenshot({path:path.join(out,`${p.name}__cooking_loading.png`),fullPage:true});
            let ready=false;
            try{
              await page.waitForFunction(()=>{
                const d=document.querySelector('pastafari-date')?.shadowRoot;
                const c=d?.querySelector('pastafari-cooking');
                const pane=c?.shadowRoot?.querySelector('.pane');
                const loading=c?.shadowRoot?.querySelector('.status.loading');
                return !!c?.hasAttribute('open') && !!pane && !pane.hidden && !!loading && loading.hidden;
              },null,{timeout:240000});
              ready=true;
            }catch{}
            await page.screenshot({path:path.join(out,`${p.name}__cooking_${ready?'ready':'timeout'}.png`),fullPage:true});
            if(ready){
              const count=await page.locator('pastafari-cooking .nav button').count();
              fs.writeFileSync(path.join(out,`${p.name}__cooking_nav_count.txt`),String(count));
              for(let i=0;i<count;i++){
                const b=page.locator('pastafari-cooking .nav button').nth(i);
                const label=(await b.innerText()).replace(/[^\p{L}\p{N}]+/gu,'_').slice(0,40) || String(i);
                await b.click();
                await page.waitForTimeout(350);
                await page.screenshot({path:path.join(out,`${p.name}__cooking_chapter_${String(i).padStart(2,'0')}_${label}.png`),fullPage:true});
              }
            }
            fs.writeFileSync(path.join(out,`${p.name}__cooking_errors.json`),JSON.stringify(errors,null,2));
            await ctx.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles) await readyAndInternalScroll(browser,p);
            for(const p of [profiles[0],profiles[1],profiles[2]]) await localeStates(browser,p);
            for(const p of [profiles[0],profiles[2]]) await navigation(browser,p);
            for(const p of [profiles[0],profiles[2]]) await workerFailure(browser,p);
            for(const p of [profiles[0],profiles[2]]) await cooking(browser,p);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture.js

      - name: Upload screenshots and metadata
        uses: actions/upload-artifact@v4
        with:
          name: main-site-visual-audit-deep
          path: ${{ runner.temp }}/visual-audit/out
          if-no-files-found: error
          retention-days: 14
