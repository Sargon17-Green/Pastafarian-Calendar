name: Befunge QA19 One-Cell Native Counterfactual Discovery
on:
  push:
    branches: ['qa-befunge98-stage1-order-isolation-20261008']
    paths:
      - 'qa/stage1_qa19_native_frontier_witness.py'
      - 'qa/stage1_qa19_native_three_frontiers.py'
      - 'qa/stage1_qa19_native_three_frontiers_audit.py'
      - '.github/workflows/befunge-stage1-qa19-three-native-one-cell-frontiers.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-one-cell-source-x:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin BF98 source and independently executable native references
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = 560d6aa5807a7f766213a33835cce85eab0fa40c
          test "$(git hash-object reference/work_counts.b98)" = f941efc793c9eee4accf5d03873f8ed029b16725
          test "$(git hash-object reference/save.b98)" = 7b5e79aa6e2bfb636717cb018a3db6a13fb2bb44
          python3 -m py_compile qa/stage1_qa19_native_frontier_witness.py qa/stage1_qa19_native_three_frontiers.py qa/stage1_qa19_native_three_frontiers_audit.py
      - name: Recover original source-pinned QA13 Native trace neighbors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa19/original" "$RUNNER_TEMP/qa19/receipts"
          test "$(gh run view 39108506703 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '.conclusion + ":" + .headSha')" = 'success:76e09db067c1a044763d23e5f219b3fe8bac32cc'
          gh run download 39108506703 --repo "$GITHUB_REPOSITORY" --name befunge-kyrgyz-native-diverse-geometry --dir "$RUNNER_TEMP/qa19/original"
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'qa19'/'original'
          assert (folder/'diverse_manifest.json').is_file()
          with zipfile.ZipFile(folder.parent/'qa13-native-original.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for f in sorted(folder.iterdir()):
                  if f.is_file():z.write(f,f.name)
          PY
          PYTHONPATH=qa python3 qa/stage1_qa19_native_frontier_witness.py --original "$RUNNER_TEMP/qa19/qa13-native-original.zip" --source src/interleaved_work_counts.b98 --output "$RUNNER_TEMP/qa19/receipts/qa19_frozen_witnesses.json" | tee "$RUNNER_TEMP/qa19/receipts/qa19_discovery.log"
          grep -q QA19_REAL_NATIVE_THREE_ADJACENT_WITNESS_SETS_PASS "$RUNNER_TEMP/qa19/receipts/qa19_discovery.log"
      - name: Download exact SHA-256-pinned PyFunge 0.5-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Execute three native one-cell x versus inert z counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -e PYTHONPATH=/work/qa -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" -v "$RUNNER_TEMP/qa19/receipts:/qa19" -w /work python:2.7-slim sh -ceu '
            pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
            timeout --kill-after=5s 1200s python -u qa/stage1_qa19_native_three_frontiers.py /qa19/qa19_frozen_witnesses.json /qa19
          '
          test -s "$RUNNER_TEMP/qa19/receipts/qa19_native_forced_x.json"
      - name: Independently verify three finite Native results
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/stage1_qa19_native_three_frontiers_audit.py "$RUNNER_TEMP/qa19/receipts/qa19_frozen_witnesses.json" "$RUNNER_TEMP/qa19/receipts/qa19_native_forced_x.json" "$RUNNER_TEMP/qa19/receipts/qa19_independent_audit.json" | tee "$RUNNER_TEMP/qa19/receipts/qa19_auditor.log"
          grep -q QA19_INDEPENDENT_THREE_ONE_CELL_NATIVE_WITNESSES_PASS "$RUNNER_TEMP/qa19/receipts/qa19_auditor.log"
      - name: Preserve original discovery and real Native evidence on red or green
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa19-native-three-forced-x-one-cell-counterfactuals
          path: ${{ runner.temp }}/qa19/receipts/
          if-no-files-found: warn
