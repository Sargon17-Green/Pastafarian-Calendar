name: Logo Stage 1 Native Regression

on:
  push:
    branches:
      - "Logo+Ido"
  pull_request:
    branches:
      - "Logo+Ido"

permissions:
  contents: read

jobs:
  native-stage-1:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Install Berkeley Logo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ucblogo
          version="$(dpkg-query -W -f='${Version}' ucblogo)"
          echo "UCBLogo package version: $version"
          case "$version" in
            6.2.5-*) ;;
            *)
              echo "::error::Expected UCBLogo 6.2.5, got $version"
              exit 1
              ;;
          esac

      - name: Run original Stage 1 tests in native UCBLogo
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/logo-stage01.log"
          if timeout --signal=TERM --kill-after=5s 300s \
              logo test/stage01_tests.logo </dev/null >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Native Logo test failed or timed out (exit=$result)"
            exit 1
          fi

          if ! grep -Fxq 'STAGE_1_TESTI_PASIS' "$log"; then
            echo "::error::Native tests did not emit the required Stage 1 PASS marker"
            exit 1
          fi

          if grep -Eq 'TESTO_FALIIS|STAGE_1_TESTI_FALIIS|I don.t know how to' "$log"; then
            echo "::error::Native test log contains an error marker"
            exit 1
          fi

          echo 'NATIVE_STAGE_1_VERIFICATION=PASS'
