name: Rust Azerbaijani Stage04 DISCOVERY02 Baseline Native

on:
  push:
    branches:
      - 'Rust\+Azərbaycan-dili'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'DEVELOPMENT_STAGE.md'
      - 'audit/STAGE_04_DISCOVERY02_BASELINE_CONTRACT_2026-10-31.md'
      - '.github/workflows/rust-az-stage04-discovery02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-stage04-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify stage identity and formatting
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/STAGE_04_DISCOVERY02_BASELINE_CONTRACT_2026-10-31.md
          grep -Fxq 'CURRENT_STAGE=4' DEVELOPMENT_STAGE.md
          grep -Fxq 'LAST_COMPLETED_STAGE=3' DEVELOPMENT_STAGE.md
          grep -Fq 'pub mod discovery02_day_tag_probe;' src/lib.rs
          cargo fmt --all -- --check
      - name: Run bounded native baseline and prior regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'PROJECT_ID=PC-BRANCH-RUST-AZERBAIJANI\nSHA=%s\n' "$GITHUB_SHA" > evidence/sha.txt
          rustc --version > evidence/toolchain.txt
          cargo --version >> evidence/toolchain.txt
          set +e
          timeout --signal=TERM --kill-after=5s 900s \
            cargo test --all-targets -- --nocapture > evidence/stdout.txt 2> evidence/stderr.txt
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > evidence/exit.txt
          cat evidence/stdout.txt
          if [ "$exit_code" -ne 0 ]; then
            cat evidence/stderr.txt >&2
            exit "$exit_code"
          fi
          grep -Fq 'STAGE04_DISCOVERY02_BASELINE_CASES=7' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_HUGE_CASES=4' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_BIJECTION_CASES=1025' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_SYMMETRIC_HUGE_CASES=8' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_TAG_PREIMAGE_CASES=398' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_WORK_COUNTS_LOCAL_PAIRS=49' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_WORK_COUNTS_HUGE_PAIRS=8' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_WORK_COUNTS_TRANSLATION_CASES=12' evidence/stdout.txt
          grep -Eq 'test result: ok\. 3 passed; 0 failed' evidence/stdout.txt
          grep -Fq 'STAGE02_DISCOVERY01_EXPECTED_RED=3 CONTROL=1 UNEXPECTED=0' evidence/stdout.txt
          grep -Fq 'STAGE03_PATCH01_BOUNDARY_OK=8' evidence/stdout.txt
          grep -Eq 'test result: ok\. 16 passed; 0 failed' evidence/stdout.txt
          grep -Eq 'test result: ok\. 4 passed; 0 failed' evidence/stdout.txt
          grep -Eq 'test result: ok\. 3 passed; 0 failed' evidence/stdout.txt
          if grep -E 'test result: FAILED|test.*FAILED|panic' evidence/stdout.txt evidence/stderr.txt; then
            exit 1
          fi
          printf 'STAGE04_DISCOVERY02_BASELINE_ONLY=PASS\nEXPECTED_RED=NOT_CLAIMED\n' > evidence/result.txt
          cat evidence/result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-az-stage04-discovery02-baseline
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
