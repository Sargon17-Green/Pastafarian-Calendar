name: Rust Azerbaijani Stage04 DISCOVERY02 Baseline Native

on:
  push:
    branches:
      - 'Rust\+Azərbaycan-dili'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/stage04_cross_runtime_diff.py'
      - 'tools/stage04_rust_witness_provenance.py'
      - 'tools/tests/test_stage04_*.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'DEVELOPMENT_STAGE.md'
      - 'audit/STAGE_04_DISCOVERY02_BASELINE_CONTRACT_2026-10-31.md'
      - 'audit/STAGE_04_DISCOVERY02_ARCHIVED_ROUTE_CONTRACT_2026-10-31.md'
      - 'audit/STAGE_04_DISCOVERY02_DIRECT_RUNTIME_DIFFERENTIAL_CONTRACT_2026-11-01.md'
      - '.github/workflows/rust-az-stage04-discovery02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-stage04-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 100
      - name: Stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify stage identity and formatting
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/STAGE_04_DISCOVERY02_BASELINE_CONTRACT_2026-10-31.md
          test -f audit/STAGE_04_DISCOVERY02_ARCHIVED_ROUTE_CONTRACT_2026-10-31.md
          grep -Fxq 'CURRENT_STAGE=4' DEVELOPMENT_STAGE.md
          grep -Fxq 'LAST_COMPLETED_STAGE=3' DEVELOPMENT_STAGE.md
          grep -Fq 'pub mod discovery02_day_tag_probe;' src/lib.rs
          test -f audit/STAGE_04_DISCOVERY02_DIRECT_RUNTIME_DIFFERENTIAL_CONTRACT_2026-11-01.md
          cargo fmt --all -- --check
      - name: Verify exact four-column TSV protocol (6 bounded Python tests)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          timeout --signal=TERM --kill-after=5s 30s \
            python3 -m unittest discover -s tools/tests -p 'test_stage04_tsv_protocol.py' -v \
            > evidence/stage04_tsv_protocol_tests.txt 2>&1
          cat evidence/stage04_tsv_protocol_tests.txt
          grep -Fq 'Ran 6 tests' evidence/stage04_tsv_protocol_tests.txt
          grep -Fxq 'OK' evidence/stage04_tsv_protocol_tests.txt
      - name: Verify pinned historical Rust source eligibility (9 unit gates, no RED inference)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          timeout --signal=TERM --kill-after=5s 40s \
            python3 -m unittest discover -s tools/tests -p 'test_stage04_rust_witness_provenance.py' -v \
            > evidence/stage04_provenance_tests.txt 2>&1
          cat evidence/stage04_provenance_tests.txt
          grep -Fq 'Ran 9 tests' evidence/stage04_provenance_tests.txt
          grep -Fxq 'OK' evidence/stage04_provenance_tests.txt
          timeout --signal=TERM --kill-after=5s 25s \
            python3 tools/stage04_rust_witness_provenance.py \
              --repo . \
              --witness-commit 716e5a6f335b1a15464029b446edb468f3a8482c \
              --witness-path src/lib.rs \
              --witness-blob 8a813ba020c9101276007148c93cb00ae7836644 \
              --stage3-closure 716e5a6f335b1a15464029b446edb468f3a8482c \
              --stage4-introduction 2a7648c345ee63d9e5c81ca0361c6eb3060c6c4f \
              --branch-head "$GITHUB_SHA" \
              > evidence/stage04_source_pin.json
          python3 -c 'import json; p=json.load(open("evidence/stage04_source_pin.json")); assert p["source_pin_eligible"] is True and p["historical_day_tag_route_proven"] is False and p["observed_runtime_red"] is False and p["stage04_closure"] == "NOT_CLAIMED"'
          printf 'STAGE04_PROVENANCE_QA=9_PASS\nSTAGE04_HISTORICAL_RUST_ROUTE=NOT_PROVEN\nSTAGE04_CLOSURE=NOT_CLAIMED\n' > evidence/stage04_provenance_result.txt
          cat evidence/stage04_provenance_result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Run bounded native baseline and prior regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'PROJECT_ID=PC-BRANCH-RUST-AZERBAIJANI\nSHA=%s\n' "$GITHUB_SHA" > evidence/sha.txt
          rustc --version > evidence/toolchain.txt
          cargo --version >> evidence/toolchain.txt
          set +e
          timeout --signal=TERM --kill-after=5s 900s \
            cargo test --all-targets -- --nocapture > evidence/stdout.txt 2> evidence/stderr.txt
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > evidence/exit.txt
          cat evidence/stdout.txt
          if [ "$exit_code" -ne 0 ]; then
            cat evidence/stderr.txt >&2
            exit "$exit_code"
          fi
          grep -Fq 'STAGE04_DISCOVERY02_BASELINE_CASES=7' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_HUGE_CASES=4' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_BIJECTION_CASES=1025' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_SYMMETRIC_HUGE_CASES=8' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_TAG_PREIMAGE_CASES=398' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_WORK_COUNTS_LOCAL_PAIRS=49' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_WORK_COUNTS_HUGE_PAIRS=8' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_WORK_COUNTS_TRANSLATION_CASES=12' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_ARCHIVED_RED=8 CONTROL=7 UNEXPECTED=0' evidence/stdout.txt
          grep -Fq 'STAGE04_DISCOVERY02_ARCHIVED_PATCH_CONTROL=15' evidence/stdout.txt
          grep -Eq 'test result: ok\. 3 passed; 0 failed' evidence/stdout.txt
          grep -Fq 'STAGE02_DISCOVERY01_EXPECTED_RED=3 CONTROL=1 UNEXPECTED=0' evidence/stdout.txt
          grep -Fq 'STAGE03_PATCH01_BOUNDARY_OK=8' evidence/stdout.txt
          grep -Eq 'test result: ok\. 16 passed; 0 failed' evidence/stdout.txt
          grep -Eq 'test result: ok\. 4 passed; 0 failed' evidence/stdout.txt
          grep -Eq 'test result: ok\. 3 passed; 0 failed' evidence/stdout.txt
          if grep -E 'test result: FAILED|test.*FAILED|panic' evidence/stdout.txt evidence/stderr.txt; then
            exit 1
          fi
          printf 'STAGE04_DISCOVERY02_ARCHIVAL_WITNESS_QA=PASS\nSTAGE04_CLOSURE=NOT_CLAIMED\n' > evidence/result.txt
          cat evidence/result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Verify pinned original Python and run direct Python-Rust differential
        shell: bash
        run: |
          set -euo pipefail
          archive_commit='0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4'
          archive_tag='python-turkish-v1.0.0-verified-20261030'
          archive_path='src/pastafari_calendar/legacy_day_counts.py'
          timeout --signal=TERM --kill-after=5s 90s \
            git fetch --no-tags --depth=1 origin "refs/tags/$archive_tag"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$archive_commit"
          git show "$archive_commit:$archive_path" > evidence/archived_legacy_day_counts.py
          test "$(git hash-object evidence/archived_legacy_day_counts.py)" = \
            '405f461b2e2cdd170ded010e6f8046b78d6b4ab6'
          timeout --signal=TERM --kill-after=5s 180s \
            cargo run --locked --quiet --bin stage04_diff_emit \
            > evidence/stage04_rust_rows.tsv
          timeout --signal=TERM --kill-after=5s 120s \
            python3 tools/stage04_cross_runtime_diff.py \
              --source evidence/archived_legacy_day_counts.py \
              --rust-tsv evidence/stage04_rust_rows.tsv \
              --report evidence/stage04_direct_runtime_report.json \
            | tee evidence/stage04_differential_stdout.txt
          grep -Fxq 'STAGE04_CROSS_RUNTIME_RED=8 CONTROL=7 UNEXPECTED=0' evidence/stage04_differential_stdout.txt
          grep -Fxq 'STAGE04_CROSS_RUNTIME_PATCH_OK=15 CANDIDATE_OK=15' evidence/stage04_differential_stdout.txt
          grep -Fxq 'STAGE04_CROSS_RUNTIME_RESULT=PASS STAGE04_CLOSURE=NOT_CLAIMED' evidence/stage04_differential_stdout.txt
          printf 'STAGE04_DIRECT_RUNTIME_DIFFERENTIAL=PASS\nSTAGE04_CLOSURE=NOT_CLAIMED\n' \
            >> evidence/result.txt
          cat evidence/stage04_differential_stdout.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-az-stage04-discovery02-baseline
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
