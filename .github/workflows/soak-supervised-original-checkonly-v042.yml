name: Soak v042 supervised pinned original-source check-only (no Fct)
on:
  push:
    branches:
      - qa/soak-readiness-20261114
    paths:
      - "soak/runner/supervised_original_source_preflight_v042.py"
      - ".github/workflows/soak-supervised-original-checkonly-v042.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-real-source-check-only-processes:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: coordinator
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4
          path: original-python
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 03ac0c7f4db3c35487993dd31982faa37dd3948e
          path: original-javascript
      - name: Check immutable source snapshots and retain no installed tools
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$GITHUB_ACTIONS" = true
          test "$(git -C original-python rev-parse HEAD)" = 0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4
          test "$(git -C original-javascript rev-parse HEAD)" = 03ac0c7f4db3c35487993dd31982faa37dd3948e
          test -z "$(git -C original-python status --porcelain)"
          test -z "$(git -C original-javascript status --porcelain)"
          mkdir -p original-sources/Python-Turkce/0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4/tests
          mkdir -p original-sources/JavaScript-Interlingue/03ac0c7f4db3c35487993dd31982faa37dd3948e/tests
          mkdir -p original-sources/JavaScript-Interlingue/03ac0c7f4db3c35487993dd31982faa37dd3948e/src
          cp original-python/tests/normative_reference.py \
            original-sources/Python-Turkce/0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4/tests/
          cp original-javascript/tests/normative-reference.js \
            original-sources/JavaScript-Interlingue/03ac0c7f4db3c35487993dd31982faa37dd3948e/tests/
          cp original-javascript/src/source-language-catalog.js \
            original-sources/JavaScript-Interlingue/03ac0c7f4db3c35487993dd31982faa37dd3948e/src/
          printf '%s\n' \
            '75d56765b45892940326f67bd85a2c7c9874c01e43b49ee3553c9f6192d94378  original-sources/Python-Turkce/0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4/tests/normative_reference.py' \
            '8276e428c3a392ab39429331cdfdd7b80a8b1041efb4c9d806a6c141630a9fa5  original-sources/JavaScript-Interlingue/03ac0c7f4db3c35487993dd31982faa37dd3948e/tests/normative-reference.js' \
            '211333bff832e597e5388a789c811ae8fffb55780484f28b60b097410c786699  original-sources/JavaScript-Interlingue/03ac0c7f4db3c35487993dd31982faa37dd3948e/src/source-language-catalog.js' \
            | sha256sum -c -
          node --version
          python3 --version
      - name: Observe two actual Linux processes importing the pinned original code but computing zero dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 evidence
          /usr/bin/time -v python3 -B coordinator/soak/runner/supervised_original_source_preflight_v042.py \
            --ci-sources-preflight --source-root original-sources --output-root evidence \
            | tee evidence/gate.log
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("evidence")
          summary=json.loads((root/"summary.json").read_bytes())
          assert summary["status"]=="TWO_ORIGINAL_SOURCE_TRANSPORT_PROCESSES_OBSERVED_WITH_ZERO_FCT_CALLS"
          assert summary["source_preflight_processes"]==2
          assert summary["pinned_engine_ids"]==["REF-41","REF-24"]
          assert summary["all_os_process_exit_codes_zero"] is True
          assert summary["native_converter_Fct_calls"]==0
          assert summary["original_native_full_years_approved"]==0
          for engine in ("REF-41","REF-24"):
              r=json.loads((root/engine/"process-evidence.json").read_bytes())
              assert r["status"]=="ORIGINAL_PINNED_SOURCE_CHECK_ONLY_PROCESS_OBSERVED_NO_DATE_CALLS"
              assert r["exit_code"]==0
              assert r["converter_calls"]==0
              assert r["os_stdout_is_native_raw_date_data"] is False
              assert r["actual_native_date_execution_proven"] is False
              assert r["full_original_soak_years_approved"]==0
              assert (root/engine/"os-stdout.log").is_file()
              assert (root/engine/"os-stderr.log").is_file()
          print("TWO_LIVE_ORIGINAL_SOURCE_IMPORT_PROCESSES_OBSERVED_ZERO_FCT_CALLS")
          PY
      - name: Preserve actual OS stdout/stderr and source/executable hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-v042-supervised-original-source-checkonly-zero-date
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
