name: Issue29 v193 six corrected Ada vs original Python cross-year and changed-c NOT SOAK
on:
  push:
    branches:
      - qa/issue29-cross-year-changed-c-v193
    paths:
      - '.github/workflows/issue29-v193-cross-year.yml'
permissions:
  contents: read
concurrency:
  group: issue29-v193-six-pairs
  cancel-in-progress: false
jobs:
  fresh-differential:
    if: >-
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/qa/issue29-cross-year-changed-c-v193'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4
          path: original-python
          persist-credentials: false
      - name: Verify fixed six pairs and exact source pins
        run: |
          set -euo pipefail
          python3 -B qa/issue29/v193_diff.py preflight
          git diff --name-only 1160096aa847c54cbef27c232771ce1549d7ba8f...HEAD > evidence/changed-paths.txt
          git rev-parse HEAD > evidence/HEAD.txt
      - name: Install tested GNAT13 GMP toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq > evidence/apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gnat-13 gprbuild libgnatcoll-gmp-dev binutils > evidence/apt-install.log 2>&1
          dpkg-query -W gnat-13 libgnatcoll-gmp-dev libgmp10 > evidence/packages.txt
          gprbuild --version > evidence/gprbuild-version.txt
      - name: Build corrected Ada, verify GMP linkage
        run: |
          set -euo pipefail
          timeout -k 5s 180s gprbuild -p -j2 -P issue29_v193_diff.gpr > evidence/build.stdout 2> evidence/build.stderr
          nm bin_v193/issue29_v193_diff | grep -E 'canonical_full_weave_gmp_v164__unrank|canonical_wide_rank_gmp_v164__choose_rank' > evidence/gmp-linked-symbols.txt
          test "$(wc -l < evidence/gmp-linked-symbols.txt)" -ge 2
          sha256sum bin_v193/issue29_v193_diff > evidence/binary.sha256
      - name: Six fresh pairs, fail on first process or numerical mismatch
        run: |
          set -euo pipefail
          python3 -B qa/issue29/v193_diff.py
          test -z "$(git -C original-python status --porcelain)"
          git diff --exit-code 1160096aa847c54cbef27c232771ce1549d7ba8f HEAD -- src
      - name: Freeze all evidence, including failures
        if: always()
        run: |
          mkdir -p evidence
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('evidence')
          m={f.name:{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in sorted(p.iterdir()) if f.is_file() and f.name!='members.sha256.json'}
          (p/'members.sha256.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue29-v193-six-fresh-pairs-not-year
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
