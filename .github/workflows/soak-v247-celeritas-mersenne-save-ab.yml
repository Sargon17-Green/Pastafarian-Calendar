name: Soak v247 exact Mersenne SAVE reduction component and cold A-B (not soak)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v247-celeritas-mersenne-save-ab.yml
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind v246 profile and exact v243-v245 candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d507c7385f86b26b21702cbd6b7a7ec01dcde19a"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v247-celeritas-mersenne-save-ab.yml"
          mkdir -p evidence source/src source/include/pastafari
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15254779866/zip > evidence/v246.zip
          echo "82b4e1a942c43e204ab8571e6d19a034d3da4f8140853ddf96bedd6932c6f81f  evidence/v246.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib,zipfile,subprocess
          from pathlib import Path
          with zipfile.ZipFile("evidence/v246.zip") as z:
              assert z.testzip() is None
              r=json.loads(z.read("result.json"))
              frozen=json.loads(z.read("frozen-v245.json"))
          assert r["schema"]=="SOAK_V246_CELERITAS_COLD_PHASE_PROFILE/1" and r["profile_completed"]
          ref="408d80e43159eba06849b6a929e0010f32b9b91b"
          assert r["candidate_commit"]==ref and [x["c"] for x in frozen]==[739617,-377237,6875993]
          Path("evidence/frozen.json").write_text(json.dumps(frozen,ensure_ascii=False,indent=2)+"\n")
          pins={"src/monster.cpp":"faad56bd1a2f70b19d40e266b3b2e05754197a48","include/pastafari/monster.hpp":"4c24d36e3704dd10ecf5420e7bc11a3da958d441","include/pastafari/source_language_catalog.hpp":"9f204d93166b2c33532bb236bc2bd929252f27be"}
          manifest={}
          for p,h in pins.items():
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/Sargon17-Green/Pastafarian-Calendar/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\x00"+raw).hexdigest()==h
              Path("source",p).write_bytes(raw)
              manifest[p]={"blob":h,"sha256":hashlib.sha256(raw).hexdigest()}
          Path("evidence/source-pins.json").write_text(json.dumps({"commit":ref,"files":manifest},indent=2)+"\n")
          PY
      - name: Compile exact baseline and reversible SAVE-only diagnostic
        run: |
          set -euo pipefail
          (
            if ! printf '#include <boost/multiprecision/cpp_int.hpp>\nint main(){}\n' | g++ -std=c++17 -x c++ -fsyntax-only -; then
              timeout -k 5s 120s sudo apt-get update -qq
              timeout -k 5s 120s sudo apt-get install -y --no-install-recommends libboost-dev
            fi
            g++ --version
            dpkg-query -W libboost-dev
          ) > evidence/compiler.txt 2>&1
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          original=Path("source/src/monster.cpp").read_text()
          header=Path("source/include/pastafari/monster.hpp").read_text()
          assert "M_OLD = (Integer{1} << 127) - 1;" in header
          a="Integer savePatch(const Integer& x) {\n    Integer r = oldRemainder(x);"
          b="""Integer savePatch(const Integer& x) {
              // QA-only exact Mersenne reduction for nonnegative operands.
              // Keep the original reduction for all negative operands and modes
              // requiring the historical arithmetic.
              if (x >= 0 && accelerationsOn() && !fullHistoricalValidationOn()) {
                  Integer r = x;
                  while (r > M_OLD) {
                      const Integer high = r >> 127;
                      r &= M_OLD;
                      r += high;
                  }
                  return r == 0 ? M_OLD : r;
              }
              Integer r = oldRemainder(x);"""
          assert original.count(a)==1
          variant=original.replace(a,b)
          assert variant.replace(b,a)==original
          Path("source/src/variant.cpp").write_text(variant)
          Path("evidence/ab-source.json").write_text(json.dumps({"original_sha256":hashlib.sha256(original.encode()).hexdigest(),"variant_sha256":hashlib.sha256(variant.encode()).hexdigest(),"reversible":True,"only_change":"SAVE positive Mersenne folding with historical and negative fallbacks"},indent=2)+"\n")
          PY
          cat > source/component.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include <chrono>
          #include <iostream>
          #include <random>
          #include <stdexcept>
          #include <vector>
          using namespace pastafari;
          int main(){
            if(M_OLD!=(Integer{1}<<127)-1)return 2;
            std::vector<Integer> v;
            for(int k=0;k<=40;++k)for(int d=-2;d<=2;++d){
              const Integer x=M_OLD*k+d;
              v.push_back(x);v.push_back(-x);
            }
            for(int k=0;k<=2048;++k)if(k%7==0||k%127==0){
              const Integer x=Integer{1}<<k;
              for(int d=-1;d<=1;++d){v.push_back(x+d);v.push_back(-x-d);}
            }
            std::mt19937_64 rng(20261128);
            for(int n=0;n<20000;++n){
              Integer x=0;
              const int limbs=1+static_cast<int>(rng()%33);
              for(int j=0;j<limbs;++j){x<<=64;x+=rng();}
              if(n%2)x=-x;
              v.push_back(x);
            }
            for(int mode=0;mode<3;++mode){
              setAccelerationScarsEnabled(mode!=1);
              setFullHistoricalAccelerationValidation(mode==2);
              for(const auto& x:v){
                Integer expected=x%M_OLD;
                if(expected<0)expected+=M_OLD;
                if(expected==0)expected=M_OLD;
                if(savePatch(x)!=expected){std::cerr<<"MISMATCH "<<mode<<" "<<x<<std::endl;return 1;}
              }
            }
            setAccelerationScarsEnabled(true);
            setFullHistoricalAccelerationValidation(false);
            // Hot arithmetic microbenchmark on positive inputs resembling
            // bowl products, separate from broad calendar execution.
            std::vector<Integer> hot;
            for(int n=0;n<4096;++n){
              Integer a=0,b=0;
              for(int j=0;j<2;++j){a<<=64;a+=rng();b<<=64;b+=rng();}
              hot.push_back((a&M_OLD)*(b&M_OLD)+n);
            }
            Integer checksum=0;
            auto start=std::chrono::steady_clock::now();
            for(int i=0;i<128;++i)for(const auto& x:hot)checksum+=savePatch(x);
            const double seconds=std::chrono::duration<double>(std::chrono::steady_clock::now()-start).count();
            std::cout<<"COMPONENT\t"<<v.size()*3<<"\t"<<hot.size()*128<<"\t"<<seconds<<"\t"<<checksum<<std::endl;
          }
          CPP
          cat > source/driver.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include "pastafari/source_language_catalog.hpp"
          #include <chrono>
          #include <iostream>
          #include <stdexcept>
          using namespace pastafari;
          std::size_t ci(const std::string& n){for(const auto& x:CUTLET_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("cutlet");}
          std::size_t mi(const std::string& n){for(const auto& x:MONTH_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("month");}
          int main(){
            const Integer c{739617};
            resetPersistentScarVaultsDiagnostic();
            setAccelerationScarsEnabled(true);
            setFullHistoricalAccelerationValidation(false);
            const auto start=std::chrono::steady_clock::now();
            const auto a=calendarDateSpaghetti(c,c);
            const double seconds=std::chrono::duration<double>(std::chrono::steady_clock::now()-start).count();
            const auto m=persistentScarMetricsDiagnostic();
            std::cout<<"DATE\t"<<seconds<<"\t"<<a.yearNumber<<"\t"<<ci(a.cutletName)<<"\t"<<a.dayInCutlet<<"\t"<<mi(a.monthName)<<"\t"<<a.dayInMonth<<"\t"<<a.cutletName<<"\t"<<a.monthName<<"\t"<<m.patch28GateCalculated<<std::endl;
          }
          CPP
          for mode in base variant; do
            src=monster
            if [ "$mode" = variant ]; then src=variant; fi
            (ulimit -v 4194304; timeout -k 5s 120s g++ -std=c++17 -O2 -pthread -I source/include -c "source/src/$src.cpp" -o "source/$mode.o") > "evidence/$mode.build.log" 2>&1 || { cat "evidence/$mode.build.log"; exit 1; }
            (ulimit -v 4194304; timeout -k 5s 45s g++ -std=c++17 -O2 -pthread -I source/include "source/$mode.o" source/component.cpp -o "source/$mode.component")
            (ulimit -v 4194304; timeout -k 5s 45s g++ -std=c++17 -O2 -pthread -I source/include "source/$mode.o" source/driver.cpp -o "source/$mode.date")
          done
          sha256sum source/*.o source/*.component source/*.date source/driver.cpp source/component.cpp > evidence/build.sha256
      - name: Compare component equivalence, arithmetic timing and two cold API calls
        run: |
          set -euo pipefail
          for mode in base variant; do
            (ulimit -v 524288; timeout -k 5s 45s "source/$mode.component") > "evidence/$mode.component.stdout" 2> "evidence/$mode.component.stderr"
            cat "evidence/$mode.component.stdout"
          done
          for mode in base variant; do
            set +e
            (ulimit -v 3145728; /usr/bin/time -v -o "evidence/$mode.time.txt" timeout -k 5s 160s "source/$mode.date") > "evidence/$mode.stdout" 2> "evidence/$mode.stderr"
            code=$?
            set -e
            echo "$code" > "evidence/$mode.exit"
            cat "evidence/$mode.stdout" "evidence/$mode.stderr"
          done
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path("evidence");frozen=json.loads((p/"frozen.json").read_text())[0]
          modes={}
          for mode in ("base","variant"):
              a=(p/f"{mode}.component.stdout").read_text().strip().split("\t")
              assert len(a)==5 and a[0]=="COMPONENT"
              component={"checks":int(a[1]),"hot_calls":int(a[2]),"seconds":float(a[3]),"checksum":a[4]}
              d=(p/f"{mode}.stdout").read_text().strip().split("\t")
              code=int((p/f"{mode}.exit").read_text())
              date=None
              if code==0 and len(d)==10 and d[0]=="DATE":
                  date={"seconds":float(d[1]),"fields":list(map(int,d[2:7])),"raw_names":d[7:9],"gate_calculated":int(d[9])}
              m=re.search(r"Maximum resident set size \(kbytes\): (\d+)",(p/f"{mode}.time.txt").read_text())
              modes[mode]={"component":component,"date":date,"exit":code,"peak_rss_kib":int(m.group(1)) if m else None}
          a,b=modes["base"],modes["variant"]
          component_ok=all(a["component"][k]==b["component"][k] for k in ("checks","hot_calls","checksum")) and a["component"]["checks"]>60000
          date_ok=all(x["exit"]==0 and x["date"] and x["date"]["fields"]==frozen["cpp_fields"] and x["date"]["raw_names"]==frozen["cpp_raw_names"] for x in modes.values())
          date_ok=date_ok and a["date"]["gate_calculated"]==b["date"]["gate_calculated"] if date_ok else False
          ok=component_ok and date_ok
          out={"schema":"SOAK_V247_MERSENNE_SAVE_AB/1","source_commit":"408d80e43159eba06849b6a929e0010f32b9b91b","modes":modes,"component_equal":component_ok,"date_equal":bool(date_ok),"comparison_completed":ok,"hot_speedup":a["component"]["seconds"]/b["component"]["seconds"],"cold_speedup":a["date"]["seconds"]/b["date"]["seconds"] if date_ok else None,"variant_diagnostic_only":True,"new_original_f_credit":0,"whole_year_credit":0,"admitted_engines":0,"STOP_NEW_NATIVE_SOAK_DISPATCH":True}
          (p/"result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v247-mersenne-save-ab-${{ github.run_id }}
          path: evidence/
          retention-days: 90
