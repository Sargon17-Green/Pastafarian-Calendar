name: Fortran Discovery 01
on:
  push:
    branches: ['Fortran+English']
permissions:
  contents: read
jobs:
  discovery01-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Fortran
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gfortran
      - name: Compile and verify discovery route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stage02-evidence
          git rev-parse HEAD | tee build/stage02-evidence/checkout.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gfortran --version > build/stage02-evidence/compiler.txt
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          {
            gfortran "${flags[@]}" -c src/big_integer.f90 -o build/big_integer.o
            gfortran "${flags[@]}" -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
            gfortran "${flags[@]}" -c src/discovery01_remainder.f90 -o build/discovery01_remainder.o
            gfortran "${flags[@]}" -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
            gfortran "${flags[@]}" test/stage02_discovery01.f90 build/big_integer.o build/bootstrap_infrastructure.o build/discovery01_remainder.o build/normative_oracle_core.o -o build/stage02_discovery01
          } > build/stage02-evidence/compile.log 2>&1 || { cat build/stage02-evidence/compile.log; exit 1; }
          set +e
          (ulimit -v 1048576; timeout --signal=TERM --kill-after=3s 30s build/stage02_discovery01) > build/stage02-evidence/stdout.log 2> build/stage02-evidence/stderr.log
          rc=$?
          set -e
          printf '%s\n' "$rc" > build/stage02-evidence/exit.txt
          cat build/stage02-evidence/stdout.log
          cat build/stage02-evidence/stderr.log
          test "$rc" -eq 0
          test ! -s build/stage02-evidence/stderr.log
          test "$(grep -c '^CASE=.* EXPECTED_RED ' build/stage02-evidence/stdout.log)" -eq 7
          test "$(grep -c '^CASE=.* MATCH ' build/stage02-evidence/stdout.log)" -eq 14
          grep -Fx 'STAGE02_DISCOVERY01 CASES=21 EXPECTED_RED=7 MATCH=14 ISOLATION=2 METRICS=1' build/stage02-evidence/stdout.log
          grep -Fx STAGE02_DISCOVERY01_GATE_PASS build/stage02-evidence/stdout.log
      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          cd build/stage02-evidence
          sha256sum *.txt *.log > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fortran-stage02-discovery01-${{ github.sha }}
          path: build/stage02-evidence/
