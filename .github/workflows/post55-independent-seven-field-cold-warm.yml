name: Kotlin bounded post55 three fresh JVM seven-field QA
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/audit_production_seven_field_cold_warm.py'
      - 'soak/test_audit_production_seven_field_cold_warm.py'
      - '.github/workflows/post55-independent-seven-field-cold-warm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-cold-jvm-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact branch and production budget
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'maxGateAbsIndex: Int = 8192' src/main/kotlin/pastafari/ProductionYearNavigator.kt
          grep -Fq 'GATE_METRIC' soak/Post55ProductionDateBridge.kt
          echo 'THREE_COLD_JVM_SOURCE_LOCK_GREEN'
      - name: Run synthetic mutation and protocol tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/cold-warm
          python3 -B -m py_compile soak/audit_production_seven_field_cold_warm.py soak/test_audit_production_seven_field_cold_warm.py
          python3 -B -m unittest discover -s soak -p 'test_audit_production_seven_field_cold_warm.py' -v 2>&1 | tee evidence/cold-warm/protocol-tests.log
      - name: Pin Kotlin 1.9.0 compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 'https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip' -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile actual production and bridge
        shell: bash
        run: |
          set -euo pipefail
          kotlinc src/main/kotlin/pastafari/*.kt soak/Post55ProductionDateBridge.kt -include-runtime -d "$RUNNER_TEMP/seven-field-cold-warm.jar"
          test -s "$RUNNER_TEMP/seven-field-cold-warm.jar"
          echo 'COLD_WARM_REAL_PRODUCTION_COMPILED'
      - name: Three fresh Python and JVM lifecycles, bounded independent oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -B soak/audit_production_seven_field_cold_warm.py --jar "$RUNNER_TEMP/seven-field-cold-warm.jar" --output-dir evidence/cold-warm 2>&1 | tee evidence/cold-warm-run.log
      - name: Preserve pass and fail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-cymraeg-three-fresh-jvm-seven-field
          path: |
            evidence/cold-warm/**
            evidence/cold-warm-run.log
          if-no-files-found: warn
          retention-days: 30
