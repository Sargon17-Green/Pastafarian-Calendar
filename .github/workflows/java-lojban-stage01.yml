name: Java Lojban Stage 01

on:
  push:
    branches:
      - 'Java+Lojban'
  pull_request:
    branches:
      - 'Java+Lojban'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Stage 01 normative tests
        run: sh run_stage01_tests.sh
