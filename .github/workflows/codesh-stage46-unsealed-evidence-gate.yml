              assert hashlib.sha256(patch51).hexdigest() == receipt51['source']['sha256']
              assert git_blob(patch51) == receipt51['source']['git_blob_sha1']
              assert patch51.count('ל־קח־יום־אחרון'.encode('utf-8')) == 2
              assert patch51.count('ל־גרע'.encode('utf-8')) == 0
              assert not verified51({**receipt51, 'stage51_sealed': False}, stage)
              assert not verified51({**receipt51, 'checks': {**receipt51['checks'], 'native_processes': 25}}, stage)
