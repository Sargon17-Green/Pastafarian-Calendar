              assert receipt51['source']['git_blob_sha1'] == stage['STAGE51_PATCH_SOURCE_GIT_BLOB_SHA1']
              assert receipt51['native_jar_sha256'] == stage['STAGE51_NATIVE_JAR_SHA256']
              assert receipt51['frozen_oracle_sha256'] == stage['STAGE51_FROZEN_ORACLE_SHA256']
              assert receipt51['handoff']['sha256'] == stage['STAGE51_WINDOWS_PASS_HANDOFF_SHA256']
              assert receipt51['source']['path'] not in expected_sources
