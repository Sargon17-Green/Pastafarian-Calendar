name: Codesh Stage46 Signed Evidence Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # The signed Stage45 parent must be independently accessible
      - name: Freeze Stage45 sources and validate signed Stage46 receipt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import subprocess

          pins = json.loads(Path('qa/Stage46_Signed_Source_Blob_Lock.json').read_text(encoding='utf-8'))
          preflight = json.loads(Path('qa/Stage46_Recovery_Preflight_UNSEALED.json').read_text(encoding='utf-8'))
          receipt = json.loads(Path('qa/Stage46_Native_Evidence_Receipt.json').read_text(encoding='utf-8'))
          stage = {}
          for line in Path('DEVELOPMENT_STAGE.md').read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  key, val = line.split('=', 1)
                  assert key not in stage, f'Duplicate stage field: {key}'
                  stage[key] = val.strip()

          def git_blob(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest()

          def sealed(rcpt, fields):
              return (
                  rcpt.get('schema_version') == 'codesh-stage46-native-evidence-receipt/1'
                  and rcpt.get('stage') == 46
                  and rcpt.get('last_completed_stage') == 46
                  and rcpt.get('status') == 'EXPECTED_RED_CONFIRMED'
                  and rcpt.get('stage46_sealed') is True
                  and rcpt.get('stage47_started') is False
                  and rcpt.get('native_results_claimed') is True
                  and rcpt.get('signed_baseline_source_count') == 40
                  and rcpt.get('source_count_compiled') == 41
                  and rcpt.get('gate_count') == 21
                  and rcpt.get('regressions_stage29_to_stage45') == 17
                  and rcpt.get('expected_old_next_gate_as_closing_mismatches') == 48
                  and rcpt.get('archive_sha256_entries_verified') == 57
                  and rcpt.get('provenance', {}).get('recovery_without_reexecution') is True
                  and rcpt.get('provenance', {}).get('native_processes_reexecuted') == 0
                  and fields.get('CURRENT_STAGE') == '46'
                  and fields.get('CURRENT_KIND') == 'DISCOVERY'
                  and fields.get('CURRENT_DISCOVERY') == '23'
                  and fields.get('LAST_COMPLETED_STAGE') == '46'
                  and fields.get('EXPECTED_REPOSITORY_STATE') == 'EXPECTED_RED'
                  and fields.get('STAGE46_STARTED') == 'YES'
                  and fields.get('STAGE47_STARTED') == 'NO'
              )

          stage51_completed = stage.get('CURRENT_STAGE') == '51'
          stage50_completed = stage.get('CURRENT_STAGE') in ('50', '51')
          if stage51_completed:
              assert stage['CURRENT_KIND'] == 'PATCH'
              assert stage['CURRENT_DISCOVERY'] == '25'
              assert stage['CURRENT_PATCH'] == '25'
              assert stage['LAST_COMPLETED_STAGE'] == '51'
              assert stage['EXPECTED_REPOSITORY_STATE'] == 'GREEN'
              assert stage['STAGE51_STARTED'] == 'YES'
              assert stage['STAGE52_STARTED'] == 'NO'
              assert stage['STAGE51_EVIDENCE_RECEIPT'] == 'qa/Stage51_Native_Evidence_Receipt.json'
          previous50 = ({**stage, 'CURRENT_STAGE': '50', 'CURRENT_KIND': 'DISCOVERY',
              'CURRENT_DISCOVERY': '25', 'CURRENT_PATCH': '24',
              'LAST_COMPLETED_STAGE': '50', 'EXPECTED_REPOSITORY_STATE': 'EXPECTED_RED',
              'STAGE51_STARTED': 'NO'} if stage51_completed else stage)
          stage49_completed = stage.get('CURRENT_STAGE') in ('49', '50', '51')
          stage48_completed = stage.get('CURRENT_STAGE') in ('48', '49', '50', '51')
          stage47_completed = stage.get('CURRENT_STAGE') in ('47', '48', '49', '50', '51')
          if stage50_completed:
              assert previous50['CURRENT_KIND'] == 'DISCOVERY'
              assert previous50['CURRENT_DISCOVERY'] == '25'
              assert previous50['CURRENT_PATCH'] == '24'
              assert previous50['LAST_COMPLETED_STAGE'] == '50'
              assert previous50['EXPECTED_REPOSITORY_STATE'] == 'EXPECTED_RED'
              assert previous50['STAGE50_STARTED'] == 'YES'
              assert previous50['STAGE51_STARTED'] == 'NO'
              assert previous50['STAGE50_EVIDENCE_RECEIPT'] == 'qa/Stage50_Native_Evidence_Receipt.json'
          previous49 = ({**previous50, 'CURRENT_STAGE': '49', 'CURRENT_KIND': 'PATCH',
              'CURRENT_DISCOVERY': '24', 'CURRENT_PATCH': '24',
              'LAST_COMPLETED_STAGE': '49', 'EXPECTED_REPOSITORY_STATE': 'GREEN',
              'STAGE50_STARTED': 'NO'} if stage50_completed else stage)
          if stage49_completed:
              assert previous49['CURRENT_KIND'] == 'PATCH'
              assert previous49['CURRENT_DISCOVERY'] == '24'
              assert previous49['CURRENT_PATCH'] == '24'
              assert previous49['LAST_COMPLETED_STAGE'] == '49'
              assert previous49['EXPECTED_REPOSITORY_STATE'] == 'GREEN'
              assert previous49['STAGE49_STARTED'] == 'YES'
              assert previous49['STAGE50_STARTED'] == 'NO'
              assert previous49['STAGE49_EVIDENCE_RECEIPT'] == 'qa/Stage49_Native_Evidence_Receipt.json'
          previous48 = ({**previous49, 'CURRENT_STAGE': '48', 'CURRENT_KIND': 'DISCOVERY',
              'CURRENT_DISCOVERY': '24', 'CURRENT_PATCH': '23',
              'LAST_COMPLETED_STAGE': '48', 'EXPECTED_REPOSITORY_STATE': 'EXPECTED_RED',
              'STAGE49_STARTED': 'NO'} if stage49_completed else stage)
          if stage48_completed:
              assert previous48['CURRENT_KIND'] == 'DISCOVERY'
              assert previous48['CURRENT_DISCOVERY'] == '24'
              assert previous48['CURRENT_PATCH'] == '23'
              assert previous48['LAST_COMPLETED_STAGE'] == '48'
              assert previous48['EXPECTED_REPOSITORY_STATE'] == 'EXPECTED_RED'
              assert previous48['STAGE48_STARTED'] == 'YES'
              assert previous48['STAGE49_STARTED'] == 'NO'
              assert previous48['STAGE48_EVIDENCE_RECEIPT'] == 'qa/Stage48_Native_Evidence_Receipt.json'
          previous47 = ({**previous48, 'CURRENT_STAGE': '47', 'CURRENT_KIND': 'PATCH', 'CURRENT_DISCOVERY': '23',
              'LAST_COMPLETED_STAGE': '47', 'EXPECTED_REPOSITORY_STATE': 'GREEN',
              'STAGE48_STARTED': 'NO'} if stage48_completed else stage)
          if stage47_completed:
              assert previous47['CURRENT_KIND'] == 'PATCH'
              assert previous47['CURRENT_DISCOVERY'] == '23'
              assert previous47['CURRENT_PATCH'] == '23'
              assert previous47['LAST_COMPLETED_STAGE'] == '47'
              assert previous47['EXPECTED_REPOSITORY_STATE'] == 'GREEN'
              assert previous47['STAGE47_STARTED'] == 'YES'
              assert previous47['STAGE48_STARTED'] == 'NO'
              assert previous47['STAGE47_EVIDENCE_RECEIPT'] == 'qa/Stage47_Native_Evidence_Receipt.json'
          historic_stage = ({**stage, 'CURRENT_STAGE': '46', 'CURRENT_KIND': 'DISCOVERY', 'CURRENT_DISCOVERY': '23',
              'LAST_COMPLETED_STAGE': '46', 'EXPECTED_REPOSITORY_STATE': 'EXPECTED_RED',
              'STAGE47_STARTED': 'NO'} if stage47_completed else stage)

          assert pins['pinned_head'] == 'f35a6efd79b830810c8a33140ce8eb949b2c8671'
          assert pins['mode'] == 'FAIL_CLOSED_WHILE_STAGE46_UNSEALED', 'Historic lock must remain unaltered'
          assert preflight['original_v001']['pinned_head'] == pins['pinned_head']
          assert preflight['native_evidence_status'] == 'BLOCKED_ORIGINAL_WINDOWS_OUTPUTS_NOT_ACCESSIBLE'
          assert preflight['stage46_sealed'] is False, 'Preserve historical preflight truth'
          assert preflight['recovery_v002']['qa_fixture'] == 'SYNTHETIC_NOT_NATIVE'
          assert sealed(receipt, historic_stage), 'Stage46 historical evidence must stay sealed'
          assert receipt['provenance']['pinned_signed_stage45_head'] == pins['pinned_head']
          assert receipt['provenance']['original_manifest_sha256'] == preflight['original_v001']['manifest_sha256']
          assert receipt['provenance']['original_native_run_id'] == preflight['original_native_run_id']
          assert receipt['new_old_source']['sha256'] == preflight['original_v001']['isolated_candidate_sha256']
          assert receipt['frozen_oracle_sha256'] == preflight['original_v001']['frozen_oracle_sha256']
          assert receipt['provenance']['recovered_handoff_sha256'] == stage['STAGE46_WINDOWS_PASS_HANDOFF_SHA256']
          assert receipt['native_jar_sha256'] == stage['STAGE46_NATIVE_JAR_SHA256']
          assert receipt['new_old_source']['git_blob_sha1'] == stage['STAGE46_OLD_SOURCE_GIT_BLOB_SHA1']
          assert stage['STAGE46_OLD_SOURCE_SHA256'] == receipt['new_old_source']['sha256']

          # Reject modified signed sources, even if the editable lock is modified too.
          tree = subprocess.check_output([
              'git', 'ls-tree', '-r', '-z', pins['pinned_head'], '--', 'מקור/'
          ])
          baseline = {}
          for item in tree.split(b'\0'):
              if not item:
                  continue
              meta, filename = item.split(b'\t', 1)
              mode, objtype, oid = meta.split(b' ')
              assert mode == b'100644' and objtype == b'blob'
              baseline[filename.decode('utf-8')] = oid.decode('ascii')
          assert len(baseline) == 40
          assert baseline == pins['git_blobs'], 'Baseline lock does not match immutable parent'
          candidate_path = receipt['new_old_source']['path']
          expected_sources = set(baseline) | {candidate_path}
          if stage47_completed:
              stage47_receipt = json.loads(Path('qa/Stage47_Native_Evidence_Receipt.json').read_text(encoding='utf-8'))
              assert stage47_receipt['schema_version'] == 'codesh-stage47-native-evidence-receipt/1'
              assert stage47_receipt['stage'] == 47
              assert stage47_receipt['last_completed_stage'] == 47
              assert stage47_receipt['status'] == 'GREEN_CONFIRMED'
              assert stage47_receipt['stage47_sealed'] is True
              assert stage47_receipt['stage48_started'] is False
              assert stage47_receipt['stage46_signed_source_count'] == 41
              assert stage47_receipt['native_compiled_source_count'] == 42
              assert stage47_receipt['baseline_stage46_head'] == '63f91958028ae49b11e59ed63705b0ec552302c3'
              assert stage47_receipt['native_run']['run_id'] == '20261023T105519Z_fc06fe6a'
              assert stage47_receipt['native_run']['package'] == 'v002'
              assert stage47_receipt['source']['path'] == 'מקור/מסלול־שער־סוגר־שנה־סמוכה־מתוקן.אמן'
              assert stage47_receipt['source']['sha256'] == stage['STAGE47_PATCH_SOURCE_SHA256']
              assert stage47_receipt['source']['git_blob_sha1'] == stage['STAGE47_PATCH_SOURCE_GIT_BLOB_SHA1']
              assert stage47_receipt['native_jar_sha256'] == stage['STAGE47_NATIVE_JAR_SHA256']
              assert stage47_receipt['frozen_oracle_sha256'] == stage['STAGE47_FROZEN_ORACLE_SHA256']
              assert stage47_receipt['handoff']['sha256'] == stage['STAGE47_WINDOWS_PASS_HANDOFF_SHA256']
              assert stage47_receipt['handoff']['sha256_entries_verified'] == 61
              assert stage47_receipt['checks']['native_processes'] == 22
              assert stage47_receipt['checks']['expected_exit_zero'] == 21
              assert stage47_receipt['checks']['expected_oracle_tamper_exit_one'] == 1
              assert stage47_receipt['checks']['regressions_stage29_to_stage46'] == 18
              assert stage47_receipt['checks']['patch_closing_gate_matches'] == 48
              assert stage47_receipt['checks']['old_stage46_mismatches_preserved'] == 48
              assert stage47_receipt['checks']['next_cases'] == 24
              assert stage47_receipt['checks']['previous_cases'] == 24
              assert stage47_receipt['stage46_signed_handoff_sha256'] == stage['STAGE46_WINDOWS_PASS_HANDOFF_SHA256']
              assert stage47_receipt['source']['path'] not in expected_sources
              expected_sources.add(stage47_receipt['source']['path'])
              patch47 = Path(stage47_receipt['source']['path']).read_bytes()
              assert hashlib.sha256(patch47).hexdigest() == stage47_receipt['source']['sha256']
              assert git_blob(patch47) == stage47_receipt['source']['git_blob_sha1']
              assert patch47.count('ל־קח־שער־סוגר'.encode('utf-8')) == 2
              assert patch47.count('ויתקדם שער־ישן:'.encode('utf-8')) == 0
          if stage48_completed:
              receipt48 = json.loads(Path('qa/Stage48_Native_Evidence_Receipt.json').read_text(encoding='utf-8'))
              def verified48(rcpt, fields):
                  return (
                      rcpt.get('schema_version') == 'codesh-stage48-native-evidence-receipt/1'
                      and rcpt.get('stage') == 48
                      and rcpt.get('last_completed_stage') == 48
                      and rcpt.get('status') == 'EXPECTED_RED_CONFIRMED'
                      and rcpt.get('stage48_sealed') is True
                      and rcpt.get('stage49_started') is False
                      and rcpt.get('baseline_signed_source_count') == 42
                      and rcpt.get('native_compiled_source_count') == 43
                      and rcpt.get('native_run', {}).get('run_id') == '20261023T150350Z_b6c5ba90'
                      and rcpt.get('native_run', {}).get('package') == 'v001'
                      and rcpt.get('checks', {}).get('native_processes') == 23
                      and rcpt.get('checks', {}).get('expected_exit_zero') == 22
                      and rcpt.get('checks', {}).get('expected_oracle_tamper_exit_one') == 1
                      and rcpt.get('checks', {}).get('regressions_stage29_to_stage47') == 19
                      and rcpt.get('checks', {}).get('old_second_day_as_first_mismatches') == 48
                      and rcpt.get('checks', {}).get('next_cases') == 24
                      and rcpt.get('checks', {}).get('previous_cases') == 24
                      and rcpt.get('handoff', {}).get('sha256_entries_verified') == 63
                      and fields.get('LAST_COMPLETED_STAGE') == '48'
                      and fields.get('STAGE49_STARTED') == 'NO'
                  )
              assert verified48(receipt48, previous48), 'Stage48 historical receipt or development state not verified'
              assert receipt48['signed_stage47_head'] == '11de380cbdcee6e5d7d97425918dec1e30fafed6'
              assert receipt48['stage47_signed_handoff_sha256'] == stage['STAGE47_WINDOWS_PASS_HANDOFF_SHA256']
              assert receipt48['source']['path'] == 'מקור/מסלול־יום־ראשון־שנה־סמוכה־ישן.אמן'
              assert receipt48['source']['sha256'] == stage['STAGE48_OLD_SOURCE_SHA256']
              assert receipt48['source']['git_blob_sha1'] == stage['STAGE48_OLD_SOURCE_GIT_BLOB_SHA1']
              assert receipt48['native_jar_sha256'] == stage['STAGE48_NATIVE_JAR_SHA256']
              assert receipt48['frozen_oracle_sha256'] == stage['STAGE48_FROZEN_ORACLE_SHA256']
              assert receipt48['handoff']['sha256'] == stage['STAGE48_WINDOWS_PASS_HANDOFF_SHA256']
              assert receipt48['source']['path'] not in expected_sources
              expected_sources.add(receipt48['source']['path'])
              newsource = Path(receipt48['source']['path']).read_bytes()
              assert hashlib.sha256(newsource).hexdigest() == receipt48['source']['sha256']
              assert git_blob(newsource) == receipt48['source']['git_blob_sha1']
              assert newsource.count('ל־קח־יום־ראשון'.encode('utf-8')) == 2
              assert newsource.count('ל־חבר'.encode('utf-8')) == 2
              assert not verified48({**receipt48, 'stage48_sealed': False}, previous48)
              assert not verified48({**receipt48, 'checks': {**receipt48['checks'], 'native_processes': 22}}, previous48)
              assert not verified48({**receipt48, 'checks': {**receipt48['checks'], 'regressions_stage29_to_stage47': 18}}, previous48)
              assert not verified48(receipt48, {**previous48, 'LAST_COMPLETED_STAGE': '47'})
          if stage49_completed:
              receipt49 = json.loads(Path('qa/Stage49_Native_Evidence_Receipt.json').read_text(encoding='utf-8'))
              def verified49(rcpt, fields):
                  return (
                      rcpt.get('schema_version') == 'codesh-stage49-native-evidence-receipt/1'
                      and rcpt.get('stage') == 49
                      and rcpt.get('last_completed_stage') == 49
                      and rcpt.get('status') == 'GREEN_CONFIRMED'
                      and rcpt.get('stage49_sealed') is True
                      and rcpt.get('stage50_started') is False
                      and rcpt.get('baseline_signed_source_count') == 43
                      and rcpt.get('native_compiled_source_count') == 44
                      and rcpt.get('native_run', {}).get('run_id') == '20261024T203758Z_4d251bee'
                      and rcpt.get('native_run', {}).get('package') == 'v001'
                      and rcpt.get('checks', {}).get('native_processes') == 24
                      and rcpt.get('checks', {}).get('expected_exit_zero') == 23
                      and rcpt.get('checks', {}).get('expected_oracle_tamper_exit_one') == 1
                      and rcpt.get('checks', {}).get('regressions_stage29_to_stage48') == 20
                      and rcpt.get('checks', {}).get('patch_first_day_matches') == 48
                      and rcpt.get('checks', {}).get('old_second_day_as_first_mismatches') == 48
                      and rcpt.get('checks', {}).get('next_cases') == 24
                      and rcpt.get('checks', {}).get('previous_cases') == 24
                      and rcpt.get('handoff', {}).get('sha256_entries_verified') == 65
                      and fields.get('CURRENT_STAGE') == '49'
                      and fields.get('LAST_COMPLETED_STAGE') == '49'
                      and fields.get('STAGE50_STARTED') == 'NO'
                  )
              assert verified49(receipt49, previous49), 'Stage49 historical receipt or state not verified'
              assert receipt49['signed_stage48_head'] == '81fbb3121e43362e3acce4980d2bf100cb0aa3c8'
              assert receipt49['stage48_signed_handoff_sha256'] == stage['STAGE48_WINDOWS_PASS_HANDOFF_SHA256']
              assert receipt49['source']['path'] == 'מקור/מסלול־יום־ראשון־שנה־סמוכה־מתוקן.אמן'
              assert receipt49['source']['sha256'] == stage['STAGE49_PATCH_SOURCE_SHA256']
              assert receipt49['source']['git_blob_sha1'] == stage['STAGE49_PATCH_SOURCE_GIT_BLOB_SHA1']
              assert receipt49['native_jar_sha256'] == stage['STAGE49_NATIVE_JAR_SHA256']
              assert receipt49['frozen_oracle_sha256'] == stage['STAGE49_FROZEN_ORACLE_SHA256']
              assert receipt49['handoff']['sha256'] == stage['STAGE49_WINDOWS_PASS_HANDOFF_SHA256']
              assert receipt49['source']['path'] not in expected_sources
              expected_sources.add(receipt49['source']['path'])
              patch49 = Path(receipt49['source']['path']).read_bytes()
              assert hashlib.sha256(patch49).hexdigest() == receipt49['source']['sha256']
              assert git_blob(patch49) == receipt49['source']['git_blob_sha1']
              assert patch49.count('ל־קח־יום־ראשון'.encode('utf-8')) == 2
              assert patch49.count('ל־חבר'.encode('utf-8')) == 0
              assert not verified49({**receipt49, 'stage49_sealed': False}, previous49)
              assert not verified49({**receipt49, 'checks': {**receipt49['checks'], 'native_processes': 23}}, previous49)
              assert not verified49({**receipt49, 'checks': {**receipt49['checks'], 'regressions_stage29_to_stage48': 19}}, previous49)
              assert not verified49(receipt49, {**previous49, 'LAST_COMPLETED_STAGE': '48'})
          if stage50_completed:
              receipt50 = json.loads(Path('qa/Stage50_Native_Evidence_Receipt.json').read_text(encoding='utf-8'))
              def verified50(rcpt, fields):
                  return (
                      rcpt.get('schema_version') == 'codesh-stage50-native-evidence-receipt/1'
                      and rcpt.get('stage') == 50
                      and rcpt.get('last_completed_stage') == 50
                      and rcpt.get('status') == 'EXPECTED_RED_CONFIRMED'
                      and rcpt.get('stage50_sealed') is True
                      and rcpt.get('stage51_started') is False
                      and rcpt.get('baseline_signed_source_count') == 44
                      and rcpt.get('native_compiled_source_count') == 45
                      and rcpt.get('native_run', {}).get('run_id') == '20261028T171934Z_9bcccda9'
                      and rcpt.get('native_run', {}).get('package') == 'v001'
                      and rcpt.get('checks', {}).get('native_processes') == 25
                      and rcpt.get('checks', {}).get('expected_exit_zero') == 24
                      and rcpt.get('checks', {}).get('expected_oracle_tamper_exit_one') == 1
                      and rcpt.get('checks', {}).get('regressions_stage29_to_stage49') == 21
                      and rcpt.get('checks', {}).get('old_penultimate_as_last_mismatches') == 48
                      and rcpt.get('checks', {}).get('next_cases') == 24
                      and rcpt.get('checks', {}).get('previous_cases') == 24
                      and rcpt.get('handoff', {}).get('sha256_entries_verified') == 67
                      and fields.get('CURRENT_STAGE') == '50'
                      and fields.get('LAST_COMPLETED_STAGE') == '50'
                      and fields.get('STAGE51_STARTED') == 'NO'
                  )
              assert verified50(receipt50, previous50), 'Stage50 native receipt or state not verified'
              assert receipt50['signed_stage49_head'] == '57b4ba1aaf8be27090956cd156e9d38cbcafd3ed'
              assert receipt50['stage49_signed_handoff_sha256'] == stage['STAGE49_WINDOWS_PASS_HANDOFF_SHA256']
              assert receipt50['source']['path'] == 'מקור/מסלול־יום־אחרון־שנה־סמוכה־ישן.אמן'
              assert receipt50['source']['sha256'] == stage['STAGE50_OLD_SOURCE_SHA256']
              assert receipt50['source']['git_blob_sha1'] == stage['STAGE50_OLD_SOURCE_GIT_BLOB_SHA1']
              assert receipt50['native_jar_sha256'] == stage['STAGE50_NATIVE_JAR_SHA256']
              assert receipt50['frozen_oracle_sha256'] == stage['STAGE50_FROZEN_ORACLE_SHA256']
              assert receipt50['handoff']['sha256'] == stage['STAGE50_WINDOWS_PASS_HANDOFF_SHA256']
              assert receipt50['source']['path'] not in expected_sources
              expected_sources.add(receipt50['source']['path'])
              candidate50 = Path(receipt50['source']['path']).read_bytes()
              assert hashlib.sha256(candidate50).hexdigest() == receipt50['source']['sha256']
              assert git_blob(candidate50) == receipt50['source']['git_blob_sha1']
              assert candidate50.count('ל־קח־יום־אחרון'.encode('utf-8')) == 2
              assert candidate50.count('ל־גרע'.encode('utf-8')) == 2
              assert not verified50({**receipt50, 'stage50_sealed': False}, previous50)
              assert not verified50({**receipt50, 'checks': {**receipt50['checks'], 'native_processes': 24}}, previous50)
              assert not verified50({**receipt50, 'checks': {**receipt50['checks'], 'regressions_stage29_to_stage49': 20}}, previous50)
              assert not verified50(receipt50, {**previous50, 'LAST_COMPLETED_STAGE': '49'})
          if stage51_completed:
              receipt51 = json.loads(Path('qa/Stage51_Native_Evidence_Receipt.json').read_text(encoding='utf-8'))
              def verified51(rcpt, fields):
                  return (
                      rcpt.get('schema_version') == 'codesh-stage51-native-evidence-receipt/1'
                      and rcpt.get('stage') == 51
                      and rcpt.get('last_completed_stage') == 51
                      and rcpt.get('status') == 'GREEN_CONFIRMED'
                      and rcpt.get('stage51_sealed') is True
                      and rcpt.get('stage52_started') is False
                      and rcpt.get('baseline_signed_source_count') == 45
                      and rcpt.get('native_compiled_source_count') == 46
                      and rcpt.get('native_run', {}).get('run_id') == '20261029T213751Z_1d1eb3ed'
                      and rcpt.get('native_run', {}).get('package') == 'v001'
                      and rcpt.get('checks', {}).get('native_processes') == 26
                      and rcpt.get('checks', {}).get('expected_exit_zero') == 25
                      and rcpt.get('checks', {}).get('expected_oracle_tamper_exit_one') == 1
                      and rcpt.get('checks', {}).get('regressions_stage29_to_stage50') == 22
                      and rcpt.get('checks', {}).get('patch_last_day_matches') == 48
                      and rcpt.get('checks', {}).get('old_penultimate_as_last_mismatches') == 48
                      and rcpt.get('checks', {}).get('next_cases') == 24
                      and rcpt.get('checks', {}).get('previous_cases') == 24
                      and rcpt.get('handoff', {}).get('sha256_entries_verified') == 69
                      and fields.get('CURRENT_STAGE') == '51'
                      and fields.get('LAST_COMPLETED_STAGE') == '51'
                      and fields.get('STAGE52_STARTED') == 'NO'
                  )
              assert verified51(receipt51, stage), 'Stage51 native receipt or state not verified'
              assert receipt51['signed_stage50_head'] == '1d7cc6eaf073e5168165d2da72aec83ff6d6bcd0'
              assert receipt51['stage50_signed_handoff_sha256'] == stage['STAGE50_WINDOWS_PASS_HANDOFF_SHA256']
              assert receipt51['source']['path'] == 'מקור/מסלול־יום־אחרון־שנה־סמוכה־מתוקן.אמן'
