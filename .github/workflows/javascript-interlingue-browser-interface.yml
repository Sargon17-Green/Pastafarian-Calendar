name: JavaScript + Interlingue — interfacie de navigator

on:
  push:
    branches:
      - 'JavaScript\+Interlingue'
    paths:
      - "browser/**"
      - "scripts/build-browser.js"
      - "tests/browser-*.js"
      - "src/**"
      - ".github/workflows/javascript-interlingue-browser-interface.yml"
  pull_request:
    branches:
      - 'JavaScript+Interlingue'
    paths:
      - "browser/**"
      - "scripts/build-browser.js"
      - "tests/browser-*.js"
      - ".github/workflows/javascript-interlingue-browser-interface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-interface:
    name: Provar li additional browser-strate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obtener li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Provar compatibilitá con Stage 01
        shell: bash
        run: |
          set -o pipefail
          node tests/verify-stage-01.js 2>&1 | tee -a browser-interface-ci.log

      - name: Provar li browser-contract, lingues e cassa-nigri limite
        shell: bash
        run: |
          set -o pipefail
          node tests/browser-interface-all.js 2>&1 | tee -a browser-interface-ci.log

      - name: Constructer Standard e Standalone artefacts
        shell: bash
        run: |
          set -o pipefail
          node scripts/build-browser.js 2>&1 | tee -a browser-interface-ci.log

      - name: Provar li constructet artefacts
        shell: bash
        run: |
          set -o pipefail
          node tests/browser-built-artifacts.js 2>&1 | tee -a browser-interface-ci.log

      - name: Conservar li browser artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-browser-interface
          if-no-files-found: error
          retention-days: 14
          path: |
            browser-interface-ci.log
            browser/dist/
            browser/standalone/pastafari-date.js
            browser/standalone/pastafari-date.min.js
            browser/standalone/example-file.html


  phase-a-visual-qa:
    name: Phase A — visual assertions
    needs: browser-interface
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Obtener li browser artefact
        uses: actions/download-artifact@v4
        with:
          name: javascript-interlingue-browser-interface
          path: qa-artifact

      - name: Preparar Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-a-qa"
          cd "$RUNNER_TEMP/phase-a-qa"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Provar visualmen li Phase A
        shell: bash
        run: |
          set -euo pipefail
          cd qa-artifact/browser/dist
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/phase-a-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          cd "$RUNNER_TEMP/phase-a-qa"
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out, { recursive: true });
          const base = 'http://127.0.0.1:4173/';

          const profiles = [
            {name:'desktop1440', width:1440, height:1000, mobile:false},
            {name:'tablet1024', width:1024, height:1366, mobile:false},
            {name:'tablet800', width:800, height:1280, mobile:false},
            {name:'tablet768', width:768, height:1024, mobile:false},
            {name:'mobile390', width:390, height:844, mobile:true},
            {name:'mobile320', width:320, height:740, mobile:true},
          ];

          async function waitReady(page) {
            await page.waitForFunction(() => {
              const host = document.querySelector('pastafari-date');
              const cal = host?.shadowRoot?.querySelector('.calendar');
              return !!cal && !cal.hasAttribute('data-state');
            }, null, {timeout:180000});
            await page.waitForTimeout(1000);
          }

          function assert(cond, msg) {
            if (!cond) throw new Error(msg);
          }

          async function info(page) {
            return page.evaluate(() => {
              const host = document.querySelector('pastafari-date');
              const s = host.shadowRoot;
              const viewport = s.querySelector('.viewport');
              const current = s.querySelector('.day[aria-current="date"]');
              const heading = s.querySelector('.cutlet-heading');
              const vr = viewport.getBoundingClientRect();
              const cr = current?.getBoundingClientRect();
              return {
                bodyClientWidth: document.documentElement.clientWidth,
                bodyScrollWidth: document.documentElement.scrollWidth,
                viewportClientWidth: viewport.clientWidth,
                viewportScrollWidth: viewport.scrollWidth,
                viewportRect:{left:vr.left,right:vr.right,top:vr.top,bottom:vr.bottom},
                current:cr?{left:cr.left,right:cr.right,top:cr.top,bottom:cr.bottom}:null,
                headingPosition:heading?getComputedStyle(heading).position:null,
              };
            });
          }

          async function checkLayout(browser,p) {
            const ctx=await browser.newContext({
              viewport:{width:p.width,height:p.height}, locale:'he-IL',
              isMobile:p.mobile, hasTouch:p.mobile, deviceScaleFactor:1
            });
            const page=await ctx.newPage();
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await waitReady(page);
            const d=await info(page);
            assert(d.bodyScrollWidth<=d.bodyClientWidth+1,p.name+': body horizontal overflow');
            assert(d.viewportScrollWidth<=d.viewportClientWidth+1,p.name+': calendar horizontal overflow');
            assert(d.headingPosition==='static',p.name+': cutlet heading is not static');
            if(d.current){
              assert(d.current.left>=d.viewportRect.left-1,p.name+': current card clipped at inline start');
              assert(d.current.right<=d.viewportRect.right+1,p.name+': current card clipped at inline end');
            }
            fs.writeFileSync(path.join(out,p.name+'__info.json'),JSON.stringify(d,null,2));
            await page.screenshot({path:path.join(out,p.name+'__ready.png'),fullPage:true});
            await page.locator('.viewport').screenshot({path:path.join(out,p.name+'__calendar.png')});
            await ctx.close();
          }

          async function checkBidi(browser,code,locale) {
            const ctx=await browser.newContext({viewport:{width:390,height:844},locale});
            const page=await ctx.newPage();
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await waitReady(page);
            await page.locator('.language-selector').selectOption(code);
            await page.waitForTimeout(300);
            const d=await page.evaluate(()=>{
              const s=document.querySelector('pastafari-date').shadowRoot;
              const context=s.querySelector('.beacon-context');
              return {
                dir:document.querySelector('pastafari-date').getAttribute('dir'),
                text:context.innerText,
                iso:[...context.querySelectorAll('bdi.iso-date')].map(n=>({
                  text:n.textContent,
                  dir:n.getAttribute('dir'),
                  whiteSpace:getComputedStyle(n).whiteSpace
                }))
              };
            });
            assert(d.iso.length===2,code+': expected two isolated ISO dates');
            for(const x of d.iso){
              assert(/^\\d{4}-\\d{2}-\\d{2}$/.test(x.text),code+': malformed ISO '+x.text);
              assert(x.dir==='ltr',code+': ISO not LTR isolated');
              assert(x.whiteSpace==='nowrap',code+': ISO may wrap internally');
            }
            fs.writeFileSync(path.join(out,'bidi_'+code+'.json'),JSON.stringify(d,null,2));
            await page.screenshot({path:path.join(out,'bidi_'+code+'.png'),fullPage:true});
            await ctx.close();
          }

          async function checkError(browser,p) {
            const ctx=await browser.newContext({
              viewport:{width:p.width,height:p.height},locale:'he-IL',
              isMobile:p.mobile,hasTouch:p.mobile,deviceScaleFactor:1
            });
            const page=await ctx.newPage();
            await page.route('**/pastafari-worker.js*',r=>r.abort());
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>{
              const s=document.querySelector('pastafari-date')?.shadowRoot;
              return s?.querySelector('.calendar')?.getAttribute('data-state')==='error';
            },null,{timeout:90000});
            const d=await page.evaluate(()=>{
              const s=document.querySelector('pastafari-date').shadowRoot;
              const box=s.querySelector('.overlay.error');
              const title=s.querySelector('.error-title');
              const msg=s.querySelector('.error-message');
              const button=s.querySelector('.retry-button');
              const r=n=>{const x=n.getBoundingClientRect();return {top:x.top,bottom:x.bottom,left:x.left,right:x.right};};
              return {box:r(box),title:r(title),message:r(msg),button:r(button)};
            });
            assert(d.title.top<=d.message.top,p.name+': error title after message');
            assert(d.message.top<=d.button.top,p.name+': retry before error message');
            assert(d.button.left>=d.box.left-1 && d.button.right<=d.box.right+1,p.name+': retry outside error block');
            fs.writeFileSync(path.join(out,p.name+'__error_info.json'),JSON.stringify(d,null,2));
            await page.screenshot({path:path.join(out,p.name+'__error.png'),fullPage:true});
            await ctx.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles) await checkLayout(browser,p);
            await checkBidi(browser,'he','he-IL');
            await checkBidi(browser,'ar','ar');
            await checkError(browser,profiles[0]);
            await checkError(browser,profiles[4]);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.js

      - name: Conservar li Phase A visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-visual-qa
          path: ${{ runner.temp }}/phase-a-qa/out
          if-no-files-found: warn
          retention-days: 14
