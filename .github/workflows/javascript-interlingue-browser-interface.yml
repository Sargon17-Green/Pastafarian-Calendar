name: Verificacion del interfacie de navigator — JavaScript + Interlingue

on:
  push:
    branches:
      - 'JavaScript\+Interlingue'
    paths:
      - 'browser/**'
      - 'scripts/build-browser.mjs'
      - 'tests/browser-interface-*.js'
      - 'tests/browser-core-smoke.js'
      - 'package.json'
      - '.github/workflows/javascript-interlingue-browser-interface.yml'
  pull_request:
    branches:
      - 'JavaScript\+Interlingue'
    paths:
      - 'browser/**'
      - 'scripts/build-browser.mjs'
      - 'tests/browser-interface-*.js'
      - 'tests/browser-core-smoke.js'
      - 'package.json'
      - '.github/workflows/javascript-interlingue-browser-interface.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javascript-interlingue-browser-interface-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'

jobs:
  browser-interface:
    name: Interfacie de navigator
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Installar dependenties del compilation
        run: npm install --no-audit --no-fund

      - name: Verificar li nov strate de navigator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            npm run test:browser-interface
            npm run build:browser
            test -f dist/browser/pastafari-date.js
            test -f dist/browser/pastafari-worker.js
            test -f dist/browser/standalone/pastafari-date.js
            test -f dist/browser/standalone/pastafari-date.min.js
            echo 'RESULT=PASS'
          } 2>&1 | tee logs/browser-interface.log

      - name: Conservar li log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-browser-interface
          path: logs/browser-interface.log
          if-no-files-found: error
          retention-days: 30
