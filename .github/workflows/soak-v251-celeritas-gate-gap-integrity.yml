name: Soak v251 shared gate integrity red-green (not soak)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v251-celeritas-gate-gap-integrity.yml
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind v246 profile and exact v243-v245 candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "60006ffc645bb5799940b053ed313bd625061f80"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v251-celeritas-gate-gap-integrity.yml"
          mkdir -p evidence source/src source/include/pastafari
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15258401628/zip > evidence/v250.zip
          echo "ba735b8d7366005a4cd187217e82b9ea426d483363c38868a5cf9212a9557b1a  evidence/v250.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15256434675/zip > evidence/v249.zip
          echo "524089999bccee5c29961983afe207b49650aba5f828f6cebed0213b4eb510fd  evidence/v249.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15256044364/zip > evidence/v248.zip
          echo "39497107f8ed16bf0ea3767162a7af37c3127735433b22460697a7cee3502849  evidence/v248.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15255714213/zip > evidence/v247.zip
          echo "73cb5ffa97582ffa0e329103ab4438892f55cbf8962c0046e9f87bcbfd8683e3  evidence/v247.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15254779866/zip > evidence/v246.zip
          echo "82b4e1a942c43e204ab8571e6d19a034d3da4f8140853ddf96bedd6932c6f81f  evidence/v246.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib,zipfile,subprocess
          from pathlib import Path
          with zipfile.ZipFile("evidence/v246.zip") as z:
              assert z.testzip() is None
              r=json.loads(z.read("result.json"))
              frozen=json.loads(z.read("frozen-v245.json"))
          assert r["schema"]=="SOAK_V246_CELERITAS_COLD_PHASE_PROFILE/1" and r["profile_completed"]
          with zipfile.ZipFile("evidence/v247.zip") as z:
              assert z.testzip() is None
              prev=json.loads(z.read("result.json"))
          assert prev["schema"]=="SOAK_V247_MERSENNE_SAVE_AB/1" and prev["comparison_completed"]
          assert prev["source_commit"]==r["candidate_commit"]
          with zipfile.ZipFile("evidence/v248.zip") as z:
              assert z.testzip() is None
              geometry=json.loads(z.read("result.json"))
          assert geometry["schema"]=="SOAK_V248_CELERITAS_GATE_GEOMETRY_EQUIVALENCE/1" and geometry["component_pass"] and geometry["signed_gap_questions"]==1469
          assert geometry["source_commit"]==r["candidate_commit"]
          ref="408d80e43159eba06849b6a929e0010f32b9b91b"
          assert r["candidate_commit"]==ref and [x["c"] for x in frozen]==[739617,-377237,6875993]
          Path("evidence/frozen.json").write_text(json.dumps(frozen,ensure_ascii=False,indent=2)+"\n")
          pins={"src/monster.cpp":"faad56bd1a2f70b19d40e266b3b2e05754197a48","include/pastafari/monster.hpp":"4c24d36e3704dd10ecf5420e7bc11a3da958d441","include/pastafari/source_language_catalog.hpp":"9f204d93166b2c33532bb236bc2bd929252f27be"}
          manifest={}
          for p,h in pins.items():
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/Sargon17-Green/Pastafarian-Calendar/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\x00"+raw).hexdigest()==h
              Path("source",p).write_bytes(raw)
              manifest[p]={"blob":h,"sha256":hashlib.sha256(raw).hexdigest()}
          Path("evidence/source-pins.json").write_text(json.dumps({"commit":ref,"files":manifest},indent=2)+"\n")
          PY
      - name: Compile exact baseline and shared-geometry diagnostic
        run: |
          set -euo pipefail
          (
            if ! printf '#include <boost/multiprecision/cpp_int.hpp>\nint main(){}\n' | g++ -std=c++17 -x c++ -fsyntax-only -; then
              timeout -k 5s 120s sudo apt-get update -qq
              timeout -k 5s 120s sudo apt-get install -y --no-install-recommends libboost-dev
            fi
            g++ --version
            dpkg-query -W libboost-dev
          ) > evidence/compiler.txt 2>&1
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=Path("source/src/monster.cpp").read_text()
          a="const GateGraveyardKey key{stage56CorrectedSauce_, n};"
          b="""// QA only: canonical saved-sum geometry is identical for
                      // the two stage flags. Share only the cumulative gate vault
                      // in normal acceleration, not year checkpoints or sauce.
                      const GateGraveyardKey key{
                          (accelerationsOn() && !fullHistoricalValidationOn())
                              ? true : stage56CorrectedSauce_, n};"""
          assert s.count(a)==2
          variant=s.replace(a,b)
          assert variant.replace(b,a)==s
          Path("source/src/variant.cpp").write_text(variant)
          Path("evidence/ab-source.json").write_text(json.dumps({"original_sha256":hashlib.sha256(s.encode()).hexdigest(),"variant_sha256":hashlib.sha256(variant.encode()).hexdigest(),"reversible":True,"only_change":"canonical shared gate vault key in accelerated non-historical mode at both signed traversal sites","source_equivalence_argument":["same counts, stones, hidden and visible helper inputs","same 46-step initial bowl recurrence; single latch at i=46","both post-stir recurrences use SAVE(sum(old)+149*stir), identical permutation, neighbor indices, coefficients and simultaneous update","same 922-family gap rank from identical final bowls and latch; same foundation and signed cumulative recurrence","conditional on valid cache contents and exact pinned source; all explicit historical/fault routes retained"],"universal_equivalence_certified":False},indent=2)+"\n")
          PY
          python3 - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          p=Path("source/src/variant.cpp")
          with zipfile.ZipFile("evidence/v249.zip") as z:
              assert z.testzip() is None
              prior=json.loads(z.read("result.json"))
              pins=json.loads(z.read("ab-source.json"))
          assert prior["schema"]=="SOAK_V249_SHARED_GATE_GEOMETRY_AB/1" and prior["comparison_completed"]
          assert hashlib.sha256(p.read_bytes()).hexdigest()==pins["variant_sha256"]
          with zipfile.ZipFile("evidence/v250.zip") as z:
              assert z.testzip() is None
              prior250=json.loads(z.read("result.json"))
          assert prior250["schema"]=="SOAK_V250_SHARED_GATE_POISON/1" and prior250["guard_pass"]
          assert prior250["in_range_mutation_normal_mode_tested"] is False
          original=p.read_text()
          guarded=original
          changes=[
              ("    std::string semanticFingerprint{};\n};\n\nstd::map<GateGraveyardKey, BuriedGate>","    std::string semanticFingerprint{};\n    int verifiedGap = 0;\n};\n\nstd::map<GateGraveyardKey, BuriedGate>",1),
              ("bool corpseValid = rememberedGap >= 42 && rememberedGap <= 963;","bool corpseValid = rememberedGap >= 42 && rememberedGap <= 963 &&\n                        rememberedGap == corpse.verifiedGap;",2),
              ("                        persistentSemanticFingerprint()\n                    };\n                    std::lock_guard<std::mutex> guard(gateGraveyardMutex);","                        persistentSemanticFingerprint(),\n                        gap.convert_to<int>()\n                    };\n                    std::lock_guard<std::mutex> guard(gateGraveyardMutex);",2)
          ]
          for a,b,n in changes:
              assert guarded.count(a)==n,a
              guarded=guarded.replace(a,b)
          restored=guarded
          for a,b,n in reversed(changes):
              assert restored.count(b)==n,b
              restored=restored.replace(b,a)
          assert restored==original
          helper=r'''
          namespace pastafari {
          bool qaCorruptSharedGateDay(const Integer& index) {
              std::lock_guard<std::mutex> guard(gateGraveyardMutex);
              auto it=gateGraveyard.find(GateGraveyardKey{true,index});
              if(it==gateGraveyard.end() || it->second.poisoned)return false;
              it->second.day+=1;
              return true;
          }
          }
          '''
          Path("source/src/red.cpp").write_text(original+helper)
          Path("source/src/green.cpp").write_text(guarded+helper)
          Path("evidence/helper.cpp").write_text(helper)
          Path("evidence/gap-integrity-pins.json").write_text(json.dumps({"v249_variant_sha256":pins["variant_sha256"],"guarded_sha256":hashlib.sha256(guarded.encode()).hexdigest(),"helper_sha256":hashlib.sha256(helper.encode()).hexdigest(),"reversible":True,"scope":"detect single cached day mutation, not coordinated corruption of day and verifiedGap or proof of semantic correctness"},indent=2)+"\n")
          PY
          cat > source/probe.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include <iostream>
          #include <stdexcept>
          #include <vector>
          namespace pastafari { bool qaCorruptSharedGateDay(const Integer&); }
          using namespace pastafari;
          void require(bool b,const char* msg){if(!b)throw std::runtime_error(msg);}
          std::vector<Integer> traverse(bool stage56){
              Patch18YearWalkWorkspace w(FOUNDATION_DAY_OLD,stage56);
              std::vector<Integer> days;
              for(int i=1;i<=128;++i)days.push_back(w.gateDay(i));
              for(int i=1;i<=128;++i)days.push_back(w.gateDay(-i));
              return days;
          }
          int main(){
              resetPersistentScarVaultsDiagnostic();
              setAccelerationScarsEnabled(false);
              setFullHistoricalAccelerationValidation(false);
              const auto reference=traverse(false);
              require(reference==traverse(true),"reference mismatch");
              for(int order=0;order<2;++order){
                  resetPersistentScarVaultsDiagnostic();
                  setAccelerationScarsEnabled(true);
                  setFullHistoricalAccelerationValidation(false);
                  require(traverse(order!=0)==reference,"priming mismatch");
                  // Ensure both corrupted days and their immediate successors
                  // retain legal gaps, otherwise this is not the intended RED.
                  for(int k:{63,191}){
                      const Integer a=reference[k]-reference[k-1];
                      const Integer b=reference[k+1]-reference[k];
                      require(a>0 ? (a>=42&&a<963&&b>42&&b<=963)
                                  : (-a>42&&-a<=963&&-b>=42&&-b<963),"in-range injection precondition");
                  }
                  require(qaCorruptSharedGateDay(Integer{64}),"positive injection");
                  require(qaCorruptSharedGateDay(Integer{-64}),"negative injection");
                  const auto before=persistentScarMetricsDiagnostic();
                  const auto got=traverse(order==0);
                  const auto after=persistentScarMetricsDiagnostic();
                  int mismatches=0;
                  for(std::size_t i=0;i<got.size();++i)if(got[i]!=reference[i]){
                      ++mismatches;
                      require((i==63||i==191)&&got[i]==reference[i]+1,"unexpected mismatch");
                  }
                  auto calc=after.patch28GateCalculated-before.patch28GateCalculated;
                  auto hits=after.patch28GateResurrection-before.patch28GateResurrection;
                  auto bad=after.patch28PoisonedGate-before.patch28PoisonedGate;
                  std::cout<<"INTEGRITY\t"<<order<<"\t"<<mismatches<<"\t"<<calc<<"\t"<<hits<<"\t"<<bad<<std::endl;
                  const auto a=persistentScarMetricsDiagnostic();
                  const auto repeated=traverse(order!=0);
                  const auto b=persistentScarMetricsDiagnostic();
                  require(repeated==got,"repeat changed result");
                  require(b.patch28GateCalculated==a.patch28GateCalculated&&
                          b.patch28GateResurrection-a.patch28GateResurrection==256,"repeat metrics");
                  std::cout<<"REPEAT\t"<<order<<"\t"<<(repeated==reference?1:0)<<std::endl;
              }
          }
          CPP
          for mode in red green; do
            (ulimit -v 4194304; timeout -k 5s 120s g++ -std=c++17 -O2 -pthread -I source/include "source/src/$mode.cpp" source/probe.cpp -o "source/$mode") > "evidence/$mode.build.log" 2>&1 || { cat "evidence/$mode.build.log"; exit 1; }
          done
          sha256sum source/red source/green source/probe.cpp source/src/red.cpp source/src/green.cpp > evidence/build.sha256
      - name: Reproduce undetected in-range mutation then require exact repair
        run: |
          set -euo pipefail
          for mode in red green; do
            set +e
            (ulimit -v 786432; /usr/bin/time -v -o "evidence/$mode.time.txt" timeout -k 5s 90s "source/$mode") > "evidence/$mode.stdout" 2> "evidence/$mode.stderr"
            code=$?
            set -e
            echo "$code" > "evidence/$mode.exit"
            cat "evidence/$mode.stdout" "evidence/$mode.stderr"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence")
          modes={}
          for mode in ("red","green"):
              lines=(p/f"{mode}.stdout").read_text().splitlines()
              expected=[]
              for order in range(2):
                  expected.extend([f"INTEGRITY\t{order}\t"+("2\t0\t256\t0" if mode=="red" else "0\t2\t254\t2"),f"REPEAT\t{order}\t"+("0" if mode=="red" else "1")])
              code=int((p/f"{mode}.exit").read_text())
              modes[mode]={"exit":code,"lines":lines,"expected_observed":code==0 and lines==expected and not (p/f"{mode}.stderr").read_text()}
          ok=all(x["expected_observed"] for x in modes.values())
          out={"schema":"SOAK_V251_GATE_GAP_INTEGRITY_RED_GREEN/1","source_commit":"408d80e43159eba06849b6a929e0010f32b9b91b","modes":modes,"red_reproduced":modes["red"]["expected_observed"],"green_repaired":modes["green"]["expected_observed"],"comparison_completed":ok,"coordinated_corruption_protection_claimed":False,"variant_diagnostic_only":True,"original_f_calls":0,"whole_year_credit":0,"admitted_engines":0,"STOP_NEW_NATIVE_SOAK_DISPATCH":True}
          (p/"result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v251-gate-gap-integrity-${{ github.run_id }}
          path: evidence/
          retention-days: 90
