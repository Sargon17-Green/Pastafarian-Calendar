name: Kotlin bounded independent unseeded three-order year-edge QA
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/audit_production_seven_field_unseeded.py'
      - 'soak/test_audit_production_seven_field_unseeded.py'
      - 'soak/Post55ProductionDateBridge.kt'
      - '.github/workflows/post55-independent-unseeded-seven-field.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-independent-seven-field:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout exact Kotlin branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify revision, gate limit and branch before execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'maxGateAbsIndex: Int = 8192' src/main/kotlin/pastafari/ProductionYearNavigator.kt
          grep -Fq 'val expandedGateCount: Int get() = gateTable.expandedGateCount' src/main/kotlin/pastafari/ProductionYearNavigator.kt
          grep -Fq 'val expandedGateCount: Int get() = gates.size' src/main/kotlin/pastafari/ProductionGateYear5000Engine.kt
          grep -Fq 'index.abs() <= ExactInt.of(maxGateAbsIndex.toLong())' src/main/kotlin/pastafari/ProductionGateYear5000Engine.kt
          grep -Fq 'ProductionYearNavigator()' soak/Post55ProductionDateBridge.kt
          grep -Fq 'GATE_METRIC' soak/Post55ProductionDateBridge.kt
          echo 'UNSEEDED_SEVEN_FIELD_SOURCE_LOCK_GREEN'
      - name: Run mutation and protocol unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile soak/audit_production_seven_field_unseeded.py soak/test_audit_production_seven_field_unseeded.py
          python3 -B -m unittest discover -s soak -p 'test_audit_production_seven_field_unseeded.py' -v 2>&1 | tee evidence/seven-field-unseeded-unit.log
      - name: Install Kotlin 1.9.0 pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 'https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip' -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile actual production plus seven-field bridge
        shell: bash
        run: |
          set -euo pipefail
          kotlinc src/main/kotlin/pastafari/*.kt soak/Post55ProductionDateBridge.kt -include-runtime -d "$RUNNER_TEMP/seven-field-unseeded.jar"
          test -s "$RUNNER_TEMP/seven-field-unseeded.jar"
          echo 'SEVEN_FIELD_REAL_PRODUCTION_COMPILED'
      - name: Compare 33 real production calls in three orders with unseeded oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -B soak/audit_production_seven_field_unseeded.py --jar "$RUNNER_TEMP/seven-field-unseeded.jar" --timeout-seconds 900 --evidence evidence/seven-field-unseeded-report.json --transcript evidence/seven-field-unseeded-production.tsv --gaps evidence/seven-field-unseeded-gaps.tsv --metrics evidence/seven-field-unseeded-metrics.tsv 2>&1 | tee evidence/seven-field-unseeded-run.log
      - name: Preserve evidence including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-cymraeg-unseeded-seven-field
          path: evidence/seven-field-unseeded-*
          if-no-files-found: warn
          retention-days: 30
