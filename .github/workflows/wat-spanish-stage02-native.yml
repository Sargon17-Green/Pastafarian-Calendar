name: WAT Spanish Stage02 semantic Native

on:
  push:
    branches: ['WAT+Español']
    paths:
      - 'tests/normative_selector.wat'
      - 'tests/run_stage02_discovery01_native.py'
      - 'tests/run_stage02_discovery01_webassembly.cjs'
      - '.github/workflows/wat-spanish-stage02-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage02-semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify branch and source
        run: |
          test "$(git branch --show-current)" = "WAT+Español" || test "$GITHUB_REF_NAME" = "WAT+Español"
          git rev-parse HEAD
          sha256sum tests/normative_selector.wat
      - name: Install WebAssembly Text compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wabt
          wat2wasm --version
      - name: Run 29 real Native cases with external exact-number oracle
        run: node tests/run_stage02_discovery01_webassembly.cjs
