name: Lua - Verifikasyon Stage 1
on:
  push:
    branches:
      - 'Lua+Kreyòl-ayisyen'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage01:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enstale Lua 5.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.3
      - name: Verifye sentaks tout fichye Lua yo
        shell: bash
        run: |
          set -euo pipefail
          find src test -type f -name '*.lua' -print0 | xargs -0 -n 1 luac5.3 -p
      - name: Egzekite tès Stage 1 yo
        shell: bash
        run: |
          set -euo pipefail
          lua5.3 test/stage01_tests.lua .
