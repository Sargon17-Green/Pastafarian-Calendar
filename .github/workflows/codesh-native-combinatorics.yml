name: Codesh Native bounded combinatorics vs independent Python math

on:
  push:
    branches:
      - 'Codesh\+𐤉𐤄𐤅𐤃𐤉𐤕'
      - 'perf/codesh-small-divisor-20261114'
    paths:
      - '.github/workflows/codesh-native-combinatorics.yml'
      - 'qa/native-combinatorics/**'
      - 'מקור/מניני־צירופים.אמן'
      - 'מקור/חשבון־אין־חקר.אמן'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bounded:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify official Codesh compiler 1.3 exact digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain build/tmp
          curl --fail --location --retry 3 --max-time 180 \
            'https://github.com/Codesh-Organization-Foundation-Inc/Codesh-Compiler/releases/download/v1.3/codeshc-unix-v1.3-portable.tar.gz' \
            -o toolchain/codeshc-unix-v1.3-portable.tar.gz
          echo '66f84eb52b74f91d5beea61d1af889cf6d2d5ae742c4ac64ebfe604eb5e26e0c  toolchain/codeshc-unix-v1.3-portable.tar.gz' | sha256sum -c -
          tar -xzf toolchain/codeshc-unix-v1.3-portable.tar.gz -C toolchain
          find toolchain -type f -name 'codeshc' -exec chmod +x {} \;
      - name: Compile actual 52 Codesh sources and QA reflection transport
        shell: bash
        run: |
          set -euo pipefail
          codeshc=$(find toolchain -type f -name codeshc | head -1)
          talmud=$(find toolchain -type f -name 'תלמוד־קודש.jar' | head -1)
          test -n "$codeshc" && test -n "$talmud"
          test "$(find מקור -name '*.אמן' | wc -l)" -eq 52
          export TMP="$PWD/build/tmp" TEMP="$PWD/build/tmp" TMPDIR="$PWD/build/tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$PWD/build/tmp"
          timeout 180s "$codeshc" --src . --dest "$PWD/build/codesh-native-five-fields.jar" \
            --jre-path "$JAVA_HOME" --talmud-codesh-path "$PWD/$talmud" \
            > build/compiler-stdout.log 2> build/compiler-stderr.log || {
              cat build/compiler-stderr.log; cat build/compiler-stdout.log; exit 1;
            }
          javac -encoding UTF-8 -d build qa/native-combinatorics/NativeCombinatoricsProbe.java
          sha256sum build/codesh-native-five-fields.jar | tee build/jar.sha256
      - name: Bounded Native combinatorics and independent math oracle
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 15s \
            java -Xmx768m -cp "build:build/codesh-native-five-fields.jar" NativeCombinatoricsProbe \
            > build/native-combinatorics.tsv
          python3 qa/native-combinatorics/check_native_combinatorics.py \
            build/native-combinatorics.tsv | tee build/combinatorics-qa.log
      - name: Preserve original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesh-native-combinatorics-bounded-evidence
          path: |
            build/compiler-stdout.log
            build/compiler-stderr.log
            build/jar.sha256
            build/native-combinatorics.tsv
            build/combinatorics-qa.log
          if-no-files-found: warn
          retention-days: 30
