name: Temporary — live Megillah stage-guide visual QA

on:
  pull_request:
    branches:
      - 'JavaScript\+Interlingue'
    paths:
      - 'browser/**'
      - 'tests/browser-*.js'
      - '.github/workflows/temp-live-megillah-guide-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.16.0'

jobs:
  visual:
    name: Real live-stage explanation and Megillah QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and targeted tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/browser-cooking-component.js
          node tests/browser-i18n-locales.js
          node scripts/build-browser.js
          node tests/browser-built-artifacts.js
          node scripts/prepare-pages-site.js _site

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          QA="$RUNNER_TEMP/live-megillah-guide"
          mkdir -p "$QA"
          cd "$QA"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Exercise real calculation
        shell: bash
        run: |
          set -euo pipefail
          SITE="$GITHUB_WORKSPACE/_site"
          QA="$RUNNER_TEMP/live-megillah-guide"
          cd "$SITE"
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/live-megillah-http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          cd "$QA"
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out, { recursive: true });
          const assert = (value, message) => { if (!value) throw new Error(message); };

          async function snapshot(page) {
            return page.evaluate(() => {
              const host = document.querySelector('pastafari-date');
              const cooking = host?.shadowRoot?.querySelector('pastafari-cooking');
              const shadow = cooking?.shadowRoot;
              const guide = shadow?.querySelector('.live-stage-guide');
              const quote = shadow?.querySelector('.megillah-quote blockquote');
              const explanation = shadow?.querySelector('.live-explanation');
              const pane = shadow?.querySelector('.pane');
              return {
                live: !!cooking?.hasAttribute('live'),
                observed: cooking?._liveObservedCount || 0,
                stage: guide?.dataset.stage || null,
                current: shadow?.querySelector('.live-current')?.textContent || '',
                explanation: explanation?.textContent || '',
                quote: quote?.textContent || '',
                source: shadow?.querySelector('.megillah-source')?.textContent || '',
                quoteLang: quote?.closest('figure')?.getAttribute('lang') || '',
                quoteDir: quote?.closest('figure')?.getAttribute('dir') || '',
                quoteFont: quote ? getComputedStyle(quote).fontFamily : '',
                explanationFont: explanation ? getComputedStyle(explanation).fontFamily : '',
                docOverflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                paneOverflow: (pane?.scrollWidth || 0) - (pane?.clientWidth || 0),
                history: globalThis.__pastafariStageGuideHistory || [],
              };
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              locale: 'he-IL',
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();

            await page.goto('http://127.0.0.1:4173/?qa=' + Date.now(), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForFunction(() => {
              const host = document.querySelector('pastafari-date');
              if (!host?.shadowRoot) return false;
              host.setAttribute('lang', 'he');
              const cooking = host.shadowRoot.querySelector('pastafari-cooking');
              return !!cooking?.hasAttribute('live') && !!cooking.shadowRoot?.querySelector('.live-stage-guide');
            }, null, { timeout: 60000 });

            await page.evaluate(() => {
              globalThis.__pastafariStageGuideHistory = [];
              const cooking = document.querySelector('pastafari-date').shadowRoot.querySelector('pastafari-cooking');
              const guide = cooking.shadowRoot.querySelector('.live-stage-guide');
              const record = () => {
                const shadow = cooking.shadowRoot;
                const row = {
                  stage: guide.dataset.stage || null,
                  current: shadow.querySelector('.live-current')?.textContent || '',
                  explanation: shadow.querySelector('.live-explanation')?.textContent || '',
                  quote: shadow.querySelector('.megillah-quote blockquote')?.textContent || '',
                };
                const history = globalThis.__pastafariStageGuideHistory;
                const previous = history[history.length - 1];
                if (!previous || previous.stage !== row.stage) history.push(row);
              };
              record();
              new MutationObserver(record).observe(guide, { attributes: true, attributeFilter: ['data-stage'] });
            });

            await page.waitForFunction(() => {
              const cooking = document.querySelector('pastafari-date')?.shadowRoot?.querySelector('pastafari-cooking');
              const guide = cooking?.shadowRoot?.querySelector('.live-stage-guide');
              return (cooking?._liveObservedCount || 0) >= 128 && guide?.dataset.stage === 'gates';
            }, null, { timeout: 300000 });

            await page.waitForTimeout(100);
            const gate = await snapshot(page);
            assert(gate.current.includes('מחשבים את מרווח השער הבא'), 'current operation is not the awaited next gate gap');
            assert(gate.explanation.includes('רצף שערים'), 'gate explanation is missing or unrelated');
            assert(gate.quote === 'וכן עשה שער אחר שער.', 'wrong canonical Megillah quotation for gates');
            assert(gate.source.includes('לוח שבעה עשר: שערי הקציצה'), 'wrong Megillah source for gates');
            assert(gate.quoteLang === 'he' && gate.quoteDir === 'rtl', 'Megillah quotation is not explicitly Judaean-Hebrew/RTL');
            assert(gate.quoteFont !== gate.explanationFont, 'Megillah quotation is using the ordinary explanation font');
            assert(/SBL Hebrew|Taamey Frank CLM|Frank Ruehl CLM|Noto Serif Hebrew/.test(gate.quoteFont),
              'Megillah quotation font stack is not the dedicated square Hebrew stack');
            assert(gate.docOverflow <= 2 && gate.paneOverflow <= 2, 'desktop live guide causes horizontal overflow');
            await page.screenshot({ path: path.join(out, 'desktop-he-gate-guide.png'), fullPage: false });

            await page.setViewportSize({ width: 390, height: 844 });
            await page.waitForTimeout(120);
            const mobile = await snapshot(page);
            assert(mobile.stage === 'gates', 'mobile resize lost current stage');
            assert(mobile.docOverflow <= 2 && mobile.paneOverflow <= 2, 'mobile live guide causes horizontal overflow');
            await page.screenshot({ path: path.join(out, 'mobile-he-gate-guide.png'), fullPage: false });

            await page.setViewportSize({ width: 1440, height: 1000 });
            await page.waitForFunction(() => {
              const cooking = document.querySelector('pastafari-date')?.shadowRoot?.querySelector('pastafari-cooking');
              const days = document.querySelector('pastafari-date')?.shadowRoot?.querySelectorAll('.day').length || 0;
              return !!cooking && !cooking.hasAttribute('live') && days > 0;
            }, null, { timeout: 420000 });

            const final = await snapshot(page);
            const history = final.history;
            const stages = history.map(row => row.stage).filter(Boolean);
            assert(stages.includes('gates'), 'real run never recorded gates stage');
            assert(stages.some(s => s === 'yearAnchor' || s === 'years'), 'real run never recorded year stage');
            assert(stages.some(s => ['structure','stones','hidden','visible','bowls','postStirs'].includes(s)),
              'real run never recorded a structure/Sauce stage');
            assert(stages.some(s => ['cutlets','months','weaving','result','position'].includes(s)),
              'real run never recorded a downstream year-structure/result stage');

            fs.writeFileSync(path.join(out, 'metrics.json'), JSON.stringify({ gate, mobile, stages, history }, null, 2));
            await context.close();
            await browser.close();
            console.log('LIVE_MEGILLAH_GUIDE_QA=PASS');
          })().catch((error) => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          JS
          node qa.js

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-megillah-guide-visual
          path: ${{ runner.temp }}/live-megillah-guide/out
          if-no-files-found: warn
          retention-days: 14
