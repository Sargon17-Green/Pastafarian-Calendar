name: Paleo Prose Unicode Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prose Unicode without touching Codesh sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          required = [
              Path("LICENSE"),
              Path("README.md"),
              Path("SPAGHETTI_DEVELOPMENT_HISTORY.md"),
              Path("docs/ARCHITECTURE.md"),
              Path("docs/TESTING.md"),
              Path("docs/SOURCE_LANGUAGE_CATALOG.md"),
          ]
          stage_logs = sorted(Path(".").glob("TEST_LOG_STAGE_*.md"))
          files = required + stage_logs
          errors = []
          completed = 0
          stage_state = Path("DEVELOPMENT_STAGE.md")
          if not stage_state.is_file():
              errors.append("DEVELOPMENT_STAGE.md missing; log completeness cannot be checked")
          else:
              try:
                  fields = [
                      line.partition("=")[2].strip()
                      for line in stage_state.read_text(encoding="utf-8", errors="strict").splitlines()
                      if line.startswith("LAST_COMPLETED_STAGE=")
                  ]
                  if len(fields) != 1 or not fields[0].isdigit():
                      errors.append("LAST_COMPLETED_STAGE must occur exactly once and be an integer")
                  else:
                      completed = int(fields[0])
                      if not 1 <= completed <= 55:
                          errors.append(f"LAST_COMPLETED_STAGE outside the 1..55 contract: {completed}")
                      else:
                          expected_logs = {
                              Path(f"TEST_LOG_STAGE_{i:02d}.md") for i in range(1, completed + 1)
                          }
                          missing = sorted(expected_logs - set(stage_logs))
                          unexpected = sorted(set(stage_logs) - expected_logs)
                          for path in missing:
                              errors.append(f"{path}: completed stage has no prose log")
                          for path in unexpected:
                              errors.append(f"{path}: unexpected or prematurely published stage log")
              except UnicodeError as exc:
                  errors.append(f"DEVELOPMENT_STAGE.md: invalid UTF-8: {exc}")
          for path in files:
              if not path.is_file():
                  errors.append(f"{path}: required prose file is missing")
                  continue
              try:
                  content = path.read_text(encoding="utf-8", errors="strict")
              except UnicodeError as exc:
                  errors.append(f"{path}: invalid UTF-8: {exc}")
                  continue
              if not content:
                  errors.append(f"{path}: empty prose file")
              # README is allowed to spell the actual language name "Codesh".
              # Replace its exact spelling with spaces of equal length for offset stability.
              prose = content.replace("Codesh", "      ") if path == Path("README.md") else content
              for index, char in enumerate(prose):
                  point = ord(char)
                  if not (
                      0x10900 <= point <= 0x10915
                      or point == 0x1091F
                      or point in (0x20, 0x09, 0x0A, 0x0D)
                  ):
                      errors.append(f"{path}: unexpected prose character U+{point:04X} at index {index}")
                  if 0x10916 <= point <= 0x1091E:
                      errors.append(f"{path}: Phoenician numeral or non-letter U+{point:04X} at index {index}; prose permits letters and U+1091F word dividers only")
                  if point == 0xFFFD:
                      errors.append(f"{path}: replacement character U+FFFD at index {index}")
                  elif 0xD800 <= point <= 0xDFFF:
                      errors.append(f"{path}: unpaired surrogate at index {index}")
                  elif 0x0590 <= point <= 0x05FF:
                      errors.append(f"{path}: square Hebrew character at index {index}")
              if "\U0001091f\U0001091f" in content:
                  errors.append(f"{path}: consecutive Phoenician word dividers")
              compact_letters = content.translate(str.maketrans("", "", " \t\r\n"))
              if "𐤀𐤐𐤎" in compact_letters:
                  errors.append(f"{path}: anachronistic zero term in Phoenician prose (including across scribal line breaks)")

          if not list(Path(".").glob("TEST_LOG_STAGE_*.md")):
              errors.append("No TEST_LOG_STAGE_*.md files found")
          # The history tail from stage 41 through the last completed stage must match the logs verbatim.
          # This guards transcription consistency, not philological accuracy.
          history_path = Path("SPAGHETTI_DEVELOPMENT_HISTORY.md")
          mirrors = [Path(f"TEST_LOG_STAGE_{n:02d}.md") for n in range(41, completed + 1)]
          if not all(path.is_file() for path in mirrors):
              errors.append("Stage 41 onward: a completed-stage log is missing; history parity cannot be checked")
          elif history_path.is_file():
              try:
                  history = history_path.read_text(encoding="utf-8", errors="strict")
                  mirrored_tail = "".join(
                      path.read_text(encoding="utf-8", errors="strict").rstrip("\n") + "\n"
                      for path in mirrors
                  )
                  if not history.endswith(mirrored_tail):
                      errors.append("Stage 41 onward: history tail differs from completed-stage logs")
              except UnicodeError as exc:
                  errors.append(f"Stage 41 onward: history parity could not be checked: {exc}")

          if errors:
              for message in errors:
                  print(f"::error::{message}")
              sys.exit(1)
          print(f"PASS: {len(files)} prose files; Codesh source files were not read")
          PY
