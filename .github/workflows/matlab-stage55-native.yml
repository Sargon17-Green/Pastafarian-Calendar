name: MATLAB Stage 55 Native Audit

on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'src/**'
      - '!src/\+pastafari/countWholeWeavingSuffixByEndpoints.m'
      - '!src/\+pastafari/unrankWholeWeavingByEndpoints.m'
      - '!src/\+pastafari/allOpenedWholeWeaveChildCounts.m'
      - '!src/\+pastafari/unrankAllOpenedWeaveSuffixChunk.m'
      - '!src/\+pastafari/unrankGeneralWeaveSuffixChunk.m'
      - '!src/\+pastafari/unrankGeneralWeaveSuffixChunkLazyJoint.m'
      - '!src/\+pastafari/serializeExactWeaveCursorJson.m'
      - '!src/\+pastafari/restoreExactWeaveCursorJson.m'
      - '!src/\+pastafari/countWholeWeavingNextLetterBlocksOnePass.m'
      - '!src/\+pastafari/extremalWholeMonthWeavings.m'
      - '!src/\+pastafari/adjacentWholeMonthWeaving.m'
      - '!src/\+pastafari/unrankWholeWeavingNearEdge.m'
      - '!src/\+pastafari/allOpenedWholeWeaveChildCountsByFactors.m'
      - '!src/\+pastafari/allOpenedWholeWeaveChildCountsCommonDenominator.m'
      - 'tests/**'
      - '!tests/run_stage55_endpoint_counter_tests.m'
      - '!tests/run_stage55_endpoint_unrank_tests.m'
      - '!tests/run_stage55_all_open_chunk_tests.m'
      - '!tests/run_stage55_general_chunk_tests.m'
      - '!tests/run_stage55_joint_next_blocks_tests.m'
      - '!tests/run_stage55_extremal_weave_tests.m'
      - '!tests/run_stage55_adjacent_weave_tests.m'
      - '!tests/run_stage55_near_edge_tests.m'
      - '!tests/run_stage55_general_joint_tests.m'
      - '!tests/run_stage55_lazy_joint_tests.m'
      - '!tests/run_stage55_checkpoint_json_tests.m'
      - '!tests/run_stage55_real_year_lazy_joint_two_step.m'
      - '!tests/run_stage55_real_year_lazy_joint_three_step.m'
      - '!tests/run_stage55_real_year_5000_lengths_tests.m'
      - '!tests/run_stage55_real_year_5000_two_step_joint.m'
      - '!tests/run_stage55_general_chunk_fullscale.m'
      - '!tests/run_stage55_general_chunk_all_open_4230.m'
      - '!tests/run_stage55_all_open_factor_tests.m'
      - '!tests/run_stage55_all_open_common_denominator_tests.m'
      - '!tests/run_stage55_preopen_scaling_bench.m'
      - '!src/\+pastafari/countWholeWeavingAllUnopenedWavefront.m'
      - '!tests/run_stage55_preopen_wavefront_tests.m'
      - '!tests/run_stage55_preopen_full_year_bench.m'
      - '!src/\+pastafari/countWholeWeavingSuffixByFirstEndpoint.m'
      - '!tests/run_stage55_first_endpoint_tests.m'
      - 'DEVELOPMENT_STAGE.md'
      - 'docs/STAGE_55_FINAL_AUDIT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-stage55-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-stage55:
    name: MATLAB R2026a / complete Stage 55 audit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PASTAFARI_STAGE54_DIAGNOSTICS: '1'
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a

      - name: Execute native final audit including heavy oracle
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); run_stage55_final_audit

      - name: Preserve PASS or FAIL audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-stage55-audit-${{ github.run_id }}
          path: logs/STAGE_55_MATLAB_RUN.log
          if-no-files-found: warn
          retention-days: 30
