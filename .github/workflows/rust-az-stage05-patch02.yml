name: Rust Azerbaijani Stage05 PATCH02 Native

on:
  push:
    branches:
      - 'Rust\+Azərbaycan-dili'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'DEVELOPMENT_STAGE.md'
      - 'audit/STAGE_05_PATCH02_WORK_COUNTS_CONTRACT_2026-11-23.md'
      - '.github/workflows/rust-az-stage05-patch02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-stage05-patch02:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Confirm scope format and stage counters
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Rust+Azərbaycan-dili'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if grep -Fxq 'CURRENT_STAGE=5' DEVELOPMENT_STAGE.md; then
            grep -Fxq 'CURRENT_KIND=PATCH02' DEVELOPMENT_STAGE.md
            if grep -Fxq 'LAST_COMPLETED_STAGE=4' DEVELOPMENT_STAGE.md; then
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=PATCH02_STAGE05_PENDING_NATIVE' DEVELOPMENT_STAGE.md
            else
              grep -Fxq 'LAST_COMPLETED_STAGE=5' DEVELOPMENT_STAGE.md
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=PATCH02_STAGE05_ACCEPTED_READY_STAGE06' DEVELOPMENT_STAGE.md
            fi
          elif grep -Fxq 'CURRENT_STAGE=6' DEVELOPMENT_STAGE.md; then
            grep -Fxq 'CURRENT_KIND=DISCOVERY03' DEVELOPMENT_STAGE.md
            if grep -Fxq 'LAST_COMPLETED_STAGE=5' DEVELOPMENT_STAGE.md; then
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=DISCOVERY03_STAGE06_PENDING_NATIVE' DEVELOPMENT_STAGE.md
            else
              grep -Fxq 'LAST_COMPLETED_STAGE=6' DEVELOPMENT_STAGE.md
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=DISCOVERY03_STAGE06_ACCEPTED_HOLD_NO_STAGE07' DEVELOPMENT_STAGE.md
            fi
          elif grep -Fxq 'CURRENT_STAGE=7' DEVELOPMENT_STAGE.md; then
            grep -Fxq 'CURRENT_KIND=PATCH03' DEVELOPMENT_STAGE.md
            grep -Fxq 'CURRENT_PATCH=PATCH03' DEVELOPMENT_STAGE.md
            if grep -Fxq 'LAST_COMPLETED_STAGE=6' DEVELOPMENT_STAGE.md; then
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=PATCH03_STAGE07_PENDING_NATIVE' DEVELOPMENT_STAGE.md
            else
              grep -Fxq 'LAST_COMPLETED_STAGE=7' DEVELOPMENT_STAGE.md
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=PATCH03_STAGE07_ACCEPTED_HOLD_NO_STAGE08' DEVELOPMENT_STAGE.md
            fi
          elif grep -Fxq 'CURRENT_STAGE=8' DEVELOPMENT_STAGE.md; then
            grep -Fxq 'CURRENT_KIND=DISCOVERY04' DEVELOPMENT_STAGE.md
            grep -Fxq 'CURRENT_PATCH=PATCH03' DEVELOPMENT_STAGE.md
            if grep -Fxq 'LAST_COMPLETED_STAGE=7' DEVELOPMENT_STAGE.md; then
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=DISCOVERY04_STAGE08_PENDING_NATIVE' DEVELOPMENT_STAGE.md
            else
              grep -Fxq 'LAST_COMPLETED_STAGE=8' DEVELOPMENT_STAGE.md
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=DISCOVERY04_STAGE08_ACCEPTED_HOLD_NO_STAGE09' DEVELOPMENT_STAGE.md
            fi
          elif grep -Fxq 'CURRENT_STAGE=9' DEVELOPMENT_STAGE.md; then
            grep -Fxq 'CURRENT_KIND=PATCH04' DEVELOPMENT_STAGE.md
            grep -Fxq 'CURRENT_PATCH=PATCH04' DEVELOPMENT_STAGE.md
            if grep -Fxq 'LAST_COMPLETED_STAGE=8' DEVELOPMENT_STAGE.md; then
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=PATCH04_STAGE09_PENDING_NATIVE' DEVELOPMENT_STAGE.md
            else
              grep -Fxq 'LAST_COMPLETED_STAGE=9' DEVELOPMENT_STAGE.md
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=PATCH04_STAGE09_ACCEPTED_HOLD_NO_STAGE10' DEVELOPMENT_STAGE.md
            fi
          elif grep -Fxq 'CURRENT_STAGE=10' DEVELOPMENT_STAGE.md; then
            grep -Fxq 'CURRENT_KIND=DISCOVERY05' DEVELOPMENT_STAGE.md
            grep -Fxq 'CURRENT_PATCH=PATCH04' DEVELOPMENT_STAGE.md
            if grep -Fxq 'LAST_COMPLETED_STAGE=9' DEVELOPMENT_STAGE.md; then
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=DISCOVERY05_STAGE10_PENDING_NATIVE' DEVELOPMENT_STAGE.md
            else
              grep -Fxq 'LAST_COMPLETED_STAGE=10' DEVELOPMENT_STAGE.md
              grep -Fxq 'EXPECTED_REPOSITORY_STATE=DISCOVERY05_STAGE10_ACCEPTED_HOLD_NO_STAGE11' DEVELOPMENT_STAGE.md
            fi
          else
            exit 1
          fi
          grep -Fq 'pub mod patch02_work_counts;' src/lib.rs
          test -f audit/STAGE_05_PATCH02_WORK_COUNTS_CONTRACT_2026-11-23.md
          cargo fmt --all -- --check
      - name: Run Native Stage01-Stage05 against independent Rust oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'PROJECT_ID=PC-BRANCH-RUST-AZERBAIJANI\nSHA=%s\n' "$GITHUB_SHA" > evidence/sha.txt
          rustc --version > evidence/toolchain.txt
          cargo --version >> evidence/toolchain.txt
          set +e
          timeout --signal=TERM --kill-after=5s 900s \
            cargo test --all-targets -- --nocapture > evidence/stdout.txt 2> evidence/stderr.txt
          code=$?
          set -e
          printf '%s\n' "$code" > evidence/exit.txt
          cat evidence/stdout.txt
          if [ "$code" -ne 0 ]; then
            cat evidence/stderr.txt >&2
            exit "$code"
          fi
          for marker in \
            'STAGE05_WRAPPER_RECONCILIATION=69 RED_SCAR=34 CONTROL=35 GUARDS=69' \
            'STAGE05_PATCH02_FOUNDATION_CASES=7' \
            'STAGE05_PATCH02_LOCAL_PAIRS=49' \
            'STAGE05_PATCH02_LARGE_PAIRS=8' \
            'STAGE05_PATCH02_SAVE_ISOLATION=4' \
            'STAGE05_PATCH02_BOOTSTRAP_ONLY=PASS' \
            'STAGE04_DISCOVERY02_BASELINE_CASES=7' \
            'STAGE04_DISCOVERY02_BIJECTION_CASES=1025' \
            'STAGE02_DISCOVERY01_EXPECTED_RED=3 CONTROL=1 UNEXPECTED=0' \
            'STAGE03_PATCH01_BOUNDARY_OK=8'; do
            grep -Fq "$marker" evidence/stdout.txt
          done
          if grep -E 'test result: FAILED|test.*FAILED|panic' evidence/stdout.txt evidence/stderr.txt; then
            echo 'Unexpected failure in Native tests' >&2
            exit 1
          fi
          printf 'STAGE05_PATCH02_NATIVE=PASS\nSTAGE05_CLOSURE=NOT_CLAIMED\n' > evidence/result.txt
          cat evidence/result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-az-stage05-patch02-native
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
