name: Befunge QA31T bounded Native delimiter and EOF frontier matrix
on:
  push:
    branches:
      - qa-befunge98-stage1-order-isolation-20261008
    paths:
      - 'qa/stage1_qa31t_native_frontier_matrix.py'
      - 'qa/stage1_qa31t_independent_frontier_audit.py'
      - 'qa/QA31T_EOF_DELIMITER_NATIVE_FRONTIER_CONTRACT_2026-11-03.md'
      - '.github/workflows/befunge-qa31t-eof-delimiter-frontier.yml'
      - 'src/interleaved_work_counts.b98'
permissions:
  contents: read
jobs:
  qa31t-original-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin original source and compile independent auditor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = '560d6aa5807a7f766213a33835cce85eab0fa40c'
          python3 -m py_compile qa/stage1_qa31t_independent_frontier_audit.py
          mkdir -p qa31t-output
      - name: Fetch pinned PyFunge 0.5-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Twelve untouched-source Native delimiter and EOF cases
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -e PYTHONPATH=/work/qa             -v "$GITHUB_WORKSPACE:/work:ro"             -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro"             -v "$GITHUB_WORKSPACE/qa31t-output:/qa31t" -w /work             python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 840s python -u qa/stage1_qa31t_native_frontier_matrix.py /qa31t
            ' | tee qa31t-output/native.log
          grep -q QA31T_12_NATIVE_CASES_RECORDED qa31t-output/native.log
      - name: Independently replay every physical Native event and stdin byte
        shell: bash
        run: |
          set -euo pipefail
          python3 -u qa/stage1_qa31t_independent_frontier_audit.py             src/interleaved_work_counts.b98 qa31t-output | tee qa31t-output/audit.log
          grep -q 'QA31T_HOSTILE_CONTROLS 18 OF_18_REJECTED' qa31t-output/audit.log
          grep -q QA31T_STAGE1_REMAINS_OPEN qa31t-output/audit.log
      - name: Preserve finite receipts and full traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: befunge-qa31t-native-delimiter-frontier
          path: qa31t-output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
