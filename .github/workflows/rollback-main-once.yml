name: One-time rollback accidental main push

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rollback-main-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rollback-main-once
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      EXPECTED_BAD_HEAD: f004cce09bc1bb40dca4946b784636a44577923d
      TARGET_SHA: db13b46cacdc9e8f0614a14085ad746911f0b7aa
      TARGET_TREE: 627b94f26b4b884071cbab76ccdbadc85c02a109
      SELF_PATH: .github/workflows/rollback-main-once.yml

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard the exact accidental state
        shell: bash
        run: |
          set -euo pipefail

          current="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"

          echo "workflow_commit=$current"
          echo "workflow_parent=$parent"
          echo "expected_bad_head=$EXPECTED_BAD_HEAD"

          if [[ "$parent" != "$EXPECTED_BAD_HEAD" ]]; then
            echo "REFUSING: parent is not the verified accidental main HEAD."
            exit 10
          fi

          mapfile -t changed < <(git diff --name-only "$parent" "$current")
          printf 'workflow_commit_changed_file=%s\n' "${changed[@]}"

          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "$SELF_PATH" ]]; then
            echo "REFUSING: the trigger commit changed something besides this one-time workflow."
            exit 11
          fi

          git cat-file -e "${TARGET_SHA}^{commit}"
          actual_target_tree="$(git rev-parse "${TARGET_SHA}^{tree}")"

          if [[ "$actual_target_tree" != "$TARGET_TREE" ]]; then
            echo "REFUSING: target commit tree does not match the pre-verified tree."
            exit 12
          fi

          echo "ROLLBACK_GUARD=PASS"

      - name: Restore exact target tree, commit, and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Replace the entire tracked tree, including deleting this workflow,
          # with the exact tree from the last verified good main commit.
          git read-tree --reset -u "$TARGET_SHA"

          staged_tree="$(git write-tree)"
          if [[ "$staged_tree" != "$TARGET_TREE" ]]; then
            echo "REFUSING: staged rollback tree is not byte-for-byte the verified target tree."
            exit 20
          fi

          git commit \
            -m "Revert accidental Assembly + Sahidic Coptic push to main" \
            -m "Revert the four Assembly x86-64 + Sahidic Coptic commits that were accidentally pushed to main, plus remove this one-time rollback workflow.

Reverted accidental commits:
- f004cce09bc1bb40dca4946b784636a44577923d
- f368dbbd3747bb68fa774752ed036ec9d8b982fd
- 82567e6e4f69aa1d3d4e8cec7d21675516602d4b
- 40cb7abc30a7ee2231a244a5cf35b0e95e8c7af8

The resulting repository tree is exactly the tree of db13b46cacdc9e8f0614a14085ad746911f0b7aa. Git history is preserved; no force-push is used."

          final_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$final_tree" != "$TARGET_TREE" ]]; then
            echo "REFUSING: final rollback commit tree is not the verified target tree."
            exit 21
          fi

          echo "ROLLBACK_TREE_MATCH=PASS"
          git push origin HEAD:main
