name: Logo Stage 2 Discovery 18 Native

on:
  push:
    branches:
      - 'Logo\+Ido'
  pull_request:
    branches:
      - 'Logo\+Ido'

permissions:
  contents: read

jobs:
  native-stage-2-discovery-18:
    strategy:
      fail-fast: false
      matrix:
        shard: [forward, reverse]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Build pinned native UCBLogo 6.2.5 without wxWidgets
        shell: bash
        run: |
          set -euo pipefail
          # A --disable-wx build makes this a genuine headless CLI test.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git gcc g++ make autoconf automake autoconf-archive libncurses-dev
          source_dir="$RUNNER_TEMP/ucblogo-source"
          git clone --quiet --depth 1 --branch version_6.2.5 \
            https://github.com/jrincayc/ucblogo-code.git "$source_dir"
          expected=a0215433f07384e4c42fe247525867f11e6f32f7
          actual="$(git -C "$source_dir" rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::UCBLogo tag commit changed: $actual"
            exit 1
          fi
          cd "$source_dir"
          autoreconf -fi
          CFLAGS="-O2 -std=gnu17" ./configure --prefix="$RUNNER_TEMP/ucblogo-headless" \
            --disable-wx --disable-x11 --disable-docs
          make -j2
          make install
          binary="$RUNNER_TEMP/ucblogo-headless/bin/ucblogo"
          test -x "$binary"
          echo "LOGO_BIN=$binary" >> "$GITHUB_ENV"
          echo "HEADLESS_LOGO_SOURCE_SHA=$actual"

      - name: Verify Stage 2 Discovery 18 — bounded independent ${{ matrix.shard }} shard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'make "D18.SHARD "%s\nload "test/stage02_discovery18_tests.logo\n' '${{ matrix.shard }}' > "$RUNNER_TEMP/d18-shard.logo"
          log="$RUNNER_TEMP/stage02-discovery18-${{ matrix.shard }}.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 1800s \
            stdbuf -oL -eL "$LOGO_BIN" "$RUNNER_TEMP/d18-shard.logo" >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Stage2 Discovery18 ${{ matrix.shard }} native failure/timeout (exit=$result)"
            exit 1
          fi
          if [[ '${{ matrix.shard }}' = 'forward' ]]; then
            grep -Fxq 'STAGE_2_DISCOVERY_18_PERMUTATION_CHECKS_PASIS 720' "$log"
            grep -Fxq 'STAGE_2_DISCOVERY_18_FORWARD_CASES_PASIS 1' "$log"
            grep -Fxq 'STAGE_2_DISCOVERY_18_FORWARD_CHECKS_PASIS 18' "$log"
            grep -Fxq 'STAGE_2_DISCOVERY_18_FORWARD_PASIS' "$log"
          else
            grep -Fxq 'STAGE_2_DISCOVERY_18_REVERSE_CASES_PASIS 5' "$log"
            grep -Fxq 'STAGE_2_DISCOVERY_18_REVERSE_CHECKS_PASIS 22' "$log"
            grep -Fxq 'STAGE_2_DISCOVERY_18_REVERSE_PASIS' "$log"
          fi
          if grep -Eq 'STAGE_2_DISCOVERY_18_TESTO_FALIIS|STAGE_2_DISCOVERY_18_PERMUTATION_FALIIS|STAGE_2_DISCOVERY_18_FALIIS|STAGE_2_DISCOVERY_18_SHARD_FALIIS|STAGE_2_DISCOVERY_18_SHAPE_FALIIS|STAGE_2_DISCOVERY_18_ORACLE_SHAPE_FALIIS|STAGE_2_DISCOVERY_18_CASE_COUNT_FALIIS|STAGE_2_DISCOVERY_18_CHECK_COUNT_FALIIS|You don.t say what to do with|I don.t know how to|not enough inputs' "$log"; then
            echo "::error::Stage2 Discovery18 native failure marker"
            exit 1
          fi
          echo "NATIVE_STAGE_2_DISCOVERY_18_SHARD_${{ matrix.shard }}=PASS"

  native-stage-2-discovery-18-acceptance:
    needs: [native-stage-2-discovery-18]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Aggregate independently gated matrix shards (1+5 cases, 18+22 checks)
        shell: bash
        run: |
          set -euo pipefail
          echo 'STAGE_2_DISCOVERY_18_CASES_PASIS 6'
          echo 'STAGE_2_DISCOVERY_18_CHECKS_PASIS 40'
          echo 'STAGE_2_DISCOVERY_18_PASIS'
          echo 'NATIVE_STAGE_2_DISCOVERY_18_VERIFICATION=PASS'
