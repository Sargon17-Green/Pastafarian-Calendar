name: Stage55 exact root count and middle rank (bounded)
on:
  push:
    branches:
      - 'MATLAB+Polski'
    paths:
      - 'tools/stage55_root_middle_rank_dual_counter.py'
      - 'docs/stage55-root-middle-rank-contract.md'
      - '.github/workflows/stage55-root-middle-rank-dual-counter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-root-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact commit and canonical fixture blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object tests/fixtures/stage55_year5000_appendix_a_metadata.json)" = "a1383b111a88203b0d652b8f0a0e9af1a8b75f25"
          python3 -m py_compile tools/stage55_root_middle_rank_dual_counter.py
      - name: Independent exact integer root count certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tools/stage55_root_middle_rank_dual_counter.py \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            --report evidence/STAGE55_YEAR5000_ROOT_MIDDLE_RANK_CERTIFICATE.json \
            2>&1 | tee evidence/STAGE55_YEAR5000_ROOT_CERTIFICATE.log
          sha256sum evidence/* > evidence/SHA256SUMS.txt
      - name: Retain success/failure evidence (not Native)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-root-middle-rank-dual-count
          path: evidence/
          if-no-files-found: warn
