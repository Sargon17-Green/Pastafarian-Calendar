name: Logo Stage2 Appendix-A General Wide Native QA
on:
  push:
    branches:
      - 'qa/logo-ido-stage2-wide-general-k3plus-20261122'
permissions:
  contents: read

jobs:
  wide-general-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out isolated general-k QA branch
        uses: actions/checkout@v4

      - name: Verify exact SHA and source locks; run independent host oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/qa/logo-ido-stage2-wide-general-k3plus-20261122'
          test "$(git hash-object src/exact_integer.logo)" = f2c1a8aa5822423402cd5825255891183f0fc83c
          test "$(git hash-object src/stage02_context.logo)" = f8451359e6ddcf38bb823ff2b78c9acbfbcf7830
          test "$(git hash-object src/stage02_answer_at.logo)" = f0951ba68a191667208b2a2b99b386c5336e49c2
          test "$(git hash-object src/stage02_choose_wide.logo)" = 8fb2dc47c827b8ccd8fa6fdd817b9fa088c51013
          test "$(git hash-object test/normative_reference.logo)" = 625171ecd5fd93fb8381686f2b2f6b29ed3649cf
          test "$(git hash-object CANONICAL_NAMES_LOCK.sha256)" = 0d5b3dec0b01551b1304ee7104d08a57aa1f440b
          test "$(git hash-object QA_STAGE2_APPENDIX_A_WIDE_GENERAL_CONTRACT.md)" = 8e392ccb91ccc6c30ed868129d4319495c0954c2
          test "$(git hash-object src/stage02_choose_wide_general.logo)" = 5a624a2f3ade5b356b0569e3a1165904ad7e9c1d
          test "$(git hash-object qa/logo_stage2_wide_general_host_oracle.py)" = 5b718c56a7a4f073a73bed6379bdee70c93b3399
          test "$(git hash-object qa/logo_stage2_wide_general_native_vectors.py)" = 4e5eef7d8f8558579bf9a466adf7d126212e2bc2
          git rev-parse HEAD > "$RUNNER_TEMP/wide-general-commit.txt"
          git hash-object .github/workflows/logo-stage02-wide-general-native.yml > "$RUNNER_TEMP/wide-general-workflow-blob.txt"
          for path in src/exact_integer.logo src/stage02_context.logo src/stage02_answer_at.logo src/stage02_choose_wide.logo src/stage02_choose_wide_general.logo test/normative_reference.logo CANONICAL_NAMES_LOCK.sha256 QA_STAGE2_APPENDIX_A_WIDE_GENERAL_CONTRACT.md qa/logo_stage2_wide_general_host_oracle.py qa/logo_stage2_wide_general_native_vectors.py .github/workflows/logo-stage02-wide-general-native.yml; do
            printf '%s %s\\n' "$(git hash-object "$path")" "$path"
          done > "$RUNNER_TEMP/wide-general-git-blobs.txt"
          sha256sum src/exact_integer.logo src/stage02_context.logo src/stage02_answer_at.logo src/stage02_choose_wide.logo src/stage02_choose_wide_general.logo test/normative_reference.logo CANONICAL_NAMES_LOCK.sha256 QA_STAGE2_APPENDIX_A_WIDE_GENERAL_CONTRACT.md qa/logo_stage2_wide_general_host_oracle.py qa/logo_stage2_wide_general_native_vectors.py .github/workflows/logo-stage02-wide-general-native.yml > "$RUNNER_TEMP/wide-general-source-sha256.txt"
          python3 qa/logo_stage2_wide_general_host_oracle.py | tee "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_ENUM_CASES 42748' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_K2_COMPAT_CASES 3340' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_K3_CASES 14332' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_K4_CASES 14852' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_K5_CASES 7180' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_K6_CASES 3044' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_REJECTION_CASES 8672' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_POSITIVE_REJECTIONS 4549' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_NEGATIVE_REJECTIONS 4123' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_MAX_ENUMERATED_STEPS 570' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_LARGE_M_VECTORS 30' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_INVALID_GUARDS 14' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_HOST_ORACLE=PASS' "$RUNNER_TEMP/wide-general-host.log"
          grep -Fxq 'WIDE_GENERAL_NATIVE=NOT_RUN' "$RUNNER_TEMP/wide-general-host.log"

      - name: Generate independent Python-integer Native fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/logo_stage2_wide_general_native_vectors.py --output "$RUNNER_TEMP/wide-general-native.logo" --max-width 3 | tee "$RUNNER_TEMP/wide-general-vectors.log"
          grep -Fxq 'WIDE_GENERAL_HOST_VALID 8' "$RUNNER_TEMP/wide-general-vectors.log"
          grep -Fxq 'WIDE_GENERAL_HOST_INVALID 18' "$RUNNER_TEMP/wide-general-vectors.log"
          grep -Fxq 'WIDE_GENERAL_HOST_REJECTED 4' "$RUNNER_TEMP/wide-general-vectors.log"
          grep -Fxq 'WIDE_GENERAL_HOST_REJECTED_PLUS 2' "$RUNNER_TEMP/wide-general-vectors.log"
          grep -Fxq 'WIDE_GENERAL_HOST_REJECTED_MINUS 2' "$RUNNER_TEMP/wide-general-vectors.log"
          grep -Fxq 'WIDE_GENERAL_HOST_CASES 26' "$RUNNER_TEMP/wide-general-vectors.log"
          grep -Fxq 'WIDE_GENERAL_HOST_CHECKS 50' "$RUNNER_TEMP/wide-general-vectors.log"
          grep -Fxq 'WIDE_GENERAL_HOST_ORACLE=PASS' "$RUNNER_TEMP/wide-general-vectors.log"

      - name: Build pinned headless UCBLogo 6.2.5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git gcc g++ make autoconf automake autoconf-archive libncurses-dev
          source_dir="$RUNNER_TEMP/ucblogo-source"
          git clone --quiet --depth 1 --branch version_6.2.5 https://github.com/jrincayc/ucblogo-code.git "$source_dir"
          test "$(git -C "$source_dir" rev-parse HEAD)" = a0215433f07384e4c42fe247525867f11e6f32f7
          cd "$source_dir"
          autoreconf -fi
          CFLAGS="-O2 -std=gnu17" ./configure --prefix="$RUNNER_TEMP/ucblogo-headless" --disable-wx --disable-x11 --disable-docs
          make -j2
          make install
          echo "LOGO_BIN=$RUNNER_TEMP/ucblogo-headless/bin/ucblogo" >> "$GITHUB_ENV"

      - name: Execute bounded k3 Native diagnostic only (not full-k acceptance)
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wide-general-native.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 300s stdbuf -oL -eL "$LOGO_BIN" "$RUNNER_TEMP/wide-general-native.logo" > "$log" 2>&1; then
            cat "$log"
          else
            code=$?
            cat "$log"
            echo "::error::General wide Native failure/timeout exit=$code"
            exit 1
          fi
          grep -Fxq 'WIDE_GENERAL_NATIVE_CASES_PASIS 26' "$log"
          grep -Fxq 'WIDE_GENERAL_NATIVE_CHECKS_PASIS 50' "$log"
          grep -Fxq 'WIDE_GENERAL_NATIVE_PASIS' "$log"
          if grep -Eq 'FALIIS|You don.t say what to do with|I don.t know how to|not enough inputs|doesn.t like' "$log"; then
            echo "::error::Native failure text present"
            exit 1
          fi
          echo 'NATIVE_LOGO_STAGE2_WIDE_GENERAL_K3_DIAGNOSTIC=PASS'

      - name: Preserve exact inputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-stage2-wide-general-native-evidence
          path: |
            ${{ runner.temp }}/wide-general-commit.txt
            ${{ runner.temp }}/wide-general-workflow-blob.txt
            ${{ runner.temp }}/wide-general-git-blobs.txt
            ${{ runner.temp }}/wide-general-source-sha256.txt
            ${{ runner.temp }}/wide-general-host.log
            ${{ runner.temp }}/wide-general-vectors.log
            ${{ runner.temp }}/wide-general-native.logo
            ${{ runner.temp }}/wide-general-native.log
          if-no-files-found: warn
          retention-days: 30
