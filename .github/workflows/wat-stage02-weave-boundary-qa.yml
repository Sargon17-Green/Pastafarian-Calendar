name: WAT Stage02 Independent Weave Boundary QA

on:
  push:
    branches:
      - 'WAT+Español'
    paths:
      - tests/stage02_calendar_weave_independent_oracle.py
      - tests/stage02_calendar_weave_boundary_qa.py
      - .github/workflows/wat-stage02-weave-boundary-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-boundary-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record exact commit and source digests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 --version
          sha256sum tests/stage02_calendar_weave_independent_oracle.py tests/stage02_calendar_weave_boundary_qa.py
      - name: Focused source-fresh independent boundary and mutation QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/wat-weave-boundary
          printf 'PROJECT_ID=PC-BRANCH-WAT-SPANISH\nSHA=%s\nRUN=%s\nATTEMPT=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > evidence/wat-weave-boundary/identity.txt
          sha256sum tests/stage02_calendar_weave_independent_oracle.py tests/stage02_calendar_weave_boundary_qa.py > evidence/wat-weave-boundary/sha256.txt
          python3 -m py_compile tests/stage02_calendar_weave_boundary_qa.py
          python3 tests/stage02_calendar_weave_boundary_qa.py --enumerator-only | tee evidence/wat-weave-boundary/enumeration.json
          python3 tests/stage02_calendar_weave_independent_oracle.py --selftest | tee evidence/wat-weave-boundary/prior-selftest.log
          python3 tests/stage02_calendar_weave_boundary_qa.py | tee evidence/wat-weave-boundary/boundary.json
      - name: Preserve focused QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wat-stage02-weave-boundary-qa
          path: evidence/wat-weave-boundary/
          if-no-files-found: warn
