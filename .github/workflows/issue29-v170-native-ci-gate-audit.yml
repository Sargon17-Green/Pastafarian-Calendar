name: Issue29 v170 native Ada CI gate audit (STATIC ONLY, ZERO F)
on:
  push:
    branches:
      - qa/issue29-ada-native-ci-gates-v170
    paths:
      - '.github/workflows/canonical-names-lock.yml'
      - '.github/workflows/issue29-v170-native-ci-gate-audit.yml'
      - 'tests/issue29_v170_native_ci_gate_audit.py'
permissions:
  contents: read
jobs:
  audit-native-stage-opt-ins:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout QA gate proposal
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm proposal changes only workflow and static audit files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check e17ab44aa3fd1d08eb14644164735a7c5c87721d...HEAD
          python3 -B - <<'PY'
          import json,subprocess
          changed=subprocess.check_output(
              ["git","diff","--name-only",
               "e17ab44aa3fd1d08eb14644164735a7c5c87721d...HEAD"],
              text=True).splitlines()
          allowed={
              ".github/workflows/canonical-names-lock.yml",
              ".github/workflows/issue29-v170-native-ci-gate-audit.yml",
              "tests/issue29_v170_native_ci_gate_audit.py",
          }
          assert set(changed)==allowed, changed
          print(json.dumps({"changed_files":changed,
                            "production_source_changes":0,
                            "native_runner_script_changes":0},indent=2))
          PY
      - name: Parse GitHub workflow YAML syntax without executing workflows
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/canonical-names-lock.yml"); YAML.parse_file(".github/workflows/issue29-v170-native-ci-gate-audit.yml"); puts "V170_YAML_PARSE_PASS_NO_WORKFLOW_EXECUTION"'
      - name: Assert all 41 native-stage opt-in variables are unset or false
        shell: bash
        env:
          ISSUE29_NATIVE_STAGE01_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE01_ENABLED }}
          ISSUE29_NATIVE_STAGE02_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE02_ENABLED }}
          ISSUE29_NATIVE_STAGE03_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE03_ENABLED }}
          ISSUE29_NATIVE_STAGE04_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE04_ENABLED }}
          ISSUE29_NATIVE_STAGE05_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE05_ENABLED }}
          ISSUE29_NATIVE_STAGE06_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE06_ENABLED }}
          ISSUE29_NATIVE_STAGE07_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE07_ENABLED }}
          ISSUE29_NATIVE_STAGE08_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE08_ENABLED }}
          ISSUE29_NATIVE_STAGE09_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE09_ENABLED }}
          ISSUE29_NATIVE_STAGE10_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE10_ENABLED }}
          ISSUE29_NATIVE_STAGE11_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE11_ENABLED }}
          ISSUE29_NATIVE_STAGE12_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE12_ENABLED }}
          ISSUE29_NATIVE_STAGE13_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE13_ENABLED }}
          ISSUE29_NATIVE_STAGE14_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE14_ENABLED }}
          ISSUE29_NATIVE_STAGE15_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE15_ENABLED }}
          ISSUE29_NATIVE_STAGE16_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE16_ENABLED }}
          ISSUE29_NATIVE_STAGE17_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE17_ENABLED }}
          ISSUE29_NATIVE_STAGE18_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE18_ENABLED }}
          ISSUE29_NATIVE_STAGE19_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE19_ENABLED }}
          ISSUE29_NATIVE_STAGE20_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE20_ENABLED }}
          ISSUE29_NATIVE_STAGE21_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE21_ENABLED }}
          ISSUE29_NATIVE_STAGE22_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE22_ENABLED }}
          ISSUE29_NATIVE_STAGE23_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE23_ENABLED }}
          ISSUE29_NATIVE_STAGE24_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE24_ENABLED }}
          ISSUE29_NATIVE_STAGE25_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE25_ENABLED }}
          ISSUE29_NATIVE_STAGE26_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE26_ENABLED }}
          ISSUE29_NATIVE_STAGE27_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE27_ENABLED }}
          ISSUE29_NATIVE_STAGE28_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE28_ENABLED }}
          ISSUE29_NATIVE_STAGE29_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE29_ENABLED }}
          ISSUE29_NATIVE_STAGE30_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE30_ENABLED }}
          ISSUE29_NATIVE_STAGE31_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE31_ENABLED }}
          ISSUE29_NATIVE_STAGE32_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE32_ENABLED }}
          ISSUE29_NATIVE_STAGE33_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE33_ENABLED }}
          ISSUE29_NATIVE_STAGE34_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE34_ENABLED }}
          ISSUE29_NATIVE_STAGE35_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE35_ENABLED }}
          ISSUE29_NATIVE_STAGE36_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE36_ENABLED }}
          ISSUE29_NATIVE_STAGE37_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE37_ENABLED }}
          ISSUE29_NATIVE_STAGE38_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE38_ENABLED }}
          ISSUE29_NATIVE_STAGE39_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE39_ENABLED }}
          ISSUE29_NATIVE_STAGE40_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE40_ENABLED }}
          ISSUE29_NATIVE_STAGE41_ENABLED: ${{ vars.ISSUE29_NATIVE_STAGE41_ENABLED }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          names=[f"ISSUE29_NATIVE_STAGE{i:02d}_ENABLED" for i in range(1,42)]
          active=[name for name in names if os.environ.get(name,"").strip().lower()=="true"]
          if active:
              raise SystemExit("NATIVE OPT-IN IS ACTIVE; QA audit refuses: "+", ".join(active))
          print("V170_ALL_41_NATIVE_STAGE_OPT_INS_UNSET_OR_FALSE_ZERO_F")
          PY
      - name: Audit every native job has a unique default-off repository-variable gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v170_native_ci_gate_audit.py | tee v170-gate-audit.json
          grep -F '"native_job_count": 41' v170-gate-audit.json
          grep -F '"calendar_date_invocations": 0' v170-gate-audit.json
          grep -F '"status": "PASS_STATIC_ONLY_41_NATIVE_JOBS_INDEPENDENTLY_GATED"' v170-gate-audit.json
      - name: Archive static gate audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v170-41-native-stage-gates-static-audit-zero-F
          path: v170-gate-audit.json
          retention-days: 30
          if-no-files-found: warn
