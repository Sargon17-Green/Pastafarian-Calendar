name: Befunge QA Spaghetti04 Native Input Bifurcation
on:
  push:
    branches:
      - 'qa-befunge98-stage1-order-isolation-20261008'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spaghetti04-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify three historical gates and new input-dependent fork
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = "560d6aa5807a7f766213a33835cce85eab0fa40c"
          test "$(git hash-object qa/spaghetti01_interleaved_work_counts_candidate.b98)" = "948cb9332332f6abf35274ecc4be69bbc8c79115"
          test "$(git hash-object qa/spaghetti02_cascade_candidate.b98)" = "471e45cfec818d432cbb8e810204a865f8f04a97"
          test "$(git hash-object qa/spaghetti03_arithmetic_braid_candidate.b98)" = "2baa1795a9a5802f58ecbd87ac8f138a1e811066"
          test "$(git hash-object qa/spaghetti04_input_parity_bifurcation_candidate.b98)" = "e2eb7eec5503c22c6e73fb66aa7f8b9b072c4667"
          echo "SPAGHETTI04_SOURCES_PINNED $(git rev-parse HEAD)"
      - name: Native input parity, actual upper/lower routes, independent references, and arm mutations
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -v "$GITHUB_WORKSPACE:/work:rw" -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" -w /work python:2.7-slim sh -ceu '
            pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
            python qa/stage1_spaghetti04_native.py
          '
      - name: Upload Native evidence including failed cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spaghetti04-native-evidence
          path: |
            spaghetti04_native_receipt.json
            spaghetti04_native_*.tsv
          if-no-files-found: warn
