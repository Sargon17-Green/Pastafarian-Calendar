name: Kotlin bounded signed gate cache inverse differential
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/Post55ProductionGateCacheStateProbe.kt'
      - 'soak/audit_production_gate_cache_state.py'
      - 'soak/test_audit_production_gate_cache_state.py'
      - '.github/workflows/post55-production-gate-cache-inverse.yml'
      - 'soak/independent_year_geometry_oracle.py'
      - 'soak/independent_sauce_oracle.py'
      - 'src/main/kotlin/pastafari/ProductionYearNavigator.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-gate-cache-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify branch, exact SHA and budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'maxGateAbsIndex: Int = 8192' src/main/kotlin/pastafari/ProductionYearNavigator.kt
          grep -Fq 'private const val LIMIT = 8192' soak/Post55ProductionGateCacheStateProbe.kt
          grep -Fq 'maxYearTransitions = 8' soak/Post55ProductionGateCacheStateProbe.kt
          echo 'GATE_CACHE_PINNED_SOURCE_GREEN'
      - name: Synthetic parser, mutation and provenance controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile soak/audit_production_gate_cache_state.py soak/test_audit_production_gate_cache_state.py
          python3 -m unittest discover -s soak -p 'test_audit_production_gate_cache_state.py' -v \
            2>&1 | tee evidence/gate-cache-tests.log
      - name: Install Kotlin compiler 1.9.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip' \
            -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile actual Kotlin production and probe
        shell: bash
        run: |
          set -euo pipefail
          kotlinc src/main/kotlin/pastafari/*.kt soak/Post55ProductionGateCacheStateProbe.kt \
            -include-runtime -d "$RUNNER_TEMP/gate-cache.jar"
          test -s "$RUNNER_TEMP/gate-cache.jar"
          echo 'GATE_CACHE_REAL_PRODUCTION_COMPILED'
      - name: Audit 57 inverse and 57 nongate probes vs 561 unseeded gaps
        shell: bash
        run: |
          set -euo pipefail
          python3 soak/audit_production_gate_cache_state.py \
            --jar "$RUNNER_TEMP/gate-cache.jar" \
            --timeout-seconds 900 \
            --evidence evidence/gate-cache.json \
            2>&1 | tee evidence/gate-cache.log
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-cymraeg-signed-gate-cache-inverse
          path: evidence/gate-cache*
          if-no-files-found: warn
          retention-days: 30
