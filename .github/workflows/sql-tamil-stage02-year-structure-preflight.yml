name: SQL Tamil Slice25 Calendar Date Feasibility PG17
on:
  push:
    branches: ['SQL\+தமிழ்']
    paths:
      - 'sql/test/146_stage25_calendar_date_preflight.sql'
      - 'sql/test/150_stage25_calendar_date_oracle.py'
      - '.github/workflows/sql-tamil-stage02-year-structure-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar-date-preflight:
    strategy:
      fail-fast: false
      matrix:
        year_case: [anchor, next_1, next_2, next_3, prev_2, prev_3, prev_3_prev, next_3_next]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YEAR_CASE: ${{ matrix.year_case }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Exact source lock and independent Python self-test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p slice25-preflight-evidence
          printf 'Git SHA: %s\n' "$GITHUB_SHA" > slice25-preflight-evidence/versions.txt
          python3 --version | tee -a slice25-preflight-evidence/versions.txt
          python3 sql/test/150_stage25_calendar_date_oracle.py --self-test | tee slice25-preflight-evidence/python-self-test.txt
          grep -q '^slice25_selftest_cutlet_days=.* PASS$' slice25-preflight-evidence/python-self-test.txt
          grep -q '^slice25_selftest_month_positions=.* PASS$' slice25-preflight-evidence/python-self-test.txt
          sha256sum sql/test/146_stage25_calendar_date_preflight.sql sql/test/150_stage25_calendar_date_oracle.py sql/test/142_stage02_year_structure_cases.sql > slice25-preflight-evidence/source-sha256.txt
          sha256sum .github/workflows/sql-tamil-stage02-year-structure-preflight.yml >> slice25-preflight-evidence/source-sha256.txt
          for i in $(seq -w 0 26); do
            path=$(find sql -maxdepth 1 -name "$i"'_*.sql' -print)
            test "$(printf '%s\n' "$path" | wc -l)" -eq 1
            test -f "$path"
            sha256sum "$path" >> slice25-preflight-evidence/source-sha256.txt
          done
      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name slice25-preflight-pg --network none -e POSTGRES_HOST_AUTH_METHOD=trust -v "$GITHUB_WORKSPACE:/work:ro" postgres:17
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres slice25-preflight-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres slice25-preflight-pg postgres --version | tee -a slice25-preflight-evidence/versions.txt
      - name: Run bounded year and target-day discovery for ${{ matrix.year_case }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o '__YEAR_CASE__' sql/test/146_stage25_calendar_date_preflight.sql | wc -l)" -eq 3
          sed "s/__YEAR_CASE__/$YEAR_CASE/g" sql/test/146_stage25_calendar_date_preflight.sql > slice25-preflight-evidence/preflight.sql
          sha256sum slice25-preflight-evidence/preflight.sql > slice25-preflight-evidence/generated-sha256.txt
          args=()
          for i in $(seq -w 0 26); do
            path=$(find sql -maxdepth 1 -name "$i"'_*.sql' -print)
            args+=(-f "/work/$path")
          done
          args+=(-f /work/sql/test/142_stage02_year_structure_cases.sql)
          args+=(-f /work/slice25-preflight-evidence/preflight.sql)
          docker exec -u postgres slice25-preflight-pg psql -At -X -v ON_ERROR_STOP=1 -U postgres -d postgres "${args[@]}" 2>&1 | tee slice25-preflight-evidence/postgres-results.txt
          grep -qx 'SLICE25_STRUCTURAL_PREFLIGHT_GREEN=1' slice25-preflight-evidence/postgres-results.txt
          grep '^SLICE25_YEAR_JSON ' slice25-preflight-evidence/postgres-results.txt | sed 's/^SLICE25_YEAR_JSON //' > slice25-preflight-evidence/year.jsonl
          grep '^SLICE25_CASE_JSON ' slice25-preflight-evidence/postgres-results.txt | sed 's/^SLICE25_CASE_JSON //' > slice25-preflight-evidence/cases.jsonl
          grep '^SLICE25_CATALOG_JSON ' slice25-preflight-evidence/postgres-results.txt | sed 's/^SLICE25_CATALOG_JSON //' > slice25-preflight-evidence/catalog.jsonl
          test "$(wc -l < slice25-preflight-evidence/year.jsonl)" -eq 1
          test "$(wc -l < slice25-preflight-evidence/catalog.jsonl)" -eq 64
          case "$YEAR_CASE" in
            anchor) expected=6 ;;
            next_1) expected=5 ;;
            *) expected=3 ;;
          esac
          test "$(wc -l < slice25-preflight-evidence/cases.jsonl)" -eq "$expected"
          python3 sql/test/150_stage25_calendar_date_oracle.py --year-file slice25-preflight-evidence/year.jsonl --cases-file slice25-preflight-evidence/cases.jsonl --catalog-file slice25-preflight-evidence/catalog.jsonl --output slice25-preflight-evidence/oracle.jsonl --self-test | tee slice25-preflight-evidence/oracle-results.txt
          test "$(wc -l < slice25-preflight-evidence/oracle.jsonl)" -eq "$expected"
          grep -qx "slice25_oracle_cases=$expected PASS" slice25-preflight-evidence/oracle-results.txt
          sha256sum slice25-preflight-evidence/year.jsonl slice25-preflight-evidence/cases.jsonl slice25-preflight-evidence/catalog.jsonl slice25-preflight-evidence/oracle.jsonl > slice25-preflight-evidence/derived-sha256.txt
      - name: Preserve original preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-tamil-slice25-preflight-${{ matrix.year_case }}
          path: slice25-preflight-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop PostgreSQL 17
        if: always()
        shell: bash
        run: docker rm -f slice25-preflight-pg 2>/dev/null || true
