name: MATLAB Stage55 Fifty First Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_fifty_first_native.m'
      - 'tools/stage55_after51_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-fifty-first-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-fifty-first-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  fifty-first-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER50 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-fiftieth-day-differential
          run-id: 44828169868
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER50
        run: |
          echo '276420365e0bba4528eaa8b3ea70112577fc057a5fb5c3e3da51afde7a211039  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_50.json' | sha256sum -c -
      - name: Preflight AFTER51 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after51_interval_five_fields.py
          grep -Fqx 'PIN = "276420365e0bba4528eaa8b3ea70112577fc057a5fb5c3e3da51afde7a211039"' tools/stage55_after51_interval_five_fields.py
          python3 -m py_compile tools/stage55_after51_interval_five_fields.py
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_50.json' tools/run_stage55_year5000_fifty_first_native.m
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_51.json' tools/run_stage55_year5000_fifty_first_native.m
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native fifty-first-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_fifty_first_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after51_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_50.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_51.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_FIFTY_FIRST_PYTHON.log
          grep '^STAGE55_FIFTY_FIRST_ROW ' logs/STAGE55_FIFTY_FIRST_PYTHON.log > logs/STAGE55_FIFTY_FIRST_PYTHON_ROW.txt
          grep '^STAGE55_FIFTY_FIRST_ROW ' logs/STAGE55_FIFTY_FIRST_NATIVE.log > logs/STAGE55_FIFTY_FIRST_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_FIFTY_FIRST_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_FIFTY_FIRST_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_FIFTY_FIRST_PYTHON_ROW.txt logs/STAGE55_FIFTY_FIRST_NATIVE_ROW.txt
          expected="STAGE55_FIFTY_FIRST_ROW POSITION=51 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=51 MONTH_INDEX=44 MONTH_DAY=1"
          grep -Fqx "$expected" logs/STAGE55_FIFTY_FIRST_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_FIFTY_FIRST_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_51.json | tee logs/STAGE55_FIFTY_FIRST_DIGEST.txt
          echo 'STAGE55_FIFTY_FIRST_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-fifty-first-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_50.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_51.json
            logs/STAGE55_FIFTY_FIRST_NATIVE.log
            logs/STAGE55_FIFTY_FIRST_PYTHON.log
            logs/STAGE55_FIFTY_FIRST_PYTHON_ROW.txt
            logs/STAGE55_FIFTY_FIRST_NATIVE_ROW.txt
            logs/STAGE55_FIFTY_FIRST_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
