name: Verificacion complet — JavaScript + Interlingue

on:
  push:
    branches:
      - 'JavaScript\+Interlingue'
  pull_request:
    branches:
      - 'JavaScript\+Interlingue'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javascript-interlingue-full-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'

jobs:
  historical-stages:
    name: Historic — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Stage 01–08
            artifact: stages-01-08
            command: |
              node tests/run-tests.js
              node tests/verify-stage-01.js
              for n in $(seq -f '%02g' 1 8); do
                node "tests/discovery-${n}.js"
                node "tests/patch-${n}.js"
              done
          - label: Stage 09–16
            artifact: stages-09-16
            command: |
              for n in $(seq -f '%02g' 9 16); do
                node "tests/discovery-${n}.js"
                node "tests/patch-${n}.js"
              done
          - label: Stage 17–26
            artifact: stages-17-26
            command: |
              for n in $(seq -f '%02g' 17 26); do
                node "tests/discovery-${n}.js"
                node "tests/patch-${n}.js"
              done
          - label: Integration 54
            artifact: integration-54
            command: |
              node tests/integration-54.js
          - label: Audit 55 core
            artifact: audit-55-core
            command: |
              node tests/final-audit-55.js
          - label: Audit 55 E2E
            artifact: audit-55-e2e
            command: |
              node tests/final-audit-55-e2e.js
          - label: Audit 55 crossing
            artifact: audit-55-cross
            command: |
              node tests/final-audit-55-cross.js
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Verificar que null HANDOFF es trackat
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)HANDOFF_' ; then
            echo 'ERRORE: un file HANDOFF_* es trackat in li repository.' >&2
            exit 1
          fi
          echo 'HANDOFF_TRACKED=NO'

      - name: Executer ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "SHARD=${{ matrix.artifact }}"
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            ${{ matrix.command }}
            echo "RESULT=PASS"
          } 2>&1 | tee "logs/${{ matrix.artifact }}.log"

      - name: Conservar li log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-${{ matrix.artifact }}
          path: logs/${{ matrix.artifact }}.log
          if-no-files-found: error
          retention-days: 30

  corrective-56:
    name: Corrective 56 — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Core e 12 post-stirs
            artifact: stage-56-core
            command: node tests/stage-56-corrective.js
          - label: Foundation
            artifact: stage-56-foundation
            command: node tests/stage-56-e2e-foundation.js
          - label: Near-Foundation crossing
            artifact: stage-56-near-foundation
            command: node tests/stage-56-e2e-near-foundation.js
          - label: Witnesses canonical extern
            artifact: stage-56-reference
            command: node tests/stage-56-e2e-reference.js
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Executer ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "SHARD=${{ matrix.artifact }}"
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            ${{ matrix.command }}
            echo "RESULT=PASS"
          } 2>&1 | tee "logs/${{ matrix.artifact }}.log"

      - name: Conservar li log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-${{ matrix.artifact }}
          path: logs/${{ matrix.artifact }}.log
          if-no-files-found: error
          retention-days: 30


  corrective-57:
    name: Corrective 57 — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Core e Patch 26 ghost
            artifact: stage-57-core
            command: node tests/stage-57-corrective.js
          - label: Witness del differential extern
            artifact: stage-57-reference
            command: node tests/stage-57-e2e-reference.js
          - label: Scar historic Stage 56
            artifact: stage-57-historical-scar
            command: node tests/stage-57-historical-scar.js
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Executer ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "SHARD=${{ matrix.artifact }}"
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            ${{ matrix.command }}
            echo "RESULT=PASS"
          } 2>&1 | tee "logs/${{ matrix.artifact }}.log"

      - name: Conservar li log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-${{ matrix.artifact }}
          path: logs/${{ matrix.artifact }}.log
          if-no-files-found: error
          retention-days: 30

  acceleration-58:
    name: Acceleration 58 — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Scar memorativ e equivalence
            artifact: stage-58-acceleration
            command: node tests/stage-58-acceleration.js
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Executer ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "SHARD=${{ matrix.artifact }}"
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            ${{ matrix.command }}
            echo "RESULT=PASS"
          } 2>&1 | tee "logs/${{ matrix.artifact }}.log"

      - name: Conservar li log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-${{ matrix.artifact }}
          path: logs/${{ matrix.artifact }}.log
          if-no-files-found: error
          retention-days: 30

  complete-branch:
    name: Branche complet GREEN
    if: always()
    needs:
      - historical-stages
      - corrective-56
      - corrective-57
      - acceleration-58
    runs-on: ubuntu-latest
    steps:
      - name: Exiger omni shards GREEN
        shell: bash
        run: |
          set -euo pipefail
          echo "historical-stages=${{ needs.historical-stages.result }}"
          echo "corrective-56=${{ needs.corrective-56.result }}"
          echo "corrective-57=${{ needs.corrective-57.result }}"
          echo "acceleration-58=${{ needs.acceleration-58.result }}"
          test "${{ needs.historical-stages.result }}" = "success"
          test "${{ needs.corrective-56.result }}" = "success"
          test "${{ needs.corrective-57.result }}" = "success"
          test "${{ needs.acceleration-58.result }}" = "success"
          echo 'JAVASCRIPT_INTERLINGUE_BRANCH=GREEN'


  phase-a-visual-qa:
    name: Phase A — visual assertions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Constructer li browser artefact
        run: |
          set -euo pipefail
          node tests/verify-stage-01.js
          node tests/browser-interface-all.js
          node scripts/build-browser.js
          node tests/browser-built-artifacts.js

      - name: Preparar Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-a-qa"
          cd "$RUNNER_TEMP/phase-a-qa"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Provar visualmen li Phase A
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/phase-a-site"
          rm -rf "$SITE"
          mkdir -p "$SITE/dist"
          cp browser/dist/index.html "$SITE/index.html"
          cp browser/dist/pastafari-date.js "$SITE/dist/pastafari-date.js"
          cp browser/dist/pastafari-worker.js "$SITE/dist/pastafari-worker.js"
          cp browser/dist/pastafari-date.mjs "$SITE/dist/pastafari-date.mjs"
          cp browser/dist/build-id.txt "$SITE/dist/build-id.txt"
          cd "$SITE"
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/phase-a-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          cd "$RUNNER_TEMP/phase-a-qa"
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out, { recursive: true });
          const base = 'http://127.0.0.1:4173/';

          const profiles = [
            {name:'desktop1440', width:1440, height:1000, mobile:false},
            {name:'tablet1024', width:1024, height:1366, mobile:false},
            {name:'tablet800', width:800, height:1280, mobile:false},
            {name:'tablet768', width:768, height:1024, mobile:false},
            {name:'mobile390', width:390, height:844, mobile:true},
            {name:'mobile320', width:320, height:740, mobile:true},
          ];

          async function waitReady(page) {
            await page.waitForFunction(() => {
              const host = document.querySelector('pastafari-date');
              const cal = host?.shadowRoot?.querySelector('.calendar');
              return !!cal && !cal.hasAttribute('data-state');
            }, null, {timeout:180000});
            await page.waitForTimeout(1000);
          }

          function assert(cond, msg) {
            if (!cond) throw new Error(msg);
          }

          async function inspect(page) {
            return page.evaluate(() => {
              const host = document.querySelector('pastafari-date');
              const s = host.shadowRoot;
              const viewport = s.querySelector('.viewport');
              const current = s.querySelector('.day[aria-current="date"]');
              const heading = s.querySelector('.cutlet-heading');
              const vr = viewport.getBoundingClientRect();
              const cr = current?.getBoundingClientRect();
              return {
                bodyClientWidth: document.documentElement.clientWidth,
                bodyScrollWidth: document.documentElement.scrollWidth,
                viewportClientWidth: viewport.clientWidth,
                viewportScrollWidth: viewport.scrollWidth,
                viewportRect:{left:vr.left,right:vr.right,top:vr.top,bottom:vr.bottom},
                current:cr?{left:cr.left,right:cr.right,top:cr.top,bottom:cr.bottom}:null,
                headingPosition:heading?getComputedStyle(heading).position:null
              };
            });
          }

          async function layout(browser,p) {
            const ctx=await browser.newContext({
              viewport:{width:p.width,height:p.height},locale:'he-IL',
              isMobile:p.mobile,hasTouch:p.mobile,deviceScaleFactor:1
            });
            const page=await ctx.newPage();
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await waitReady(page);
            const d=await inspect(page);
            assert(d.bodyScrollWidth<=d.bodyClientWidth+1,p.name+': body horizontal overflow');
            assert(d.viewportScrollWidth<=d.viewportClientWidth+1,p.name+': calendar horizontal overflow');
            assert(d.headingPosition==='static',p.name+': cutlet heading still sticky');
            if(d.current){
              assert(d.current.left>=d.viewportRect.left-1,p.name+': selected card clipped at inline start');
              assert(d.current.right<=d.viewportRect.right+1,p.name+': selected card clipped at inline end');
            }
            fs.writeFileSync(path.join(out,p.name+'__info.json'),JSON.stringify(d,null,2));
            await page.screenshot({path:path.join(out,p.name+'__ready.png'),fullPage:true});
            await page.locator('.viewport').screenshot({path:path.join(out,p.name+'__calendar.png')});
            await ctx.close();
          }

          async function bidi(browser,code,locale) {
            const ctx=await browser.newContext({viewport:{width:390,height:844},locale});
            const page=await ctx.newPage();
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await waitReady(page);
            await page.locator('.language-selector').selectOption(code);
            await page.waitForTimeout(300);
            const d=await page.evaluate(()=>{
              const s=document.querySelector('pastafari-date').shadowRoot;
              const context=s.querySelector('.beacon-context');
              return {
                text:context.innerText,
                dir:document.querySelector('pastafari-date').getAttribute('dir'),
                iso:[...context.querySelectorAll('bdi.iso-date')].map(n=>({
                  text:n.textContent,dir:n.getAttribute('dir'),whiteSpace:getComputedStyle(n).whiteSpace
                }))
              };
            });
            assert(d.iso.length===2,code+': expected two isolated ISO dates');
            for(const x of d.iso){
              assert(/^\d{4}-\d{2}-\d{2}$/.test(x.text),code+': malformed ISO '+x.text);
              assert(x.dir==='ltr',code+': ISO is not dir=ltr');
              assert(x.whiteSpace==='nowrap',code+': ISO may wrap');
            }
            fs.writeFileSync(path.join(out,'bidi_'+code+'.json'),JSON.stringify(d,null,2));
            await page.screenshot({path:path.join(out,'bidi_'+code+'.png'),fullPage:true});
            await ctx.close();
          }

          async function errorState(browser,p) {
            const ctx=await browser.newContext({
              viewport:{width:p.width,height:p.height},locale:'he-IL',
              isMobile:p.mobile,hasTouch:p.mobile,deviceScaleFactor:1
            });
            const page=await ctx.newPage();
            await page.route('**/pastafari-worker.js*',r=>r.abort());
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>{
              const s=document.querySelector('pastafari-date')?.shadowRoot;
              return s?.querySelector('.calendar')?.getAttribute('data-state')==='error';
            },null,{timeout:90000});
            const d=await page.evaluate(()=>{
              const s=document.querySelector('pastafari-date').shadowRoot;
              const box=s.querySelector('.overlay.error');
              const title=s.querySelector('.error-title');
              const msg=s.querySelector('.error-message');
              const button=s.querySelector('.retry-button');
              const r=n=>{const x=n.getBoundingClientRect();return {top:x.top,bottom:x.bottom,left:x.left,right:x.right};};
              return {box:r(box),title:r(title),message:r(msg),button:r(button)};
            });
            assert(d.title.top<=d.message.top,p.name+': error title follows message');
            assert(d.message.top<=d.button.top,p.name+': retry precedes message');
            assert(d.button.left>=d.box.left-1 && d.button.right<=d.box.right+1,p.name+': retry outside error panel');
            fs.writeFileSync(path.join(out,p.name+'__error_info.json'),JSON.stringify(d,null,2));
            await page.screenshot({path:path.join(out,p.name+'__error.png'),fullPage:true});
            await ctx.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles) await layout(browser,p);
            await bidi(browser,'he','he-IL');
            await bidi(browser,'ar','ar');
            await errorState(browser,profiles[0]);
            await errorState(browser,profiles[4]);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.js

      - name: Conservar li Phase A visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-visual-qa
          path: ${{ runner.temp }}/phase-a-qa/out
          if-no-files-found: warn
          retention-days: 14
