name: Verificacion complet — JavaScript + Interlingue

on:
  push:
    branches:
      - 'JavaScript\+Interlingue'
  pull_request:
    branches:
      - 'JavaScript\+Interlingue'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javascript-interlingue-full-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'

jobs:
  historical-stages:
    name: Historic — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Stage 01–08
            artifact: stages-01-08
            command: |
              node tests/run-tests.js
              node tests/verify-stage-01.js
              for n in $(seq -f '%02g' 1 8); do
                node "tests/discovery-${n}.js"
                node "tests/patch-${n}.js"
              done
          - label: Stage 09–16
            artifact: stages-09-16
            command: |
              for n in $(seq -f '%02g' 9 16); do
                node "tests/discovery-${n}.js"
                node "tests/patch-${n}.js"
              done
          - label: Stage 17–26
            artifact: stages-17-26
            command: |
              for n in $(seq -f '%02g' 17 26); do
                node "tests/discovery-${n}.js"
                node "tests/patch-${n}.js"
              done
          - label: Integration 54
            artifact: integration-54
            command: |
              node tests/integration-54.js
          - label: Audit 55 core
            artifact: audit-55-core
            command: |
              node tests/final-audit-55.js
          - label: Audit 55 E2E
            artifact: audit-55-e2e
            command: |
              node tests/final-audit-55-e2e.js
          - label: Audit 55 crossing
            artifact: audit-55-cross
            command: |
              node tests/final-audit-55-cross.js
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Verificar que null HANDOFF es trackat
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)HANDOFF_' ; then
            echo 'ERRORE: un file HANDOFF_* es trackat in li repository.' >&2
            exit 1
          fi
          echo 'HANDOFF_TRACKED=NO'

      - name: Executer ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "SHARD=${{ matrix.artifact }}"
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            ${{ matrix.command }}
            echo "RESULT=PASS"
          } 2>&1 | tee "logs/${{ matrix.artifact }}.log"

      - name: Conservar li log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-${{ matrix.artifact }}
          path: logs/${{ matrix.artifact }}.log
          if-no-files-found: error
          retention-days: 30

  corrective-56:
    name: Corrective 56 — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Core e 12 post-stirs
            artifact: stage-56-core
            command: node tests/stage-56-corrective.js
          - label: Foundation
            artifact: stage-56-foundation
            command: node tests/stage-56-e2e-foundation.js
          - label: Near-Foundation crossing
            artifact: stage-56-near-foundation
            command: node tests/stage-56-e2e-near-foundation.js
          - label: Witnesses canonical extern
            artifact: stage-56-reference
            command: node tests/stage-56-e2e-reference.js
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Executer ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "SHARD=${{ matrix.artifact }}"
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            ${{ matrix.command }}
            echo "RESULT=PASS"
          } 2>&1 | tee "logs/${{ matrix.artifact }}.log"

      - name: Conservar li log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-${{ matrix.artifact }}
          path: logs/${{ matrix.artifact }}.log
          if-no-files-found: error
          retention-days: 30


  corrective-57:
    name: Corrective 57 — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Core e Patch 26 ghost
            artifact: stage-57-core
            command: node tests/stage-57-corrective.js
          - label: Witness del differential extern
            artifact: stage-57-reference
            command: node tests/stage-57-e2e-reference.js
          - label: Scar historic Stage 56
            artifact: stage-57-historical-scar
            command: node tests/stage-57-historical-scar.js
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Executer ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "SHARD=${{ matrix.artifact }}"
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            ${{ matrix.command }}
            echo "RESULT=PASS"
          } 2>&1 | tee "logs/${{ matrix.artifact }}.log"

      - name: Conservar li log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-${{ matrix.artifact }}
          path: logs/${{ matrix.artifact }}.log
          if-no-files-found: error
          retention-days: 30

  acceleration-58:
    name: Acceleration 58 — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Scar memorativ e equivalence
            artifact: stage-58-acceleration
            command: node tests/stage-58-acceleration.js
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Executer ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "SHARD=${{ matrix.artifact }}"
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            ${{ matrix.command }}
            echo "RESULT=PASS"
          } 2>&1 | tee "logs/${{ matrix.artifact }}.log"

      - name: Conservar li log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-interlingue-${{ matrix.artifact }}
          path: logs/${{ matrix.artifact }}.log
          if-no-files-found: error
          retention-days: 30

  complete-branch:
    name: Branche complet GREEN
    if: always()
    needs:
      - historical-stages
      - corrective-56
      - corrective-57
      - acceleration-58
    runs-on: ubuntu-latest
    steps:
      - name: Exiger omni shards GREEN
        shell: bash
        run: |
          set -euo pipefail
          echo "historical-stages=${{ needs.historical-stages.result }}"
          echo "corrective-56=${{ needs.corrective-56.result }}"
          echo "corrective-57=${{ needs.corrective-57.result }}"
          echo "acceleration-58=${{ needs.acceleration-58.result }}"
          test "${{ needs.historical-stages.result }}" = "success"
          test "${{ needs.corrective-56.result }}" = "success"
          test "${{ needs.corrective-57.result }}" = "success"
          test "${{ needs.acceleration-58.result }}" = "success"
          echo 'JAVASCRIPT_INTERLINGUE_BRANCH=GREEN'


  phase-d-hierarchy-visual-qa:
    name: Phase D — hierarchy visual assertions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Extraer li repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Constructer li browser artefact
        run: |
          set -euo pipefail
          node tests/verify-stage-01.js
          node tests/browser-interface-all.js
          node scripts/build-browser.js
          node tests/browser-built-artifacts.js

      - name: Preparar Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-qa"
          cd "$RUNNER_TEMP/phase-d-qa"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Provar visualmen li hierarchy
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/phase-d-site"
          rm -rf "$SITE"
          mkdir -p "$SITE/dist"
          cp browser/dist/index.html "$SITE/index.html"
          cp browser/dist/pastafari-date.js "$SITE/dist/pastafari-date.js"
          cp browser/dist/pastafari-worker.js "$SITE/dist/pastafari-worker.js"
          cp browser/dist/pastafari-date.mjs "$SITE/dist/pastafari-date.mjs"
          cp browser/dist/build-id.txt "$SITE/dist/build-id.txt"
          cd "$SITE"
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/phase-d-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          cd "$RUNNER_TEMP/phase-d-qa"
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out,{recursive:true});
          const base='http://127.0.0.1:4173/';
          const profiles=[
            {name:'w1440_en',width:1440,height:1000,locale:'en-US',lang:'en'},
            {name:'w1024_he',width:1024,height:900,locale:'he-IL',lang:'he'},
            {name:'w800_ar',width:800,height:1000,locale:'ar',lang:'ar'},
            {name:'w768_de',width:768,height:1000,locale:'de-DE',lang:'de'},
            {name:'w390_ru',width:390,height:844,locale:'ru-RU',lang:'ru'},
            {name:'w320_he',width:320,height:740,locale:'he-IL',lang:'he'},
          ];
          function assert(v,m){ if(!v) throw new Error(m); }
          async function waitReady(page){
            await page.waitForFunction(()=>{
              const s=document.querySelector('pastafari-date')?.shadowRoot;
              const c=s?.querySelector('.calendar');
              return !!c && !c.hasAttribute('data-state');
            },null,{timeout:180000});
            await page.waitForTimeout(700);
          }
          async function measure(page){
            return page.evaluate(()=>{
              const host=document.querySelector('pastafari-date');
              const s=host.shadowRoot;
              const rect=(el)=>{const r=el.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height};};
              const cards=[...s.querySelectorAll('.day')];
              const selected=s.querySelector('.day[aria-current="date"]');
              const selectedStyle=selected?getComputedStyle(selected):null;
              const beacon=s.querySelector('.target-beacon');
              const beaconStyle=getComputedStyle(beacon);
              const search=s.querySelector('.search-panel');
              const masthead=s.querySelector('.masthead');
              const title=s.querySelector('.app-title');
              const lang=s.querySelector('.language-control');
              const clipping=cards.map((card,i)=>({
                i,
                cw:card.clientWidth,sw:card.scrollWidth,
                ch:card.clientHeight,sh:card.scrollHeight,
                text:card.innerText.slice(0,160)
              })).filter(x=>x.sw>x.cw+2 || x.sh>x.ch+2);
              const lineStyles=cards.length?[...cards[0].querySelectorAll('.day-line')].map(el=>{
                const cs=getComputedStyle(el);return {borderTopWidth:cs.borderTopWidth,boxShadow:cs.boxShadow,background:cs.backgroundColor};
              }):[];
              return {
                viewport:{w:innerWidth,h:innerHeight},
                body:{clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth},
                masthead:rect(masthead),
                title:rect(title),
                language:rect(lang),
                search:rect(search),
                beacon:rect(beacon),
                beaconBackground:beaconStyle.backgroundColor,
                beaconBorderTop:beaconStyle.borderTopWidth,
                cards:cards.length,
                firstCard:cards[0]?rect(cards[0]):null,
                clipping,
                selected:selected?rect(selected):null,
                selectedOutline:selectedStyle?selectedStyle.outlineStyle:null,
                selectedBorder:selectedStyle?selectedStyle.borderTopWidth:null,
                lineStyles,
              };
            });
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles){
              const ctx=await browser.newContext({viewport:{width:p.width,height:p.height},locale:p.locale,deviceScaleFactor:1});
              const page=await ctx.newPage();
              await page.goto(base,{waitUntil:'domcontentloaded'});
              await waitReady(page);
              await page.evaluate((lang)=>document.querySelector('pastafari-date').setAttribute('lang',lang),p.lang);
              await page.waitForTimeout(350);
              const m=await measure(page);
              fs.writeFileSync(path.join(out,p.name+'.json'),JSON.stringify(m,null,2));
              assert(m.body.scrollWidth<=m.body.clientWidth+1,p.name+': document horizontal overflow');
              assert(m.cards>0 && m.cards<=28,p.name+': invalid rendered day count '+m.cards);
              assert(m.clipping.length===0,p.name+': clipped day-card content: '+JSON.stringify(m.clipping.slice(0,3)));
              assert(m.search.width<=Math.min(m.viewport.w,1088)+2,p.name+': search card is not bounded');
              assert(m.beaconBackground!=='rgb(255, 234, 0)',p.name+': old saturated yellow beacon returned');
              assert(m.selectedOutline==='none',p.name+': selected day still uses an outline ring');
              assert(m.selectedBorder==='3px',p.name+': selected day border is not the quiet 3px treatment');
              for(const ls of m.lineStyles){
                assert(ls.boxShadow==='none',p.name+': nested day-line shadow returned');
              }
              if(p.width>=1024) assert(m.title.height<190,p.name+': masthead title is still excessively tall');
              await page.screenshot({path:path.join(out,p.name+'__full.png'),fullPage:true});
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.js

      - name: Conservar li Phase D visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-d-hierarchy-visual-qa
          path: ${{ runner.temp }}/phase-d-qa/out
          if-no-files-found: warn
          retention-days: 14
