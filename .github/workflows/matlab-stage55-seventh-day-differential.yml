name: MATLAB Stage55 Seventh Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_seventh_native.m'
      - 'tools/stage55_after7_interval_five_fields.py'
      - '.github/workflows/matlab-stage55-seventh-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-seventh-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  seventh-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER6 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-sixth-day-differential
          run-id: 41187038328
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER6
        run: |
          echo '7de267336d74c76ec9d2dcbc4134e261994dbe0f2688076f0d5310c0673d336a  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_6.json' | sha256sum -c -
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native seventh-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_seventh_native
      - name: Python exact child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after7_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_6.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_7.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_SEVENTH_PYTHON.log
          grep '^STAGE55_SEVENTH_ROW ' logs/STAGE55_SEVENTH_PYTHON.log > logs/STAGE55_SEVENTH_PYTHON_ROW.txt
          grep '^STAGE55_SEVENTH_ROW ' logs/STAGE55_SEVENTH_NATIVE.log > logs/STAGE55_SEVENTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_SEVENTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_SEVENTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_SEVENTH_PYTHON_ROW.txt logs/STAGE55_SEVENTH_NATIVE_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_7.json | tee logs/STAGE55_SEVENTH_DIGEST.txt
          echo 'STAGE55_SEVENTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-seventh-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_6.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_7.json
            logs/STAGE55_SEVENTH_NATIVE.log
            logs/STAGE55_SEVENTH_PYTHON.log
            logs/STAGE55_SEVENTH_PYTHON_ROW.txt
            logs/STAGE55_SEVENTH_NATIVE_ROW.txt
            logs/STAGE55_SEVENTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
