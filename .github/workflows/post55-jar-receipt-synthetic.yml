name: Post55 prospective JAR receipt synthetic QA
on:
  push:
    branches: ['Kotlin+Cymraeg']
    paths:
      - 'soak/post55_jar_byte_receipt.py'
      - '.github/workflows/post55-jar-receipt-synthetic.yml'
permissions:
  contents: read
jobs:
  synthetic-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exact-source synthetic controls only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/jar-receipt
          git rev-parse HEAD | tee evidence/jar-receipt/source-sha.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum soak/post55_jar_byte_receipt.py | tee evidence/jar-receipt/parser-sha256.txt
          timeout 120s python3 soak/post55_jar_byte_receipt.py --self-test 2>&1 | tee evidence/jar-receipt/synthetic-tests.log
          python3 soak/post55_jar_byte_receipt.py --historical | tee evidence/jar-receipt/historical.json
          python3 -c 'import json; d=json.load(open("evidence/jar-receipt/historical.json")); assert d["BYTE_BINDING"] == d["CI_PROCESS_OBSERVATION"] == "NOT_ASSESSED" and d["OS_ATTESTATION"] is False'
          printf 'SYNTHETIC_ONLY; NO_PRODUCER; NO_NATIVE; NO_CERTIFICATION\n' | tee evidence/jar-receipt/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post55-jar-receipt-synthetic
          path: evidence/jar-receipt/
          if-no-files-found: error
