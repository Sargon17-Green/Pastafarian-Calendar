name: TEMP live stage guide Chromium QA

on:
  push:
    branches:
      - 'fix/live-stage-guide-sync-retained'

permissions:
  contents: read

concurrency:
  group: temp-live-stage-guide-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'

jobs:
  chromium-real-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build browser bundle
        run: node scripts/build-browser.js
      - name: Run targeted browser component regressions
        run: |
          node tests/browser-cooking-component.js
          node tests/browser-i18n-locales.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare Pages site
        run: |
          node scripts/prepare-pages-site.js _site
          cat > _site/live-stage-qa.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"></head><body>
          <pastafari-date lang="he" date="2026-09-11" calculation-date="2026-09-11"></pastafari-date>
          <script src="./dist/pastafari-date.js"></script>
          </body></html>
          EOF
      - name: Serve built site
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/pastafari-http.log 2>&1 &
          echo $! > /tmp/pastafari-http.pid
      - name: Run real live-stage probe
        run: node scripts/qa-live-stage-guide-playwright.js
      - name: Upload temporary visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stage-guide-visual-qa
          if-no-files-found: warn
          retention-days: 3
          path: qa-artifacts/live-stage-guide/
