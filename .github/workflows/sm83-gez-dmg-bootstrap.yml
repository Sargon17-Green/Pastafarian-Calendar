name: SM83 DMG bootstrap

on:
  push:
    branches:
      - 'SM83-Assembly+ግዕዝ'
  pull_request:

permissions:
  contents: read

jobs:
  dmg-native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build real SM83 ROM using official RGBDS container
        run: |
          docker run --rm --mount type=bind,src="$PWD",dst=/work \
            -w /work ghcr.io/gbdev/rgbds:v1.0.4 \
            sh -c 'make build'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only emulator
        run: python -m pip install 'pyboy>=2,<3'
      - name: Verify DMG ROM and execute SM83 arithmetic smoke tests
        run: python tests/test_rom.py build/calendar.gb
