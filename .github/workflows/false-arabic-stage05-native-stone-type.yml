name: FALSE Arabic Stage 5 stone type exact-source Native

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-native-stone-type:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PROJECT_ID: PC-BRANCH-FALSE-ARABIC
      SOURCE_PIN: 2dd1003a2ecaf457e29baad038b5f89e8d9ea2fb
      RUNTIME_PIN: eb3135565a8670cced3f6bbca4dbf7b014c45634
      COMBINED_SHA256: 12a92dcb790cd79f72bf1aa9f36c2f03cb99c0a013f27a277bdef5d4dc7a31d8
      FIXTURE_SHA256: 269af91c68a4e16829f2e97ea513f37b5b820a81146b2f5fff798917d88a4ea2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch immutable source and original interpreter
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence upstream
          git fetch --no-tags --depth=1 origin "$SOURCE_PIN" > evidence/project_fetch.log 2>&1
          git rev-parse FETCH_HEAD > evidence/source_observed.txt
          test "$(cat evidence/source_observed.txt)" = "$SOURCE_PIN"
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/ianjray/false.git
          git -C upstream fetch --no-tags --depth=1 origin "$RUNTIME_PIN" > evidence/runtime_fetch.log 2>&1
          git -C upstream rev-parse FETCH_HEAD > evidence/runtime_observed.txt
          test "$(cat evidence/runtime_observed.txt)" = "$RUNTIME_PIN"
          git -C upstream checkout -q --detach "$RUNTIME_PIN"
          test -z "$(git -C upstream status --porcelain)"

      - name: Recompute oracle and lock exact production bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/stage05_stone_type_oracle.py > evidence/oracle.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          source = os.environ['SOURCE_PIN']
          paths = ('src/bigint.false', 'src/monster_bootstrap.false', 'test/stage05_stone_type_13.false')
          locked = {}
          for path in (*paths, 'tools/stage05_stone_type_oracle.py'):
              locked[path] = subprocess.check_output(['git', 'show', source + ':' + path])
              assert locked[path] == pathlib.Path(path).read_bytes(), ('source drift', path)
          assert hashlib.sha256(locked[paths[-1]]).hexdigest() == os.environ['FIXTURE_SHA256']
          combined = b'\n'.join(locked[p] for p in paths) + b'\n'
          digest = hashlib.sha256(combined).hexdigest()
          assert digest == os.environ['COMBINED_SHA256'], digest
          pathlib.Path('evidence/stage05_stone_type_exact.false').write_bytes(combined)
          o = json.loads(pathlib.Path('evidence/oracle.json').read_text())
          assert o['project_id'] == os.environ['PROJECT_ID'] and o['native_evidence'] is False
          assert (o['row_count'], o['distinct_row_patterns'], o['case_count'], o['value_assertions'],
                  o['handle_assertions'], o['structural_assertions']) == (46, 13, 13, 13, 13, 26)
          assert o['fixture_sha256'] == os.environ['FIXTURE_SHA256']
          assert len(o['negative_cases']) == 5
          assert [c['label'] for c in o['cases']] == [f'STAGE5_STONE_CASE_{i:02d}_OK' for i in range(13)]
          assert locked[paths[-1]].count(b'21h;!!u:') == 13
          print('STAGE5_SOURCE_LOCKED', digest, 'rows=46 cases=13 values=13 handles=13 structure=26')
          PY

      - name: Compile pinned original FALSE interpreter and preflight Unicode
        shell: bash
        run: |
          set -Eeuo pipefail
          gcc --version > evidence/compiler_version.txt
          set +e
          gcc -Wall -Wextra -O2 -D_GNU_SOURCE -Iupstream -Iupstream/src \
            upstream/interpreter.c upstream/src/false.c upstream/utils/file.c \
            upstream/src/stack.c upstream/src/slice.c upstream/src/storage.c \
            upstream/src/token.c -o upstream/false_int \
            > evidence/compiler_stdout.txt 2> evidence/compiler_stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/compiler_exit_code.txt
          test "$code" -eq 0 && test -x upstream/false_int
          printf '%s' '4 7 1ø.%%' > evidence/unicode_pick.false
          timeout 15s upstream/false_int -e evidence/unicode_pick.false \
            > evidence/unicode_pick.stdout.txt 2> evidence/unicode_pick.stderr.txt
          test "$(cat evidence/unicode_pick.stdout.txt)" = '4'
          echo ORIGINAL_UNICODE_PICK_PREFLIGHT_PASS > evidence/preflight.txt

      - name: Run 52 positive comparisons on exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          timeout 60s upstream/false_int -e evidence/stage05_stone_type_exact.false \
            > evidence/native_stdout.txt 2> evidence/native_stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/native_exit_code.txt
          test "$code" -eq 0

      - name: Prove fail-closed mutant and invalid indices
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, os, sys
          sys.path.insert(0, 'tools')
          import stage05_stone_type_oracle as oracle
          source = os.environ['SOURCE_PIN']
          base = b'\n'.join(subprocess.check_output(['git', 'show', source + ':' + p])
                            for p in ('src/bigint.false', 'src/monster_bootstrap.false')) + b'\n'
          fixture = subprocess.check_output(['git', 'show', source + ':test/stage05_stone_type_13.false']).decode()
          head, tail = fixture.split('{ حالة 0:', 1)
          assert 'z;b:0a;!b;0h;!!s:' in tail
          tail = tail.replace('z;b:0a;!b;0h;!!s:', 'z;b:1a;!b;0h;!!s:', 1)
          programs = {'mutant': head + '{ حالة 0:' + tail}
          for label, *_ in oracle.NEGATIVE:
              programs[label] = oracle.negative(label)
          for label, body in programs.items():
              pathlib.Path(f'evidence/{label}.false').write_bytes(base + body.encode())
          PY
          for label in mutant row_0 row_47 kind_0 kind_6 short_kind_4; do
            set +e
            timeout 15s upstream/false_int -e "evidence/$label.false" \
              > "evidence/$label.stdout.txt" 2> "evidence/$label.stderr.txt"
            code=$?
            set -e
            echo "$code" > "evidence/$label.exit_code.txt"
            test "$code" -eq 1
          done
          grep -q STAGE5_STONE_FAILURE evidence/mutant.stdout.txt
          ! grep -q STAGE5_STONE_13_VALUES_13_HANDLES_VERIFIED evidence/mutant.stdout.txt
          for label in row_0 row_47; do grep -q E_STONE_ROW "evidence/$label.stdout.txt"; done
          for label in kind_0 kind_6 short_kind_4; do grep -q E_STONE_KIND "evidence/$label.stdout.txt"; done

      - name: Verify receipts and save fail-closed conclusion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          d = pathlib.Path('evidence')
          def read(name):
              p = d / name
              return p.read_text(encoding='utf-8').strip() if p.exists() else None
          def number(name):
              v = read(name)
              return int(v) if v is not None else None
          source = d / 'stage05_stone_type_exact.false'
          digest = hashlib.sha256(source.read_bytes()).hexdigest() if source.exists() else None
          oracle_text = read('oracle.json')
          o = json.loads(oracle_text) if oracle_text else {}
          stdout = read('native_stdout.txt') or ''
          observed = re.findall(r'STAGE5_STONE_CASE_\d{2}_OK', stdout)
          expected = [c['label'] for c in o.get('cases', [])]
          final = 'STAGE5_STONE_13_VALUES_13_HANDLES_VERIFIED'
          negatives = ['mutant', 'row_0', 'row_47', 'kind_0', 'kind_6', 'short_kind_4']
          good = (read('source_observed.txt') == os.environ['SOURCE_PIN']
                  and read('runtime_observed.txt') == os.environ['RUNTIME_PIN']
                  and digest == os.environ['COMBINED_SHA256']
                  and o.get('fixture_sha256') == os.environ['FIXTURE_SHA256']
                  and (o.get('row_count'), o.get('distinct_row_patterns'), o.get('case_count'),
                       o.get('value_assertions'), o.get('handle_assertions'),
                       o.get('structural_assertions')) == (46, 13, 13, 13, 13, 26)
                  and read('preflight.txt') == 'ORIGINAL_UNICODE_PICK_PREFLIGHT_PASS'
                  and number('compiler_exit_code.txt') == number('native_exit_code.txt') == 0
                  and len(observed) == 13 and observed == expected
                  and stdout.count(final) == 1 and stdout.endswith(final)
                  and 'STAGE5_STONE_FAILURE' not in stdout and read('native_stderr.txt') == ''
                  and [number(f'{s}.exit_code.txt') for s in negatives] == [1] * 6
                  and 'STAGE5_STONE_FAILURE' in (read('mutant.stdout.txt') or '')
                  and final not in (read('mutant.stdout.txt') or '')
                  and all('E_STONE_ROW' in (read(f'{s}.stdout.txt') or '') for s in ('row_0', 'row_47'))
                  and all('E_STONE_KIND' in (read(f'{s}.stdout.txt') or '') for s in ('kind_0', 'kind_6', 'short_kind_4')))
          receipt = {'project_id': os.environ['PROJECT_ID'], 'github_run_id': os.environ.get('GITHUB_RUN_ID'),
                     'github_sha': os.environ.get('GITHUB_SHA'), 'source_pin': os.environ['SOURCE_PIN'],
                     'source_observed': read('source_observed.txt'), 'runtime_pin': os.environ['RUNTIME_PIN'],
                     'runtime_observed': read('runtime_observed.txt'), 'combined_sha256': digest,
                     'fixture_sha256': o.get('fixture_sha256'), 'case_labels': observed,
                     'value_assertions': 13, 'handle_assertions': 13, 'structural_assertions': 26,
                     'native_exit_code': number('native_exit_code.txt'),
                     'negative_exit_codes': [number(f'{s}.exit_code.txt') for s in negatives],
                     'stone_type_native_verified': good, 'stage5_full_acceptance': False}
          (d / 'evidence.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          if not good:
              raise SystemExit('STAGE5_STONE_TYPE_NATIVE_NOT_VERIFIED')
          PY

      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: false-arabic-stage05-stone-type-native
          path: evidence/
          retention-days: 30
          if-no-files-found: error
