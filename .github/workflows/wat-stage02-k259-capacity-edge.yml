name: WAT Stage02 k259 capacity-edge stress QA (isolated, not production)

on:
  push:
    branches:
      - 'qa/wat-k253-focused-native-20261121'
    paths:
      - 'tests/stage02_k259_capacity_witness.py'
      - 'tests/stage02_k259_capacity_witness.cjs'
      - '.github/workflows/wat-stage02-k259-capacity-edge.yml'

permissions:
  contents: read

jobs:
  capacity-edge-k259:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'

      - name: Assert exact QA checkout and immutable normative source
        shell: bash
        run: |
          set -euo pipefail
          printf 'PROJECT_ID=PC-BRANCH-WAT-SPANISH\nQA_SHA=%s\n' "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object tests/normative_selector.wat)" = e23f013ab96b498b0ac365dbb1b25273c845e790
          echo '18e2c15a142b3a262ff38a1e084d86bdc1a139ce030b0318f279dbcdb23f8980  tests/normative_selector.wat' | sha256sum -c -
          git cat-file -e '871f9b70216c16c57abcd552ec6fb0ed1010e305^{commit}'
          test "$(git rev-parse 871f9b70216c16c57abcd552ec6fb0ed1010e305:tests/normative_selector.wat)" = e23f013ab96b498b0ac365dbb1b25273c845e790

      - name: Install WABT and generate capacity-edge k259 oracle
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wabt
          mkdir -p evidence/wat-k259-capacity-edge
          python3 --version | tee evidence/wat-k259-capacity-edge/python-version.txt
          node --version | tee evidence/wat-k259-capacity-edge/node-version.txt
          wat2wasm --version | tee evidence/wat-k259-capacity-edge/wabt-version.txt
          python3 tests/stage02_k259_capacity_witness.py | tee evidence/wat-k259-capacity-edge/prepare.stdout.json
          wat2wasm evidence/wat-k259-capacity-edge/instrumented.wat -o evidence/wat-k259-capacity-edge/instrumented.wasm
          wasm-validate evidence/wat-k259-capacity-edge/instrumented.wasm
          sha256sum evidence/wat-k259-capacity-edge/instrumented.wat evidence/wat-k259-capacity-edge/instrumented.wasm > evidence/wat-k259-capacity-edge/instrumented.sha256

      - name: Run full-limb capacity-edge witness in Node WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          evidence='evidence/wat-k259-capacity-edge'
          printf 'engine\texport\tstatus\texit_code\n' > "$evidence/cases.tsv"
          set +e
          timeout 180s node tests/stage02_k259_capacity_witness.cjs "$evidence/instrumented.wasm" "$evidence/oracle.json" > "$evidence/node.stdout.json" 2> "$evidence/node.stderr.txt"
          exit_code=$?
          set -e
          printf 'node_exit_code=%s\n' "$exit_code" | tee "$evidence/node.exit.txt"
          test "$exit_code" -eq 0
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('evidence/wat-k259-capacity-edge')
          r=json.loads((p/'node.stdout.json').read_text())
          assert r['engine']=='Node WebAssembly'
          assert r['gate']=='CAPACITY_EDGE_K259_STRESS_ONLY'
          assert r['passed']==2 and r['failed']==0 and len(r['results'])==2
          assert all(x['status']=='PASS' and x['returnValue']==1 for x in r['results'])
          with (p/'cases.tsv').open('a') as f:
              for x in r['results']:
                  f.write(f"Node\t{x['name']}\t{x['status']}\t0\n")
          print('NODE_FULL_LIMB_CASES=2/2 PASS')
          PY
          test ! -s "$evidence/node.stderr.txt"

      - name: Install pinned WasmKit 0.1.6 and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'x86_64'
          release='https://github.com/swiftwasm/WasmKit/releases/download/0.1.6/wasmkit-x86_64-swift-linux-musl.tar.gz'
          expected='57085becd37769ed618a9057dee6d70303195e31d3b46d09dac1cfb5d477aa24'
          archive="$RUNNER_TEMP/wasmkit-x86_64-swift-linux-musl.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$release" -o "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          bin_dir="$RUNNER_TEMP/wasmkit-x86_64-swift-linux-musl"
          test -x "$bin_dir/wasmkit"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          version="$("$bin_dir/wasmkit" --version)"
          printf '%s\n' "$version" | tee evidence/wat-k259-capacity-edge/wasmkit-version.txt
          grep -Fq '0.1.6' <<< "$version"
          printf '%s  %s\n' "$expected" "$archive" > evidence/wat-k259-capacity-edge/wasmkit-release.sha256
          sha256sum "$bin_dir/wasmkit" > evidence/wat-k259-capacity-edge/wasmkit-binary.sha256

      - name: Run full-limb capacity-edge witness in WasmKit
        shell: bash
        run: |
          set -euo pipefail
          evidence='evidence/wat-k259-capacity-edge'
          test -f "$evidence/cases.tsv"
          passed=0
          failed=0
          for name in qa_k259_capacity_forward qa_k259_capacity_backward; do
            set +e
            timeout 180s wasmkit run "$evidence/instrumented.wasm" "$name" > "$evidence/$name.stdout.txt" 2> "$evidence/$name.stderr.txt"
            exit_code=$?
            set -e
            if [[ "$exit_code" -eq 0 ]] && grep -qxE '\[(I32|i32|WasmTypes[.]Value[.]i32)\(1\)\]' "$evidence/$name.stdout.txt"; then
              status='PASS'
              passed=$((passed + 1))
            elif [[ "$exit_code" -eq 124 ]]; then
              status='TIMEOUT'
              failed=$((failed + 1))
            elif [[ "$exit_code" -ne 0 ]]; then
              status='RUNTIME_ERROR'
              failed=$((failed + 1))
            else
              status='UNEXPECTED_RESULT'
              failed=$((failed + 1))
            fi
            printf 'WasmKit\t%s\t%s\t%s\n' "$name" "$status" "$exit_code" | tee -a "$evidence/cases.tsv"
          done
          {
            printf 'PROJECT_ID=PC-BRANCH-WAT-SPANISH\n'
            printf 'SOURCE_COMMIT=871f9b70216c16c57abcd552ec6fb0ed1010e305\n'
            printf 'SOURCE_SHA256=18e2c15a142b3a262ff38a1e084d86bdc1a139ce030b0318f279dbcdb23f8980\n'
            printf 'EXPECTED=4\nPASSED=%s\nFAILED=%s\n' "$passed" "$failed"
            printf 'GATE=CAPACITY_EDGE_K259_STRESS_ONLY\nLEGAL_DOMAIN_MAX_VERIFIED=no\nSTAGE02_ACCEPTED=no\n'
          } > "$evidence/summary.txt"
          test "$passed" -eq 2
          test "$failed" -eq 0
          echo 'WasmKit capacity-edge k259 full-limb cases: 2/2 PASS'

      - name: Upload capacity-edge evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wat-k259-capacity-edge-evidence
          path: evidence/wat-k259-capacity-edge/
          if-no-files-found: warn
          retention-days: 30
