name: MATLAB Stage55 Thirty-Second Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_thirty_second_native.m'
      - 'tools/stage55_after32_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-thirty-second-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-thirty-second-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  thirty-second-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER31 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-thirty-first-day-differential
          run-id: 41884163894
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER31
        run: |
          echo 'b2e5775f248091a6ad109d2bbabe706402a9f7f4e87184952f6070004223fad7  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_31.json' | sha256sum -c -
      - name: Preflight AFTER32 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after32_interval_five_fields.py
          grep -Fqx 'PIN = "b2e5775f248091a6ad109d2bbabe706402a9f7f4e87184952f6070004223fad7"' tools/stage55_after32_interval_five_fields.py
          python3 -m py_compile tools/stage55_after32_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native thirty-second-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_thirty_second_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after32_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_31.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_32.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_THIRTY_SECOND_PYTHON.log
          grep '^STAGE55_THIRTY_SECOND_ROW ' logs/STAGE55_THIRTY_SECOND_PYTHON.log > logs/STAGE55_THIRTY_SECOND_PYTHON_ROW.txt
          grep '^STAGE55_THIRTY_SECOND_ROW ' logs/STAGE55_THIRTY_SECOND_NATIVE.log > logs/STAGE55_THIRTY_SECOND_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_THIRTY_SECOND_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_THIRTY_SECOND_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_THIRTY_SECOND_PYTHON_ROW.txt logs/STAGE55_THIRTY_SECOND_NATIVE_ROW.txt
          expected="STAGE55_THIRTY_SECOND_ROW POSITION=32 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=32 MONTH_INDEX=18 MONTH_DAY=2"
          grep -Fqx "$expected" logs/STAGE55_THIRTY_SECOND_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_THIRTY_SECOND_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_32.json | tee logs/STAGE55_THIRTY_SECOND_DIGEST.txt
          echo 'STAGE55_THIRTY_SECOND_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-thirty-second-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_31.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_32.json
            logs/STAGE55_THIRTY_SECOND_NATIVE.log
            logs/STAGE55_THIRTY_SECOND_PYTHON.log
            logs/STAGE55_THIRTY_SECOND_PYTHON_ROW.txt
            logs/STAGE55_THIRTY_SECOND_NATIVE_ROW.txt
            logs/STAGE55_THIRTY_SECOND_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
