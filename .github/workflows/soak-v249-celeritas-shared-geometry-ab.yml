name: Soak v249 canonical gate geometry cache sharing A-B (not soak)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v249-celeritas-shared-geometry-ab.yml
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind v246 profile and exact v243-v245 candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9dd5982dbf2cbe927c87e91173e1976d94938758"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v249-celeritas-shared-geometry-ab.yml"
          mkdir -p evidence source/src source/include/pastafari
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15256044364/zip > evidence/v248.zip
          echo "39497107f8ed16bf0ea3767162a7af37c3127735433b22460697a7cee3502849  evidence/v248.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15255714213/zip > evidence/v247.zip
          echo "73cb5ffa97582ffa0e329103ab4438892f55cbf8962c0046e9f87bcbfd8683e3  evidence/v247.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15254779866/zip > evidence/v246.zip
          echo "82b4e1a942c43e204ab8571e6d19a034d3da4f8140853ddf96bedd6932c6f81f  evidence/v246.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib,zipfile,subprocess
          from pathlib import Path
          with zipfile.ZipFile("evidence/v246.zip") as z:
              assert z.testzip() is None
              r=json.loads(z.read("result.json"))
              frozen=json.loads(z.read("frozen-v245.json"))
          assert r["schema"]=="SOAK_V246_CELERITAS_COLD_PHASE_PROFILE/1" and r["profile_completed"]
          with zipfile.ZipFile("evidence/v247.zip") as z:
              assert z.testzip() is None
              prev=json.loads(z.read("result.json"))
          assert prev["schema"]=="SOAK_V247_MERSENNE_SAVE_AB/1" and prev["comparison_completed"]
          assert prev["source_commit"]==r["candidate_commit"]
          with zipfile.ZipFile("evidence/v248.zip") as z:
              assert z.testzip() is None
              geometry=json.loads(z.read("result.json"))
          assert geometry["schema"]=="SOAK_V248_CELERITAS_GATE_GEOMETRY_EQUIVALENCE/1" and geometry["component_pass"] and geometry["signed_gap_questions"]==1469
          assert geometry["source_commit"]==r["candidate_commit"]
          ref="408d80e43159eba06849b6a929e0010f32b9b91b"
          assert r["candidate_commit"]==ref and [x["c"] for x in frozen]==[739617,-377237,6875993]
          Path("evidence/frozen.json").write_text(json.dumps(frozen,ensure_ascii=False,indent=2)+"\n")
          pins={"src/monster.cpp":"faad56bd1a2f70b19d40e266b3b2e05754197a48","include/pastafari/monster.hpp":"4c24d36e3704dd10ecf5420e7bc11a3da958d441","include/pastafari/source_language_catalog.hpp":"9f204d93166b2c33532bb236bc2bd929252f27be"}
          manifest={}
          for p,h in pins.items():
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/Sargon17-Green/Pastafarian-Calendar/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\x00"+raw).hexdigest()==h
              Path("source",p).write_bytes(raw)
              manifest[p]={"blob":h,"sha256":hashlib.sha256(raw).hexdigest()}
          Path("evidence/source-pins.json").write_text(json.dumps({"commit":ref,"files":manifest},indent=2)+"\n")
          PY
      - name: Compile exact baseline and shared-geometry diagnostic
        run: |
          set -euo pipefail
          (
            if ! printf '#include <boost/multiprecision/cpp_int.hpp>\nint main(){}\n' | g++ -std=c++17 -x c++ -fsyntax-only -; then
              timeout -k 5s 120s sudo apt-get update -qq
              timeout -k 5s 120s sudo apt-get install -y --no-install-recommends libboost-dev
            fi
            g++ --version
            dpkg-query -W libboost-dev
          ) > evidence/compiler.txt 2>&1
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=Path("source/src/monster.cpp").read_text()
          a="const GateGraveyardKey key{stage56CorrectedSauce_, n};"
          b="""// QA only: canonical saved-sum geometry is identical for
                      // the two stage flags. Share only the cumulative gate vault
                      // in normal acceleration, not year checkpoints or sauce.
                      const GateGraveyardKey key{
                          (accelerationsOn() && !fullHistoricalValidationOn())
                              ? true : stage56CorrectedSauce_, n};"""
          assert s.count(a)==2
          variant=s.replace(a,b)
          assert variant.replace(b,a)==s
          Path("source/src/variant.cpp").write_text(variant)
          Path("evidence/ab-source.json").write_text(json.dumps({"original_sha256":hashlib.sha256(s.encode()).hexdigest(),"variant_sha256":hashlib.sha256(variant.encode()).hexdigest(),"reversible":True,"only_change":"canonical shared gate vault key in accelerated non-historical mode at both signed traversal sites","source_equivalence_argument":["same counts, stones, hidden and visible helper inputs","same 46-step initial bowl recurrence; single latch at i=46","both post-stir recurrences use SAVE(sum(old)+149*stir), identical permutation, neighbor indices, coefficients and simultaneous update","same 922-family gap rank from identical final bowls and latch; same foundation and signed cumulative recurrence","conditional on valid cache contents and exact pinned source; all explicit historical/fault routes retained"],"universal_equivalence_certified":False},indent=2)+"\n")
          PY
          cat > source/probe.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include "pastafari/source_language_catalog.hpp"
          #include <chrono>
          #include <iostream>
          #include <stdexcept>
          #include <string>
          using namespace pastafari;
          std::size_t ci(const std::string& n){for(const auto& x:CUTLET_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("cutlet");}
          std::size_t mi(const std::string& n){for(const auto& x:MONTH_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("month");}
          void require(bool b,const char* m){if(!b)throw std::runtime_error(m);}
          void component(){
              for(int mode=0;mode<3;++mode){
                  for(int order=0;order<2;++order){
                      resetPersistentScarVaultsDiagnostic();
                      setAccelerationScarsEnabled(mode!=1);
                      setFullHistoricalAccelerationValidation(mode==2);
                      Patch18YearWalkWorkspace a(FOUNDATION_DAY_OLD,order!=0),b(FOUNDATION_DAY_OLD,order==0);
                      const auto start=persistentScarMetricsDiagnostic();
                      const Integer ap=a.gateDay(128),an=a.gateDay(-128);
                      const auto mid=persistentScarMetricsDiagnostic();
                      const Integer bp=b.gateDay(128),bn=b.gateDay(-128);
                      const auto end=persistentScarMetricsDiagnostic();
                      require(ap==bp&&an==bn,"signed cumulative endpoint mismatch");
                      require(ap>FOUNDATION_DAY_OLD&&an<FOUNDATION_DAY_OLD,"gate sign");
                      std::cout<<"COMPONENT\t"<<mode<<"\t"<<order<<"\t"<<ap<<"\t"<<an<<"\t"
                               <<mid.patch28GateCalculated-start.patch28GateCalculated<<"\t"
                               <<end.patch28GateCalculated-mid.patch28GateCalculated<<"\t"
                               <<end.patch28GateResurrection-mid.patch28GateResurrection<<std::endl;
                  }
              }
          }
          int main(int argc,char** argv){
              if(argc!=2)return 2;
              if(std::string(argv[1])=="component"){component();return 0;}
              const Integer c{argv[1]};
              resetPersistentScarVaultsDiagnostic();
              setAccelerationScarsEnabled(true);
              setFullHistoricalAccelerationValidation(false);
              const auto start=std::chrono::steady_clock::now();
              const auto a=calendarDateSpaghetti(c,c);
              const double seconds=std::chrono::duration<double>(std::chrono::steady_clock::now()-start).count();
              const auto m=persistentScarMetricsDiagnostic();
              std::cout<<"DATE\t"<<c<<"\t"<<seconds<<"\t"<<a.yearNumber<<"\t"<<ci(a.cutletName)<<"\t"<<a.dayInCutlet<<"\t"<<mi(a.monthName)<<"\t"<<a.dayInMonth<<"\t"<<a.cutletName<<"\t"<<a.monthName<<"\t"<<m.patch28GateCalculated<<"\t"<<m.patch28GateResurrection<<"\t"<<m.patch32SauceRecomputed<<std::endl;
          }
          CPP
          for mode in base variant; do
            src=monster
            if [ "$mode" = variant ]; then src=variant; fi
            (ulimit -v 4194304; timeout -k 5s 120s g++ -std=c++17 -O2 -pthread -I source/include "source/src/$src.cpp" source/probe.cpp -o "source/$mode") > "evidence/$mode.build.log" 2>&1 || { cat "evidence/$mode.build.log"; exit 1; }
          done
          sha256sum source/base source/variant source/probe.cpp > evidence/build.sha256
      - name: Compare signed gate endpoints and four cold public API calls
        run: |
          set -euo pipefail
          for mode in base variant; do
            (ulimit -v 786432; timeout -k 5s 45s "source/$mode" component) > "evidence/$mode.component.stdout" 2> "evidence/$mode.component.stderr"
            cat "evidence/$mode.component.stdout"
            test ! -s "evidence/$mode.component.stderr"
          done
          for c in 739617 6875993; do
            for mode in base variant; do
              tag="$mode.$c"
              set +e
              (ulimit -v 3145728; /usr/bin/time -v -o "evidence/$tag.time.txt" timeout -k 5s 140s "source/$mode" "$c") > "evidence/$tag.stdout" 2> "evidence/$tag.stderr"
              code=$?
              set -e
              echo "$code" > "evidence/$tag.exit"
              cat "evidence/$tag.stdout" "evidence/$tag.stderr"
            done
          done
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path("evidence")
          frozen={x["c"]:x for x in json.loads((p/"frozen.json").read_text())}
          comp={}
          for mode in ("base","variant"):
              rows=[]
              for l in (p/f"{mode}.component.stdout").read_text().splitlines():
                  a=l.split("\t");assert len(a)==8 and a[0]=="COMPONENT"
                  rows.append(list(map(int,a[1:])))
              assert [(x[0],x[1]) for x in rows]==[(i,j) for i in range(3) for j in range(2)]
              comp[mode]=rows
          good=True
          for a,b in zip(comp["base"],comp["variant"]):
              good=good and a[:4]==b[:4] and a[4]==b[4]==256
              good=good and a[5]==256 and a[6]==0
              good=good and ((b[5]==0 and b[6]==256) if b[0]==0 else (b[5]==256 and b[6]==0))
          comparisons=[]
          for c in (739617,6875993):
              modes={}
              for mode in ("base","variant"):
                  tag=f"{mode}.{c}";a=(p/f"{tag}.stdout").read_text().strip().split("\t")
                  code=int((p/f"{tag}.exit").read_text())
                  row=None
                  if code==0 and len(a)==13 and a[0]=="DATE":
                      row={"c":int(a[1]),"seconds":float(a[2]),"fields":list(map(int,a[3:8])),"raw_names":a[8:10],"gate_calculated":int(a[10]),"gate_resurrections":int(a[11]),"sauce_recomputed":int(a[12])}
                  m=re.search(r"Maximum resident set size \(kbytes\): (\d+)",(p/f"{tag}.time.txt").read_text())
                  modes[mode]={"exit":code,"row":row,"peak_rss_kib":int(m.group(1)) if m else None,"stderr_empty":not (p/f"{tag}.stderr").read_text()}
              a,b=modes["base"],modes["variant"]
              ok=all(v["exit"]==0 and v["row"] and v["stderr_empty"] and v["row"]["c"]==c and v["row"]["fields"]==frozen[c]["cpp_fields"] and v["row"]["raw_names"]==frozen[c]["cpp_raw_names"] for v in modes.values())
              reduced=ok and 0<b["row"]["gate_calculated"]<a["row"]["gate_calculated"]
              comparisons.append({"c":c,"modes":modes,"date_equal":bool(ok),"gate_recomputations_reduced":bool(reduced),"speedup":a["row"]["seconds"]/b["row"]["seconds"] if ok else None})
          ok=good and all(x["date_equal"] and x["gate_recomputations_reduced"] for x in comparisons)
          out={"schema":"SOAK_V249_SHARED_GATE_GEOMETRY_AB/1","source_commit":"408d80e43159eba06849b6a929e0010f32b9b91b","signed_component":comp,"signed_component_pass":bool(good),"comparisons":comparisons,"comparison_completed":bool(ok),"variant_diagnostic_only":True,"new_original_f_credit":0,"whole_year_credit":0,"admitted_engines":0,"STOP_NEW_NATIVE_SOAK_DISPATCH":True}
          (p/"result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v249-shared-geometry-ab-${{ github.run_id }}
          path: evidence/
          retention-days: 90
