name: Logo Stage 2 Discovery 01 Native

on:
  push:
    branches:
      - 'Logo\+Ido'
  pull_request:
    branches:
      - 'Logo\+Ido'

permissions:
  contents: read

jobs:
  native-stage-2-discovery-01:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Build pinned native UCBLogo 6.2.5 without wxWidgets
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu's ucblogo binary uses a wxWidgets terminal: it does not
          # consume redirected stdin or expose Logo's PRINT on stdout.
          # A --disable-wx build makes this a genuine headless CLI test.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git gcc g++ make autoconf automake autoconf-archive libncurses-dev
          source_dir="$RUNNER_TEMP/ucblogo-source"
          git clone --quiet --depth 1 --branch version_6.2.5 \
            https://github.com/jrincayc/ucblogo-code.git "$source_dir"
          expected=a0215433f07384e4c42fe247525867f11e6f32f7
          actual="$(git -C "$source_dir" rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::UCBLogo tag commit changed: $actual"
            exit 1
          fi
          cd "$source_dir"
          autoreconf -fi
          # UCBLogo 6.2.5 uses pre-C23 empty-parameter declarations (nop()).
          # Ubuntu 26.04 compilers default to C23, which rejects legacy calls.
          # Explicitly compile in GNU C17 mode; do not patch upstream source.
          CFLAGS="-O2 -std=gnu17" ./configure --prefix="$RUNNER_TEMP/ucblogo-headless" \
            --disable-wx --disable-x11 --disable-docs
          make -j2
          make install
          binary="$RUNNER_TEMP/ucblogo-headless/bin/ucblogo"
          test -x "$binary"
          echo "LOGO_BIN=$binary" >> "$GITHUB_ENV"
          echo "HEADLESS_LOGO_SOURCE_SHA=$actual"


      - name: Verify exact BI division binary-search regression
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/stage02-fast-divmod.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 90s \
            stdbuf -oL -eL "$LOGO_BIN" test/stage02_divmod_fast_tests.logo >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Fast exact BI division regression failed/timed out (exit=$result)"
            exit 1
          fi
          grep -Fxq 'STAGE_2_FAST_DIVMOD_CHECKS_PASIS 128' "$log"
          grep -Fxq 'STAGE_2_FAST_DIVMOD_PASIS' "$log"
          if grep -Eq 'STAGE_2_FAST_DIVMOD_FALIIS|STAGE_2_FAST_DIVMOD_COUNT_FALIIS|I don.t know how to|not enough inputs' "$log"; then
            echo "::error::Fast exact BI division failure marker"
            exit 1
          fi
          echo 'NATIVE_BI_DIVMOD_FAST_VERIFICATION=PASS'

      - name: Verify Stage 2 Discovery 01 cases
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/logo-stage02-discovery01.log"
          if printf 'bye\n' |
              timeout --signal=TERM --kill-after=5s 180s \
                stdbuf -oL -eL "$LOGO_BIN" test/stage02_discovery01_tests.logo >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Stage 2 Discovery 01 native failed/timed out (exit=$result)"
            exit 1
          fi
          grep -Fxq 'STAGE_2_CHECKS_PASIS 44' "$log" || {
            echo '::error::Expected exactly 44 checks'
            exit 1
          }
          grep -Fxq 'STAGE_2_DISCOVERY_01_PASIS' "$log" || {
            echo '::error::Stage 2 Discovery 01 PASS marker missing'
            exit 1
          }
          if grep -Eq 'STAGE_2_TESTO_FALIIS|STAGE_2_DISCOVERY_01_FALIIS|STAGE_2_CHECK_COUNT_FALIIS|I don.t know how to' "$log"; then
            echo '::error::Stage 2 Discovery 01 failure marker found'
            exit 1
          fi
          echo 'NATIVE_STAGE_2_DISCOVERY_01_VERIFICATION=PASS'

      - name: Verify Stage 2 Discovery 02 native context isolation
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/stage02-discovery02.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 240s \
            stdbuf -oL -eL "$LOGO_BIN" test/stage02_discovery02_tests.logo >"$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            echo "::error::Stage2 Discovery02 native failure or timeout"
            exit 1
          fi
          grep -Fxq 'STAGE_2_DISCOVERY_02_PAIRS_PASIS 28' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_02_CHECKS_PASIS 406' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_02_PASIS' "$log"
          if grep -Eq 'STAGE_2_DISCOVERY_02_TESTO_FALIIS|STAGE_2_DISCOVERY_02_FALIIS|I don.t know how to' "$log"; then
            echo '::error::Stage2 Discovery02 failure marker'
            exit 1
          fi
          echo 'NATIVE_STAGE_2_DISCOVERY_02_VERIFICATION=PASS'


      - name: Verify Stage 2 Discovery 03 intermediate counts
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/stage02-discovery03.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 240s \
            stdbuf -oL -eL "$LOGO_BIN" test/stage02_discovery03_tests.logo >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Stage2 Discovery03 native failure/timeout (exit=$result)"
            exit 1
          fi
          grep -Fxq 'STAGE_2_DISCOVERY_03_PAIRS_PASIS 26' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_03_CHECKS_PASIS 404' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_03_PASIS' "$log"
          if grep -Eq 'STAGE_2_DISCOVERY_03_TESTO_FALIIS|STAGE_2_DISCOVERY_03_FALIIS|STAGE_2_DISCOVERY_03_PAIR_COUNT_FALIIS|STAGE_2_DISCOVERY_03_CHECK_COUNT_FALIIS|I don.t know how to' "$log"; then
            echo "::error::Stage2 Discovery03 failure marker"
            exit 1
          fi
          echo 'NATIVE_STAGE_2_DISCOVERY_03_VERIFICATION=PASS'


      - name: Verify Stage 2 Discovery 04 metamorphic exact integer invariants
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/stage02-discovery04.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 240s \
            stdbuf -oL -eL "$LOGO_BIN" test/stage02_discovery04_tests.logo >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Stage2 Discovery04 native failure/timeout (exit=$result)"
            exit 1
          fi
          grep -Fxq 'STAGE_2_DISCOVERY_04_PAIRS_PASIS 24' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_04_CHECKS_PASIS 432' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_04_PASIS' "$log"
          if grep -Eq 'STAGE_2_DISCOVERY_04_TESTO_FALIIS|STAGE_2_DISCOVERY_04_FALIIS|STAGE_2_DISCOVERY_04_PAIR_COUNT_FALIIS|STAGE_2_DISCOVERY_04_CHECK_COUNT_FALIIS|I don.t know how to' "$log"; then
            echo '::error::Stage2 Discovery04 failure marker'
            exit 1
          fi
          echo 'NATIVE_STAGE_2_DISCOVERY_04_VERIFICATION=PASS'

      - name: Verify Stage 2 Discovery 05 canonical BI shapes
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/stage02-discovery05.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 240s \
            stdbuf -oL -eL "$LOGO_BIN" test/stage02_discovery05_tests.logo >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Stage2 Discovery05 native failure/timeout (exit=$result)"
            exit 1
          fi
          grep -Fxq 'STAGE_2_DISCOVERY_05_CASES_PASIS 24' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_05_CHECKS_PASIS 192' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_05_PASIS' "$log"
          if grep -Eq 'STAGE_2_DISCOVERY_05_TESTO_FALIIS|STAGE_2_DISCOVERY_05_FALIIS|STAGE_2_DISCOVERY_05_CASE_COUNT_FALIIS|STAGE_2_DISCOVERY_05_CHECK_COUNT_FALIIS|I don.t know how to|not enough inputs' "$log"; then
            echo '::error::Stage2 Discovery05 failure marker'
            exit 1
          fi
          echo 'NATIVE_STAGE_2_DISCOVERY_05_VERIFICATION=PASS'

      - name: Verify Stage 2 Discovery 06 independent 46-round stone recurrence
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/stage02-discovery06.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 240s \
            stdbuf -oL -eL "$LOGO_BIN" test/stage02_discovery06_tests.logo >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Stage2 Discovery06 native failure/timeout (exit=$result)"
            exit 1
          fi
          grep -Fxq 'STAGE_2_DISCOVERY_06_ROUNDS_PASIS 46' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_06_CHECKS_PASIS 240' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_06_PASIS' "$log"
          if grep -Eq 'STAGE_2_DISCOVERY_06_TESTO_FALIIS|STAGE_2_DISCOVERY_06_FALIIS|STAGE_2_DISCOVERY_06_ROUND_COUNT_FALIIS|STAGE_2_DISCOVERY_06_CHECK_COUNT_FALIIS|STAGE_2_DISCOVERY_06_SHAPE_FALIIS|STAGE_2_DISCOVERY_06_ORACLE_|I don.t know how to|not enough inputs' "$log"; then
            echo '::error::Stage2 Discovery06 failure marker'
            exit 1
          fi
          echo 'NATIVE_STAGE_2_DISCOVERY_06_VERIFICATION=PASS'


      - name: Verify Stage 2 Discovery 07 independent hidden seeds
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/stage02-discovery07.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 420s \
            stdbuf -oL -eL "$LOGO_BIN" test/stage02_discovery07_tests.logo >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Stage2 Discovery07 native failure/timeout (exit=$result)"
            exit 1
          fi
          grep -Fxq 'STAGE_2_DISCOVERY_07_CASES_PASIS 5' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_07_CHECKS_PASIS 53' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_07_PASIS' "$log"
          if grep -Eq 'STAGE_2_DISCOVERY_07_TESTO_FALIIS|STAGE_2_DISCOVERY_07_FALIIS|STAGE_2_DISCOVERY_07_SHAPE_FALIIS|STAGE_2_DISCOVERY_07_ORACLE_SHAPE_FALIIS|STAGE_2_DISCOVERY_07_CASE_COUNT_FALIIS|STAGE_2_DISCOVERY_07_CHECK_COUNT_FALIIS|I don.t know how to|not enough inputs' "$log"; then
            echo "::error::Stage2 Discovery07 failure marker"
            exit 1
          fi
          echo 'NATIVE_STAGE_2_DISCOVERY_07_VERIFICATION=PASS'
 
      - name: Verify Stage 2 Discovery 08 first-five visible drops against independent oracle
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/stage02-discovery08.log"
          if printf 'bye\n' | timeout --signal=TERM --kill-after=5s 420s \
            stdbuf -oL -eL "$LOGO_BIN" test/stage02_discovery08_tests.logo >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            echo "::error::Stage2 Discovery08 native failure/timeout (exit=$result)"
            exit 1
          fi
          grep -Fxq 'STAGE_2_DISCOVERY_08_CASES_PASIS 4' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_08_CHECKS_PASIS 34' "$log"
          grep -Fxq 'STAGE_2_DISCOVERY_08_PASIS' "$log"
          if grep -Eq 'STAGE_2_DISCOVERY_08_TESTO_FALIIS|STAGE_2_DISCOVERY_08_FALIIS|STAGE_2_DISCOVERY_08_SHAPE_FALIIS|STAGE_2_DISCOVERY_08_ORACLE_SHAPE_FALIIS|STAGE_2_DISCOVERY_08_CASE_COUNT_FALIIS|STAGE_2_DISCOVERY_08_CHECK_COUNT_FALIIS|I don.t know how to|not enough inputs' "$log"; then
            echo '::error::Stage2 Discovery08 failure marker'
            exit 1
          fi
          echo 'NATIVE_STAGE_2_DISCOVERY_08_VERIFICATION=PASS'
