name: MATLAB Stage55 Eighth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_eighth_native.m'
      - 'tools/stage55_after8_interval_five_fields.py'
      - '.github/workflows/matlab-stage55-eighth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-eighth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  eighth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER7 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-seventh-day-differential
          run-id: 41194646841
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER7
        run: |
          echo '603b9395237275b0a261dd35ec941df78a4fb8c5c8234bf483819cb6e3f04dfd  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_7.json' | sha256sum -c -
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native eighth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_eighth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after8_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_7.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_8.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_EIGHTH_PYTHON.log
          grep '^STAGE55_EIGHTH_ROW ' logs/STAGE55_EIGHTH_PYTHON.log > logs/STAGE55_EIGHTH_PYTHON_ROW.txt
          grep '^STAGE55_EIGHTH_ROW ' logs/STAGE55_EIGHTH_NATIVE.log > logs/STAGE55_EIGHTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_EIGHTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_EIGHTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_EIGHTH_PYTHON_ROW.txt logs/STAGE55_EIGHTH_NATIVE_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_8.json | tee logs/STAGE55_EIGHTH_DIGEST.txt
          echo 'STAGE55_EIGHTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-eighth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_7.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_8.json
            logs/STAGE55_EIGHTH_NATIVE.log
            logs/STAGE55_EIGHTH_PYTHON.log
            logs/STAGE55_EIGHTH_PYTHON_ROW.txt
            logs/STAGE55_EIGHTH_NATIVE_ROW.txt
            logs/STAGE55_EIGHTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
