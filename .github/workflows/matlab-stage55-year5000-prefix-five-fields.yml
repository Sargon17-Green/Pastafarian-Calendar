name: MATLAB Stage55 Year5000 Prefix Five Fields Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/stage55_year5000_prefix_five_fields.py'
      - 'tools/run_stage55_year5000_prefix_five_fields_native.m'
      - '.github/workflows/matlab-stage55-year5000-prefix-five-fields.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-year5000-prefix-fields-MATLAB-Polski
  cancel-in-progress: false
jobs:
  native-prefix-five-fields:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download pinned AFTER5 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage55-middle-fifth-day-native
          run-id: 41180572534
          github-token: ${{ github.token }}
          path: logs
      - name: Verify exact AFTER5
        run: |
          echo '285da1744f964b96cf4c1b33a0dcf11fb23a07b0ebb2a07ab57a554410e0e5b2  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_5.json' | sha256sum -c -
      - name: Python fixture projection
        shell: bash
        run: |
          set -euo pipefail
          (cd logs && zip -q ../source-after5.zip STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_5.json)
          python3 tools/stage55_year5000_prefix_five_fields.py source-after5.zip tests/fixtures/stage55_year5000_appendix_a_metadata.json | tee logs/STAGE55_YEAR5000_PREFIX_FIVE_FIELDS_PYTHON.log
      - name: Setup MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native PATCH25 five-field prefix route
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_prefix_five_fields_native
      - name: Strict row comparison
        shell: bash
        run: |
          set -euo pipefail
          grep '^STAGE55_PREFIX_ROW ' logs/STAGE55_YEAR5000_PREFIX_FIVE_FIELDS_PYTHON.log > logs/STAGE55_PREFIX_PYTHON_ROWS.txt
          grep '^STAGE55_PREFIX_ROW ' logs/STAGE55_YEAR5000_PREFIX_FIVE_FIELDS_NATIVE.log > logs/STAGE55_PREFIX_NATIVE_ROWS.txt
          test "$(wc -l < logs/STAGE55_PREFIX_PYTHON_ROWS.txt)" -eq 5
          test "$(wc -l < logs/STAGE55_PREFIX_NATIVE_ROWS.txt)" -eq 5
          diff -u logs/STAGE55_PREFIX_PYTHON_ROWS.txt logs/STAGE55_PREFIX_NATIVE_ROWS.txt
          echo 'STAGE55_YEAR5000_PREFIX_FIVE_FIELDS_DIFFERENTIAL_PASS CASES=5 FIELDS=5'
      - name: Save success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-year5000-prefix-five-fields-differential
          path: |
            logs/STAGE55_YEAR5000_PREFIX_FIVE_FIELDS_PYTHON.log
            logs/STAGE55_YEAR5000_PREFIX_FIVE_FIELDS_NATIVE.log
            logs/STAGE55_PREFIX_PYTHON_ROWS.txt
            logs/STAGE55_PREFIX_NATIVE_ROWS.txt
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_5.json
          if-no-files-found: warn
          retention-days: 30
