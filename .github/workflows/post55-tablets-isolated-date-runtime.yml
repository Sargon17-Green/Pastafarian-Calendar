name: Kotlin TABLETS isolated date runtime diagnostic
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/tablets_isolated_date_runtime.py'
      - 'soak/test_tablets_isolated_date_runtime.py'
      - '.github/workflows/post55-tablets-isolated-date-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and synthetic process isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .evidence
          python3 -m py_compile soak/tablets_isolated_date_runtime.py soak/test_tablets_isolated_date_runtime.py
          python3 -m unittest discover -s soak -p 'test_tablets_isolated_date_runtime.py' -v 2>&1 | tee .evidence/tablets-isolated-runtime.log
          echo PASS_SYNTHETIC_NOT_CERTIFIED | tee -a .evidence/tablets-isolated-runtime.log
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-tablets-date-isolated-runtime
          path: .evidence/tablets-isolated-runtime.log
          if-no-files-found: warn
          retention-days: 30
