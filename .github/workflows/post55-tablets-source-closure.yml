name: Kotlin unseeded TABLETS source closure diagnostic
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/tablets_unseeded_closure_contract.py'
      - 'soak/test_tablets_unseeded_closure_contract.py'
      - 'soak/independent_five_field_date.py'
      - 'soak/independent_year_geometry_oracle.py'
      - 'soak/independent_sauce_oracle.py'
      - 'soak/independent_date_combinatorics.py'
      - 'soak/independent_month_weaving_oracle.py'
      - '.github/workflows/post55-tablets-source-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the exact Kotlin branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify workflow head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Fourteen bounded provenance and receipt tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -B -m py_compile soak/tablets_unseeded_closure_contract.py soak/test_tablets_unseeded_closure_contract.py
          python -B -m unittest discover -s soak -p 'test_tablets_unseeded_closure_contract.py' -v 2>&1 | tee evidence/tablets-source-closure-tests.log
      - name: Produce exact five-module closure JSON
        shell: bash
        run: |
          set -euo pipefail
          python -B soak/tablets_unseeded_closure_contract.py --evidence evidence/tablets-source-closure.json | tee evidence/tablets-source-closure-run.log
      - name: Retain success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-unseeded-tablets-source-closure
          path: |
            evidence/tablets-source-closure-tests.log
            evidence/tablets-source-closure-run.log
            evidence/tablets-source-closure.json
          if-no-files-found: warn
          retention-days: 30
