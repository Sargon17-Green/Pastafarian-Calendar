name: Befunge QA21 Naturally Reached Native Rejection Opcode Causality
on:
  push:
    branches: ['qa-befunge98-stage1-order-isolation-20261008']
    paths:
      - 'qa/stage1_qa21_select_natural_witnesses.py'
      - 'qa/stage1_qa21_native_opcode_interventions.py'
      - 'qa/stage1_qa21_independent_causal_audit.py'
      - '.github/workflows/befunge-stage1-qa21-native-rejection-causality.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-input-native-opcode-causality:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin original BF98 source and QA-only audit scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = 560d6aa5807a7f766213a33835cce85eab0fa40c
          python3 -m py_compile qa/stage1_qa21_select_natural_witnesses.py qa/stage1_qa21_native_opcode_interventions.py qa/stage1_qa21_independent_causal_audit.py
          python3 qa/stage1_qa21_independent_causal_audit.py --selftest
      - name: Recover immutably pinned original QA20 Native execution histories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa21/receipts"
          test "$(gh run view 39761821210 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '.conclusion + ":" + .headSha')" = 'success:d0a1c686c4f9244121246aa5b70266c072c3ddce'
          for i in 0 1 2 3; do
            mkdir -p "$RUNNER_TEMP/qa21/shard-$i"
            gh run download 39761821210 --repo "$GITHUB_REPOSITORY" --name "qa20-shard-$i" --dir "$RUNNER_TEMP/qa21/shard-$i"
          done
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'qa21'
          for i in range(4):
              folder=p/('shard-%d'%i)
              assert (folder/'qa20_manifest.json').is_file()
              with zipfile.ZipFile(p/('qa20-%d.zip'%i),'w',compression=zipfile.ZIP_DEFLATED) as z:
                  for file in sorted(folder.iterdir()):
                      if file.is_file(): z.write(file,file.name)
          PY
          python3 qa/stage1_qa21_select_natural_witnesses.py \
            --shard "$RUNNER_TEMP/qa21/qa20-0.zip" --shard "$RUNNER_TEMP/qa21/qa20-1.zip" \
            --shard "$RUNNER_TEMP/qa21/qa20-2.zip" --shard "$RUNNER_TEMP/qa21/qa20-3.zip" \
            --source src/interleaved_work_counts.b98 \
            --output "$RUNNER_TEMP/qa21/receipts/qa21_original_witnesses.json" |
            tee "$RUNNER_TEMP/qa21/receipts/qa21_original_witnesses.log"
          grep -q QA21_SIX_FROZEN_INPUT_REACHED_ORIGINAL_NATIVE_OPCODES_PASS "$RUNNER_TEMP/qa21/receipts/qa21_original_witnesses.log"
      - name: Retrieve SHA-256-pinned Native PyFunge 0.5-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Run twelve real input-origin Native BF98 programs and six local byte controls
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -e PYTHONPATH=/work/qa \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -v "$RUNNER_TEMP/qa21/receipts:/qa21" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 1000s python -u qa/stage1_qa21_native_opcode_interventions.py /qa21/qa21_original_witnesses.json /qa21
            ' | tee "$RUNNER_TEMP/qa21/receipts/qa21_native_console.log"
          grep -q QA21_SIX_REAL_INPUT_ORIGIN_NATIVE_COUNTERFACTUALS_COMPLETED "$RUNNER_TEMP/qa21/receipts/qa21_native_console.log"
          test -s "$RUNNER_TEMP/qa21/receipts/qa21_native_interventions.json"
      - name: Independently audit the original Native prefixes and six physical effects
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/stage1_qa21_independent_causal_audit.py \
            --witness "$RUNNER_TEMP/qa21/receipts/qa21_original_witnesses.json" \
            --native "$RUNNER_TEMP/qa21/receipts/qa21_native_interventions.json" \
            --output "$RUNNER_TEMP/qa21/receipts/qa21_independent_audit.json" |
            tee "$RUNNER_TEMP/qa21/receipts/qa21_auditor.log"
          grep -q QA21_EIGHT_FORGED_REPORTS_REJECTED "$RUNNER_TEMP/qa21/receipts/qa21_auditor.log"
          grep -q QA21_NO_NUMERIC_NECESSITY_OR_STAGE1_ACCEPTANCE "$RUNNER_TEMP/qa21/receipts/qa21_auditor.log"
      - name: Preserve exact SHA-bound Native traces and audit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa21-natural-input-source-opcode-causal-evidence
          path: ${{ runner.temp }}/qa21/receipts/
          if-no-files-found: warn