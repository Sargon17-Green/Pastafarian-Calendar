name: Befunge QA15 Native Hot Reset With Live Peer
on:
  push:
    branches: ['qa-befunge98-stage1-order-isolation-20261008']
    paths:
      - 'qa/stage1_qa15_hot_reset_with_live_peer.py'
      - 'qa/stage1_qa15_hot_reset_audit.py'
      - '.github/workflows/befunge-stage1-qa15-native-live-peer-hot-reset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-hot-reset-live-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin exact native Befunge production and independent references
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = "560d6aa5807a7f766213a33835cce85eab0fa40c"
          test "$(git hash-object reference/work_counts.b98)" = "f941efc793c9eee4accf5d03873f8ed029b16725"
          test "$(git hash-object reference/save.b98)" = "7b5e79aa6e2bfb636717cb018a3db6a13fb2bb44"
          python3 -m py_compile qa/stage1_qa15_hot_reset_with_live_peer.py qa/stage1_qa15_hot_reset_audit.py
      - name: Fetch SHA-256-pinned PyFunge
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Four real Native hot reset scenarios while peer is live
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa15-hotreset"
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -e PYTHONPATH=/work/qa \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -v "$RUNNER_TEMP/qa15-hotreset:/hotreset" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 1080s python -u qa/stage1_qa15_hot_reset_with_live_peer.py
            '
      - name: Independently reject nine tampered native receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/stage1_qa15_hot_reset_audit.py "$RUNNER_TEMP/qa15-hotreset/native_live_peer_hot_reset.json" | tee "$RUNNER_TEMP/qa15-hotreset/auditor.log"
          grep -q 'QA15_NATIVE_HOT_RESET_INDEPENDENT_AUDIT_PASS' "$RUNNER_TEMP/qa15-hotreset/auditor.log"
          grep -q 'QA15_NINE_FORGED_REPORTS_REJECTED' "$RUNNER_TEMP/qa15-hotreset/auditor.log"
      - name: Preserve receipts on PASS or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa15-native-peer-hot-reset-receipt
          path: ${{ runner.temp }}/qa15-hotreset/
          if-no-files-found: error
