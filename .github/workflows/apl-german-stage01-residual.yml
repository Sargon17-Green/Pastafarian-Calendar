name: APL German Stage1 residual statement isolation (QA ONLY)
on:
  push:
    branches: [qa/apl-german-nars-interface-20261116]
    paths:
      - '.github/workflows/apl-german-stage01-residual.yml'
      - 'qa/nars-interface/stage01_residual_probe.py'
      - 'qa/nars-interface/test_stage01_residual_probe.py'
      - 'qa/nars-interface/bounded_stage01_residual_probe.ps1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  residual-source-copy-native:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned official NARS installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $sourceLock='7161824b9fcbfaca91f20d1ea492417e77003ff4'
          $uri='https://www.nars2000.org/download/binaries/w64/NARS2000-0.5.14.11.exe'
          $installer='pinned_release/verified_release/NARS2000-0.5.14.11.exe'
          $expectedBytes=9430788
          $expectedSHA='28e8d1dbcea13360a271e704196b5680f0c3e9461cfc38daa41b96dba202f11b'
          New-Item -ItemType Directory -Force 'pinned_release/verified_release','residual_evidence' | Out-Null
          $failures=@()
          try {
            $downloaded=$false
            for($attempt=1;$attempt -le 4;$attempt++){
              try {
                Invoke-WebRequest -Uri $uri -OutFile $installer -MaximumRedirection 3 -TimeoutSec 90
              } catch {
                $message=$_.Exception.Message
                $failures+= [ordered]@{attempt=$attempt;class='DOWNLOAD_ERROR';message=$message}
                Write-Warning ("OFFICIAL_NARS_DOWNLOAD_ATTEMPT_"+$attempt+"_FAILED: "+$message)
                Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
                if($attempt -lt 4){Start-Sleep -Seconds (3*$attempt)}
                continue
              }
              $bytes=(Get-Item -LiteralPath $installer).Length
              $sha=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
              if($bytes -ne $expectedBytes -or $sha -cne $expectedSHA){
                throw ("PINNED_INSTALLER_LOCK_FAILED|bytes="+$bytes+"|sha256="+$sha)
              }
              $downloaded=$true
              break
            }
            if(-not $downloaded){throw 'OFFICIAL_NARS_DOWNLOAD_EXHAUSTED_4_ATTEMPTS'}
            Write-Output 'PINNED_PUBLISHER_INSTALLER_SHA_LOCK_PASS'
          } catch {
            [ordered]@{
              schema='APL_GERMAN_RESIDUAL_BOOTSTRAP_FAILURE_V1'
              stage01='NOT_ACCEPTED'
              native_executed=$false
              source_commit=$sourceLock
              status='PRE_NATIVE_BOOTSTRAP_FAILURE'
              message=$_.Exception.Message
              failures=$failures
            } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath 'residual_evidence/bootstrap_failure.json' -Encoding utf8
            throw
          }
      - name: Provision verified runtime and ephemeral font
        shell: pwsh
        run: ./qa/nars-interface/bootstrap_exact_nars.ps1 -Evidence residual_font_evidence -Runtime verified_runtime
      - name: Unit test exact residual source copies before NARS
        shell: pwsh
        run: |
          python -m unittest discover -s qa/nars-interface -p 'test_stage01_residual_probe.py' -v
          if($LASTEXITCODE -ne 0){throw 'RESIDUAL_GENERATOR_UNIT_FAILED'}
      - name: V24.1 - four QA-only shape substitutions and two local-value witnesses
        shell: pwsh
        run: ./qa/nars-interface/bounded_stage01_residual_probe.ps1 -Runtime verified_runtime -Evidence residual_evidence
      - name: Independent diagnostic receipt gate (never acceptance)
        shell: pwsh
        run: |
          $a=Get-Content residual_evidence/native_residual.json -Raw | ConvertFrom-Json
          $b=Get-Content residual_evidence/residual_candidate.json -Raw | ConvertFrom-Json
          if($a.source_commit -cne '7161824b9fcbfaca91f20d1ea492417e77003ff4' -or
             $b.source_commit -cne $a.source_commit -or
             $a.stage01 -cne 'NOT_ACCEPTED' -or $b.stage01 -cne 'NOT_ACCEPTED' -or
             $b.original_stage01_acceptance_token_present -ne $false -or
             $b.original_unmodified_suite_proven -ne $false -or
             $b.production_source_modified -ne $false){throw 'FALSE_ACCEPTANCE_OR_SOURCE_LOCK'}
          if($a.status -cnotin @('RESIDUAL_SUITE_NO_ERROR_DIAGNOSTIC_ONLY',
                                'RESIDUAL_SUITE_ERROR_DIAGNOSTIC_ONLY') -or
             $a.native_executed -ne $true -or $a.runtime_verified -ne $true -or
             $a.fx_last_contiguous -ne 95 -or $a.fx_checkpoints.Count -ne 23 -or
             $a.copies.Count -ne 2 -or $a.suite_start_exact -ne $true -or
             $a.suite_captured_exact -ne $true -or $a.suite_ec_valid -ne $true -or
             $a.final_marker_exact -ne $true -or
             $a.compile_exact -ne $true -or $a.compile_name_exact -ne $true -or
             $a.statement_started -lt 1 -or $a.statement_receipts.Count -ne 8){
             throw 'RESIDUAL_DIAGNOSTIC_EVIDENCE_MISSING'}
          if(@($a.copies | Where-Object {$_.marker_exact -ne $true -or $_.name_exact -ne $true}).Count -ne 0){
            throw 'QA_COPY_NATIVE_NOT_VERIFIED'
          }
          if($b.probe_count -ne $a.statement_receipts.Count -or
             $b.instrumentation_mode -cne 'line234_line237_shape_witness_focus234_244_after_v23' -or
             $b.program_count -ne 28 -or $b.original_entrypoint_invoked -ne $false -or
             $b.source_statements_preserved -ne $false -or (($b.qa_only_patches.source_line -join ',') -cne '180,181,234,237') -or $b.prior_line181_witness_run -ne 45551684196 -or
             $b.prior_v17_run -ne 45658001179 -or
             $b.prior_v17_artifact_sha256 -cne 'ea8b494fac8ea7d4813301df22edd48b60343210afbaa824ec3c5ed5808e7c5e' -or
             $b.prior_v18_run -ne 45671179161 -or
             $b.prior_v18_artifact_sha256 -cne '26fdd18a8a1a2ac32a3f979a966556f98c938edc68c438edd7e6e7593b36ef89' -or
             $b.prior_v19_run -ne 45671767802 -or
             $b.prior_v19_artifact_sha256 -cne 'a268f6e439d8023de8261036b814642f11b54ed08556cb565e5fe6c2ce68faf5' -or
             $b.prior_v20_run -ne 45672323607 -or
             $b.prior_v20_artifact_sha256 -cne 'aab79c9d52ceab9193338b4fa4e560441c32db13d59ed30cb66cad8fcc22f391' -or
             $b.prior_v21_run -ne 45672648212 -or
             $b.prior_v21_artifact_sha256 -cne 'e6d9eeeaf55a90eef168504a8c64c04a34e4e93d33dc2d673ccacd757692daeb' -or
             $b.prior_v22_run -ne 45673022324 -or
             $b.prior_v22_artifact_sha256 -cne '6034e0bfe69400cd483ff7c45f5f8084f64bbe52e5b5316e3ece03c5c6899daf' -or
             $b.prior_v23_run -ne 45676884530 -or
             $b.prior_v23_artifact_sha256 -cne '366ef15ef999b790f1de55824f7d4f80b9525280447e2ec5ccb75423decc5b38' -or
             $b.prior_residual_run -ne 45676884530 -or
             $b.prior_residual_artifact_sha256 -cne '366ef15ef999b790f1de55824f7d4f80b9525280447e2ec5ccb75423decc5b38' -or
             $b.line234_witness.source_line -ne 234 -or $b.line234_witness.applied_to_suite_copy -ne $true -or
             $b.line237_witness.source_line -ne 237 -or $b.line237_witness.applied_to_suite_copy -ne $true){throw 'RESIDUAL_PROBE_CONTRACT_MISMATCH'}
          if($a.prior_line181_witness_run -ne 45551684196){throw 'PRIOR_WITNESS_REFERENCE_MISSING'}
          if($a.statement_receipts[0].first_line -ne 234 -or $a.statement_receipts[0].start_exact -ne $true -or
             $a.statement_receipts[10].first_line -ne 244){throw 'V24_RESIDUAL_FOCUS_NOT_PROVEN'}
          if(-not $a.line234_witness.start_exact -or -not $a.line234_witness.captured_exact -or
             -not $a.line234_witness.rank_valid -or $a.line234_witness.rank.Count -ne 1 -or [long]$a.line234_witness.rank[0] -ne 1 -or
             -not $a.line234_witness.shape_valid -or $a.line234_witness.shape.Count -ne 1 -or [long]$a.line234_witness.shape[0] -ne 7 -or
             -not $a.line234_witness.values_valid -or
             -not $a.line234_witness.original_ec_valid -or $a.line234_witness.original_ec -ne 0 -or
             -not $a.line234_witness.counterfactual_ec_valid -or $a.line234_witness.counterfactual_ec -ne 3 -or
             -not $a.line234_witness.original_message_length_valid -or $a.line234_witness.original_message_length -le 0 -or
             -not $a.line234_witness.counterfactual_message_length_valid -or $a.line234_witness.counterfactual_message_length -ne 0){throw 'LINE234_SHAPE_WITNESS_NOT_PROVEN'}
          if(-not $a.line237_witness.start_exact -or -not $a.line237_witness.captured_exact -or
             -not $a.line237_witness.rank_valid -or $a.line237_witness.rank.Count -ne 1 -or [long]$a.line237_witness.rank[0] -ne 1 -or
             -not $a.line237_witness.shape_valid -or $a.line237_witness.shape.Count -ne 1 -or [long]$a.line237_witness.shape[0] -ne 46 -or
             -not $a.line237_witness.values_valid -or
             -not $a.line237_witness.original_ec_valid -or $a.line237_witness.original_ec -ne 0 -or
             -not $a.line237_witness.counterfactual_ec_valid -or $a.line237_witness.counterfactual_ec -ne 3 -or
             -not $a.line237_witness.original_message_length_valid -or $a.line237_witness.original_message_length -le 0 -or
             -not $a.line237_witness.counterfactual_message_length_valid -or $a.line237_witness.counterfactual_message_length -ne 0){throw 'LINE237_SHAPE_WITNESS_NOT_PROVEN'}
          Write-Output ('RESIDUAL_STATEMENT_DIAGNOSTIC_ONLY|SUITE_EC_FIRST='+$a.suite_ec_first)
          Write-Output ('FIRST_INCOMPLETE_STATEMENT='+($a.first_incomplete|ConvertTo-Json -Compress))
          Write-Output 'STAGE01_NOT_ACCEPTED_ORIGINAL_UNMODIFIED_RUN_NOT_PROVEN'
      - name: Hash all diagnostic evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force residual_evidence,residual_font_evidence | Out-Null
          Get-ChildItem residual_evidence,residual_font_evidence -Recurse -File | Sort-Object FullName | ForEach-Object {
            $hash=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.FullName)"
          } | Set-Content -Encoding utf8 residual_receipts.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apl-german-stage01-residual-v24-1
          path: |
            residual_evidence/
            residual_font_evidence/
            residual_receipts.sha256
          retention-days: 21
