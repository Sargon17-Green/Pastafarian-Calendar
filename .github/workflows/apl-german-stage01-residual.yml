name: APL German Stage1 bounded-unrank witness (QA ONLY)
on:
  push:
    branches: [qa/apl-german-nars-interface-20261116]
    paths:
      - '.github/workflows/apl-german-stage01-residual.yml'
      - 'qa/nars-interface/stage01_residual_probe.py'
      - 'qa/nars-interface/test_stage01_residual_probe.py'
      - 'qa/nars-interface/bounded_stage01_residual_probe.ps1'
      - 'qa/nars-interface/stage01_bounded_unrank_witness.py'
      - 'qa/nars-interface/test_stage01_bounded_unrank_witness.py'
      - 'qa/nars-interface/bounded_unrank_witness.ps1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bounded-unrank-source-locked-native:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned official NARS installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $sourceLock='7161824b9fcbfaca91f20d1ea492417e77003ff4'
          $uri='https://www.nars2000.org/download/binaries/w64/NARS2000-0.5.14.11.exe'
          $installer='pinned_release/verified_release/NARS2000-0.5.14.11.exe'
          $expectedBytes=9430788
          $expectedSHA='28e8d1dbcea13360a271e704196b5680f0c3e9461cfc38daa41b96dba202f11b'
          New-Item -ItemType Directory -Force 'pinned_release/verified_release','bounded_unrank_evidence' | Out-Null
          $failures=@()
          try {
            $downloaded=$false
            for($attempt=1;$attempt -le 4;$attempt++){
              try {
                Invoke-WebRequest -Uri $uri -OutFile $installer -MaximumRedirection 3 -TimeoutSec 90
              } catch {
                $message=$_.Exception.Message
                $failures+= [ordered]@{attempt=$attempt;class='DOWNLOAD_ERROR';message=$message}
                Write-Warning ("OFFICIAL_NARS_DOWNLOAD_ATTEMPT_"+$attempt+"_FAILED: "+$message)
                Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
                if($attempt -lt 4){Start-Sleep -Seconds (3*$attempt)}
                continue
              }
              $bytes=(Get-Item -LiteralPath $installer).Length
              $sha=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
              if($bytes -ne $expectedBytes -or $sha -cne $expectedSHA){
                throw ("PINNED_INSTALLER_LOCK_FAILED|bytes="+$bytes+"|sha256="+$sha)
              }
              $downloaded=$true
              break
            }
            if(-not $downloaded){throw 'OFFICIAL_NARS_DOWNLOAD_EXHAUSTED_4_ATTEMPTS'}
            Write-Output 'PINNED_PUBLISHER_INSTALLER_SHA_LOCK_PASS'
          } catch {
            [ordered]@{
              schema='APL_GERMAN_BOUNDED_UNRANK_BOOTSTRAP_FAILURE_V1'
              stage01='NOT_ACCEPTED'
              native_executed=$false
              source_commit=$sourceLock
              status='PRE_NATIVE_BOOTSTRAP_FAILURE'
              message=$_.Exception.Message
              failures=$failures
            } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath 'bounded_unrank_evidence/bootstrap_failure.json' -Encoding utf8
            throw
          }
      - name: Provision verified runtime and ephemeral font
        shell: pwsh
        run: ./qa/nars-interface/bootstrap_exact_nars.ps1 -Evidence residual_font_evidence -Runtime verified_runtime
      - name: Unit test exact BoundedUnrank source witness before NARS
        shell: pwsh
        run: |
          python -m unittest discover -s qa/nars-interface -p 'test_stage01_bounded_unrank_witness.py' -v
          if($LASTEXITCODE -ne 0){throw 'BOUNDED_UNRANK_WITNESS_UNIT_FAILED'}
      - name: V27 - isolate BoundedUnrank DOMAIN ERROR in native NARS; no Stage1 suite rerun
        shell: pwsh
        run: ./qa/nars-interface/bounded_unrank_witness.ps1 -Runtime verified_runtime -Evidence bounded_unrank_evidence
      - name: Independent bounded-unrank witness receipt gate (never acceptance)
        shell: pwsh
        run: |
          $a=Get-Content bounded_unrank_evidence/native_bounded_unrank.json -Raw | ConvertFrom-Json
          $b=Get-Content bounded_unrank_evidence/bounded_unrank_candidate.json -Raw | ConvertFrom-Json
          if($a.source_commit -cne '7161824b9fcbfaca91f20d1ea492417e77003ff4' -or
             $b.source_commit -cne $a.source_commit -or
             $a.stage01 -cne 'NOT_ACCEPTED' -or $b.stage01 -cne 'NOT_ACCEPTED' -or
             $b.original_stage01_acceptance_token_present -ne $false -or
             $b.final_original_stage01_tests_executed -ne $false -or
             $b.original_entrypoint_invoked -ne $false -or
             $b.production_source_modified -ne $false){
            throw 'FALSE_STAGE1_ACCEPTANCE_OR_SOURCE_LOCK'
          }
          if($a.status -cne 'BOUNDED_UNRANK_WITNESS_CAPTURED_NOT_STAGE01' -or
             $a.native_executed -ne $true -or $a.runtime_verified -ne $true -or
             $a.fx_last_contiguous -ne 95 -or $a.fx_all_exact -ne $true -or
             $a.fx_checkpoints.Count -ne 23 -or
             $a.compile_exact -ne $true -or $a.compile_name_exact -ne $true -or
             $a.witness_start_exact -ne $true -or $a.witness_captured_exact -ne $true -or
             $a.init_all_exact -ne $true -or $a.init_checkpoints.Count -ne 4 -or
             $a.phase_all_exact -ne $true -or $a.phase_checkpoints.Count -ne 4 -or
             $a.run_ec_valid -ne $true -or $a.run_ec -eq 0 -or
             $a.output_ec_valid -ne $true -or $a.output_ec -eq 0 -or
             $a.original_ec_valid -ne $true -or $a.trace_ec_valid -ne $true -or
             $a.trace_log_valid -ne $true -or $a.trace_log.Count -lt 2 -or
             $a.final_marker_exact -ne $true){
            throw 'BOUNDED_UNRANK_NATIVE_RECEIPT_INCOMPLETE'
          }
          $core=@('run_ec_code','run_ec_message_codes','output_ec_code','output_ec_message_codes',
            'expected_values','expected_shape','expected_rank','expected_type',
            'count_values','count_rank','count_type','original_ec','original_message_codes',
            'trace_ec','trace_message_codes','trace_args','trace_dp_shape',
            'trace_dp_values','trace_dp_type','trace_log','trace_loop_state',
            'trace_candidate_state','trace_out','trace_rem','trace_rank','trace_result')
          foreach($key in $core){
            if($a.witness_files.PSObject.Properties[$key].Value.valid -ne $true){
              throw ('BOUNDED_UNRANK_WITNESS_FILE_INVALID_'+$key)
            }
          }
          if($b.program_count -ne 26 -or $b.function_count -ne 95 -or
             $b.chunk_count -ne 23 -or $b.witness.init_markers.Count -ne 4 -or
             $b.witness.phase_markers.Count -ne 4 -or
             $b.final_expression -cne 'BOUNDED_UNRANK_WITNESS_ONLY' -or
             $b.trace.source_function -cne 'BoundedUnrank' -or
             $b.trace.alias -cne 'QABoundedUnrankTrace' -or
             $b.trace.source_statements_preserved -ne $true -or
             $b.trace.steps.Count -ne 17 -or
             $b.witness.expected_fixture -cne 'FIX_BOUNDED_444' -or
             (($b.witness.input -join ',') -cne '12,3,4,4,1') -or
             $b.prior_v26_run -ne 45686659807 -or
             $b.prior_v26_artifact_id -ne 15056557607 -or
             $b.prior_v26_artifact_sha256 -cne 'ef9a79666eb91c09a56518576e41bf191456a0ba870d0b73bf2c5a0a5e08e331'){
            throw 'BOUNDED_UNRANK_SOURCE_WITNESS_CONTRACT_MISMATCH'
          }
          Write-Output ('RUN_EC='+$a.run_ec+'|OUTPUT_EC='+$a.output_ec+
            '|ORIGINAL_BOUNDEDUNRANK_EC='+$a.original_ec+
            '|TRACE_COPY_EC='+$a.trace_ec+'|LAST_TRACE_STAGE='+$a.trace_last_stage)
          Write-Output 'NATIVE_95_OF_95_AND_23_OF_23_PREREQUISITES_VERIFIED'
          Write-Output 'STAGE01_NOT_ACCEPTED_ORIGINAL_RUNSTAGE01TESTS_NOT_EXECUTED'
      - name: Hash all diagnostic evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bounded_unrank_evidence,residual_font_evidence | Out-Null
          Get-ChildItem bounded_unrank_evidence,residual_font_evidence -Recurse -File | Sort-Object FullName | ForEach-Object {
            $hash=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.FullName)"
          } | Set-Content -Encoding utf8 bounded_unrank_receipts.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apl-german-stage01-bounded-unrank-v27
          path: |
            bounded_unrank_evidence/
            residual_font_evidence/
            bounded_unrank_receipts.sha256
          retention-days: 21
