name: TEMP Megillah live-source audit

on:
  push:
    branches:
      - fix/megillah-live-source-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fetch live Hebrew source in Chromium
        run: node scripts/temp-megillah-live-source-audit.js

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-megillah-live-source-audit
          path: artifacts/temp-megillah-live-source-audit/
          if-no-files-found: error
          retention-days: 3
