name: Dutch Generic E2E Feasibility (bounded, opt-in)

on:
  push:
    branches:
      - 'Clojure+Nederlands'
    paths:
      - 'test/pastafari/stage02_end_to_end_test.clj'
      - '.github/workflows/clojure-dutch-generic-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-generic-feasibility:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[generic-e2e-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Record exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PROJECT_ID=PC-BRANCH-CLOJURE-DUTCH"
          echo "SOURCE_SHA=$GITHUB_SHA"
      - name: Seven canonical classifications and one bounded interior day
        shell: bash
        run: |
          set -euo pipefail
          clojure -Sdeps '{:paths ["src" "test"]}' -M -e "(require 'pastafari.stage02-end-to-end-test) (pastafari.stage02-end-to-end-test/run-discovery24-generic-feasibility!)"
      - name: Preserve classification and bounded-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-dutch-generic-e2e-feasibility
          path: qa/discovery24_generic_feasibility.edn
          if-no-files-found: warn
          retention-days: 90
