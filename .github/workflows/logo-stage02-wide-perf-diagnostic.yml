name: Logo Stage2 Wide Exact-BI Performance Probe (QA-only)
on:
  push:
    branches:
      - 'qa/logo-ido-wide-perf-diagnostic-20261123'
permissions:
  contents: read
jobs:
  wide-perf-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        width: [32, 33, 64]
    env:
      WIDTH: "${{ matrix.width }}"
    steps:
      - name: Checkout locked diagnostic branch
        uses: actions/checkout@v4

      - name: Check exact QA dependencies and source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/logo-ido-wide-perf-diagnostic-20261123
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object src/exact_integer.logo)" = f2c1a8aa5822423402cd5825255891183f0fc83c
          test "$(git hash-object src/stage02_context.logo)" = f8451359e6ddcf38bb823ff2b78c9acbfbcf7830
          test "$(git hash-object src/stage02_answer_at.logo)" = f0951ba68a191667208b2a2b99b386c5336e49c2
          test "$(git hash-object src/stage02_choose_wide.logo)" = 8fb2dc47c827b8ccd8fa6fdd817b9fa088c51013
          test "$(git hash-object src/stage02_choose_wide_general.logo)" = 5a624a2f3ade5b356b0569e3a1165904ad7e9c1d
          test "$(git hash-object qa/logo_stage2_wide_general_native_vectors.py)" = 26f39a1894f614fd6f2f2657737b8df515a8d034
          test "$(git hash-object CANONICAL_NAMES_LOCK.sha256)" = 0d5b3dec0b01551b1304ee7104d08a57aa1f440b
          python3 -m py_compile qa/logo_stage2_wide_perf_probe.py
          git rev-parse HEAD > "$RUNNER_TEMP/probe-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/probe-tree.txt"
          for path in src/exact_integer.logo src/stage02_context.logo src/stage02_answer_at.logo src/stage02_choose_wide.logo src/stage02_choose_wide_general.logo qa/logo_stage2_wide_general_native_vectors.py qa/logo_stage2_wide_perf_probe.py QA_STAGE2_WIDE_PERF_DIAGNOSTIC_CONTRACT.md .github/workflows/logo-stage02-wide-perf-diagnostic.yml; do
            printf '%s %s\n' "$(git hash-object "$path")" "$path"
          done > "$RUNNER_TEMP/probe-git-blobs.txt"
          sha256sum src/stage02_choose_wide_general.logo qa/logo_stage2_wide_perf_probe.py QA_STAGE2_WIDE_PERF_DIAGNOSTIC_CONTRACT.md > "$RUNNER_TEMP/probe-source-sha256.txt"

      - name: Generate one phase-traced Native case and verify unmodified original
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/logo_stage2_wide_perf_probe.py \
            --width "$WIDTH" \
            --traced-source "$RUNNER_TEMP/probe-traced-general.logo" \
            --fixture "$RUNNER_TEMP/probe-native.logo" \
            | tee "$RUNNER_TEMP/probe-generation.log"
          grep -Fxq 'WIDE_PERF_INSTRUMENTATION_RECOVERY=PASS' "$RUNNER_TEMP/probe-generation.log"
          grep -Fxq 'WIDE_PERF_IS_FULL_SHARD_PASS=NO' "$RUNNER_TEMP/probe-generation.log"
          sha256sum "$RUNNER_TEMP/probe-traced-general.logo" "$RUNNER_TEMP/probe-native.logo" > "$RUNNER_TEMP/probe-generated-sha256.txt"

      - name: Build pinned headless UCBLogo 6.2.5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git gcc g++ make autoconf automake autoconf-archive libncurses-dev
          source_dir="$RUNNER_TEMP/ucblogo-source"
          git clone --quiet --depth 1 --branch version_6.2.5 https://github.com/jrincayc/ucblogo-code.git "$source_dir"
          test "$(git -C "$source_dir" rev-parse HEAD)" = a0215433f07384e4c42fe247525867f11e6f32f7
          cd "$source_dir"
          autoreconf -fi
          CFLAGS="-O2 -std=gnu17" ./configure --prefix="$RUNNER_TEMP/ucblogo-headless" --disable-wx --disable-x11 --disable-docs
          make -j2
          make install
          echo "LOGO_BIN=$RUNNER_TEMP/ucblogo-headless/bin/ucblogo" >> "$GITHUB_ENV"

      - name: Execute focused phase probe with bounded timeout (diagnostic, not stage gate)
        shell: bash
        run: |
          set -euo pipefail
          echo "WIDE_PERF_WIDTH=$WIDTH LIMIT_SECONDS=240"
          set +e
          printf 'bye\n' | timeout --signal=TERM --kill-after=5s 240s \
            stdbuf -oL -eL "$LOGO_BIN" "$RUNNER_TEMP/probe-native.logo" 2>&1 \
            | awk '{ print strftime("%Y-%m-%dT%H:%M:%SZ"), $0; fflush() }' \
            | tee "$RUNNER_TEMP/probe-native.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[1]}" > "$RUNNER_TEMP/probe-exit-code.txt"
          echo "WIDE_PERF_NATIVE_EXIT_CODE=${codes[1]}"
          if [ "${codes[1]}" -ne 0 ]; then
            echo "::error::QA diagnostic incomplete/failed for k=$WIDTH, exit=${codes[1]} (not Native PASS)"
            exit 1
          fi
          grep -Fq 'WIDE_PERF_DIAGNOSTIC_CASE_MATCHES_PYTHON' "$RUNNER_TEMP/probe-native.log"
          if grep -Eq 'WIDE_PERF_WRONG_RANK|WIDE_PERF_BAD_SHAPE|FALIIS|doesn.t like' "$RUNNER_TEMP/probe-native.log"; then
            echo "::error::QA diagnostic mismatch for k=$WIDTH"
            exit 1
          fi
          echo "WIDE_PERF_CASE_COMPLETED_ONLY=YES; FULL_NATIVE_SHARD_ACCEPTED=NO"

      - name: Preserve immutable diagnostic input and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-stage2-wide-perf-diagnostic-k${{ matrix.width }}
          path: |
            ${{ runner.temp }}/probe-commit.txt
            ${{ runner.temp }}/probe-tree.txt
            ${{ runner.temp }}/probe-git-blobs.txt
            ${{ runner.temp }}/probe-source-sha256.txt
            ${{ runner.temp }}/probe-generation.log
            ${{ runner.temp }}/probe-generated-sha256.txt
            ${{ runner.temp }}/probe-native.logo
            ${{ runner.temp }}/probe-traced-general.logo
            ${{ runner.temp }}/probe-native.log
            ${{ runner.temp }}/probe-exit-code.txt
          if-no-files-found: warn
          retention-days: 30
