name: Issue29 v175 production 179-place GMP wide-rank plus weave unrank (ZERO Calendar_Date)
on:
  push:
    branches:
      - qa/issue29-ada-gmp-wide-rank-v175
    paths:
      - '.github/workflows/issue29-v175-gmp-wide-rank.yml'
permissions:
  contents: read
concurrency:
  group: issue29-v175-gmp-wide-rank-one-shot
# The GMP test uses Set to initialize limited values without copies.
  cancel-in-progress: false
jobs:
  bounded-production-gmp-wide-rank-composition:
    if: ${{ github.run_attempt == 1 && github.ref == 'refs/heads/qa/issue29-ada-gmp-wide-rank-v175' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source-locked production GMP components
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify runner Python syntax before any native execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/issue29_v175_gmp_wide_rank_runner.py
          echo "V175_RUNNER_SYNTAX_PASS_NO_EXECUTION"
      - name: Install GNAT 13, GPRBuild, GNATCOLL GMP and GNU time
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gnat-13 gprbuild libgnatcoll-gmp-dev binutils time > apt-install.log 2>&1
          gnat --version > gnat-version.txt
          gprbuild --version > gprbuild-version.txt
          dpkg-query -W libgnatcoll-gmp-dev libgmp10 time > gmp-and-time-packages.txt
          test -x /usr/bin/time
      - name: Lock production components and enforce all 42 native jobs halted
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v175_gmp_wide_rank_runner.py preflight | tee v175-preflight.stdout
          grep -Fx V175_SOURCE_LOCK_AND_179_PLACE_TEST_GATES_PASS v175-preflight.stdout
          test ! -e evidence/RUN_STARTED_WIDE_RANK
      - name: Compile and link direct GMP wide-rank composition; execute none yet
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v175_gmp_wide_rank_runner.py build | tee v175-build.stdout
          grep -Fx V175_PRODUCTION_GMP_WIDE_RANK_BUILD_LINK_PASS_NO_EXECUTION v175-build.stdout
          test -f evidence/build-manifest.json
      - name: Execute one bounded 179-place rank selection and production weave unrank
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v175_gmp_wide_rank_runner.py run-once | tee v175-run.stdout
          grep -Fx V175_PRODUCTION_179_PLACE_GMP_WIDE_RANK_AND_UNRANK_PASS_ZERO_F_ZERO_SOAK v175-run.stdout
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/result.json").read_bytes())
          assert d["status"]=="PASS_PRODUCTION_179_PLACE_GMP_WIDE_RANK_AND_UNRANK_COMPOSITION"
          assert d["assertions"]==31
          assert d["radix_M_places"]==179
          assert d["synthetic_stream_cases"]==6
          assert d["calendar_date_invocations"]==0
          assert d["full_calendar_F_invocations"]==0
          assert d["soak_years"]==0
          assert d["process"]["exit_code"]==0
          assert d["gnu_time"]["exit_code"]==0
          assert d["process"]["limit_violation"] is None
          print("V175_RESULT_JSON_PASS_ZERO_F_ZERO_SOAK")
          PY
      - name: Hash and preserve evidence on success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("evidence");d.mkdir(exist_ok=True)
          files={}
          for p in sorted(d.iterdir()):
              if p.is_file() and p.name!="manifest.sha256.json":
                  raw=p.read_bytes()
                  files[p.name]={"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
          (d/"manifest.sha256.json").write_text(json.dumps(files,sort_keys=True,indent=2)+"\n")
          PY
      - name: Upload one-shot 179-place GMP wide-rank evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v175-production-179-place-gmp-wide-rank-no-calendar-date
          path: |
            evidence/
            apt-update.log
            apt-install.log
            gnat-version.txt
            gprbuild-version.txt
            gmp-and-time-packages.txt
            v175-preflight.stdout
            v175-build.stdout
            v175-run.stdout
          retention-days: 30
          if-no-files-found: warn
