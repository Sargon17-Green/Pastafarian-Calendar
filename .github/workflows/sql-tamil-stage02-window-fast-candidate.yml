name: SQL Tamil Slice25 Fast Window Candidate PG17
on:
  push:
    branches: ['SQL\+தமிழ்']
    paths:
      - 'sql/test/158_stage25_gate_window_fast_candidate.sql'
      - 'sql/test/159_stage25_window_fast_synthetic.py'
      - '.github/workflows/sql-tamil-stage02-window-fast-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-fast-window:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Source lock and independent synthetic equivalence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'SQL+தமிழ்'
          mkdir -p slice25-fast-window-evidence
          printf 'PROJECT_ID=PC-BRANCH-SQL-TAMIL\nGITHUB_SHA=%s\n' "$GITHUB_SHA" > slice25-fast-window-evidence/versions.txt
          python3 --version >> slice25-fast-window-evidence/versions.txt
          python3 sql/test/159_stage25_window_fast_synthetic.py | tee slice25-fast-window-evidence/synthetic.txt
          grep -q 'SYNTHETIC_WINDOW_EQUIVALENCE_PASS 4644 cases' slice25-fast-window-evidence/synthetic.txt
          python3 sql/test/155_stage25_selector_hop_input.py --locked-records sql/test/152_stage25_selector_locked_years.jsonl --self-test | tee slice25-fast-window-evidence/selftest.txt
          grep -qx 'SLICE25_HOP_GENERATOR_SELF_TEST=7/7 PASS' slice25-fast-window-evidence/selftest.txt
          python3 sql/test/155_stage25_selector_hop_input.py --locked-records sql/test/152_stage25_selector_locked_years.jsonl --pair seed --output slice25-fast-window-evidence/input.sql | tee slice25-fast-window-evidence/fixture-check.txt
          grep -qx 'SLICE25_HOP_SOURCE_LOCK=8_years_7_pairs PASS' slice25-fast-window-evidence/fixture-check.txt
          sha256sum sql/test/152_stage25_selector_locked_years.jsonl sql/test/155_stage25_selector_hop_input.py sql/test/158_stage25_gate_window_fast_candidate.sql sql/test/159_stage25_window_fast_synthetic.py .github/workflows/sql-tamil-stage02-window-fast-candidate.yml > slice25-fast-window-evidence/source-sha256.txt
          for i in $(seq -w 0 26); do
            mapfile -t matches < <(find sql -maxdepth 1 -type f -name "$i"'_*.sql')
            test "${#matches[@]}" -eq 1
            sha256sum "${matches[0]}" >> slice25-fast-window-evidence/source-sha256.txt
          done
          sha256sum slice25-fast-window-evidence/input.sql > slice25-fast-window-evidence/generated-sha256.txt
      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name slice25-fast-pg --network none -e POSTGRES_HOST_AUTH_METHOD=trust -v "$GITHUB_WORKSPACE:/work:ro" postgres:17
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres slice25-fast-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres slice25-fast-pg postgres --version | tee -a slice25-fast-window-evidence/versions.txt
      - name: Run source-locked fast-window candidate on native PG17
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for i in $(seq -w 0 26); do
            mapfile -t matches < <(find sql -maxdepth 1 -type f -name "$i"'_*.sql')
            test "${#matches[@]}" -eq 1
            args+=(-f "/work/${matches[0]}")
          done
          args+=(-f /work/slice25-fast-window-evidence/input.sql)
          args+=(-f /work/sql/test/158_stage25_gate_window_fast_candidate.sql)
          docker exec -u postgres slice25-fast-pg psql -At -X -v ON_ERROR_STOP=1 -U postgres -d postgres "${args[@]}" 2>&1 | tee slice25-fast-window-evidence/postgres-results.txt
          grep -q 'SLICE25_WINDOW_FAST_SEED_GREEN=1' slice25-fast-window-evidence/postgres-results.txt
          test "$(grep -c 'SLICE25_FAST_FIELD_PASS=' slice25-fast-window-evidence/postgres-results.txt)" -eq 5
          grep -q 'SLICE25_WINDOW_FAST_CANDIDATES=43' slice25-fast-window-evidence/postgres-results.txt
          printf 'SLICE25_FAST_CANDIDATE_NATIVE_SEED=1\n' > slice25-fast-window-evidence/completion.txt
      - name: Upload original evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-tamil-slice25-fast-window-seed
          path: slice25-fast-window-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop PostgreSQL container
        if: always()
        shell: bash
        run: docker rm -f slice25-fast-pg 2>/dev/null || true
