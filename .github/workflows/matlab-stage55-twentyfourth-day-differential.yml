name: MATLAB Stage55 Twenty-Fourth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_twentyfourth_native.m'
      - 'tools/stage55_after24_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-twentyfourth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-twentyfourth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  twentyfourth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER23 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-twentythird-day-differential
          run-id: 41619996749
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER23
        run: |
          echo 'f922d354507ef95b3dcf545752fd4b5e13200597d116828448a011979eb6a8e1  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_23.json' | sha256sum -c -
      - name: Preflight AFTER24 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after24_interval_five_fields.py
          grep -Fqx 'PIN = "f922d354507ef95b3dcf545752fd4b5e13200597d116828448a011979eb6a8e1"' tools/stage55_after24_interval_five_fields.py
          python3 -m py_compile tools/stage55_after24_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native twenty-fourth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_twentyfourth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after24_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_23.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_24.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_TWENTYFOURTH_PYTHON.log
          grep '^STAGE55_TWENTYFOURTH_ROW ' logs/STAGE55_TWENTYFOURTH_PYTHON.log > logs/STAGE55_TWENTYFOURTH_PYTHON_ROW.txt
          grep '^STAGE55_TWENTYFOURTH_ROW ' logs/STAGE55_TWENTYFOURTH_NATIVE.log > logs/STAGE55_TWENTYFOURTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_TWENTYFOURTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_TWENTYFOURTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_TWENTYFOURTH_PYTHON_ROW.txt logs/STAGE55_TWENTYFOURTH_NATIVE_ROW.txt
          expected="STAGE55_TWENTYFOURTH_ROW POSITION=24 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=24 MONTH_INDEX=14 MONTH_DAY=2"
          grep -Fqx "$expected" logs/STAGE55_TWENTYFOURTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_TWENTYFOURTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_24.json | tee logs/STAGE55_TWENTYFOURTH_DIGEST.txt
          echo 'STAGE55_TWENTYFOURTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-twentyfourth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_23.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_24.json
            logs/STAGE55_TWENTYFOURTH_NATIVE.log
            logs/STAGE55_TWENTYFOURTH_PYTHON.log
            logs/STAGE55_TWENTYFOURTH_PYTHON_ROW.txt
            logs/STAGE55_TWENTYFOURTH_NATIVE_ROW.txt
            logs/STAGE55_TWENTYFOURTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
