name: Fortran Stage 1 Native Compile

on:
  push:
    branches:
      - 'Fortran+English'
  pull_request:
    branches:
      - 'Fortran+English'

permissions:
  contents: read

jobs:
  native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
      - name: Compile and link Stage 1 without running the oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          gfortran "${flags[@]}" -c src/big_integer.f90 -o build/big_integer.o
          gfortran "${flags[@]}" -c src/source_language_catalog.f90 -o build/source_language_catalog.o
          gfortran "${flags[@]}" -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
          gfortran "${flags[@]}" -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
          gfortran "${flags[@]}" -c test/normative_oracle_calendar.f90 -o build/normative_oracle_calendar.o
          gfortran "${flags[@]}" test/stage01_tests.f90 \
            build/big_integer.o \
            build/source_language_catalog.o \
            build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o \
            build/normative_oracle_calendar.o \
            -o build/stage01_tests
          test -x build/stage01_tests
