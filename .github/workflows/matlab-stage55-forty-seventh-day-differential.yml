name: MATLAB Stage55 Forty-Seventh Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_forty_seventh_native.m'
      - 'tools/stage55_after46_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-forty-seventh-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-forty-seventh-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  forty-seventh-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER46 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-forty-sixth-day-differential
          run-id: 44707667928
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER46
        run: |
          echo 'cc1883f92e90f1b56fd1cf5c26167e913f44743f080bae18efcf9239a0279703  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_46.json' | sha256sum -c -
      - name: Preflight AFTER47 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after46_interval_five_fields.py
          grep -Fqx 'PIN = "cc1883f92e90f1b56fd1cf5c26167e913f44743f080bae18efcf9239a0279703"' tools/stage55_after46_interval_five_fields.py
          python3 -m py_compile tools/stage55_after46_interval_five_fields.py
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_46.json' tools/run_stage55_year5000_forty_seventh_native.m
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_47.json' tools/run_stage55_year5000_forty_seventh_native.m
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native forty-seventh-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_forty_seventh_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after46_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_46.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_47.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_FORTY_SEVENTH_PYTHON.log
          grep '^STAGE55_FORTY_SEVENTH_ROW ' logs/STAGE55_FORTY_SEVENTH_PYTHON.log > logs/STAGE55_FORTY_SEVENTH_PYTHON_ROW.txt
          grep '^STAGE55_FORTY_SEVENTH_ROW ' logs/STAGE55_FORTY_SEVENTH_NATIVE.log > logs/STAGE55_FORTY_SEVENTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_FORTY_SEVENTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_FORTY_SEVENTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_FORTY_SEVENTH_PYTHON_ROW.txt logs/STAGE55_FORTY_SEVENTH_NATIVE_ROW.txt
          expected="STAGE55_FORTY_SEVENTH_ROW POSITION=47 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=47 MONTH_INDEX=10 MONTH_DAY=1"
          grep -Fqx "$expected" logs/STAGE55_FORTY_SEVENTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_FORTY_SEVENTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_47.json | tee logs/STAGE55_FORTY_SEVENTH_DIGEST.txt
          echo 'STAGE55_FORTY_SEVENTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-forty-seventh-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_46.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_47.json
            logs/STAGE55_FORTY_SEVENTH_NATIVE.log
            logs/STAGE55_FORTY_SEVENTH_PYTHON.log
            logs/STAGE55_FORTY_SEVENTH_PYTHON_ROW.txt
            logs/STAGE55_FORTY_SEVENTH_NATIVE_ROW.txt
            logs/STAGE55_FORTY_SEVENTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
