name: SQL Tamil Stage 2 Slice 19 Cutlet Names
on:
  push:
    branches:
      - 'SQL\+தமிழ்'
    paths:
      - 'sql/00_schema.sql'
      - 'sql/01_source_language_catalog.sql'
      - 'sql/02_monster_bootstrap.sql'
      - 'sql/03_stage02_production_core.sql'
      - 'sql/04_stage02_stone_states.sql'
      - 'sql/05_stage02_hidden_drop.sql'
      - 'sql/06_stage02_visible_drops.sql'
      - 'sql/07_stage02_bowls.sql'
      - 'sql/08_stage02_bowl_round.sql'
      - 'sql/09_stage02_post_stir_round.sql'
      - 'sql/10_stage02_sauce.sql'
      - 'sql/11_stage02_answer_stream.sql'
      - 'sql/12_stage02_choose_rank.sql'
      - 'sql/13_stage02_gate_gaps.sql'
      - 'sql/14_stage02_gate_day_selector.sql'
      - 'sql/15_stage02_year5000_gate_candidates.sql'
      - 'sql/16_stage02_year5000.sql'
      - 'sql/17_stage02_adjacent_year_navigation.sql'
      - 'sql/18_stage02_target_year_navigation.sql'
      - 'sql/19_stage02_cutlet_count.sql'
      - 'sql/20_stage02_cutlet_partition.sql'
      - 'sql/21_stage02_cutlet_names.sql'
      - 'sql/test/10_normative_reference.sql'
      - 'sql/test/119_stage02_cutlet_names_oracle.py'
      - 'sql/test/120_stage02_cutlet_names_native.sql'
      - 'sql/test/121_stage02_cutlet_names_differential.sql'
      - '.github/workflows/sql-tamil-stage02-cutlet-names-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cutlet-names-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sql-tamil-cutlet-names-logs
          docker run --detach --name sql-tamil-slice19-pg --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$GITHUB_WORKSPACE:/work:ro" postgres:17
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres sql-tamil-slice19-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres sql-tamil-slice19-pg postgres --version | tee sql-tamil-cutlet-names-logs/versions.txt
          echo "Git SHA: $GITHUB_SHA" | tee -a sql-tamil-cutlet-names-logs/versions.txt
      - name: Build independent bounded Python fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 sql/test/119_stage02_cutlet_names_oracle.py --self-test | tee sql-tamil-cutlet-names-logs/python-selftest.txt
          python3 sql/test/119_stage02_cutlet_names_oracle.py --emit-sql > sql-tamil-cutlet-names-logs/goldens.sql
          test "$(grep -c '^INSERT INTO slice19_goldens' sql-tamil-cutlet-names-logs/goldens.sql)" -eq 122
          sha256sum sql-tamil-cutlet-names-logs/goldens.sql | tee sql-tamil-cutlet-names-logs/goldens-sha256.txt
      - name: Native 42 named assertions and 122 fixture checks
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres sql-tamil-slice19-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -f /work/sql/00_schema.sql \
            -f /work/sql/01_source_language_catalog.sql \
            -f /work/sql/02_monster_bootstrap.sql \
            -f /work/sql/03_stage02_production_core.sql \
            -f /work/sql/04_stage02_stone_states.sql \
            -f /work/sql/05_stage02_hidden_drop.sql \
            -f /work/sql/06_stage02_visible_drops.sql \
            -f /work/sql/07_stage02_bowls.sql \
            -f /work/sql/08_stage02_bowl_round.sql \
            -f /work/sql/09_stage02_post_stir_round.sql \
            -f /work/sql/10_stage02_sauce.sql \
            -f /work/sql/11_stage02_answer_stream.sql \
            -f /work/sql/12_stage02_choose_rank.sql \
            -f /work/sql/13_stage02_gate_gaps.sql \
            -f /work/sql/14_stage02_gate_day_selector.sql \
            -f /work/sql/15_stage02_year5000_gate_candidates.sql \
            -f /work/sql/16_stage02_year5000.sql \
            -f /work/sql/17_stage02_adjacent_year_navigation.sql \
            -f /work/sql/18_stage02_target_year_navigation.sql \
            -f /work/sql/19_stage02_cutlet_count.sql \
            -f /work/sql/20_stage02_cutlet_partition.sql \
            -f /work/sql/21_stage02_cutlet_names.sql \
            -f /work/sql-tamil-cutlet-names-logs/goldens.sql \
            -f /work/sql/test/120_stage02_cutlet_names_native.sql 2>&1 | tee sql-tamil-cutlet-names-logs/native.txt
      - name: Preserve original job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-tamil-slice19-names-native
          path: sql-tamil-cutlet-names-logs/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: docker rm --force sql-tamil-slice19-pg 2>/dev/null || true
  production-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sql-tamil-cutlet-names-logs
          docker run --detach --name sql-tamil-slice19-pg --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$GITHUB_WORKSPACE:/work:ro" postgres:17
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres sql-tamil-slice19-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres sql-tamil-slice19-pg postgres --version | tee sql-tamil-cutlet-names-logs/versions.txt
          echo "Git SHA: $GITHUB_SHA" | tee -a sql-tamil-cutlet-names-logs/versions.txt
      - name: Verify four production-only isolation gates
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres sql-tamil-slice19-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -f /work/sql/00_schema.sql \
            -f /work/sql/01_source_language_catalog.sql \
            -f /work/sql/02_monster_bootstrap.sql \
            -f /work/sql/03_stage02_production_core.sql \
            -f /work/sql/04_stage02_stone_states.sql \
            -f /work/sql/05_stage02_hidden_drop.sql \
            -f /work/sql/06_stage02_visible_drops.sql \
            -f /work/sql/07_stage02_bowls.sql \
            -f /work/sql/08_stage02_bowl_round.sql \
            -f /work/sql/09_stage02_post_stir_round.sql \
            -f /work/sql/10_stage02_sauce.sql \
            -f /work/sql/11_stage02_answer_stream.sql \
            -f /work/sql/12_stage02_choose_rank.sql \
            -f /work/sql/13_stage02_gate_gaps.sql \
            -f /work/sql/14_stage02_gate_day_selector.sql \
            -f /work/sql/15_stage02_year5000_gate_candidates.sql \
            -f /work/sql/16_stage02_year5000.sql \
            -f /work/sql/17_stage02_adjacent_year_navigation.sql \
            -f /work/sql/18_stage02_target_year_navigation.sql \
            -f /work/sql/19_stage02_cutlet_count.sql \
            -f /work/sql/20_stage02_cutlet_partition.sql \
            -f /work/sql/21_stage02_cutlet_names.sql 2>&1 | tee sql-tamil-cutlet-names-logs/production-load.txt
          docker exec -u postgres sql-tamil-slice19-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres             -c "CREATE TEMP TABLE slice19_isolation AS SELECT * FROM (VALUES
              ('no-reference-schema',to_regnamespace('pastafari_sql_tamil_test') IS NULL),
              ('signature',to_regprocedure('pastafari_sql_tamil.choose_cutlet_names(pastafari_sql_tamil.sauce_result,integer)') IS NOT NULL),
              ('immutable-strict-pair',(SELECT count(*)=2 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='pastafari_sql_tamil' AND p.proname IN ('choose_cutlet_names','cutlet_names_unrank') AND p.provolatile='i' AND p.proisstrict)),
              ('no-reference-or-mutable-table',(SELECT count(*)=0 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='pastafari_sql_tamil' AND p.proname IN ('choose_cutlet_names','cutlet_names_unrank') AND (position('pastafari_sql_tamil_test' IN pg_get_functiondef(p.oid))>0 OR EXISTS(SELECT 1 FROM pg_depend d WHERE d.classid='pg_proc'::regclass AND d.objid=p.oid AND d.refclassid='pg_class'::regclass))))
              ) x(name,ok)"             -c 'SELECT name,ok FROM slice19_isolation ORDER BY name'             -c 'SELECT 1/((count(*)=4 AND bool_and(ok))::integer) AS isolation_4_of_4 FROM slice19_isolation'             2>&1 | tee sql-tamil-cutlet-names-logs/isolation.txt
      - name: Preserve original job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-tamil-slice19-names-isolation
          path: sql-tamil-cutlet-names-logs/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: docker rm --force sql-tamil-slice19-pg 2>/dev/null || true
  cutlet-names-differential:
    strategy:
      fail-fast: false
      matrix:
        case: [k6a, k6b, k7a, k7b, k12a, k12b, k17a, k17b]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sql-tamil-cutlet-names-logs
          docker run --detach --name sql-tamil-slice19-pg --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$GITHUB_WORKSPACE:/work:ro" postgres:17
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres sql-tamil-slice19-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres sql-tamil-slice19-pg postgres --version | tee sql-tamil-cutlet-names-logs/versions.txt
          echo "Git SHA: $GITHUB_SHA" | tee -a sql-tamil-cutlet-names-logs/versions.txt
      - name: Create independent reference database
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres sql-tamil-slice19-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres             -c 'CREATE DATABASE slice19_differential'
      - name: Generate exact single-case differential SQL
        shell: bash
        env:
          CASE_LABEL: ${{ matrix.case }}
        run: |
          set -euo pipefail
          case "$CASE_LABEL" in
            k6a|k6b|k7a|k7b|k12a|k12b|k17a|k17b) ;;
            *) echo "Unexpected CASE_LABEL" >&2; exit 64 ;;
          esac
          test "$(grep -o '__CASE_LABEL__' sql/test/121_stage02_cutlet_names_differential.sql | wc -l)" -eq 3
          sed "s/__CASE_LABEL__/$CASE_LABEL/g" sql/test/121_stage02_cutlet_names_differential.sql             > sql-tamil-cutlet-names-logs/differential-case.sql
          ! grep -q '__CASE_LABEL__' sql-tamil-cutlet-names-logs/differential-case.sql
          sha256sum sql-tamil-cutlet-names-logs/differential-case.sql             | tee sql-tamil-cutlet-names-logs/differential-case-sha256.txt
      - name: Verify exact full-array normative equivalence
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres sql-tamil-slice19-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d slice19_differential \
            -f /work/sql/00_schema.sql \
            -f /work/sql/01_source_language_catalog.sql \
            -f /work/sql/02_monster_bootstrap.sql \
            -f /work/sql/03_stage02_production_core.sql \
            -f /work/sql/04_stage02_stone_states.sql \
            -f /work/sql/05_stage02_hidden_drop.sql \
            -f /work/sql/06_stage02_visible_drops.sql \
            -f /work/sql/07_stage02_bowls.sql \
            -f /work/sql/08_stage02_bowl_round.sql \
            -f /work/sql/09_stage02_post_stir_round.sql \
            -f /work/sql/10_stage02_sauce.sql \
            -f /work/sql/11_stage02_answer_stream.sql \
            -f /work/sql/12_stage02_choose_rank.sql \
            -f /work/sql/13_stage02_gate_gaps.sql \
            -f /work/sql/14_stage02_gate_day_selector.sql \
            -f /work/sql/15_stage02_year5000_gate_candidates.sql \
            -f /work/sql/16_stage02_year5000.sql \
            -f /work/sql/17_stage02_adjacent_year_navigation.sql \
            -f /work/sql/18_stage02_target_year_navigation.sql \
            -f /work/sql/19_stage02_cutlet_count.sql \
            -f /work/sql/20_stage02_cutlet_partition.sql \
            -f /work/sql/21_stage02_cutlet_names.sql \
            -f /work/sql/test/10_normative_reference.sql \
            -f /work/sql-tamil-cutlet-names-logs/differential-case.sql 2>&1 | tee sql-tamil-cutlet-names-logs/differential.txt
      - name: Preserve original job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-tamil-slice19-names-diff-${{ matrix.case }}
          path: sql-tamil-cutlet-names-logs/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: docker rm --force sql-tamil-slice19-pg 2>/dev/null || true
