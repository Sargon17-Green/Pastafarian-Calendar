name: JavaScript + Interlingue — finalize Stage 59 content only

on:
  push:
    branches:
      - 'JavaScript\+Interlingue'
    paths:
      - '.github/workflows/javascript-interlingue-stage59-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: javascript-interlingue-stage59-finalize-content-only
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener li branche complet
        uses: actions/checkout@v6
        with:
          ref: JavaScript+Interlingue
          fetch-depth: 0
          persist-credentials: true

      - name: Guardar li expected branch state
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e63ce8886d00b700f8b866c85530a356d4fd3414'
          FINALIZER='.github/workflows/javascript-interlingue-stage59-finalize.yml'

          git merge-base --is-ancestor "$EXPECTED" HEAD

          mapfile -t after_expected < <(git diff --name-only "$EXPECTED"..HEAD)
          for path in "${after_expected[@]}"; do
            case "$path" in
              "$FINALIZER")
                ;;
              *)
                echo "Refusa unexpected change after expected branch state: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Restaurar li root e remover accidental package files
        shell: bash
        run: |
          set -euo pipefail
          GOOD='3e6fe2bb035a300b02d33534015e4011ea767019'

          git restore --source="$GOOD" --staged --worktree -- README.md SHA256SUMS.txt

          git rm -f --ignore-unmatch             README.txt             REFERENCE_CORRECTED_TREE.zip             STAGE_59_CORRECTED_MANIFEST.json             javascript-interlingue-stage59-apply-corrected.yml

          cmp README.md <(git show "$GOOD:README.md")
          cmp package.json <(git show "$GOOD:package.json")

      - name: Constructer Stage 59 in li correct hierarchy
        shell: bash
        run: |
          set -euo pipefail
          FLAT='2635db4101a0b640a294fd79054fb2213008a8b8'

          copy_flat() {
            local source="$1"
            local dest="$2"
            mkdir -p "$(dirname "$dest")"
            git show "$FLAT:$source" > "$dest"
            git add "$dest"
          }

          copy_flat env.example server/.env.example
          copy_flat Dockerfile server/Dockerfile
          copy_flat README.md server/README.md
          copy_flat cache-codec.js server/cache-codec.js
          copy_flat cache-store.js server/cache-store.js
          copy_flat calendar-engine.js server/calendar-engine.js
          copy_flat compose.yaml server/compose.yaml
          copy_flat engine-worker-client.js server/engine-worker-client.js
          copy_flat engine-worker.js server/engine-worker.js
          copy_flat http-server.js server/http-server.js
          copy_flat index.js server/index.js
          copy_flat package.json server/package.json
          copy_flat stage58-persistence-bridge.js server/stage58-persistence-bridge.js

          copy_flat server-stage59-all.js tests/server-stage59-all.js
          copy_flat server-stage59-cache.js tests/server-stage59-cache.js
          copy_flat server-stage59-fake-core.js tests/server-stage59-fake-core.js
          copy_flat server-stage59-http.js tests/server-stage59-http.js
          copy_flat server-stage59-real-benchmark.js tests/server-stage59-real-benchmark.js
          copy_flat server-stage59-real-contract.js tests/server-stage59-real-contract.js

      - name: Verificar li staged content e conservar li normative name correction
        shell: bash
        run: |
          set -euo pipefail
          GOOD='3e6fe2bb035a300b02d33534015e4011ea767019'

          cmp README.md <(git show "$GOOD:README.md")
          cmp package.json <(git show "$GOOD:package.json")

          node tests/source-language-normative-names.js

          mapfile -t staged < <(git diff --cached --name-only)
          for path in "${staged[@]}"; do
            case "$path" in
              README.md|README.txt|REFERENCE_CORRECTED_TREE.zip|SHA256SUMS.txt|STAGE_59_CORRECTED_MANIFEST.json|javascript-interlingue-stage59-apply-corrected.yml|server/*|tests/server-stage59-*.js)
                ;;
              *)
                echo "Refusa unexpected staged path: $path" >&2
                exit 1
                ;;
            esac
          done

          test -z "$(git diff --cached --name-only -- '.github/workflows/**')"
          git diff --cached --check

      - name: Provar li historical e browser contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/verify-stage-01.js
          node tests/browser-interface-all.js

      - name: Provar Stage 59
        shell: bash
        run: |
          set -euo pipefail
          node tests/server-stage59-all.js
          node tests/server-stage59-real-contract.js
          node tests/server-stage59-real-benchmark.js --run-heavy

      - name: Crear e publicar li non-workflow content commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          test -z "$(git diff --cached --name-only -- '.github/workflows/**')"
          git commit -m 'Reparar li root e adjunter Stage 59 server hierarchy'
          git push origin HEAD:JavaScript+Interlingue
