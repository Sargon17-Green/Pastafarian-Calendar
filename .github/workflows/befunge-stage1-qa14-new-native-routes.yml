name: Befunge QA14 New Native 2D Ownership and Geometry Routes
on:
  push:
    branches: ['qa-befunge98-stage1-order-isolation-20261008']
    paths:
      - 'qa/stage1_qa14_native_new_routes.py'
      - 'qa/stage1_qa14_native_new_routes_audit.py'
      - '.github/workflows/befunge-stage1-qa14-new-native-routes.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-new-2d-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout QA frozen reference and actual source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin all three independently executable Befunge sources and interpreter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = 560d6aa5807a7f766213a33835cce85eab0fa40c
          test "$(git hash-object reference/work_counts.b98)" = f941efc793c9eee4accf5d03873f8ed029b16725
          test "$(git hash-object reference/save.b98)" = 7b5e79aa6e2bfb636717cb018a3db6a13fb2bb44
          python3 -m py_compile qa/stage1_qa14_native_new_routes_audit.py qa/stage1_qa14_native_new_routes.py
          PYTHONPATH=qa python3 qa/stage1_qa14_native_new_routes_audit.py
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
      - name: Execute 8 NEW directed Native paths and 24 independent native references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa14-new-native"
          docker run --rm -e PYFUNGE_NO_PSYCO=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -v "$RUNNER_TEMP/qa14-new-native:/out" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 650s python -u qa/stage1_qa14_native_new_routes.py ${{ matrix.shard }} /out
            '
      - name: Independently replay physical p/g and executed mutable code from NEW traces
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=qa python3 qa/stage1_qa14_native_new_routes_audit.py shard "$RUNNER_TEMP/qa14-new-native" ${{ matrix.shard }}
          test -s "$RUNNER_TEMP/qa14-new-native/qa14_shard_proof.json"
          find "$RUNNER_TEMP/qa14-new-native" -maxdepth 1 -name '*.tsv' -exec gzip -n -6 {} +
      - name: Preserve original NEW native traces, manifest, stdout, and proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa14-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/qa14-new-native/
          if-no-files-found: warn
  four-native-shards-independent-coverage-audit:
    needs: [native-new-2d-routes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download original receipts from this exact workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa14-merge"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'qa14-shard-*' --dir "$RUNNER_TEMP/qa14-merge"
          for i in 0 1 2 3; do test -s "$RUNNER_TEMP/qa14-merge/qa14-shard-$i/qa14_shard_proof.json"; done
      - name: Fail-closed 32-case cross-shard and native physical history audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=qa python3 qa/stage1_qa14_native_new_routes_audit.py aggregate \
            "$RUNNER_TEMP/qa14-merge/qa14-shard-0" \
            "$RUNNER_TEMP/qa14-merge/qa14-shard-1" \
            "$RUNNER_TEMP/qa14-merge/qa14-shard-2" \
            "$RUNNER_TEMP/qa14-merge/qa14-shard-3" | tee qa14_summary.txt
          grep -q 'QA14_EXPANDED_NATIVE_ALL_SHARDS_PASS' qa14_summary.txt
          grep -q 'STAGE1_OPEN_NOT_FULL_GEOMETRY_OR_OWNERSHIP_ACCEPTANCE' qa14_summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa14-four-shard-final-audit
          path: qa14_summary.txt
          if-no-files-found: warn
