name: MATLAB Stage55 Forty-Fourth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_forty_fourth_native.m'
      - 'tools/stage55_after44_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-forty-fourth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-forty-fourth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  forty-fourth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER43 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-forty-third-day-differential
          run-id: 44364330035
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER43
        run: |
          echo '12f37236f6769a748603a5a2a4ddd25a705e052af27922f7c7c1dded78afa6e6  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_42.json' | sha256sum -c -
      - name: Preflight AFTER44 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after44_interval_five_fields.py
          grep -Fqx 'PIN = "12f37236f6769a748603a5a2a4ddd25a705e052af27922f7c7c1dded78afa6e6"' tools/stage55_after44_interval_five_fields.py
          python3 -m py_compile tools/stage55_after44_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native forty-fourth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_forty_fourth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after44_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_42.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_43.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_FORTY_FOURTH_PYTHON.log
          grep '^STAGE55_FORTY_FOURTH_ROW ' logs/STAGE55_FORTY_FOURTH_PYTHON.log > logs/STAGE55_FORTY_FOURTH_PYTHON_ROW.txt
          grep '^STAGE55_FORTY_FOURTH_ROW ' logs/STAGE55_FORTY_FOURTH_NATIVE.log > logs/STAGE55_FORTY_FOURTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_FORTY_FOURTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_FORTY_FOURTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_FORTY_FOURTH_PYTHON_ROW.txt logs/STAGE55_FORTY_FOURTH_NATIVE_ROW.txt
          expected="STAGE55_FORTY_FOURTH_ROW POSITION=44 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=44 MONTH_INDEX=46 MONTH_DAY=2"
          grep -Fqx "$expected" logs/STAGE55_FORTY_FOURTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_FORTY_FOURTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_43.json | tee logs/STAGE55_FORTY_FOURTH_DIGEST.txt
          echo 'STAGE55_FORTY_FOURTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-forty-fourth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_42.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_43.json
            logs/STAGE55_FORTY_FOURTH_NATIVE.log
            logs/STAGE55_FORTY_FOURTH_PYTHON.log
            logs/STAGE55_FORTY_FOURTH_PYTHON_ROW.txt
            logs/STAGE55_FORTY_FOURTH_NATIVE_ROW.txt
            logs/STAGE55_FORTY_FOURTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
