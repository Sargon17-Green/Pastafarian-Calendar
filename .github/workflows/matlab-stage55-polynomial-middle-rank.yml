name: Stage55 GMP Actual Source Rank Full Word Certificate (QA)
on:
  push:
    branches:
      - qa/matlab-stage55-polynomial-middle-rank-20261125
    paths:
      - .github/workflows/matlab-stage55-polynomial-middle-rank.yml
      - tests/run_stage55_polynomial_real_year_middle_rank.m

permissions:
  contents: read
  actions: read

jobs:
  polynomial-middle-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source, fixtures, independent certificates and QA-only diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "GATE_BEGIN"
          expected_ref="refs/heads/qa/matlab-stage55-polynomial-middle-rank-20261125"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "GATE_FAIL ref expected=$expected_ref actual=$GITHUB_REF"
            exit 1
          fi
          echo "GATE_PASS ref"

          if git merge-base --is-ancestor de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD; then
            echo "GATE_PASS frozen base is an ancestor"
          else
            echo "GATE_FAIL frozen base is not an ancestor"
            exit 1
          fi

          check_object() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git rev-parse "HEAD:$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "GATE_FAIL object path=$path expected=$expected actual=$actual"
              exit 1
            fi
            echo "GATE_PASS object path=$path sha=$actual"
          }

          check_object "src" "d04d76694bb1246be5943f1dadd6e9d285e5ce97"
          check_object "src/+pastafari/WholeMonthWeavingFamilyPolynomial.m" "d365ef6a03f2fccc8f42da3cd866abd66345bbde"
          check_object "src/+pastafari/countWholeWeavingSuffixByFirstEndpoint.m" "48f8b148edb621e1a789385456def77f3dfd8d28"
          check_object "src/+pastafari/unrankGeneralWeaveSuffixChunkAdjoint.m" "1302f173b77c31cd7cc886989c0155943747525f"
          check_object "src/+pastafari/countWholeWeavingNextLetterBlocksAdjoint.m" "229352c3627de7b807436dbe7d3f7698b1cebb2b"
          check_object "src/+pastafari/countWholeWeavingSuffixByEndpoints.m" "a8ba85b28067cdf1b76ee6ab5dbe7f20a6e9cb94"
          check_object "src/+pastafari/allOpenedWholeWeaveChildCountsCommonDenominator.m" "ec815257fd5302b591b94c6c70842d26773dc87f"
          check_object "src/+pastafari/BigInt.m" "86581532df7492a236283c5ee9410ca281e2e6f5"
          check_object "src/+pastafari/ValidationManager.m" "8be154aa7b8a36f1a282515c81f29742719af3a6"
          check_object "src/+pastafari/MonthWeavingCompatibilityRoute.m" "2bfde51537b332dda6be7f9646a69613d48352c7"
          check_object "tests/fixtures/stage55_year5000_middle_word.json" "cb4983bcb15e4840b26b46ef2c0566ab870a111e"
          check_object "tests/fixtures/stage55_year5000_appendix_a_metadata.json" "a1383b111a88203b0d652b8f0a0e9af1a8b75f25"
          check_object "tools/stage55_full_prefix_inverse_rank.cpp" "542f091e308afdc5131c52b5a5006588cad8bce5"

          python3 - <<'PY'
          import subprocess
          expected = sorted([
              ".github/workflows/matlab-stage55-polynomial-middle-rank.yml",
              "tests/run_stage55_polynomial_real_year_middle_rank.m",
          ])
          actual = sorted(subprocess.check_output(
              ["git", "diff", "--name-only",
               "de4ba7748c148d398cb50dc99b9454952d3d69b8", "HEAD"],
              text=True,
          ).splitlines())
          print("GATE_FILESET_EXPECTED=" + repr(expected))
          print("GATE_FILESET_ACTUAL=" + repr(actual))
          if actual != expected:
              raise SystemExit("GATE_FAIL QA-only file set differs")
          source = open("tests/run_stage55_polynomial_real_year_middle_rank.m", encoding="utf-8").read()
          forbidden = [
              "calendarDateSpaghetti(",
              "finalMonsterIntegration(",
              "MonthWeavingCompatibilityRoute.call",
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit("GATE_FAIL forbidden source token: " + token)
          if "WholeMonthWeavingFamilyPolynomial" not in source:
              raise SystemExit("GATE_FAIL polynomial candidate not referenced")
          print("GATE_PASS test-source scope")
          PY

          if git diff --quiet de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD -- src; then
            echo "GATE_PASS production src unchanged"
          else
            git diff --stat de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD -- src
            echo "GATE_FAIL production src changed"
            exit 1
          fi

          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "SRC_TREE=$(git rev-parse HEAD:src)"
            echo "REFERENCE_CXX_INVERSE_RUN=45686680226"
            echo "SOURCE_RANK_CATALOG_ORACLE_RUN=45691066424"
            echo "PROJECTION_SOAK_RUN=45655790072"
            echo "REFERENCE_ROOT_COUNT_SHA256=c0c08ac89c8faaaf589d1b3e076fe1e96405f2ad7172a15efa9d028fb43fb6f8"
            echo "REFERENCE_MIDDLE_RANK_SHA256=cd5ce4036fc8e99355a4bab5d48c3db473422083d035df5e0af25297be1be3b6"
          } > evidence/source-lock.txt
          echo "GATE_PASS all source locks"
      - name: Restore immutable native rank and independently checked rank
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15178712147/zip > "$RUNNER_TEMP/source-rank.zip"
          echo "424c346b85ef09eeb3615332429f3319dca4a21a9e61e315c44f456d6b88ba3f  $RUNNER_TEMP/source-rank.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          sys.set_int_max_str_digits(0)
          ev=Path("evidence")
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"])/"source-rank.zip") as z:
              assert z.testzip() is None
              for name in ("source-weave-rank.json","source-weave-rank-oracle.json"):
                  (ev/name).write_bytes(z.read(name))
          d=json.loads((ev/"source-weave-rank.json").read_text())
          o=json.loads((ev/"source-weave-rank-oracle.json").read_text())
          digest=lambda n:hashlib.sha256(n.encode("ascii")).hexdigest()
          assert d["rank"]==o["rank"]
          assert digest(d["rank"])==o["rank_sha256"]=="160ca5c4a8ee5d0ec29c583a0d7ab91a71d8be4b7dc4c139ebaae066596dcff3"
          assert digest(d["root_count"])==o["count_sha256"]=="c0c08ac89c8faaaf589d1b3e076fe1e96405f2ad7172a15efa9d028fb43fb6f8"
          assert d["native_selector_executed"] and d["rejection_steps"]=="0"
          assert 1<=int(d["rank"])<=int(d["root_count"])
          (ev/"rank.txt").write_text(d["rank"])
          (ev/"root-count.txt").write_text(d["root_count"])
          print("SOURCE_RANK_LOCK_PASS")
          PY

      - name: Compile independent GMP unrank driver around frozen inverse counter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev
          cat > "$RUNNER_TEMP/source-rank-unrank.cpp" <<'CPP'
          #define main frozen_inverse_main
          #include "stage55_full_prefix_inverse_rank.cpp"
          #undef main
          int main(int argc,char** argv) {
              try {
                  if(argc!=5) throw std::runtime_error("fixture rank root output-dir");
                  run_tiny_self_test();
                  std::string f=read_file(argv[1]);
                  auto key=f.find("\"month_lengths\"");
                  if(key==std::string::npos) throw std::runtime_error("fixture key");
                  auto L=parse_integer_array(f,key);
                  if(L.size()!=45 || std::accumulate(L.begin(),L.end(),0L)!=4244)
                      throw std::runtime_error("fixture dimensions");
                  Big target=parse_big_decimal(read_file(argv[2]),"source rank");
                  Big root=parse_big_decimal(read_file(argv[3]),"root count");
                  Big rank=target,count=root,low=1;
                  if(rank<1 || rank>root) throw std::runtime_error("rank bounds");
                  std::vector<long> R=L,word;
                  long opened=0,closed=0;
                  std::string dir=argv[4];
                  std::ofstream trace(dir+"/source-prefix-intervals.tsv");
                  if(!trace) throw std::runtime_error("trace open");
                  trace<<"position\tsymbol\tlow\thigh\topened\tclosed\n";
                  auto start=Clock::now();
                  for(long pos=1;pos<=4244;++pos) {
                      if(std::chrono::duration<double>(Clock::now()-start).count()>900)
                          throw std::runtime_error("bounded time exceeded");
                      auto blocks=first_letter_blocks(R,opened,closed);
                      Big total=0;
                      for(auto &b:blocks) {
                          if(b<0) throw std::runtime_error("negative block");
                          total+=b;
                      }
                      if(total!=count) throw std::runtime_error("parent count mismatch");
                      long selected=-1;
                      for(long j=0;j<45;++j) {
                          if(rank>blocks[j]) {rank-=blocks[j];low+=blocks[j];}
                          else {selected=j;count=blocks[j];break;}
                      }
                      if(selected<0 || count<=0 || rank<1 || rank>count)
                          throw std::runtime_error("unrank bounds");
                      long j=selected;
                      if(R[j]<=0) throw std::runtime_error("exhausted label");
                      if(R[j]==L[j]) {
                          if(j!=opened) throw std::runtime_error("opening order");
                          ++opened;
                      }
                      if(--R[j]==0) {
                          if(j!=closed) throw std::runtime_error("closing order");
                          ++closed;
                      }
                      Big high=low+count-1;
                      if(low+rank-1!=target || target>high)
                          throw std::runtime_error("interval invariant");
                      word.push_back(j+1);
                      trace<<pos<<'\t'<<j+1<<'\t'<<low<<'\t'<<high<<'\t'<<opened<<'\t'<<closed<<'\n';
                      if(!trace) throw std::runtime_error("trace write");
                      if(pos%100==0 || pos==4244) {
                          trace.flush();
                          std::cout<<"GMP_SOURCE_PROGRESS POS="<<pos<<" OPENED="<<opened<<" CLOSED="<<closed<<std::endl;
                      }
                  }
                  if(opened!=45 || closed!=45 || rank!=1 || count!=1 || low!=target ||
                     std::any_of(R.begin(),R.end(),[](long x){return x!=0;}))
                      throw std::runtime_error("terminal invariant");
                  trace.close();
                  std::ofstream out(dir+"/source-word.json");
                  out<<"[";
                  for(size_t i=0;i<word.size();++i) out<<(i?",":"")<<word[i];
                  out<<"]\n";out.close();
                  std::cout<<"GMP_SOURCE_FULL_WORD_PASS SYMBOLS=4244 RANK_EXACT=1 CLOSED=45"<<std::endl;
                  return 0;
              } catch(const std::exception& e){std::cerr<<e.what()<<std::endl;return 1;}
          }
          CPP
          cp "$RUNNER_TEMP/source-rank-unrank.cpp" evidence/
          g++ -std=c++17 -O3 -Wall -Wextra -I "$PWD/tools" "$RUNNER_TEMP/source-rank-unrank.cpp" -lgmpxx -lgmp -o "$RUNNER_TEMP/source-rank-unrank"
          timeout 920s "$RUNNER_TEMP/source-rank-unrank" tests/fixtures/stage55_year5000_appendix_a_metadata.json evidence/rank.txt evidence/root-count.txt evidence | tee evidence/gmp-unrank.log

      - name: Audit full source-rank certificate and publish interval hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,gzip,hashlib,json,sys
          from pathlib import Path
          sys.set_int_max_str_digits(0)
          ev=Path("evidence")
          R=int((ev/"rank.txt").read_text()); N=int((ev/"root-count.txt").read_text())
          L=json.loads(Path("tests/fixtures/stage55_year5000_appendix_a_metadata.json").read_text())["month_lengths"]
          word=json.loads((ev/"source-word.json").read_text())
          assert len(word)==4244
          remaining=L[:]; lo,hi=1,N; opened=closed=0; hashes=[]; first44=first45=None
          digest=lambda n:hashlib.sha256(str(n).encode("ascii")).hexdigest()
          with (ev/"source-prefix-intervals.tsv").open() as f:
              for i,row in enumerate(csv.DictReader(f,delimiter="\t"),1):
                  assert i<=4244 and int(row["position"])==i
                  symbol=int(row["symbol"]); a,b=int(row["low"]),int(row["high"])
                  assert symbol==word[i-1] and 1<=symbol<=45 and lo<=a<=R<=b<=hi
                  if remaining[symbol-1]==L[symbol-1]:
                      assert symbol==opened+1; opened+=1
                      if opened==44: first44=i
                      if opened==45: first45=i
                  remaining[symbol-1]-=1
                  assert remaining[symbol-1]>=0
                  if remaining[symbol-1]==0:
                      assert symbol==closed+1; closed+=1
                  assert opened==int(row["opened"]) and closed==int(row["closed"])
                  hashes.append(dict(position=i,symbol=symbol,rank_sha256=digest(R-a+1),count_sha256=digest(b-a+1),opened=opened,closed=closed))
                  lo,hi=a,b
          assert len(hashes)==4244 and lo==hi==R and remaining==[0]*45 and opened==closed==45
          (ev/"source-interval-hashes.json").write_text(json.dumps(hashes,separators=(",",":"))+"\n")
          summary=dict(schema="STAGE55_GMP_SOURCE_RANK_CERTIFICATE/1",symbols=4244,rank_sha256=digest(R),root_sha256=digest(N),
                       word_sha256=hashlib.sha256((ev/"source-word.json").read_bytes()).hexdigest(),
                       opened44_at=first44,opened45_at=first45,closed=45,full_converter_calls=0,stage55_accepted=False)
          (ev/"source-certificate-summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          with (ev/"source-prefix-intervals.tsv").open("rb") as src, gzip.open(ev/"source-prefix-intervals.tsv.gz","wb") as dst:
              import shutil
              shutil.copyfileobj(src,dst)
          (ev/"source-prefix-intervals.tsv").unlink()
          print("SOURCE_CERTIFICATE_AUDIT_PASS",json.dumps(summary))
          PY
          git diff --exit-code -- src

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-gmp-source-rank-certificate-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
