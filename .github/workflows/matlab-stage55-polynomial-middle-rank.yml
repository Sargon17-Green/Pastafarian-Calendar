name: MATLAB Stage55 Actual Source Rank Full Word Differential (QA)
on:
  push:
    branches:
      - qa/matlab-stage55-polynomial-middle-rank-20261125
    paths:
      - .github/workflows/matlab-stage55-polynomial-middle-rank.yml
      - tests/run_stage55_polynomial_real_year_middle_rank.m

permissions:
  contents: read
  actions: read

jobs:
  polynomial-middle-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source, fixtures, independent certificates and QA-only diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "GATE_BEGIN"
          expected_ref="refs/heads/qa/matlab-stage55-polynomial-middle-rank-20261125"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "GATE_FAIL ref expected=$expected_ref actual=$GITHUB_REF"
            exit 1
          fi
          echo "GATE_PASS ref"

          if git merge-base --is-ancestor de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD; then
            echo "GATE_PASS frozen base is an ancestor"
          else
            echo "GATE_FAIL frozen base is not an ancestor"
            exit 1
          fi

          check_object() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git rev-parse "HEAD:$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "GATE_FAIL object path=$path expected=$expected actual=$actual"
              exit 1
            fi
            echo "GATE_PASS object path=$path sha=$actual"
          }

          check_object "src" "d04d76694bb1246be5943f1dadd6e9d285e5ce97"
          check_object "src/+pastafari/WholeMonthWeavingFamilyPolynomial.m" "d365ef6a03f2fccc8f42da3cd866abd66345bbde"
          check_object "src/+pastafari/countWholeWeavingSuffixByFirstEndpoint.m" "48f8b148edb621e1a789385456def77f3dfd8d28"
          check_object "src/+pastafari/unrankGeneralWeaveSuffixChunkAdjoint.m" "1302f173b77c31cd7cc886989c0155943747525f"
          check_object "src/+pastafari/countWholeWeavingNextLetterBlocksAdjoint.m" "229352c3627de7b807436dbe7d3f7698b1cebb2b"
          check_object "src/+pastafari/countWholeWeavingSuffixByEndpoints.m" "a8ba85b28067cdf1b76ee6ab5dbe7f20a6e9cb94"
          check_object "src/+pastafari/allOpenedWholeWeaveChildCountsCommonDenominator.m" "ec815257fd5302b591b94c6c70842d26773dc87f"
          check_object "src/+pastafari/BigInt.m" "86581532df7492a236283c5ee9410ca281e2e6f5"
          check_object "src/+pastafari/ValidationManager.m" "8be154aa7b8a36f1a282515c81f29742719af3a6"
          check_object "src/+pastafari/MonthWeavingCompatibilityRoute.m" "2bfde51537b332dda6be7f9646a69613d48352c7"
          check_object "tests/fixtures/stage55_year5000_middle_word.json" "cb4983bcb15e4840b26b46ef2c0566ab870a111e"
          check_object "tests/fixtures/stage55_year5000_appendix_a_metadata.json" "a1383b111a88203b0d652b8f0a0e9af1a8b75f25"
          check_object "tools/stage55_full_prefix_inverse_rank.cpp" "542f091e308afdc5131c52b5a5006588cad8bce5"

          python3 - <<'PY'
          import subprocess
          expected = sorted([
              ".github/workflows/matlab-stage55-polynomial-middle-rank.yml",
              "tests/run_stage55_polynomial_real_year_middle_rank.m",
          ])
          actual = sorted(subprocess.check_output(
              ["git", "diff", "--name-only",
               "de4ba7748c148d398cb50dc99b9454952d3d69b8", "HEAD"],
              text=True,
          ).splitlines())
          print("GATE_FILESET_EXPECTED=" + repr(expected))
          print("GATE_FILESET_ACTUAL=" + repr(actual))
          if actual != expected:
              raise SystemExit("GATE_FAIL QA-only file set differs")
          source = open("tests/run_stage55_polynomial_real_year_middle_rank.m", encoding="utf-8").read()
          forbidden = [
              "calendarDateSpaghetti(",
              "finalMonsterIntegration(",
              "MonthWeavingCompatibilityRoute.call",
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit("GATE_FAIL forbidden source token: " + token)
          if "WholeMonthWeavingFamilyPolynomial" not in source:
              raise SystemExit("GATE_FAIL polynomial candidate not referenced")
          print("GATE_PASS test-source scope")
          PY

          if git diff --quiet de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD -- src; then
            echo "GATE_PASS production src unchanged"
          else
            git diff --stat de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD -- src
            echo "GATE_FAIL production src changed"
            exit 1
          fi

          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "SRC_TREE=$(git rev-parse HEAD:src)"
            echo "REFERENCE_CXX_INVERSE_RUN=45686680226"
            echo "SOURCE_RANK_CATALOG_ORACLE_RUN=45691066424"
            echo "PROJECTION_SOAK_RUN=45655790072"
            echo "REFERENCE_ROOT_COUNT_SHA256=c0c08ac89c8faaaf589d1b3e076fe1e96405f2ad7172a15efa9d028fb43fb6f8"
            echo "REFERENCE_MIDDLE_RANK_SHA256=cd5ce4036fc8e99355a4bab5d48c3db473422083d035df5e0af25297be1be3b6"
          } > evidence/source-lock.txt
          echo "GATE_PASS all source locks"
      - name: Restore exact native rank, GMP certificate and verified arithmetic overlay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15178712147/zip > "$RUNNER_TEMP/source-rank.zip"
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15179093713/zip > "$RUNNER_TEMP/gmp-source.zip"
          echo "424c346b85ef09eeb3615332429f3319dca4a21a9e61e315c44f456d6b88ba3f  $RUNNER_TEMP/source-rank.zip" | sha256sum -c -
          echo "b5a833b220ce728b99a3626fd372e73c330fe1c01bfea5be3fecaea089863420  $RUNNER_TEMP/gmp-source.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,shutil,sys,zipfile
          from pathlib import Path
          sys.set_int_max_str_digits(0)
          tmp=Path(os.environ["RUNNER_TEMP"]); ev=Path("evidence")
          digest=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(tmp/"source-rank.zip") as z:
              assert z.testzip() is None
              d=json.loads(z.read("source-weave-rank.json"))
              o=json.loads(z.read("source-weave-rank-oracle.json"))
              optimized=z.read("BigInt-QA-overlay.m.txt")
              assert digest(optimized)=="22df597bf9174e38e38b968e8b80fe456882029a94c526f199fd030f03e0980d"
              assert d["rank"]==o["rank"] and d["native_selector_executed"] and d["rejection_steps"]=="0"
              rank=d["rank"].encode("ascii"); count=d["root_count"].encode("ascii")
              assert digest(rank)=="160ca5c4a8ee5d0ec29c583a0d7ab91a71d8be4b7dc4c139ebaae066596dcff3"
              assert digest(count)=="c0c08ac89c8faaaf589d1b3e076fe1e96405f2ad7172a15efa9d028fb43fb6f8"
              (ev/"rank.txt").write_bytes(rank); (ev/"root-count.txt").write_bytes(count)
          with zipfile.ZipFile(tmp/"gmp-source.zip") as z:
              assert z.testzip() is None
              assert z.read("rank.txt")==rank and z.read("root-count.txt")==count
              word=z.read("source-word.json")
              assert digest(word)=="76396b8dc72b209c9f273d7ebbab3c6a09b3424eff8ee71acd1566680641786e"
              hashes=z.read("source-interval-hashes.json")
              summary=json.loads(z.read("source-certificate-summary.json"))
              assert summary["symbols"]==4244 and summary["closed"]==45
              assert summary["rank_sha256"]==digest(rank) and summary["root_sha256"]==digest(count)
              assert len(json.loads(hashes))==4244
              (ev/"source-word.json").write_bytes(word)
              (ev/"source-interval-hashes.json").write_bytes(hashes)
              (ev/"source-certificate-summary.json").write_bytes(z.read("source-certificate-summary.json"))
          overlay=tmp/"qa-arithmetic-overlay"
          shutil.copytree("src",overlay)
          (overlay/"+pastafari"/"BigInt.m").write_bytes(optimized)
          (ev/"BigInt-QA-overlay.m.txt").write_bytes(optimized)
          for source in Path("src").rglob("*"):
              if source.is_file() and source.as_posix()!="src/+pastafari/BigInt.m":
                  assert source.read_bytes()==(overlay/source.relative_to("src")).read_bytes()
          print("QA_ACTUAL_SOURCE_INPUTS_LOCK_PASS")
          PY
          echo "PASTAFARI_QA_OVERLAY=$RUNNER_TEMP/qa-arithmetic-overlay" >> "$GITHUB_ENV"
          git diff --exit-code -- src

      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a

      - name: Compute actual source word independently in MATLAB
        timeout-minutes: 200
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            diary('evidence/STAGE55_ACTUAL_SOURCE_NATIVE.log');
            try;
              fprintf('MATLAB_NATIVE_VERSION=%s\n',version);
              addpath('tests');
              run_stage55_polynomial_real_year_middle_rank(5001);
              diary off;
            catch ME;
              disp(getReport(ME,'extended','hyperlinks','off'));
              diary off;
              rethrow(ME);
            end

      - name: Audit native ledger against independent GMP certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          ev=Path("evidence")
          cert=json.loads((ev/"source-interval-hashes.json").read_text())
          rows=[json.loads(x) for x in (ev/"source-native-ledger.jsonl").read_text().splitlines()]
          end=json.loads((ev/"latest-source-native-cursor.json").read_text())
          summary=json.loads((ev/"source-native-summary.json").read_text())
          word=json.loads((ev/"source-word.json").read_text())
          lengths=json.loads(Path("tests/fixtures/stage55_year5000_appendix_a_metadata.json").read_text())["month_lengths"]
          remaining=lengths[:]; opened=closed=0
          assert len(rows)==len(cert)==len(word)==4244
          for i,(row,ref) in enumerate(zip(rows,cert),1):
              for k in ("position","symbol","opened","closed","rank_sha256","count_sha256"):
                  assert row[k]==ref[k],(i,k)
              symbol=row["symbol"]
              assert row["position"]==i and symbol==word[i-1]
              if remaining[symbol-1]==lengths[symbol-1]:
                  assert symbol==opened+1; opened+=1
              remaining[symbol-1]-=1
              assert remaining[symbol-1]>=0
              if remaining[symbol-1]==0:
                  assert symbol==closed+1; closed+=1
              assert row["opened"]==opened and row["closed"]==closed
          assert opened==closed==45 and remaining==[0]*45
          assert end["position"]==4244 and end["prefix"]==word and end["remaining"]==remaining
          assert end["rank_decimal"]==end["count_decimal"]=="1"
          assert summary["symbols_matched"]==4244 and summary["full_word_verified"]
          assert summary["full_converter_calls"]==0 and not summary["stage55_accepted"]
          print("QA_ACTUAL_SOURCE_NATIVE_LEDGER_PASS SYMBOLS=4244 CLOSED=45")
          PY
          git diff --exit-code -- src

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-matlab-actual-source-word-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
