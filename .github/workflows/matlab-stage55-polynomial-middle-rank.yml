name: MATLAB Stage55 Certified Optimized Prefix 12 to 202 (QA)
on:
  push:
    branches:
      - qa/matlab-stage55-polynomial-middle-rank-20261125
    paths:
      - .github/workflows/matlab-stage55-polynomial-middle-rank.yml
      - tests/run_stage55_polynomial_real_year_middle_rank.m

permissions:
  contents: read
  actions: read

jobs:
  polynomial-middle-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source, fixtures, independent certificates and QA-only diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "GATE_BEGIN"
          expected_ref="refs/heads/qa/matlab-stage55-polynomial-middle-rank-20261125"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "GATE_FAIL ref expected=$expected_ref actual=$GITHUB_REF"
            exit 1
          fi
          echo "GATE_PASS ref"

          if git merge-base --is-ancestor de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD; then
            echo "GATE_PASS frozen base is an ancestor"
          else
            echo "GATE_FAIL frozen base is not an ancestor"
            exit 1
          fi

          check_object() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git rev-parse "HEAD:$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "GATE_FAIL object path=$path expected=$expected actual=$actual"
              exit 1
            fi
            echo "GATE_PASS object path=$path sha=$actual"
          }

          check_object "src" "d04d76694bb1246be5943f1dadd6e9d285e5ce97"
          check_object "src/+pastafari/WholeMonthWeavingFamilyPolynomial.m" "d365ef6a03f2fccc8f42da3cd866abd66345bbde"
          check_object "src/+pastafari/countWholeWeavingSuffixByFirstEndpoint.m" "48f8b148edb621e1a789385456def77f3dfd8d28"
          check_object "src/+pastafari/unrankGeneralWeaveSuffixChunkAdjoint.m" "1302f173b77c31cd7cc886989c0155943747525f"
          check_object "src/+pastafari/countWholeWeavingNextLetterBlocksAdjoint.m" "229352c3627de7b807436dbe7d3f7698b1cebb2b"
          check_object "src/+pastafari/countWholeWeavingSuffixByEndpoints.m" "a8ba85b28067cdf1b76ee6ab5dbe7f20a6e9cb94"
          check_object "src/+pastafari/allOpenedWholeWeaveChildCountsCommonDenominator.m" "ec815257fd5302b591b94c6c70842d26773dc87f"
          check_object "src/+pastafari/BigInt.m" "86581532df7492a236283c5ee9410ca281e2e6f5"
          check_object "src/+pastafari/ValidationManager.m" "8be154aa7b8a36f1a282515c81f29742719af3a6"
          check_object "src/+pastafari/MonthWeavingCompatibilityRoute.m" "2bfde51537b332dda6be7f9646a69613d48352c7"
          check_object "tests/fixtures/stage55_year5000_middle_word.json" "cb4983bcb15e4840b26b46ef2c0566ab870a111e"
          check_object "tests/fixtures/stage55_year5000_appendix_a_metadata.json" "a1383b111a88203b0d652b8f0a0e9af1a8b75f25"
          check_object "tools/stage55_full_prefix_inverse_rank.cpp" "542f091e308afdc5131c52b5a5006588cad8bce5"

          python3 - <<'PY'
          import subprocess
          expected = sorted([
              ".github/workflows/matlab-stage55-polynomial-middle-rank.yml",
              "tests/run_stage55_polynomial_real_year_middle_rank.m",
          ])
          actual = sorted(subprocess.check_output(
              ["git", "diff", "--name-only",
               "de4ba7748c148d398cb50dc99b9454952d3d69b8", "HEAD"],
              text=True,
          ).splitlines())
          print("GATE_FILESET_EXPECTED=" + repr(expected))
          print("GATE_FILESET_ACTUAL=" + repr(actual))
          if actual != expected:
              raise SystemExit("GATE_FAIL QA-only file set differs")
          source = open("tests/run_stage55_polynomial_real_year_middle_rank.m", encoding="utf-8").read()
          forbidden = [
              "calendarDateSpaghetti(",
              "finalMonsterIntegration(",
              "MonthWeavingCompatibilityRoute.call",
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit("GATE_FAIL forbidden source token: " + token)
          if "WholeMonthWeavingFamilyPolynomial" not in source:
              raise SystemExit("GATE_FAIL polynomial candidate not referenced")
          print("GATE_PASS test-source scope")
          PY

          if git diff --quiet de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD -- src; then
            echo "GATE_PASS production src unchanged"
          else
            git diff --stat de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD -- src
            echo "GATE_FAIL production src changed"
            exit 1
          fi

          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "SRC_TREE=$(git rev-parse HEAD:src)"
            echo "REFERENCE_CXX_INVERSE_RUN=45686680226"
            echo "SOURCE_RANK_CATALOG_ORACLE_RUN=45691066424"
            echo "PROJECTION_SOAK_RUN=45655790072"
            echo "REFERENCE_ROOT_COUNT_SHA256=c0c08ac89c8faaaf589d1b3e076fe1e96405f2ad7172a15efa9d028fb43fb6f8"
            echo "REFERENCE_MIDDLE_RANK_SHA256=cd5ce4036fc8e99355a4bab5d48c3db473422083d035df5e0af25297be1be3b6"
          } > evidence/source-lock.txt
          echo "GATE_PASS all source locks"
      - name: Verify prior cursor, frozen arithmetic overlay and independent interval certificate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15158822421/zip > "$RUNNER_TEMP/prior-prefix.zip"
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15057540500/zip > "$RUNNER_TEMP/independent-cxx.zip"
          echo "f2332e7f82dbefeb3a96d653389f4d916c73b7f2c54201146bdd49f548168e80  $RUNNER_TEMP/prior-prefix.zip" | sha256sum -c -
          echo "8863bb2ae94e3ffb1425d43156d868074bf8d1837937f87b08d3df575039fc5e  $RUNNER_TEMP/independent-cxx.zip" | sha256sum -c -
          python3 - <<'PY'
          import gzip, hashlib, json, os, shutil, sys, zipfile
          from pathlib import Path
          sys.set_int_max_str_digits(0)
          tmp=Path(os.environ["RUNNER_TEMP"])
          ev=Path("evidence")
          digest=lambda b: hashlib.sha256(b).hexdigest()
          dec_hash=lambda n: digest(str(n).encode("ascii"))
          with zipfile.ZipFile(tmp/"prior-prefix.zip") as z:
              assert z.testzip() is None
              prior=z.read("prefix-12-result.json")
              optimized=z.read("BigInt-QA-overlay.m.txt")
              assert digest(prior)=="32a73cec6e9270df5c6a71724e55500cb47f3db556326c21ee56ddf77bc42772"
              assert digest(optimized)=="22df597bf9174e38e38b968e8b80fe456882029a94c526f199fd030f03e0980d"
              (ev/"prior-prefix-result.json").write_bytes(prior)
              (ev/"BigInt-QA-overlay.m.txt").write_bytes(optimized)
          p=json.loads(prior)
          base="stage55-full-prefix-inverse-rank/"
          with zipfile.ZipFile(tmp/"independent-cxx.zip") as z:
              assert z.testzip() is None
              wordbytes=z.read(base+"word.json")
              fixturebytes=z.read(base+"fixture.json")
              assert digest(wordbytes)=="82042fef5a65cc8b08120d069fa9d8f31c05e6761040f82c3341328ded9b44e5"
              assert digest(fixturebytes)=="fd5f292e44e47bdba1b2be3cb8992ccbb6e63c56edd5b74f5e5adc6f3d6e5212"
              assert wordbytes==Path("tests/fixtures/stage55_year5000_middle_word.json").read_bytes()
              assert fixturebytes==Path("tests/fixtures/stage55_year5000_appendix_a_metadata.json").read_bytes()
              word=json.loads(wordbytes); fixture=json.loads(fixturebytes)
              report=json.loads(z.read(base+"report.json"))
              root_count=int(report["root_count"]); R=int(report["middle_rank"])
              assert dec_hash(root_count)=="c0c08ac89c8faaaf589d1b3e076fe1e96405f2ad7172a15efa9d028fb43fb6f8"
              assert dec_hash(R)=="cd5ce4036fc8e99355a4bab5d48c3db473422083d035df5e0af25297be1be3b6"
              assert R==root_count//2+1
              trace=[json.loads(x) for x in gzip.decompress(z.read(base+"prefix_intervals.jsonl.gz")).splitlines()]
          assert len(trace)==len(word)==4244 and word.index(44)+1==202 and word.index(45)+1==245
          lengths=fixture["month_lengths"]
          assert len(lengths)==45 and sum(lengths)==4244
          lo,hi=1,root_count
          hashes=[]
          remaining=list(lengths)
          for i,r in enumerate(trace,1):
              assert r["prefix_length"]==i and r["symbol"]==word[i-1]
              a,b=int(r["rank_low"]),int(r["rank_high"])
              assert lo<=a<=R<=b<=hi
              assert dec_hash(a)==r["rank_low_sha256"] and dec_hash(b)==r["rank_high_sha256"]
              lo,hi=a,b
              remaining[word[i-1]-1]-=1
              assert min(remaining)>=0
              rank=R-a+1; count=b-a+1
              if i<=202:
                  hashes.append(dict(position=i,symbol=word[i-1],rank_sha256=dec_hash(rank),count_sha256=dec_hash(count)))
              if i==12:
                  assert p["prefix"]==word[:12] and p["remaining"]==remaining
                  assert int(p["rank_decimal"])==rank and int(p["count_decimal"])==count
                  assert p["opened_up_to"]==10 and p["closed_up_to"]==0
          assert lo==hi==R and remaining==[0]*45
          (ev/"interval-hashes.json").write_text(json.dumps(hashes,separators=(",",":"))+"\n")
          overlay=tmp/"qa-arithmetic-overlay"
          shutil.copytree("src",overlay)
          (overlay/"+pastafari"/"BigInt.m").write_bytes(optimized)
          for source in Path("src").rglob("*"):
              if source.is_file() and source.as_posix()!="src/+pastafari/BigInt.m":
                  assert source.read_bytes()==(overlay/source.relative_to("src")).read_bytes()
          print("QA_CERTIFICATE_LOCK_PASS INTERVALS=4244 PRIOR_PREFIX=12 TARGET=202")
          PY
          echo "PASTAFARI_QA_OVERLAY=$RUNNER_TEMP/qa-arithmetic-overlay" >> "$GITHUB_ENV"
          git diff --exit-code -- src

      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a

      - name: Resume certified optimized prefix 13 through 202
        timeout-minutes: 105
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            mkdir('evidence');
            diary('evidence/STAGE55_POLYNOMIAL_MIDDLE_RANK_NATIVE.log');
            try;
              fprintf('MATLAB_NATIVE_VERSION=%s\n',version);
              addpath('tests');
              run_stage55_polynomial_real_year_middle_rank(202);
              diary off;
            catch ME;
              disp(getReport(ME,'extended','hyperlinks','off'));
              fprintf('STAGE55_POLYNOMIAL_MIDDLE_RANK_FAIL\n');
              diary off;
              rethrow(ME);
            end

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-polynomial-certified-prefix-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
