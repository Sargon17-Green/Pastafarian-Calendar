name: MATLAB Stage55 Actual Source Word Five Field Projection (QA)
on:
  push:
    branches:
      - qa/matlab-stage55-polynomial-middle-rank-20261125
    paths:
      - .github/workflows/matlab-stage55-polynomial-middle-rank.yml
      - tests/run_stage55_polynomial_real_year_middle_rank.m

permissions:
  contents: read
  actions: read

jobs:
  polynomial-middle-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source, fixtures, independent certificates and QA-only diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "GATE_BEGIN"
          expected_ref="refs/heads/qa/matlab-stage55-polynomial-middle-rank-20261125"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "GATE_FAIL ref expected=$expected_ref actual=$GITHUB_REF"
            exit 1
          fi
          echo "GATE_PASS ref"

          if git merge-base --is-ancestor de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD; then
            echo "GATE_PASS frozen base is an ancestor"
          else
            echo "GATE_FAIL frozen base is not an ancestor"
            exit 1
          fi

          check_object() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git rev-parse "HEAD:$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "GATE_FAIL object path=$path expected=$expected actual=$actual"
              exit 1
            fi
            echo "GATE_PASS object path=$path sha=$actual"
          }

          check_object "src" "d04d76694bb1246be5943f1dadd6e9d285e5ce97"
          check_object "src/+pastafari/WholeMonthWeavingFamilyPolynomial.m" "d365ef6a03f2fccc8f42da3cd866abd66345bbde"
          check_object "src/+pastafari/countWholeWeavingSuffixByFirstEndpoint.m" "48f8b148edb621e1a789385456def77f3dfd8d28"
          check_object "src/+pastafari/unrankGeneralWeaveSuffixChunkAdjoint.m" "1302f173b77c31cd7cc886989c0155943747525f"
          check_object "src/+pastafari/countWholeWeavingNextLetterBlocksAdjoint.m" "229352c3627de7b807436dbe7d3f7698b1cebb2b"
          check_object "src/+pastafari/countWholeWeavingSuffixByEndpoints.m" "a8ba85b28067cdf1b76ee6ab5dbe7f20a6e9cb94"
          check_object "src/+pastafari/allOpenedWholeWeaveChildCountsCommonDenominator.m" "ec815257fd5302b591b94c6c70842d26773dc87f"
          check_object "src/+pastafari/BigInt.m" "86581532df7492a236283c5ee9410ca281e2e6f5"
          check_object "src/+pastafari/ValidationManager.m" "8be154aa7b8a36f1a282515c81f29742719af3a6"
          check_object "src/+pastafari/MonthWeavingCompatibilityRoute.m" "2bfde51537b332dda6be7f9646a69613d48352c7"
          check_object "tests/fixtures/stage55_year5000_middle_word.json" "cb4983bcb15e4840b26b46ef2c0566ab870a111e"
          check_object "tests/fixtures/stage55_year5000_appendix_a_metadata.json" "a1383b111a88203b0d652b8f0a0e9af1a8b75f25"
          check_object "tools/stage55_full_prefix_inverse_rank.cpp" "542f091e308afdc5131c52b5a5006588cad8bce5"

          check_object "tools/run_stage55_year5000_middle_projection_native.m" "4567def9f004c6862cb5db1060df8140b292c8ea"
          check_object "tools/stage55_full_year_projection_oracle.py" "e4f8d1b043467af8cc7baadbbe6e465cc2a27adb"

          python3 - <<'PY'
          import subprocess
          expected = sorted([
              ".github/workflows/matlab-stage55-polynomial-middle-rank.yml",
              "tests/run_stage55_polynomial_real_year_middle_rank.m",
          ])
          actual = sorted(subprocess.check_output(
              ["git", "diff", "--name-only",
               "de4ba7748c148d398cb50dc99b9454952d3d69b8", "HEAD"],
              text=True,
          ).splitlines())
          print("GATE_FILESET_EXPECTED=" + repr(expected))
          print("GATE_FILESET_ACTUAL=" + repr(actual))
          if actual != expected:
              raise SystemExit("GATE_FAIL QA-only file set differs")
          source = open("tests/run_stage55_polynomial_real_year_middle_rank.m", encoding="utf-8").read()
          forbidden = [
              "calendarDateSpaghetti(",
              "finalMonsterIntegration(",
              "MonthWeavingCompatibilityRoute.call",
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit("GATE_FAIL forbidden source token: " + token)
          if "WholeMonthWeavingFamilyPolynomial" not in source:
              raise SystemExit("GATE_FAIL polynomial candidate not referenced")
          print("GATE_PASS test-source scope")
          PY

          if git diff --quiet de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD -- src; then
            echo "GATE_PASS production src unchanged"
          else
            git diff --stat de4ba7748c148d398cb50dc99b9454952d3d69b8 HEAD -- src
            echo "GATE_FAIL production src changed"
            exit 1
          fi

          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "SRC_TREE=$(git rev-parse HEAD:src)"
            echo "REFERENCE_CXX_INVERSE_RUN=45686680226"
            echo "SOURCE_RANK_CATALOG_ORACLE_RUN=45691066424"
            echo "PROJECTION_SOAK_RUN=45655790072"
            echo "REFERENCE_ROOT_COUNT_SHA256=c0c08ac89c8faaaf589d1b3e076fe1e96405f2ad7172a15efa9d028fb43fb6f8"
            echo "REFERENCE_MIDDLE_RANK_SHA256=cd5ce4036fc8e99355a4bab5d48c3db473422083d035df5e0af25297be1be3b6"
          } > evidence/source-lock.txt
          echo "GATE_PASS all source locks"
      - name: Restore native word and independently generate five-field projection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15183489189/zip > "$RUNNER_TEMP/native.zip"
          echo "8a760aba7359f34c90d92f5104712fc6882695077786ef6e4fb50a88f08d0b2e  $RUNNER_TEMP/native.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          ev=Path("evidence")
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"])/"native.zip") as z:
              assert z.testzip() is None
              s=json.loads(z.read("source-native-summary.json"))
              end=json.loads(z.read("latest-source-native-cursor.json"))
              w=z.read("source-word.json")
              rows=[json.loads(x) for x in z.read("source-native-ledger.jsonl").splitlines()]
              cert=json.loads(z.read("source-interval-hashes.json"))
              assert hashlib.sha256(w).hexdigest()=="76396b8dc72b209c9f273d7ebbab3c6a09b3424eff8ee71acd1566680641786e"
              word=json.loads(w)
              assert len(word)==len(rows)==len(cert)==4244
              assert s["full_word_verified"] and s["symbols_matched"]==4244 and s["closed_months"]==45
              assert s["full_converter_calls"]==0 and not s["stage55_accepted"]
              assert end["prefix"]==word and end["rank_decimal"]==end["count_decimal"]=="1"
              assert end["remaining"]==[0]*45 and end["closed"]==45
              for i,(row,ref) in enumerate(zip(rows,cert),1):
                  assert row["position"]==i and row["symbol"]==word[i-1]
                  assert all(row[k]==ref[k] for k in ("position","symbol","opened","closed","rank_sha256","count_sha256"))
              # Use native output, not the independent word as projection input.
              (ev/"native-word.json").write_text(json.dumps(end["prefix"],separators=(",",":"))+"\n")
              (ev/"prior-native-summary.json").write_bytes(z.read("source-native-summary.json"))
          assert hashlib.sha256((ev/"native-word.json").read_bytes()).hexdigest()=="76396b8dc72b209c9f273d7ebbab3c6a09b3424eff8ee71acd1566680641786e"
          src=Path("tools/run_stage55_year5000_middle_projection_native.m").read_text()
          old="fullfile(root,'tests','fixtures', ...\n    'stage55_year5000_middle_word.json')"
          new="fullfile(root,'evidence','native-word.json')"
          assert src.count(old)==1
          src=src.replace(old,new).replace("run_stage55_year5000_middle_projection_native()","run_stage55_actual_source_projection_native()",1)
          dst=Path("tools/run_stage55_actual_source_projection_native.m")
          dst.write_text(src)
          (ev/"projection-runner.m.txt").write_text(src)
          print("QA_NATIVE_WORD_LOCK_PASS SYMBOLS=4244")
          PY
          python3 tools/stage55_full_year_projection_oracle.py tests/fixtures/stage55_year5000_appendix_a_metadata.json evidence/oracle --word-json evidence/native-word.json

      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a

      - name: Native PATCH25 projection twice for actual source word
        timeout-minutes: 20
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('tools');
            run_stage55_actual_source_projection_native();

      - name: Audit five-field rows and original discrepancy witness without converter invocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,json,shutil
          from pathlib import Path
          ev=Path("evidence")
          oracle=ev/"oracle"/"STAGE55_YEAR5000_CANDIDATE.csv"
          data=oracle.read_bytes()
          for trial in (1,2):
              path=Path("logs")/f"STAGE55_YEAR5000_CANDIDATE_RUN{trial}.csv"
              assert path.read_bytes()==data, f"native projection differs trial {trial}"
              shutil.copy2(path,ev/path.name)
          rows=list(csv.DictReader(data.decode("ascii").splitlines()))
          assert len(rows)==4244
          f=json.loads(Path("tests/fixtures/stage55_year5000_appendix_a_metadata.json").read_text())
          position=f["calculation_day"]-f["first_day"]+1
          assert position==2032
          row=rows[position-1]
          fields=["YEAR","CUTLET_INDEX","CUTLET_DAY","MONTH_INDEX","MONTH_DAY"]
          actual=[int(row[k]) for k in fields]
          assert actual==[5000,10,503,20,56], actual
          result=dict(schema="STAGE55_SOURCE_WORD_PROJECTION/1",native_trials=2,rows_per_trial=4244,
              matched_rows=8488,negative_boundaries=2,projection_sha256=hashlib.sha256(data).hexdigest(),
              source_word_rank_verified_prior_run=45959356502,calculation_day=f["calculation_day"],
              witness_position=position,witness=actual,reference_original=[5000,10,503,20,56],
              historical_ada_original=[5000,10,503,30,52],witness_matches_reference=True,
              full_converter_calls=0,stage55_accepted=False,scope="fixed source-derived metadata and independently certified native weaving; not full converter")
          (ev/"projection-summary.json").write_text(json.dumps(result,indent=2)+"\n")
          shutil.copy2("logs/STAGE55_MIDDLE_PROJECTION_NATIVE.log",ev/"projection-native.log")
          print("QA_ACTUAL_SOURCE_PROJECTION_PASS",json.dumps(result))
          PY
          git diff --exit-code -- src

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-matlab-actual-source-projection-${{ github.run_id }}
          path: |
            evidence/
            logs/STAGE55_MIDDLE_PROJECTION_NATIVE.log
          if-no-files-found: warn
          retention-days: 30
