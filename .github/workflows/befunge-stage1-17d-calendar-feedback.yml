name: Befunge 17D calendar feedback
on:
  push:
    branches: [qa-befunge98-stage1-order-isolation-20261008]
    paths:
      - 'qa/spaghetti12_17d_calendar_feedback.beq'
      - 'qa/qa12_17d_calendar_*.py'
      - '.github/workflows/befunge-stage1-17d-calendar-feedback.yml'
permissions:
  contents: read
jobs:
  native-calendar-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        group: [cooperative, threads, interventions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cwesson/funge-plus-plus
          ref: cd6d7f005b4fc33b486fcc2380b35406f6125ca4
          path: third_party/funge-plus-plus
          submodules: recursive
          persist-credentials: false
      - name: Lock historical source and exact upstream revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = "560d6aa5807a7f766213a33835cce85eab0fa40c"
          test "$(git hash-object qa/spaghetti10_17d_dual_worker_macro_candidate.beq)" = "010efd012ae52a60740aa97750b5a02519912e92"
          test "$(git hash-object qa/spaghetti11_17d_three_worker_cascade.beq)" = "990d8fb2b84c7ee728634bb93a8e7baaef992c40"
          test "$(git hash-object qa/spaghetti11_17d_cascade_208_generated_candidate.beq)" = "afa261c6eab74d69b6c3afbe6c641fc130d627c0"
          test "$(git -C third_party/funge-plus-plus rev-parse HEAD)" = "cd6d7f005b4fc33b486fcc2380b35406f6125ca4"
      - name: Instrument only disposable Funge++ to trace executed physical p writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('third_party/funge-plus-plus/src/FungeUniverse.cpp')
          s=p.read_text();t=chr(9)
          old='\n'.join([t*4+'threads.pop();',t*4+'delete thread;',t*3+'}',
                         t*3+'mutex.unlock();',t*2+'}else{'])
          new=old.replace(t*3+'mutex.unlock();',
                   t*3+'cv.notify_all(); // disposable shutdown fix\n'+t*3+'mutex.unlock();')
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('third_party/funge-plus-plus/src/Unefunge93Strategy.cpp')
          s=p.read_text()
          old='\tfield.put(v+storage, stack.top().pop());'
          new='''\tconst Vector address = v+storage;
          \tconst stack_t written = stack.top().pop();
          \tfield.put(address, written);
          \tif(address.get(0) >= 3505 && address.get(0) < 100000 &&
          \t   address.get(1) > 0 && address.get(1) <= 13){
          \t\tstd::cerr << "QA11B_RUNTIME_PUT";
          \t\tfor(size_t ax = 0; ax < 17; ++ax) std::cerr << ':' << address.get(ax);
          \t\tstd::cerr << ':' << written << std::endl;
          \t}'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          make -C third_party/funge-plus-plus funge
      - name: Verify full-space writes and decoded calendar output
        shell: bash
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/feedback"
          mkdir -p "$out"
          python3 qa/qa12_17d_calendar_feedback.py "$TEST_GROUP" "$out/feedback.json"
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$out/engine.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $out/engine.tar.gz" | sha256sum -c -
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -v "$GITHUB_WORKSPACE:/work:ro" -w /work -v "$out:/results" python:2.7-slim sh -ceu '
            cp /results/engine.tar.gz /tmp/PyFunge-0.5-rc2.tar.gz
            pip install --no-cache-dir --no-index --no-deps /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
            python qa/qa12_17d_calendar_reference.py /results/feedback.json
          '
          python3 qa/qa12_17d_calendar_feedback.py "$TEST_GROUP" "$out/feedback.json" --audit
      - name: Retain exact 17D coordinates and both native outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: befunge-17d-calendar-${{ matrix.group }}
          path: ${{ runner.temp }}/feedback/feedback.json
          if-no-files-found: warn
          retention-days: 60
