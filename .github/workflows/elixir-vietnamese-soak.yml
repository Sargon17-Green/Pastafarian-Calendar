name: Soak bản địa Elixir tiếng Việt

on:
  push:
    branches:
      - 'Elixir+tiếng-Việt'
    paths:
      - 'qa/elixir_vietnamese_soak.exs'
      - '.github/workflows/elixir-vietnamese-soak.yml'
  workflow_dispatch:

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lấy cây làm việc
        uses: actions/checkout@v4
      - name: Cài Erlang và Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - name: Chạy kiểm thử chịu tải, giữ nhật ký
        shell: bash
        run: |
          set -o pipefail
          mix test qa/elixir_vietnamese_soak.exs --timeout 240000 --max-cases 1 2>&1 | tee elixir_vietnamese_soak.log
      - name: Lưu nhật ký dù kiểm thử thất bại
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elixir-vietnamese-soak-log
          path: elixir_vietnamese_soak.log
          retention-days: 30
