name: Temporary — public Pages post-deploy browser smoke

on:
  push:
    branches:
      - 'JavaScript\+Interlingue'
    paths:
      - '.github/workflows/temp-public-pages-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-public-pages-browser-smoke
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'
  PUBLIC_BASE: 'https://sargon17-green.github.io/Pastafarian-Calendar/'

jobs:
  live-smoke:
    name: Chromium against deployed GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build expected browser identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-browser.js
          echo "EXPECTED_BUILD_ID=$(tr -d '\r\n' < browser/dist/build-id.txt)" >> "$GITHUB_ENV"

      - name: Require deployed build and reverse-engine assets
        shell: bash
        run: |
          set -euo pipefail
          live=""
          for i in $(seq 1 90); do
            live="$(curl -fsS -H 'Cache-Control: no-cache' "${PUBLIC_BASE}dist/build-id.txt?qa=${GITHUB_SHA}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$live" = "$EXPECTED_BUILD_ID" ]; then break; fi
            sleep 2
          done
          echo "EXPECTED_BUILD_ID=$EXPECTED_BUILD_ID"
          echo "LIVE_BUILD_ID=$live"
          test "$live" = "$EXPECTED_BUILD_ID"
          for asset in             pastafari-date.js             pastafari-worker.js             pastafari-date.mjs             reverse-engine/pastafari-diagnostics.js             reverse-engine/pastafari-calendar-fast.js             reverse-engine/pastafari-constraints.js             reverse-engine/pastafari-reverse-worker.js             reverse-engine/pastafari-constraints-client.js
          do
            echo "GET dist/$asset"
            curl -fsS -H 'Cache-Control: no-cache' -o /dev/null "${PUBLIC_BASE}dist/${asset}?qa=${GITHUB_SHA}"
          done

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          QA="$RUNNER_TEMP/public-pages-smoke"
          mkdir -p "$QA"
          cd "$QA"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Exercise the public site in Chromium
        shell: bash
        run: |
          set -euo pipefail
          QA="$RUNNER_TEMP/public-pages-smoke"
          cd "$QA"
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const BASE = process.env.PUBLIC_BASE;
          const EXPECTED = process.env.EXPECTED_BUILD_ID;
          const out = path.join(process.cwd(), 'out');
          fs.mkdirSync(out, { recursive: true });
          const assert = (v,m) => { if (!v) throw new Error(m); };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const ctx = await browser.newContext({ viewport:{width:1440,height:1000}, locale:'en-US' });
            const page = await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+String(e)));
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' :: '+(r.failure()?.errorText||'')));

            await page.goto(BASE+'?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(() => {
              const p=document.querySelector('pastafari-date')?.shadowRoot?.querySelector('pastafari-cooking');
              return !!p?.hasAttribute('live');
            },null,{timeout:60000});
            await page.waitForFunction(() => {
              const p=document.querySelector('pastafari-date')?.shadowRoot?.querySelector('pastafari-cooking');
              return (p?._liveObservedCount||0)>=128 && (p?.shadowRoot?.querySelectorAll('.live-row').length||0)>0;
            },null,{timeout:300000});

            const live=await page.evaluate(() => {
              const h=document.querySelector('pastafari-date'),r=h.shadowRoot,p=r.querySelector('pastafari-cooking'),s=p.shadowRoot,pane=s.querySelector('.pane');
              return {
                buildId:globalThis.PastafariBrowserConfig?.buildId||null,
                live:p.hasAttribute('live'), observed:p._liveObservedCount||0,
                rows:s.querySelectorAll('.live-row').length, groups:s.querySelectorAll('.live-group').length,
                monster:!!s.querySelector('.monster'), drips:s.querySelectorAll('.sauce-drip').length,
                docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                paneOverflow:(pane?.scrollWidth||0)-(pane?.clientWidth||0)
              };
            });
            assert(live.buildId===EXPECTED,'wrong public build ID');
            assert(live.live && live.observed>=128 && live.rows>0 && live.groups>0,'live cooking did not render');
            assert(live.monster && live.drips===2,'monster/drips missing');
            assert(live.docOverflow<=2 && live.paneOverflow<=2,'live page overflows horizontally');
            await page.screenshot({path:path.join(out,'public_live_cooking.png'),fullPage:false});

            await page.waitForFunction(() => {
              const h=document.querySelector('pastafari-date'),r=h?.shadowRoot,p=r?.querySelector('pastafari-cooking');
              const days=r?.querySelectorAll('.day').length||0;
              return !!p && !p.hasAttribute('live') && days>0 && days<=28;
            },null,{timeout:420000});

            const completed=await page.evaluate(() => {
              const h=document.querySelector('pastafari-date'),r=h.shadowRoot,p=r.querySelector('pastafari-cooking');
              return {trace:!!p.trace,entries:p._liveEntries?.length||0,days:r.querySelectorAll('.day').length,selected:!!r.querySelector('.day[aria-current="date"]')};
            });
            assert(completed.trace && completed.days>0 && completed.days<=28,'public calculation did not finish correctly');

            const before=completed.entries;
            await page.locator('pastafari-date').locator('.cooking-open').click();
            await page.waitForFunction(() => {
              const p=document.querySelector('pastafari-date')?.shadowRoot?.querySelector('pastafari-cooking');
              return !!p?.hasAttribute('open') && !!p?.shadowRoot?.querySelector('.shell')?.hasAttribute('open');
            },null,{timeout:30000});
            const retained=await page.evaluate(() => {
              const p=document.querySelector('pastafari-date').shadowRoot.querySelector('pastafari-cooking'),s=p.shadowRoot;
              return {entries:p._liveEntries?.length||0,groups:s.querySelectorAll('.live-group').length,sauces:s.querySelectorAll('.live-sauce').length,ranges:s.querySelectorAll('.live-gate-range').length,oldNav:s.querySelectorAll('.nav button').length};
            });
            assert(retained.entries===before && retained.groups>=3 && retained.sauces>=1 && retained.oldNav===0,'retained cooking log is wrong');
            const range=page.locator('pastafari-date').locator('pastafari-cooking').locator('.live-gate-range').first();
            await range.evaluate(n=>{const g=n.closest('.live-group');if(g)g.open=true;});
            await range.locator(':scope > summary').click();
            assert(await range.locator('.live-gate-step').count()===128,'public gate range does not expose 128 steps');
            await page.screenshot({path:path.join(out,'public_retained_gate_range.png'),fullPage:false});
            await page.keyboard.press('Escape');

            const reverse=await page.evaluate(async () => {
              const clientUrl=globalThis.PastafariBrowserConfig?.reverseClientUrl;
              if(!clientUrl) throw new Error('reverseClientUrl unavailable');
              const [client,fast]=await Promise.all([import(clientUrl),import(new URL('pastafari-calendar-fast.js',clientUrl).href)]);
              const calculationJdn=2461309n,targetJdn=calculationJdn+7n;
              const calendar=new fast.PastafariCalendar();
              const date=calendar.convertJdn(targetJdn,{calculationJdn}).toJSON();
              let progressEvents=0;
              const result=await client.solvePastafariConstraints({
                variables:{target:{}},
                constraints:[{type:'pastafari',target:'target',calculationJdn,date}]
              },{timeoutMs:180000,onProgress(){progressEvents+=1;}});
              return {clientUrl,complete:result.complete,progressEvents,targetJdn:String(targetJdn),solutionJdns:result.solutions.map(s=>String(s.target.jdn))};
            });
            assert(reverse.complete===true && reverse.solutionJdns.includes(reverse.targetJdn),'public reverse search failed round-trip');
            assert(reverse.progressEvents>0,'public reverse Worker emitted no progress');
            const serious=errors.filter(x=>x.startsWith('pageerror:')||x.includes('/reverse-engine/')||x.includes('pastafari-worker'));
            assert(serious.length===0,'public browser errors: '+serious.join(' | '));
            fs.writeFileSync(path.join(out,'public_smoke.json'),JSON.stringify({live,completed,retained,reverse,errors},null,2));
            await ctx.close(); await browser.close();
            console.log('PUBLIC_PAGES_BROWSER_SMOKE=PASS');
          })().catch(e=>{console.error(e?.stack||e);process.exit(1);});
          JS
          node qa.js

      - name: Upload public-site smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pages-browser-smoke
          path: ${{ runner.temp }}/public-pages-smoke/out
          if-no-files-found: warn
          retention-days: 14
