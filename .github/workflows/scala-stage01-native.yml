name: Scala Italian Stage 1 native

on:
  push:
    branches:
      - 'Scala+Italiano'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage01-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Compile and run Stage 1 tests
        run: sbt -batch 'Test / runMain pastafari.Stage01Tests'
