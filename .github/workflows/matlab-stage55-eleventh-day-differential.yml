name: MATLAB Stage55 Eleventh Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_eleventh_native.m'
      - 'tools/stage55_after11_interval_five_fields.py'
      - '.github/workflows/matlab-stage55-eleventh-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-eleventh-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  eleventh-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER10 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-tenth-day-differential
          run-id: 41206887108
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER9
        run: |
          echo 'cb56704b5ce1830ae785b1e9de75279aeeab53656a9f1fa7d8b2cee98ff4d3e4  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_10.json' | sha256sum -c -
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native eleventh-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_eleventh_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after11_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_10.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_11.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_ELEVENTH_PYTHON.log
          grep '^STAGE55_ELEVENTH_ROW ' logs/STAGE55_ELEVENTH_PYTHON.log > logs/STAGE55_ELEVENTH_PYTHON_ROW.txt
          grep '^STAGE55_ELEVENTH_ROW ' logs/STAGE55_ELEVENTH_NATIVE.log > logs/STAGE55_ELEVENTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_ELEVENTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_ELEVENTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_ELEVENTH_PYTHON_ROW.txt logs/STAGE55_ELEVENTH_NATIVE_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_11.json | tee logs/STAGE55_ELEVENTH_DIGEST.txt
          echo 'STAGE55_ELEVENTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-eleventh-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_10.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_11.json
            logs/STAGE55_ELEVENTH_NATIVE.log
            logs/STAGE55_ELEVENTH_PYTHON.log
            logs/STAGE55_ELEVENTH_PYTHON_ROW.txt
            logs/STAGE55_ELEVENTH_NATIVE_ROW.txt
            logs/STAGE55_ELEVENTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
