name: اختبار الطور الأول

on:
  push:
    branches:
      - C#+العربية-الفصحى
  workflow_dispatch:

jobs:
  stage_01:
    name: تحقق الطور الأول
    runs-on: ubuntu-latest
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v5
      - name: تثبيت .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: بناء واختبار المرجع والبنية
        run: dotnet run --project tests/PastafarianCalendar.Stage01Tests/PastafarianCalendar.Stage01Tests.csproj --configuration Release
