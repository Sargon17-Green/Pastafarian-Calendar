name: APL German native FX prefix ten (NOT Stage1)
on:
  push:
    branches:
      - qa/apl-german-nars-interface-20261116
    paths:
      - '.github/workflows/apl-german-stage01-fx-prefix10.yml'
      - 'qa/nars-interface/stage01_fx_prefix_probe.py'
      - 'qa/nars-interface/test_stage01_fx_prefix_probe.py'
      - 'qa/nars-interface/bounded_stage01_fx_prefix.ps1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-prefix-10:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: apl-german-sha-pinned-nars-installer-for-offline-analysis
          run-id: 44372361730
          github-token: ${{ github.token }}
          path: pinned_release
      - name: Provision pinned NARS and ephemeral font
        shell: pwsh
        run: ./qa/nars-interface/bootstrap_exact_nars.ps1 -Evidence font_bootstrap_evidence -Runtime verified_runtime
      - name: Verify prefix-5 compatibility and prefix-10 locked candidate
        shell: pwsh
        run: python -m unittest discover -s qa/nars-interface -p 'test_stage01_fx_prefix_probe.py' -v
      - name: Execute first ten native functions only
        shell: pwsh
        run: ./qa/nars-interface/bounded_stage01_fx_prefix.ps1 -Runtime verified_runtime -Evidence prefix10_fx_evidence -Count 10
      - name: Require exact native ten-function receipt
        shell: pwsh
        run: |
          $p='prefix10_fx_evidence/native_prefix_fx.json'
          if (-not (Test-Path -LiteralPath $p)) { throw 'PREFIX10_NATIVE_RECEIPT_MISSING' }
          $r=Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          if ($r.status -cne 'NATIVE_FX_PREFIX10_CONFIRMED_NOT_STAGE01' -or $r.fx_count -ne 10 -or -not $r.marker.exact) {
            throw 'PREFIX10_NATIVE_NOT_CONFIRMED'
          }
          Write-Output 'PREFIX10_NATIVE_CONFIRMED_NOT_STAGE01'
      - name: Collect evidence with hashes
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force prefix10_fx_evidence,font_bootstrap_evidence | Out-Null
          Get-ChildItem prefix10_fx_evidence,font_bootstrap_evidence -Recurse -File | Sort-Object FullName | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.FullName)"
          } | Set-Content -Encoding utf8 prefix10_fx_evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apl-german-prefix10-native-evidence-not-stage1
          path: |
            font_bootstrap_evidence/
            prefix10_fx_evidence/
            prefix10_fx_evidence.sha256
          retention-days: 14
