name: Soak v244 Celeritas combined candidate at prior timeout witnesses (not soak)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v244-celeritas-two-timeout-witnesses.yml
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind exact previous and combined candidate plus frozen receipts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f16616467743c2dbc946fd71a82aca867cc37fce"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v244-celeritas-two-timeout-witnesses.yml"
          mkdir -p evidence source/include/pastafari source/src
          test -n "$GH_TOKEN"
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15236391680/zip > evidence/v243.zip
          echo "7f2c5f235d44f5fc967216026005917dca7619acd8e95e43140ea50299175a0b  evidence/v243.zip" | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15231834031/zip > evidence/v236.zip
          echo "711a95ca9d0d2e24ae128556fc967ddcd653e2803c1395e259ec46b9ef12d841  evidence/v236.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib,zipfile,subprocess
          from pathlib import Path
          repo="Sargon17-Green/Pastafarian-Calendar"
          old="97f661ff17aa035fbd7721c690164f007a44dfc6"
          new="408d80e43159eba06849b6a929e0010f32b9b91b"
          for v,s in [(243,"SOAK_V243_CELERITAS_VERSIONED_INTERVAL/1"),(236,"SOAK_V236_CELERITAS_VERSIONED_CANDIDATE/1")]:
              with zipfile.ZipFile(f"evidence/v{v}.zip") as z:
                  assert z.testzip() is None
                  r=json.loads(z.read("result.json"))
              assert r["schema"]==s and r["whole_year_credit"]==0
              if v==243:
                  assert r["versioned_candidate_pass"] and r["candidate_commit"]==new
              else:
                  assert r["source_commit"]==old and len(r["cases"])==3 and all(x["matched"] for x in r["cases"])
                  expected={str(x["c"]):x for x in r["cases"] if x["c"] in (-377237,6875993)}
                  assert set(expected)=={"-377237","6875993"}
                  Path("evidence/frozen.json").write_text(json.dumps(expected,indent=2)+"\n")
          inv={}
          for ref,p,h,dst in [(old,"src/monster.cpp","10e075c67f619e6685fe8d4c00439916bd9e2372","source/src/base.cpp"),(new,"src/monster.cpp","faad56bd1a2f70b19d40e266b3b2e05754197a48","source/src/combined.cpp"),(new,"include/pastafari/monster.hpp","4c24d36e3704dd10ecf5420e7bc11a3da958d441","source/include/pastafari/monster.hpp"),(new,"include/pastafari/source_language_catalog.hpp","9f204d93166b2c33532bb236bc2bd929252f27be","source/include/pastafari/source_language_catalog.hpp")]:
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/{repo}/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\x00"+raw).hexdigest()==h
              Path(dst).write_bytes(raw)
              inv[dst]={"commit":ref,"path":p,"blob":h,"sha256":hashlib.sha256(raw).hexdigest()}
          Path("evidence/source-pins.json").write_text(json.dumps(inv,indent=2)+"\n")
          PY
      - name: Build exact uninstrumented source in both variants
        run: |
          set -euo pipefail
          (
            if ! printf '#include <boost/multiprecision/cpp_int.hpp>\nint main(){}\n' | g++ -std=c++17 -x c++ -fsyntax-only -; then
              timeout -k 5s 120s sudo apt-get update -qq
              timeout -k 5s 120s sudo apt-get install -y --no-install-recommends libboost-dev
            fi
            g++ --version
            dpkg-query -W libboost-dev
          ) > evidence/compiler.txt 2>&1
          cat > source/driver.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include "pastafari/source_language_catalog.hpp"
          #include <chrono>
          #include <iostream>
          #include <stdexcept>
          using namespace pastafari;
          using Clock=std::chrono::steady_clock;
          std::size_t ci(const std::string& name){for(const auto& x:CUTLET_SOURCE_CATALOG)if(x.text==name)return x.canonicalIndex;throw std::runtime_error("cutlet");}
          std::size_t mi(const std::string& name){for(const auto& x:MONTH_SOURCE_CATALOG)if(x.text==name)return x.canonicalIndex;throw std::runtime_error("month");}
          int main(int argc,char** argv){
            if(argc!=2)return 2;
            const Integer c{argv[1]};
            resetPersistentScarVaultsDiagnostic();
            setAccelerationScarsEnabled(true);
            setFullHistoricalAccelerationValidation(false);
            for(int i=0;i<2;++i){
              const Integer t=c+i;
              const auto before=persistentScarMetricsDiagnostic();
              const auto start=Clock::now();
              const auto a=calendarDateSpaghetti(c,t);
              const double seconds=std::chrono::duration<double>(Clock::now()-start).count();
              const auto after=persistentScarMetricsDiagnostic();
              std::cout<<"DATE\t"<<i<<"\t"<<c<<"\t"<<t<<"\t"<<seconds<<"\t"<<a.yearNumber<<"\t"<<ci(a.cutletName)<<"\t"<<a.dayInCutlet<<"\t"<<mi(a.monthName)<<"\t"<<a.dayInMonth<<"\t"<<a.cutletName<<"\t"<<a.monthName<<"\t"<<after.patch28GateCalculated-before.patch28GateCalculated<<"\t"<<after.patch28GateResurrection-before.patch28GateResurrection<<"\t"<<after.patch27AncestralHit-before.patch27AncestralHit<<std::endl;
            }
          }
          CPP
          for mode in base combined; do
            (ulimit -v 4194304; timeout -k 5s 120s g++ -std=c++17 -O2 -pthread -I source/include "source/src/$mode.cpp" source/driver.cpp -o "source/$mode") > "evidence/$mode.build.log" 2>&1 || { cat "evidence/$mode.build.log"; exit 1; }
          done
          sha256sum source/base source/combined source/driver.cpp > evidence/build.sha256
      - name: Four bounded processes, eight original public API calls
        run: |
          set -euo pipefail
          for c in -377237 6875993; do
            for mode in base combined; do
              tag="$mode.$c"
              set +e
              (ulimit -v 3145728; /usr/bin/time -v -o "evidence/$tag.time.txt" timeout -k 5s 240s "source/$mode" "$c") > "evidence/$tag.stdout" 2> "evidence/$tag.stderr"
              code=$?
              set -e
              echo "$code" > "evidence/$tag.exit"
              cat "evidence/$tag.stdout" "evidence/$tag.stderr"
            done
          done
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path("evidence")
          frozen=json.loads((p/"frozen.json").read_text())
          comparisons=[]
          for c in [-377237,6875993]:
              modes={}
              for mode in ["base","combined"]:
                  tag=f"{mode}.{c}"
                  rows=[]
                  for l in (p/f"{tag}.stdout").read_text().splitlines():
                      a=l.split("\t")
                      assert len(a)==15 and a[0]=="DATE"
                      rows.append({"i":int(a[1]),"c":int(a[2]),"t":int(a[3]),"seconds":float(a[4]),"fields":list(map(int,a[5:10])),"raw_names":a[10:12],"gate_calculated":int(a[12]),"gate_resurrections":int(a[13]),"structure_hits":int(a[14])})
                  m=re.search(r"Maximum resident set size \(kbytes\): (\d+)",(p/f"{tag}.time.txt").read_text())
                  modes[mode]={"exit":int((p/f"{tag}.exit").read_text()),"rows":rows,"peak_rss_kib":int(m.group(1)) if m else None,"stderr_empty":not (p/f"{tag}.stderr").read_text()}
              a,b=modes["base"],modes["combined"]
              ok=all(x["exit"]==0 and len(x["rows"])==2 and x["stderr_empty"] for x in modes.values())
              summary={}
              if ok:
                  ok=all(all(x[k]==y[k] for k in ["c","t","fields","raw_names"]) for x,y in zip(a["rows"],b["rows"]))
                  ok=ok and a["rows"][0]["fields"]==frozen[str(c)]["fields"] and a["rows"][0]["raw_names"]==frozen[str(c)]["raw_names"]
                  ok=ok and [(x["c"],x["t"]) for x in b["rows"]]==[(c,c),(c,c+1)]
                  same_year=b["rows"][1]["fields"][0]==b["rows"][0]["fields"][0]
                  shortcut=b["rows"][1]["gate_calculated"]==b["rows"][1]["gate_resurrections"]==0 and b["rows"][1]["structure_hits"]==1
                  ok=ok and (shortcut if same_year else not shortcut)
                  summary={"same_year":same_year,"shortcut_observed":shortcut,"adjacent_speedup":a["rows"][1]["seconds"]/b["rows"][1]["seconds"] if b["rows"][1]["seconds"]>0 else None}
              comparisons.append({"c":c,"modes":modes,"comparison_pass":ok,"summary":summary})
          ok=all(x["comparison_pass"] for x in comparisons)
          out={"schema":"SOAK_V244_CELERITAS_COMBINED_TIMEOUT_WITNESSES/1","base_commit":"97f661ff17aa035fbd7721c690164f007a44dfc6","candidate_commit":"408d80e43159eba06849b6a929e0010f32b9b91b","comparisons":comparisons,"comparison_pass":ok,"independent_previously_frozen_pairs":2 if ok else 0,"same_lineage_adjacent_pairs":2 if ok else 0,"independent_new_pairs":0,"whole_year_credit":0,"admitted_engines":0,"STOP_NEW_NATIVE_SOAK_DISPATCH":True}
          (p/"result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v244-combined-timeout-witnesses-${{ github.run_id }}
          path: evidence/
          retention-days: 90
