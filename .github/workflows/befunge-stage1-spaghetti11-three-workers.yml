name: Befunge QA11A 17D Three-Worker Shared-History Rendezvous
on:
  push:
    branches:
      - 'qa-befunge98-stage1-order-isolation-20261008'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa11-third-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cwesson/funge-plus-plus
          ref: cd6d7f005b4fc33b486fcc2380b35406f6125ca4
          path: third_party/funge-plus-plus
          submodules: recursive
          persist-credentials: false
      - name: Source and Funge++ native engine provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = "560d6aa5807a7f766213a33835cce85eab0fa40c"
          test "$(git hash-object qa/spaghetti10_17d_dual_worker_macro_candidate.beq)" = "010efd012ae52a60740aa97750b5a02519912e92"
          test "$(git hash-object qa/spaghetti11_17d_three_worker_cascade.beq)" = "990d8fb2b84c7ee728634bb93a8e7baaef992c40"
          test "$(git -C third_party/funge-plus-plus rev-parse HEAD)" = "cd6d7f005b4fc33b486fcc2380b35406f6125ca4"
      - name: Build pinned Funge++ engine with temporary Native scheduler fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("third_party/funge-plus-plus/src/FungeUniverse.cpp")
          s=p.read_text();tab=chr(9)
          old="\n".join([tab*4+"threads.pop();",tab*4+"delete thread;",
                          tab*3+"}",tab*3+"mutex.unlock();",tab*2+"}else{"])
          new=old.replace(tab*3+"mutex.unlock();",
               tab*3+"cv.notify_all(); // qa11 disposable native scheduler notification\n"+tab*3+"mutex.unlock();")
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          make -C third_party/funge-plus-plus funge
      - name: Prove three real IPs and post-worker shared-history dependence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qa/stage1_spaghetti11_three_worker_native.py
          python3 qa/stage1_spaghetti11_three_worker_native.py
      - name: Save QA11A native evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spaghetti11-17d-three-worker-native-evidence
          path: spaghetti11_17d_triplet_native_receipt.json
          if-no-files-found: warn
