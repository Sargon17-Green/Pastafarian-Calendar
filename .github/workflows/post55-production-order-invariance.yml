name: Kotlin production findTargetYear three-order invariant differential
on:
  push:
    branches: ['Kotlin\+Cymraeg']
    paths:
      - 'soak/Post55ProductionOrderInvariantProbe.kt'
      - 'soak/audit_production_order_invariance.py'
      - 'soak/test_audit_production_order_invariance.py'
      - '.github/workflows/post55-production-order-invariance.yml'
      - 'soak/audit_production_adjacent_year_navigation.py'
      - 'soak/independent_year_geometry_oracle.py'
      - 'soak/independent_sauce_oracle.py'
      - 'soak/independent_date_combinatorics.py'
      - 'src/main/kotlin/pastafari/ProductionYearNavigator.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-order-invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify branch, pinned SHA and production budget
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Kotlin+Cymraeg'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'maxGateAbsIndex: Int = 8192' src/main/kotlin/pastafari/ProductionYearNavigator.kt
          grep -Fq 'private const val GATE_LIMIT = 8192' soak/Post55ProductionOrderInvariantProbe.kt
          grep -Fq 'maxYearTransitions = 8' soak/Post55ProductionOrderInvariantProbe.kt
          echo 'ORDER_SOURCE_AND_BUDGET_PIN_GREEN'
      - name: Run twenty synthetic mutation and protocol tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m py_compile soak/audit_production_order_invariance.py soak/test_audit_production_order_invariance.py
          python3 -m unittest discover -s soak -p 'test_audit_production_order_invariance.py' -v 2>&1 | tee evidence/order-invariance-tests.log
      - name: Install pinned Kotlin 1.9.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip' \
            -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile actual production and three-order probe
        shell: bash
        run: |
          set -euo pipefail
          kotlinc src/main/kotlin/pastafari/*.kt soak/Post55ProductionOrderInvariantProbe.kt \
            -include-runtime -d "$RUNNER_TEMP/order-invariant-probe.jar"
          test -s "$RUNNER_TEMP/order-invariant-probe.jar"
          echo 'ORDER_REAL_KOTLIN_PRODUCTION_COMPILED_GREEN'
      - name: Compare 45 real queries against unseeded Python oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 soak/audit_production_order_invariance.py \
            --jar "$RUNNER_TEMP/order-invariant-probe.jar" \
            --timeout-seconds 900 \
            --evidence evidence/order-invariance.json \
            2>&1 | tee evidence/order-invariance.log
      - name: Preserve bounded order evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-cymraeg-production-order-invariance
          path: evidence/order-invariance*
          if-no-files-found: warn
          retention-days: 30
