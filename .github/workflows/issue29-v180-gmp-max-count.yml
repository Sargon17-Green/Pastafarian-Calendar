name: Issue29 v180 max-legal-domain GMP Count only (47 months 5778 days; NO F)
on:
  push:
    branches:
      - qa/issue29-ada-gmp-max-count-v180
    paths:
      - '.github/workflows/issue29-v180-gmp-max-count.yml'
permissions:
  contents: read
concurrency:
  group: issue29-v180-max-count-one-shot
  cancel-in-progress: false
jobs:
  max-domain-count-only:
    if: >-
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/qa/issue29-ada-gmp-max-count-v180'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source-locked GMP-only QA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove source pins and generate Python exact integer reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B -m py_compile tests/issue29_v180_gmp_max_count.py
          python3 -B tests/issue29_v180_gmp_max_count.py preflight | tee evidence/preflight-verdict.txt
          grep -Fx V180_MAXIMUM_GMP_REFERENCE_READY_ZERO_F evidence/preflight-verdict.txt
          test ! -e evidence/RUN_STARTED_ONCE
      - name: Install GNAT13 and GMP native library
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > evidence/apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gnat-13 gprbuild libgnatcoll-gmp-dev binutils > evidence/apt-install.log 2>&1
          gprbuild --version > evidence/gprbuild-version.txt
          dpkg-query -W gnat-13 libgnatcoll-gmp-dev libgmp10 > evidence/packages.txt
      - name: Compile and link isolated GMP Count fixture only
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 180s gprbuild -p -j2 -P issue29_v180_gmp_max_count.gpr > evidence/build.stdout 2> evidence/build.stderr
          test -x bin_v180/issue29_v180_gmp_max_count_tests
          if nm bin_v180/issue29_v180_gmp_max_count_tests | grep -iq normative_oracle; then
            echo V180_FORBIDDEN_CALENDAR_SOURCE_LINKED >&2
            exit 1
          fi
          echo V180_ISOLATED_GMP_COUNT_ONLY_LINKED_ZERO_F > evidence/build-verdict.txt
      - name: Execute GMP Count maximum envelope exactly once, never F
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v180_gmp_max_count.py run-once | tee evidence/native-verdict.txt
          grep -Fx V180_GMP_MAXIMUM_5778_DAY_COUNT_PASS_ZERO_F evidence/native-verdict.txt
      - name: Preserve hashed evidence even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('evidence')
          m={x.name:{'bytes':x.stat().st_size,'sha256':hashlib.sha256(x.read_bytes()).hexdigest()}
             for x in sorted(p.iterdir()) if x.is_file() and x.name!='members.sha256.json'}
          (p/'members.sha256.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload reproducible max-domain GMP QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v180-max-5778-day-47-month-gmp-count-no-F
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
