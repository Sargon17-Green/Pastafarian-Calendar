name: MATLAB Stage55 Forty-Eighth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_forty_eighth_native.m'
      - 'tools/stage55_after48_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-forty-eighth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-forty-eighth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  forty-eighth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER47 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-forty-seventh-day-differential
          run-id: 44733585301
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER47
        run: |
          echo 'c6288a6d47c08659ce51ee662edca3b880e9116e3732c5ecb196fddae0d4e5b4  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_47.json' | sha256sum -c -
      - name: Preflight AFTER48 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after48_interval_five_fields.py
          grep -Fqx 'PIN = "c6288a6d47c08659ce51ee662edca3b880e9116e3732c5ecb196fddae0d4e5b4"' tools/stage55_after48_interval_five_fields.py
          python3 -m py_compile tools/stage55_after48_interval_five_fields.py
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_47.json' tools/run_stage55_year5000_forty_eighth_native.m
          grep -Fq 'STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_48.json' tools/run_stage55_year5000_forty_eighth_native.m
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native forty-eighth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_forty_eighth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after48_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_47.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_48.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_FORTY_EIGHTH_PYTHON.log
          grep '^STAGE55_FORTY_EIGHTH_ROW ' logs/STAGE55_FORTY_EIGHTH_PYTHON.log > logs/STAGE55_FORTY_EIGHTH_PYTHON_ROW.txt
          grep '^STAGE55_FORTY_EIGHTH_ROW ' logs/STAGE55_FORTY_EIGHTH_NATIVE.log > logs/STAGE55_FORTY_EIGHTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_FORTY_EIGHTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_FORTY_EIGHTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_FORTY_EIGHTH_PYTHON_ROW.txt logs/STAGE55_FORTY_EIGHTH_NATIVE_ROW.txt
          expected="STAGE55_FORTY_EIGHTH_ROW POSITION=48 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=48 MONTH_INDEX=37 MONTH_DAY=3"
          grep -Fqx "$expected" logs/STAGE55_FORTY_EIGHTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_FORTY_EIGHTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_48.json | tee logs/STAGE55_FORTY_EIGHTH_DIGEST.txt
          echo 'STAGE55_FORTY_EIGHTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-forty-eighth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_47.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_48.json
            logs/STAGE55_FORTY_EIGHTH_NATIVE.log
            logs/STAGE55_FORTY_EIGHTH_PYTHON.log
            logs/STAGE55_FORTY_EIGHTH_PYTHON_ROW.txt
            logs/STAGE55_FORTY_EIGHTH_NATIVE_ROW.txt
            logs/STAGE55_FORTY_EIGHTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
