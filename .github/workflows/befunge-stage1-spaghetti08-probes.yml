name: Befunge QA08 Native Concurrency Forensics
on:
  push:
    branches:
      - 'qa-befunge98-stage1-order-isolation-20261008'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cwesson/funge-plus-plus
          ref: cd6d7f005b4fc33b486fcc2380b35406f6125ca4
          path: third_party/funge-plus-plus
          submodules: recursive
          persist-credentials: false
      - name: Build pinned native engine and validate source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object qa/spaghetti08_17d_concurrent_stack_residue.beq)" = "0b49d3b4175055d365a089267cfc2450ea6d83aa"
          python3 - <<'PY'
          from pathlib import Path
          path=Path("third_party/funge-plus-plus/src/Unefunge93Strategy.cpp")
          s=path.read_text()
          a="stack.top().push(static_cast<stack_t>(field.get(v+storage)));"
          b="""auto actual = field.get(v+storage);
        if (v[0]>=10000 && v[0]<=10001) { std::cerr << "FUNGEPLUS_NATIVE_G xy=" << v << " storage=" << storage << " value=" << actual << std::endl; }
        stack.top().push(static_cast<stack_t>(actual));"""
          c="field.put(v+storage, stack.top().pop());"
          d="""auto actual=stack.top().pop();
        if (v[0]>=10000 && v[0]<=10001) { std::cerr << "FUNGEPLUS_NATIVE_P xy=" << v << " storage=" << storage << " value=" << actual << std::endl; }
        field.put(v+storage, actual);"""
          assert s.count(a)==1 and s.count(c)==1
          path.write_text(s.replace(a,b).replace(c,d))
          PY
          make -C third_party/funge-plus-plus funge
      - name: Diagnose native worker, genuine split, and poll independently
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/stage1_spaghetti08_native_probes.py
