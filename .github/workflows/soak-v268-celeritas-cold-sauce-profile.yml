name: Soak v268 cold sauce phase profile exact v267 candidate (not soak)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v268-celeritas-cold-sauce-profile.yml
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Lock archive and candidate source identities
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/qa/issue29-gmp-complete-small-family-v198"
          test "$(git rev-parse HEAD^)" = "b17d2557b0b90a04b98a0e1dee9e2ff407a769d4"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v268-celeritas-cold-sauce-profile.yml"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
      - name: Pin frozen inputs and exact candidate source
        run: |
          set -euo pipefail
          mkdir -p evidence source/src source/include/pastafari
          cp qa/soak/archive/v227-v258/v253.zip v253.zip
          echo "9cab9e052261b2f5e6f2a122151de8c7e9d5124cd48bf73a8651ebb6b690e47c  v253.zip" | sha256sum -c -
          cp qa/soak/archive/v227-v258/v258.zip v258.zip
          echo "13db2c122e5e483a10f9ee0f206c84f4e1497faccb61af273cfb079101110f1b  v258.zip" | sha256sum -c -
          test "$(git ls-remote origin refs/heads/qa/celeritas-short-rejection-v235-20261127 | cut -f1)" = "3a486ca105eb5a0736f7b799f290b637594d7501"
          timeout -k 5s 60s gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15279211799/zip > v267.zip
          echo "ffda5de994b2d53b2ceb05bbdc127bd16325eb1eab65cf84d22006c13fe78151  v267.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,zipfile,subprocess
          from pathlib import Path
          def member(zp,n):
              with zipfile.ZipFile(zp) as z:
                  assert z.testzip() is None
                  return z.read(n)
          inventories={}
          for zp in ("v253.zip","v258.zip"):
              with zipfile.ZipFile(zp) as z:
                  assert z.testzip() is None
                  inventories[zp]=[{"name":n,"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]
          Path("evidence/input-inventory.json").write_text(json.dumps(inventories,indent=2)+"\n")
          frozen=json.loads(member("v253.zip","frozen.json"))
          assert frozen==json.loads(member("v258.zip","frozen.json"))
          cases="".join(f"{x['label']}\t{x['c']}\t{x['t']}\n" for x in frozen).encode("ascii")
          Path("evidence/cases.tsv").write_bytes(cases)
          prior=json.loads(member("v267.zip","result.json"))
          candidate="3a486ca105eb5a0736f7b799f290b637594d7501"
          assert prior["schema"]=="SOAK_V267_VERSIONED_INCREMENTAL_NATIVE/1" and prior["versioned_candidate_pass"]
          assert prior["candidate_commit"]==candidate and prior["candidate_blob"]=="c64bc5a0bab8d5227332e11aae548f80478657b8"
          assert len(frozen)==len(prior["rows"])==14 and len(cases.decode().splitlines())==14
          assert all(all(x[k]==y[k] for k in ("label","c","t","fields","raw_names")) for x,y in zip(frozen,prior["rows"]))
          pins={"src/monster.cpp":(candidate,"c64bc5a0bab8d5227332e11aae548f80478657b8"),"include/pastafari/monster.hpp":(candidate,"4c24d36e3704dd10ecf5420e7bc11a3da958d441"),"include/pastafari/source_language_catalog.hpp":(candidate,"9f204d93166b2c33532bb236bc2bd929252f27be")}
          for p,(ref,expected) in pins.items():
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/Sargon17-Green/Pastafarian-Calendar/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\x00"+raw).hexdigest()==expected
              Path("source",p).write_bytes(raw)
          Path("source/cases.tsv").write_bytes(cases)
          Path("evidence/frozen.json").write_text(json.dumps(frozen,indent=2)+"\n")
          Path("evidence/v267-reference.json").write_text(json.dumps(prior,indent=2)+"\n")
          original=Path("source/src/monster.cpp").read_text()
          assert hashlib.sha256(original.encode()).hexdigest()=="caed4039118e349ce7219367a8768d6cf07a2035a1bbf0dc43caf35191eb4041"
          import difflib
          s=original
          def once(src,a,b):
              assert src.count(a)==1,a
              return src.replace(a,b)
          s=once(s,"#include <tuple>\n","#include <tuple>\n#include <chrono>\n#include <iostream>\n#include <array>\n")
          helper="""
          namespace {
          using QaClock=std::chrono::steady_clock;
          std::array<unsigned long long,2> qaSauceCalls{};
          std::array<std::array<double,4>,2> qaSauceTimes{};
          void qaSauceMark(int mode,int phase,QaClock::time_point& t) {
              auto now=QaClock::now();
              qaSauceTimes[mode][phase]+=std::chrono::duration<double>(now-t).count();
              t=now;
          }
          }
          void qaColdSauceReport(const std::string& label) {
              for(int mode=0;mode<2;++mode) {
                  std::cout<<"SAUCE\\t"<<label<<"\\t"<<mode+55<<"\\t"<<qaSauceCalls[mode];
                  for(double v:qaSauceTimes[mode]) std::cout<<"\\t"<<v;
                  std::cout<<std::endl;
              }
              qaSauceCalls={};
              qaSauceTimes={};
          }
          """
          s=once(s,"namespace pastafari {\n","namespace pastafari {\n"+helper)
          # Instrument only two exact unburied implementations, preserving all original operations.
          start=s.index("Patch11LatchedOrderSauceResult sauceWithOrderAt46Latch(")
          end=s.index("} // namespace patch32_legacy_body",start)
          body=s[start:end]
          body=once(body,"    LegacySauceCounts counts{};","    ++qaSauceCalls[0];\n    auto qaT=QaClock::now();\n    LegacySauceCounts counts{};")
          body=once(body,"    BowlState bowls = initialBowlsThroughCounts(counts);","    qaSauceMark(0,0,qaT);\n    BowlState bowls = initialBowlsThroughCounts(counts);")
          body=once(body,"    for (int stir = 1; stir <= 12; ++stir) {","    qaSauceMark(0,2,qaT);\n    for (int stir = 1; stir <= 12; ++stir) {")
          body=once(body,"    return Patch11LatchedOrderSauceResult{","    qaSauceMark(0,3,qaT);\n    return Patch11LatchedOrderSauceResult{")
          s=s[:start]+body+s[end:]
          start=s.index("Stage56RawBowlSumSauceResult sauceWithStage56RawBowlSumDetourUnburied(")
          end=s.index("\nbool sameStage56Sauce(",start)
          body=s[start:end]
          body=once(body,"    const LegacySauceCounts counts =","    ++qaSauceCalls[1];\n    auto qaT=QaClock::now();\n    const LegacySauceCounts counts =")
          body=once(body,"    const VisibleDropStore visible =","    qaSauceMark(1,0,qaT);\n    const VisibleDropStore visible =")
          body=once(body,"    BowlState bowls = initialBowlsThroughCounts(counts);","    qaSauceMark(1,1,qaT);\n    BowlState bowls = initialBowlsThroughCounts(counts);")
          body=once(body,"    Stage56RawBowlSumSauceResult out;","    qaSauceMark(1,2,qaT);\n    Stage56RawBowlSumSauceResult out;")
          body=once(body,"    out.semanticSauce =","    qaSauceMark(1,3,qaT);\n    out.semanticSauce =")
          s=s[:start]+body+s[end:]
          Path("source/src/profiled.cpp").write_text(s)
          Path("evidence/profile.diff").write_text("".join(difflib.unified_diff(original.splitlines(True),s.splitlines(True),fromfile="original",tofile="profiled")))
          Path("evidence/source.json").write_text(json.dumps({"candidate":candidate,"base_sha256":hashlib.sha256(original.encode()).hexdigest(),"instrumented_sha256":hashlib.sha256(s.encode()).hexdigest(),"instrumented_copy_only":True,"stage55_prep_includes_visible":True},indent=2)+"\n")
          PY
      - name: Compile bounded diagnostic public API
        run: |
          set -euo pipefail
          (
            if ! printf '#include <boost/multiprecision/cpp_int.hpp>\nint main(){}\n' | g++ -std=c++17 -x c++ -fsyntax-only -; then
              timeout -k 5s 120s sudo apt-get update -qq
              timeout -k 5s 120s sudo apt-get install -y --no-install-recommends libboost-dev
            fi
            g++ --version
          ) > evidence/compiler.txt 2>&1
          cat > source/probe.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include "pastafari/source_language_catalog.hpp"
          #include <chrono>
          #include <iostream>
          #include <stdexcept>
          #include <string>
          namespace pastafari { void qaColdSauceReport(const std::string&); }
          using namespace pastafari;
          std::size_t ci(const std::string& n){for(const auto& x:CUTLET_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("cutlet");}
          std::size_t mi(const std::string& n){for(const auto& x:MONTH_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("month");}
          int main(){
              resetPersistentScarVaultsDiagnostic();
              setAccelerationScarsEnabled(true);
              setFullHistoricalAccelerationValidation(false);
              std::string label,cs,ts;
              int count=0;
              while(std::cin>>label>>cs>>ts){
                  const Integer c{cs},t{ts};
                  const auto before=persistentScarMetricsDiagnostic();
                  const auto start=std::chrono::steady_clock::now();
                  const auto a=calendarDateSpaghetti(c,t);
                  const auto after=persistentScarMetricsDiagnostic();
                  const double seconds=std::chrono::duration<double>(std::chrono::steady_clock::now()-start).count();
                  std::cout<<"DATE\t"<<label<<"\t"<<c<<"\t"<<t<<"\t"<<seconds<<"\t"<<a.yearNumber<<"\t"<<ci(a.cutletName)<<"\t"<<a.dayInCutlet<<"\t"<<mi(a.monthName)<<"\t"<<a.dayInMonth<<"\t"<<a.cutletName<<"\t"<<a.monthName<<"\t"<<after.patch28GateCalculated-before.patch28GateCalculated<<"\t"<<after.patch28GateResurrection-before.patch28GateResurrection<<"\t"<<after.patch27AncestralHit-before.patch27AncestralHit<<"\t"<<after.patch39FinalResultHit-before.patch39FinalResultHit<<std::endl;
                  qaColdSauceReport(label);
                  ++count;
              }
              if(!std::cin.eof()||count!=14)return 2;
              std::cout<<"PERSISTENT_DONE\t"<<count<<std::endl;
          }
          CPP
          (ulimit -v 4194304; timeout -k 5s 120s g++ -std=c++17 -O2 -pthread -I source/include source/src/profiled.cpp source/probe.cpp -o source/probe) > evidence/build.log 2>&1 || { cat evidence/build.log; exit 1; }
          sha256sum source/probe source/probe.cpp source/src/profiled.cpp source/cases.tsv > evidence/build.sha256
      - name: Profile frozen cold and warm API calls with exact output check
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 3145728; /usr/bin/time -v -o evidence/time.txt timeout -k 5s 240s source/probe < source/cases.tsv) > evidence/stdout.txt 2> evidence/stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/exit.txt
          cat evidence/stdout.txt evidence/stderr.txt
          python3 - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("evidence");prior=json.loads((p/"v267-reference.json").read_text());frozen=json.loads((p/"frozen.json").read_text())
          lines=(p/"stdout.txt").read_text().splitlines()
          rows=[];profiles={}
          for l in lines:
              a=l.split("\t")
              if a[0]=="DATE":
                  assert len(a)==16
                  rows.append({"label":a[1],"c":int(a[2]),"t":int(a[3]),"seconds":float(a[4]),"fields":list(map(int,a[5:10])),"raw_names":a[10:12],"gate_calculated":int(a[12]),"gate_resurrections":int(a[13]),"structure_hits":int(a[14]),"result_hits":int(a[15])})
              elif a[0]=="SAUCE":
                  assert len(a)==8 and a[2] in ("55","56")
                  assert a[2] not in profiles.setdefault(a[1],{})
                  calls=int(a[3]);times=list(map(float,a[4:]))
                  assert calls>=0 and all(math.isfinite(v) and v>=0 for v in times)
                  profiles[a[1]][a[2]]={"calls":calls,"prep":times[0],"visible_build":times[1],"visible_pours_stirs":times[2],"post_stirs":times[3],"total_measured_seconds":sum(times)}
              else:assert l=="PERSISTENT_DONE\t14"
          exact=int((p/"exit.txt").read_text())==0 and not (p/"stderr.txt").read_text() and len(rows)==len(frozen)==len(profiles)==14 and lines[-1]=="PERSISTENT_DONE\t14"
          exact=exact and all(all(x[k]==y[k] for k in ("label","c","t","fields","raw_names")) for x,y in zip(rows,frozen))
          exact=exact and all(all(x[k]==y[k] for k in ("gate_calculated","gate_resurrections","structure_hits","result_hits")) for x,y in zip(rows,prior["rows"]))
          for r in rows:
              d=profiles[r["label"]];assert set(d)=={"55","56"}
              assert d["55"]["visible_build"]==0
              assert sum(v["total_measured_seconds"] for v in d.values())<=r["seconds"]+0.001
              if r["result_hits"]:assert all(v["calls"]==0 for v in d.values())
          assert profiles["initial"]["56"]["calls"]>0 and profiles["remote_date"]["56"]["calls"]>0
          out={"schema":"SOAK_V268_COLD_SAUCE_PROFILE/1","candidate_commit":prior["candidate_commit"],"exact_frozen_outputs":bool(exact),"rows":rows,"profiles":profiles,"stage55_prep_includes_visible_build":True,"instrumented_copy_only":True,"independent_new_pairs":0,"whole_year_credit":0,"admitted_engines":0,"STOP_NEW_NATIVE_SOAK_DISPATCH":True}
          (p/"result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          assert exact
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v268-cold-sauce-profile-${{ github.run_id }}
          path: evidence/
          retention-days: 90
