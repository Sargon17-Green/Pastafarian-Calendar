name: COBOL Chinese INT-02 isolated name-family Native
on:
  push:
    branches:
      - 'COBOL+简体中文'
    paths:
      - '.github/workflows/cobol-chinese-int02-bounded.yml'
permissions:
  contents: read
jobs:
  name-family-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact parent and source blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence build-int02
          {
            printf 'PROJECT_ID=PC-BRANCH-COBOL-SIMPLIFIED-CHINESE\n'
            printf 'HEAD=%s\n' "$GITHUB_SHA"
            printf 'EXPECTED_SOURCE_HEAD=60dc2d1d76004446af4e58186026f9868fa3bbf2\n'
            test "$GITHUB_REF" = 'refs/heads/COBOL+简体中文'
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD^)" = '60dc2d1d76004446af4e58186026f9868fa3bbf2'
            changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
            test "$changed" = '.github/workflows/cobol-chinese-int02-bounded.yml'
            while read -r expected path; do
              actual="$(git rev-parse "HEAD:$path")"
              printf '%s %s\n' "$actual" "$path"
              test "$actual" = "$expected"
            done <<'LOCK'
          982c1f266a18c2bcaba79b994177a93750f27bfa src/big_integer.cob
          47c3bcd0138eea16e7b58b4f7c662db389b07a57 src/calendar_name_family.cob
          92b00a253b7fd142cc40d39ed70d76e254b1ebe8 test/int02_name_driver.cob
          aea5eb732661d159c892efb190009c4baf88d12e test/int02_name_diff.mjs
          LOCK
            printf 'SOURCE_LOCK=PASS\n'
          } 2>&1 | tee evidence/source-lock.log
      - name: Check and preflight the independent oracle
        shell: bash
        run: |
          set -euo pipefail
          node --check test/int02_name_diff.mjs 2>&1 | tee evidence/oracle-syntax.log
          timeout -k 5s 30s node test/int02_name_diff.mjs --oracle-only 2>&1 | tee evidence/oracle-preflight.log
          grep -Fq '"families":15' evidence/oracle-preflight.log
          grep -Fq '"smallRows":409' evidence/oracle-preflight.log
          grep -Fq '"large":15' evidence/oracle-preflight.log
          grep -Fq '"requests":915' evidence/oracle-preflight.log
          grep -Fq '"verdict":"ORACLE_ONLY_NOT_NATIVE"' evidence/oracle-preflight.log
          printf 'ORACLE_PREFLIGHT=PASS_NOT_NATIVE\n' | tee -a evidence/oracle-preflight.log
      - name: Install GnuCOBOL from Ubuntu sources
        shell: bash
        run: |
          set -euo pipefail
          {
            test -f /etc/apt/sources.list.d/ubuntu.sources
            opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            timeout -k 10s 150s sudo apt-get "${opts[@]}" update
            timeout -k 10s 150s sudo apt-get "${opts[@]}" install -y --no-install-recommends gnucobol3
            cobc -V
            node --version
          } 2>&1 | tee evidence/toolchain.log
      - name: Strict compile and run the 915-request Native differential gate
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'NATIVE_HEAD=%s\n' "$GITHUB_SHA"
            timeout -k 5s 180s cobc -x -free -Wall -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
              -o build-int02/name-family-driver \
              test/int02_name_driver.cob src/calendar_name_family.cob src/big_integer.cob
            printf 'STRICT_COMPILE=PASS\n'
            timeout -k 5s 150s node test/int02_name_diff.mjs "$(pwd)/build-int02/name-family-driver"
            printf 'NATIVE_GATE=PASS\nRESULT=PASS_INT02_NAME_FAMILY_NATIVE\n'
          } 2>&1 | tee evidence/name-family-native.log
          grep -Fq '"families":15' evidence/name-family-native.log
          grep -Fq '"smallRows":409' evidence/name-family-native.log
          grep -Fq '"large":15' evidence/name-family-native.log
          grep -Fq '"requests":915' evidence/name-family-native.log
          grep -Fq '"heapNonzero":0' evidence/name-family-native.log
          grep -Fq '"unexpected":0' evidence/name-family-native.log
          grep -Fq '"verdict":"INT02_NAME_NATIVE_PASS"' evidence/name-family-native.log
          grep -Fxq 'RESULT=PASS_INT02_NAME_FAMILY_NATIVE' evidence/name-family-native.log
      - name: Hash evidence logs
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          (cd evidence && find . -maxdepth 1 -type f -name '*.log' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int02-name-family-native-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
