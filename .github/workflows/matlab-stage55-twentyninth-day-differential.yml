name: MATLAB Stage55 Twenty-Ninth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_twentyninth_native.m'
      - 'tools/stage55_after29_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-twentyninth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-twentyninth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  twentyninth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER28 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-twentyeighth-day-differential
          run-id: 41775946572
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER28
        run: |
          echo '952bae5c8cdacaef389c31ed699cd4cb85d0931fb2bfa5bc57e335e21ac16bfe  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_28.json' | sha256sum -c -
      - name: Preflight AFTER29 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after29_interval_five_fields.py
          grep -Fqx 'PIN = "952bae5c8cdacaef389c31ed699cd4cb85d0931fb2bfa5bc57e335e21ac16bfe"' tools/stage55_after29_interval_five_fields.py
          python3 -m py_compile tools/stage55_after29_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native twenty-ninth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_twentyninth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after29_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_28.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_29.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_TWENTYNINTH_PYTHON.log
          grep '^STAGE55_TWENTYNINTH_ROW ' logs/STAGE55_TWENTYNINTH_PYTHON.log > logs/STAGE55_TWENTYNINTH_PYTHON_ROW.txt
          grep '^STAGE55_TWENTYNINTH_ROW ' logs/STAGE55_TWENTYNINTH_NATIVE.log > logs/STAGE55_TWENTYNINTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_TWENTYNINTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_TWENTYNINTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_TWENTYNINTH_PYTHON_ROW.txt logs/STAGE55_TWENTYNINTH_NATIVE_ROW.txt
          expected="STAGE55_TWENTYNINTH_ROW POSITION=29 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=29 MONTH_INDEX=12 MONTH_DAY=1"
          grep -Fqx "$expected" logs/STAGE55_TWENTYNINTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_TWENTYNINTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_29.json | tee logs/STAGE55_TWENTYNINTH_DIGEST.txt
          echo 'STAGE55_TWENTYNINTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-twentyninth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_28.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_29.json
            logs/STAGE55_TWENTYNINTH_NATIVE.log
            logs/STAGE55_TWENTYNINTH_PYTHON.log
            logs/STAGE55_TWENTYNINTH_PYTHON_ROW.txt
            logs/STAGE55_TWENTYNINTH_NATIVE_ROW.txt
            logs/STAGE55_TWENTYNINTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
