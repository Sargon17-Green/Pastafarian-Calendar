name: Issue29 v174 production GMP weave vs exhaustive normative oracle (ZERO Calendar_Date)
on:
  push:
    branches:
      - qa/issue29-ada-gmp-weave-component-v174
    paths:
      - '.github/workflows/issue29-v174-gmp-weave-component.yml'
permissions:
  contents: read
concurrency:
  group: issue29-v174-exhaustive-gmp-weave-one-shot
  cancel-in-progress: false
jobs:
  bounded-production-gmp-weave-exhaustive-oracle:
    if: ${{ github.run_attempt == 1 && github.ref == 'refs/heads/qa/issue29-ada-gmp-weave-component-v174' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source-locked production GMP component descendants
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify runner Python syntax before any native execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/issue29_v174_gmp_weave_runner.py
          echo "V174_RUNNER_SYNTAX_PASS_NO_EXECUTION"
      - name: Install GNAT 13, GPRBuild, GNATCOLL GMP and GNU time
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gnat-13 gprbuild libgnatcoll-gmp-dev binutils time > apt-install.log 2>&1
          gnat --version > gnat-version.txt
          gprbuild --version > gprbuild-version.txt
          dpkg-query -W libgnatcoll-gmp-dev libgmp10 time > gmp-and-time-packages.txt
          test -x /usr/bin/time
      - name: Lock production sources and independently enumerate every legal small weave
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v174_gmp_weave_runner.py preflight | tee v174-preflight.stdout
          grep -Fx V174_SOURCE_LOCK_AND_EXHAUSTIVE_NORMATIVE_ORACLE_PASS v174-preflight.stdout
          test -f evidence/preflight.json
          test -f evidence/v174-reference.dat
          test ! -e evidence/RUN_STARTED_GMP_WEAVE
      - name: Compile and link direct production GMP test; execute none yet
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v174_gmp_weave_runner.py build | tee v174-build.stdout
          grep -Fx V174_PRODUCTION_GMP_WEAVE_BUILD_LINK_PASS_NO_EXECUTION v174-build.stdout
          test -f evidence/build-manifest.json
      - name: Execute one bounded GMP test against all exhaustive reference ranks
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/issue29_v174_gmp_weave_runner.py run-once | tee v174-run.stdout
          grep -Fx V174_PRODUCTION_GMP_WEAVE_56221_ASSERTIONS_PASS_ZERO_F_ZERO_SOAK v174-run.stdout
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/result.json").read_bytes())
          assert d["status"]=="PASS_PRODUCTION_GMP_WEAVE_EXHAUSTIVE_NORMATIVE_ORACLE"
          assert d["assertions"]==56221
          assert d["reference_families"]["4,4"]["total_distinct_multiset_permutations"]==70
          assert d["reference_families"]["4,4"]["normatively_valid_weaves"]==20
          assert d["reference_families"]["4,5,4"]["total_distinct_multiset_permutations"]==90090
          assert d["reference_families"]["4,5,4"]["normatively_valid_weaves"]==3499
          assert d["calendar_date_invocations"]==0
          assert d["full_calendar_F_invocations"]==0
          assert d["soak_years"]==0
          assert d["process"]["exit_code"]==0
          assert d["gnu_time"]["exit_code"]==0
          assert d["process"]["limit_violation"] is None
          print("V174_INDEPENDENT_EXHAUSTIVE_GMP_WEAVE_56221_RESULT_PASS_ZERO_F_ZERO_SOAK")
          PY
      - name: Hash and preserve evidence on success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("evidence");d.mkdir(exist_ok=True)
          files={}
          for p in sorted(d.iterdir()):
              if p.is_file() and p.name!="manifest.sha256.json":
                  raw=p.read_bytes()
                  files[p.name]={"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
          (d/"manifest.sha256.json").write_text(json.dumps(files,sort_keys=True,indent=2)+"\n")
          PY
      - name: Upload one-shot exhaustive production GMP weave evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v174-production-gmp-weave-exhaustive-oracle-no-calendar-date
          path: |
            evidence/
            apt-update.log
            apt-install.log
            gnat-version.txt
            gprbuild-version.txt
            gmp-and-time-packages.txt
            v174-preflight.stdout
            v174-build.stdout
            v174-run.stdout
          retention-days: 30
          if-no-files-found: warn
