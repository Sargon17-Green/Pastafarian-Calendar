name: Rust Azerbaijani Stage02 DISCOVERY01 Native

on:
  push:
    branches:
      - 'Rust+Azərbaycan-dili'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'audit/STAGE_02_DISCOVERY01_SAVE_CONTRACT_2026-10-30.md'
      - '.github/workflows/rust-az-stage02-discovery01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-stage02-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check source and format without mutating files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          test -f audit/STAGE_02_DISCOVERY01_SAVE_CONTRACT_2026-10-30.md
          grep -Fq 'pub mod discovery01_legacy_save;' src/lib.rs
          grep -Fq 'STAGE02_DISCOVERY01_EXPECTED_RED=3 CONTROL=1 UNEXPECTED=0' tests/stage02_discovery01.rs
      - name: Native Stage1 plus Stage2 and independent differential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'PROJECT_ID=PC-BRANCH-RUST-AZERBAIJANI\nSHA=%s\n' "$GITHUB_SHA" > evidence/sha.txt
          rustc --version > evidence/toolchain.txt
          cargo --version >> evidence/toolchain.txt
          set +e
          timeout --signal=TERM --kill-after=5s 900s \
            cargo test --all-targets -- --nocapture > evidence/stdout.txt 2> evidence/stderr.txt
          code=$?
          set -e
          printf '%s\n' "$code" > evidence/exit.txt
          cat evidence/stdout.txt
          if [ "$code" -ne 0 ]; then
            cat evidence/stderr.txt >&2
            echo "::error::Stage02 Rust Native failed with code $code"
            exit 1
          fi
          grep -Fq 'STAGE02_DISCOVERY01_EXPECTED_RED=3 CONTROL=1 UNEXPECTED=0' evidence/stdout.txt
          if grep -E 'test result: FAILED|test.*FAILED|panic' evidence/stdout.txt evidence/stderr.txt; then
            echo "::error::Unexpected failure in Rust tests"
            exit 1
          fi
          printf 'STAGE02_EXPECTED_RED_NATIVE=PASS\n' > evidence/result.txt
          cat evidence/result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve real native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-az-stage02-native
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
