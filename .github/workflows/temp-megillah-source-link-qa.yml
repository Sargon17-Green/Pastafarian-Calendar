name: Temporary — Megillah source-link visual QA

on:
  pull_request:
    branches:
      - 'JavaScript\+Interlingue'
    paths:
      - 'browser/**'
      - 'tests/browser-*.js'
      - '.github/workflows/temp-megillah-source-link-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.16.0'
  CANONICAL_URL: 'https://the-scroll-of-the-appointed-times.blogspot.com/2026/08/Megilat-HaItim.html'

jobs:
  visual:
    name: Megillah source-link browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and targeted tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/browser-cooking-component.js
          node tests/browser-i18n-locales.js
          node scripts/build-browser.js
          node tests/browser-built-artifacts.js
          node scripts/prepare-pages-site.js _site

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          QA="$RUNNER_TEMP/megillah-link-qa"
          mkdir -p "$QA"
          cd "$QA"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify links in real rendered UI
        shell: bash
        run: |
          set -euo pipefail
          SITE="$GITHUB_WORKSPACE/_site"
          QA="$RUNNER_TEMP/megillah-link-qa"
          cd "$SITE"
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/megillah-link-http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          cd "$QA"
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out=path.join(process.cwd(),'out');
          fs.mkdirSync(out,{recursive:true});
          const URL=process.env.CANONICAL_URL;
          const assert=(v,m)=>{if(!v)throw new Error(m);};

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1000},locale:'he-IL'});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>{
              const h=document.querySelector('pastafari-date');
              if(!h?.shadowRoot)return false;
              h.setAttribute('lang','he');
              const p=h.shadowRoot.querySelector('pastafari-cooking');
              return !!p?.hasAttribute('live') && !!p.shadowRoot?.querySelector('.megillah-source-link');
            },null,{timeout:60000});

            const result=await page.evaluate((url)=>{
              const h=document.querySelector('pastafari-date');
              const p=h.shadowRoot.querySelector('pastafari-cooking');
              const s=p.shadowRoot;
              const keys=['inputs','gates','yearAnchor','years','stones','hidden','visible','bowls','postStirs','selection','structure','cutlets','months','weaving','result','position'];
              const rows=[];
              for(const key of keys){
                p._renderLiveStageGuide(key,true);
                const a=s.querySelector('.megillah-source-link');
                const q=s.querySelector('.megillah-quote blockquote');
                rows.push({
                  key,
                  href:a.getAttribute('href'),
                  target:a.getAttribute('target'),
                  rel:a.getAttribute('rel'),
                  text:a.textContent,
                  quote:q.textContent,
                });
              }
              const a=s.querySelector('.megillah-source-link');
              const rect=a.getBoundingClientRect();
              const pane=s.querySelector('.pane');
              return {
                rows,
                visible:rect.width>0 && rect.height>0,
                sourceText:a.textContent,
                sourceDecoration:getComputedStyle(a).textDecorationLine,
                docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                paneOverflow:(pane?.scrollWidth||0)-(pane?.clientWidth||0),
              };
            },URL);

            assert(result.rows.length===16,'expected 16 linked Megillah contexts');
            for(const row of result.rows){
              assert(row.href===URL,'wrong source URL for '+row.key);
              assert(row.target==='_blank','wrong target for '+row.key);
              assert(row.rel==='noopener noreferrer','unsafe rel for '+row.key);
              assert(row.text.includes('מגילת העיתים'),'source label missing for '+row.key);
              assert(/[\u0590-\u05FF]/u.test(row.quote),'quote not Hebrew for '+row.key);
            }
            assert(result.visible,'source link is not visibly rendered');
            assert(result.sourceDecoration.includes('underline'),'source link lacks visible affordance');
            assert(result.docOverflow<=2 && result.paneOverflow<=2,'desktop source link causes overflow');

            const link=page.locator('pastafari-date').locator('pastafari-cooking').locator('.megillah-source-link');
            await link.focus();
            assert(await link.evaluate(el=>el===el.getRootNode().activeElement),'source link cannot receive keyboard focus');
            await page.screenshot({path:path.join(out,'desktop-he-source-link.png'),fullPage:false});

            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(100);
            const mobile=await page.evaluate(()=>{
              const h=document.querySelector('pastafari-date'),p=h.shadowRoot.querySelector('pastafari-cooking'),s=p.shadowRoot,pane=s.querySelector('.pane'),a=s.querySelector('.megillah-source-link');
              const r=a.getBoundingClientRect();
              return {
                visible:r.width>0&&r.height>0,
                docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                paneOverflow:(pane?.scrollWidth||0)-(pane?.clientWidth||0),
              };
            });
            assert(mobile.visible,'mobile source link is not visible');
            assert(mobile.docOverflow<=2 && mobile.paneOverflow<=2,'mobile source link causes overflow');
            await page.screenshot({path:path.join(out,'mobile-he-source-link.png'),fullPage:false});

            fs.writeFileSync(path.join(out,'metrics.json'),JSON.stringify({result,mobile},null,2));
            await ctx.close();
            await browser.close();
            console.log('MEGILLAH_SOURCE_LINK_QA=PASS');
          })().catch(e=>{console.error(e?.stack||e);process.exit(1);});
          JS
          node qa.js

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megillah-source-link-visual
          path: ${{ runner.temp }}/megillah-link-qa/out
          if-no-files-found: warn
          retention-days: 14
