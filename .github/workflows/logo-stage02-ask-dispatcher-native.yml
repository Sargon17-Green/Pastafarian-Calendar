name: Logo Stage2 QA D19 isolated fourth gate profile
on:
  push:
    branches:
      - 'qa/logo-ido-stage2-ask-dispatcher-20261125'
permissions:
  contents: read
jobs:
  ask-dispatcher:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - direction: forward
            group: year5000
          - direction: reverse
            group: year5000
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source and generate the fixed runner
        shell: bash
        env:
          DIRECTION: ${{ matrix.direction }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "c21646e1b06f25b3f75fb672dd432ead8e664875" HEAD
          test "$(git ls-remote origin 'refs/heads/Logo+Ido' | awk '{print $1}')" = "ad001c6aeeb6c758f5004b206a656fec5d6fc403"
          git diff --exit-code "c21646e1b06f25b3f75fb672dd432ead8e664875" HEAD -- src test
          mkdir -p "$RUNNER_TEMP/qa-bundle"
          unzip -q qa/logo_ido_ask_dispatcher_code_bundle.zip -d "$RUNNER_TEMP/qa-bundle"
          (cd "$RUNNER_TEMP/qa-bundle" && sha256sum -c qa/bundle.sha256)
          cp "$RUNNER_TEMP/qa-bundle/qa/logo_stage2_ask_dispatcher_common.logo" qa/
          cp "$RUNNER_TEMP/qa-bundle/qa/logo_stage2_ask_dispatcher_oracle.py" qa/
          cp "$RUNNER_TEMP/qa-bundle/QA_STAGE2_ASK_DISPATCHER_INTEGRATION_CONTRACT_20261125.md" .
          # Gate reporters return BI lists; the row logger must also nest binary SENTENCE inputs.
          # explicitly discard those values when they are used as loop commands.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("qa/logo_stage2_ask_dispatcher_common.logo")
          source = path.read_text(encoding="utf-8")
          replacements = (
              ("  print sentence [ASK_DISPATCH_ROW] :tag :step [A] (bi.digits :firstValue) [N] (bi.digits :N) [R] (bi.digits :rank)\n",
               "  print (sentence [ASK_DISPATCH_ROW] (sentence :tag (sentence :step (sentence [A] (sentence (bi.digits :firstValue) (sentence [N] (sentence (bi.digits :N) (sentence [R] (bi.digits :rank)))))))))\n", 1),
              ("    nr.gate.extend.forward\n", "    ignore nr.gate.extend.forward\n", 1),
              ("[nr.gate.extend.backward]", "[ignore nr.gate.extend.backward]", 2),
              ("[nr.gate.extend.forward]", "[ignore nr.gate.extend.forward]", 2),
          )
          changed = 0
          for old, new, expected in replacements:
              actual = source.count(old)
              if actual != expected:
                  raise SystemExit(f"expected {expected} occurrences of {old!r}; found {actual}")
              source = source.replace(old, new)
              changed += actual
          if changed != 6:
              raise SystemExit(f"expected six QA harness fixes; changed {changed}")
          # Exact frozen formula; insert observation only in a QA-local copy.
          reference = Path("test/normative_reference.logo").read_text(encoding="utf-8")
          assert reference.count("to nr.sauce :calculationDay :targetDay\n  localmake \"counts nr.work.counts :calculationDay :targetDay\n  localmake \"stones nr.stones\n  localmake \"hidden nr.hidden.build :counts :stones\n  localmake \"visible nr.visible.build :counts :stones :hidden\n  localmake \"bowls nr.initial.bowls :counts\n  localmake \"dropResult nr.apply.drops 1 :bowls :visible :stones []\n  localmake \"after item 1 :dropResult\n  localmake \"latch item 2 :dropResult\n  localmake \"final nr.post.stirs 1 :after\n  output (list :final :latch)\nend") == 1
          assert reference.count("to nr.gate.gap :signedStep\n  localmake \"target bi.add nr.foundation :signedStep\n  localmake \"s nr.sauce nr.foundation :target\n  localmake \"stream nr.ask :s 1 1\n  localmake \"chosen nr.choose.rank :stream bi.small 922\n  output bi.add bi.small 41 :chosen\nend") == 1
          start_marker = "to ad.year5000.data :calculation\n"
          assert source.count(start_marker) == 1
          start = source.index(start_marker)
          end = source.index("\nend\n", start) + len("\nend\n")
          source = source[:start] + "to ad.year5000.data :calculation\n  ; Isolated fourth gap, no three-gate prefetch. Diagnostic, not acceptance.\n  localmake \"step bi.small 4\n  if equalp :AD.DIRECTION \"forward [make \"step bi.sub bi.zero :step]\n  print [ASK_DISPATCH_GATE_PROFILE_BEGIN]\n  print (sentence [ASK_DISPATCH_GATE_PROFILE_DIRECTION] :AD.DIRECTION)\n  localmake \"target bi.add nr.foundation :step\n  localmake \"s ad.profile.sauce nr.foundation :target\n  print [ASK_DISPATCH_GATE_PROFILE_ASK_BEGIN]\n  localmake \"stream nr.ask :s 1 1\n  print [ASK_DISPATCH_GATE_PROFILE_RANK_BEGIN]\n  localmake \"chosen nr.choose.rank :stream bi.small 922\n  localmake \"gap bi.add bi.small 41 :chosen\n  if bi.lt :gap bi.small 42 [print [ASK_DISPATCH_GATE_PROFILE_RANGE_FAILURE] bye]\n  if bi.gt :gap bi.small 963 [print [ASK_DISPATCH_GATE_PROFILE_RANGE_FAILURE] bye]\n  print (sentence [ASK_DISPATCH_GATE_PROFILE_GAP] (bi.digits :gap))\n  print [ASK_DISPATCH_GATE_PROFILE_DONE]\n  bye\nend\n" + source[end:] + "\n" + "to ad.profile.sauce :calculationDay :targetDay\n  print [ASK_DISPATCH_GATE_PROFILE_COUNTS_BEGIN]\n  localmake \"counts nr.work.counts :calculationDay :targetDay\n  print [ASK_DISPATCH_GATE_PROFILE_STONES_BEGIN]\n  localmake \"stones nr.stones\n  print [ASK_DISPATCH_GATE_PROFILE_HIDDEN_BEGIN]\n  localmake \"hidden nr.hidden.build :counts :stones\n  print [ASK_DISPATCH_GATE_PROFILE_VISIBLE_BEGIN]\n  localmake \"visible nr.visible.build :counts :stones :hidden\n  print [ASK_DISPATCH_GATE_PROFILE_BOWLS_BEGIN]\n  localmake \"bowls nr.initial.bowls :counts\n  print [ASK_DISPATCH_GATE_PROFILE_DROPS_BEGIN]\n  localmake \"dropResult nr.apply.drops 1 :bowls :visible :stones []\n  print [ASK_DISPATCH_GATE_PROFILE_AFTER_BEGIN]\n  localmake \"after item 1 :dropResult\n  print [ASK_DISPATCH_GATE_PROFILE_LATCH_BEGIN]\n  localmake \"latch item 2 :dropResult\n  print [ASK_DISPATCH_GATE_PROFILE_STIRS_BEGIN]\n  localmake \"final nr.post.stirs 1 :after\n  output (list :final :latch)\nend\n"
          print("ASK_DISPATCH_GATE_PROFILE_CONTRACT=READY isolated signed step +/-4")
          path.write_text(source, encoding="utf-8")
          print("ASK_DISPATCH_GATE_REPORTER_PATCH=PASS 6/6")
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/commit.txt"
          git ls-tree -r HEAD src test > "$RUNNER_TEMP/source-blobs.txt"
          sha256sum qa/logo_ido_ask_dispatcher_code_bundle.zip qa/logo_stage2_ask_dispatcher_common.logo qa/logo_stage2_ask_dispatcher_oracle.py QA_STAGE2_ASK_DISPATCHER_INTEGRATION_CONTRACT_20261125.md .github/workflows/logo-stage02-ask-dispatcher-native.yml > "$RUNNER_TEMP/qa-hashes.txt"
          cat > "$RUNNER_TEMP/native.logo" <<EOF
          make "AD.DIRECTION "$DIRECTION
          make "AD.GROUP "$GROUP
          load "qa/logo_stage2_ask_dispatcher_common.logo
          ad.run
          EOF
      - name: Build pinned UCBLogo 6.2.5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git gcc g++ make autoconf automake autoconf-archive libncurses-dev
          git clone --quiet --depth 1 --branch version_6.2.5 https://github.com/jrincayc/ucblogo-code.git "$RUNNER_TEMP/ucblogo-source"
          test "$(git -C "$RUNNER_TEMP/ucblogo-source" rev-parse HEAD)" = "a0215433f07384e4c42fe247525867f11e6f32f7"
          cd "$RUNNER_TEMP/ucblogo-source"
          autoreconf -fi
          CFLAGS="-O2 -std=gnu17" ./configure --prefix="$RUNNER_TEMP/ucblogo-headless" --disable-wx --disable-x11 --disable-docs
          make -j2
          make install
          echo "LOGO_BIN=$RUNNER_TEMP/ucblogo-headless/bin/ucblogo" >> "$GITHUB_ENV"
      - name: Run bounded fourth-gate phase diagnostic
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          echo bye | timeout --signal=TERM --kill-after=5s 1200 stdbuf -oL -eL "$LOGO_BIN" "$RUNNER_TEMP/native.logo" > "$RUNNER_TEMP/native.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$RUNNER_TEMP/exit.txt"
          echo "$((SECONDS-started))" > "$RUNNER_TEMP/elapsed.txt"
          cat "$RUNNER_TEMP/native.log"
          test "$code" = 0
          grep -Fxq 'ASK_DISPATCH_GATE_PROFILE_DONE' "$RUNNER_TEMP/native.log"
          for phase in COUNTS STONES HIDDEN VISIBLE BOWLS DROPS AFTER LATCH STIRS ASK RANK; do
            test "$(grep -Fxc "ASK_DISPATCH_GATE_PROFILE_${phase}_BEGIN" "$RUNNER_TEMP/native.log")" = 1
          done
          test "$(grep -Ec '^ASK_DISPATCH_GATE_PROFILE_GAP [0-9]+$' "$RUNNER_TEMP/native.log")" = 1
          if grep -Eq 'ASK_DISPATCH_.*FAILURE|I don.t know how to|not enough inputs|doesn.t like|You don.t say what to do with|FALIIS' "$RUNNER_TEMP/native.log"; then exit 1; fi
          echo 'GATE_PROFILE_COMPLETED_DIAGNOSTIC_ONLY=YES'
      - name: Preserve exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-gate-profile-${{ matrix.direction }}
          path: |
            ${{ runner.temp }}/commit.txt
            ${{ runner.temp }}/source-blobs.txt
            ${{ runner.temp }}/qa-hashes.txt
            ${{ runner.temp }}/native.logo
            ${{ runner.temp }}/native.log
            ${{ runner.temp }}/exit.txt
            ${{ runner.temp }}/elapsed.txt
          if-no-files-found: warn
          retention-days: 30
