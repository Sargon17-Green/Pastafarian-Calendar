name: Logo Stage2 fresh Native signed gap boundary probes
on:
  push:
    branches:
      - 'qa/logo-ido-stage2-ask-dispatcher-20261125'
permissions:
  contents: read
jobs:
  native-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - gate: -12
            expected: 746
          - gate: -1
            expected: 503
          - gate: 10
            expected: 763
          - gate: 29473
            expected: 175
          - gate: 29485
            expected: 534
          - gate: 29496
            expected: 864
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify locked inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          test "$(cat evidence/commit.txt)" = "$GITHUB_SHA"
          git merge-base --is-ancestor c3e34663db5e33712f35fbebd3190443125babc4 HEAD
          git diff --exit-code c21646e1b06f25b3f75fb672dd432ead8e664875 HEAD -- src test
          test "$(git ls-remote origin 'refs/heads/Logo+Ido' | awk '{print $1}')" = ad001c6aeeb6c758f5004b206a656fec5d6fc403
          test "$(git hash-object qa/logo_signed_gap_oracle.py)" = 0bbce1ed67f4eb7c12986b4a3431eff9b27a4974
          git ls-tree -r HEAD src test > evidence/source-blobs.txt
          test "$(sha256sum evidence/source-blobs.txt | cut -d' ' -f1)" = 0a3e7007f21874e94ace3f70e361767ff7dbc7ee5464eea34e446494fa907123
          sha256sum src/exact_integer.logo test/normative_reference.logo qa/logo_signed_gap_oracle.py > evidence/input-sha256.txt
          printf '%s\n' 'host-run=46078314376' 'forward-artifact=15235573233 sha256=1f5b95293e776f8debfb4f941760a841238f7fa38c1eb7bc341b791ebd4e264e' 'reverse-artifact=15234874328 sha256=2fe59e72deef9c592969160203f57c162f5b8b2a660154eddd1d72d21502a4f7' > evidence/host-provenance.txt
      - name: Build pinned UCBLogo 6.2.5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git gcc g++ make autoconf automake autoconf-archive libncurses-dev
          git clone --quiet --depth 1 --branch version_6.2.5 https://github.com/jrincayc/ucblogo-code.git "$RUNNER_TEMP/ucblogo-source"
          test "$(git -C "$RUNNER_TEMP/ucblogo-source" rev-parse HEAD)" = "a0215433f07384e4c42fe247525867f11e6f32f7"
          cd "$RUNNER_TEMP/ucblogo-source"
          autoreconf -fi
          CFLAGS="-O2 -std=gnu17" ./configure --prefix="$RUNNER_TEMP/ucblogo-headless" --disable-wx --disable-x11 --disable-docs
          make -j2
          make install
          echo "LOGO_BIN=$RUNNER_TEMP/ucblogo-headless/bin/ucblogo" >> "$GITHUB_ENV"
      - name: Fresh unmodified reference versus audited host probe
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import json, os, re, subprocess, sys, time
          from pathlib import Path
          sys.path.insert(0, 'qa')
          from logo_signed_gap_oracle import gap
          k, expected = int(os.environ['GATE']), int(os.environ['EXPECTED'])
          assert k != 0 and 42 <= expected <= 963 and gap(k) == expected
          # bi.small accepts a single base-10000 limb; use normalized limbs for every index.
          n, digits = abs(k), []
          while n:
              n, r = divmod(n, 10000)
              digits.append(r)
          assert sum(x*10000**i for i,x in enumerate(digits)) == abs(k)
          assert all(0 <= x < 10000 for x in digits)
          signed = '(bi.make ' + str(1 if k > 0 else -1) + ' [' + ' '.join(map(str,digits)) + '])'
          p = Path('evidence')
          script = p/'probe.logo'
          script.write_text('\n'.join(['load "src/exact_integer.logo', 'load "test/normative_reference.logo',
              'print [NATIVE_BEGIN]', 'make "PROBE.INDEX ' + signed,
              'print (sentence [NATIVE_INDEX] (sentence (bi.sign :PROBE.INDEX) (bi.digits :PROBE.INDEX)))',
              'make "PROBE.GAP nr.gate.gap :PROBE.INDEX',
              'print (sentence [NATIVE_GAP] (bi.to.small :PROBE.GAP))',
              'print [NATIVE_DONE]', 'bye'])+'\n')
          t = time.monotonic()
          with (p/'native.log').open('w') as f:
              proc = subprocess.run(['timeout','--signal=TERM','--kill-after=5s','600','stdbuf','-oL','-eL',os.environ['LOGO_BIN'],str(script)],stdin=subprocess.DEVNULL,stdout=f,stderr=subprocess.STDOUT)
          elapsed = time.monotonic()-t
          log = (p/'native.log').read_text(errors='replace')
          print(log,flush=True)
          markers = [line.strip() for line in log.splitlines() if line.strip().startswith('NATIVE_')]
          errors = re.findall(r"don.t know how to|not enough inputs|doesn.t like|You don.t say what to do with|ERORO:", log,re.I)
          ok = proc.returncode == 0 and not errors and markers == ['NATIVE_BEGIN','NATIVE_INDEX ' + str(1 if k > 0 else -1) + ' ' + ' '.join(map(str,digits)),f'NATIVE_GAP {expected}','NATIVE_DONE']
          result = dict(index=k,limbs=digits,expected=expected,markers=markers,exit=proc.returncode,elapsed=elapsed,errors=errors,qualification='FRESH_NATIVE_SIGNED_GAP_ONLY',passed=ok)
          (p/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          print('NATIVE_SIGNED_GAP_PASS' if ok else 'NATIVE_SIGNED_GAP_NOT_ACCEPTED',result,flush=True)
          sys.exit(0 if ok else 1)
          PY
      - name: Preserve source lock, probe and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-native-signed-gap-${{ matrix.gate }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
