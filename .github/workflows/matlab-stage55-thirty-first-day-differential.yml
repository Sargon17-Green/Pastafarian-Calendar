name: MATLAB Stage55 Thirty-First Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_thirty_first_native.m'
      - 'tools/stage55_after31_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-thirty-first-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-thirty-first-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  thirty-first-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER30 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-thirtieth-day-differential
          run-id: 41875199964
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER30
        run: |
          echo '10565729bb45fcc8c9bae08f6c63f3448e4d7f2d037fd1fdfafa950071c86886  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_30.json' | sha256sum -c -
      - name: Preflight AFTER31 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after31_interval_five_fields.py
          grep -Fqx 'PIN = "10565729bb45fcc8c9bae08f6c63f3448e4d7f2d037fd1fdfafa950071c86886"' tools/stage55_after31_interval_five_fields.py
          python3 -m py_compile tools/stage55_after31_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native thirty-first-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_thirty_first_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after31_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_30.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_31.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_THIRTY_FIRST_PYTHON.log
          grep '^STAGE55_THIRTY_FIRST_ROW ' logs/STAGE55_THIRTY_FIRST_PYTHON.log > logs/STAGE55_THIRTY_FIRST_PYTHON_ROW.txt
          grep '^STAGE55_THIRTY_FIRST_ROW ' logs/STAGE55_THIRTY_FIRST_NATIVE.log > logs/STAGE55_THIRTY_FIRST_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_THIRTY_FIRST_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_THIRTY_FIRST_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_THIRTY_FIRST_PYTHON_ROW.txt logs/STAGE55_THIRTY_FIRST_NATIVE_ROW.txt
          expected="STAGE55_THIRTY_FIRST_ROW POSITION=31 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=31 MONTH_INDEX=19 MONTH_DAY=3"
          grep -Fqx "$expected" logs/STAGE55_THIRTY_FIRST_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_THIRTY_FIRST_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_31.json | tee logs/STAGE55_THIRTY_FIRST_DIGEST.txt
          echo 'STAGE55_THIRTY_FIRST_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-thirty-first-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_30.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_31.json
            logs/STAGE55_THIRTY_FIRST_NATIVE.log
            logs/STAGE55_THIRTY_FIRST_PYTHON.log
            logs/STAGE55_THIRTY_FIRST_PYTHON_ROW.txt
            logs/STAGE55_THIRTY_FIRST_NATIVE_ROW.txt
            logs/STAGE55_THIRTY_FIRST_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
