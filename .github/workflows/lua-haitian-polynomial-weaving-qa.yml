name: Lua Haitian Exact Polynomial Weaving QA

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python_exact_polynomial_weaving:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Source and scope lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lua-exact-poly-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || exit 20
          test "$(git rev-parse HEAD:test/lua_haitian_polynomial_weaving_qa.py)" = "b5793dbdcb02f37aa388cbe79101d5d61cb26bba" || exit 21
          printf 'PROJECT_ID=PC-BRANCH-LUA-HAITIAN\nSOURCE_SHA=%s\nSCOPE=EXACT_PYTHON_QA_ONLY\nNORMATIVE_WEAVING=NOT_RUN\nFULL_DATE=NOT_RUN\n' "$GITHUB_SHA" > lua-exact-poly-evidence/manifest.txt
          sha256sum test/lua_haitian_polynomial_weaving_qa.py docs/LUA_HAITIAN_POLYNOMIAL_WEAVING_CONTRACT_2026-11-22.md .github/workflows/lua-haitian-polynomial-weaving-qa.yml > lua-exact-poly-evidence/sha256.txt
      - name: Exact polynomial QA and real frozen vector count (not Lua Native)
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ( ulimit -v 786432; timeout --signal=TERM --kill-after=2s 110s python3 test/lua_haitian_polynomial_weaving_qa.py --large ) > lua-exact-poly-evidence/stdout.txt 2> lua-exact-poly-evidence/stderr.txt
          code=$?
          set -e
          echo "$code" > lua-exact-poly-evidence/exit_code.txt
          cat lua-exact-poly-evidence/stdout.txt
          if test -s lua-exact-poly-evidence/stderr.txt; then cat lua-exact-poly-evidence/stderr.txt >&2; fi
          test "$code" -eq 0 || exit "$code"
          test ! -s lua-exact-poly-evidence/stderr.txt || exit 31
          grep -Fxq 'POLYNOMIAL_WEAVING_COUNTS_PASS: 43/43' lua-exact-poly-evidence/stdout.txt || exit 32
          grep -Fxq 'POLYNOMIAL_WEAVING_PREFIX_PASS: 290/290' lua-exact-poly-evidence/stdout.txt || exit 33
          grep -Fxq 'POLYNOMIAL_WEAVING_UNRANK_PASS: 122/122' lua-exact-poly-evidence/stdout.txt || exit 34
          grep -Fxq 'POLYNOMIAL_WEAVING_CATALAN_PASS: 12/12' lua-exact-poly-evidence/stdout.txt || exit 35
          grep -Fxq 'POLYNOMIAL_WEAVING_GUARDS_PASS: 10/10' lua-exact-poly-evidence/stdout.txt || exit 36
          grep -Fxq 'SYNTHETIC_FULL_UNRANK_FIRST: PASS' lua-exact-poly-evidence/stdout.txt || grep -Eq '^SYNTHETIC_FULL_UNRANK_FIRST: PASS; seconds=[0-9.]+' lua-exact-poly-evidence/stdout.txt || exit 37
          grep -Eq '^SYNTHETIC_FULL_UNRANK_MIDDLE: PASS; seconds=[0-9.]+' lua-exact-poly-evidence/stdout.txt || exit 38
          grep -Eq '^SYNTHETIC_FULL_UNRANK_LAST: PASS; seconds=[0-9.]+' lua-exact-poly-evidence/stdout.txt || exit 39
          grep -Fxq 'ATTESTED_M47_L5294_EXACT_COUNT_DIGITS: 8654' lua-exact-poly-evidence/stdout.txt || exit 40
          grep -Fxq 'ATTESTED_M47_L5294_EXACT_COUNT_SHA256: e3d498d39d6b4dfc401a85b8d9135ff1089a81ace85565ac5dcb123870c09f34' lua-exact-poly-evidence/stdout.txt || exit 41
          grep -Fxq 'ATTESTED_M47_L5294_96_PREFIXES: 3/3' lua-exact-poly-evidence/stdout.txt || exit 42
          grep -Fxq 'NORMATIVE_CHOOSE_RANK=NOT_RUN; NORMATIVE_WEAVING=NOT_RUN; FULL_DATE=NOT_RUN; PRODUCTION=UNCHANGED' lua-exact-poly-evidence/stdout.txt || exit 43
      - name: Upload exact QA evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lua-haitian-polynomial-weaving-exact-qa-evidence
          path: lua-exact-poly-evidence/
          retention-days: 30
          if-no-files-found: warn
