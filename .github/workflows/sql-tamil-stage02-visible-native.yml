name: SQL Tamil Stage 2 Visible Drop Native and Differential
on:
  push:
    branches:
      - 'SQL\+தமிழ்'
    paths:
      - 'sql/06_stage02_visible_drops.sql'
      - 'sql/test/80_stage02_visible_drop_tests.sql'
      - 'sql/test/81_stage02_visible_differential.sql'
      - '.github/workflows/sql-tamil-stage02-visible-native.yml'
      - 'sql/03_stage02_production_core.sql'
      - 'sql/04_stage02_stone_states.sql'
      - 'sql/05_stage02_hidden_drop.sql'
      - 'sql/test/10_normative_reference.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visible-drops:
    name: PostgreSQL 17 - visible native, isolation, differential
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sql-tamil-visible-logs
          docker run --detach --name sql-tamil-visible-pg --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$GITHUB_WORKSPACE:/work:ro" postgres:17
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres sql-tamil-visible-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres sql-tamil-visible-pg postgres --version | tee sql-tamil-visible-logs/versions.txt
          printf 'Git SHA: %s\n' "$GITHUB_SHA" | tee -a sql-tamil-visible-logs/versions.txt
      - name: Verify 51 visible native assertions
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres sql-tamil-visible-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -f /work/sql/00_schema.sql \
            -f /work/sql/01_source_language_catalog.sql \
            -f /work/sql/02_monster_bootstrap.sql \
            -f /work/sql/03_stage02_production_core.sql \
            -f /work/sql/04_stage02_stone_states.sql \
            -f /work/sql/05_stage02_hidden_drop.sql \
            -f /work/sql/06_stage02_visible_drops.sql \
            -f /work/sql/test/80_stage02_visible_drop_tests.sql \
            -c 'SELECT 1/((count(*)=51 AND bool_and(ok))::integer) AS visible_51_of_51 FROM stage02_visible_assertions' \
            2>&1 | tee sql-tamil-visible-logs/native.txt
      - name: Verify four production isolation assertions
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres sql-tamil-visible-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -f /work/sql/test/40_production_isolation.sql \
            -c 'SELECT 1/((count(*)=4 AND bool_and(ok))::integer) AS isolation_4_of_4 FROM stage01_production_isolation_assertions' \
            2>&1 | tee sql-tamil-visible-logs/isolation.txt
      - name: Create separate differential database
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres sql-tamil-visible-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c 'CREATE DATABASE sql_tamil_visible_diff'
      - name: Verify 184 visible reference differential assertions
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres sql-tamil-visible-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d sql_tamil_visible_diff \
            -f /work/sql/00_schema.sql \
            -f /work/sql/01_source_language_catalog.sql \
            -f /work/sql/02_monster_bootstrap.sql \
            -f /work/sql/03_stage02_production_core.sql \
            -f /work/sql/04_stage02_stone_states.sql \
            -f /work/sql/05_stage02_hidden_drop.sql \
            -f /work/sql/06_stage02_visible_drops.sql \
            -f /work/sql/test/10_normative_reference.sql \
            -f /work/sql/test/81_stage02_visible_differential.sql \
            -c 'SELECT 1/((count(*)=184 AND bool_and(ok))::integer) AS differential_184_of_184 FROM stage02_visible_differential' \
            2>&1 | tee sql-tamil-visible-logs/differential.txt
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-tamil-stage02-visible-native
          path: sql-tamil-visible-logs/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop isolated database
        if: always()
        shell: bash
        run: docker rm --force sql-tamil-visible-pg 2>/dev/null || true
