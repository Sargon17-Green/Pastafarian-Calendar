name: Soak v219 Kotlin source lineage and recurrence equivalence (zero F)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v219-kotlin-lineage-model.yml
permissions:
  contents: read
  actions: read
jobs:
  static-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify historical pins and prior receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5315c6b3953b0d3bcbd40917aad88fa1ef535541"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v219-kotlin-lineage-model.yml"
          mkdir -p evidence
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/14618673805/zip > evidence/v131.zip
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15220964264/zip > evidence/v218.zip
          echo "383241ca5002fd28dbdf62c239090b7fa557b42dca4350deaef8cfd955ba86c2  evidence/v131.zip" | sha256sum -c -
          echo "d6a6490a06caf92716e7277be9ca9924b51084110961704f0367bd9e9e04d7c7  evidence/v218.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,zipfile,subprocess
          from pathlib import Path
          def load(p,suffix):
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  n=[n for n in z.namelist() if n.endswith(suffix)]
                  assert len(n)==1
                  return json.loads(z.read(n[0]))
          prior=load("evidence/v218.zip","result.json")
          assert (prior["vectors"],prior["states"],prior["transitions"],prior["mismatches"])==(77,20545,58153,0)
          assert prior["model_only"] and not prior["soak_dispatch_authorized"]
          r=load("evidence/v131.zip","v131-lineage-screen.json")
          rows={x["record_id"]:x for x in r["records"]}
          ref="b05b46a8f85733c4d24ed2ddfb422d37c5918ec6"
          repo="Sargon17-Green/Pastafarian-Calendar"
          pins={
              "soak/Post55ProductionDateBridge.kt":"3c328abfd40b6fc1edf730e6012b05ad7fcb65d6",
              "src/test/kotlin/pastafari/NormativeCalendar.kt":"033869e43285f793aacf7cf300ce6cf6d0c6a81f",
              "src/main/kotlin/pastafari/ProductionMonthWeavingEngine.kt":"d69edc09b94ae630586c619bf8d0592fa21278de",
              "src/test/kotlin/pastafari/NormativeCore.kt":"c6a1ef4f61dd813f4223290c346694562e05818f"}
          inventory={}
          for p,h in pins.items():
              b=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/{repo}/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\x00"+b).hexdigest()==h
              inventory[p]={"blob":h,"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}
              Path("evidence",Path(p).name+".source.txt").write_bytes(b)
          for rid in ["WELSH-KOTLIN-PRODUCTION","REF-26"]:
              row=rows[rid]
              assert row["historical_head_commit"]==ref
              p=row["observed_source_path"]
              assert inventory[p]["blob"]==row["git_blob_sha1"] and inventory[p]["sha256"]==row["source_sha256"]
          def check(p,anchors):
              s=Path("evidence",p+".source.txt").read_text()
              assert all(a in s for a in anchors),(p,[a for a in anchors if a not in s])
          check("Post55ProductionDateBridge.kt",["ProductionMonthWeavingEngine(months.lengths)","weaving.countAll()","weaving.dayAt("])
          check("NormativeCalendar.kt",["NormativeCore.WeavingFamily(oneBased)","family.unrank1(rank)"])
          check("ProductionMonthWeavingEngine.kt",["table[j + 1][s + length - 1]","row[s - 1]).add(opened)","if (length == 1)","if (s == 0) table[j + 1][0] else row[s - 1]","openedBranchRatios(","parentCount.subtract(consumedOpenedCount)","numerator.divideAndRemainder(denominator)"])
          check("NormativeCore.kt",["Key(remaining.drop(1), opened, closed)","total += count(next, no, nc)","val block = count(next.first, next.second, next.third)"])
          Path("evidence/source-pins.json").write_text(json.dumps(inventory,indent=2)+"\n")
          PY
      - name: Compare source-derived models and shifted recurrence
        run: |
          set -euo pipefail
          ulimit -v 524288
          timeout -k 5s 120s python3 - <<'PY'
          from itertools import product
          from math import comb
          from functools import lru_cache
          from fractions import Fraction
          import json
          from pathlib import Path
          cases=states=branches=shift_cells=singleton_cases=0
          for m in range(1,5):
              for L in product(range(1,5),repeat=m):
                  if sum(L)>12:continue
                  cases+=1
                  singleton_cases+=int(1 in L)
                  @lru_cache(None)
                  def F(j,s):
                      if j==m:return 1
                      if L[j]==1:return F(j+1,0)
                      return sum(comb(r+L[j]-2,L[j]-2)*F(j+1,r+L[j]-1) for r in range(s+1))
                  @lru_cache(None)
                  def H(i,q):
                      if i==m-1:return 1
                      n=L[i+1]
                      return sum(comb(n+r-2,r)*H(i+1,n+r) for r in range(q))
                  def base(a):
                      S=0;B=1
                      for n in a:
                          S+=n;B*=comb(S-1,n-1)
                      return B
                  @lru_cache(None)
                  def brute(rem,o,c):
                      global states,branches,shift_cells
                      states+=1
                      active=rem[c:o];S=sum(active)
                      count=base(active)*F(o,S)
                      if 1 not in L and o>0:
                          assert F(o,S)==H(o-1,S+1)
                          shift_cells+=1
                      if not any(rem):
                          assert count==1
                          return 1
                      ways=0
                      for i,n in enumerate(rem):
                          if not n or (n==L[i] and i!=o) or (n==1 and i!=c):continue
                          r=list(rem);r[i]-=1
                          no=o+(n==L[i]);nc=c+(n==1)
                          child=brute(tuple(r),no,nc)
                          branches+=1;ways+=child
                          if i<o:
                              # Kotlin source's opened-branch ratio.
                              numerator=denominator=1
                              sums=[];total=0
                              for v in active:
                                  total+=v;sums.append(total)
                              for k in range(i-c+1,len(active)):
                                  numerator*=sums[k-1];denominator*=sums[k]-1
                              if i>c:
                                  numerator*=n-1;denominator*=sums[i-c]-1
                              assert count*Fraction(numerator,denominator)*Fraction(F(o,S-1),F(o,S))==child
                      assert ways==count,(L,rem,o,c,ways,count)
                      return ways
                  brute(L,0,0)
          assert cases>0 and singleton_cases>0 and shift_cells>0 and branches>states
          out={"schema":"SOAK_V219_KOTLIN_LINEAGE_MODELS/1","historical_head":"b05b46a8f85733c4d24ed2ddfb422d37c5918ec6","source_roster_records":["WELSH-KOTLIN-PRODUCTION","REF-26"],"production_model":"OPENED_TOKEN_SUFFIX_RECURRENCE_WITH_EXACT_BRANCH_RATIOS","reference_model":"FULL_REMAINING_VECTOR_MEMOIZED_CENSUS","production_recurrence_shift_equivalent_to_main_family_for_non_singletons":True,"singleton_handling_explicit_in_production_source":True,"distinct_from_reference":True,"not_proof_of_independent_origin":True,"vectors":cases,"singleton_vectors":singleton_cases,"states":states,"transitions":branches,"shift_equivalence_checks":shift_cells,"mismatches":0,"model_only":True,"original_kotlin_executions":0,"native_date_calls":0,"whole_year_credit":0,"full_dependency_closure_verified":False,"admitted_engines":0,"soak_dispatch_authorized":False}
          Path("evidence/result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v219-kotlin-model-${{ github.run_id }}
          path: evidence/
          retention-days: 90
