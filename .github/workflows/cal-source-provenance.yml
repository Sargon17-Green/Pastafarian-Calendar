name: CAL source provenance (no executable)

on:
  push:
    branches:
      - 'Plain-English-Programming\+English'
    paths:
      - "tools/cal_source_provenance.py"
      - "tools/test_cal_source_provenance.py"
      - "tools/cal_bootstrap_stage_manifest.json"
      - "tools/cal_bootstrap_stage_inventory.py"
      - "tools/test_cal_bootstrap_stages.py"
      - "tools/cal_static_api_surface.py"
      - "tools/test_cal_static_api_surface.py"
      - "tools/cal_static_callsite_intel.py"
      - "tools/test_cal_static_callsite_intel.py"
      - ".github/workflows/cal-source-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline source-verifier tests
        run: python3 -m unittest discover -s tools -p "test_cal_*.py" -v
      - name: Validate pinned eight-stage tree metadata offline (no binaries)
        run: python3 tools/cal_bootstrap_stage_inventory.py
      - name: Verify twelve pinned text sources; do not fetch ZIP or EXE
        run: python3 tools/cal_source_provenance.py --fetch --output "$RUNNER_TEMP/cal-source-provenance.json"
      - name: Audit Windows API capabilities in pinned text sources only
        run: python3 tools/cal_static_api_surface.py --fetch --output "$RUNNER_TEMP/cal-api-surface.json"
      - name: Map direct calls and Intel hex literals from pinned text only
        run: python3 tools/cal_static_callsite_intel.py --fetch --output "$RUNNER_TEMP/cal-callsite-intel.json"
      - name: Summarize non-execution gate
        run: |
          echo "Only textual provenance was checked." >> "$GITHUB_STEP_SUMMARY"
          echo "No CAL executable was downloaded or executed." >> "$GITHUB_STEP_SUMMARY"
          echo "Native QA and malware clearance remain unverified." >> "$GITHUB_STEP_SUMMARY"
