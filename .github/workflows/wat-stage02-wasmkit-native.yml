name: WAT Stage02 WasmKit Native Evidence

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wasmkit-exact-source:
    name: WasmKit 111 exports at locked source SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: '871f9b70216c16c57abcd552ec6fb0ed1010e305'
      WAT_SHA256: '18e2c15a142b3a262ff38a1e084d86bdc1a139ce030b0318f279dbcdb23f8980'
    steps:
      - name: Checkout immutable source commit (not QA HEAD)
        uses: actions/checkout@v4
        with:
          ref: '871f9b70216c16c57abcd552ec6fb0ed1010e305'
          persist-credentials: false

      - name: Validate immutable source and create evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wat-stage02-evidence"
          actual_head="$(git rev-parse HEAD)"
          actual_wat="$(sha256sum tests/normative_selector.wat | awk '{print $1}')"
          printf 'PROJECT_ID\tPC-BRANCH-WAT-SPANISH\nSOURCE_COMMIT\t%s\nWAT_SHA256\t%s\nQA_EVENT_SHA\t%s\nRUN_ID\t%s\nRUN_ATTEMPT\t%s\nRUNNER_OS\t%s\nRUNNER_ARCH\t%s\n' \
            "$actual_head" "$actual_wat" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" \
            > "$RUNNER_TEMP/wat-stage02-evidence/manifest.tsv"
          test "$actual_head" = "$SOURCE_COMMIT"
          test "$actual_wat" = "$WAT_SHA256"
          git status --short

      - name: Install verified WasmKit 0.1.6 Linux x86_64 release binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          release='https://github.com/swiftwasm/WasmKit/releases/download/0.1.6/wasmkit-x86_64-swift-linux-musl.tar.gz'
          expected='57085becd37769ed618a9057dee6d70303195e31d3b46d09dac1cfb5d477aa24'
          archive="$RUNNER_TEMP/wasmkit-x86_64-swift-linux-musl.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$release" -o "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          bin_dir="$RUNNER_TEMP/wasmkit-x86_64-swift-linux-musl"
          test -x "$bin_dir/wasmkit"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          version="$("$bin_dir/wasmkit" --version)"
          printf '%s\n' "$version"
          grep -Fq '0.1.6' <<< "$version"
          {
            printf 'WASMKIT_RELEASE\t0.1.6\n'
            printf 'WASMKIT_RELEASE_URL\t%s\n' "$release"
            printf 'WASMKIT_RELEASE_ARCHIVE_SHA256\t%s\n' "$expected"
            printf 'WASMKIT_RELEASE_VERSION_OUTPUT\t%s\n' "$version"
          } >> "$RUNNER_TEMP/wat-stage02-evidence/manifest.tsv"

      - name: Install WABT and record all runtime tool identities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wabt
          command -v wasmkit
          command -v wat2wasm
          {
            printf 'SWIFT_VERSION\t%s\n' "$(swift --version | tr '\n' ' ')"
            printf 'WABT_VERSION\t%s\n' "$(wat2wasm --version | tr '\n' ' ')"
            printf 'WASMKIT_PATH\t%s\n' "$(command -v wasmkit)"
            printf 'WASMKIT_SHA256\t%s\n' "$(sha256sum "$(command -v wasmkit)" | awk '{print $1}')"
            printf 'WASMKIT_VERSION_OUTPUT\t%s\n' "$(wasmkit --version 2>&1 | tr '\n' ' ' || true)"
          } >> "$RUNNER_TEMP/wat-stage02-evidence/manifest.tsv"
          wasmkit --help > "$RUNNER_TEMP/wat-stage02-evidence/wasmkit-help.txt" 2>&1
          wat2wasm tests/normative_selector.wat -o "$RUNNER_TEMP/wat-stage02-evidence/source.wasm"
          wasm-validate "$RUNNER_TEMP/wat-stage02-evidence/source.wasm"
          sha256sum "$RUNNER_TEMP/wat-stage02-evidence/source.wasm" \
            > "$RUNNER_TEMP/wat-stage02-evidence/source-wasm.sha256"

      - name: Smoke test WasmKit invocation and capture actual return-value notation
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wat-stage02-evidence"
          cat > "$evidence/smoke.wat" <<'WAT'
          (module (func (export "smoke") (result i32) i32.const 1))
          WAT
          wat2wasm "$evidence/smoke.wat" -o "$evidence/smoke.wasm"
          set +e
          timeout 30s wasmkit run "$evidence/smoke.wasm" smoke > "$evidence/smoke.stdout" 2> "$evidence/smoke.stderr"
          smoke_exit=$?
          set -e
          printf 'SMOKE_EXIT_CODE\t%s\n' "$smoke_exit" >> "$evidence/manifest.tsv"
          cat "$evidence/smoke.stdout"
          cat "$evidence/smoke.stderr" >&2
          test "$smoke_exit" -eq 0
          grep -qxE '\[(I32|i32|WasmTypes[.]Value[.]i32)\(1\)\]' "$evidence/smoke.stdout"

      - name: Independently enumerate exactly 111 parameterless i32 test exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import os
          src = pathlib.Path('tests/normative_selector.wat').read_text(encoding='utf-8')
          matches = re.findall(r'\(func\s+\(export\s+"([^"]+)"\)\s+\(result\s+i32\)', src)
          assert len(matches) == 111, f'Expected 111 functions, found {len(matches)}'
          assert len(set(matches)) == 111, 'Duplicate exported function names'
          assert all(name.startswith('test_') for name in matches), 'Unexpected export'
          initial = [
              'test_discovery01_short_at_m',
              'test_discovery01_wide_at_m_plus_one',
              'test_discovery01_wide_at_two_m',
              'test_discovery01_wide_at_three_m',
              'test_discovery01_backward_two_m_limit',
              'test_discovery01_backward_three_m_limit',
          ]
          assert all(name in matches for name in initial), 'Missing six original contract cases'
          order = initial + [name for name in matches if name not in set(initial)]
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'wat-stage02-evidence' / 'exports.txt'
          path.write_text('\n'.join(order) + '\n', encoding='utf-8')
          print(f'export_inventory=111, original_contract_cases=6, remaining_regressions=105')
          PY

      - name: Execute original contract and all regressions in WasmKit only
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wat-stage02-evidence"
          module="$evidence/source.wasm"
          printf 'export\tstatus\texit_code\n' > "$evidence/cases.tsv"
          passed=0
          failed=0
          total=0
          while IFS= read -r name; do
            total=$((total + 1))
            set +e
            timeout 30s wasmkit run "$module" "$name" > "$evidence/$name.log" 2>&1
            exit_code=$?
            set -e
            if [[ "$exit_code" -eq 0 ]] && grep -qxE '\[(I32|i32|WasmTypes[.]Value[.]i32)\(1\)\]' "$evidence/$name.log"; then
              status='PASS'
              passed=$((passed + 1))
            elif [[ "$exit_code" -eq 124 ]]; then
              status='TIMEOUT'
              failed=$((failed + 1))
            elif [[ "$exit_code" -ne 0 ]]; then
              status='RUNTIME_ERROR'
              failed=$((failed + 1))
            else
              status='UNEXPECTED_RESULT'
              failed=$((failed + 1))
            fi
            printf '%s\t%s\t%s\n' "$name" "$status" "$exit_code" >> "$evidence/cases.tsv"
            printf '%d/111 %s %s (exit=%s)\n' "$total" "$name" "$status" "$exit_code"
            if [[ "$failed" -ge 5 ]]; then
              printf 'STOP_AFTER_5_FAILURES=1\n' >> "$evidence/summary.txt"
              break
            fi
          done < "$evidence/exports.txt"
          {
            printf 'EXPECTED=111\n'
            printf 'EXECUTED=%d\n' "$total"
            printf 'PASSED=%d\n' "$passed"
            printf 'FAILED=%d\n' "$failed"
            printf 'COMPLETE=%s\n' "$([[ "$total" -eq 111 && "$failed" -eq 0 ]] && echo yes || echo no)"
          } >> "$evidence/summary.txt"
          if [[ "$total" -ne 111 || "$passed" -ne 111 || "$failed" -ne 0 ]]; then
            echo 'WasmKit Native gate NOT ACCEPTED; see cases and per-export logs.'
            exit 1
          fi
          echo 'WasmKit 111/111 completed with exact i32(1) result.'

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wat-stage02-wasmkit-exact-871f9b7-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wat-stage02-evidence/
          retention-days: 30
          if-no-files-found: warn
