name: Stage 1 Hebrew Scroll — twelve post-stirs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-scroll-stir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
      - name: Compile the Fortran component and Foundation-Day candidate probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          gfortran "${flags[@]}" -c src/big_integer.f90 -o build/big_integer.o
          gfortran "${flags[@]}" -c src/source_language_catalog.f90 -o build/source_language_catalog.o
          gfortran "${flags[@]}" -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
          gfortran "${flags[@]}" -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
          gfortran "${flags[@]}" -c test/normative_oracle_calendar.f90 -o build/normative_oracle_calendar.o
          gfortran "${flags[@]}" test/stage01_scroll_stir_probe.f90 \
            build/big_integer.o build/normative_oracle_core.o \
            -o build/stage01_scroll_stir_probe
          gfortran "${flags[@]}" test/stage01_foundation_candidate_probe.f90 \
            build/big_integer.o build/source_language_catalog.o build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o build/normative_oracle_calendar.o \
            -o build/stage01_foundation_candidate_probe
          test -x build/stage01_scroll_stir_probe
          test -x build/stage01_foundation_candidate_probe
      - name: Self-test the independent Hebrew Scroll transcription
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_stir_reference.py
          python3 test/stage01_scroll_stir_reference.py --self-test | tee build/stage01-scroll-stir-selftest.log
          grep -Fxq 'STAGE01_SCROLL_STIR_SELFTEST=17/17' build/stage01-scroll-stir-selftest.log
      - name: Compare the Fortran routine with the Hebrew Scroll oracle
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=3s 90s \
            python3 -u test/stage01_scroll_stir_reference.py \
              --fortran-exe build/stage01_scroll_stir_probe \
              --output build/stage01-scroll-stir.json \
              | tee build/stage01-scroll-stir.log
          grep -Fxq 'STAGE01_SCROLL_STIR_DIFFERENTIAL=5/5 CASES; 30/30 EXACT BOWLS' build/stage01-scroll-stir.log
          grep -Fxq 'STAGE01_SCROLL_STIR_COMPONENT_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-stir.log
      - name: Capture the corrected Foundation-Day structure (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_foundation_candidate_capture.py \
              --fortran-exe build/stage01_foundation_candidate_probe \
              --output build/stage01-foundation-candidate.json \
              | tee build/stage01-foundation-candidate.log
          grep -Fxq 'STAGE01_FOUNDATION_CANDIDATE_CAPTURE=PASS' build/stage01-foundation-candidate.log
          grep -Fxq 'STAGE01_FOUNDATION_CANDIDATE_ONLY_NOT_CANONICAL' build/stage01-foundation-candidate.log
      - name: Verify independent Hebrew Scroll day/sauce/gate oracle (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_gate_independent.py
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_scroll_gate_independent.py \
              --self-test --foundation --output build/stage01-scroll-gate-foundation.json \
              | tee build/stage01-scroll-gate-foundation.log
          grep -Fq 'STAGE01_SCROLL_GATE_SELFTEST=15/15' build/stage01-scroll-gate-foundation.log
          grep -Fxq 'STAGE01_SCROLL_FOUNDATION_YEAR5000_DIAGNOSTIC=PASS' build/stage01-scroll-gate-foundation.log
          grep -Fxq 'STAGE01_SCROLL_GATE_COMPONENT_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-gate-foundation.log
      - name: Verify independent Hebrew Scroll cutlets seals 20/21/22 (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_cutlets_independent.py
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_scroll_cutlets_independent.py \
              --self-test --foundation --output build/stage01-scroll-cutlets-foundation.json \
              | tee build/stage01-scroll-cutlets-foundation.log
          grep -Fxq 'STAGE01_SCROLL_CUTLETS_SELFTEST=2168/2168' build/stage01-scroll-cutlets-foundation.log
          grep -Fxq 'STAGE01_SCROLL_CUTLETS_FOUNDATION_DIAGNOSTIC=PASS' build/stage01-scroll-cutlets-foundation.log
          grep -Fxq 'STAGE01_SCROLL_CUTLETS_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-cutlets-foundation.log
      - name: Verify Hebrew Scroll month count and lexicographic books seals 30/31 (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_months_independent.py
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_scroll_months_independent.py \
              --self-test --foundation --output build/stage01-scroll-months-foundation.json \
              | tee build/stage01-scroll-months-foundation.log
          grep -Fxq 'STAGE01_SCROLL_MONTHS_SELFTEST=1010/1010' build/stage01-scroll-months-foundation.log
          grep -Fxq 'STAGE01_SCROLL_MONTHS_FOUNDATION_DIAGNOSTIC=PASS' build/stage01-scroll-months-foundation.log
          grep -Fxq 'STAGE01_SCROLL_MONTHS_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-months-foundation.log
      - name: Preserve canonical component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortran-stage01-canonical-scroll-stir
          path: |
            build/stage01-scroll-stir-selftest.log
            build/stage01-scroll-stir.log
            build/stage01-scroll-stir.json
            build/stage01-foundation-candidate.log
            build/stage01-foundation-candidate.json
            build/stage01-scroll-gate-foundation.log
            build/stage01-scroll-gate-foundation.json
            build/stage01-scroll-cutlets-foundation.log
            build/stage01-scroll-cutlets-foundation.json
            build/stage01-scroll-months-foundation.log
            build/stage01-scroll-months-foundation.json
          if-no-files-found: warn
          retention-days: 30
