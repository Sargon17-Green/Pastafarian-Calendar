name: Stage 1 Hebrew Scroll — twelve post-stirs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-scroll-stir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
      - name: Compile the Fortran component and Foundation-Day candidate probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          gfortran "${flags[@]}" -c src/big_integer.f90 -o build/big_integer.o
          gfortran "${flags[@]}" -c src/source_language_catalog.f90 -o build/source_language_catalog.o
          gfortran "${flags[@]}" -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
          gfortran "${flags[@]}" -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
          gfortran "${flags[@]}" -c test/normative_oracle_calendar.f90 -o build/normative_oracle_calendar.o
          gfortran "${flags[@]}" test/stage01_scroll_stir_probe.f90 \
            build/big_integer.o build/normative_oracle_core.o \
            -o build/stage01_scroll_stir_probe
          gfortran "${flags[@]}" test/stage01_foundation_candidate_probe.f90 \
            build/big_integer.o build/source_language_catalog.o build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o build/normative_oracle_calendar.o \
            -o build/stage01_foundation_candidate_probe
          test -x build/stage01_scroll_stir_probe
          test -x build/stage01_foundation_candidate_probe
      - name: Self-test the independent Hebrew Scroll transcription
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_stir_reference.py
          python3 test/stage01_scroll_stir_reference.py --self-test | tee build/stage01-scroll-stir-selftest.log
          grep -Fxq 'STAGE01_SCROLL_STIR_SELFTEST=17/17' build/stage01-scroll-stir-selftest.log
      - name: Compare the Fortran routine with the Hebrew Scroll oracle
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=3s 90s \
            python3 -u test/stage01_scroll_stir_reference.py \
              --fortran-exe build/stage01_scroll_stir_probe \
              --output build/stage01-scroll-stir.json \
              | tee build/stage01-scroll-stir.log
          grep -Fxq 'STAGE01_SCROLL_STIR_DIFFERENTIAL=5/5 CASES; 30/30 EXACT BOWLS' build/stage01-scroll-stir.log
          grep -Fxq 'STAGE01_SCROLL_STIR_COMPONENT_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-stir.log
      - name: Capture the corrected Foundation-Day structure (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_foundation_candidate_capture.py \
              --fortran-exe build/stage01_foundation_candidate_probe \
              --output build/stage01-foundation-candidate.json \
              | tee build/stage01-foundation-candidate.log
          grep -Fxq 'STAGE01_FOUNDATION_CANDIDATE_CAPTURE=PASS' build/stage01-foundation-candidate.log
          grep -Fxq 'STAGE01_FOUNDATION_CANDIDATE_ONLY_NOT_CANONICAL' build/stage01-foundation-candidate.log
      - name: Verify independent Hebrew Scroll day/sauce/gate oracle (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_gate_independent.py
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_scroll_gate_independent.py \
              --self-test --foundation --output build/stage01-scroll-gate-foundation.json \
              | tee build/stage01-scroll-gate-foundation.log
          grep -Fq 'STAGE01_SCROLL_GATE_SELFTEST=20/20' build/stage01-scroll-gate-foundation.log
          grep -Fxq 'STAGE01_SCROLL_FOUNDATION_YEAR5000_DIAGNOSTIC=PASS' build/stage01-scroll-gate-foundation.log
          grep -Fxq 'STAGE01_SCROLL_GATE_COMPONENT_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-gate-foundation.log
      - name: Verify independent Hebrew Scroll cutlets seals 20/21/22 (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_cutlets_independent.py
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_scroll_cutlets_independent.py \
              --self-test --foundation --output build/stage01-scroll-cutlets-foundation.json \
              | tee build/stage01-scroll-cutlets-foundation.log
          grep -Fxq 'STAGE01_SCROLL_CUTLETS_SELFTEST=2168/2168' build/stage01-scroll-cutlets-foundation.log
          grep -Fxq 'STAGE01_SCROLL_CUTLETS_FOUNDATION_DIAGNOSTIC=PASS' build/stage01-scroll-cutlets-foundation.log
          grep -Fxq 'STAGE01_SCROLL_CUTLETS_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-cutlets-foundation.log
      - name: Verify Hebrew Scroll month count and lexicographic books seals 30/31 (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_months_independent.py
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_scroll_months_independent.py \
              --self-test --foundation --output build/stage01-scroll-months-foundation.json \
              | tee build/stage01-scroll-months-foundation.log
          grep -Fxq 'STAGE01_SCROLL_MONTHS_SELFTEST=1010/1010' build/stage01-scroll-months-foundation.log
          grep -Fxq 'STAGE01_SCROLL_MONTHS_FOUNDATION_DIAGNOSTIC=PASS' build/stage01-scroll-months-foundation.log
          grep -Fxq 'STAGE01_SCROLL_MONTHS_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-months-foundation.log
      - name: Verify Hebrew Scroll 47 canonical month names seal 33 (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_month_names_independent.py
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_scroll_month_names_independent.py \
              --self-test --foundation --output build/stage01-scroll-month-names-foundation.json \
              | tee build/stage01-scroll-month-names-foundation.log
          grep -Fxq 'STAGE01_SCROLL_MONTH_NAMES_SELFTEST=2458/2458' build/stage01-scroll-month-names-foundation.log
          grep -Fxq 'STAGE01_SCROLL_MONTH_NAMES_FOUNDATION_DIAGNOSTIC=PASS' build/stage01-scroll-month-names-foundation.log
          grep -Fxq 'STAGE01_SCROLL_MONTH_NAMES_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-month-names-foundation.log
      - name: Independently prove seal32 small weaving count and lexicographic unrank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_weaving_small_oracle.py
          timeout --signal=TERM --kill-after=5s 60s \
            python3 -u test/stage01_scroll_weaving_small_oracle.py --self-test \
            | tee build/stage01-scroll-weaving-small.log
          grep -Fxq 'STAGE01_SCROLL_WEAVING_SMALL_SHAPES=115' build/stage01-scroll-weaving-small.log
          grep -Fxq 'STAGE01_SCROLL_WEAVING_SMALL_RANKS=1408' build/stage01-scroll-weaving-small.log
          grep -Fxq 'STAGE01_SCROLL_WEAVING_SMALL_ASSERTIONS=3492' build/stage01-scroll-weaving-small.log
          grep -Fxq 'STAGE01_SCROLL_WEAVING_SMALL_BRUTE_DIFFERENTIAL=PASS' build/stage01-scroll-weaving-small.log
          grep -Fxq 'STAGE01_SCROLL_WEAVING_SMALL_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-weaving-small.log
      - name: Exact independent Scroll gate, year, cutlet and month differential
        shell: bash
        run: |
          set -euo pipefail
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          gfortran "${flags[@]}" test/stage01_scroll_gate_diff_probe.f90 \
            build/big_integer.o build/source_language_catalog.o build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o build/normative_oracle_calendar.o \
            -o build/stage01_scroll_gate_diff_probe
          python3 -m py_compile test/stage01_scroll_component_diff.py
          (ulimit -v 1048576; timeout --signal=TERM --kill-after=5s 180s \
            python3 -u test/stage01_scroll_component_diff.py \
              --gate-exe build/stage01_scroll_gate_diff_probe \
              --candidate build/stage01-foundation-candidate.json \
              --output build/stage01-scroll-component-diff.json) \
            | tee build/stage01-scroll-component-diff.log
          grep -Fxq 'STAGE01_SCROLL_COMPONENT_EXACT_DIFF=37/37' build/stage01-scroll-component-diff.log
      - name: Exact independent Seal32 conditional suffix (fixed opening prefix only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_weaving_suffix_oracle.py
          (ulimit -v 1048576; timeout --signal=TERM --kill-after=5s 60s \
            python3 -u test/stage01_scroll_weaving_suffix_oracle.py \
              --self-test --foundation-json build/stage01-scroll-months-foundation.json \
              --output build/stage01-scroll-weaving-suffix.json) \
            | tee build/stage01-scroll-weaving-suffix.log
          grep -Fxq 'SEAL32_SUFFIX_SELFTEST=304 SHAPES; 4770 RANKS' build/stage01-scroll-weaving-suffix.log
          grep -Fxq 'SEAL32_FIXED_PREFIX_44_MONTHS_4399_DAYS=PASS_CONDITIONAL_ONLY' build/stage01-scroll-weaving-suffix.log
          sha256sum build/stage01-scroll-weaving-suffix.json | tee build/stage01-scroll-weaving-suffix.sha256
      - name: Preserve canonical component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortran-stage01-canonical-scroll-stir
          path: |
            build/stage01-scroll-stir-selftest.log
            build/stage01-scroll-stir.log
            build/stage01-scroll-stir.json
            build/stage01-foundation-candidate.log
            build/stage01-foundation-candidate.json
            build/stage01-scroll-gate-foundation.log
            build/stage01-scroll-gate-foundation.json
            build/stage01-scroll-cutlets-foundation.log
            build/stage01-scroll-cutlets-foundation.json
            build/stage01-scroll-months-foundation.log
            build/stage01-scroll-months-foundation.json
            build/stage01-scroll-month-names-foundation.log
            build/stage01-scroll-month-names-foundation.json
            build/stage01-scroll-weaving-small.log
            build/stage01-scroll-component-diff.json
            build/stage01-scroll-component-diff.log
            build/stage01-scroll-weaving-suffix.json
            build/stage01-scroll-weaving-suffix.log
            build/stage01-scroll-weaving-suffix.sha256
          if-no-files-found: warn
          retention-days: 30

  scroll-full-date-context-diff:
    name: Independent Hebrew Scroll full-date differential (28 cases — boundary, wide, legacy pairs)
    needs: canonical-scroll-stir
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
      - name: Verify exact Scroll source pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          expected = "7b834f4a444e021bb65164282b851af960a6dbc0be3d458c2412181773b9db7b"
          paths = (
              "test/STAGE01_CANONICAL_SCROLL_AUDIT.md",
              "test/stage01_scroll_gate_independent.py",
              "test/stage01_scroll_cutlets_independent.py",
              "test/stage01_scroll_months_independent.py",
              "test/stage01_scroll_month_names_independent.py",
              "test/stage01_scroll_weaving_endpoint_dp.py",
              "test/stage01_scroll_weaving_reverse_endpoint.py",
              "test/stage01_scroll_stir_reference.py",
              "test/stage01_scroll_full_date_diff.py",
          )
          for name in paths:
              data = Path(name).read_text(encoding="utf-8")
              values = re.findall(r"7b834f4a444e021bb65164282b851af960a6dbc0be3d458c2412181773b9db7b?", data)
              if not values or any(value != expected for value in values):
                  raise SystemExit("invalid Scroll SHA pin in " + name)
          print("STAGE01_SCROLL_SOURCE_SHA256_PINS=9/9 (literal pins; raw source bytes verified separately)")
          PY
      - name: Compile original normative date probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          gfortran "${flags[@]}" -c src/big_integer.f90 -o build/big_integer.o
          gfortran "${flags[@]}" -c src/source_language_catalog.f90 -o build/source_language_catalog.o
          gfortran "${flags[@]}" -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
          gfortran "${flags[@]}" -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
          gfortran "${flags[@]}" -c test/normative_oracle_calendar.f90 -o build/normative_oracle_calendar.o
          gfortran "${flags[@]}" test/stage01_scroll_full_date_probe.f90 \
            build/big_integer.o build/source_language_catalog.o build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o build/normative_oracle_calendar.o \
            -o build/stage01_scroll_full_date_probe
          test -x build/stage01_scroll_full_date_probe
      - name: Self-test independent Scroll full-date oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_full_date_diff.py
          python3 -u test/stage01_scroll_full_date_diff.py --self-test | tee build/stage01-scroll-full-date-selftest.log
          grep -Eq '^STAGE01_SCROLL_FULL_DATE_ORACLE_SELFTEST=[0-9]+/[0-9]+$' build/stage01-scroll-full-date-selftest.log
      - name: Differential wide calculation contexts (including ±8192 and year crossings)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 1048576; /usr/bin/time -f 'ELAPSED_SECONDS=%e MAXRSS_KIB=%M EXIT=%x' -o build/stage01-scroll-full-date-resource.log \
            timeout --signal=TERM --kill-after=5s 700s python3 -u test/stage01_scroll_full_date_diff.py \
              --fortran-exe build/stage01_scroll_full_date_probe \
              --suite wide \
              --output build/stage01-scroll-full-date-wide.json \
              --max-seconds 180 --max-states 150000 --fortran-timeout 120) \
            > build/stage01-scroll-full-date.log 2>&1
          rc=$?
          set -e
          cat build/stage01-scroll-full-date.log
          echo "STAGE01_SCROLL_FULL_DATE_EXIT=$rc TIME_LIMIT=700 MEMORY_KIB=1048576"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -Fxq 'STAGE01_SCROLL_FULL_DATE_DIFFERENTIAL=9/9 CASES; 45/45 EXACT FIELDS' build/stage01-scroll-full-date.log
          grep -Fxq 'STAGE01_SCROLL_FULL_DATE_QA_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-full-date.log
      - name: Differential boundary contexts (year edges and one-day neighbors)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 1048576; /usr/bin/time -f 'ELAPSED_SECONDS=%e MAXRSS_KIB=%M EXIT=%x' -o build/stage01-scroll-full-date-boundary-resource.log \
            timeout --signal=TERM --kill-after=5s 700s python3 -u test/stage01_scroll_full_date_diff.py \
              --fortran-exe build/stage01_scroll_full_date_probe \
              --suite boundary \
              --output build/stage01-scroll-full-date-boundary.json \
              --max-seconds 180 --max-states 150000 --fortran-timeout 120) \
            > build/stage01-scroll-full-date-boundary.log 2>&1
          rc=$?
          set -e
          cat build/stage01-scroll-full-date-boundary.log
          echo "STAGE01_SCROLL_FULL_DATE_BOUNDARY_EXIT=$rc TIME_LIMIT=700 MEMORY_KIB=1048576"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -Fxq 'STAGE01_SCROLL_FULL_DATE_DIFFERENTIAL=9/9 CASES; 45/45 EXACT FIELDS' build/stage01-scroll-full-date-boundary.log

      - name: Differential exact legacy normative and expanded target pairs at calculation offset zero
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 1048576; /usr/bin/time -f 'ELAPSED_SECONDS=%e MAXRSS_KIB=%M EXIT=%x' -o build/stage01-scroll-full-date-legacy-resource.log \
            timeout --signal=TERM --kill-after=5s 700s python3 -u test/stage01_scroll_full_date_diff.py \
              --fortran-exe build/stage01_scroll_full_date_probe \
              --suite legacy-offset-zero \
              --output build/stage01-scroll-full-date-legacy-offset-zero.json \
              --max-seconds 180 --max-states 150000 --fortran-timeout 120) \
            > build/stage01-scroll-full-date-legacy-offset-zero.log 2>&1
          rc=$?
          set -e
          cat build/stage01-scroll-full-date-legacy-offset-zero.log
          echo "STAGE01_SCROLL_FULL_DATE_LEGACY_EXIT=$rc TIME_LIMIT=700 MEMORY_KIB=1048576"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -Fxq 'STAGE01_SCROLL_FULL_DATE_DIFFERENTIAL=10/10 CASES; 50/50 EXACT FIELDS' build/stage01-scroll-full-date-legacy-offset-zero.log
          grep -Fxq 'STAGE01_SCROLL_FULL_DATE_QA_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-full-date-legacy-offset-zero.log

      - name: Preserve independent full-date evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortran-stage01-scroll-full-date-boundary-and-wide-diff
          path: |
            build/stage01-scroll-full-date-selftest.log
            build/stage01-scroll-full-date-resource.log
            build/stage01-scroll-full-date.log
            build/stage01-scroll-full-date-wide.json
            build/stage01-scroll-full-date-boundary-resource.log
            build/stage01-scroll-full-date-boundary.log
            build/stage01-scroll-full-date-boundary.json
            build/stage01-scroll-full-date-legacy-resource.log
            build/stage01-scroll-full-date-legacy-offset-zero.log
            build/stage01-scroll-full-date-legacy-offset-zero.json
          if-no-files-found: warn
          retention-days: 30



  scroll-cache-sequence-diff:
    name: Independent Hebrew Scroll same-process cache sequence differential (48 calls; two 24-call processes)
    needs: scroll-full-date-context-diff
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
      - name: Download same-run independent full-date oracle results
        uses: actions/download-artifact@v4
        with:
          name: fortran-stage01-scroll-full-date-boundary-and-wide-diff
          path: build/full-date-oracle
      - name: Compile sequence probe against normative oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flags=(-std=f2018 -Wall -Wextra -fcheck=all -ffree-line-length-none -J build -I build)
          gfortran "${flags[@]}" -c src/big_integer.f90 -o build/big_integer.o
          gfortran "${flags[@]}" -c src/source_language_catalog.f90 -o build/source_language_catalog.o
          gfortran "${flags[@]}" -c src/bootstrap_infrastructure.f90 -o build/bootstrap_infrastructure.o
          gfortran "${flags[@]}" -c test/normative_oracle_core.f90 -o build/normative_oracle_core.o
          gfortran "${flags[@]}" -c test/normative_oracle_calendar.f90 -o build/normative_oracle_calendar.o
          gfortran "${flags[@]}" test/stage01_scroll_cache_sequence_probe.f90 \
            build/big_integer.o build/source_language_catalog.o build/bootstrap_infrastructure.o \
            build/normative_oracle_core.o build/normative_oracle_calendar.o \
            -o build/stage01_scroll_cache_sequence_probe
          test -x build/stage01_scroll_cache_sequence_probe
      - name: Self-test cache sequence definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile test/stage01_scroll_cache_sequence_diff.py
          python3 -u test/stage01_scroll_cache_sequence_diff.py --self-test | tee build/stage01-scroll-cache-sequence-selftest.log
          grep -Fxq 'STAGE01_SCROLL_CACHE_SEQUENCE_SELFTEST=10/10' build/stage01-scroll-cache-sequence-selftest.log
      - name: Compare warm-cache and reset-before-each sequences
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (ulimit -v 1048576; /usr/bin/time -f 'ELAPSED_SECONDS=%e MAXRSS_KIB=%M EXIT=%x' -o build/stage01-scroll-cache-sequence-resource.log \
            timeout --signal=TERM --kill-after=5s 1700s python3 -u test/stage01_scroll_cache_sequence_diff.py \
              --sequence-exe build/stage01_scroll_cache_sequence_probe \
              --output build/stage01-scroll-cache-sequences.json \
              --log-dir build \
              --oracle-json build/full-date-oracle/stage01-scroll-full-date-wide.json \
              --oracle-json build/full-date-oracle/stage01-scroll-full-date-boundary.json \
              --oracle-json build/full-date-oracle/stage01-scroll-full-date-legacy-offset-zero.json \
              --source-commit "$GITHUB_SHA" \
              --max-seconds 180 --max-states 150000 --fortran-timeout 800) \
            > build/stage01-scroll-cache-sequence.log 2>&1
          rc=$?
          set -e
          cat build/stage01-scroll-cache-sequence.log
          echo "STAGE01_SCROLL_CACHE_SEQUENCE_EXIT=$rc TIME_LIMIT=1700 MEMORY_KIB=1048576"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -Fxq 'STAGE01_SCROLL_CACHE_SEQUENCE_DIFFERENTIAL=2/2 MODES; 48/48 CALLS; 240/240 EXACT FIELDS' build/stage01-scroll-cache-sequence.log
          grep -Fxq 'STAGE01_SCROLL_CACHE_SEQUENCE_QA_ONLY_NOT_FULL_STAGE1_ACCEPTANCE' build/stage01-scroll-cache-sequence.log
      - name: Preserve same-process cache sequence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortran-stage01-scroll-cache-sequence-diff
          path: |
            build/stage01-scroll-cache-sequence-selftest.log
            build/stage01-scroll-cache-sequence-resource.log
            build/stage01-scroll-cache-sequence.log
            build/stage01-scroll-cache-sequence-warm.log
            build/stage01-scroll-cache-sequence-reset-each.log
            build/stage01-scroll-cache-sequences.json
          if-no-files-found: warn
          retention-days: 30

