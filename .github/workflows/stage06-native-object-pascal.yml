name: Stage 6 Native Object Pascal - intentional distance scale RED
on:
  push:
    branches:
      - 'Object-Pascal\+Português'
    paths:
      - 'src/**'
      - 'test/stage06_distance_probe.pas'
      - 'test/build_and_run_stage06_distance.sh'
      - 'docs/stage06_distance_tag_scale_oracle.py'
      - '.github/workflows/stage06-native-object-pascal.yml'
permissions:
  contents: read
jobs:
  stage06-native-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FPC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fp-compiler
      - name: Verify intentional RED against independent oracle
        run: bash test/build_and_run_stage06_distance.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage06-distance-evidence
          path: |
            evidence/stage06-*
            build/stage06/vectors.tsv
          if-no-files-found: warn
          retention-days: 30
