name: MATLAB Stage55 Twelfth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_twelfth_native.m'
      - 'tools/stage55_after12_interval_five_fields.py'
      - '.github/workflows/matlab-stage55-twelfth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-twelfth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  twelfth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER11 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-eleventh-day-differential
          run-id: 41210864467
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER11
        run: |
          echo 'e506397ddbd7bb170282db681689af626d6a72eef7a0de255a4bf839fedb65cc  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_11.json' | sha256sum -c -
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native twelfth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_twelfth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after12_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_11.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_12.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_TWELFTH_PYTHON.log
          grep '^STAGE55_TWELFTH_ROW ' logs/STAGE55_TWELFTH_PYTHON.log > logs/STAGE55_TWELFTH_PYTHON_ROW.txt
          grep '^STAGE55_TWELFTH_ROW ' logs/STAGE55_TWELFTH_NATIVE.log > logs/STAGE55_TWELFTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_TWELFTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_TWELFTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_TWELFTH_PYTHON_ROW.txt logs/STAGE55_TWELFTH_NATIVE_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_12.json | tee logs/STAGE55_TWELFTH_DIGEST.txt
          echo 'STAGE55_TWELFTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-twelfth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_11.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_12.json
            logs/STAGE55_TWELFTH_NATIVE.log
            logs/STAGE55_TWELFTH_PYTHON.log
            logs/STAGE55_TWELFTH_PYTHON_ROW.txt
            logs/STAGE55_TWELFTH_NATIVE_ROW.txt
            logs/STAGE55_TWELFTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
