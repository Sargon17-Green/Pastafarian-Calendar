name: MATLAB Stage55 Forty-First Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_forty_first_native.m'
      - 'tools/stage55_after41_interval_five_fields.py'
      - 'tools/stage55_after4_interval_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-forty-first-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-forty-first-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  forty-first-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER40 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-fortieth-day-differential
          run-id: 43825175667
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER40
        run: |
          echo 'a649be4cd10ea3d756b22f80b97bd03fa8949cb65129ddd5bcdf0ba927fc6c37  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_40.json' | sha256sum -c -
      - name: Preflight AFTER41 independent witness wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after41_interval_five_fields.py
          grep -Fqx 'PIN = "a649be4cd10ea3d756b22f80b97bd03fa8949cb65129ddd5bcdf0ba927fc6c37"' tools/stage55_after41_interval_five_fields.py
          python3 -m py_compile tools/stage55_after41_interval_five_fields.py
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native forty-first-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_forty_first_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after41_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_40.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_41.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_FORTY_FIRST_PYTHON.log
          grep '^STAGE55_FORTY_FIRST_ROW ' logs/STAGE55_FORTY_FIRST_PYTHON.log > logs/STAGE55_FORTY_FIRST_PYTHON_ROW.txt
          grep '^STAGE55_FORTY_FIRST_ROW ' logs/STAGE55_FORTY_FIRST_NATIVE.log > logs/STAGE55_FORTY_FIRST_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_FORTY_FIRST_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_FORTY_FIRST_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_FORTY_FIRST_PYTHON_ROW.txt logs/STAGE55_FORTY_FIRST_NATIVE_ROW.txt
          expected="STAGE55_FORTY_FIRST_ROW POSITION=41 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=41 MONTH_INDEX=32 MONTH_DAY=1"
          grep -Fqx "$expected" logs/STAGE55_FORTY_FIRST_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_FORTY_FIRST_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_41.json | tee logs/STAGE55_FORTY_FIRST_DIGEST.txt
          echo 'STAGE55_FORTY_FIRST_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-forty-first-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_40.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_41.json
            logs/STAGE55_FORTY_FIRST_NATIVE.log
            logs/STAGE55_FORTY_FIRST_PYTHON.log
            logs/STAGE55_FORTY_FIRST_PYTHON_ROW.txt
            logs/STAGE55_FORTY_FIRST_NATIVE_ROW.txt
            logs/STAGE55_FORTY_FIRST_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
