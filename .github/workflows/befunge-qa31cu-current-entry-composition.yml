name: Befunge QA31CU active-entry composition
on:
  push:
    branches: [qa-befunge98-stage1-order-isolation-20261008]
    paths:
      - '.github/workflows/befunge-qa31cu-current-entry-composition.yml'
      - 'qa/qa31cw_alternating_zero_sham_native.py'
      - 'qa/qa31cu_current_entry_composition.py'
      - 'qa/QA31CU_CURRENT_ENTRY_COMPOSITION_2026-11-26.md'
      - 'qa/qa31cv_late_digit_gate_native.py'
      - 'qa/QA31CV_LATE_DIGIT_GATE_CAUSAL_NATIVE_CONTRACT_2026-11-26.md'
      - 'qa/stage1_native_diverse_geometry.py'
      - 'qa/qa31ch_results.json'
      - 'qa/qa31cj_results.json'
      - 'qa/qa31ck_results.json'
      - 'qa/qa31cl_results.json'
      - 'qa/qa31cm_results.json'
      - 'qa/signed_increment_gate.patch'
      - 'src/interleaved_work_counts.b98'
      - 'src/work_counts.b98'
      - 'reference/work_counts.b98'
      - 'reference/save.b98'
permissions:
  contents: read
  actions: read
jobs:
  compose-current-entry:
    if: ${{ !contains(github.event.head_commit.message, '[qa31cw-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Retrieve exact completed Native evidence and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="Sargon17-Green/Pastafarian-Calendar"
          out="$RUNNER_TEMP/qa31cu"
          mkdir -p "$out/meta" "$out/qa31cp" "$out/qa31ct"
          for id in 45635056768 45699183636 45699183338; do
            gh api "repos/$repo/actions/runs/$id" > "$out/meta/${id}_run.json"
            gh api --paginate --slurp "repos/$repo/actions/runs/$id/jobs?filter=latest&per_page=100" > "$out/meta/${id}_jobs_pages.json"
            gh api --paginate --slurp "repos/$repo/actions/runs/$id/artifacts?per_page=100" > "$out/meta/${id}_artifacts_pages.json"
            for kind in jobs artifacts; do
              jq -e --arg kind "$kind" '
                . as $pages |
                ($pages | map(.[$kind]) | add) as $rows |
                if ($pages | length) > 0 and
                   ($pages | all(.total_count == $pages[0].total_count)) and
                   ($rows | length) == $pages[0].total_count and
                   ($rows | map(.id) | unique | length) == ($rows | length)
                then {total_count: $pages[0].total_count, ($kind): $rows}
                else error("incomplete or inconsistent pagination") end
              ' "$out/meta/${id}_${kind}_pages.json" > "$out/meta/${id}_${kind}.json"
              jq -c --arg kind "$kind" '{total_count, observed: (.[$kind] | length)}' "$out/meta/${id}_${kind}.json"
            done
          done
          cp "$out/meta/45635056768_run.json" "$out/meta/cp_run.json"
          cp "$out/meta/45635056768_jobs.json" "$out/meta/cp_jobs.json"
          cp "$out/meta/45635056768_artifacts.json" "$out/meta/cp_artifacts.json"
          cp "$out/meta/45699183636_run.json" "$out/meta/ct_run.json"
          cp "$out/meta/45699183636_jobs.json" "$out/meta/ct_jobs.json"
          cp "$out/meta/45699183636_artifacts.json" "$out/meta/ct_artifacts.json"
          cp "$out/meta/45699183338_run.json" "$out/meta/regression_run.json"
          cp "$out/meta/45699183338_jobs.json" "$out/meta/regression_jobs.json"
          cp "$out/meta/45699183338_artifacts.json" "$out/meta/regression_artifacts.json"
          gh run download 45635056768 --repo "$repo" --name "befunge-digit-dependent-gate" --dir "$out/qa31cp"
          gh run download 45699183636 --repo "$repo" --name "befunge-qa31ct-semantic-domain-native" --dir "$out/qa31ct"
      - name: Compose source, proof, and Native receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qa/qa31cu_current_entry_composition.py
          python3 qa/qa31cu_current_entry_composition.py \
            --evidence-root "$RUNNER_TEMP/qa31cu" \
            --output "$RUNNER_TEMP/qa31cu/qa31cu_composition.json"
      - name: Retain composition receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: befunge-qa31cu-current-entry-composition
          path: |
            ${{ runner.temp }}/qa31cu/qa31cu_composition.json
            ${{ runner.temp }}/qa31cu/meta/
          retention-days: 30

  native-late-digit-gate:
    # Metadata-only repair has no new Native hypothesis; preserve accepted QA31CV.
    if: ${{ !contains(github.event.head_commit.message, '[qa31cu-meta-only]') && !contains(github.event.head_commit.message, '[qa31cw-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Execute later-iteration signed gate interventions in Native PyFunge
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qa31cv"
          mkdir -p "$out/results"
          curl -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$out/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $out/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
          docker run --rm -e PYFUNGE_NO_PSYCO=1 -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$out/results:/results" \
            -v "$out/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              timeout --kill-after=5s 220s python -u qa/qa31cv_late_digit_gate_native.py src/work_counts.b98 /results/qa31cv_late_digit_gate.json
            '
          python3 -m json.tool "$out/results/qa31cv_late_digit_gate.json" >/dev/null
      - name: Retain later-iteration causal Native traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: befunge-qa31cv-late-digit-gate-native
          path: ${{ runner.temp }}/qa31cv/results/
          retention-days: 30

  native-alternating-zero-sham:
    if: ${{ contains(github.event.head_commit.message, '[qa31cw-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Execute independent bounded QA31CW Native corpus
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qa31cw"
          mkdir -p "$out/results"
          curl --max-time 60 -fsSL 'https://files.pythonhosted.org/packages/source/P/PyFunge/PyFunge-0.5-rc2.tar.gz' -o "$out/PyFunge-0.5-rc2.tar.gz"
          echo "e72d8beec82082134a752c9e23f131092bf1fe9e0f39d2c20c9de25bfbcfd4ac  $out/PyFunge-0.5-rc2.tar.gz" | sha256sum -c -
          git rev-parse HEAD > "$out/results/head_sha.txt"
          set +e
          timeout --kill-after=10s 1200s docker run --rm --memory=1g --cpus=1 -e PYFUNGE_NO_PSYCO=1 -e QA_HEAD_SHA="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/work:ro" -v "$out/results:/results" \
            -v "$out/PyFunge-0.5-rc2.tar.gz:/tmp/PyFunge-0.5-rc2.tar.gz:ro" \
            -w /work python:2.7-slim sh -ceu '
              pip install --no-cache-dir /tmp/PyFunge-0.5-rc2.tar.gz >/dev/null
              python -c "compile(open(\"qa/qa31cw_alternating_zero_sham_native.py\").read(), \"qa31cw\", \"exec\")"
              python -u qa/qa31cw_alternating_zero_sham_native.py src/work_counts.b98 /results /tmp/PyFunge-0.5-rc2.tar.gz
            ' 2>&1 | tee "$out/results/native.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$out/results/exit_code.txt"
          (cd "$out/results" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          test "$rc" -eq 0
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="PASS" and r["head_sha"]==sys.argv[2]' "$out/results/qa31cw_receipt.json" "$GITHUB_SHA"
      - name: Retain QA31CW raw receipts, logs and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: befunge-qa31cw-alternating-zero-sham-native
          path: ${{ runner.temp }}/qa31cw/results/
          retention-days: 30
