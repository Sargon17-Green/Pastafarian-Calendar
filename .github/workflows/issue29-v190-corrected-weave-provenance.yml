name: Issue29 v190 byte-exact production GMP correction provenance NO F
on:
  push:
    branches:
      - qa/issue29-corrected-weave-provenance-v190
    paths:
      - '.github/workflows/issue29-v190-corrected-weave-provenance.yml'
permissions:
  contents: read
concurrency:
  group: issue29-v190-byte-provenance-only
  cancel-in-progress: false
jobs:
  static-source-provenance:
    if: >-
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/qa/issue29-corrected-weave-provenance-v190'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read-only checkout, complete git provenance; no F
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source preservation and six negative mutation gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          timeout -k 5s 60s python3 -B qa/issue29/v190_corrected_weave_provenance.py > evidence/result.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('evidence/result.json').read_bytes())
          assert x['status']=='PASS_SOURCE_ONLY_PROVENANCE_GMP_CALL_CHAIN'
          assert x['provenance']['byte_identical_outside_weave_and_three_imports']
          assert x['negative_source_mutations_rejected']==6
          assert x['original_F_calls']==x['native_calendar_calls']==x['original_soak_years']==0
          print('V190_EXACT_SOURCE_PATCH_PROVENANCE_PASS_6_MUTANTS_ZERO_F')
          PY
          git rev-parse HEAD > evidence/HEAD.txt
          git diff --name-only 1160096aa847c54cbef27c232771ce1549d7ba8f...HEAD > evidence/changed-paths.txt
          sha256sum qa/issue29/v190_corrected_weave_provenance.py qa/issue29/V190_PRODUCTION_WEAVE_PROVENANCE.md > evidence/qa-source-sha256.txt
      - name: Hash QA output even if source check fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('evidence')
          m={f.name:{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in sorted(p.iterdir()) if f.is_file() and f.name!='members.sha256.json'}
          (p/'members.sha256.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload immutable source provenance (zero calendar F)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-v190-byte-exact-source-gmp-path-no-F
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
