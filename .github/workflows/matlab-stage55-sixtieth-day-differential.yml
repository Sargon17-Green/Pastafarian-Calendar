name: MATLAB Stage55 Sixtieth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_sixtieth_native.m'
      - 'tools/stage55_after60_suffix_distance_witness.py'
      - 'tests/fixtures/stage55_year5000_appendix_a_metadata.json'
      - '.github/workflows/matlab-stage55-sixtieth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-sixtieth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  sixtieth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER59 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-fifty-ninth-day-differential
          run-id: 44954276169
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER59
        run: |
          echo 'edebae6ae6a9d9300df42e2a461cd36f69e233bb8d058b8f4e4d182be8c8d754  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_59.json' | sha256sum -c -
          test "$(git rev-parse HEAD:tests/fixtures/stage55_year5000_appendix_a_metadata.json)" = "a1383b111a88203b0d652b8f0a0e9af1a8b75f25"
      - name: Preflight AFTER60 independent suffix-distance witness
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/stage55_after60_suffix_distance_witness.py
          grep -Fqx 'PARENT_SHA256 = "edebae6ae6a9d9300df42e2a461cd36f69e233bb8d058b8f4e4d182be8c8d754"' tools/stage55_after60_suffix_distance_witness.py
          python3 -m py_compile tools/stage55_after60_suffix_distance_witness.py
          python3 tools/stage55_after60_suffix_distance_witness.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_59.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            --report logs/STAGE55_AFTER60_PREFLIGHT.json \
            | tee logs/STAGE55_AFTER60_PREFLIGHT.log
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native sixtieth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_sixtieth_native
      - name: Python independent child intervals and strict five-field differential
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after60_suffix_distance_witness.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_59.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            --after60 logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_60.json \
            --report logs/STAGE55_AFTER60_CERTIFICATION.json \
            | tee logs/STAGE55_SIXTIETH_PYTHON.log
          grep '^STAGE55_SIXTIETH_ROW ' logs/STAGE55_SIXTIETH_PYTHON.log > logs/STAGE55_SIXTIETH_PYTHON_ROW.txt
          grep '^STAGE55_SIXTIETH_ROW ' logs/STAGE55_SIXTIETH_NATIVE.log > logs/STAGE55_SIXTIETH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_SIXTIETH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_SIXTIETH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_SIXTIETH_PYTHON_ROW.txt logs/STAGE55_SIXTIETH_NATIVE_ROW.txt
          expected="STAGE55_SIXTIETH_ROW POSITION=60 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=60 MONTH_INDEX=23 MONTH_DAY=1"
          grep -Fqx "$expected" logs/STAGE55_SIXTIETH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_SIXTIETH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_60.json | tee logs/STAGE55_SIXTIETH_DIGEST.txt
          echo 'STAGE55_SIXTIETH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-sixtieth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_59.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_60.json
            logs/STAGE55_SIXTIETH_NATIVE.log
            logs/STAGE55_SIXTIETH_PYTHON.log
            logs/STAGE55_SIXTIETH_PYTHON_ROW.txt
            logs/STAGE55_SIXTIETH_NATIVE_ROW.txt
            logs/STAGE55_SIXTIETH_DIGEST.txt
            logs/STAGE55_AFTER60_PREFLIGHT.json
            logs/STAGE55_AFTER60_PREFLIGHT.log
            logs/STAGE55_AFTER60_CERTIFICATION.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
