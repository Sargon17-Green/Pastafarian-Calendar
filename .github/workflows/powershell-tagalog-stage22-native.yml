name: PowerShell Tagalog Stage 22 native verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    name: Stage 22 native Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Verify native interpreter and run discovery with Stage 1 regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
              throw ('Requires Windows PowerShell 5.1, found ' + $PSVersionTable.PSVersion.ToString())
          }
          Write-Host ('NATIVE_RUNTIME=' + $PSVersionTable.PSVersion.ToString())
          & .\Run-Stage22.ps1
          if (-not $?) {
              throw 'Stage 22 native script failed'
          }
      - name: Preserve CI-side finalized stage metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-tagalog-stage22-ci-evidence
          path: DEVELOPMENT_STAGE.md
          if-no-files-found: error
