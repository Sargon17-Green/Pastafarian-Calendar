name: COBOL Chinese Stage06 DISCOVERY03 Manual Diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage06-discovery-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GnuCOBOL 3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol3
          cobc --version
      - name: Compile production route and verify exact expected-red signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          printf 'PROJECT_ID=PC-BRANCH-COBOL-SIMPLIFIED-CHINESE\nHEAD=%s\n' "$GITHUB_SHA" >build/stage06-native.log
          timeout --signal=TERM --kill-after=10s 300s \
            cobc -std=default -free \
            -Wall -Wextra -Wno-terminator -Wstrict-typing -Wcall-params -Wlinkage -Wtruncate -Werror \
            -x -o build/stage06-discovery \
            test/stage06_discovery_tests.cob \
            src/big_integer.cob \
            src/monster_distance.cob \
            src/legacy_distance.cob \
            src/patched_day_tag.cob \
            2>&1 | tee -a build/stage06-native.log
          timeout --signal=TERM --kill-after=10s 120s \
            ./build/stage06-discovery 2>&1 | tee -a build/stage06-native.log
          grep -Eq '^STAGE6_EXPECTED_RED=[[:space:]]*0*5[[:space:]]*$' build/stage06-native.log
          grep -Eq '^STAGE6_CONTROL_PASS=[[:space:]]*0*3[[:space:]]*$' build/stage06-native.log
          grep -Eq '^STAGE6_OUTPUT_GUARD=[[:space:]]*0*8[[:space:]]*$' build/stage06-native.log
          grep -Eq '^STAGE6_UNEXPECTED_FAILURES=[[:space:]]*0+[[:space:]]*$' build/stage06-native.log
          grep -Fxq 'RESULT=PASS_STAGE6_EXPECTED_RED_NATIVE' build/stage06-native.log
          ! grep -Eq 'PATCH03|DISTANCE-PATCH' src/legacy_distance.cob
          echo 'STAGE6_NATIVE_GATE=PASS' | tee -a build/stage06-native.log
      - name: Persist evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobol-stage06-discovery-native-evidence
          path: build/stage06-native.log
          if-no-files-found: warn
          retention-days: 30
