name: FALSE Arabic Stage 2 DISCOVERY01 exact-source Native Ubuntu

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-native-discovery01:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PROJECT_ID: PC-BRANCH-FALSE-ARABIC
      SOURCE_PIN: d05b84ab06a667e2b06d452dc73ca8c7b0837767
      RUNTIME_PIN: eb3135565a8670cced3f6bbca4dbf7b014c45634
      # SHA256 of four immutable Git blobs joined by LF and final LF, independently reproduced.
      ORIGINAL_COMBINED_SHA256: 20596d528c6b399a1bba76ac4b90bd2740cdba9e928f458847af6708341cc12f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch immutable project and upstream FALSE sources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence upstream
          git fetch --no-tags --depth=1 origin "$SOURCE_PIN" > evidence/project_fetch.log 2>&1
          git rev-parse FETCH_HEAD > evidence/project_observed_sha.txt
          test "$(cat evidence/project_observed_sha.txt)" = "$SOURCE_PIN"
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/ianjray/false.git
          git -C upstream fetch --no-tags --depth=1 origin "$RUNTIME_PIN" > evidence/upstream_fetch.log 2>&1
          git -C upstream rev-parse FETCH_HEAD > evidence/upstream_observed_sha.txt
          test "$(cat evidence/upstream_observed_sha.txt)" = "$RUNTIME_PIN"
          git -C upstream checkout -q --detach "$RUNTIME_PIN"
          git -C upstream status --porcelain > evidence/upstream_worktree_status.txt
          test ! -s evidence/upstream_worktree_status.txt

      - name: Verify unmodified bytes of original Stage 2 combined program
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          source = os.environ['SOURCE_PIN']
          paths = ('src/bigint.false', 'test/normative_reference.false',
                   'src/monster_bootstrap.false', 'test/stage02_discovery01_tests.false')
          chunks = [subprocess.check_output(['git', 'show', source + ':' + p]).decode('utf-8')
                    for p in paths]
          data = ('\n'.join(chunks) + '\n').encode('utf-8')
          actual = hashlib.sha256(data).hexdigest()
          pathlib.Path('evidence/stage02_discovery01_combined.false').write_bytes(data)
          pathlib.Path('evidence/combined_sha256.txt').write_text(actual + '  stage02_discovery01_combined.false\n')
          assert actual == os.environ['ORIGINAL_COMBINED_SHA256'], (actual, 'original combined SHA mismatch')
          assert data.count('ø'.encode('utf-8')) == 2, 'unexpected pick glyph count'
          assert '[z;\\-1-ø]g:'.encode('utf-8') in data
          assert '[z;\\-ø]h:'.encode('utf-8') in data
          print('SOURCE_BYTES_LOCKED', actual)
          PY

      - name: Compile pinned upstream native interpreter under Ubuntu
        shell: bash
        run: |
          set -Eeuo pipefail
          gcc --version > evidence/compiler_version.txt
          cd upstream
          set +e
          gcc -Wall -Wextra -O2 -D_GNU_SOURCE -I. -Isrc \
            interpreter.c src/false.c utils/file.c src/stack.c src/slice.c src/storage.c src/token.c \
            -o false_int > ../evidence/compile_stdout.txt 2> ../evidence/compile_stderr.txt
          code=$?
          set -e
          echo "$code" > ../evidence/compiler_exit_code.txt
          test "$code" -eq 0
          test -x false_int
          sha256sum false_int > ../evidence/runtime_executable_sha256.txt

      - name: Test basic, extension, and both pick spellings
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '2 3+.' > evidence/smoke.false
          printf '2 3<.' > evidence/extension.false
          printf '%s' '4 7 1O.%%' > evidence/pick_ascii.false
          printf '%s' '4 7 1ø.%%' > evidence/pick_unicode.false
          for test_name in smoke extension pick_ascii pick_unicode; do
            set +e
            timeout 15s upstream/false_int -e "evidence/$test_name.false" \
              > "evidence/$test_name.stdout.txt" 2> "evidence/$test_name.stderr.txt"
            code=$?
            set -e
            echo "$code" > "evidence/$test_name.exit_code.txt"
            test "$code" -eq 0
          done
          test "$(cat evidence/smoke.stdout.txt)" = '5'
          test "$(cat evidence/extension.stdout.txt)" = '-1'
          test "$(cat evidence/pick_ascii.stdout.txt)" = '4'
          test "$(cat evidence/pick_unicode.stdout.txt)" = '4'
          echo ORIGINAL_UNICODE_PICK_PREFLIGHT_PASS > evidence/preflight_status.txt

      - name: Run unchanged Stage 2 DISCOVERY01 exact bytes (bounded)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          timeout 120s upstream/false_int -e evidence/stage02_discovery01_combined.false \
            > evidence/native_stdout.txt 2> evidence/native_stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/native_exit_code.txt
          test "$code" -eq 0
          grep -Fq 'DISCOVERY01_SHAPE_M0_2M0_3M0_MPLUS1_1' evidence/native_stdout.txt
          grep -Fq 'DISCOVERY01_RECREATED_NATIVE_SHAPE_VERIFIED' evidence/native_stdout.txt
          if grep -Fq 'فشل استقصاء المرحلة الثانية' evidence/native_stdout.txt; then
            echo CONTRADICTORY_NATIVE_FAILURE > evidence/native_validation_error.txt
            exit 2
          fi

      - name: Run comment-notation-only diagnostic copy (never original Native PASS)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x upstream/false_int ] || [ ! -f evidence/stage02_discovery01_combined.false ]; then
            echo DIAGNOSTIC_NOT_READY > evidence/comment_diagnostic_status.txt
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, pathlib
          source = pathlib.Path('evidence/stage02_discovery01_combined.false')
          text = source.read_text(encoding='utf-8')
          needles = {'P_{d-1}': 3, 'P_{w+1}': 1}
          for token, number in needles.items():
              matches = [line for line in text.splitlines() if token in line]
              assert len(matches) == number, (token, len(matches))
              assert all(line.strip().startswith('{ ') and line.strip().endswith(' }') for line in matches)
          changed = text
          for token in needles:
              changed = changed.replace(token, token.replace('{', '(').replace('}', ')'))
          assert changed.count('P_{') == 0
          target = pathlib.Path('evidence/stage02_discovery01_comment_sanitized_DIAGNOSTIC.false')
          target.write_text(changed, encoding='utf-8')
          assert source.read_text(encoding='utf-8') == text, 'original changed'
          target_sha = hashlib.sha256(target.read_bytes()).hexdigest()
          pathlib.Path('evidence/comment_diagnostic_sha256.txt').write_text(target_sha + '\n', encoding='utf-8')
          assert target_sha == '14da009d3c4ba6c5538f146d0c2d35a897435fee5b5e29bcd4af07d6dd3a9f38'
          print('COMMENT_ONLY_DIAGNOSTIC_COPY', target_sha, 'substitutions=4')
          PY
          set +e
          timeout 120s upstream/false_int -e evidence/stage02_discovery01_comment_sanitized_DIAGNOSTIC.false \
            > evidence/comment_diagnostic_stdout.txt 2> evidence/comment_diagnostic_stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/comment_diagnostic_exit_code.txt
          echo DIAGNOSTIC_ONLY_ORIGINAL_SOURCE_NOT_ACCEPTED > evidence/comment_diagnostic_status.txt

      - name: Run twelve-case trace on diagnostic copy (not a Native acceptance test)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x upstream/false_int || exit 0
          test -f evidence/stage02_discovery01_comment_sanitized_DIAGNOSTIC.false || exit 0
          python3 - <<'PY'
          import hashlib, pathlib
          source = pathlib.Path('evidence/stage02_discovery01_comment_sanitized_DIAGNOSTIC.false')
          data = source.read_text(encoding='utf-8')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '14da009d3c4ba6c5538f146d0c2d35a897435fee5b5e29bcd4af07d6dd3a9f38'
          lines = data.splitlines(keepends=True)
          out = []
          seen = 0
          for line in lines:
              if line.startswith('z;b:') and ';!n:n;' in line:
                  seen += 1
                  out.append('"TRACE_CASE_%02d"10,\n' % seen)
              out.append(line)
          assert seen == 12, ('case_count', seen)
          dest = pathlib.Path('evidence/stage02_discovery01_case_trace_DIAGNOSTIC.false')
          dest.write_text(''.join(out), encoding='utf-8')
          pathlib.Path('evidence/trace_sha256.txt').write_text(hashlib.sha256(dest.read_bytes()).hexdigest() + '\n')
          print('TRACE_INSERTIONS', seen)
          PY
          set +e
          timeout 120s upstream/false_int -e evidence/stage02_discovery01_case_trace_DIAGNOSTIC.false \
            > evidence/trace_stdout.txt 2> evidence/trace_stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/trace_exit_code.txt
          echo CASE_TRACE_DIAGNOSTIC_ONLY > evidence/trace_status.txt

      - name: isolate mutable-zero fixture in case 10 (diagnostic only)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x upstream/false_int || exit 0
          test -f evidence/stage02_discovery01_case_trace_DIAGNOSTIC.false || exit 0
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('evidence/stage02_discovery01_case_trace_DIAGNOSTIC.false')
          source = p.read_text(encoding='utf-8')
          needle = 'z;b:u;a;!b;36o;!n:n;u;i;!'
          assert source.count(needle) == 1
          assert source.count('TRACE_CASE_10') == 1
          output = source.replace(needle, '2 22o;!u: { DIAGNOSTIC ONLY: fresh zero }\n' + needle)
          target = pathlib.Path('evidence/stage02_discovery01_case10_fresh_zero_DIAGNOSTIC.false')
          target.write_text(output, encoding='utf-8')
          assert p.read_text(encoding='utf-8') == source
          print('CASE10_ISOLATION_ONLY')
          PY
          set +e
          timeout 120s upstream/false_int -e evidence/stage02_discovery01_case10_fresh_zero_DIAGNOSTIC.false \
            > evidence/case10_fresh_zero_stdout.txt 2> evidence/case10_fresh_zero_stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/case10_fresh_zero_exit_code.txt
          echo DIAGNOSTIC_NOT_STAGE2_ACCEPTANCE > evidence/case10_fresh_zero_status.txt

      - name: Diagnose CASE10 and standalone SAVE(0) with independent oracle (not acceptance)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x upstream/false_int ] || [ ! -f evidence/stage02_discovery01_combined.false ] || [ ! -f evidence/stage02_discovery01_case_trace_DIAGNOSTIC.false ]; then
            echo DIAGNOSTIC_PREREQUISITES_MISSING > evidence/case10_probe_status.txt
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, json, pathlib
          out = pathlib.Path('evidence')
          trace_path = out / 'stage02_discovery01_case_trace_DIAGNOSTIC.false'
          trace = trace_path.read_text(encoding='utf-8')
          needle = 'z;b:u;a;!b;36o;!n:n;u;i;!'
          assert trace.count(needle) == 1
          diagnostic = (
              '"CASE10_U_HANDLE_BEFORE "u;.10,\n'
              '"CASE10_U_SIGN_BEFORE "z;b:u;a;!b;1o;!.10,\n'
              'z;b:u;a;!b;36o;!n:\n'
              '"CASE10_U_HANDLE_AFTER "u;.10,\n'
              '"CASE10_N_HANDLE_AFTER "n;.10,\n'
              '"CASE10_U_SIGN_AFTER "z;b:u;a;!b;1o;!.10,\n'
              '"CASE10_N_SIGN_AFTER "z;b:n;a;!b;1o;!.10,\n'
              '"CASE10_U_DIGITS_AFTER "z;b:u;a;!b;2o;!.10,\n'
              '"CASE10_N_DIGITS_AFTER "z;b:n;a;!b;2o;!.10,\n'
              '"CASE10_N_VS_U_COMPARE "z;b:n;a;!u;a;!b;28o;!.10,\n'
              'n;u;i;!'
          )
          traced = out / 'stage02_case10_structural_probe_DIAGNOSTIC.false'
          traced.write_text(trace.replace(needle, diagnostic), encoding='utf-8')
          original = (out / 'stage02_discovery01_combined.false').read_text(encoding='utf-8')
          marker = '{ إعادة بناء مستقلة لاستقصاء المرحلة الثانية.'
          assert original.count(marker) == 1
          prefix = original.split(marker, 1)[0]
          assert prefix.count('P_{d-1}') == 3 and prefix.count('P_{w+1}') == 1
          prefix = prefix.replace('P_{d-1}', 'P_(d-1)').replace('P_{w+1}', 'P_(w+1)')
          assert 'P_{' not in prefix
          standalone = '\n'.join([
              'z;b:0a;!b;21o;!c:',
              '0 22o;!u:',
              '"SOLO_U_HANDLE_BEFORE "u;.10,',
              '"SOLO_U_SIGN_BEFORE "z;b:u;a;!b;1o;!.10,',
              'z;b:u;a;!b;36o;!n:',
              '"SOLO_U_HANDLE_AFTER "u;.10,',
              '"SOLO_N_HANDLE_AFTER "n;.10,',
              '"SOLO_U_SIGN_AFTER "z;b:u;a;!b;1o;!.10,',
              '"SOLO_N_SIGN_AFTER "z;b:n;a;!b;1o;!.10,',
              '"SOLO_U_DIGITS_AFTER "z;b:u;a;!b;2o;!.10,',
              '"SOLO_N_DIGITS_AFTER "z;b:n;a;!b;2o;!.10,',
              '"SOLO_N_VS_U_COMPARE "z;b:n;a;!u;a;!b;28o;!.10,',
          ]) + '\n'
          solo = out / 'stage02_save_zero_standalone_DIAGNOSTIC.false'
          solo.write_text(prefix + standalone, encoding='utf-8')
          m = (1 << 127) - 1
          def oracle(x):
              return m if x and x % m == 0 else x % m
          samples = [0, 1, m - 1, m, m + 1, 2*m, 3*m]
          assert oracle(0) == 0 and oracle(m) == m
          (out / 'case10_independent_oracle.json').write_text(
              json.dumps({'native_acceptance': False, 'samples': {str(x): oracle(x) for x in samples}},
                         sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          (out / 'case10_probe_sha256.txt').write_text(
              ''.join(hashlib.sha256(x.read_bytes()).hexdigest() + '  ' + x.name + '\n'
                      for x in (traced, solo)), encoding='utf-8'
          )
          assert trace_path.read_text(encoding='utf-8') == trace
          print('CASE10_PROBE_GENERATED variants=2 independent_oracle_samples=7')
          PY
          for filename in stage02_save_zero_standalone_DIAGNOSTIC.false stage02_case10_structural_probe_DIAGNOSTIC.false; do
            set +e
            timeout 25s upstream/false_int -e "evidence/$filename" > "evidence/$filename.stdout.txt" 2> "evidence/$filename.stderr.txt"
            code=$?
            set -e
            echo "$code" > "evidence/$filename.exit_code.txt"
            echo "$filename exit=$code; DIAGNOSTIC_ONLY"
          done
          echo DIAGNOSTIC_ONLY_NO_STAGE2_PASS > evidence/case10_probe_status.txt

      - name: Capture numeric CASE10 evidence with wide-stdio DIAGNOSTIC interpreter only
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x upstream/false_int ] || [ ! -f evidence/stage02_save_zero_standalone_DIAGNOSTIC.false ] || [ ! -f evidence/stage02_case10_structural_probe_DIAGNOSTIC.false ]; then
            echo PREREQUISITES_MISSING > evidence/stdio_diag_status.txt
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, json, pathlib
          src = pathlib.Path('upstream/interpreter.c')
          original = src.read_text(encoding='utf-8')
          edits = {
              'printf("%d", number);': 'wprintf(L"%d", number);',
              'putchar(c);': 'putwchar((wchar_t)(unsigned char)c);',
          }
          assert all(original.count(a) == 1 for a in edits), 'upstream stdio source drift'
          assert original.count('putwchar(wc);') == 1, 'wide emitter source drift'
          patched = original
          for old, new in edits.items():
              patched = patched.replace(old, new)
          assert patched != original and len(edits) == 2
          out = pathlib.Path('evidence/interpreter_wide_stdio_DIAGNOSTIC.c')
          out.write_text(patched, encoding='utf-8')
          receipt = {
              'scope': 'DIAGNOSTIC_INTERPRETER_ONLY_NOT_NATIVE_ACCEPTANCE',
              'upstream_original_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'diagnostic_interpreter_sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
              'replacements': edits,
              'original_upstream_file_unchanged': src.read_text(encoding='utf-8') == original,
          }
          pathlib.Path('evidence/stdio_diag_provenance.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('DIAGNOSTIC_WIDE_STDIO_SOURCE_CREATED replacements=2')
          PY
          set +e
          gcc -Wall -Wextra -O2 -D_GNU_SOURCE -Iupstream -Iupstream/src \
            evidence/interpreter_wide_stdio_DIAGNOSTIC.c \
            upstream/src/false.c upstream/utils/file.c upstream/src/stack.c \
            upstream/src/slice.c upstream/src/storage.c upstream/src/token.c \
            -o evidence/false_int_wide_stdio_DIAGNOSTIC \
            > evidence/stdio_diag_compile_stdout.txt 2> evidence/stdio_diag_compile_stderr.txt
          compile_code=$?
          set -e
          echo "$compile_code" > evidence/stdio_diag_compile_exit_code.txt
          if [ "$compile_code" -ne 0 ]; then
            echo WIDE_STDIO_DIAGNOSTIC_COMPILE_FAILED > evidence/stdio_diag_status.txt
            exit 0
          fi
          sha256sum evidence/false_int_wide_stdio_DIAGNOSTIC > evidence/stdio_diag_binary_sha256.txt
          printf '"WIDE_STDIO_PROBE "7.10,' > evidence/stdio_diag_smoke.false
          set +e
          timeout 15s evidence/false_int_wide_stdio_DIAGNOSTIC -e evidence/stdio_diag_smoke.false \
            > evidence/stdio_diag_smoke.stdout.txt 2> evidence/stdio_diag_smoke.stderr.txt
          smoke_code=$?
          set -e
          echo "$smoke_code" > evidence/stdio_diag_smoke.exit_code.txt
          if [ "$smoke_code" -ne 0 ] || [ "$(cat evidence/stdio_diag_smoke.stdout.txt)" != 'WIDE_STDIO_PROBE 7' ]; then
            echo WIDE_STDIO_DIAGNOSTIC_SMOKE_FAILED > evidence/stdio_diag_status.txt
            exit 0
          fi
          for filename in stage02_save_zero_standalone_DIAGNOSTIC.false stage02_case10_structural_probe_DIAGNOSTIC.false; do
            set +e
            timeout 25s evidence/false_int_wide_stdio_DIAGNOSTIC -e "evidence/$filename" \
              > "evidence/$filename.wide_stdio.stdout.txt" \
              2> "evidence/$filename.wide_stdio.stderr.txt"
            case_code=$?
            set -e
            echo "$case_code" > "evidence/$filename.wide_stdio.exit_code.txt"
            echo "$filename wide_stdio_exit=$case_code DIAGNOSTIC_ONLY"
          done
          python3 - <<'PY'
          import json, pathlib, re
          out = pathlib.Path('evidence')
          files = ('stage02_save_zero_standalone_DIAGNOSTIC.false',
                   'stage02_case10_structural_probe_DIAGNOSTIC.false')
          result = {
              'scope': 'DIAGNOSTIC_ONLY_MODIFIED_INTERPRETER_NOT_NATIVE_ACCEPTANCE',
              'native_pass': False,
              'stage2_accepted': False,
              'stdio_probe': (out / 'stdio_diag_smoke.stdout.txt').read_text(encoding='utf-8'),
              'cases': {},
          }
          required_suffixes = (
              'U_HANDLE_BEFORE', 'U_SIGN_BEFORE', 'U_HANDLE_AFTER',
              'N_HANDLE_AFTER', 'U_SIGN_AFTER', 'N_SIGN_AFTER',
              'U_DIGITS_AFTER', 'N_DIGITS_AFTER', 'N_VS_U_COMPARE',
          )
          total = 0
          complete = True
          for fname in files:
              content = (out / (fname + '.wide_stdio.stdout.txt')).read_text(encoding='utf-8')
              numbers = re.findall(r'\b((?:CASE10|SOLO)_[A-Z_]+)\s+(-?\d+)', content)
              recorded = {label: int(value) for label, value in numbers}
              prefix = 'SOLO' if fname.startswith('stage02_save_zero_') else 'CASE10'
              required = {prefix + '_' + suffix for suffix in required_suffixes}
              labels = [label for label, _ in numbers]
              missing = sorted(required - recorded.keys())
              unexpected = sorted(recorded.keys() - required)
              duplicates = sorted({label for label in labels if labels.count(label) > 1})
              case_complete = not (missing or unexpected or duplicates) and len(numbers) == len(required)
              complete = complete and case_complete
              result['cases'][fname] = {
                  'exit_code': int((out / (fname + '.wide_stdio.exit_code.txt')).read_text()),
                  'numeric_label_count': len(recorded),
                  'required_labels': sorted(required),
                  'missing_labels': missing,
                  'unexpected_labels': unexpected,
                  'duplicate_labels': duplicates,
                  'numeric_evidence_complete': case_complete,
                  'values': recorded,
                  'stderr': (out / (fname + '.wide_stdio.stderr.txt')).read_text(encoding='utf-8')[-1200:],
              }
              total += len(numbers)
          result['numeric_label_count_total'] = total
          result['numeric_evidence_complete'] = complete
          (out / 'case10_wide_stdio_diagnostics.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('CASE10_DIAGNOSTIC_NUMERIC_LABELS', total)
          if not complete or total != 2 * len(required_suffixes):
              raise SystemExit('NUMERIC_DIAGNOSTIC_INCOMPLETE: inspect missing/duplicate fields; no CASE10 verdict')
          PY
          echo WIDE_STDIO_NUMERIC_DIAGNOSTIC_ONLY > evidence/stdio_diag_status.txt

      - name: Finalize explicit provenance and Native evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          folder = pathlib.Path('evidence')
          folder.mkdir(exist_ok=True)
          def content(path):
              p = folder / path
              return p.read_text(encoding='utf-8').strip() if p.exists() else None
          def code(path):
              value = content(path)
              return int(value) if value is not None else None
          combined = folder / 'stage02_discovery01_combined.false'
          hash_actual = hashlib.sha256(combined.read_bytes()).hexdigest() if combined.exists() else None
          stdout = content('native_stdout.txt') or ''
          expected = ('DISCOVERY01_SHAPE_M0_2M0_3M0_MPLUS1_1',
                      'DISCOVERY01_RECREATED_NATIVE_SHAPE_VERIFIED')
          preflight = content('preflight_status.txt') == 'ORIGINAL_UNICODE_PICK_PREFLIGHT_PASS'
          success = (preflight and hash_actual == os.environ['ORIGINAL_COMBINED_SHA256'] and
                     content('project_observed_sha.txt') == os.environ['SOURCE_PIN'] and
                     content('upstream_observed_sha.txt') == os.environ['RUNTIME_PIN'] and
                     code('compiler_exit_code.txt') == 0 and code('native_exit_code.txt') == 0 and
                     all(s in stdout for s in expected) and
                     'فشل استقصاء المرحلة الثانية' not in stdout)
          evidence = {
              'project_id': os.environ['PROJECT_ID'],
              'platform': 'ubuntu-latest',
              'execution_mode': 'ORIGINAL_EXACT_SOURCE_UTF8',
              'source_pin': os.environ['SOURCE_PIN'],
              'source_observed': content('project_observed_sha.txt'),
              'runtime_pin': os.environ['RUNTIME_PIN'],
              'runtime_observed': content('upstream_observed_sha.txt'),
              'combined_expected_sha256': os.environ['ORIGINAL_COMBINED_SHA256'],
              'combined_observed_sha256': hash_actual,
              'compiler_exit_code': code('compiler_exit_code.txt'),
              'unicode_preflight_pass': preflight,
              'native_exit_code': code('native_exit_code.txt'),
              'markers_verified': all(s in stdout for s in expected),
              'failure_marker_absent': 'فشل استقصاء المرحلة الثانية' not in stdout,
              'discovery01_native_verified': success,
              'stage2_full_acceptance': False,
              'stage3_authorized': False,
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'github_sha': os.environ.get('GITHUB_SHA'),
          }
          (folder / 'evidence.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False))
          if not success:
              raise SystemExit('Native DISCOVERY01 NOT_VERIFIED; inspect artifact and job logs')
          PY

      - name: Save bounded evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: false-arabic-stage02-native-ubuntu
          path: evidence/
          retention-days: 30
          if-no-files-found: error
