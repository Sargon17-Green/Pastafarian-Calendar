name: Soak v269 exact fixed width stir arithmetic AB (not soak)
on:
  push:
    branches:
      - qa/issue29-gmp-complete-small-family-v198
    paths:
      - .github/workflows/soak-v269-celeritas-fixed-width-stir-ab.yml
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Lock archive and candidate source identities
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/qa/issue29-gmp-complete-small-family-v198"
          test "$(git rev-parse HEAD^)" = "c1358499b4fd0e80cfb9e6c050a84aaf2d64e875"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/soak-v269-celeritas-fixed-width-stir-ab.yml"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
      - name: Pin frozen inputs and exact candidate source
        run: |
          set -euo pipefail
          mkdir -p evidence source/src source/include/pastafari
          cp qa/soak/archive/v227-v258/v253.zip v253.zip
          echo "9cab9e052261b2f5e6f2a122151de8c7e9d5124cd48bf73a8651ebb6b690e47c  v253.zip" | sha256sum -c -
          cp qa/soak/archive/v227-v258/v258.zip v258.zip
          echo "13db2c122e5e483a10f9ee0f206c84f4e1497faccb61af273cfb079101110f1b  v258.zip" | sha256sum -c -
          test "$(git ls-remote origin refs/heads/qa/celeritas-short-rejection-v235-20261127 | cut -f1)" = "3a486ca105eb5a0736f7b799f290b637594d7501"
          timeout -k 5s 60s gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/15279211799/zip > v267.zip
          echo "ffda5de994b2d53b2ceb05bbdc127bd16325eb1eab65cf84d22006c13fe78151  v267.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,zipfile,subprocess
          from pathlib import Path
          def member(zp,n):
              with zipfile.ZipFile(zp) as z:
                  assert z.testzip() is None
                  return z.read(n)
          inventories={}
          for zp in ("v253.zip","v258.zip"):
              with zipfile.ZipFile(zp) as z:
                  assert z.testzip() is None
                  inventories[zp]=[{"name":n,"sha256":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]
          Path("evidence/input-inventory.json").write_text(json.dumps(inventories,indent=2)+"\n")
          frozen=json.loads(member("v253.zip","frozen.json"))
          assert frozen==json.loads(member("v258.zip","frozen.json"))
          cases="".join(f"{x['label']}\t{x['c']}\t{x['t']}\n" for x in frozen).encode("ascii")
          Path("evidence/cases.tsv").write_bytes(cases)
          prior=json.loads(member("v267.zip","result.json"))
          candidate="3a486ca105eb5a0736f7b799f290b637594d7501"
          assert prior["schema"]=="SOAK_V267_VERSIONED_INCREMENTAL_NATIVE/1" and prior["versioned_candidate_pass"]
          assert prior["candidate_commit"]==candidate and prior["candidate_blob"]=="c64bc5a0bab8d5227332e11aae548f80478657b8"
          assert len(frozen)==len(prior["rows"])==14 and len(cases.decode().splitlines())==14
          assert all(all(x[k]==y[k] for k in ("label","c","t","fields","raw_names")) for x,y in zip(frozen,prior["rows"]))
          pins={"src/monster.cpp":(candidate,"c64bc5a0bab8d5227332e11aae548f80478657b8"),"include/pastafari/monster.hpp":(candidate,"4c24d36e3704dd10ecf5420e7bc11a3da958d441"),"include/pastafari/source_language_catalog.hpp":(candidate,"9f204d93166b2c33532bb236bc2bd929252f27be")}
          for p,(ref,expected) in pins.items():
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github.raw+json",f"repos/Sargon17-Green/Pastafarian-Calendar/contents/{p}?ref={ref}"],timeout=45)
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\x00"+raw).hexdigest()==expected
              Path("source",p).write_bytes(raw)
          Path("source/cases.tsv").write_bytes(cases)
          Path("evidence/frozen.json").write_text(json.dumps(frozen,indent=2)+"\n")
          Path("evidence/v267-reference.json").write_text(json.dumps(prior,indent=2)+"\n")
          original=Path("source/src/monster.cpp").read_text()
          assert hashlib.sha256(original.encode()).hexdigest()=="caed4039118e349ce7219367a8768d6cf07a2035a1bbf0dc43caf35191eb4041"
          import difflib
          helper="""namespace {
          // Diagnostic variant: all inputs in [0,M], s <= 9M, x <= 86M^2+276 < 2^261.
          // Fixed 512-bit intermediates cannot wrap. Fold 2^127 == 1 mod M.
          using QaStirWide = boost::multiprecision::uint512_t;
          bool qaStirBounded(const BowlState& bowls,const Integer& drop,
                             const Stone& stones,const PourTriplet& pours) {
              auto bounded=[](const Integer& x){return x>=0 && x<=M_OLD;};
              return accelerationsOn() && !fullHistoricalValidationOn() &&
                  bounded(drop) && std::all_of(bowls.begin(),bowls.end(),bounded) &&
                  std::all_of(stones.begin(),stones.end(),bounded) &&
                  std::all_of(pours.begin(),pours.end(),bounded);
          }
          Integer qaStirFixed(const Integer& id,const Integer& prev,const Integer& next,
                              const Integer& pour,const Integer& drop,const Integer& stone,
                              int offset) {
              static const QaStirWide mask=(QaStirWide{1}<<127)-1;
              const QaStirWide p(prev), n(next);
              const QaStirWide sum=QaStirWide(id)+2*p+3*n+QaStirWide(pour)+QaStirWide(drop)+QaStirWide(stone);
              QaStirWide x=sum*sum+5*p*n+offset;
              while(x>mask) x=(x&mask)+(x>>127);
              if(x==0) x=mask;
              return Integer(x);
          }
          } // namespace
          """
          def once(src,a,b):
              assert src.count(a)==1,a
              return src.replace(a,b)
          start=original.index("void legacyStirBowlsInPlace(")
          mid=original.index("Patch10DeferredBowlComputation stirBowlsThroughVaultOld(",start)
          end=original.index("LegacySauceCounts sauceCountsThroughScars(",mid)
          legacy=original[start:mid]
          repaired=original[mid:end]
          for mode in ("legacy","repaired"):
              f=legacy if mode=="legacy" else repaired
              f=once(f,"    const std::array<std::size_t, 6> stoneByPosition", "    const bool qaFixed=qaStirBounded(bowls,drop,stoneRow,firstThreePours);\n    const std::array<std::size_t, 6> stoneByPosition")
              source="bowls" if mode=="legacy" else "vaultOld"
              dest="bowls" if mode=="legacy" else "pending"
              anchor="        const Integer s = "+source+"[static_cast<std::size_t>(id - 1)]"
              fast="        if (qaFixed) {\n            "+dest+"[static_cast<std::size_t>(id - 1)] = qaStirFixed(\n                "+source+"[static_cast<std::size_t>(id - 1)], "+source+"[static_cast<std::size_t>(prev - 1)],\n                "+source+"[static_cast<std::size_t>(next - 1)], pour, drop, stoneRow[stoneByPosition[position]],\n                index * static_cast<int>(position + 1));\n            continue;\n        }\n"
              f=once(f,anchor,fast+anchor)
              if mode=="legacy":legacy=f
              else:repaired=f
          variant=original[:start]+helper+legacy+repaired+original[end:]
          Path("source/src/base.cpp").write_text(original)
          Path("source/src/variant.cpp").write_text(variant)
          Path("evidence/variant.diff").write_text("".join(difflib.unified_diff(original.splitlines(True),variant.splitlines(True),fromfile="base",tofile="variant")))
          Path("evidence/source.json").write_text(json.dumps({"candidate":candidate,"base_sha256":hashlib.sha256(original.encode()).hexdigest(),"variant_sha256":hashlib.sha256(variant.encode()).hexdigest(),"fixed_width_bits":512,"guard":"normal acceleration and all inputs in [0,M]","legacy_and_repaired_paths_retained":True},indent=2)+"\n")
          PY
      - name: Compile original API and direct stir checks
        run: |
          set -euo pipefail
          (
            if ! printf '#include <boost/multiprecision/cpp_int.hpp>\nint main(){}\n' | g++ -std=c++17 -x c++ -fsyntax-only -; then
              timeout -k 5s 120s sudo apt-get update -qq
              timeout -k 5s 120s sudo apt-get install -y --no-install-recommends libboost-dev
            fi
            g++ --version
          ) > evidence/compiler.txt 2>&1
          cat > source/probe.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include "pastafari/source_language_catalog.hpp"
          #include <chrono>
          #include <iostream>
          #include <stdexcept>
          #include <string>
          using namespace pastafari;
          std::size_t ci(const std::string& n){for(const auto& x:CUTLET_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("cutlet");}
          std::size_t mi(const std::string& n){for(const auto& x:MONTH_SOURCE_CATALOG)if(x.text==n)return x.canonicalIndex;throw std::runtime_error("month");}
          int main(){
              resetPersistentScarVaultsDiagnostic();
              setAccelerationScarsEnabled(true);
              setFullHistoricalAccelerationValidation(false);
              std::string label,cs,ts;
              int count=0;
              while(std::cin>>label>>cs>>ts){
                  const Integer c{cs},t{ts};
                  const auto before=persistentScarMetricsDiagnostic();
                  const auto start=std::chrono::steady_clock::now();
                  const auto a=calendarDateSpaghetti(c,t);
                  const auto after=persistentScarMetricsDiagnostic();
                  const double seconds=std::chrono::duration<double>(std::chrono::steady_clock::now()-start).count();
                  std::cout<<"DATE\t"<<label<<"\t"<<c<<"\t"<<t<<"\t"<<seconds<<"\t"<<a.yearNumber<<"\t"<<ci(a.cutletName)<<"\t"<<a.dayInCutlet<<"\t"<<mi(a.monthName)<<"\t"<<a.dayInMonth<<"\t"<<a.cutletName<<"\t"<<a.monthName<<"\t"<<after.patch28GateCalculated-before.patch28GateCalculated<<"\t"<<after.patch28GateResurrection-before.patch28GateResurrection<<"\t"<<after.patch27AncestralHit-before.patch27AncestralHit<<"\t"<<after.patch39FinalResultHit-before.patch39FinalResultHit<<std::endl;
                  ++count;
              }
              if(!std::cin.eof()||count!=14)return 2;
              std::cout<<"PERSISTENT_DONE\t"<<count<<std::endl;
          }
          CPP
          cat > source/stirtest.cpp <<'CPP'
          #include "pastafari/monster.hpp"
          #include <iostream>
          #include <stdexcept>
          using namespace pastafari;
          BowlState oracle(BowlState b,int i,const Integer& d,const Stone& st,const PermutationOrder& o,const PourTriplet& p,bool sequential){
              BowlState out=b;
              for(int j=0;j<6;++j){
                  const auto& old=sequential?out:b;
                  const auto a=o[j]-1,prev=o[(j+5)%6]-1,next=o[(j+1)%6]-1;
                  Integer s=old[a]+2*old[prev]+3*old[next]+(j<3?p[j]:Integer{0})+d+st[j%5];
                  out[a]=savePatch(s*s+5*old[prev]*old[next]+i*(j+1));
              }
              return out;
          }
          int main(){
              int checks=0;
              for(int mode=0;mode<3;++mode){
                  resetPersistentScarVaultsDiagnostic();setAccelerationScarsEnabled(mode!=1);setFullHistoricalAccelerationValidation(mode==2);
                  for(int rank=0;rank<720;++rank){
                      auto o=oldPermutationUnrank0(rank);
                      for(int kind=0;kind<6;++kind){
                          auto value=[&](int j)->Integer{
                              if(kind==0)return 0;
                              if(kind==1)return M_OLD;
                              if(kind==2)return (j%2)?Integer{1}:Integer{M_OLD-1};
                              if(kind==3)return savePatch((Integer{rank+1}<<(j+70))*(j+19)+j*j);
                              if(kind==4)return (j%2)?Integer{-1}:Integer{M_OLD+1};
                              return (Integer{1}<<(270+j))-(rank+j);
                          };
                          BowlState b{}; Stone st{}; PourTriplet p{};
                          for(int j=0;j<6;++j)b[j]=value(j+1);
                          for(int j=0;j<5;++j)st[j]=value(j+7);
                          for(int j=0;j<3;++j)p[j]=value(j+12);
                          Integer drop=value(15);int i=1+rank%46;
                          auto old=b;legacyStirBowlsInPlace(old,i,drop,st,o,p);
                          if(old!=oracle(b,i,drop,st,o,p,true))throw std::runtime_error("legacy mismatch");
                          auto corrected=stirBowlsThroughVaultOld(b,i,drop,st,o,p);
                          auto wanted=oracle(b,i,drop,st,o,p,false);
                          if(corrected.vaultOld!=b||corrected.pending!=wanted||corrected.output!=wanted)throw std::runtime_error("repaired mismatch");
                          checks+=2;
                      }
                  }
                  std::cout<<"MODE\t"<<mode<<"\t"<<checks<<std::endl;
              }
              if(checks!=25920)return 2;
              std::cout<<"STIR_DONE\t"<<checks<<std::endl;
          }
          CPP
          for mode in base variant; do
            (ulimit -v 4194304; timeout -k 5s 120s g++ -std=c++17 -O2 -pthread -I source/include -c "source/src/$mode.cpp" -o "source/$mode.o") > "evidence/$mode-build.log" 2>&1 || { cat "evidence/$mode-build.log"; exit 1; }
            for test in probe stirtest; do
              (ulimit -v 4194304; timeout -k 5s 60s g++ -std=c++17 -O2 -pthread -I source/include "source/$mode.o" "source/$test.cpp" -o "source/$mode-$test") >> "evidence/$mode-build.log" 2>&1 || { cat "evidence/$mode-build.log"; exit 1; }
            done
          done
          sha256sum source/src/*.cpp source/*.cpp source/*-probe source/*-stirtest > evidence/build.sha256
      - name: Direct stir exactness and original API AB
        run: |
          set -euo pipefail
          for mode in base variant; do
            set +e
            (ulimit -v 1572864; /usr/bin/time -v -o "evidence/$mode-stir-time.txt" timeout -k 5s 60s "source/$mode-stirtest") > "evidence/$mode-stir-stdout.txt" 2> "evidence/$mode-stir-stderr.txt"
            code=$?
            set -e
            echo "$code" > "evidence/$mode-stir-exit.txt"
            cat "evidence/$mode-stir-stdout.txt" "evidence/$mode-stir-stderr.txt"
            set +e
            (ulimit -v 3145728; /usr/bin/time -v -o "evidence/$mode-time.txt" timeout -k 5s 240s "source/$mode-probe" < source/cases.tsv) > "evidence/$mode-stdout.txt" 2> "evidence/$mode-stderr.txt"
            code=$?
            set -e
            echo "$code" > "evidence/$mode-exit.txt"
            cat "evidence/$mode-stdout.txt" "evidence/$mode-stderr.txt"
          done
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path("evidence");frozen=json.loads((p/"frozen.json").read_text());prior=json.loads((p/"v267-reference.json").read_text())
          modes={}
          for mode in ("base","variant"):
              direct=(p/f"{mode}-stir-stdout.txt").read_text().splitlines()==["MODE\t0\t8640","MODE\t1\t17280","MODE\t2\t25920","STIR_DONE\t25920"]
              direct=direct and int((p/f"{mode}-stir-exit.txt").read_text())==0 and not (p/f"{mode}-stir-stderr.txt").read_text()
              lines=(p/f"{mode}-stdout.txt").read_text().splitlines();rows=[]
              for l in lines:
                  a=l.split("\t")
                  if a[0]=="DATE":
                      assert len(a)==16
                      rows.append({"label":a[1],"c":int(a[2]),"t":int(a[3]),"seconds":float(a[4]),"fields":list(map(int,a[5:10])),"raw_names":a[10:12],"gate_calculated":int(a[12]),"gate_resurrections":int(a[13]),"structure_hits":int(a[14]),"result_hits":int(a[15])})
                  else:assert l=="PERSISTENT_DONE\t14"
              ok=int((p/f"{mode}-exit.txt").read_text())==0 and len(rows)==len(frozen)==14 and lines[-1]=="PERSISTENT_DONE\t14" and not (p/f"{mode}-stderr.txt").read_text()
              ok=ok and all(all(x[k]==y[k] for k in ("label","c","t","fields","raw_names")) for x,y in zip(rows,frozen))
              ok=ok and all(all(x[k]==y[k] for k in ("gate_calculated","gate_resurrections","structure_hits","result_hits")) for x,y in zip(rows,prior["rows"]))
              rss=re.search(r"Maximum resident set size \(kbytes\): (\d+)",(p/f"{mode}-time.txt").read_text())
              modes[mode]={"pass":bool(ok and direct),"direct_stir_checks":25920 if direct else 0,"rows":rows,"peak_rss_kib":int(rss.group(1)) if rss else None}
          passed=all(m["pass"] for m in modes.values())
          cold={"initial","remote_date"}
          totals={k:sum(r["seconds"] for r in m["rows"] if r["label"] in cold) for k,m in modes.items()}
          out={"schema":"SOAK_V269_FIXED_WIDTH_STIR_AB/1","candidate_commit":prior["candidate_commit"],"comparison_pass":passed,"source":json.loads((p/"source.json").read_text()),"modes":modes,"cold_totals":totals,"cold_speedup":totals["base"]/totals["variant"] if passed and totals["variant"]>0 else None,"previously_frozen_unique_pairs":11,"independent_new_pairs":0,"whole_year_credit":0,"admitted_engines":0,"STOP_NEW_NATIVE_SOAK_DISPATCH":True}
          (p/"result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          assert passed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-v269-fixed-width-stir-ab-${{ github.run_id }}
          path: evidence/
          retention-days: 90
