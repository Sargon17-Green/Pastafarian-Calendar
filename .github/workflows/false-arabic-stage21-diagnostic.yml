name: FALSE Arabic Stage 21 source-locked measurement diagnostic
on:
  push:
    branches:
      - 'FALSE+العربية'
permissions:
  contents: read
jobs:
  stage21-diagnostic:
    if: contains(github.event.head_commit.message, '[false-arabic-stage21-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PROJECT_ID: PC-BRANCH-FALSE-ARABIC
      SOURCE_PIN: ${{ github.sha }}
      RUNTIME_PIN: eb3135565a8670cced3f6bbca4dbf7b014c45634
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and original FALSE interpreter commit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/stage21_diagnostic upstream
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          git cat-file -e "$SOURCE_PIN^{commit}"
          git rev-parse "$SOURCE_PIN" > evidence/stage21_diagnostic/source_observed.txt
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/ianjray/false.git
          git -C upstream fetch --no-tags --depth=1 origin "$RUNTIME_PIN" > evidence/stage21_diagnostic/runtime_fetch.log 2>&1
          git -C upstream rev-parse FETCH_HEAD > evidence/stage21_diagnostic/runtime_observed.txt
          test "$(cat evidence/stage21_diagnostic/runtime_observed.txt)" = "$RUNTIME_PIN"
          git -C upstream checkout -q --detach "$RUNTIME_PIN"
          test -z "$(git -C upstream status --porcelain)"
      - name: Build original interpreter and prove UTF-8 pick parsing
        shell: bash
        run: |
          set -Eeuo pipefail
          gcc --version > evidence/stage21_diagnostic/compiler_version.txt
          set +e
          gcc -Wall -Wextra -O2 -D_GNU_SOURCE -Iupstream -Iupstream/src \
            upstream/interpreter.c upstream/src/false.c upstream/utils/file.c \
            upstream/src/stack.c upstream/src/slice.c upstream/src/storage.c \
            upstream/src/token.c -o upstream/false_int \
            > evidence/stage21_diagnostic/compiler_stdout.txt \
            2> evidence/stage21_diagnostic/compiler_stderr.txt
          code=$?
          set -e
          echo "$code" > evidence/stage21_diagnostic/compiler_exit_code.txt
          test "$code" -eq 0 && test -x upstream/false_int
          printf '%s' '4 7 1ø.%%' > evidence/stage21_diagnostic/unicode_pick.false
          timeout 15s upstream/false_int -e evidence/stage21_diagnostic/unicode_pick.false \
            > evidence/stage21_diagnostic/unicode_pick.stdout.txt \
            2> evidence/stage21_diagnostic/unicode_pick.stderr.txt
          test "$(cat evidence/stage21_diagnostic/unicode_pick.stdout.txt)" = '4'
          echo ORIGINAL_UNICODE_PICK_PREFLIGHT_PASS > evidence/stage21_diagnostic/preflight.txt
      - name: Recompute corrected oracle, self-check fixtures and measure Native paths
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version > evidence/stage21_diagnostic/node_version.txt
          node tools/stage21_corrected_neighbor_oracle.mjs > evidence/stage21_diagnostic/corrected_oracle.json
          cmp evidence/stage21_diagnostic/corrected_oracle.json evidence/stage21_corrected_neighbor_math_qa_2026-11-25.json
          python3 -m py_compile tools/stage21_native_diagnostic.py
          python3 tools/stage21_native_diagnostic.py --self-check > evidence/stage21_diagnostic/fixture_self_check.log
          python3 tools/stage21_native_diagnostic.py
      - name: Preserve source-pinned Native programs, byte-exact logs and exits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: false-arabic-stage21-measurement-diagnostic
          path: |
            evidence/stage21_diagnostic/
          if-no-files-found: error
          retention-days: 30
