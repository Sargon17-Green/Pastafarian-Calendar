name: SystemVerilog Stage 1 Bootstrap
on:
  push:
    branches: ['SystemVerilog+Kalaallisut']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Simulate Stage 1 and test-only Foundation oracle
        run: bash scripts/verify_stage1.sh
