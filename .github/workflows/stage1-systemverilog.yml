name: SystemVerilog Stage 1 Isolated QA
on:
  push:
    branches:
      - qa-systemverilog-kalaallisut-stage1-20261022
  pull_request:
    branches:
      - qa-systemverilog-kalaallisut-stage1-20261022
    paths:
      - 'rtl/**'
      - 'tests/**'
      - 'scripts/**'
      - 'catalog/**'
      - '.github/workflows/stage1-systemverilog.yml'
  workflow_dispatch:
# Keep only the latest candidate verification active within each PR/ref.
concurrency:
  group: stage1-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Capture immutable source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git rev-parse HEAD | tee build/ci_checked_sha.txt
          git status --porcelain=v1 | tee build/ci_worktree_status.txt
      - name: Install Icarus Verilog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V 2>&1 | tee build/simulator_version.txt
          vvp -V 2>&1 | tee build/runtime_version.txt
      - name: Execute self-contained test-only suite
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_stage1.sh 2>&1 | tee build/stage1_simulation.log
      - name: Persist logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv-stage1-qa-evidence
          path: |
            build/ci_checked_sha.txt
            build/ci_worktree_status.txt
            build/simulator_version.txt
            build/runtime_version.txt
            build/stage1_simulation.log
          retention-days: 90
          if-no-files-found: error

  full_weave_root:
    # Never run this heavyweight job on the QA branch's own push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Check provenance and run bounded 22528-bit full root
        run: |
          set -euo pipefail
          mkdir -p build
          git rev-parse HEAD | tee build/fullroot_head.txt
          ulimit -v 4194304
          bash scripts/verify_weave_fullroot.sh
      - name: Upload root evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-full-weave-root-qa
          path: |
            build/fullroot_head.txt
            build/weave_fullroot_probe.log
            build/weave_fullroot_run.log
            build/foundation_weave_root.bin
            build/weave_fullrank_run.log
            build/foundation_weave_rank.bin
            build/weave_prefix11_run.log
            build/foundation_weave_prefix11.bin
            build/weave_prefix2_run.log
            build/weave_prefix121_run.log
            build/foundation_weave_prefix121.bin
            build/weave_prefix3_run.log
            build/foundation_weave_prefix122.bin
            build/foundation_weave_prefix123.bin
            build/weave_prefix1231_run.log
            build/foundation_weave_prefix1231.bin
            build/weave_prefix4_run.log
            build/foundation_weave_prefix1232.bin
            build/foundation_weave_prefix1233.bin
            build/foundation_weave_prefix1234.bin
          retention-days: 90
          if-no-files-found: warn
