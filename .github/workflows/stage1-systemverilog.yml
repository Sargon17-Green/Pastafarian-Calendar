name: SystemVerilog Stage 1 Isolated QA
on:
  push:
    branches:
      - qa-systemverilog-kalaallisut-stage1-20261022
  pull_request:
    branches:
      - qa-systemverilog-kalaallisut-stage1-20261022
    paths:
      - 'rtl/**'
      - 'tests/**'
      - 'scripts/**'
      - 'catalog/**'
      - '.github/workflows/stage1-systemverilog.yml'
  workflow_dispatch:
# Keep only the latest candidate verification active within each PR/ref.
concurrency:
  group: stage1-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Capture immutable source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git rev-parse HEAD | tee build/ci_checked_sha.txt
          git status --porcelain=v1 | tee build/ci_worktree_status.txt
      - name: Install Icarus Verilog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V 2>&1 | tee build/simulator_version.txt
          vvp -V 2>&1 | tee build/runtime_version.txt
      - name: Execute self-contained test-only suite
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_stage1.sh 2>&1 | tee build/stage1_simulation.log
      - name: Persist logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv-stage1-qa-evidence
          path: |
            build/ci_checked_sha.txt
            build/ci_worktree_status.txt
            build/simulator_version.txt
            build/runtime_version.txt
            build/stage1_simulation.log
          retention-days: 90
          if-no-files-found: error

  full_weave_root:
    # Never run this heavyweight job on the QA branch's own push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Check provenance and run bounded 22528-bit full root
        run: |
          set -euo pipefail
          mkdir -p build
          git rev-parse HEAD | tee build/fullroot_head.txt
          ulimit -v 4194304
          bash scripts/verify_weave_fullroot.sh
      - name: Upload root evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-full-weave-root-qa
          path: |
            build/fullroot_head.txt
            build/weave_fullroot_probe.log
            build/weave_fullroot_run.log
            build/foundation_weave_root.bin
            build/weave_fullrank_run.log
            build/foundation_weave_rank.bin
            build/weave_prefix11_run.log
            build/foundation_weave_prefix11.bin
            build/weave_prefix2_run.log
            build/weave_prefix121_run.log
            build/foundation_weave_prefix121.bin
            build/weave_prefix3_run.log
            build/foundation_weave_prefix122.bin
            build/foundation_weave_prefix123.bin
            build/weave_prefix1231_run.log
            build/foundation_weave_prefix1231.bin
            build/weave_prefix4_run.log
            build/foundation_weave_prefix1232.bin
            build/foundation_weave_prefix1233.bin
            build/foundation_weave_prefix1234.bin
          retention-days: 90
          if-no-files-found: warn

  fifth_weave_symbol:
    # Separate budget. Reuse ONLY the immutable verified artifact
    # from run 39965349618, then SHA-verify every required binary.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download prior independently verified root/rank/prefix blocks
        uses: actions/download-artifact@v4
        with:
          name: stage1-full-weave-root-qa
          run-id: 39965349618
          github-token: ${{ github.token }}
          path: build
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Verify immutable input hashes and fifth ordinal
        run: |
          set -euo pipefail
          ulimit -v 4194304
          git rev-parse HEAD | tee build/prefix5_checked_sha.txt
          bash scripts/verify_weave_prefix5.sh
      - name: Preserve SHA evidence, count and chosen block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-prefix5-evidence
          path: |
            build/prefix5_checked_sha.txt
            build/fullroot_head.txt
            build/weave_prefix12341_run.log
            build/foundation_weave_prefix12341.bin
            build/weave_prefix5_run.log
            build/foundation_weave_prefix12342.bin
            build/foundation_weave_prefix12343.bin
            build/foundation_weave_prefix12344.bin
            build/foundation_weave_prefix12345.bin
          retention-days: 90
          if-no-files-found: warn

  sixth_weave_symbol:
    # Reuse immutable successful root and fifth-prefix artifacts.
    # This avoids recomputing the previous 35-minute root chain.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download complete historical root and first-four blocks
        uses: actions/download-artifact@v4
        with:
          name: stage1-full-weave-root-qa
          run-id: 39965349618
          github-token: ${{ github.token }}
          path: build/root_source
      - name: Download successful fifth-symbol blocks
        uses: actions/download-artifact@v4
        with:
          name: stage1-prefix5-evidence
          run-id: 39981519434
          github-token: ${{ github.token }}
          path: build/fifth_source
      - name: Copy fixed source files without trusting them implicitly
        run: |
          set -euo pipefail
          cp build/root_source/foundation_weave_*.bin build/
          cp build/fifth_source/foundation_weave_*.bin build/
          cp build/root_source/fullroot_head.txt build/
          cp build/fifth_source/prefix5_checked_sha.txt build/
          echo "STAGE1_SIXTH_PRIOR_ARTIFACTS_STAGED"
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Exact sixth-prefix completion and rank checks
        run: |
          set -euo pipefail
          ulimit -v 4194304
          git rev-parse HEAD | tee build/prefix6_checked_sha.txt
          bash scripts/verify_weave_prefix6.sh
      - name: Save sixth-symbol provenance and witness binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-prefix6-evidence
          path: |
            build/prefix6_checked_sha.txt
            build/fullroot_head.txt
            build/prefix5_checked_sha.txt
            build/weave_prefix123451_run.log
            build/foundation_weave_prefix123451.bin
            build/weave_prefix6_run.log
            build/foundation_weave_prefix123452.bin
            build/foundation_weave_prefix123453.bin
            build/foundation_weave_prefix123454.bin
            build/foundation_weave_prefix123455.bin
            build/foundation_weave_prefix123456.bin
          retention-days: 90
          if-no-files-found: warn

  seventh_weave_symbol:
    # Three immutable earlier SUCCEEDED jobs, each with SHA-pinned
    # source and binary evidence. No dependency on running parallel jobs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download fullroot and first-four proven binary blocks
        uses: actions/download-artifact@v4
        with:
          name: stage1-full-weave-root-qa
          run-id: 39965349618
          github-token: ${{ github.token }}
          path: build/root_source
      - name: Download fifth-symbol binary blocks
        uses: actions/download-artifact@v4
        with:
          name: stage1-prefix5-evidence
          run-id: 39981519434
          github-token: ${{ github.token }}
          path: build/fifth_source
      - name: Download sixth-symbol binary blocks
        uses: actions/download-artifact@v4
        with:
          name: stage1-prefix6-evidence
          run-id: 40001527283
          github-token: ${{ github.token }}
          path: build/sixth_source
      - name: Stage only the prior outputs, preserving origin proofs
        run: |
          set -euo pipefail
          cp build/root_source/foundation_weave_*.bin build/
          cp build/fifth_source/foundation_weave_*.bin build/
          cp build/sixth_source/foundation_weave_*.bin build/
          cp build/root_source/fullroot_head.txt build/
          cp build/fifth_source/prefix5_checked_sha.txt build/
          cp build/sixth_source/prefix6_checked_sha.txt build/
          echo "STAGE1_SEVENTH_PREVIOUS_ARTIFACTS_STAGED"
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Bound and verify seventh canonical month ordinal
        run: |
          set -euo pipefail
          ulimit -v 4194304
          git rev-parse HEAD | tee build/prefix7_checked_sha.txt
          bash scripts/verify_weave_prefix7.sh
      - name: Preserve seventh-symbol audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-prefix7-evidence
          path: |
            build/prefix7_checked_sha.txt
            build/fullroot_head.txt
            build/prefix5_checked_sha.txt
            build/prefix6_checked_sha.txt
            build/weave_prefix1234561_run.log
            build/foundation_weave_prefix1234561.bin
            build/weave_prefix7_run.log
            build/foundation_weave_prefix1234562.bin
            build/foundation_weave_prefix1234563.bin
            build/foundation_weave_prefix1234564.bin
            build/foundation_weave_prefix1234565.bin
            build/foundation_weave_prefix1234566.bin
            build/foundation_weave_prefix1234567.bin
          retention-days: 90
          if-no-files-found: warn

  eighth_weave_symbol:
    # Four immutable succeeded source jobs; independently pin
    # source merge SHA + SHA256 of every 2809-byte binary.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read prior fullroot evidence
        uses: actions/download-artifact@v4
        with:
          name: stage1-full-weave-root-qa
          run-id: 39965349618
          github-token: ${{ github.token }}
          path: build/source_root
      - name: Read prior fifth-symbol evidence
        uses: actions/download-artifact@v4
        with:
          name: stage1-prefix5-evidence
          run-id: 39981519434
          github-token: ${{ github.token }}
          path: build/source_fifth
      - name: Read prior sixth-symbol evidence
        uses: actions/download-artifact@v4
        with:
          name: stage1-prefix6-evidence
          run-id: 40001527283
          github-token: ${{ github.token }}
          path: build/source_sixth
      - name: Read prior seventh-symbol evidence
        uses: actions/download-artifact@v4
        with:
          name: stage1-prefix7-evidence
          run-id: 40125682591
          github-token: ${{ github.token }}
          path: build/source_seventh
      - name: Stage all fixed prior proof inputs
        run: |
          set -euo pipefail
          cp build/source_root/foundation_weave_*.bin build/
          cp build/source_fifth/foundation_weave_*.bin build/
          cp build/source_sixth/foundation_weave_*.bin build/
          cp build/source_seventh/foundation_weave_*.bin build/
          cp build/source_root/fullroot_head.txt build/
          cp build/source_fifth/prefix5_checked_sha.txt build/
          cp build/source_sixth/prefix6_checked_sha.txt build/
          cp build/source_seventh/prefix7_checked_sha.txt build/
          echo "STAGE1_EIGHTH_PRIOR_EVIDENCE_STAGED"
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Verify 64-bit ratio and exact eighth ordinal
        run: |
          set -euo pipefail
          ulimit -v 4194304
          git rev-parse HEAD | tee build/prefix8_checked_sha.txt
          bash scripts/verify_weave_prefix8.sh
      - name: Preserve eighth-symbol audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-prefix8-evidence
          path: |
            build/prefix8_checked_sha.txt
            build/fullroot_head.txt
            build/prefix5_checked_sha.txt
            build/prefix6_checked_sha.txt
            build/prefix7_checked_sha.txt
            build/weave_prefix12345671_run.log
            build/foundation_weave_prefix12345671.bin
            build/weave_prefix8_run.log
            build/foundation_weave_prefix12345672.bin
            build/foundation_weave_prefix12345673.bin
            build/foundation_weave_prefix12345674.bin
            build/foundation_weave_prefix12345675.bin
            build/foundation_weave_prefix12345676.bin
            build/foundation_weave_prefix12345677.bin
            build/foundation_weave_prefix12345678.bin
          retention-days: 90
          if-no-files-found: warn
