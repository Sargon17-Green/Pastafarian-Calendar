# QA only. Stage02 closure subset; no Slice25 matrix replay.
name: SQL Tamil Stage02 closure catalog and exact arithmetic PG17
on:
  push:
    branches: ['SQL\+தமிழ்']
    paths:
      - '.github/workflows/sql-tamil-stage02-closure-catalog-numeric.yml'
permissions:
  contents: read
jobs:
  catalog-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lock exact production inputs and generate independent probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p closure-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'SQL+தமிழ்'
          printf 'SHA=%s\nBRANCH=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > closure-evidence/versions.txt
          while read -r expected file; do
            actual="$(git hash-object "$file")"
            printf '%s %s\n' "$actual" "$file" >> closure-evidence/locks.txt
            test "$expected" = "$actual"
            sha256sum "$file" >> closure-evidence/source-sha256.txt
          done <<'LOCKS'
          9ca6f6ea5b3932facbe92aee6a2b38f6557cedd5 sql/00_schema.sql
          b28730931e26ee65eaf9108621320d73f458ba07 sql/01_source_language_catalog.sql
          3367fe9c34e830b0bd99049ebef64398d150cd79 sql/02_monster_bootstrap.sql
          72ae68d3ec009f65f081a099c8bf06e0dd3ed9d6 sql/03_stage02_production_core.sql
          caed82dc41d7a259953dc817d5e0722038821310 sql/04_stage02_stone_states.sql
          f465b466d4a00e24baa689561725a12e5478bf55 sql/05_stage02_hidden_drop.sql
          caf2991b2ae89f99074d80814655d162f6c68b78 sql/06_stage02_visible_drops.sql
          0ad25cc4054f46fba66c10dfeffcd81d49f32399 sql/07_stage02_bowls.sql
          f84f0ac6c2b570aa3ef61038247a44e602014534 sql/08_stage02_bowl_round.sql
          2f2f2e19e8851b3130f3c3d5edafd5dfbc6923f9 sql/09_stage02_post_stir_round.sql
          c5c6be7c02c255382ae7c317bfbf17138a12788c sql/10_stage02_sauce.sql
          b9339560c58cd7a6ab13871ad144257e01c26b84 sql/11_stage02_answer_stream.sql
          bde130055cead8d3e5677acac516af7329819748 sql/12_stage02_choose_rank.sql
          d4044e6a4f2f2ae94795233dd3aa14a7d7edaf9e sql/13_stage02_gate_gaps.sql
          be1d5450f37e3448f7683aea2a0cabdd4620a6c0 sql/14_stage02_gate_day_selector.sql
          4d0ad4326b2488e8d2260ffff37f0a93ce49e4f9 sql/15_stage02_year5000_gate_candidates.sql
          b2fd62c17b133c639f8751fe2eaa03e93ae167f5 sql/16_stage02_year5000.sql
          116e330d0215f58e23e94b4b573071ad24d44664 sql/17_stage02_adjacent_year_navigation.sql
          c204a314972b22a4a38f06a02c2fe1bd5bde7acf sql/18_stage02_target_year_navigation.sql
          d9e11559c4b3a3a2497dc5cf903c66aba007af40 sql/19_stage02_cutlet_count.sql
          42acfb80e9eabfd9d091176643763ee7d7bca9ee sql/20_stage02_cutlet_partition.sql
          5d32a391e1b5609ef790d6a6731ae6713db85a28 sql/21_stage02_cutlet_names.sql
          3a23c9a1b5ccae667e3e8990005f4b37480df7e4 sql/22_stage02_month_count.sql
          0fdcaaa03121692ea9762f79cd08e9aedb0ca24c sql/23_stage02_month_lengths.sql
          a48f611d205763ee5dc7c21da7ddf1c9cfa20e8c sql/24_stage02_month_weaving.sql
          43c2a6f1071f3e2c9b3ca0225154e42dd2a0de53 sql/25_stage02_month_names.sql
          faac634a06aee59354de207eb088e4e9996034fa sql/26_stage02_year_structure.sql
          748d4bc1f7754f003c29a42a1756f26e08c1669b sql/27_stage02_calendar_date.sql
          LOCKS
          test "$(wc -l < closure-evidence/locks.txt)" -eq 28
          test "$(find sql -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 28
          python3 - <<'PY'
          from pathlib import Path
          M = 170141183460469231731687303715884105727
          powers = [1]
          for _ in range(8):
              powers.append(powers[-1] * M)
          ranks = sorted({1,2,M-1,M,M+1,2*M+1,*[p+d for p in powers[2:] for d in (-1,0,1)]})
          cases = []
          for n in ranks:
              for first in (1,2,M//2,M-1,M):
                  for direction in (-1,1):
                      space,k=M,1
                      while space<n:
                          space*=M
                          k+=1
                      ticket=1
                      place=1
                      for j in range(k):
                          ticket+=((first-1+direction*j)%M)*place
                          place*=M
                      limit=(space//n)*n
                      chosen=ticket if ticket<=limit else (1 if direction==1 else limit)
                      expected=1+(chosen-1)%n
                      cases.append(f"({first}::numeric,{direction},{n}::numeric,{expected}::numeric)")
          sql = """BEGIN READ ONLY;
          SET LOCAL statement_timeout = '90s';
          SELECT 'CATALOG_COUNTS='||count(*)||':'||count(*) FILTER (WHERE l.lanname='sql')||':'||count(*) FILTER (WHERE l.lanname='plpgsql') FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace JOIN pg_language l ON l.oid=p.prolang WHERE n.nspname='pastafari_sql_tamil';
          SELECT 'FUNCTION='||p.proname||'|'||pg_get_function_identity_arguments(p.oid)||'|'||pg_get_function_result(p.oid)||'|'||l.lanname||'|'||p.provolatile||'|'||p.proisstrict FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace JOIN pg_language l ON l.oid=p.prolang WHERE n.nspname='pastafari_sql_tamil' ORDER BY p.proname,pg_get_function_identity_arguments(p.oid);
          SELECT 'TEST_SCHEMA_COUNT='||count(*) FROM pg_namespace WHERE nspname LIKE 'pastafari_sql_tamil%test%';
          SELECT 'TEST_BODY_COUNT='||count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='pastafari_sql_tamil' AND p.prosrc ILIKE '%pastafari_sql_tamil_test%';
          SELECT 'TABLE_COUNT='||count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='pastafari_sql_tamil' AND c.relkind IN ('r','p');
          SELECT 'DEPENDENCY='||pg_describe_object(d.classid,d.objid,d.objsubid)||' -> '||pg_describe_object(d.refclassid,d.refobjid,d.refobjsubid)||'|'||d.deptype FROM pg_depend d JOIN pg_proc p ON d.classid='pg_proc'::regclass AND d.objid=p.oid JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='pastafari_sql_tamil' ORDER BY 1;
          """
          sql += "WITH v(j,want) AS (VALUES "+",".join(f"({i},{p}::numeric)" for i,p in enumerate(powers))+") SELECT 'POWER='||count(*)||':'||count(*) FILTER(WHERE power(170141183460469231731687303715884105727::numeric,j::numeric) IS DISTINCT FROM want) FROM v;\n"
          sql += "WITH v(first_value,direction,n,want) AS (VALUES "+",".join(cases)+"), actual AS MATERIALIZED (SELECT want,pastafari_sql_tamil.choose_rank(ROW(first_value,direction)::pastafari_sql_tamil.answer_stream,n) AS got FROM v) SELECT 'RANK='||count(*)||':'||count(*) FILTER(WHERE got IS DISTINCT FROM want) FROM actual;\n"
          sql += """WITH v AS (SELECT d,r,(d+122)/123 AS lo,least(47,d/4) AS hi FROM generate_series(252,5778) d CROSS JOIN generate_series(0,48) r), actual AS MATERIALIZED (SELECT CASE WHEN r BETWEEN 1 AND hi-lo+1 THEN lo+r-1 ELSE NULL END AS want,pastafari_sql_tamil.month_count_by_rank(d,r) AS got FROM v) SELECT 'MONTH='||count(*)||':'||count(*) FILTER(WHERE got IS DISTINCT FROM want) FROM actual;
          SELECT 'MONTH_INVALID='||count(*)||':'||count(*) FILTER(WHERE pastafari_sql_tamil.month_count_by_rank(d,r) IS NOT NULL) FROM (VALUES (251::numeric,1::numeric),(5779,1),(252.5,1),(252,1.5),(NULL,1),(252,NULL)) v(d,r);
          COMMIT;
          """
          Path("closure-evidence/probes.sql").write_text(sql,encoding="utf-8")
          Path("closure-evidence/expected.txt").write_text(f"CATALOG_COUNTS=62:49:13\nTEST_SCHEMA_COUNT=0\nTEST_BODY_COUNT=0\nTABLE_COUNT=2\nPOWER={len(powers)}:0\nRANK={len(cases)}:0\nMONTH={len(range(252,5779))*49}:0\nMONTH_INVALID=6:0\n",encoding="utf-8")
          PY
          cat closure-evidence/expected.txt
          sha256sum '.github/workflows/sql-tamil-stage02-closure-catalog-numeric.yml' closure-evidence/probes.sql closure-evidence/expected.txt >> closure-evidence/source-sha256.txt
      - name: Start isolated PostgreSQL 17.12
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name sql-tamil-closure-pg --network none -e POSTGRES_HOST_AUTH_METHOD=trust -v "$GITHUB_WORKSPACE:/work:ro" postgres:17.12
          ready=0
          for i in $(seq 1 60); do
            if docker exec -u postgres sql-tamil-closure-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres sql-tamil-closure-pg postgres --version | tee -a closure-evidence/versions.txt
          docker exec -u postgres sql-tamil-closure-pg psql --version | tee -a closure-evidence/versions.txt
      - name: Load production only and execute read-only catalog and numeric QA
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while read -r expected file; do args+=(-f "/work/$file"); done < closure-evidence/locks.txt
          pg=(docker exec -u postgres sql-tamil-closure-pg psql -At -X -v ON_ERROR_STOP=1 -U postgres -d postgres)
          set +e
          timeout --kill-after=10s 90s "${pg[@]}" "${args[@]}" > closure-evidence/load.log 2>&1
          code=$?
          set -e
          printf 'LOAD_PSQL_EXIT=%s\n' "$code" > closure-evidence/load-exit.txt
          cat closure-evidence/load.log
          test "$code" -eq 0
          snapshot="SELECT 'metrics='||count(*)||':'||coalesce(jsonb_agg(to_jsonb(t) ORDER BY metric_key)::text,'[]') FROM pastafari_sql_tamil.monster_metrics t; SELECT 'logs='||count(*)||':'||coalesce(jsonb_agg(to_jsonb(t) ORDER BY log_id)::text,'[]') FROM pastafari_sql_tamil.monster_logs t; SELECT 'sequence='||last_value||':'||is_called FROM pastafari_sql_tamil.monster_logs_log_id_seq;"
          timeout 30s "${pg[@]}" -c "$snapshot" > closure-evidence/before.txt
          set +e
          timeout --kill-after=10s 180s "${pg[@]}" -f /work/closure-evidence/probes.sql > closure-evidence/results.txt 2>&1
          code=$?
          set -e
          printf 'PSQL_EXIT=%s\n' "$code" > closure-evidence/exit.txt
          cat closure-evidence/results.txt
          timeout 30s "${pg[@]}" -c "$snapshot" > closure-evidence/after.txt
          cmp closure-evidence/before.txt closure-evidence/after.txt
          test "$code" -eq 0
          while IFS= read -r expected; do
            test "$(grep -Fxc "$expected" closure-evidence/results.txt)" -eq 1
          done < closure-evidence/expected.txt
          test "$(grep -c '^FUNCTION=' closure-evidence/results.txt)" -eq 62
          printf 'CATALOG_NUMERIC_SUBSET_GREEN\n' > closure-evidence/completion.txt
      - name: Hash original evidence
        if: always()
        run: |
          if [ -d closure-evidence ]; then
            find closure-evidence -type f ! -name artifact-files-sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > closure-evidence/artifact-files-sha256.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-tamil-closure-catalog-numeric-${{ github.run_id }}
          path: closure-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Remove isolated database
        if: always()
        run: docker rm -f sql-tamil-closure-pg 2>/dev/null || true
