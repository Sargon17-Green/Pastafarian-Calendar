name: MATLAB Real Year-5000 First Three Days Rank Inversion (Experiment)

on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'src/\+pastafari/rankGeneralWeavePrefix.m'
      - 'tests/run_stage55_real_year_5000_three_day_inverse.m'
      - '.github/workflows/matlab-stage55-real-year-three-day-inverse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-three-day-inverse:
    name: MATLAB R2026a / 4244-day actual unopened full-year inverse
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
      - name: Setup MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Rank actual three-day interior prefix via joint BigInt DP
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); run_stage55_real_year_5000_three_day_inverse
