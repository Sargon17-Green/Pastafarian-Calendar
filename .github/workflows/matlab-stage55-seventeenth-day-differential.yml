name: MATLAB Stage55 Seventeenth Day Native Python Differential
on:
  push:
    branches:
      - 'MATLAB\+Polski'
    paths:
      - 'tools/run_stage55_year5000_seventeenth_native.m'
      - 'tools/stage55_after17_interval_five_fields.py'
      - '.github/workflows/matlab-stage55-seventeenth-day-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage55-seventeenth-day-MATLAB-Polski
  cancel-in-progress: false
jobs:
  seventeenth-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Download certified AFTER16 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: stage55-sixteenth-day-differential
          run-id: 41285498541
          github-token: ${{ github.token }}
          path: logs
      - name: Verify pinned AFTER16
        run: |
          echo '2cdb9048e615c7fec15889b3efdcf89ca5b2455783b6efe89d7c82744d68d001  logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_16.json' | sha256sum -c -
      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Native seventeenth-day exact cursor and PATCH25 projection
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); run_stage55_year5000_seventeenth_native
      - name: Python independent child intervals and strict five-field diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage55_after17_interval_five_fields.py \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_16.json \
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_17.json \
            tests/fixtures/stage55_year5000_appendix_a_metadata.json \
            | tee logs/STAGE55_SEVENTEENTH_PYTHON.log
          grep '^STAGE55_SEVENTEENTH_ROW ' logs/STAGE55_SEVENTEENTH_PYTHON.log > logs/STAGE55_SEVENTEENTH_PYTHON_ROW.txt
          grep '^STAGE55_SEVENTEENTH_ROW ' logs/STAGE55_SEVENTEENTH_NATIVE.log > logs/STAGE55_SEVENTEENTH_NATIVE_ROW.txt
          test "$(wc -l < logs/STAGE55_SEVENTEENTH_PYTHON_ROW.txt)" -eq 1
          test "$(wc -l < logs/STAGE55_SEVENTEENTH_NATIVE_ROW.txt)" -eq 1
          diff -u logs/STAGE55_SEVENTEENTH_PYTHON_ROW.txt logs/STAGE55_SEVENTEENTH_NATIVE_ROW.txt
          expected="STAGE55_SEVENTEENTH_ROW POSITION=17 YEAR=5000 CUTLET_INDEX=15 CUTLET_DAY=17 MONTH_INDEX=1 MONTH_DAY=1"
          grep -Fqx "$expected" logs/STAGE55_SEVENTEENTH_NATIVE_ROW.txt
          grep -Fqx "$expected" logs/STAGE55_SEVENTEENTH_PYTHON_ROW.txt
          sha256sum logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_17.json | tee logs/STAGE55_SEVENTEENTH_DIGEST.txt
          echo 'STAGE55_SEVENTEENTH_DAY_DIFFERENTIAL_PASS CASES=1 FIELDS=5 NEGATIVE=2'
      - name: Preserve PASS or FAIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage55-seventeenth-day-differential
          path: |
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_16.json
            logs/STAGE55_REAL_YEAR_INNER_CURSOR_AFTER_17.json
            logs/STAGE55_SEVENTEENTH_NATIVE.log
            logs/STAGE55_SEVENTEENTH_PYTHON.log
            logs/STAGE55_SEVENTEENTH_PYTHON_ROW.txt
            logs/STAGE55_SEVENTEENTH_NATIVE_ROW.txt
            logs/STAGE55_SEVENTEENTH_DIGEST.txt
          if-no-files-found: warn
          retention-days: 30
