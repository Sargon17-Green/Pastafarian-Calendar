name: Befunge QA09 bounded Native timeout diagnostic
on:
  push:
    branches:
      - qa-befunge98-stage1-order-isolation-20261008
    paths:
      - 'qa/stage1_spaghetti09_timeout_diagnostic.py'
      - 'qa/QA09_NATIVE_80_OPCODE_TIMEOUT_DIAGNOSTIC_2026-11-03.md'
      - '.github/workflows/befunge-stage1-spaghetti09-timeout-diagnostic.yml'
      - 'src/interleaved_work_counts.b98'
      - 'qa/spaghetti08_17d_concurrent_stack_residue.beq'
      - 'qa/spaghetti09_nd17_two_worker_rendezvous_fixture.beq'
      - 'qa/spaghetti09_17d_two_shard_eighty_opcode_candidate.beq'
      - 'qa/SPAGHETTI09_17D_EIGHTY_OPCODE_MANIFEST.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa09-timeout-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cwesson/funge-plus-plus
          ref: cd6d7f005b4fc33b486fcc2380b35406f6125ca4
          path: third_party/funge-plus-plus
          submodules: recursive
          persist-credentials: false
      - name: Pin all QA09 inputs and engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/interleaved_work_counts.b98)" = '560d6aa5807a7f766213a33835cce85eab0fa40c'
          test "$(git hash-object qa/spaghetti08_17d_concurrent_stack_residue.beq)" = '4ba6902de08cf9483374f43a33f1d4ae7a14e3f6'
          test "$(git hash-object qa/spaghetti09_nd17_two_worker_rendezvous_fixture.beq)" = 'e22a8b706fb84e3356db6c70aac29b9145642201'
          test "$(git hash-object qa/spaghetti09_17d_two_shard_eighty_opcode_candidate.beq)" = '275cec0add8705565d27da4233860bf42d134a27'
          test "$(git hash-object qa/SPAGHETTI09_17D_EIGHTY_OPCODE_MANIFEST.json)" = '95fa7eb37dfef24d0bf5a5dc157bd97324a6a08a'
          test "$(git -C third_party/funge-plus-plus rev-parse HEAD)" = 'cd6d7f005b4fc33b486fcc2380b35406f6125ca4'
          python3 -m py_compile qa/stage1_spaghetti09_timeout_diagnostic.py
      - name: Build and smoke-test pinned Native engine
        shell: bash
        run: |
          set -euo pipefail
          make -C third_party/funge-plus-plus funge
          test "$(timeout 12 third_party/funge-plus-plus/bin/funge third_party/funge-plus-plus/test/example5d.beq)" = "Hello World"
      - name: Profile one exact Native timeout and one Funge control
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 180s python3 -u qa/stage1_spaghetti09_timeout_diagnostic.py | tee qa09-timeout-diagnostic.console.log
          grep -q QA09_DIAGNOSTIC_COMPLETE qa09_timeout_diagnostic.log
      - name: Preserve bounded diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: befunge-qa09-native-timeout-diagnostic
          path: |
            qa09_timeout_diagnostic.json
            qa09_timeout_diagnostic.log
            qa09-timeout-diagnostic.console.log
          if-no-files-found: warn
          retention-days: 30
