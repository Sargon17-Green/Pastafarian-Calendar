name: Soak v057 quarantine two real original date process receipts in CrashStore (no Fct)
on:
  push:
    branches:
      - qa/soak-readiness-20261114
    paths:
      - "soak/runner/quarantined_two_day_pilot_v057.py"
      - "soak/runner/recovery_store.py"
      - "soak/process_tests/test_original_two_day_quarantine_v057.py"
      - ".github/workflows/soak-quarantine-original-two-day-v057.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-two-day-crash-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: coordinator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: original-python
          ref: 0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: original-kotlin
          ref: 0c703446d8a3b7435698bd16402ac5fa30e461c9
          persist-credentials: false
      - name: Verify original commits, exact source SHA, and fetch immutable v053 ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          test "$(git -C original-python rev-parse HEAD)" = 0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4
          test "$(git -C original-kotlin rev-parse HEAD)" = 0c703446d8a3b7435698bd16402ac5fa30e461c9
          test -z "$(git -C original-python status --porcelain)"
          test -z "$(git -C original-kotlin status --porcelain)"
          mkdir -m 700 evidence
          mkdir -p original-sources/Python-Turkce/0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4/tests
          cp original-python/tests/normative_reference.py \
            original-sources/Python-Turkce/0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4/tests/
          echo '75d56765b45892940326f67bd85a2c7c9874c01e43b49ee3553c9f6192d94378  original-sources/Python-Turkce/0e4e75886dea4f4c7e0b6e39cce79e1d66f046f4/tests/normative_reference.py' \
            | sha256sum -c -
          gh api repos/Sargon17-Green/Pastafarian-Calendar/actions/artifacts/14186295655/zip \
            > evidence/real-original-v053.zip
          echo 'f87b2e925b4a400cff2e2469be5b873b66c89ca35498e8fcda1090ab55d5d390  evidence/real-original-v053.zip' \
            | sha256sum -c -
          echo "V057_PINNED_ORIGINAL_ARTIFACT_INPUT_VERIFIED"
      - name: Test 18 real two-day original process evidence crash and tamper scenarios
        shell: bash
        env:
          PASTAFARI_V053_REAL_ZIP: evidence/real-original-v053.zip
          PASTAFARI_ORIGINAL_PYTHON_ROOT: original-sources
          PASTAFARI_ORIGINAL_KOTLIN_GIT: original-kotlin
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s coordinator/soak/process_tests \
            -p 'test_original_two_day_quarantine_v057.py' -v \
            2>&1 | tee evidence/v057-real-evidence-ledger-tests.log
          grep -Eq '^Ran 18 tests ' evidence/v057-real-evidence-ledger-tests.log
          grep -q '^OK$' evidence/v057-real-evidence-ledger-tests.log
          echo 'V057_REAL_SOURCE_ARTIFACT_LEDGER_18_TESTS_PASS_NO_YEAR_CREDIT'
      - name: Verify no converter invoked and preserve noncertifying evidence
        shell: bash
        run: |
          set -euo pipefail
          echo 'ORIGINAL_NATIVE_FCT_CALLS_THIS_WORKFLOW=0'
          echo 'ORIGINAL_FULL_YEAR_SOAK_CERTIFICATES_ISSUED=0'
          echo 'SOURCE_LINEAGE_CERTIFIED=false'
      - name: Upload test log only, never a fabricated original year pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-v057-original-two-day-quarantine-ledger-no-year
          path: evidence/v057-real-evidence-ledger-tests.log
          if-no-files-found: warn
          retention-days: 30
