name: SQL Tamil Slice25 Selector Primitive Diagnostic PG17
on:
  push:
    branches: ['SQL\+தமிழ்']
    paths:
      - 'sql/test/155_stage25_selector_hop_input.py'
      - 'sql/test/156_stage25_selector_hop_benchmark.sql'
      - '.github/workflows/sql-tamil-stage02-selector-hop-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selector-hop:
    strategy:
      fail-fast: false
      matrix:
        pair: [seed, next_1, next_2, next_3, next_3_next, prev_3, prev_3_prev]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAIR: ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact sources and generate one adjacent-hop probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p slice25-hop-evidence
          printf 'GITHUB_SHA=%s\nPAIR=%s\n' "$GITHUB_SHA" "$PAIR" > slice25-hop-evidence/versions.txt
          python3 --version | tee -a slice25-hop-evidence/versions.txt
          python3 sql/test/155_stage25_selector_hop_input.py \
            --locked-records sql/test/152_stage25_selector_locked_years.jsonl \
            --self-test | tee slice25-hop-evidence/selftest.txt
          grep -qx 'SLICE25_HOP_GENERATOR_SELF_TEST=7/7 PASS' slice25-hop-evidence/selftest.txt
          python3 sql/test/155_stage25_selector_hop_input.py \
            --locked-records sql/test/152_stage25_selector_locked_years.jsonl \
            --pair "$PAIR" --output slice25-hop-evidence/input.sql \
            | tee slice25-hop-evidence/fixture-check.txt
          grep -qx 'SLICE25_HOP_SOURCE_LOCK=8_years_7_pairs PASS' slice25-hop-evidence/fixture-check.txt
          grep -qx "SLICE25_HOP_INPUT_GENERATED=$PAIR" slice25-hop-evidence/fixture-check.txt
          sha256sum sql/test/152_stage25_selector_locked_years.jsonl \
            sql/test/155_stage25_selector_hop_input.py \
            sql/test/156_stage25_selector_hop_benchmark.sql \
            .github/workflows/sql-tamil-stage02-selector-hop-diagnostic.yml \
            > slice25-hop-evidence/source-sha256.txt
          for i in $(seq -w 0 26); do
            mapfile -t matches < <(find sql -maxdepth 1 -name "$i"'_*.sql' -type f)
            test "${#matches[@]}" -eq 1
            sha256sum "${matches[0]}" >> slice25-hop-evidence/source-sha256.txt
          done
          sha256sum slice25-hop-evidence/input.sql > slice25-hop-evidence/generated-sha256.txt
      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name slice25-hop-pg --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$GITHUB_WORKSPACE:/work:ro" postgres:17
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres slice25-hop-pg pg_isready -q -U postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -u postgres slice25-hop-pg postgres --version | tee -a slice25-hop-evidence/versions.txt
      - name: Measure one actual primitive and verify five fields
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for i in $(seq -w 0 26); do
            mapfile -t matches < <(find sql -maxdepth 1 -name "$i"'_*.sql' -type f)
            test "${#matches[@]}" -eq 1
            args+=(-f "/work/${matches[0]}")
          done
          args+=(-f /work/slice25-hop-evidence/input.sql)
          args+=(-f /work/sql/test/156_stage25_selector_hop_benchmark.sql)
          docker exec -u postgres slice25-hop-pg \
            psql -At -X -v ON_ERROR_STOP=1 -U postgres -d postgres "${args[@]}" \
            2>&1 | tee slice25-hop-evidence/postgres-results.txt
          grep -q 'SLICE25_HOP_GREEN=1' slice25-hop-evidence/postgres-results.txt
          test "$(grep -c 'SLICE25_HOP_FIELD_PASS=' slice25-hop-evidence/postgres-results.txt)" -eq 5
          grep -q 'SLICE25_HOP_ELAPSED_MS ' slice25-hop-evidence/postgres-results.txt
          printf 'SOURCE_LOCKED_PRIMITIVE_PROBE=1\n' > slice25-hop-evidence/completion.txt
      - name: Preserve original evidence even on failure or timeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-tamil-slice25-hop-${{ matrix.pair }}
          path: slice25-hop-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop isolated PostgreSQL 17
        if: always()
        shell: bash
        run: docker rm -f slice25-hop-pg 2>/dev/null || true
