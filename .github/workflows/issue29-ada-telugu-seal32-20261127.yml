      - name: Install isolated job dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update > evidence/apt-update.log 2>&1
          sudo apt-get install -y gnat-13 gprbuild libgnatcoll-gmp-dev > evidence/apt-install.log 2>&1
          gnatmake --version > evidence/gnat-version.txt
          gprbuild --version > evidence/gprbuild-version.txt
          dpkg-query -W gnat-13 gprbuild libgnatcoll-gmp-dev > evidence/packages.txt
      - name: One bounded build and one Seal32 replay
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE="$GITHUB_WORKSPACE/evidence"
          export WORK="$RUNNER_TEMP/seal32-work"
          cat > "$RUNNER_TEMP/seal32-run.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          ulimit -v 1048576
          ulimit -t 180
          cd "$WORK"
          group=$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup)
          test -n "$group"
          cg="/sys/fs/cgroup$group"
          cat "$cg/memory.max" > "$EVIDENCE/memory-max.txt"
          cat "$cg/memory.swap.max" > "$EVIDENCE/memory-swap-max.txt"
          test "$(cat "$EVIDENCE/memory-max.txt")" = 1073741824
          test "$(cat "$EVIDENCE/memory-swap-max.txt")" = 0
          trap 'cat "$cg/memory.events" > "$EVIDENCE/memory-events.txt"; if test -r "$cg/memory.peak"; then cat "$cg/memory.peak" > "$EVIDENCE/memory-peak.txt"; fi' EXIT
          set +e
          /usr/bin/time -v -o "$EVIDENCE/build-time.txt" gprbuild -p -j1 -P seal32_replay.gpr > "$EVIDENCE/build.stdout" 2> "$EVIDENCE/build.stderr"
          rc=$?
          echo "$rc" > "$EVIDENCE/build.exit"
          test "$rc" = 0 || exit "$rc"
          sha256sum bin/seal32_replay > "$EVIDENCE/binary.sha256"
          /usr/bin/time -v -o "$EVIDENCE/run-time.txt" bin/seal32_replay > "$EVIDENCE/run.stdout" 2> "$EVIDENCE/run.stderr"
          rc=$?
          echo "$rc" > "$EVIDENCE/run.exit"
          exit "$rc"
          SH
          cp "$RUNNER_TEMP/seal32-run.sh" evidence/
          set +e
          /usr/bin/time -v -o evidence/scope-time.txt sudo systemd-run --scope --quiet -p MemoryMax=1073741824 -p MemorySwapMax=0 -- /usr/sbin/runuser -u "$USER" -- env WORK="$WORK" EVIDENCE="$EVIDENCE" LC_ALL=C /usr/bin/timeout -k 5s 175s /bin/bash "$RUNNER_TEMP/seal32-run.sh"
          rc=$?
          set -e
          echo "$rc" > evidence/scope.exit
          test "$rc" = 0
          test "$(cat evidence/build.exit)" = 0
          test "$(cat evidence/run.exit)" = 0
          test ! -s evidence/run.stderr
          test "$(grep -Fxc 'SEAL32_COMPONENT_PASS ids=4244 projection=8,20,56' evidence/run.stdout)" = 1
          cat evidence/run.stdout
          git diff --exit-code HEAD -- src tests
      - name: Freeze evidence even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('evidence')
          m={x.name:{'bytes':x.stat().st_size,'sha256':hashlib.sha256(x.read_bytes()).hexdigest()} for x in sorted(p.iterdir()) if x.is_file() and x.name!='members.sha256.json'}
          (p/'members.sha256.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue29-ada-telugu-seal32-20261127
          path: evidence/
          if-no-files-found: error
