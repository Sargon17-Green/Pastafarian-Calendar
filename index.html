  <style>
    :root {
      color-scheme: light;
      --ink: #17130e;
      --paper: #f4f0e7;
      --paper-deep: #e7dfcf;
      --accent: #9d3825;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 6%, rgba(157, 56, 37, .12), transparent 30rem),
        radial-gradient(circle at 86% 18%, rgba(23, 19, 14, .055), transparent 36rem),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
    }

    pastafari-date {
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
      }
    }

    @media print {
      html,
      body {
        background: #fff;
      }
    }
  </style>
